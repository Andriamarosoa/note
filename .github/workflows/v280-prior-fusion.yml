name: V28 frozen prior fusion on second internal split

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'scripts/train_v280_prior_fusion.py'
      - 'test/test_v280_prior_fusion.py'
      - 'analysis/v280-prior-fusion-protocol.md'
      - '.github/workflows/v280-prior-fusion.yml'
      - '.github/workflows/v280-prior-fusion-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v280-nested-outer-training
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  prepare:
    name: Verify discovery, frozen decoder and validation isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - name: Verify exact completed G discovery and F cache sources
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const sources = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.train_v280_prior_fusion import G_SOURCE,g; print(json.dumps([G_SOURCE,g.SOURCE]))'
            ], {encoding:'utf8'}));
            const repo = {owner:context.repo.owner, repo:context.repo.repo};
            for (const source of sources) {
              const {data:run} = await github.rest.actions.getWorkflowRun({...repo,run_id:source.run_id});
              if (run.status !== 'completed' || run.conclusion !== 'success'
                  || run.head_sha !== source.head_sha || run.run_attempt !== source.run_attempt) {
                throw new Error('Incomplete or changed source run');
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {...repo,run_id:source.run_id,per_page:100});
              const expected = source.artifacts || {[source.artifact]: {id:source.artifact_id,digest:source.digest}};
              for (const [name, record] of Object.entries(expected)) {
                const matches = artifacts.filter(a => a.name === name && !a.expired);
                if (matches.length !== 1 || matches[0].id !== record.id || matches[0].digest !== record.digest) {
                  throw new Error('Missing or changed source artifact: '+name);
                }
              }
            }
      - name: Test prior correction, paired training and no validation until freeze
        run: |
          python -m unittest -v \
            test.test_v280_prior_fusion \
            test.test_v280_balanced_internal \
            test.test_v280_nested_outer \
            test.test_v280_internal_ablation \
            test.test_v280_real_smoke \
            test.test_v280_harmonic_count \
            test.test_v280_causal_cqt_mining
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-prepared-all
          repository: Andriamarosoa/note
          run-id: '34462604665'
          github-token: ${{ github.token }}
          path: model/v280-h-prepared
      - uses: actions/download-artifact@v4
        with:
          name: v280-g-internal-comparison
          repository: Andriamarosoa/note
          run-id: '34684806334'
          github-token: ${{ github.token }}
          path: model/v280-h-g-source/comparison
      - uses: actions/download-artifact@v4
        with:
          name: v280-g-control-2
          repository: Andriamarosoa/note
          run-id: '34684806334'
          github-token: ${{ github.token }}
          path: model/v280-h-g-source/control
      - uses: actions/download-artifact@v4
        with:
          name: v280-g-balanced-2
          repository: Andriamarosoa/note
          run-id: '34684806334'
          github-token: ${{ github.token }}
          path: model/v280-h-g-source/balanced
      - name: Reproduce all nine discovery candidates and freeze the new split
        run: |
          python -B scripts/train_v280_prior_fusion.py audit-g \
            --prepared-dir model/v280-h-prepared \
            --input-dir model/v280-h-g-source \
            --output-dir model/v280-h-audit
          python -B scripts/train_v280_prior_fusion.py preflight \
            --prepared-dir model/v280-h-prepared \
            --output model/v280-h-audit/preflight.json
          cat model/v280-h-audit/discovery.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v280-h-preparation-audit
          path: model/v280-h-audit
          if-no-files-found: error
          retention-days: 90

  control:
    name: Fresh uniform model, fixed 2 epochs
    needs: prepare
    uses: ./.github/workflows/v280-prior-fusion-worker.yml
    with:
      arm: control
  balanced:
    name: Fresh balanced model, fixed 2 epochs
    needs: control
    uses: ./.github/workflows/v280-prior-fusion-worker.yml
    with:
      arm: balanced

  evaluate:
    name: Freeze both models then evaluate fold 2 once
    needs: balanced
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-prepared-all
          repository: Andriamarosoa/note
          run-id: '34462604665'
          github-token: ${{ github.token }}
          path: model/v280-h-prepared
      - uses: actions/download-artifact@v4
        with:
          name: v280-h-control
          path: model/v280-h-models/control
      - uses: actions/download-artifact@v4
        with:
          name: v280-h-balanced
          path: model/v280-h-models/balanced
      - name: Evaluate the frozen three decisions without retuning
        run: |
          python -B scripts/train_v280_prior_fusion.py evaluate \
            --prepared-dir model/v280-h-prepared \
            --input-dir model/v280-h-models \
            --output-dir model/v280-h-comparison
          cat model/v280-h-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v280-h-internal-comparison
          path: model/v280-h-comparison
          if-no-files-found: error
          retention-days: 90
