name: S200 original pinned S5 and S4 owned trained tree active 527D column census
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s200_original_s4_s5_527D_split_coverage.py'
      - '.github/workflows/v273-s200-original-s4-s5-527-tree-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s200-original-s4s5-527d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_checkpoint_feature_usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Matched original HistGradientBoosting feature traversal versions
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Schema-only smoke test
        run: python -m scripts.s200_original_s4_s5_527D_split_coverage --self-test
      - name: Restore PINNED original S4 16 and S5 4 trained tree checkpoints without modifications
        run: |
          set -euo pipefail
          mkdir -p model/S200/original
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
             analysis/evidence/v273-open-k0-k6/series4/models \
             analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/S200/original
      - name: Audit exact 416D owned split feature usage without building or fitting anything
        run: |
          python -u -m scripts.s200_original_s4_s5_527D_split_coverage \
            --models model/S200/original/analysis/evidence/v273-open-k0-k6 --out model/S200/audit/report.json
          python - <<'PY'
          import json
          d=json.load(open('model/S200/audit/report.json'))
          assert d['original_S5_model_count']==4
          assert d['original_S4_owned_model_count']==6
          assert len(d['missing_original_S4_owned_models'])==2
          assert d['S5_owned_suffix_416_active_columns']>0
          assert not d['original_527D_numeric_feature_constructor_recovered']
          assert not d['historical_truth_or_MIDI_read']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s200-original-4S5-8S4-owned-pinned-split-527D-416D-structural-census
          path: model/S200/audit/
          retention-days: 90
