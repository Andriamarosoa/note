name: S573 prospective five piano 49-pitch acoustic onset features at all V88 K0-K6 frozen source times PREMIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s573_fourth_cohort_source49_11_features_no_midi.py
      - .github/workflows/v273-s573-fourth-49pitch-MIDI-blind.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_unseen_piano_prelabeled_49_pitch_acoustic_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install raw 49-note and harmonic source features
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2
      - name: Test raw spectral feature ABI without MIDI
        run: |
          python -m py_compile scripts/s573_fourth_cohort_source49_11_features_no_midi.py
          python -m scripts.s573_fourth_cohort_source49_11_features_no_midi --self-test
      - name: Restore SHA-pinned preselected five new composer names and original V88 event predictions
        run: |
          gh run download 38670092733 -n s570-fourth-five-new-source-names-exclude23-previous-composer-components-NO-AUDIO-MIDI -D model/S570 --repo "${{ github.repository }}"
          gh run download 38670185242 -n s571-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S571 --repo "${{ github.repository }}"
          gh run download 38670258232 -n s572-next-five-S570-BasicPitch-original-pitch-names-PREMIDI -D model/S572 --repo "${{ github.repository }}"
      - name: Verify source whole WAV SHA from S571 and extract original all V88 K0 note physics without opening MIDI
        run: |
          python -u -m scripts.s573_fourth_cohort_source49_11_features_no_midi \
            --manifest model/S570/report.json \
            --v88 model/S571/S571_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S571/report.json \
            --bp model/S572/S572_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --bp-report model/S572/report.json --out model/S573
          python - <<'PY'
          import json
          r=json.load(open('model/S573/report.json'))
          assert r['status']=='S573_PRELABEL_FIVE_NEW_PIANO_ALL_V88_RAW_49_PITCH_FEATURES'
          assert len(r['per_recording'])==5
          assert r['original_V88_onset_candidates']>0
          assert r['real_audio_piano_five_source_WAV_SHAs_verified']
          assert r['all_49_pitch_features_at_every_piano_V88_event']
          assert r['no_original_true_MIDI_annotation_read'] and r['no_promotion']
          print('S573 SUCCESS five composer 49x11 acoustic NOTE_ON pitch features preMIDI sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s573-next-five-S570-composers-V88-raw49-pitch-PREMIDI
          path: model/S573/
          retention-days: 90
