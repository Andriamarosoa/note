name: S635 common audio, pitches and strict onset metric verification
on:
  push:
    branches: [codex/s634-midi-live-transport]
    paths:
      - src/causal_note/s635_shared_midi_metric.py
      - scripts/s635_shared_note_midi_compare.py
      - test/test_s635_shared_midi_metric.py
      - .github/workflows/v273-s635-common-midi-note-benchmark.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  common_protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify same-audio gate, range-matching, one-to-one causal MIDI comparison
        run: |
          python -m unittest -v test.test_s635_shared_midi_metric
          python -m compileall -q scripts/s635_shared_note_midi_compare.py src/causal_note/s635_shared_midi_metric.py
