name: S681 S672 S675 single-hop trained NoteOff Windows smoke
on:
  push:
    branches: [codex/note-s681-s675-live-trial]
    paths:
      - scripts/live_strict_notes.py
      - test/test_s680_s672_live_trial.py
      - test/test_s681_s675_live_cli.py
      - .github/workflows/note-s681-single-hop-noteoff-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: note-s681-single-hop-real-checkpoint
  cancel-in-progress: true
jobs:
  trained_single_hop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pythonpath: .:src
          - os: windows-2022
            pythonpath: .;src
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ matrix.pythonpath }}
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned strict causal NOTE dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify model/batching tests
        run: python -m unittest -v test.test_s630_batched_live test.test_s680_s672_live_trial test.test_s681_s675_live_cli
      - name: Download previously validated S675 training artifact without retraining
        shell: bash
        run: |
          mkdir -p s681_model
          gh run download 39056766998 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir s681_model
          test -f s681_model/s675_hazard.joblib
          test -f s681_model/s675_checkpoint.json
      - name: Generate exact same mono 44.1kHz PCM test audio
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np,wave
          sr=44100
          t=np.arange(sr*2,dtype=np.float64)/sr
          y=np.zeros(len(t),np.float64)
          mask=(t>=.3)&(t<1.55)
          y[mask]=.18*np.sin(2*np.pi*110*t[mask])
          with wave.open('s681_same_input.wav','wb') as f:
              f.setnchannels(1);f.setsampwidth(2);f.setframerate(sr)
              f.writeframes(np.asarray(y*32767,np.int16).tobytes())
          PY
      - name: Verify real trained model with one and four hops, no future or missing Native NoteOns
        shell: bash
        run: |
          python -m scripts.live_strict_notes --wav s681_same_input.wav --hop-size 256 --block-size 256 --inference-batch-hops 1 --out s681_native_1.jsonl
          python -m scripts.live_strict_notes --wav s681_same_input.wav --hop-size 256 --block-size 256 --inference-batch-hops 1 --s675-hazard-model s681_model/s675_hazard.joblib --out s681_experimental_1.jsonl
          python -m scripts.live_strict_notes --wav s681_same_input.wav --hop-size 256 --block-size 256 --inference-batch-hops 4 --s675-hazard-model s681_model/s675_hazard.joblib --out s681_experimental_4.jsonl
          python - <<'PY'
          import json
          def read(path):
              return [json.loads(x) for x in open(path,encoding='utf8')]
          original=read('s681_native_1.jsonl')
          single=read('s681_experimental_1.jsonl')
          four=read('s681_experimental_4.jsonl')
          on=lambda events:[(e['pitch'],e['decision_sample']) for e in events if e['type']=='note_on']
          assert on(original)==on(single)==on(four), 'Experimental heads changed frozen NoteOns'
          assert all(e['available_sample']>=e['decision_sample'] for e in single+four),'Backdated audio event'
          print('PASS S681 real trained hazard; native NoteOn parity batch 1 and batch 4. NoteOns=',len(on(single)))
          PY
