name: S819 three actual NVIDIA reviews and six local audits
on:
  push:
    branches: [codex/note-s819-independent-model-review]
    paths:
      - scripts/s819_blind_nvidia.py
      - scripts/s819_six_checks.py
      - scripts/s819_review_consensus.py
      - test/test_s819_blind_nvidia.py
      - series/S819/model_brief.md
      - .github/workflows/note-s819-blind-nvidia.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Smoke-neutral-evidence-and-six-report-contract
        run: |
          python -m compileall -q scripts/s819_blind_nvidia.py scripts/s819_six_checks.py scripts/s819_review_consensus.py test/test_s819_blind_nvidia.py
          python -m unittest -v test.test_s819_blind_nvidia
          python -m scripts.verify_series_reports --series S819
          python - <<'PY'
          from pathlib import Path
          from scripts.s819_blind_nvidia import evidence_text,hash_text,SYSTEM,MODELS
          evidence=evidence_text(Path('series/S819/model_brief.md'))
          assert len(MODELS)==len(set(MODELS.values()))==3
          print('S819_IDENTICAL_EVIDENCE_SHA',hash_text(evidence))
          print('S819_IDENTICAL_PROMPT_SHA',hash_text(SYSTEM))
          PY
  models:
    needs: smoke
    name: NVIDIA REAL independent ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        role: [model_a, model_b, model_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Call the real NVIDIA endpoint using one existing GitHub secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -m scripts.s819_blind_nvidia --role ${{ matrix.role }} --evidence series/S819/model_brief.md --out /tmp/s819/reviews/review_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S819_NVIDIA_${{ matrix.role }}_REAL_OR_PROVIDER_FAILURE
          path: /tmp/s819/reviews/review_${{ matrix.role }}.json
          retention-days: 45
          if-no-files-found: warn
  checks:
    needs: smoke
    name: LOCAL six independent code audits ${{ matrix.role }} NOT Work agents
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Independently verify source and data contract
        run: |
          python -m scripts.s819_six_checks --role ${{ matrix.role }} --evidence series/S819/model_brief.md --out /tmp/s819/checks/check_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S819_LOCAL_${{ matrix.role }}_AUDIT
          path: /tmp/s819/checks/check_${{ matrix.role }}.json
          retention-days: 45
          if-no-files-found: warn
  consensus:
    if: always()
    needs: [smoke, models, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S819_NVIDIA_*_REAL_OR_PROVIDER_FAILURE
          path: /tmp/s819/reviews
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: S819_LOCAL_*_AUDIT
          path: /tmp/s819/checks
          merge-multiple: true
      - name: Reject provider failures or incomplete independent audits
        run: |
          python -m scripts.s819_review_consensus --evidence series/S819/model_brief.md --reviews-dir /tmp/s819/reviews --checks-dir /tmp/s819/checks --out /tmp/s819/triage/consensus.json
      - name: Print each independently returned review for skeptical assessment
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for role in ['model_a','model_b','model_c']:
              data=json.loads((Path('/tmp/s819/reviews')/('review_'+role+'.json')).read_text())
              print('S819_NVIDIA_UNVERIFIED_OPINION',role,data['model'],data['response_sha256'],flush=True)
              print(data['response'][:9000],flush=True)
              print('END_S819_MODEL',role,flush=True)
          print('NVIDIA_RESPONSES_ARE_ONLY_HYPOTHESES_NOT_PERFORMANCE',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S819_THREE_REAL_NVIDIA_SIX_LOCAL_CONSENSUS
          path: |
            /tmp/s819/triage/consensus.json
            /tmp/s819/reviews/review_*.json
            /tmp/s819/checks/check_*.json
          retention-days: 45
          if-no-files-found: warn
