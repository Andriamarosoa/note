name: S504 connect note head selections to original class-conditional neural Exact-K selector contract, no training
on:
  push:
    branches: [codex/s502-note-heads-selections]
    paths:
      - scripts/s504_note_heads_to_existing_neural_Kselector_contract.py
      - .github/workflows/v273-s504-existing-neural-Kselector-note-head-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  existing_exaxtK_neural_selector_input_shape_real_notes_contract_no_fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical adapter ABI without new neural model training
        run: python -m pip install numpy==1.26.4
      - name: Test exact existing class-conditional neural selector shapes with masked heads
        run: |
          python -m py_compile scripts/s504_note_heads_to_existing_neural_Kselector_contract.py
          python -m scripts.s504_note_heads_to_existing_neural_Kselector_contract --self-test
      - name: Restore real S502 source head selections predating all XML/MIDI labels
        run: |
          gh run download 38594382211 \
            -n s502-original-S80-V88-thirteen-real-note-heads-class-conditional-selections-PREXML \
            -D model/S502 --repo "${{ github.repository }}"
      - name: Validate trainable NN interface and no expert activation without held-song audits
        run: |
          python -u -m scripts.s504_note_heads_to_existing_neural_Kselector_contract \
            --inp model/S502 --report model/S502/report.json --out model/S504
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S504/report.json'))
          assert d['status']=='S504_ORIGINAL_EXACTK_CLASSCONDITIONAL_NN_NOTE_HEAD_ADAPTER_NO_FIT'
          assert d['compatible_with_existing_Head_K_mask_attention_contract']
          assert d['absence_of_crossfit_training_audits_is_explicit_and_prevents_fitting']
          assert not d['requires_new_held_song_real_note_events_for_selector_fit'] is False
          assert d['not_a_trained_note_classifier'] and d['no_promotion']
          for name in ('guitar_S80','piano_V88'):
            a=np.load('model/S504/S504_'+name+'_NEURAL_CLASS_CONDITIONAL_INPUT_ONLY_NOT_FITTED.npz')
            assert a['head_logits'].shape[1:]==(13,8)
            assert a['head_k_mask'].shape[1:]==(13,7)
            assert a['context'].shape[1]==16
            assert not a['training_only_audit_ready'].any()
          print('S504 original learned selector can accept new note specialist heads; no trained selection or production change')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s504-classconditional-neural-selector-note-heads-compatible-no-OOF-fit
          path: model/S504/
          retention-days: 90
