name: S471 true MAESTRO piano note-on onset and conditional V88 K audit AFTER S470 freeze
on:
  push:
    branches: [codex/s471-maestro-third-piano-onset-truth]
    paths:
      - scripts/s471_independent_MAESTRO_MIDI_postfrozen_real_V88_K_audit.py
      - .github/workflows/v273-s471-independent-MAESTRO-MIDI-postfreeze.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s471-postfreeze-third-source-piano-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_original_MAESTRO_piano_note_labels_after_audio_predictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only MIDI decoder and independent max one-to-one matching packages
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test 20ms genuine piano note onset groups and 80ms one-to-one pairing
        run: |
          python -m py_compile scripts/s471_independent_MAESTRO_MIDI_postfrozen_real_V88_K_audit.py
          python -m scripts.s471_independent_MAESTRO_MIDI_postfrozen_real_V88_K_audit --self-test
      - name: Restore exact S470 original pretrained V88 frozen WAV-only outputs from different instrument
        run: |
          gh run download 38559067956 \
            -n s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI \
            -D model/S470 --repo ${{ github.repository }}
      - name: Restore official metadata-only prospective third-source test selection
        run: |
          gh run download 38558629021 \
            -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI \
            -D model/S469 --repo ${{ github.repository }}
      - name: AFTER sealed audio prediction SHA verification read exactly three paired MIDI files and score genuine attacks
        run: |
          python -u -m scripts.s471_independent_MAESTRO_MIDI_postfrozen_real_V88_K_audit \
            --freeze model/S470/S470_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --freeze-report model/S470/report.json \
            --manifest model/S469/report.json \
            --out model/S471
          python - <<'PY'
          import json
          r=json.load(open('model/S471/report.json'))
          assert r['status']=='S471_EXTERNAL_THIRD_REAL_MAESTRO_PIANO_V88_MIDI_POSTFREEZE'
          assert r['original_MIDI_only_read_AFTER_S470_SHA_verified']
          assert r['original_S80_complete_chain_NOT_RUN']
          assert r['do_not_compare_V88_as_S80']
          assert r['cohort_sums']['native']==575
          assert r['cohort_sums']['nativeK0']==473
          assert r['cohort_sums']['midi_groups']>0
          assert r['no_promotion']
          print('S471 real independent piano audio MIDI postfreeze test passed and not confused with full S80')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze
          path: model/S471/
          retention-days: 90
