name: S448 real guitar MIC audio to musical notes S446 K locked without labels
on:
  push:
    branches: [codex/s448-s446-real-mic-transfer]
    paths:
      - 'scripts/s448_frozen_s446_real_MIC_note_names.py'
      - '.github/workflows/v273-s448-real-guitar-MIC-S446-pitch-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s448-real-mic-frozen-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  predict_original_12_real_MIC_songheld_notes_without_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original note-net dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Self-test real note names and K0/K2 cardinality
        run: |
          python -m py_compile scripts/s448_frozen_s446_real_MIC_note_names.py
          python -m scripts.s448_frozen_s446_real_MIC_note_names --self-test
      - name: Restore S437 original 174 frozen MIC note outputs, NO labels
        run: |
          gh run download 38523251921 -n s437-twelve-real-guitar-MIC-K-balanced-frozen-note-names-no-truth -D model/S437 --repo ${{ github.repository }}
          test -f model/S437/report.json
      - name: Restore S446 fixed K conditioned pitch models and original held song S416 heads
        run: |
          gh run download 38381449092 -n s416-native-CNN-time-pitch-note-head-songheld-S80-ExactK-LOCKED-NO-YourMT -D model/S416 --repo ${{ github.repository }}
          gh run download 38528232276 -n s446-joint-chord-learned-songheld-Klocked-guitarset-dev-NOPROMOTION -D model/S446 --repo ${{ github.repository }}
          test -f model/S446/report.json
          test -f model/S446/S446_joint_note_swap_fold0.joblib
      - name: Fetch exact ORIGINAL real guitar MIC audio without annotation
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 4 -o data/GuitarSet/audio_mono-mic.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/audio_mono-mic.zip
          echo '275966d6610ac34999b58426beb119c3  data/GuitarSet/audio_mono-mic.zip' | md5sum -c -
      - name: Freeze S446 musical note sets for the real 174 MIC sound events before truth evaluation
        run: |
          python -u -m scripts.s448_frozen_s446_real_MIC_note_names \
            --frozen-names model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl \
            --s437-report model/S437/report.json \
            --mic-zip data/GuitarSet/audio_mono-mic.zip \
            --s416-models model/S416 \
            --s446-models model/S446 \
            --s446-report model/S446/report.json \
            --out model/S448
          python - <<'PY'
          import json
          d=json.load(open('model/S448/report.json'))
          assert d['status']=='S448_S446_CROSSFIT_REAL_GUITAR_MIC_WAV_NOTE_NAMES_FROZEN'
          assert d['n_events']==174 and d['original_predicted_K_total']==340
          assert d['source_S80_original_K_unchanged'] and d['exactK_regressions']==0
          assert d['no_truth_or_original_JAMS_loaded'] and d['no_training_or_retuning']
          assert d['original_12_MIC_compositions'] and d['composition_held_fold_models']
          assert d['no_promotion'] and d['S438_scores_previously_known_retrospective_diagnostic']
          print('S448 real MIC guitar new note names frozen before JAMS; original S80 K unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s448-authentic-12-MIC-s446-note-sets-frozen-NO-ANNOTATION
          path: model/S448/
          retention-days: 90
