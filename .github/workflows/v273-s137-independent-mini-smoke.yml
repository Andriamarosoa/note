name: S137 sealed external GOAT Exact-K smoke of S135 new student (NOT S80)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s137_external_s135_smoke.py'
      - '.github/workflows/v273-s137-independent-mini-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s137-independent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s137_external_s135_smoke --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/s85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/s135
      - name: SEALED prediction, no MIDI or truth accessible
        run: |
          set -euo pipefail
          S97="$(find model/s97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/s85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/s135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -m scripts.s137_external_s135_smoke seal \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" --out model/sealed
          python - <<'PY'
          import json
          s=json.load(open('model/sealed/seal.json'))
          assert s['no_midi_read'] and not s['true_K_scored'] and not s['promotion']
          assert s['events']==57
          print('SEALED',s['prediction_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v273-s137-sealed-before-truth-s135-new-student
          path: model/sealed/
          retention-days: 90
  score:
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 mido==1.3.3
      - uses: actions/download-artifact@v4
        with:
          name: v273-s137-sealed-before-truth-s135-new-student
          path: model/sealed
      - name: ONLY AFTER prediction seal, retrieve pinned GOAT MIDI source
        run: |
          set -euo pipefail
          mkdir -p model/midi
          base="https://raw.githubusercontent.com/JackJamesLoth/GOAT-Dataset/55c6e6668ef4546e4635c5e7eaad3062cf7f036b/audio-examples"
          for n in 1 2; do
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 180 \
              "$base/example$n/example$n.mid" -o "model/midi/example$n.mid"
          done
      - name: Compute preregistered true K0-K6 and paired regressions
        run: |
          set -euo pipefail
          python -m scripts.s137_external_s135_smoke score \
            --predictions model/sealed/predictions_before_labels.npz \
            --manifest model/sealed/seal.json \
            --midi-root model/midi --out model/scored
          python - <<'PY'
          import json
          d=json.load(open('model/scored/report.json'))
          assert not d['original_S80_tested'] and not d['official_reference_promoted']
          assert d['overall']['events']==57
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s137-real-paired-GOAT-K-smoke
          path: model/scored/
          retention-days: 90
