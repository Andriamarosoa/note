name: S845 neural raw waveform preservation PCM256
on:
  push:
    branches: [codex/note-s845-raw-wave-acoustic-decoder256]
    paths:
      - '.github/workflows/note-s845-real-hex-train.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s845-real-hex-training
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  genuine_hex_supervision:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real six-string training CPU dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm S844 isolated changes and freeze other six NOTE axes
        run: |
          git fetch origin f5b82d620e72db706e7ed64bae9d5d567a8c82f7 --depth=1
          git diff --name-only FETCH_HEAD HEAD > /tmp/s845_changes.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/s845_changes.txt').read_text().splitlines())
          permitted={
              'src/onset256/real_audio_transpose_head256.py',
              'tests/test_s845_raw_waveform_acoustic256.py',
              'series/S845/resume.md',
              'series/S845/resultat.md',
              '.github/workflows/note-s845-real-hex-train.yml',
          }
          assert changed and changed<=permitted,changed-permitted
          print('S845_NO_OFFICIAL_MIDI_OR_ANY_SIX_NOTE_AXIS_CHANGED')
          PY
      - name: Confirm S843 unit checks and frozen legacy MIDI
        run: |
          python -m unittest discover -s tests -p 'test_s843_real_audio_transpose_head256.py' -v
          python -m unittest discover -s tests -p 'test_s844_real_hex_rare_note_audit256.py' -v
          python -m unittest discover -s tests -p 'test_s845_raw_waveform_acoustic256.py' -v
          python -m compileall -q src/onset256/real_audio_transpose_head256.py scripts/s843_train_real_hex_transpose256.py scripts/s843_evaluate_real_hex_reconstruction256.py
      - name: Download original simultaneous GuitarSet microphone, six-string pickup and annotations
        run: |
          df -h .
          mkdir -p /tmp/s845_originals
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())['guitar_archives']
          Path('/tmp/s845_originals/original_sources.json').write_text(json.dumps(spec,indent=2))
          print('GUITARSET_REAL_ARCHIVE_SOURCES',list(spec),flush=True)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('/tmp/s845_originals/original_sources.json').read_text())
          root=Path('/tmp/s845_originals')
          (root/'download_list.tsv').write_text(
              str(root/'audio_mono-mic.zip')+'\t'+spec['GuitarSet_audio']['url']+'\n'+
              str(root/'annotation.zip')+'\t'+spec['GuitarSet_annotations']['url']+'\n'+
              str(root/'audio_hex-pickup_debleeded.zip')+'\t'+
              'https://zenodo.org/records/3371780/files/audio_hex-pickup_debleeded.zip?download=1'+'\n')
          PY
          while IFS="$(printf '\t')" read -r destination url; do
            echo "DOWNLOADING_AUTHENTIC_GUITARSET_ARCHIVE $(basename "$destination")"
            curl --location --fail --retry 4 --retry-delay 8 --connect-timeout 45 --max-time 6000 --output "$destination" "$url"
            test -s "$destination"
          done < /tmp/s845_originals/download_list.tsv
          python - <<'PY'
          from scripts.s843_train_real_hex_transpose256 import authenticate
          from pathlib import Path
          root=Path('/tmp/s845_originals')
          checks=authenticate(root/'audio_mono-mic.zip',
                              root/'audio_hex-pickup_debleeded.zip',
                              root/'annotation.zip')
          print('S843_ALL_THREE_ORIGINAL_WAV_ARCHIVES_AUTHENTICATED',checks,flush=True)
          PY
      - name: Extract signed same-take real mono and six-string hex 256 samples
        run: |
          python -m scripts.s843_train_real_hex_transpose256 --phase prepare --mic-zip /tmp/s845_originals/audio_mono-mic.zip --hex-zip /tmp/s845_originals/audio_hex-pickup_debleeded.zip --annotation-zip /tmp/s845_originals/annotation.zip --data /tmp/s845_dataset --max-tracks-per-player 16
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('/tmp/s845_dataset/provenance.json').read_text())
          assert src['source_hashes']['hex_clean_md5']=='c31d97279464c9a67e640cb9061fb0c6'
          assert set(src['split_tracks'])=={'train','cal','outer'}
          print('S845_VERIFIED_REAL_AUDIO_SOURCE_AND_PLAYER_SPLITS',
                {k:len(v['tracks']) for k,v in src['split_tracks'].items()},
                flush=True)
          PY
      - name: Train six-channel neural real audio reconstruction and ±12 learned transport
        run: |
          python -m scripts.s843_train_real_hex_transpose256 --phase train --data /tmp/s845_dataset --out /tmp/s845_trained --epochs 8
      - name: Evaluate real measured string waveforms and E2 E3, no Onset F1 conflation
        run: |
          python -m scripts.s843_evaluate_real_hex_reconstruction256 --model /tmp/s845_trained/s843_real_hex_neural.pt --data /tmp/s845_dataset --out /tmp/s845_evaluation
      - name: Preserve genuine source signatures and trained shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S845_GENUINE_HEX_RAW_WAVEFORM_NEURAL_PCM256
          path: |
            /tmp/s845_dataset/provenance.json
            /tmp/s845_trained/train_result.json
            /tmp/s845_trained/s843_real_hex_neural.pt
            /tmp/s845_evaluation/evaluation.json
          if-no-files-found: warn
          retention-days: 60
