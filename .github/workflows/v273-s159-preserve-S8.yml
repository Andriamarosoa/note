name: S159 preserve original S8 trained weights and source-only S157 S158 proof
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - '.github/workflows/v273-s159-preserve-S8.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: s159-S8-immutable-preservation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37851172129
          name: v273-series7-learned-risk
          path: original/S8
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38196167459
          name: v273-s157-original-S8-learned-checkpoints-exact-S9-rule-GOAT-no-MIDI
          path: evidence/S157
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38196307750
          name: v273-s158-no-duplicate-S8-S9-to-S154-parent-parity
          path: evidence/S158
      - name: Verify original S8 checkpoints and explicit label-free zero-drift downstream proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          original=Path('original/S8/models')
          originals=list(original.glob('*__votes__C0.3.joblib'))
          assert len(originals)==19,len(originals)
          s157=json.loads(Path('evidence/S157/report.json').read_text())
          s158=json.loads(Path('evidence/S158/report.json').read_text())
          assert s157['original_trained_S8_models_executed']==19
          assert s157['S9_changed_from_prior_PR16_22_adapter']==0
          assert s158['native_events']==57
          assert s158['new_original_S8_S9_vs_S153_existing_parent_mismatches']==0
          assert s158['new_original_S8_S9_vs_S154_existing_parent_mismatches']==0
          assert not s157['historically_equivalent_to_original_S9']
          assert not s158['original_S5_global_poly_heads_used']
          assert not s157['promoted'] and not s158['S80_promoted']
          print('S159 PASS S8 original 19 checkpoints and new GOAT label-free parity')
          PY
      - name: Preserve model checkpoints source checksums and proof
        run: |
          set -euo pipefail
          mkdir -p model/s159
          find original evidence -type f -print0 | sort -z | xargs -0 sha256sum > model/s159/FILES_SHA256SUMS
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf model/s159/v273-S8-original-weights-S157-S158-evidence.tar.gz original evidence
          (cd model/s159 && sha256sum v273-S8-original-weights-S157-S158-evidence.tar.gz > BUNDLE_SHA256)
      - name: Permanent prerelease for original frozen weights and label-blind proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v273-original-S8-weights-S157-S158-GOAT-proof'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Already preserved, refusing overwrite'
            exit 1
          fi
          gh release create "$TAG" \
            model/s159/v273-S8-original-weights-S157-S158-evidence.tar.gz \
            model/s159/BUNDLE_SHA256 model/s159/FILES_SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'S8 original 19 learned gate checkpoints + no label GOAT S157/S158 57-event proof' \
            --notes 'Authentic S8 model weights and exact original S9 posthoc formula, but S5 global/poly source inputs are not original. 0 differences on 57 GOAT rows vs S153/S154 adapted parents. Research-only; never a true Exact-K or S80 promotion.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s159-original-S8-weight-preservation-receipt
          path: |
            model/s159/BUNDLE_SHA256
            model/s159/FILES_SHA256SUMS
          retention-days: 30
