name: S613 autonomous causal NOTE Live
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - 'src/causal_note/strict_live.py'
      - 'scripts/live_strict_notes.py'
      - 'scripts/s613*'
      - 'scripts/s614*'
      - 'scripts/note_runtime.py'
      - 'model/live/strict_note/**'
      - 'analysis/evidence/v273-s613-strict-live/**'
      - 'test/test_strict_live.py'
      - '.github/workflows/v273-s613-strict-native-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s613-native-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  causal_native_audio_to_notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native CPU runtime
        run: python -m pip install -r requirements-live-strict.txt
      - name: Causality, bounded state, selection, MIDI lifecycle, PCM framing
        run: |
          python -m unittest -v test.test_strict_live
          python -m scripts.note_runtime --mode strict-live --status
      - name: Real GuitarSet PCM fixture, without annotations
        run: python -m scripts.s611_fetch_native_fixture --out data/S613/real_guitar.wav
      - name: Real audio future mutation, rechunking and protected-original hashes
        run: python -m scripts.s613_validate_strict_live --wav data/S613/real_guitar.wav --out logs/S613
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s613-autonomous-causal-native-live-validation
          path: logs/S613/
          retention-days: 90
