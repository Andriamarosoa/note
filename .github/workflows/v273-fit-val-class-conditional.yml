name: V27.3 FIT VAL Class Conditional Shift
on:
  push:
    branches: [codex/v273-failure-clustering]
    paths: ['analysis/v273-fit-val-class-conditional-launch.json']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  TAG: v273-fit-val-class-conditional-${{ github.run_id }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - run: python -m py_compile scripts/audit_v273_fit_val_class_conditional_shift.py
      - name: Verify and extract archived evidence
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('analysis/evidence/v273-feature-family-nested')
          manifest=json.loads((root/'checksums.json').read_text())
          for name,digest in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          out=pathlib.Path('model/evidence');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(root/'evidence.zip') as z:
              z.extractall(out)
          assert (out/'inputs.npz').exists()
          PY
      - run: python -B scripts/audit_v273_fit_val_class_conditional_shift.py --inputs model/evidence/inputs.npz --output model/result
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "V27.3 FIT VAL class-conditional shift" --notes-file model/result/report.md
          gh release upload "$TAG" model/result/report.json model/result/report.md --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with: {name: v273-fit-val-class-conditional-results, path: model/result/, retention-days: 90}
