name: S208 explain S46 cross-fold differences from S18 parents
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s208_s46_parent_divergence_attribution.py'
      - '.github/workflows/v273-s208-s46-parent-decomposition.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s208-parent-divergence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit_decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38237264206
          name: s206-all-19-branches-16-s45-193-s46-not-promotion
          path: model/S206
      - name: Count upstream and decision-gate causes with zero annotations
        run: python -m scripts.s208_s46_parent_divergence_attribution --s206 model/S206 --out model/S208
      - name: Strict immutable S80 non-promotion and 904-cell evidence audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path('model/S208/report.json').read_text())
          assert a['unstable_event_policy_cells']==904
          assert (a['explained_by_four_parent_outputs_without_S46_changes']+
                  a['unstable_cells_with_some_S46_gate_change']==904)
          assert a['each_fold_gate_action_cells']==[8,58,146,192]
          assert not a['promoted'] and not a['independent_accuracy_measured']
          print('S208 PASS: 904 exact divergent cells attributed without labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s208-s46-parent-vs-gates-no-promotion
          path: model/S208/
          retention-days: 90
