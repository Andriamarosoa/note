name: S403 reusable K-first neural MIDI head on S80 source audio (no labels)
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s403_runtime_K_first_MIDI_notes_on_new_S80_audio.py'
      - '.github/workflows/v273-s403-K-first-MIDI-inference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s403-K-first-MIDI-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen_S402_note_models_runtime_without_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Prove K enters all neural note inputs via synthetic inference
        run: |
          python -m py_compile scripts/s402_k_input_first_supervised_midi_pitch_network.py scripts/s403_runtime_K_first_MIDI_notes_on_new_S80_audio.py
          python -u -m scripts.s403_runtime_K_first_MIDI_notes_on_new_S80_audio --self-test
      - name: Restore 4 frozen composition-held S402 MIDI network checkpoints
        run: |
          gh run download 38361853607 -n s402-K-fed-to-MIDI-neural-input-composition-disjoint-4fold-DEVELOPMENT-NOPROMOTION -D model/S402trained --repo ${{ github.repository }}
          find model/S402trained -maxdepth 2 -type f | head -20
          test -f model/S402trained/S402_pitch_head_held_song_fold0.joblib
          test -f model/S402trained/S402_pitch_head_held_song_fold3.joblib
      - name: Restore original label-free acoustic source and S80 guarded cardinality outputs
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397artifact --repo ${{ github.repository }}
      - name: Test full native batch inference with trained K-first models and no annotations
        run: |
          python -u -m scripts.s403_runtime_K_first_MIDI_notes_on_new_S80_audio \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397artifact/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --models model/S402trained \
            --out model/S403
          python - <<'PY'
          import json
          a=json.load(open('model/S403/report.json'))
          assert a['status']=='S403_FROZEN_S402_K_FIRST_MIDI_NEURAL_RUNTIME'
          assert a['n_events']==59309 and a['S80_K_at_model_INPUT']
          assert a['no_ground_truth_loaded'] and a['no_fit_or_tuning_during_runtime']
          assert a['source_reference_S80_untouched']
          print('S403 PASS: 59309 MIDI note groups inferred with K at network input, no labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s403-K-first-4MLP-notes-59309-original-acoustic-S80-output-NO-LABELS
          path: |
            model/S403/notes.csv
            model/S403/S403_S80_K_CONDITIONED_note_predictions.npz
            model/S403/report.json
          retention-days: 90
