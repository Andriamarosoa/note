name: V27.3 S38 new nonlinear K1 K6 harmonic-morphology expert
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series38-poly-specialist.yml'
      - 'scripts/train_v273_s38_poly_harmonic_expert.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and nonlinear acoustic-learning libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Selftest K1 K6 and immutable S18 preservation
        run: python -m scripts.train_v273_s38_poly_harmonic_expert --self-test
      - name: Recover four original acoustic trajectories including 42x49 morphology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio-tars
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio-tars
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/audio-tars/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Recover unchanged S18 for cross-fold paired reporting
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Train K1 to K6 spectrogram-morphology expert on three folds evaluate fourth
        run: >-
          python -m scripts.train_v273_s38_poly_harmonic_expert
          --features model/features
          --s18 model/S18/predictions.npz
          --output model/S38
      - name: Publish standalone poly K2 K6 performance and paired regression scoreboard
        run: cat model/S38/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series38-poly-harmonic-expert
          path: model/S38/
          retention-days: 90
