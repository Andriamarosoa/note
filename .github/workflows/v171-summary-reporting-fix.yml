name: V17.1 post-hoc causal summary fix

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - .github/workflows/v171-summary-reporting-fix.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN: '33803473673'

jobs:
  summarize:
    name: Summarize existing V17.1 causal A/B artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy<2.0'
      - name: Download existing controlled folds
        uses: actions/download-artifact@v4
        with:
          pattern: v171-controlled-*-fold-*
          path: model/v171-controlled
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Aggregate causal A/B
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p model/v171-summary-fix
          python -B scripts/summarize_v171_controlled_assignment_ab.py --input-dir model/v171-controlled --output-dir model/v171-summary-fix | tee model/v171-summary-fix/summary.log
      - name: Verify causal aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v171-summary-fix/report.json').read_text())
          p=r['protocol']
          assert p['causal_assignment_ab'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_rows_both_arms'] is True
          assert p['v16_proposal_graph_unchanged'] is True
          assert p['same_seed'] == 16061
          assert p['same_threshold'] == 0.5
          assert p['same_fit_fold_only_symmetric_presence_weighting'] is True
          assert p['locked12_indexed_or_evaluated'] is False
          print(json.dumps(r['comparison'], indent=2, sort_keys=True))
          PY
      - name: Upload corrected causal summary
        uses: actions/upload-artifact@v4
        with:
          name: v171-controlled-assignment-summary-fixed
          path: model/v171-summary-fix
          retention-days: 30
