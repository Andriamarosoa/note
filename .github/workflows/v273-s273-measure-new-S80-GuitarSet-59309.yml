name: S273 GuitarSet 59309 measured new S80 versus historical 43.87 poly score
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s273_measure_new_S80_GuitarSet_59309.py'
      - '.github/workflows/v273-s273-measure-new-S80-GuitarSet-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s273-measure-59k-new-S80-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exactK_true_orig_dev_with_train_overlap_not_independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Require successful FULL real S80 S5-to-S80 counterfactual on 59k native GuitarSet
        run: gh run watch 38314291222 --exit-status --interval 15
      - name: Restore candidate, original old held-piece OOF S80, exact immutable true native GuitarSet K labels
        run: |
          gh run download 38314291222 -n s272-guitarset-59309-new-full-original-weight-S80-foldneutral-locked -D model/S272
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/oldS80
      - name: MEASURE paired exact K0-K6 all 59309, poly K2-K6 true 7385, per K and corrections/regressions versus historic 43.87 OOF
        run: |
          python -u -m scripts.s273_measure_new_S80_GuitarSet_59309 \
            --source model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --candidate model/S272/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --old model/oldS80/predictions.npz \
            --out model/S273
          python - <<'PY'
          import json
          r=json.load(open('model/S273/report.json'))
          assert r['native_events']==59309 and r['true_polyphonic_events']==7385
          assert r['exactK_polyphonic_trueK2to6']['old_S80_historical_correct']==3240
          assert r['exactK_polyphonic_trueK2to6']['new_S80_foldneutral_correct']>=0
          assert r['new_candidate_score_not_pure_out_of_fold']
          assert r['original_training_data_seen_by_three_nonheldfold_models']
          assert not r['S80_promoted'] and not r['independent_promotion_gate_satisfied']
          print('S273 FULL RECONSTRUCTED S80 GuitarSet Exact-K K2-K6 score actually measured against old 3240/7385; in-sample diagnostic, not independent')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s273-actual-new-S80-GuitarSet-59309-vs-historical-43p87-scored
          path: model/S273/
          retention-days: 90
