name: S373 strict original GuitarSet fold-heldout EARLY K3 acoustic expert, NO IDMT labels
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s373_train_early_K3_expert_GuitarSet_fold_OOF.py'
      - '.github/workflows/v273-s373-train-original-GuitarSet-K3-expert-OOf.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s373-original-GuitarSet-only-early-K3-specialist
  cancel-in-progress: true
jobs:
  fourfold_GuitarSet_train_only_original_K2K3_audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Require S372 NEW future 8 candidates name-only SHA sealed before any trained expert DEV audit
        run: |
          gh run watch 38334876066 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38334876066 \
            -n s372-prospective-last8-original-IDMT-Dataset1-WAV-XML-NAMES-UNOPENED \
            -D model/S372 --repo ${{ github.repository }}
          python - <<'PY'
          import json
          a=json.load(open('model/S372/report.json'))
          assert len(a['final_eight'])==8 and not a['all_XML_annotation_contents_read']
          assert not a['all_WAV_contents_read']
          print('S373 future 8 external sources reserved, not touched in GuitarSet training')
          PY
      - name: Restore untouched ORIGINAL native GuitarSet 59309 source and separate truth, not any IDMT
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311525987
          name: s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16
          path: model/S258
      - name: Restore ORIGINAL trained S8 through S18 133 historical source model outputs on 59309 GuitarSet rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311814895
          name: s260-guitarset-59309-true-original-S5-S18-fourfold-133-checkpoints
          path: model/S260
      - name: Train four ORIGINAL heldfold GuitarSet K3 experts each, fixed low104 vs expanded1133 views; emit strictly OOF development audit
        run: |
          python -u -m scripts.s373_train_early_K3_expert_GuitarSet_fold_OOF \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --s18 model/S260/S260_original_S5_to_S18_true_V88_native_GUITARSET_59309.npz \
            --out model/S373
          python - <<'PY'
          import json, pathlib
          j=json.load(open('model/S373/report.json'))
          assert j['status']=='S373_EARLY_K3_AUDIO_DISCRIMINATOR_GUITARSET_FOLDS_ONLY'
          assert j['training_only_GUITARSET_59309_NO_IDMT_AUDIO_OR_XML']
          assert not j['full_S80_deployment_not_yet_tested'] is False
          assert j['fixed_P3_threshold']==0.8
          assert set(j['trained_variants'])=={'base104','expanded1133'}
          for key in j['trained_variants']:
            z=j['trained_variants'][key]
            assert len(z['folds'])==4 and all(f['source_member_overlap_remaining']==0 for f in z['folds'])
            assert len(list(pathlib.Path('model/S373').glob(key+'_trained_without_original_fold*.joblib')))==4
          assert not j['official_S80_promotion']
          print('S373 PASS eight trained source-only GuitarSet experts and fourfold heldfold OOF, zero IDMT labels used')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s373-fourfold-GuitarSet-only-K3-104D-vs-1133D-experts-fixed80pct-NO-IDMT
          path: model/S373/
          retention-days: 90
