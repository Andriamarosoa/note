name: S377 compile original all 20 S80 historical source stages to eight WAV 255 frozen original V88 events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s377_compile_original_S80_20_stages_for_last8_sha_V88.py'
      - '.github/workflows/v273-s377-original-8WAV-S80-source-ABI-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s377-original-8WAV-255-source-all-checkpoint-modules
  cancel-in-progress: true
jobs:
  audit_source20_original_checkpoint_stage_ABI:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore already-original-pretrained and SHA locked eight original V88 predictions without ANY XML
        run: |
          gh run download 38335062261 \
            -n s374-last8-IDMT-source-only-true-original-V88-official-PREXML \
            -D model/S374 --repo ${{ github.repository }}
      - name: Rebase only source original 20 model executable stage wrappers, unchanged checkpoint topology
        run: |
          python -u -m scripts.s377_compile_original_S80_20_stages_for_last8_sha_V88 \
            --s374 model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz \
            --report model/S374/report.json \
            --source scripts --out model/S377
          python - <<'PY'
          import json
          a=json.load(open('model/S377/generation_report.json'))
          assert a['original_native_events']==255 and a['original_source_WAV_count']==8
          assert len(a['archive_members'])==20 and a['all_20_original_modules_compile']
          assert not a['real_external_XML_read'] and not a['original_trained_models_refit'] and not a['official_promotion']
          print('S377 PASS all original code sources compiled to 255 native prelabel original IDMT event IDs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s377-20-genuine-original-S5-to-S80-modules-on-255-last8-WAVs-ABIs-PREXML
          path: model/S377/
          retention-days: 90
