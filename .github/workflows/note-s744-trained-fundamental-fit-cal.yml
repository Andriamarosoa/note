name: S744 FIT-trained independent fundamental specialists 8 CAL loops
on:
  push:
    branches: [codex/note-s744-fit-trained-activek-birth-specialist]
    paths:
      - src/causal_note/s744_birth_specialist.py
      - scripts/s744_train_fit_birth_loops.py
      - test/test_s744_birth_specialist.py
      - .github/workflows/note-s744-trained-fundamental-fit-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s744-trained-activek-specialist
  cancel-in-progress: true
jobs:
  fit80_trained_specialist_cal32_8loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original S708/S707 runtime and PyTorch CPU
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test the FIT-trained multihead causal specialist
        run: |
          python -m compileall -q src/causal_note/s744_birth_specialist.py scripts/s744_train_fit_birth_loops.py
          python -m unittest -v test.test_s744_birth_specialist test.test_s743_fundamental_router test.test_s742_soft_activek_decoder
      - name: Download original signed S708 H5 and S707 offsets
        run: |
          mkdir -p /tmp/s744/s708 /tmp/s744/s707 /tmp/s744/s734
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s744/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s744/s707
          gh run download 39137653526 --repo "Andriamarosoa/note" --name S734_ONSET_INDIVIDUAL_NEURAL_EXACTK_LINKED_FIT_CAL_HELD_DEV --dir /tmp/s744/s734
          test -s /tmp/s744/s708/report.json
          test -s /tmp/s744/s708/s708_selected.pt
          test -s /tmp/s744/s707/s675_hazard.joblib
          test -s /tmp/s744/s734/report.json
          test -s /tmp/s744/s734/s733_onset.pt
      - name: FIT80 training of two specialists and eight real MIDI CAL32 loops
        run: |
          python -m scripts.s744_train_fit_birth_loops --s708-dir /tmp/s744/s708 --s734-checkpoint /tmp/s744/s734/s733_onset.pt --s734-report /tmp/s744/s734/report.json --offset-checkpoint /tmp/s744/s707/s675_hazard.joblib --out /tmp/s744/output
      - name: Guard original S708 reference, 6 metrics, and original LIVE
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s744/output/report.json'))
          assert r['completed'] and r['loops']==8 and len(r['CAL'])==8
          assert r['selected']=='S708_frozen' and not r['promoted']
          assert not r['LIVE_changed'] and not r['TEST_opened']
          assert r['training']=='FIT80 only'
          for name,v in r['CAL'].items():
              assert len(v['scores'])==6 and len(v['delta'])==6
              assert not v['six_gt80'] or v['safe']
          print('S744_EIGHT_CAL32_LOOP_RESULTS',json.dumps({
              'reference_scores':r['reference_scores'],
              'candidate':r.get('CAL_candidate'),
              'FIT':r['FIT'],
              'trials':r['CAL']}))
          PY
      - name: Retain FIT model and real full MIDI CAL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S744_FIT80_TRAINED_SPECIALISTS_8_REAL_ACTIVEK_CAL_LOOPS
          path: |
            /tmp/s744/output/report.json
            /tmp/s744/output/s744_depth*.joblib
          retention-days: 45
          if-no-files-found: warn
