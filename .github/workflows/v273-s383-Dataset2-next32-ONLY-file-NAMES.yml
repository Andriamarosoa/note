name: S383 preserve NEW 32 unused IDMT Dataset2 WAV+XML names-only before any K2 K3 audio scoring
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s383_new32_IDMT_dataset2_unseen_songs_presize_names_only.py'
      - '.github/workflows/v273-s383-Dataset2-next32-ONLY-file-NAMES.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s383-prospective-new32-dataset2-filename-only
  cancel-in-progress: true
jobs:
  sha_seal_32_unexposed_WAV_XML_NAMES_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Reuse exact original pinned official ZIP name-only source S276, exclude prior 48+16 exposed files
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          python -u -m scripts.s383_new32_IDMT_dataset2_unseen_songs_presize_names_only \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S383
          python - <<'PY'
          import json
          r=json.load(open('model/S383/report.json'))
          assert r['status']=='S383_NEW32_PROSPECTIVE_DATASET2_NAMES_ONLY_SOURCE_UNOPENED'
          assert r['previously_exposed_dataset2_WAV_count']==64
          assert len(r['untouched_new_32'])==32
          assert r['previous_48_exposed_explicit_SHA_excluded']
          assert r['previous_16_exposed_original_S302_S327_SHA_excluded']
          assert not r['new_XML_contents_read'] and not r['new_WAV_audio_read']
          assert not r['official_promotion']
          print('S383 PASS 32 precommitted NEW Dataset2 source WAV+XML names with all original 64 exposed excluded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s383-32-more-Dataset2-original-SHA-WAV-XML-NAMES-NEVER-READ
          path: model/S383/
          retention-days: 90
