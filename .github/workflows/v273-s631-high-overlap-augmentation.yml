name: S631 high-register real PCM overlap ablation
on:
  push:
    branches: [codex/s631-high-overlap-augmentation]
    paths:
      - scripts/s631_high_overlap_augmentation.py
      - test/test_s631_high_overlap.py
      - .github/workflows/v273-s631-high-overlap-augmentation.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s631-high-overlap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pure_unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact NOTE live dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify synthetic PCM labels and causal NOTE ABI
        run: |
          python -m compileall -q scripts/s631_high_overlap_augmentation.py test/test_s631_high_overlap.py
          python -m unittest -v test.test_s631_high_overlap test.test_s627_joint_heads
  real_pcm_ab_train_dev:
    needs: pure_unit_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original native NOTE environment
        run: python -m pip install -r requirements-live-strict.txt
      - name: Install CPU training runtime only
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Paired 35-original versus 35-plus-48 real PCM overlays
        run: python -m scripts.s631_high_overlap_augmentation --out /tmp/S631 --epochs 8 --mixes 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S631-high-true-audio-overlap-paired-DEV
          path: /tmp/S631/
          if-no-files-found: warn
          retention-days: 60
