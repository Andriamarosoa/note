name: S572 prospective five new composer Basic Pitch prelabel MIDI notes from sealed WAV only
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s572_fourth_cohort_basicpitch_no_midi.py
      - .github/workflows/v273-s572-fourth-BP-MIDI-blind.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_new_composers_original_SPOTIFY_BP_note_output:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen independent Basic Pitch model and inference ABI
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Check exact E3-G3-B3 MIDI pitch names without MIDI
        run: |
          python -m py_compile scripts/s572_fourth_cohort_basicpitch_no_midi.py
          python -m scripts.s572_fourth_cohort_basicpitch_no_midi --self-test
      - name: Verify preregistration and original source V88 five-composer WAV proof
        run: |
          gh run download 38670092733 -n s570-fourth-five-new-source-names-exclude23-previous-composer-components-NO-AUDIO-MIDI -D model/S570 --repo "${{ github.repository }}"
          gh run download 38670185242 -n s571-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S571 --repo "${{ github.repository }}"
      - name: Run fixed unmodified Basic Pitch note predictor on the same SHA-frozen five new piano WAVs
        run: |
          python -u -m scripts.s572_fourth_cohort_basicpitch_no_midi \
            --manifest model/S570/report.json --s571 model/S571/report.json --out model/S572
          python - <<'PY'
          import json
          r=json.load(open('model/S572/report.json'))
          assert r['status']=='S572_PRETRAINED_BASIC_PITCH_NOTE_EVENTS_ON_THIRD_SOURCE_MAESTRO_PREMIDI'
          assert r['prediction_windows_piano']==5
          assert r['original_WAV_content_SHA_verified']
          assert not r['original_MAESTRO_MIDI_ANNOTATIONS_OPENED']
          assert r['S570_new_composers_before_WAV_MIDI']
          assert r['no_promotion']
          print('S572 PASS five independent composer source Basic Pitch NOTE_NAME predictions frozen BEFORE MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s572-next-five-S570-BasicPitch-original-pitch-names-PREMIDI
          path: model/S572/
          retention-days: 90
