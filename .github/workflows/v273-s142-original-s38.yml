name: S142 original S38 morph825 ExtraTrees on new GOAT audio (research only)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s142_external_original_s38.py'
      - '.github/workflows/v273-s142-original-s38.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s142-original-S38-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s142_external_original_s38 --self-test
      - name: Original 16 S38 pretrained fold×view×algorithm checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880386031
          name: v273-series38-poly-harmonic-expert
          path: model/s38
      - name: True native GOAT S97 real audio flow and morphology
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - name: Frozen baseline plus original PR16 policy22, aligned native events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/s85
      - name: New GOAT S135 K-only parent adapter (NOT S18 equivalent)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/s135
      - name: Infer real original S38 morphology models on new WAV-derived inputs without MIDI
        run: |
          set -euo pipefail
          S97="$(find model/s97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/s85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/s135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -m scripts.s142_external_original_s38 \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s38 model/s38 --out model/s142
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/s142/report.json'))
          assert r['GOAT_events']==57 and len(r['source_checkpoints'])==4
          assert r['original_S38_weights_unchanged']
          assert not r['original_S18_S45_source_equivalent'] and not r['promotion']
          with np.load('model/s142/s38_original_morph825_real_GOAT_unlabeled.npz',allow_pickle=False) as z:
              assert z['fold_probabilities'].shape==(4,57,7)
              assert z['adapted_K1plus_K'].shape==(57,)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s142-original-S38-morph825-fold0-1-2-4-new-GOAT-adapted
          path: model/s142/
          retention-days: 90
