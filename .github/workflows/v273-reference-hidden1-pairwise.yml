name: V27.3 Reference Hidden1 Pairwise Confirmation
on:
  push:
    branches: [codex/v273-failure-clustering]
    paths: ['analysis/v273-reference-hidden1-pairwise-launch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v273-reference-hidden1-pairwise
  cancel-in-progress: false
env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-reference-hidden1-pairwise-${{ github.run_id }}
jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {a: 0, b: 1, label: 0-1}
          - {a: 0, b: 2, label: 0-2}
          - {a: 0, b: 4, label: 0-4}
          - {a: 1, b: 2, label: 1-2}
          - {a: 1, b: 4, label: 1-4}
          - {a: 2, b: 4, label: 2-4}
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - run: python -m py_compile scripts/train_v273_reference_hidden1_pair_checkpoint.py
      - name: Restore shared bundle
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p model/download model/bundle
          gh release download v273-window-pair-36351028493 --repo "${{ github.repository }}" --pattern native-window-bundle.zip --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
      - name: Train unique two-fold checkpoint
        run: |
          python -B scripts/train_v273_reference_hidden1_pair_checkpoint.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --fold-a "${{ matrix.a }}"             --fold-b "${{ matrix.b }}"             --output "model/pair-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-reference-hidden1-pair-${{ matrix.label }}
          path: model/pair-${{ matrix.label }}/
          retention-days: 90
  summarize:
    needs: pair
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-reference-hidden1-pair-*
          path: model/pairs
      - name: Restore bundle and three-fold outer checkpoints
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p model/download model/bundle model/outer
          gh release download v273-window-pair-36351028493 --repo "${{ github.repository }}" --pattern native-window-bundle.zip --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          gh release download v273-candidate-hidden1-multifold-37271262794 --repo "${{ github.repository }}" --pattern v273-candidate-hidden1-multifold-folds.tgz --dir model/download
          tar -xzf model/download/v273-candidate-hidden1-multifold-folds.tgz -C model/outer
      - run: |
          python -B scripts/summarize_v273_reference_hidden1_pairwise_confirmation.py             --pair-root model/pairs             --outer-root model/outer             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --output model/summary
      - name: Publish confirmation
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tar -czf model/v273-reference-hidden1-pairwise-results.tgz -C model/pairs .
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "V27.3 hidden1 pairwise nested confirmation" --notes-file model/summary/report.md
          gh release upload "$TAG" model/summary/report.json model/summary/report.md model/v273-reference-hidden1-pairwise-results.tgz --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-reference-hidden1-pairwise-summary
          path: model/summary/
          retention-days: 90
