name: 'S832 risk-controlled local ExactK proposals PCM256 with CAL-only gate'
on:
  push:
    branches: [codex/note-s832-guarded-local256]
    paths:
      - src/causal_note/s832_guarded_private_selector256.py
      - scripts/s832_fit80_guarded_local256.py
      - test/test_s832_guarded_local256.py
      - series/S832/resume.md
      - series/S832/resultat.md
      - .github/workflows/note-s832-guarded-local256.yml
  workflow_dispatch:
concurrency:
  group: s832-native256-EXACTK-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read, actions: read}
env:
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Frozen S831 base and protected five other axes
        run: |
          git fetch origin codex/note-s831-audit-corrections256 --depth=1
          git diff --name-only FETCH_HEAD HEAD | tee /tmp/s832_changed_paths.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/s832_changed_paths.txt').read_text().splitlines())
          expected={
            'src/causal_note/s832_guarded_private_selector256.py',
            'scripts/s832_fit80_guarded_local256.py',
            'test/test_s832_guarded_local256.py',
            'series/S832/resume.md','series/S832/resultat.md',
            '.github/workflows/note-s832-guarded-local256.yml'}
          assert changed and changed <= expected,changed-expected
          print('S832_PROTECTED_FIVE_AXES_UNTOUCHED')
          PY
      - name: Independent S832 scientific dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scikit-learn threadpoolctl
      - name: Test S832 local veto and preserve causal fitted 256
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('src/causal_note/s832_guarded_private_selector256.py')
          root=ast.parse(p.read_text())
          all_imports=[]
          for node in ast.walk(root):
              if isinstance(node,ast.Import):
                  all_imports.extend(alias.name for alias in node.names)
              elif isinstance(node,ast.ImportFrom):
                  all_imports.append(node.module or '')
          banned=('s708','s809_isolated_axis_pipeline','s810',
                  's812','s827','s828','s795','live_strict_notes',
                  's763_independent_decoders')
          assert not any(any(word in n for word in banned) for n in all_imports),all_imports
          print('S832_NO_OTHER_AXIS_CODE_OR_CHECKPOINT_IMPORTED')
          p=Path('scripts/s832_fit80_guarded_local256.py')
          root=ast.parse(p.read_text())
          for node in ast.walk(root):
              if isinstance(node,ast.Import):
                  all_imports.extend(alias.name for alias in node.names)
              elif isinstance(node,ast.ImportFrom):
                  all_imports.append(node.module or '')
          forbidden=banned+('s814','s815','s813_prepare_native256')
          assert not any(any(word in n for word in forbidden) for n in all_imports),all_imports
          print('S832_EVALUATION_SCORERS_ALSO_INDEPENDENT')
          PY
          python -m compileall -q src/causal_note/s832_guarded_private_selector256.py scripts/s832_fit80_guarded_local256.py test/test_s832_guarded_local256.py
          python -m unittest -v test.test_s832_guarded_local256
          python -m scripts.verify_series_reports --series S832

  signed_fit80:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-fit80]')"
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent 5-head evidence dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scikit-learn threadpoolctl
      - name: Only signed S800 FIT80 GT and H0 for scoring
        run: |
          mkdir -p /tmp/s832/manifest /tmp/s832/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s832/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s832/traces
          META="$(find /tmp/s832/manifest -name report.json -type f -print -quit)"
          FIT="$(find /tmp/s832/traces -name fit_000.json -type f -print -quit)"
          test -s "$META" && test -s "$FIT"
          printf '%s\n' "$META" > /tmp/s832/manifest_path
          printf '%s\n' "$(dirname "$FIT")" > /tmp/s832/traces_dir
      - name: Download authentic original GuitarSet PCM signed SHA256
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          cfg=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          item=cfg['guitar_archives']['GuitarSet_audio']
          dst=Path('/tmp/s832/GuitarSet_audio.zip')
          with urllib.request.urlopen(item['url'],timeout=180) as src,dst.open('wb') as w:
              for block in iter(lambda:src.read(4*1024*1024),b''):w.write(block)
          assert dst.stat().st_size==item['size']
          h=hashlib.sha256()
          with dst.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024),b''):h.update(block)
          assert h.hexdigest()==item['sha256']
          print('S832_GUITARSET_AUDIO_SHA256_PASS')
          PY
      - name: S832 five private fitted heads plus calibrated local veto 80 FIT tracks
        run: |
          python -m scripts.s832_fit80_guarded_local256 \
            --audio-zip /tmp/s832/GuitarSet_audio.zip \
            --traces "$(cat /tmp/s832/traces_dir)" \
            --manifest-path "$(cat /tmp/s832/manifest_path)" \
            --out /tmp/s832/result --tracks-per-composition 16
      - name: Validate S832 track-heldout CAL gates and paired OOF 80 tracks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s832/result/report.json').read_text())
          assert r['complete'] and len(r['tracks'])==80 and len(r['folds'])==5
          assert r['feature_hop_samples']==r['decision_hop_samples']==256
          assert r['H0_original_exactk']['frames']==r['S829_reproduced_exactk']['frames']==r['S832_exactk']['frames']==306536
          assert r['independent_acoustics'] and r['private_trained_heads']==5
          assert not r['shared_checkpoint_loaded'] and not r['any_other_axis_as_model_input']
          assert r['S829_reproduced_exactk']['frames']==306536
          assert not r['public_midi_modified'] and not r['other_five_axes_modified']
          assert not r['promoted'] and not r['external_generalization_verified']
          assert not any(r[x] for x in ('CAL_opened','HELD_opened','TEST_opened'))
          for outer,fold in r['folds'].items():
              assert outer not in fold['train_compositions'] and outer != fold['calibration']
              assert fold['calibration'] not in fold['train_compositions']
          assert r['S829_reproduced_exactk']['correct']==176334
          for outer,fold in r['folds'].items():
              assert fold['no_outer_labels_in_calibration']
              assert fold['learned_rule_count']>=0
              guard=fold['private_gate']
              assert 'guard_enabled' in guard and 'tried' in guard
              assert guard['rule_count']==fold['learned_rule_count']
          for t in r['tracks']:
              assert set(t['by_true_K'])==set(map(str,range(7)))
              assert set(t['alternative_candidates'])==set(('sustain','router','blend','rescue'))
              g=t['local_guard']
              assert g['changed']>=0 and g['corrected']>=0 and g['regressed']>=0
              assert t['S832']['correct']-t['S829_reproduced']['correct']==g['corrected']-g['regressed']
              assert t['S832']['correct']+t['S832']['undercount']+t['S832']['overcount']==t['S832']['frames']
          print('S832_NATIVE256_EXACTK_K0_K6_SIGNED_FIT80_PASS',r['S832_exactk'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S832_FIT80_GUARDED_LOCAL_PCM256
          path: /tmp/s832/result/report.json
          if-no-files-found: warn
          retention-days: 45
