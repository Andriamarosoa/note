name: V27.3 Freeze Residual Transplant Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-freeze-residual-transplant-launch.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-freeze-residual-transplant-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Validate audit script
        run: python -m py_compile scripts/audit_v273_freeze_residual_transplants.py

      - name: Restore bundle and frozen checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/freeze
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37208199201             --repo "${{ github.repository }}"             --pattern v273-loss-weighting-uniform.tgz             --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          gh release download v273-uniform-anchored-freeze-37233793945             --repo "${{ github.repository }}"             --pattern v273-uniform-anchored-freeze-result.tgz             --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/freeze

          test -f model/uniform/uniform.weights.h5
          test -f model/uniform/predictions.npz
          test -f model/freeze/freeze_local_combo.weights.h5
          test -f model/freeze/predictions.npz

      - name: Run no-training residual transplant audit
        run: |
          python -B scripts/audit_v273_freeze_residual_transplants.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-weights model/uniform/uniform.weights.h5             --freeze-weights model/freeze/freeze_local_combo.weights.h5             --uniform-predictions model/uniform/predictions.npz             --freeze-predictions model/freeze/predictions.npz             --output model/result

      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 freeze residual transplant audit"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-freeze-residual-transplant
          path: model/result/
          retention-days: 90
