name: S812 preserve historical S708 six-axis H0 and independent H1 trials
on:
  push:
    branches: [codex/note-s812-protect-six-native-h0-axes]
    paths:
      - src/causal_note/s812_historical_axis_h0.py
      - scripts/s812_fit80_historical_h0_replay.py
      - test/test_s812_historical_axis_h0.py
      - .github/workflows/note-s812-historical-h0.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install standard offline MIDI scorer dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate private native H0 state and no cross-axes mutation
        run: |
          python -m compileall -q src/causal_note/s812_historical_axis_h0.py scripts/s812_fit80_historical_h0_replay.py test/test_s812_historical_axis_h0.py
          python -m unittest -v test.test_s763_independent_decoders test.test_s809_axis_isolation test.test_s812_historical_axis_h0
          python -m scripts.verify_series_reports --series S812
  fit80:
    needs: smoke
    if: needs.smoke.result == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-fit80]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install signed original-score modules
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download S800 original GuitarSet evidence, no new model training
        run: |
          mkdir -p /tmp/s812/manifest /tmp/s812/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s812/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s812/traces
          test -s /tmp/s812/manifest/replay/report.json
          test -n "$(find /tmp/s812/traces -name fit_000.npz -type f -print -quit)"
      - name: Verify all 80 signed MIDI original tracks, six metric and six axis H0 parity
        run: |
          path="$(find /tmp/s812/traces -name fit_000.npz -type f -print -quit)"
          python -m scripts.s812_fit80_historical_h0_replay \
            --manifest /tmp/s812/manifest/replay/report.json \
            --traces "$(dirname "$path")" \
            --out /tmp/s812/result/report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: S812_GUITARSET_FIT80_H0_SIX_AXIS_BITEXACT_S708_MIDI256
          path: /tmp/s812/result/report.json
          if-no-files-found: error
          retention-days: 45
