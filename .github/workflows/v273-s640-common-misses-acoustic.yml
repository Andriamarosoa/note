name: S640 replay frozen 613 common missed onsets through original S614
on:
  push:
    branches: [codex/s640-common-miss-audit]
    paths:
      - scripts/s640_frozen_common_misses_acoustic_audit.py
      - test/test_s640_common_misses_acoustic.py
      - .github/workflows/v273-s640-common-misses-acoustic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s640-frozen-613-audit
  cancel-in-progress: false
jobs:
  authentic_native_missed_note_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exactly original NOTE native inference requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Recover frozen dual-system WAV-verified actual MIDI emissions
        uses: actions/download-artifact@v4
        with:
          name: S638-twelve-GuitarSet-recordings-real-matched-F1
          run-id: 38811643000
          github-token: ${{ github.token }}
          path: /tmp/S638
      - name: Recover previously frozen list of 613 common misses
        uses: actions/download-artifact@v4
        with:
          name: S639-frozen-full-12-GuitarSet-note-midi-correct-vs-failure-taxonomy
          run-id: 38812452658
          github-token: ${{ github.token }}
          path: /tmp/S639
      - name: Test time windows, origin checkpoint, selection gates and matching
        run: |
          python -m unittest -v test.test_s640_common_misses_acoustic test.test_s639_same_audio_disagreement test.test_s635_shared_midi_metric
      - name: On every original identical GuitarSet waveform, explain missed pitches
        run: |
          python -m scripts.s640_frozen_common_misses_acoustic_audit \
            --s638 /tmp/S638/frozen_inputs_and_emissions.json \
            --s639 /tmp/S639/report.json \
            --out /tmp/S640/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S640-causal-acoustic-613-shared-misses-original-note
          path: /tmp/S640
          if-no-files-found: warn
          retention-days: 60
