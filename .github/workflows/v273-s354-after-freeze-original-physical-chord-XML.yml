name: S354 first postfrozen original and audio-anchored attack Exact-K on 477 heldout IDMT chords
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s354_postfreeze_dataset1_chord_dual_attackK_477.py'
      - '.github/workflows/v273-s354-after-freeze-original-physical-chord-XML.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s354-original-477-chord-XML-FIRST-READ-after-S353-frozen
  cancel-in-progress: true
jobs:
  historical_vs_audio_anchored_postfrozen_chord_exactK:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Validate future dual-protocol scorer code BEFORE reading any XML
        run: |
          python -m py_compile scripts/s354_postfreeze_dataset1_chord_dual_attackK_477.py
          python -m py_compile scripts/s333_prelabel_physical_attack_reference_policy.py
      - name: BLOCK XML opening until both 477 full S80 variants, trained final S79 S80 and official reference have all passed frozen-SHA source gate
        run: gh run watch 38327334843 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Restore original S276 filename-only chord selection, S332 original official freeze and S333 PRELABEL acoustic reference protocol
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
          gh run download 38326698570 \
            -n s333-original-synthetic-validated-physical-attack-XML-reference-PRECHORD-XML \
            -D model/S333 --repo ${{ github.repository }}
      - name: Restore exactly the TWO complete frozen historical S80 candidates from SAME 477 real V88 source rows
        run: |
          gh run download 38327334843 \
            -n chords-477-S349-S353-three-frozen-original-S80-PREXML \
            -D model/S349S353 --repo ${{ github.repository }}
      - name: FIRST read all twelve original XML note annotations ONLY after SHA verification of baseline, both S80 final outputs, and S333 physical target policy
        run: |
          python -u -m scripts.s354_postfreeze_dataset1_chord_dual_attackK_477 \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --s332report model/S332/report.json \
            --s333 model/S333/report.json \
            --s353 model/S349S353/S353/prelabel_comparison.json \
            --old model/S349S353/S352_original/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --new model/S349S353/S352_twofold/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --out model/S354
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S354/report.json'))
          assert r['status']=='S354_FIRST_POSTFROZEN_PROSPECTIVE_DATASET1_CHORDS_ATTACK_EXACTK_DUAL_PROTOCOL'
          assert r['native_V88_events']==477 and r['prospective_WAVs']==12
          assert sum(r['historical_if_XML_complete_truth_histogram'])==477
          assert r['source_predictions_all_frozen_before_XML'] and r['source_models_unchanged']
          assert r['acoustic_anchor_is_NOT_original_historical_K_definition']
          assert not r['XML_note_transcription_exhaustiveness_verified']
          assert not r['negative_K0_truth_independently_certified']
          assert not r['composition_song_disjointness_from_original_training_proven']
          assert not r['official_S80_promotion']
          with np.load('model/S354/S354_postfrozen_477_two_distinct_protocols.npz',allow_pickle=False) as z:
            assert z['row_id'].shape==(477,)
            assert len(z['historical_attack_K_if_XML_complete'])==477
          print('S354 PASS first prospective original training 20ms and acoustic transient peak comparisons; official promotion still not certified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s354-PROSPECTIVE-IDMT-dataset1-12chords-477-postfrozen-historical-plus-acoustic-not-promotion
          path: model/S354/
          retention-days: 90
