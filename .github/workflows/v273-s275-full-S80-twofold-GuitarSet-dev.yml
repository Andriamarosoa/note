name: S275 full S274-gated S69 to S80 replay on GuitarSet, DEV only
on:
  push:
    branches: [codex/s274-s46-twofold-audit]
    paths:
      - 'scripts/s275_s274_s46_counterfactual_adapter.py'
      - 'scripts/s275_compare_full_S80_twofold_GuitarSet.py'
      - '.github/workflows/v273-s275-full-S80-twofold-GuitarSet-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s275-full-s80-twofold-dev
  cancel-in-progress: true
jobs:
  frozen_unlabelled_full_S80:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original recovered inference ABI
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Restore immutable source-only S274 gate, S268 expert bank, PR16, native S97 and genuine original checkpoints
        run: |
          gh run download 38315939252 -n s274-source-only-S46-twofold-candidate-59309 -D model/S274
          gh run download 38314164725 -n s268-GuitarSet-original-S46-193foldneutral-59309 -D model/S268
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
          gh run download 38177948016 -n v273-s69-s46-risk-replay -D model/S69original
          gh run download 38296428889 -n s222-recovered-original-S70-four-fold-checkpoints-exact-history -D model/S222
          gh run download 38296880555 -n s224-original-four-S71-acoustic-risk-checkpoints-historic-exact -D model/S224
          gh run download 38297080728 -n s225-recovered-original-S72-four-temporal-risk-checkpoints -D model/S225
          gh run download 38312084676 -n s262-guitarset-59309-native-real-S97-source -D model/S262source
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/S80historic
      - name: Adapt frozen S274 source without fitting or truth access
        run: |
          python -u -m scripts.s275_s274_s46_counterfactual_adapter \
            --original model/S268/S268_original_193_S46_foldneutral_59309_GUITARSET.npz \
            --stricter model/S274/S274_label_free_S46_twofold_GuitarSet_59309.npz \
            --out model/S275_adapter
      - name: Recompute genuine original S69 rules on stricter proposals
        run: |
          python -u -m scripts.s269_original_S69_fourfold_GuitarSet_59309 \
            --s268 model/S275_adapter/S275_counterfactual_s268_schema_twofold_S46.npz \
            --pr16 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --rules model/S69original/report.json --out model/S275_S69
      - name: Recompute original S70 four frozen checkpoint decisions
        run: |
          python -u -m scripts.s270_original_S70_fourfold_GuitarSet_59309 \
            --s221 model/S275_S69/S269_original_S69_fourfold_rule_consensus_GUITARSET.npz \
            --s85 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --s222 model/S222 --out model/S275_S70
      - name: Recompute original S71 and S72 eight frozen checkpoints
        run: |
          python -u -m scripts.s271_original_S71_S72_GuitarSet_59309 \
            --s69 model/S275_S69/S269_original_S69_fourfold_rule_consensus_GUITARSET.npz \
            --s70 model/S275_S70/S270_original_S70_4fold_no_oracle_GUITARSET.npz \
            --s97 model/S262source/original_GuitarSet_59309_S97.npz \
            --s71 model/S224 --s72 model/S225 --out model/S275_S71
      - name: Recompute original S79 gate and S80 formula with new S46 policy bank
        run: |
          python -u -m scripts.s272_full_new_S80_GuitarSet_59309 \
            --s226 model/S275_S71/S271_original_S71_S72_native_GUITARSET.npz \
            --s219 model/S275_adapter/S275_counterfactual_s268_schema_twofold_S46.npz \
            --s85 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --s97 model/S262source/original_GuitarSet_59309_S97.npz \
            --s80 model/S80historic --out model/S275_S80
          python - <<'PY'
          import json, numpy as np, hashlib
          from pathlib import Path
          p=Path('model/S275_S80/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz')
          with np.load(p,allow_pickle=False) as z:
            assert len(z['row_id'])==59309 and z['s80_K'].shape==(59309,)
          r=json.load(open('model/S275_adapter/source_manifest.json'))
          assert r['this_policy_bank_is_not_original_S268'] and r['labels_or_midi_read'] is False
          print('S275 FROZEN FULL S80 SOURCE-ONLY SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s275-FROZEN-S80-twofold-prelabel-full-native-59309
          path: |
            model/S275_adapter/
            model/S275_S69/
            model/S275_S70/
            model/S275_S71/
            model/S275_S80/
          retention-days: 90

  historical_development_only_scoring:
    needs: frozen_unlabelled_full_S80
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore S275 S80 frozen archive (first job already succeeded)
        uses: actions/download-artifact@v4
        with:
          name: s275-FROZEN-S80-twofold-prelabel-full-native-59309
          path: model/S275_frozen
      - name: Restore original full S272 59k and the immutable GuitarSet truth
        run: |
          gh run download 38314291222 -n s272-guitarset-59309-new-full-original-weight-S80-foldneutral-locked -D model/S272
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
      - name: Paired scoring on original HISTORICAL DEVELOPMENT GuitarSet, NEVER promotion evidence
        run: |
          python -u -m scripts.s275_compare_full_S80_twofold_GuitarSet \
            --original model/S272/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --candidate model/S275_frozen/S275_S80/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --out model/S275_scored
          python - <<'PY'
          import json
          r=json.load(open('model/S275_scored/comparison.json'))
          assert r['global_K0to6']['n']==59309
          assert r['true_poly_K2to6']['n']==7385
          assert not r['official_S80_promoted'] and not r['song_disjoint_independent_validation']
          print('S275 successful fully paired postfrozen DEV-only S80 compared to original S272')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s275-full-S80-twofold-dev-audit-NOT-independent
          path: model/S275_scored/
          retention-days: 90
