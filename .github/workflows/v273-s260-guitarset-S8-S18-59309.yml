name: S260 133 original trained S8 to S18 heads on all 59309 GuitarSet rows all four folds
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s260_original_S8_S18_fourfold_GuitarSet_59309.py'
      - '.github/workflows/v273-s260-guitarset-S8-S18-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s260-original-S8-S18-59309-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_original_133_models_counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original true S8 S18 133 trained model ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Require full four-trained-model original S5 on 59309 events finished
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38311582199 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: Restore full original GuitarSet source audio 58D flow245 geometry and true native positions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311525987
          name: s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16
          path: model/S258
      - name: Restore 4 true historic trained S5 model posteriors on every GuitarSet native event
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311582199
          name: s259-guitarset-59309-full-original-4fold-S5-train-mixed-predictions
          path: model/S259
      - name: Execute 133 original S8 S18 checkpoints with genuine historic fold-specific parent and acoustic, no truth
        run: |
          python -m scripts.s260_original_S8_S18_fourfold_GuitarSet_59309 \
            --s237 model/S259/S259_original_S5_fourfold_59309_original_native_unlabelled.npz \
            --s234 model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s235 model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --cache model/S260checkpoint-cache --out model/S260
      - name: Check 133 original model trained frozen heads fourfold on all 59309 native GuitarSet events
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S260/report.json'))
          assert r['count']==59309 and r['original_risk_checkpoint_count']==133
          assert r['original_decoded_stage_count']==8
          assert not r['independent_ExactK_accuracy_measured']
          with np.load('model/S260/S260_original_S5_to_S18_true_V88_native_GUITARSET_59309.npz') as z:
            assert z['S18_K'].shape==(4,59309)
          print('S260 PASS trained original 133 S8–S18 checkpoint forwards on all original GuitarSet native rows; same-train folds not OOF')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s260-guitarset-59309-true-original-S5-S18-fourfold-133-checkpoints
          path: model/S260/
          retention-days: 90
