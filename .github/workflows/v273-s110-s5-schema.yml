name: S110 original S5 archived 527D matrix recovery audit
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths: ['scripts/s110_original_s5_array_schema.py','.github/workflows/v273-s110-s5-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.3.5
      - name: Restore archived S5 reports/probabilities from tagged commit
        run: |
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 analysis/evidence/v273-open-k0-k6/series5 | tar -x -C model/history
      - name: Inspect SHA-pinned prediction array headers, without labels
        run: python scripts/s110_original_s5_array_schema.py --root model/history/analysis/evidence/v273-open-k0-k6/series5 --out model/s110/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s110-historical-S5-array-metadata
          path: model/s110/report.json
