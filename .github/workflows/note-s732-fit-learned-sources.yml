name: S732 FIT learned auditory sources vs acoustic no-scene control
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - .github/workflows/note-s732-fit-learned-sources.yml
      - src/causal_note/s732_source_discriminator.py
      - scripts/s732_train_auditory_discriminator.py
      - test/test_s732_source_discriminator.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s732-independent-source-discriminator
  cancel-in-progress: true
jobs:
  S732_supervised_source_hypotheses_all_notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned original model and CPU audio dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test causal source grouping, authentic FIT data labels and Exact-K keep-original contract
        run: |
          python -m compileall -q src/causal_note/s732_source_discriminator.py scripts/s732_train_auditory_discriminator.py
          python -m unittest -v test.test_s732_source_discriminator test.test_s731_auditory_scene test.test_s713_metric_contract
      - name: Load signed S708 model and S707 NoteOff hazard policy
        run: |
          mkdir -p /tmp/s732/s708 /tmp/s732/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s732/s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s732/s707
          test -s /tmp/s732/s708/report.json
          test -s /tmp/s732/s708/s708_selected.pt
          test -s /tmp/s732/s707/s675_hazard.joblib
      - name: FIT on 80 genuine sources; learned old-vs-new and no-scene controls; CAL freeze then HELD DEV
        run: |
          python -m scripts.s732_train_auditory_discriminator --s708-dir /tmp/s732/s708 --offset-checkpoint /tmp/s732/s707/s675_hazard.joblib --out /tmp/s732/report
      - name: Verify signed original, no metric regression, no TEST leakage and no silent promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s732/report/report.json'))
          assert not r['promoted'] and not r['LIVE_changed'] and not r['TEST_opened']
          assert len(r['FIT_proof'])==80
          assert set(r['fitted_models'])=={'control','scene'}
          assert len(r['CAL']['scores'])==13 and len(r['CAL']['tracks'])==32
          assert r['CAL']['selected'] in r['CAL']['eligible']
          assert len(r['HELD']['tracks'])==32 and len(r['DEV']['tracks'])==12
          for name,by in r['CAL']['overlap'].items():
              assert by['12']['observed_real_targets']==151
              assert by['19']['observed_real_targets']==67
          print('S732_FIT_SCENE_LEARNING_FINAL',json.dumps(dict(
            selected=r['CAL']['selected'],eligible=r['CAL']['eligible'],
            qualifies=r['shadow_qualifies'],
            CAL_scores={name:{m:round(v[m],5) for m in (
              'onset_f1','exact_k','active_exact_k','offset_accuracy',
              'full_note_f1','frame_pitch_f1')} for name,v in r['CAL']['scores'].items()},
            overlap=r['CAL']['overlap']),sort_keys=True),flush=True)
          PY
      - name: Archive FIT model signatures and CAL/HELD/DEV six-score results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S732_AUDITORY_NEW_SOURCE_FIT_DISC_49_NOTE_K_NO_PROMOTION
          path: /tmp/s732/report/
          if-no-files-found: warn
          retention-days: 45
