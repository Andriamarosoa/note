name: S429 independently audit sound to E3 G3 B3 notes and octave errors K locked
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s429_audit_actual_E3_G3_B3_note_names_59309_S80_Klocked.py'
      - '.github/workflows/v273-s429-independent-note-name-Klocked-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s429-independent-musical-note-names-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_same_GuitarSet_true_notes_pitch_and_harmonic_confusions:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Synthetic E3 G3 B3 and octave confusion tests
        run: |
          python -m py_compile scripts/s429_audit_actual_E3_G3_B3_note_names_59309_S80_Klocked.py
          python -u -m scripts.s429_audit_actual_E3_G3_B3_note_names_59309_S80_Klocked --self-test
      - name: Restore genuine original all-player sound events and S80 original K
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Restore frozen comparison of acoustic trained S428 names against S419 source
        run: |
          gh run download 38383639848 -n s419-native-K-gated-MIDI-head-songheld-S402-S416-no-ExactK-regression -D model/S419 --repo ${{ github.repository }}
          gh run download 38517551029 -n s428-acoustic-harmonic-direct-note-names-S80-ExactK-LOCKED-S419-pair -D model/S428 --repo ${{ github.repository }}
          test -f model/S428/S428_NOTE_NAMES_per_sound_event.jsonl
          test -f model/S428/S428_NOTE_NAMES_S80_K_LOCKED_59309.npz
      - name: Restore original verified annotation for scoring only
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Independently scan 59309 exported E3 note names and compare chord vs S419 by true K
        run: |
          python -u -m scripts.s429_audit_actual_E3_G3_B3_note_names_59309_S80_Klocked \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s419 model/S419/S419_NATIVE_K_PROTECTED_HEAD_GATE_59309.npz \
            --s428 model/S428/S428_NOTE_NAMES_S80_K_LOCKED_59309.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --annotations data/GuitarSet/annotation.zip \
            --notes model/S428/S428_NOTE_NAMES_per_sound_event.jsonl \
            --out model/S429
          python - <<'PY'
          import json
          d=json.load(open('model/S429/report.json'))
          assert d['status']=='S429_INDEPENDENT_MUSICAL_NOTE_NAME_IDENTITY_AUDIT'
          assert d['same_original_S80_K_per_all_59309_events']
          assert d['real_name_rows_checked']==59309
          assert d['exactK_regressions']==0
          assert d['notes_polyphonic']['S419_exact']==2775
          assert d['notes_polyphonic']['S428_exact']==3025
          assert d['polyphonic_detail']['corrections']==345
          assert d['polyphonic_detail']['regressions']==95
          assert d['no_model_training_or_predictions_changed']
          assert d['no_Live_or_NoteOff_change']
          print('S429 INDEPENDENT verified 250 full chord gain, octave diagnostic, zero S80 K regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s429-independent-real-E3-G3-B3-note-names-S428-vs-S419-octave-audit
          path: model/S429/
          retention-days: 90
