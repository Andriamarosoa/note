name: V27.3 S44 replay and preserve per-family correction compromises
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series44-verify-preserve.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Recover verified S43 exact native 910 vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/S43-bundle model/S43 model/S44
          gh release download v273-series43-research-37888008660 --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --dir model/S43-bundle
          tar -xzf model/S43-bundle/v273-series43-all-corrections.tar.gz -C model/S43
          gh run download 37890613101 --repo "$GITHUB_REPOSITORY" --name v273-series44-per-family-compromises --dir model/S44
      - name: Independently replay every masked event and correction regression K0 K6
        run: >-
          python -m scripts.verify_v273_s44_compromises
          --bank model/S43/S43-evidence/S43-audit/all_distinct_native_predictions.npz
          --source model/S44
          --output model/S44-verified
      - name: Publish recorded compromise Pareto and rejected cases
        run: cat model/S44/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series44-independent-replay
          path: model/S44-verified/
          retention-days: 90
      - name: Permanently retain all 320 risks, casewise corrections and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series44-compromises.tar.gz -C model S44 S44-verified
          (cd model/archive && sha256sum v273-series44-compromises.tar.gz > SHA256SUMS)
          gh release create "v273-series44-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series44-compromises.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S44 audited 16 families correction compromises ${GITHUB_RUN_ID}" \
            --notes "320 fixed original-K and cross-family-consensus compromise policies from 16 historically high-correction families, independently reproduced, all class/fold correction/regression counts and every zero-loss failure preserved. S18 unchanged; H9 excluded; exploratory reused cohort."
