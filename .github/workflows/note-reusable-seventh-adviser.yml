name: NOTE reusable NVIDIA seventh scientific audit (PARALLEL)
on:
  workflow_call:
    inputs:
      series:
        description: "S8xx series being scientifically evaluated"
        type: string
        required: true
    secrets:
      NVIDIA_API_KEY:
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
jobs:
  external_adviser:
    name: NVIDIA seventh reviewer (parallel to six independent audits)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify client and safety tests locally (no external calls)
        run: |
          python -m unittest -v test.test_note_seventh_adviser test.test_note_seventh_consensus
          python -m compileall -q scripts/note_seventh_adviser.py scripts/note_seventh_consensus.py
      - name: Call real independent reviewer from GitHub secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SCIENTIFIC_SERIES: ${{ inputs.series }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "NVIDIA_API_KEY secret missing"; exit 1; }
          python -m scripts.note_seventh_adviser             --series "$SCIENTIFIC_SERIES"             --out /tmp/note/seventh/review.json
      - name: Archive independent, non-promotable seventh review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.series }}_SEVENTH_NVIDIA_INDEPENDENT_REVIEW
          path: /tmp/note/seventh/review.json
          if-no-files-found: error
          retention-days: 45
