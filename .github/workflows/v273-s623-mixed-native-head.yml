name: S623 native mixed GuitarSet URMP event head train dev
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s623_mixed_source_event_head.py
      - .github/workflows/v273-s623-mixed-native-head.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s623-mixed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  train_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original NOTE runtime unchanged
        run: python -m pip install -r requirements-live-strict.txt
      - name: Original S614 and event gate invariants
        run: python -m unittest -v test.test_strict_live test.test_s619_event_gate
      - name: Training on 35 train records, evaluation on 17 dev records
        run: python -m scripts.s623_mixed_source_event_head --out /tmp/S623
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S623-mixed-native-attack-event-head-train-dev
          path: /tmp/S623/
          if-no-files-found: warn
          retention-days: 60
