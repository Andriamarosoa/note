name: V27.3 S34 train learnable second-note K1-K2 expert
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series34-k1k2-expert.yml'
      - 'scripts/train_v273_s34_k1k2_expert.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original preprocessing and fixed machine learning libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm per-event K1/K2 model gates never use true K as a runtime condition
        run: python -m scripts.train_v273_s34_k1k2_expert --self-test
      - name: Retrieve original fold-held source acoustic and harmonic-flow features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-audio
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/source-audio
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/source-audio/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Retrieve S18 reference, all S29 routes, strongest acoustic S31 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37865173636 --repo "$GITHUB_REPOSITORY" --name v273-series29-stepwise-scheduler --dir model/S29
          gh run download 37866124959 --repo "$GITHUB_REPOSITORY" --name v273-series31-acoustic-flow --dir model/S31
      - name: Fit specialized K1 versus K2 acoustic head excluding each evaluated musical piece
        run: >-
          python -m scripts.train_v273_s34_k1k2_expert
          --features model/features
          --s18 model/S18/predictions.npz
          --s29 model/S29/predictions.npz
          --s31 model/S31/predictions.npz
          --output model/S34
      - name: Publish all 24 specialist ablations, K0-K6 corrections and losses
        run: cat model/S34/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series34-k1k2-specialist
          path: model/S34/
          retention-days: 90
