name: S227 execute original S79 K1 trained models and S80 K0 K2 full tail on new WAV
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s227_original_S79_S80_final_tail_new_WAV.py'
      - '.github/workflows/v273-s227-S79-S80-full-inference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s227-original-S79-S80-GOAT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full_s80_source_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original saved K1 model environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Verify exact original S80 K0 K2 source-tail selftest
        run: python -m scripts.s147_s80_tail_runtime --self-test
      - name: Original trained-model S71 S72 GOAT source chain
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38297421600
          name: s226-original-S71-S72-frozen-models-new-WAV-GOAT
          path: model/S226
      - name: Source 19-branch 16 original S45 family 193 frozen S46 specialist policies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294699823
          name: s219-conditional-specialist-S46-19-branch-4fold-candidate
          path: model/S219
      - name: Original 36 PR16 policy votes and 12 neural distributions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - name: Original S80 four saved fold-excluded K1 logistic checkpoints and historical trained thresholds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38187186049
          name: v273-s80-traceable-repair
          path: model/S80historic
      - name: Forward frozen four S79 and original S80 K0 K2 rules, producing one complete 57 event result
        run: |
          set -euo pipefail
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          test -s "$S85"
          test "$(find model/S80historic/models -name 'K1_gate_fold*.joblib' | wc -l)" -eq 4
          python -m scripts.s227_original_S79_S80_final_tail_new_WAV \
            --s226 model/S226/original_S71_S72_new_WAV_foldfree.npz \
            --s219 model/S219/conditional_sparse_193_policy_prediction.npz \
            --s85 "$S85" \
            --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz \
            --s80 model/S80historic --out model/S227
      - name: Verify all actual S80 frozen tail sources and not promoted without independent score
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S227/report.json'))
          assert r['original_native_WAV_events']==57 and r['S79_original_trained_K1_models']==4
          assert r['S80_K0_K2_original_final_formula_exact']
          assert r['original_PR16_predictions']==36 and r['S46_policy_inputs']==193
          assert r['external_accuracy_global'] is None and r['external_accuracy_poly'] is None
          assert not r['truth_MIDI_read'] and not r['song_disjoint_independent_accuracy_measured']
          assert not r['official_promotion']
          with np.load('model/S227/S80_full_experimental_deploy_new_WAV.npz',allow_pickle=False) as z:
              assert z['s80_K'].shape==(57,) and np.isin(z['s80_K'],range(7)).all()
              assert z['K1_by_fold_threshold_action'].shape==(4,57)
              assert len(set(map(str,z['row_id'])))==57
          print('S227 PASS original checkpoints through complete S79/S80 new WAV source chain; still research only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s227-full-experimental-S80-new-WAV-57-unlabeled-not-promotion
          path: model/S227/
          retention-days: 90
