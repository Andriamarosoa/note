name: S500 freeze actual note names selected jointly by Exact-K, harmonic evidence and onset without XML
on:
  push:
    branches: [codex/s500-Kconstrained-actual-note-names]
    paths:
      - scripts/s500_freeze_joint_K_constrained_notes_with_harmonic_evidence.py
      - .github/workflows/v273-s500-joint-ExactK-real-note-names-prelabel.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pretrained_real_note_names_constrained_by_joint_K_prelabel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Verify true note pitch selection and no hallucinated notes if K higher than observed
        run: |
          python -m py_compile scripts/s500_freeze_joint_K_constrained_notes_with_harmonic_evidence.py
          python -m scripts.s500_freeze_joint_K_constrained_notes_with_harmonic_evidence --self-test
      - name: Restore original canonical musical note births and unmodified source K
        run: |
          gh run download 38590187399 -n s498-true-S80-guitar-V88-piano-canonical-unique-musical-note-onset-groups-no-truth -D model/S498 --repo "${{ github.repository }}"
      - name: Restore original guitar and piano externally pretrained notes frozen BEFORE annotation
        run: |
          gh run download 38569589535 -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML -D model/S487 --repo "${{ github.repository }}"
          gh run download 38568724837 -n s485-spotify-basicpitch-3-original-MAESTRO-piano-audio-to-notes-frozen-PREMIDI -D model/S485 --repo "${{ github.repository }}"
      - name: Freeze original K-constrained note pitch names without MIDI or XML ground truth
        run: |
          python -u -m scripts.s500_freeze_joint_K_constrained_notes_with_harmonic_evidence \
            --graph model/S498 --graph-report model/S498/report.json \
            --guitar-notes model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --guitar-report model/S487/report.json \
            --piano-notes model/S485/S485_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --piano-report model/S485/report.json --out model/S500
          python - <<'PY'
          import json
          r=json.load(open('model/S500/report.json'))
          assert r['status']=='S500_TWO_SOURCE_JOINT_EXACTK_CONSTRAINED_REAL_NOTE_NAMES_PRELABEL'
          assert r['minimum_pitch_evidence_not_invented_for_large_K']
          assert r['four_precommitted_decoding_policies_untuned']
          assert r['original_S80_freeze_and_Live_untouched']
          assert r['no_training_no_XML_MIDI_label_access'] and r['no_promotion']
          print('S500 source authenticated joint K and actual E3 G3 B3 note names frozen prior to truth')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s500-joint-count-constrained-harmonic-ranked-pitch-names-original-S80-guitar-V88-piano-PREXML
          path: model/S500/
          retention-days: 90
