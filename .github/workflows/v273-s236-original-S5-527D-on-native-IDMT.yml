name: S236 true 527D S5 inputs from real V88 native IDMT event boundaries
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s236_true_original_S5_527D_on_IDMT_native.py'
      - '.github/workflows/v273-s236-original-S5-527D-on-native-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s236-original527-native-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recover_527_on_original_incumbent_events:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovered original 527D runtime dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Ensure exact native V88 end boundaries match original baseline predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38302495775 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: Restore original S234 acoustic-only original features on real official native events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38302179397
          name: s234-idmt-unseen-original-S97-features-aligned-to-official-freeze-event-IDs
          path: model/S234
      - name: Restore all 1034 original V88 native candidate cluster endpoints with S233 bit identity
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38302495775
          name: s235-original-V88-native-endpoints-sealed-events
          path: model/S235
      - name: Reconstruct recovered exact historical 527D original S5 input with real 46D PR16 ownership
        run: |
          python -m py_compile scripts/s236_true_original_S5_527D_on_IDMT_native.py
          python -m scripts.s236_true_original_S5_527D_on_IDMT_native \
            --s234 model/S234/S234_original_S97_audio_views_on_real_freeze_native_events.npz \
            --s235 model/S235/S235_official_freeze_local_combo_IDMT_new_native_16songs.npz \
            --out model/S236
      - name: Audit every original native IDMT event 527D input and no leakage
        run: |
          python - <<'PY'
          import json,numpy as np,hashlib
          from pathlib import Path
          r=json.loads(Path('model/S236/report.json').read_text())
          assert r['original_native_event_count']==1034 and r['original_input_feature_width']==527
          assert r['original_46D_ownership_geometry']
          assert r['S4_owned416_derived_from_true_V88_geometry']
          assert r['strict_reference_K_and_event_ID_identity_verified']
          assert not r['XML_MIDI_content_read'] and not r['independent_accuracy_measured']
          assert not r['S80_promoted']
          p=Path('model/S236/S236_original_owned527_native_reference_IDMT.npz')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['input_SHA256']
          with np.load(p,allow_pickle=False) as z:
            assert z['original_S5_input_owned527'].shape==(1034,527)
            assert z['original_PR16_geometry46'].shape==(1034,46)
            assert len(set(map(str,z['row_id'])))==1034
            assert (z['end_samples']>=z['start_samples']).all()
          print('S236 PASS canonical original V88 full 527D S5 inputs, models yet to be inferred')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s236-idmt-1034-real-original-V88-geometry46-and-S5-owned527-features
          path: model/S236/
          retention-days: 90
