name: V27.3 Internal B-Low Temporal Onset Features

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-internal-b-low-onset-feature-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-internal-b-low-onset-feature
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-internal-b-low-onset-feature-${{ github.run_id }}

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        val_fold: [0,1,2,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Validate worker
        run: python -m py_compile scripts/audit_v273_internal_b_low_temporal_onset_features.py
      - name: Restore bundle and internal checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/folds
          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-candidate-hidden1-multifold-37271262794 \
            --repo "${{ github.repository }}" \
            --pattern v273-candidate-hidden1-multifold-folds.tgz \
            --dir model/download
          tar -xzf model/download/v273-candidate-hidden1-multifold-folds.tgz -C model/folds

      - name: Run temporal-onset feature audit
        run: |
          python -B scripts/audit_v273_internal_b_low_temporal_onset_features.py \
            --bundle model/bundle \
            --config analysis/v273-native-paired-config.json \
            --fold-root model/folds \
            --val-fold "${{ matrix.val_fold }}" \
            --output "model/result-${{ matrix.val_fold }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-internal-b-low-onset-feature-fold-${{ matrix.val_fold }}
          path: model/result-${{ matrix.val_fold }}/
          retention-days: 90

  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-internal-b-low-onset-feature-fold-*
          path: model/results
      - name: Summarize onset features
        run: |
          python -B scripts/summarize_v273_internal_b_low_temporal_onset_features.py \
            --input-root model/results \
            --output model/summary
      - name: Publish onset feature audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-internal-b-low-onset-feature-results.tgz -C model/results .
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "V27.3 internal B_low temporal onset feature audit" \
            --notes-file model/summary/report.md
          gh release upload "$TAG" \
            model/summary/report.json \
            model/summary/report.md \
            model/v273-internal-b-low-onset-feature-results.tgz \
            --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-internal-b-low-onset-feature-summary
          path: model/summary/
          retention-days: 90
