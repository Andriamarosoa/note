name: S411 full WAV continuous pitch trajectories including K0 for long note Offset
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s411_extract_continuous_GuitarSet_WAV_pitch_survival_features.py'
      - '.github/workflows/v273-s411-continuous-WAV-long-offset-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s411-continuous-guitarset-mic-WAV-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full_continuous_audio_pitch_features_190_tracks:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy SciPy source-only audio STFT
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Verify WAV PCM to 10ms full continuous pitch bank
        run: |
          python -m py_compile scripts/s411_extract_continuous_GuitarSet_WAV_pitch_survival_features.py
          python -u -m scripts.s411_extract_continuous_GuitarSet_WAV_pitch_survival_features --self-test
      - name: Restore frozen 33475 existing S408 note predictions WITHOUT JAMS
        run: |
          gh run download 38371603686 -n s408-real-note-offsets-pitch-conditioned-S80-S402-S407-songheld-NOPROMOTION -D model/S408 --repo ${{ github.repository }}
          test -f model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz
      - name: Download and MD5 check official GuitarSet raw mono MIC WAV archive
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 4 -o data/GuitarSet/audio_mono-mic.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/audio_mono-mic.zip
          echo '275966d6610ac34999b58426beb119c3  data/GuitarSet/audio_mono-mic.zip' | md5sum -c -
          ls -lh data/GuitarSet/audio_mono-mic.zip
      - name: Analyze ALL 190 continuous WAVs with full time-grid activity during K0
        run: |
          python -u -m scripts.s411_extract_continuous_GuitarSet_WAV_pitch_survival_features \
            --audio-zip data/GuitarSet/audio_mono-mic.zip \
            --notes model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz \
            --out model/S411
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S411/report.json'))
          assert a['status']=='S411_FULL_CONTINUOUS_MIC_WAV_FEATURE_SOURCE_ONLY'
          assert a['seen_tracks']==190 and a['notes_with_WAV_context']==33475
          assert a['no_JAMS_annotations_read'] and a['original_S80_S402_S407_S408_preserved']
          with np.load('model/S411/S411_continuous_mic_pitch_features_for_S408_notes.npz') as n:
            assert n['note_features'].shape==(33475,59)
            assert n['valid_note_mask'].all()
            assert np.isfinite(n['note_features']).all()
          print('S411 ALL 33475 NOTES CONTINUOUS AUDIO FROM 190 WAVS VERIFIED - no offset score yet')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s411-real-full-GuitarSet-continuous-MIC-10ms-pitch-note-survival-input-N33475
          path: model/S411/
          retention-days: 90
