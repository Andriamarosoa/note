name: S665 multi-horizon survival head for original NOTE Offsets
on:
  push:
    branches: [codex/s665-offset-survival-history-head]
    paths:
      - scripts/s665_multihorizon_note_survival_head.py
      - .github/workflows/v273-s665-multihorizon-survival.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s665-multihorizon-survival
  cancel-in-progress: true
jobs:
  held_composition_offset_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Compile and self-test S665
        run: |
          python -m compileall -q scripts/s665_multihorizon_note_survival_head.py
          python -m scripts.s665_multihorizon_note_survival_head --self-test
      - name: Restore original S425 immutable MIDI note and offset predictions
        run: |
          mkdir -p model/S425
          gh run download 38513725784 -n s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions -D model/S425 --repo ${{ github.repository }}
          test -f model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz
      - name: Restore real 10ms GuitarSet MIC temporal evidence S411 (no ground-truth labels)
        run: |
          mkdir -p model/S411
          gh run download 38374781473 -n s411-real-full-GuitarSet-continuous-MIC-10ms-pitch-note-survival-input-N33475 -D model/S411 --repo ${{ github.repository }}
          test -f model/S411/S411_continuous_mic_pitch_features_for_S408_notes.npz
      - name: Download pinned GuitarSet annotation JAMS
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Compute real offset candidate oracle and predict new cross-composition residual offsets
        run: |
          python -m scripts.s665_multihorizon_note_survival_head --frozen model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz --s411 model/S411/S411_continuous_mic_pitch_features_for_S408_notes.npz --annotations data/GuitarSet/annotation.zip --out /tmp/s665-offset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S665_80PCT_OFFSET_FEASIBILITY_REAL_GUITARSET
          path: /tmp/s665-offset/report.json
          if-no-files-found: warn
          retention-days: 60
