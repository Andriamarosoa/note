name: S704 iterative causal acoustic heads and joint emitted-note metrics
on:
  push:
    branches: [codex/note-s704-joint-acoustic-loops]
    paths:
      - src/causal_note/s704_joint_heads.py
      - scripts/s704_train_joint_loops.py
      - scripts/s704_joint_metrics.py
      - test/test_s704_joint_loops.py
      - .github/workflows/note-s704-joint-acoustic-loops.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s704-joint-acoustic-loops
  cancel-in-progress: false
jobs:
  joint_loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact native dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify causal prefixes, one emitted state, no retrospective fallback
        run: |
          python -m compileall -q src/causal_note/s704_joint_heads.py scripts/s704_train_joint_loops.py scripts/s704_joint_metrics.py
          python -m unittest -v test.test_s704_joint_loops test.test_s703_event_targets test.test_s702_event_selection test.test_s701_causal_onset
      - name: Retrieve verified frozen S675 reference
        run: |
          mkdir -p /tmp/s704_s675
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s704_s675
          test -s /tmp/s704_s675/s675_hazard.joblib
      - name: Train three budgets, calibrate joint scores, freeze and validate
        run: python -m scripts.s704_train_joint_loops --out /tmp/s704 --offset-checkpoint /tmp/s704_s675/s675_hazard.joblib
      - name: Preserve loops, checkpoints and raw emitted events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S704_JOINT_CAUSAL_ACOUSTIC_LOOPS
          path: /tmp/s704/
          if-no-files-found: warn
          retention-days: 60
