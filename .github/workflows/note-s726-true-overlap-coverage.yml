name: S726 real overlapping-note onset dataset coverage E2 E3 octaves
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - .github/workflows/note-s726-true-overlap-coverage.yml
      - scripts/s726_real_overlap_prevalence.py
      - test/test_s726_real_overlap_prevalence.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s726-real-data-coverage
  cancel-in-progress: true
jobs:
  S726_real_onset_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned core CPU NOTE inference
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate independent onset counting contracts
        run: |
          python -m unittest -v test.test_s726_real_overlap_prevalence
          python -m compileall -q scripts/s726_real_overlap_prevalence.py
      - name: Download signed original NoteOff calibration
        run: |
          mkdir -p /tmp/s726/s707
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s726/s707
          test -s /tmp/s726/s707/s675_hazard.joblib
      - name: Inventory all annotations, never TEST, report scarce E2 to E3 cases
        run: |
          python -m scripts.s726_real_overlap_prevalence --offset-checkpoint /tmp/s726/s707/s675_hazard.joblib --out /tmp/s726/coverage
      - name: Confirm split identities and no promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s726/coverage/report.json'))
          assert r['TEST_opened'] is False and r['promoted'] is False
          assert [r['splits'][k]['n_tracks'] for k in ('FIT','CAL','HELD','DEV')]==[80,32,32,12]
          for name,phase in r['splits'].items():
              c=phase['counts']
              assert c.get('E2_then_E3',0)<=c.get('interval_12',0)<=c.get('any_lower_sustained',0)
              print('S726_OVERLAP_COUNT',name,c,flush=True)
          PY
      - name: Archive complete real source overlap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S726_REAL_GUITARSET_OCTAVE_FIFTH_OVERLAP_COVERAGE
          path: /tmp/s726/coverage/report.json
          if-no-files-found: warn
          retention-days: 45
