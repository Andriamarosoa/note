name: S127 original S5 K-transition mismatches and confidence (no truth)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s127_original_s5_k_transition_audit.py'
      - '.github/workflows/v273-s127-s5-k-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s127_original_s5_k_transition_audit --self-test
      - name: Restore original SHA-pinned S5 raw fold0 posteriors
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/report.json \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/predictions.npz | tar -x -C model/history
      - name: Restore fixed S123 log reconstruction probabilities
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38186603580
          name: v273-s123-original-S5-fold-0-replay-candidate
          path: model/s123
      - name: Compare per-event K transitions without labels
        run: |
          set -euo pipefail
          S123="$(find model/s123 -type f -name replay_predictions.npz -print -quit)"
          test -s "$S123"
          python -m scripts.s127_original_s5_k_transition_audit \
            --original model/history/analysis/evidence/v273-open-k0-k6/series5/models/fold0/predictions.npz \
            --original-report model/history/analysis/evidence/v273-open-k0-k6/series5/models/fold0/report.json \
            --s123 "$S123" --out model/s127
          python - <<'PY'
          import json
          r=json.load(open('model/s127/report.json'))
          assert r['events']==15952 and r['mismatches']==1882
          assert r['no_accuracy_or_fitting'] and r['all_audio_source_labels_unused']
          assert not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s127-original-s5-k-transition-mismatch-audit
          path: model/s127/
          retention-days: 30
