name: V28 final 12-epoch moderate weighting trial

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'scripts/train_v280_moderate_final.py'
      - 'test/test_v280_moderate_final.py'
      - 'analysis/v280-moderate-final-protocol.md'
      - '.github/workflows/v280-moderate-final.yml'
      - '.github/workflows/v280-moderate-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v280-nested-outer-training
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  prepare:
    name: Verify final trial, frozen G control and preserve prepared data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - name: Verify the exact completed source runs and artifact digests
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const sources = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.train_v280_moderate_final import CONTROL_SOURCE,g; print(json.dumps([CONTROL_SOURCE,g.SOURCE]))'
            ], {encoding:'utf8'}));
            const repo = {owner:context.repo.owner, repo:context.repo.repo};
            for (const source of sources) {
              const {data:run} = await github.rest.actions.getWorkflowRun({...repo,run_id:source.run_id});
              if (run.status !== 'completed' || run.conclusion !== 'success'
                  || run.head_sha !== source.head_sha || run.run_attempt !== source.run_attempt) {
                throw new Error('Incomplete or changed source run');
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {...repo,run_id:source.run_id,per_page:100});
              const expected = source.artifacts || {[source.artifact]: {id:source.artifact_id,digest:source.digest}};
              for (const [name, record] of Object.entries(expected)) {
                const matches = artifacts.filter(a => a.name === name && !a.expired);
                if (matches.length !== 1 || matches[0].id !== record.id || matches[0].digest !== record.digest) {
                  throw new Error('Missing or changed source artifact: '+name);
                }
              }
            }
      - name: Test 35/65 Keras gradients, 12 epochs, resume, pairing and stop rule
        run: |
          python -m unittest -v \
            test.test_v280_moderate_final \
            test.test_v280_balanced_internal \
            test.test_v280_nested_outer \
            test.test_v280_internal_ablation \
            test.test_v280_real_smoke \
            test.test_v280_harmonic_count \
            test.test_v280_causal_cqt_mining
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-prepared-all
          repository: Andriamarosoa/note
          run-id: '34462604665'
          github-token: ${{ github.token }}
          path: model/v280-i-prepared
      - uses: actions/download-artifact@v4
        with:
          name: v280-g-control-2
          repository: Andriamarosoa/note
          run-id: '34684806334'
          github-token: ${{ github.token }}
          path: model/v280-i-reference/control
      - uses: actions/download-artifact@v4
        with:
          name: v280-g-internal-comparison
          repository: Andriamarosoa/note
          run-id: '34684806334'
          github-token: ${{ github.token }}
          path: model/v280-i-reference/comparison
      - name: Audit the control and freeze fit-only weights before real training
        run: |
          python -B scripts/train_v280_moderate_final.py preflight \
            --prepared-dir model/v280-i-prepared \
            --control-dir model/v280-i-reference/control \
            --control-comparison-dir model/v280-i-reference/comparison \
            --output model/v280-i-prepared/i-preflight.json
      - name: Preserve the full verified cache for this run and reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: v280-i-prepared
          path: model/v280-i-prepared
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v280-i-reference
          path: model/v280-i-reference
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v280-i-preparation-audit
          path: |
            model/v280-i-prepared/i-preflight.json
            model/v280-i-prepared/manifest.json
            model/v280-i-prepared/labels.npz
            model/v280-i-prepared/split.json
            model/v280-i-prepared/evaluation.npz
          if-no-files-found: error
          retention-days: 90

  moderate_1:
    name: Moderate model epochs 1 through 6
    needs: prepare
    uses: ./.github/workflows/v280-moderate-worker.yml
    with:
      chunk: 1
  moderate_2:
    name: Moderate model epochs 7 through 12
    needs: moderate_1
    uses: ./.github/workflows/v280-moderate-worker.yml
    with:
      chunk: 2

  verdict:
    name: Verify full paired budgets and apply the frozen V27.3 fallback rule
    needs: moderate_2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.23.5,<2.0'
      - uses: actions/download-artifact@v4
        with:
          name: v280-i-preparation-audit
          path: model/v280-i-prepared
      - uses: actions/download-artifact@v4
        with:
          name: v280-i-reference
          path: model/v280-i-reference
      - uses: actions/download-artifact@v4
        with:
          name: v280-i-moderate-2
          path: model/v280-i-candidate
      - name: Recompute metrics, uncertainty and final decision
        run: |
          python -B scripts/train_v280_moderate_final.py compare \
            --prepared-dir model/v280-i-prepared \
            --control-dir model/v280-i-reference/control \
            --control-comparison-dir model/v280-i-reference/comparison \
            --candidate-dir model/v280-i-candidate \
            --output-dir model/v280-i-verdict
          cat model/v280-i-verdict/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v280-i-final-verdict
          path: model/v280-i-verdict
          if-no-files-found: error
          retention-days: 90
