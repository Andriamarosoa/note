name: S381 SHA freeze ORIGINAL S18 vs source-GuitarSet-only K3 specialist on 8 untouched WAVs before XML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s380_freeze_trainonly_early_K3_expert_on_last8_unseen_IDMT.py'
      - '.github/workflows/v273-s381-first-new8-S18-K3-specialist-PREXML.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s381-first8-audio-early-source-K3-expert-prelabel
  cancel-in-progress: true
jobs:
  original_heldtrained_K3_neural_specialist_PRESCORE_SHA_LOCK:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: BLOCK any future annotation read until original 255 V88 S5+133 trained S18 and source-only GuitarSet gate successful
        run: |
          gh run watch 38335758942 --repo ${{ github.repository }} --exit-status --interval 15
          gh run watch 38335791405 --repo ${{ github.repository }} --exit-status --interval 15
          gh run watch 38335694458 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Original 20 source scripts prelabel exact 255 native rebase and genuine original trained 133 original risk fold heads
        run: |
          gh run download 38335633796 \
            -n s377-20-genuine-original-S5-to-S80-modules-on-255-last8-WAVs-ABIs-PREXML \
            -D model/S377 --repo ${{ github.repository }}
          cp model/S377/s338_S18_consensus_dataset1_477.py scripts/s338_S18_consensus_dataset1_255.py
          gh run download 38335758942 \
            -n s334-s335-8-IDMT-dataset1-chords-255-original-S97-527D-PREXML \
            -D model/S334S335 --repo ${{ github.repository }}
          gh run download 38335791405 \
            -n s336-s337-original-255-S5-S18-folds-IDMT-dataset1-PREXML \
            -D model/S336S337 --repo ${{ github.repository }}
          gh run download 38335694458 \
            -n s376-original-GuitarSet-heldfold-S5-raw-posterior-and-acoustic-K3-specialist-trained-NO-IDMT \
            -D model/S376 --repo ${{ github.repository }}
      - name: Reconstruct ONLY original S217 3of4 consensus, no label or IDMT training
        run: |
          python -u -m scripts.s338_S18_consensus_dataset1_255 \
            --s337 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_255.npz \
            --out model/S338
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S338/report.json'))
          assert r['native_event_count']==255 and not r['labelled_song_annotations_read']
          with np.load('model/S338/S338_original_S18_foldneutral_255_IDMT.npz',allow_pickle=False) as z:
            assert len(z['row_id'])==255 and z['original_S18_by_fold_K'].shape==(4,255)
          print('S381 original 3/4 S18 source locked with 255 original V88 unlabeled event IDs')
          PY
      - name: Freeze a single exact original heldfold GuitarSet K3 discrimination policy and its 255 external prelabel scores, no IDMT XML
        run: |
          python -u -m scripts.s380_freeze_trainonly_early_K3_expert_on_last8_unseen_IDMT \
            --audio model/S334S335/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --owned model/S334S335/S335/S335_IDMT_dataset1_true_original_S5_527D_input.npz \
            --s5 model/S336S337/S336/S336_original_S5_fourfold_255_dataset1_native_unlabelled.npz \
            --s18 model/S338/S338_original_S18_foldneutral_255_IDMT.npz \
            --report model/S376/report.json \
            --models model/S376 \
            --out model/S380
          python - <<'PY'
          import json,numpy as np
          j=json.load(open('model/S380/report.json'))
          assert j['status']=='S380_EIGHT_GUITARSET_TRAINED_EARLY_K3_S18_PRESCORE_SHA'
          assert j['native_events']==255 and j['WAV_count']==8
          assert j['NO_IDMT_XML_MIDI_READ'] and not j['independent_ExactK_measured']
          assert not j['original_fold_models_trained_on_IDMT'] and not j['official_promotion']
          assert j['original_GuitarSet_selected_candidate']['view']=='source1147'
          assert j['original_GuitarSet_selected_candidate']['threshold']==0.625
          with np.load('model/S380/S380_8WAV_original_S18_vs_early_K3_specialist_PRESCORE.npz',allow_pickle=False) as z:
            assert z['expert_K3_probability_fourfold'].shape==(4,255)
            assert z['expert_K3_action'].sum()<=z['eligible_source_parent_K3to2'].sum()
          print('S381 PASS 255 rows source-GuitarSet trained acoustic early K3 candidate SHA sealed pre XML, NO promotion')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s381-eightIDMT255-true-original-S18-vs-GuitarSet-only-1147K3-PRESCORE-SHA-noXML
          path: |
            model/S338/
            model/S380/
          retention-days: 90
