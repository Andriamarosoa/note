name: S520 independently replay 8 nested S509 attention+S516 note generator models, verify all real chord regressions
on:
  push:
    branches: [codex/s518-s516-generator-s509-neural-selector-fusion]
    paths:
      - scripts/s520_independent_replay_nested_14head_pitch_selection.py
      - .github/workflows/v273-s520-independent-14head-neural-note-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  frozen_neural_NOTE_generator_S509_S516_with_no_training_in_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent only numerical true-note scorer, no ML libraries
        run: python -m pip install numpy==1.26.4
      - name: Verify correct K but wrong note MUST count as regression
        run: |
          python -m py_compile scripts/s520_independent_replay_nested_14head_pitch_selection.py
          python -m scripts.s520_independent_replay_nested_14head_pitch_selection --self-test
      - name: Restore immutable S505 genuine source attack note labels
        run: |
          gh run download 38596480284 \
            -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table \
            -D model/S505 --repo "${{ github.repository }}"
      - name: Restore S519 EIGHT genuine pretrained-raw-generator/nested 14head neural checkpoints with release provenance after their CI succeeds
        run: |
          for attempt in $(seq 1 75); do
            if gh run download 38643896675 \
              -n s519-14head-true-S509-S516-nested-eight-recordingheld-trained-neural-MIDI-pitch-fusion \
              -D model/S519 --repo "${{ github.repository }}"; then
              break
            fi
            if [ "$attempt" -eq 75 ]; then
              echo 'Trained and held-source validated S519 models not yet available; refuse to invent performance' >&2
              exit 1
            fi
            sleep 15
          done
      - name: Independently recompute named pitches, K, corrections, regressions and identical held-group counts
        run: |
          python -u -m scripts.s520_independent_replay_nested_14head_pitch_selection \
            --source model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --source-report model/S505/report.json \
            --trained-report model/S519/report.json \
            --preds model/S519/S519_TRUE_NESTED_OOF_NEURAL_14HEAD_AND_GENERATOR_PROBS.jsonl \
            --models model/S519 --out model/S520
          python - <<'PY'
          import json
          r=json.load(open('model/S520/report.json'))
          assert r['status']=='S520_INDEPENDENT_REPLAY_NESTED_S509_S516_14HEAD_ATTENTION'
          assert r['original_trained_model_checkpoint_SHA_verified_16']
          assert r['original_nested_inner_train_source_only_checks_verified']
          assert r['no_retraining_or_threshold_fitting_on_true_eval_notes']
          assert r['independently_verified_exact_full_note_sets_and_midi_note_F1']
          assert r['all_regressions_accounted_for']
          assert r['event_F1_and_negative_onset_precision_still_unmeasured']
          assert r['original_source_S80_and_Live_unchanged'] and r['no_promotion']
          print('S520 independent whole-chord, by-K, note-onset and full real pitch source regression audit completed successfully')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s520-independently-replayed-8-nested-14head-neural-note-models-by-trueK-and-note-regression
          path: model/S520/
          retention-days: 90
