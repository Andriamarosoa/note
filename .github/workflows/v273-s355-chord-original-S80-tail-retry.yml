name: S355 retry ONLY original S69-S80 tail on 477 already verified chord events PREXML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - '.github/workflows/v273-s355-chord-original-S80-tail-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s355-chord-477-original-S80-tail-only
  cancel-in-progress: true
jobs:
  s80_and_seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Restore SHA-fixed already successful original source checkpoint artifacts from S338-S348
        run: |
          gh run download 38327334843 \
            -n chords-477-S338-S339-source \
            -D model/source --repo ${{ github.repository }}
      - name: Restore SHA-fixed already successful original source checkpoint artifacts from S338-S348
        run: |
          gh run download 38327334843 \
            -n chords-477-S345-S347-S46 \
            -D model/fusion --repo ${{ github.repository }}
      - name: Restore SHA-fixed already successful original source checkpoint artifacts from S338-S348
        run: |
          gh run download 38327334843 \
            -n chords-477-S348-PR16 \
            -D model/pr16 --repo ${{ github.repository }}
      - name: Restore all real original S69 S70 S71 S72 S79 and final S80 trained model checkpoints and frozen baseline
        run: |
          gh run download 38177948016 -n v273-s69-s46-risk-replay -D model/S69rules --repo ${{ github.repository }}
          gh run download 38296428889 -n s222-recovered-original-S70-four-fold-checkpoints-exact-history -D model/S222 --repo ${{ github.repository }}
          gh run download 38296880555 -n s224-original-four-S71-acoustic-risk-checkpoints-historic-exact -D model/S224 --repo ${{ github.repository }}
          gh run download 38297080728 -n s225-recovered-original-S72-four-temporal-risk-checkpoints -D model/S225 --repo ${{ github.repository }}
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/S80historic --repo ${{ github.repository }}
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
      - name: Replay every pretrained S69 through S80 historical checkpoint for ORIGINAL and S274 source S46 banks on 477 identical native events
        run: |
          set -euo pipefail
          for scenario in original twofold; do
            if [ "$scenario" = original ]; then
              s46="model/fusion/S346/S346_original_193_S46_foldneutral_477_IDMT.npz"
            else
              s46="model/fusion/S347/S347_original_source_counterfactual_S274_gate_477.npz"
            fi
            python -u -m scripts.s349_S69_fourfold_dataset1_477 \
              --s247 "$s46" --pr16 model/pr16/pr16_external_36_policies.npz \
              --rules model/S69rules/report.json --out "model/S349_$scenario"
            python -u -m scripts.s350_S70_fourfold_dataset1_477 \
              --s221 "model/S349_$scenario/S349_original_S69_fourfold_rule_consensus_IDMT.npz" \
              --s85 model/pr16/pr16_external_36_policies.npz \
              --s222 model/S222 --out "model/S350_$scenario"
            python -u -m scripts.s351_S71_S72_dataset1_477 \
              --s69 "model/S349_$scenario/S349_original_S69_fourfold_rule_consensus_IDMT.npz" \
              --s70 "model/S350_$scenario/S350_original_S70_4fold_no_oracle_IDMT.npz" \
              --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
              --s71 model/S224 --s72 model/S225 --out "model/S351_$scenario"
            python -u -m scripts.s352_full_S80_dataset1_477 \
              --s226 "model/S351_$scenario/S351_original_S71_S72_native_IDMT.npz" \
              --s219 "$s46" --s85 model/pr16/pr16_external_36_policies.npz \
              --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
              --s80 model/S80historic --out "model/S352_$scenario"
          done
      - name: SHA seal two complete reconstructed S80 predictions plus immutable official freeze_local_combo 477 original V88 event IDs BEFORE XML
        run: |
          python -u -m scripts.s353_freeze_paired_S80_dataset1_477 \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --old model/S352_original/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --new model/S352_twofold/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --out model/S353
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S353/prelabel_comparison.json'))
          assert r['native_events']==477 and r['WAV_count']==12
          assert not r['truth_XML_or_MIDI_read'] and not r['official_S80_promotion']
          assert r['all_results_on_exact_same_original_V88_native_events']
          for stage in ('original','twofold'):
            with np.load(f'model/S352_{stage}/S352_full_original_S80_unseen_IDMT_477_frozen.npz',allow_pickle=False) as z:
              assert z['s80_K'].shape==(477,)
          print('S353 SEALED original official, reconstructed S80 and S274 S80 BEFORE any prospective chord XML is opened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chords-477-S349-S353-three-frozen-original-S80-PREXML
          path: |
            model/S349_original/report.json
            model/S349_twofold/report.json
            model/S350_original/report.json
            model/S350_twofold/report.json
            model/S351_original/report.json
            model/S351_twofold/report.json
            model/S352_original/
            model/S352_twofold/
            model/S353/
          retention-days: 90
