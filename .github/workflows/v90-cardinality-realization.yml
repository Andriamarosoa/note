name: V9.0 frozen cardinality realization study

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/evaluate_v90_cardinality_realization.py'
      - '.github/workflows/v90-cardinality-realization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  realization:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          set -o pipefail
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.4 control source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v84
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          test -f model/source-v84/v84-pilot/control.epoch-01.keras

      - name: Download frozen train-only audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-audit
          gh run download 33551039906 --repo "$GITHUB_REPOSITORY" --name v81-train-fp-harmonic-audit --dir model/source-audit
          test -f model/source-audit/v81-train-fp-harmonic-audit.json

      - name: Download frozen V8.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v86
          gh run download 33586296528 --repo "$GITHUB_REPOSITORY" --name v86-state-transition-proposal-pilot --dir model/source-v86
          test -f model/source-v86/v86-state-transition-pilot/result/report.json
          test -f model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5

      - name: Download frozen V8.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v87
          gh run download 33588164652 --repo "$GITHUB_REPOSITORY" --name v87-causal-candidate-memory-pilot --dir model/source-v87
          test -f model/source-v87/v87-candidate-memory-pilot/result/report.json
          test -f model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5

      - name: Download frozen V8.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v88
          gh run download 33589654195 --repo "$GITHUB_REPOSITORY" --name v88-regime-gated-moe-pilot --dir model/source-v88
          test -f model/source-v88/v88-regime-moe-pilot/result/report.json
          test -f model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5

      - name: Compile realization study
        env:
          PYTHONPATH: src
        run: python -m py_compile scripts/evaluate_v90_cardinality_realization.py

      - name: Run frozen V8.8 cardinality realization study
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v90-cardinality-realization
          python -B scripts/evaluate_v90_cardinality_realization.py \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --train-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --output-dir model/v90-cardinality-realization/result \
            2>&1 | tee model/v90-cardinality-realization.log

      - name: Verify isolation and summarize realization
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model/v90-cardinality-realization/result/report.json').read_text())
          a=d['architecture']; data=d['data']
          assert a['new_trainable_parameters'] == 0
          assert a['all_models_frozen'] is True
          assert a['runtime_inputs_use_annotations'] is False
          assert a['locked_validation_executed'] is False
          assert a['offset_stream_executed'] is False
          assert a['future_candidate_context'] is False
          assert data['analysis_members_disjoint_source'] is True
          assert data['analysis_members_disjoint_locked_validation'] is True
          print('per_candidate_cardinality_accuracy', d['per_candidate_v88_cardinality']['accuracy'])
          print('candidate_ceiling_recall', d['candidate_ceiling']['recall'])
          b=d['baseline_v88_frozen_threshold']
          print('baseline_global_f1', b['global']['f1'])
          for window, wd in d['windows'].items():
              print('\nwindow_ms', window, 'assigned_fraction', wd['reference_assignment']['assigned_fraction'])
              print('oracle_exact_global', wd['oracle_exact_k_current_ranking']['global']['f1'])
              print('oracle_3plus_global', wd['oracle_3plus_current_ranking']['global']['f1'])
              for method, row in wd['frozen_v88_cardinality_realization'].items():
                  m=row['metrics']['global']; c=row['cardinality']
                  print(method, 'global_f1', f"{m['f1']:.6f}", 'delta_baseline', f"{m['f1']-b['global']['f1']:+.6f}", 'card_acc', f"{c['accuracy']:.6f}", 'birth_acc', f"{c['birth_cluster_accuracy']:.6f}", 'poly_acc', f"{c['poly_cluster_accuracy']:.6f}", 'pred_ref', f"{m['prediction_reference_ratio']:.6f}")
          PY

      - name: Upload realization artifact
        uses: actions/upload-artifact@v4
        with:
          name: v90-cardinality-realization
          path: |
            model/v90-cardinality-realization.log
            model/v90-cardinality-realization/result/report.json
          if-no-files-found: error
          retention-days: 14
