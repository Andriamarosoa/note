name: S765 FIT80 learned six-head arbitration and full CAL32 protected MIDI
on:
  push:
    branches: [codex/note-s765-fit-ensemble-arbiter]
    paths:
      - scripts/s765_fit_independent_arbiter.py
      - test/test_s765_fit_independent_arbiter.py
      - .github/workflows/note-s765-learned-six-head-arbiter.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s765-fit-learned-arbiter
  cancel-in-progress: true
jobs:
  fit_composition_grouped_midi_arbitration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install signed NOTE runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate six-decoder input isolation and FIT-only arbiter contracts
        run: |
          python -m compileall -q scripts/s765_fit_independent_arbiter.py
          python -m unittest -v \
            test.test_s763_independent_decoders \
            test.test_s764_six_decoder_shadow_cal32 \
            test.test_s765_fit_independent_arbiter \
            test.test_s746_instance_guard
      - name: Restore original S708/S707 signed models
        run: |
          mkdir -p /tmp/s765/s708 /tmp/s765/s707
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s765/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s765/s707
          test -s /tmp/s765/s708/report.json
          test -s /tmp/s765/s708/s708_selected.pt
          test -s /tmp/s765/s707/s675_hazard.joblib
      - name: Fit five composition-grouped folds on FIT80 then measure four full MIDI CAL32 streams
        run: |
          python -m scripts.s765_fit_independent_arbiter \
            --s708-dir /tmp/s765/s708 \
            --offset-checkpoint /tmp/s765/s707/s675_hazard.joblib \
            --out /tmp/s765/analysis
      - name: Recheck frozen source and evidence for safe, six-axis nonregression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s765/analysis/report.json').read_text())
          assert r["schema"]=="S765_FIT80_SIX_ISOLATED_HEADS_LEARNED_ARBITER_CAL32"
          assert r["complete"] and r["reference_parity"]["valid"]
          assert r["fit_recordings_done"]==80 and r["cal_recordings_done"]==32
          assert not r["promoted"] and r["selected"]=="S708_frozen"
          assert not r["LIVE_changed"] and not r["HELD_opened"] and not r["TEST_opened"]
          assert r["no_labels_in_inference"] and r["source_events_preserved"]
          assert r["FIT"]["folds"]==5
          assert r["FIT"]["candidate_rows"]>=0
          assert len(r["CAL"])==4
          for name,trial in r["CAL"].items():
              assert len(trial["metrics"])==6
              assert trial["safe"]==(
                  all(v>=-1e-12 for v in trial["delta"].values())
                  and all(x==0 for x in trial["losses"].values()))
              assert trial["six_gt80"]==(
                  trial["safe"] and all(x>.8 for x in trial["metrics"].values()))
          print("S765_SIX_HEAD_FIT80_OOF_PROTECTED_CAL32_SCORES",json.dumps({
              "source":r["reference_scores"],"fit":r["FIT"],
              "census":r["proposal_census"],"trials":r["CAL"],
              "potential_candidate":r["candidate_for_independent_test"]}))
          PY
      - name: Publish trial metrics and FIT-only model even if no promotion qualifies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S765_FIT80_SIXHEAD_LEARNED_CAL32
          path: |
            /tmp/s765/analysis/report.json
            /tmp/s765/analysis/s765_arbiter.joblib
          retention-days: 45
          if-no-files-found: warn
