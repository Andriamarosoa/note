name: S419 S402 vs S416 composition-held predicted-K native head gate zero K regressions
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s419_S402_S416_songheld_Kconditional_native_head_gate.py'
      - '.github/workflows/v273-s419-native-K-note-head-song-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s419-k-locked-native-head-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train_only_per_K_note_head_gate_under_original_S80:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test K0 strict note equality and output format
        run: |
          python -m py_compile scripts/s419_S402_S416_songheld_Kconditional_native_head_gate.py
          python -u -m scripts.s419_S402_S416_songheld_Kconditional_native_head_gate --self-test
      - name: Restore pristine 59309 group audio and true K (truth only for scoring)
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore frozen S80 no regression cardinality outputs
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Restore S402 note model baseline and S416 native 4-fold candidate predictions
        run: |
          gh run download 38361853607 -n s402-K-fed-to-MIDI-neural-input-composition-disjoint-4fold-DEVELOPMENT-NOPROMOTION -D model/S402 --repo ${{ github.repository }}
          gh run download 38381449092 -n s416-native-CNN-time-pitch-note-head-songheld-S80-ExactK-LOCKED-NO-YourMT -D model/S416 --repo ${{ github.repository }}
      - name: Retrieve original GuitarSet JAMS for TRAIN-ONLY composition gate selection and held evaluation
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Select note head per predicted K using ONLY OTHER SONGS and audit per true K
        run: |
          python -u -m scripts.s419_S402_S416_songheld_Kconditional_native_head_gate \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s402 model/S402/S402_K_FIRST_S80_MIDI_NOTE_59309_SONG_OOF.npz \
            --s416 model/S416/S416_NATIVE_Kfirst_MIDI_NOTE_59309_SONG_OOF.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S419
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S419/report.json'))
          assert a['status']=='S419_NATIVE_K_FIRST_SONGHELD_NOTE_HEAD_GATE'
          assert a['actual_exactK_correct_global']==53529 and a['actual_exactK_correct_poly']==6054
          assert not a['any_exactK_regression']
          assert a['metrics']['S419_poly_chord_correct']>=0
          assert a['number_of_original_events']==59309 and a['number_of_new_notes']==33475
          assert all(z['composition_overlap']==0 for z in a['song_split_proofs'])
          assert a['S402_active_reference_UNCHANGED'] and a['S408_active_offset_reference_UNCHANGED']
          with np.load('model/S419/S419_NATIVE_K_PROTECTED_HEAD_GATE_59309.npz') as z:
            assert np.array_equal((z['midi_pitch_slots']>=0).sum(1),z['s80_K'])
          print('S419 verified native note-head gate, zero K regression and full correct/incorrect notes scored')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s419-native-K-gated-MIDI-head-songheld-S402-S416-no-ExactK-regression
          path: model/S419/
          retention-days: 90
