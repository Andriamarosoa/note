name: V27.3 Candidate Stack Freeze Train

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-candidate-stack-freeze-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-candidate-stack-freeze
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-candidate-stack-freeze-${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Validate train contract
        run: |
          python -m py_compile scripts/train_v273_candidate_stack_freeze.py
          python - <<'PY'
          from scripts.train_v273_candidate_stack_freeze import FROZEN
          assert FROZEN==("candidate_norm","candidate_hidden1","candidate_hidden2","cardinality")
          print({"frozen":FROZEN})
          PY

  train:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Restore frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/current model/cluster

          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37208199201             --repo "${{ github.repository }}"             --pattern v273-loss-weighting-uniform.tgz             --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          gh release download v273-uniform-anchored-freeze-37233793945             --repo "${{ github.repository }}"             --pattern v273-uniform-anchored-freeze-result.tgz             --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/current

          gh release download v273-failure-clustering-36999901054             --repo "${{ github.repository }}"             --pattern v273-failure-clustering-rows.csv             --dir model/cluster

          test -f model/uniform/uniform.weights.h5
          test -f model/uniform/predictions.npz
          test -f model/current/predictions.npz
          test -f model/cluster/v273-failure-clustering-rows.csv

      - name: Train candidate-stack freeze
        run: |
          python -B scripts/train_v273_candidate_stack_freeze.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-anchor model/uniform/uniform.weights.h5             --uniform-predictions model/uniform/predictions.npz             --current-predictions model/current/predictions.npz             --cluster-rows model/cluster/v273-failure-clustering-rows.csv             --output model/result

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-candidate-stack-freeze-result.tgz -C model/result .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 candidate-stack freeze training"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/result/predictions.npz             model/v273-candidate-stack-freeze-result.tgz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-candidate-stack-freeze-result
          path: model/result/
          retention-days: 90
