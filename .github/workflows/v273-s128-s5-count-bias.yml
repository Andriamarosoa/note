name: S128 S5 posterior ordinal-count bias diagnostic (no labels)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s128_s5_count_bias_diagnostic.py'
      - '.github/workflows/v273-s128-s5-count-bias.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s128-s5-count-bias-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s128_s5_count_bias_diagnostic --self-test
      - name: Restore SHA-verified original S5 historical posteriors
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/report.json \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/predictions.npz | tar -x -C model/history
      - name: Restore fixed S123 reconstruction (no new training)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38186603580
          name: v273-s123-original-S5-fold-0-replay-candidate
          path: model/s123
      - name: Diagnose fixed K-ordinal bias without reading ground truth
        run: |
          set -euo pipefail
          S123="$(find model/s123 -type f -name replay_predictions.npz -print -quit)"
          test -s "$S123"
          python -m scripts.s128_s5_count_bias_diagnostic \
            --original model/history/analysis/evidence/v273-open-k0-k6/series5/models/fold0/predictions.npz \
            --original-report model/history/analysis/evidence/v273-open-k0-k6/series5/models/fold0/report.json \
            --s123 "$S123" --out model/s128
          python - <<'PY'
          import json
          r=json.load(open('model/s128/report.json'))
          assert r['rows']==15952 and r['historical_original_vs_replay_disagreements']==1882
          assert not r['midi_or_truth_accessed'] and not r['accuracy_evaluated']
          assert not r['S80_promoted'] and r['original_527D_feature_mapping_restored'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s128-s5-ordinal-bias-diagnostic
          path: model/s128/
          retention-days: 30
