name: S699 full GuitarSet TRAIN compositions strict unseen-player K head
on:
  push:
    branches: [codex/note-s699-player-held-full-composition-k]
    paths:
      - scripts/s699_player_held_full_train_K.py
      - test/test_s699_player_held_K.py
      - .github/workflows/note-s699-full-compositions-k.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: note-s699-all-compositions-player-03-held
  cancel-in-progress: true
jobs:
  full_composition_train_unseen_player:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pin frozen original NOTE K and 256hop features
        run: python -m pip install -r requirements-live-strict.txt
      - name: Test frozen native MIDI and truly held-out player
        run: |
          python -m compileall -q scripts/s699_player_held_full_train_K.py test/test_s699_player_held_K.py
          python -m unittest -v test.test_s697_causal_K_shadow test.test_s699_player_held_K
      - name: Learn from 108 authentic TRAIN player00-02; held player03 and DEV player04
        run: python -m scripts.s699_player_held_full_train_K --out /tmp/s699
      - name: Archive strict player-held and 80-percent K accuracy including active frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S699_GUITARSET_ALL_COMPS_PLAYER_HELD_CAUSAL_K
          path: /tmp/s699/report.json
          if-no-files-found: warn
          retention-days: 60
