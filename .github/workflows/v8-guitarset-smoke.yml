name: V8 GuitarSet smoke

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - "scripts/train_v8.py"
      - "src/causal_note/v8_*.py"
      - ".github/workflows/v8-guitarset-smoke.yml"
  workflow_dispatch:

jobs:
  guitarset-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt
      - name: Install V8 training dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Download official GuitarSet pickup-mix data
        run: |
          mkdir -p data/GuitarSet model
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Train V8 data smoke
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          python -B scripts/train_v8.py --smoke --output model/causal-boundaries-v8-smoke.keras 2>&1 | tee model/v8-guitarset-smoke.log
      - name: Upload V8 smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-guitarset-smoke
          path: |
            model/v8-guitarset-smoke.log
            model/causal-boundaries-v8-smoke.keras
            model/causal-boundaries-v8-smoke.point.best.keras
          if-no-files-found: warn
          retention-days: 7
