name: S784 independent acoustic 49 pitch onset rescue FIT80 CAL32
on:
  push:
    branches: [codex/note-s784-independent-spectral-onset-rescue]
    paths:
      - scripts/s784_independent_spectral_onset_rescue.py
      - test/test_s784_independent_onset_rescue.py
      - .github/workflows/note-s784-acoustic-onset-rescue.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen NOTE CPU runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify no-future note births, harmonic veto and FIT-only selection
        run: |
          python -m compileall -q scripts/s784_independent_spectral_onset_rescue.py
          python -m unittest -v test.test_s784_independent_onset_rescue
      - name: Preflight onset report schema and 48 guarded policies
        run: |
          python - <<'PY'
          from pathlib import Path
          import scripts.s784_independent_spectral_onset_rescue as m
          s=Path('scripts/s784_independent_spectral_onset_rescue.py').read_text()
          assert 'schema="S784_CAUSAL_SPECTRAL_ONSET_RESCUE_FIT80"' in s
          assert len(m.policy_grid())==48
          print('S784_PREFLIGHT_OK')
          PY
      - name: Restore signed S708/S707 snapshots
        run: |
          mkdir -p /tmp/s784/s708 /tmp/s784/s707
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s784/s708
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s784/s707
          test -s /tmp/s784/s708/report.json
          test -s /tmp/s784/s708/s708_selected.pt
          test -s /tmp/s784/s707/s675_hazard.joblib
      - name: Select 48 acoustic policies only on FIT80, evaluate frozen candidate CAL32
        run: |
          python -m scripts.s784_independent_spectral_onset_rescue \
            --s708-dir /tmp/s784/s708 \
            --offset-checkpoint /tmp/s784/s707/s675_hazard.joblib \
            --out /tmp/s784/report
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s784/report/report.json'))
          assert r['complete'] and r['cal_recordings_done']==32
          assert r['schema']=='S784_CAUSAL_SPECTRAL_ONSET_RESCUE_FIT80'
          assert r['ONSET_only_not_MIDI'] and r['causal_current_past_only']
          assert r['no_CAL_training_or_selection'] and r['final_MIDI_changed'] is False
          assert not r['promoted'] and not r['LIVE_changed'] and not r['TEST_opened'] and not r['HELD_opened']
          assert r['fit_recordings_done']==80 and r['cal_recordings_done']==32
          assert r['FIT']['frozen_grid_size']==48
          assert len(r['FIT']['policies'])==48
          assert r['selected_policy'] in r['FIT']['eligible'] or r['selected_policy'] is None
          assert abs(r['CAL']['delta_f1']-(r['CAL']['frozen']['f1']-r['CAL']['baseline']['f1']))<1e-9
          print('S784_FIT_SELECTED',r['selected_policy'])
          print('S784_CAL_ONSET_F1',r['CAL']['frozen']['f1'])
          PY
      - name: Preserve FIT80 risk and CAL32 frozen onset diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S784_INDEPENDENT_SPECTRAL_ONSET_FIT80_CAL32
          path: /tmp/s784/report/report.json
          retention-days: 45
          if-no-files-found: warn
