name: S122 diagnose 527D feature type placement from original tree split bounds
on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/s122_original_s4_s5_feature_semantics.py'
      - '.github/workflows/v273-s122-original-feature-types.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original checkpoint runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Test candidate feature type layouts
        env:
          PYTHONPATH: '.:src'
        run: python -m scripts.s122_original_s4_s5_feature_semantics --self-test
      - name: Restore exact original frozen model checkpoints
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
            analysis/evidence/v273-open-k0-k6/series4/models \
            analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/history
      - name: Audit split threshold mathematical validity for ratio and count columns
        env:
          PYTHONPATH: '.:src'
        run: |
          python -m scripts.s122_original_s4_s5_feature_semantics \
            --s4-models model/history/analysis/evidence/v273-open-k0-k6/series4/models \
            --s5-models model/history/analysis/evidence/v273-open-k0-k6/series5/models \
            --out model/s122
          python - <<'PY'
          import json
          r=json.load(open('model/s122/report.json'))
          assert len(r['hypotheses'])==3 and r['original_model_count']==10
          assert not r['original_416D_order_proven']
          assert not r['accuracy_measured'] and not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s122-original-527D-type-constraints
          path: model/s122/
          retention-days: 30
