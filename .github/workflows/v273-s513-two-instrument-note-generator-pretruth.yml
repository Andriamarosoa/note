name: S513 same frozen raw WAV independent pitch generator on guitar IDMT and piano MAESTRO
on:
  push:
    branches: [codex/s513-piano-and-guitar-raw-harmonic-crosssource]
    paths: [.github/workflows/v273-s513-two-instrument-note-generator-pretruth.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  real_S80_guitar_and_V88_piano_original_WAV_SHA_with_new_independent_acoustic_notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original waveform and spectral harmonic DSP dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Ensure new independent spectral note constructor passes blind synthetic signal check
        run: |
          python -m py_compile scripts/s511_new_raw_harmonic_pitch_onset_generators.py
          python -m scripts.s511_new_raw_harmonic_pitch_onset_generators --self-test
      - name: Restore ORIGINAL unexposed source NAME manifests and already-frozen original WAV SHAs only
        run: |
          gh run download 38318827219 -n s276-IDMT-central-directory-only-prospective-WAV-cohort -D model/S276 --repo "${{ github.repository }}"
          gh run download 38319155819 -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled -D model/S277 --repo "${{ github.repository }}"
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559067956 -n s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI -D model/S470 --repo "${{ github.repository }}"
      - name: Same new no-label generator across 5 IDMT guitar and 3 MAESTRO true piano audio excerpts
        run: |
          python -u -m scripts.s511_new_raw_harmonic_pitch_onset_generators \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s277-report model/S277/report.json \
            --s469 model/S469/report.json --s470 model/S470/report.json \
            --include-piano --out model/S513
          python - <<'PY'
          import json
          r=json.load(open('model/S513/report.json'))
          assert r['status']=='S511_NEW_INDEPENDENT_RAW_HARMONIC_PITCH_ONSET_CANDIDATES_PREMIDI'
          assert r['original_WAVs']==8
          assert r['WAV_byte_SHA_source_verified']
          assert r['no_XML_or_MIDI_ground_truth_read_in_training_or_inference']
          assert len(r['per_recording'])==8
          assert r['no_original_source_S80_or_V88_changed'] and r['no_promotion']
          print('S513 same independent raw pitch generator frozen on 8 genuine two-instrument WAVs without truth')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s513-original-five-IDMT-three-MAESTRO-new-independent-raw-note-generator-PREMIDI
          path: model/S513/
          retention-days: 90
