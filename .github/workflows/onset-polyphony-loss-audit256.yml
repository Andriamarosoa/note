name: Onset PCM256 polyphony audit tests
on:
  push:
    branches: [codex/note-onset-polyphony-loss-audit256]
    paths: ['src/onset256/**', 'scripts/*onset*256.py', 'tests/**', '.github/workflows/onset-polyphony-loss-audit256.yml']
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-onset256-cache.txt
      - run: python -m unittest discover -s tests -v
      - name: Keep test success distinct from audio evidence
        run: echo 'This job validates audit code. Scientific scores require the signed audio replay reports.'
