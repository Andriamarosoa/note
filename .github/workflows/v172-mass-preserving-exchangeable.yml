name: V17.2 mass-preserving exchangeable causal decomposition

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v172_mass_preserving_exchangeable.py'
      - 'scripts/run_v172_reporting_compat.py'
      - 'scripts/summarize_v172_mass_preserving.py'
      - '.github/workflows/v172-mass-preserving-exchangeable.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  CONTROL_SEED: '16061'

jobs:
  preflight:
    name: V17.2 causal decomposition preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V17.2
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v172_mass_preserving_exchangeable.py
          python -m py_compile scripts/run_v172_reporting_compat.py
          python -m py_compile scripts/summarize_v172_mass_preserving.py
      - name: Prove mass preservation and identical graph initialization
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        run: |
          python - <<'PY'
          import random
          import numpy as np
          import tensorflow as tf
          from scripts import train_v172_mass_preserving_exchangeable as v
          from scripts import train_v171_controlled_assignment_ab as v171
          assert v.DEFAULT_SEED == 16061
          assert len(v.PERMUTATIONS) == 720
          labels=np.zeros((200,6),dtype=np.float32)
          labels[:100,0]=1; labels[:50,1]=1; labels[:24,2]=1; labels[:10,3]=1; labels[:4,4]=1; labels[:1,5]=1
          spec=v._weight_spec(labels,np.arange(len(labels)))
          for k,row in spec['mass']['proof_by_k'].items():
              assert abs(row['original_total_presence_coefficient_mass']-row['compressed_total_presence_coefficient_mass']) < 1e-9, (k,row)
          def build(arm):
              tf.keras.backend.clear_session()
              random.seed(16161); np.random.seed(16161); tf.random.set_seed(16161)
              m,_,_=v._build_model(arm,spec)
              return m
          names=None; weights=None; params=None
          for arm in v.ARMS:
              m=build(arm)
              cur_names=[x.name for x in m.trainable_weights]
              cur_weights=[np.asarray(x.numpy()) for x in m.trainable_weights]
              if names is None:
                  names,weights,params=cur_names,cur_weights,m.count_params()
              else:
                  assert names == cur_names
                  assert params == m.count_params()
                  for i,(a,b) in enumerate(zip(weights,cur_weights)):
                      np.testing.assert_array_equal(a,b,err_msg=f'{arm} init mismatch {i}')
              assert m.get_layer('v160_global_reconciliation_attention') is not None
          rng=np.random.default_rng(7)
          yt=np.zeros((3,6,v171.SET_WIDTH),dtype=np.float32)
          yt[0,:1,0]=1; yt[1,:3,0]=1; yt[2,:5,0]=1
          yt[:,:,v171.SET_VALID_OFFSET]=yt[:,:,0]
          for r in range(3):
              for q in np.flatnonzero(yt[r,:,0]>.5):
                  yt[r,q,v171.SET_TIME_OFFSET+(r+q)%23]=1
                  yt[r,q,v171.SET_CANDIDATE_OFFSET+(r+3*q)%48]=1
          yp=np.zeros_like(yt)
          yp[:,:,0]=rng.uniform(.05,.95,size=(3,6))
          yp[:,:,v171.SET_VALID_OFFSET]=1
          t=rng.uniform(.01,1,size=(3,6,23)).astype(np.float32); t/=t.sum(2,keepdims=True)
          c=rng.uniform(.01,1,size=(3,6,48)).astype(np.float32); c/=c.sum(2,keepdims=True)
          yp[:,:,v171.SET_TIME_OFFSET:v171.SET_CANDIDATE_OFFSET]=t
          yp[:,:,v171.SET_CANDIDATE_OFFSET:]=c
          lo=v._set_loss('mass_ordered',spec)
          lp=v._set_loss('mass_permutation',spec)
          a=np.asarray(lo.call(tf.constant(yt),tf.constant(yp)))
          b=np.asarray(lp.call(tf.constant(yt),tf.constant(yp)))
          assert np.all(b <= a + 1e-5)
          shuffled=yt[:,[2,0,5,1,4,3],:]
          np.testing.assert_allclose(
              np.asarray(lp.call(tf.constant(yt),tf.constant(yp))),
              np.asarray(lp.call(tf.constant(shuffled),tf.constant(yp))),
              rtol=1e-5,atol=1e-6,
          )
          print('params',params,'trainable_tensors',len(names),'V17.2 preflight OK')
          print('ranked',spec['ranked']['queries'])
          print('mass',spec['mass']['proof_by_k'])
          PY

  fold:
    name: V17.2 ${{ matrix.arm }} fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arm: [ranked_ordered, mass_ordered, mass_permutation]
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train V17.2 arm
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          out="model/v172-${{ matrix.arm }}-fold-${{ matrix.fold }}"
          mkdir -p "$out"
          python -B scripts/run_v172_reporting_compat.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --arm "${{ matrix.arm }}" \
            --seed "$CONTROL_SEED" \
            --output-dir "$out" \
            2>&1 | tee "$out/train.log"
      - name: Verify V17.2 protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm='${{ matrix.arm }}'; fold='${{ matrix.fold }}'
          pth=Path(f'model/v172-{arm}-fold-{fold}/report-fold-{fold}.json')
          r=json.loads(pth.read_text()); p=r['protocol']; v=r['v172']
          assert p['v172_mass_preserving_decomposition'] is True
          assert p['assignment_arm'] == arm
          assert p['v16_proposal_graph_unchanged'] is True
          assert p['shared_seed'] == 16061
          assert p['outer_fold_used_for_training'] is False
          assert p['outer_fold_used_for_epoch_selection'] is False
          assert p['presence_threshold_tuned'] is False and p['presence_threshold'] == 0.5
          assert p['fit_fold_only_sqrt_presence_weighting'] is True
          assert p['linear_equal_mass_weighting'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          for k,row in v['final_fit_weight_spec']['mass']['proof_by_k'].items():
              assert abs(row['original_total_presence_coefficient_mass']-row['compressed_total_presence_coefficient_mass']) < 1e-8, (k,row)
          if arm == 'ranked_ordered':
              assert p['ranked_query_weighting'] is True
              assert p['cardinality_conditioned_exchangeable_weighting'] is False
              assert p['permutation_invariant_set_matching'] is False
          elif arm == 'mass_ordered':
              assert p['ranked_query_weighting'] is False
              assert p['cardinality_conditioned_exchangeable_weighting'] is True
              assert p['permutation_invariant_set_matching'] is False
          else:
              assert p['cardinality_conditioned_exchangeable_weighting'] is True
              assert p['permutation_invariant_set_matching'] is True
              assert p['set_matching_permutations'] == 720
          key=f'v172_{arm}'
          g=r['strata']['aggregate'][key]['metrics']['global']
          print(arm,fold,'epochs',r['data']['selected_epochs'],'f1',g['f1'],'pred_ref',g['prediction_reference_ratio'],'k5',r['per_true_k']['5'][key]['exact'],'k6',r['per_true_k']['6'][key]['exact'])
          PY
      - name: Upload V17.2 fold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v172-${{ matrix.arm }}-fold-${{ matrix.fold }}
          path: model/v172-${{ matrix.arm }}-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: warn
          retention-days: 30

  summarize:
    name: Summarize V17.2 causal decomposition
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy<2.0'
      - name: Download all V17.2 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v172-*-fold-*
          path: model/v172-all
          merge-multiple: false
      - name: Aggregate V17.2
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p model/v172-summary
          python -B scripts/summarize_v172_mass_preserving.py \
            --input-dir model/v172-all \
            --output-dir model/v172-summary \
            2>&1 | tee model/v172-summary/summary.log
      - name: Verify V17.2 aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v172-summary/report.json').read_text())
          p=r['protocol']
          assert p['v172_three_arm_causal_decomposition'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_rows_all_arms'] is True
          assert p['same_seed'] == 16061
          assert p['same_threshold'] == 0.5
          assert p['fit_fold_only_sqrt_weighting'] is True
          assert p['locked12_indexed_or_evaluated'] is False
          print(json.dumps(r['comparison'],indent=2,sort_keys=True))
          PY
      - name: Upload V17.2 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v172-mass-preserving-causal-summary
          path: model/v172-summary
          if-no-files-found: warn
          retention-days: 30
