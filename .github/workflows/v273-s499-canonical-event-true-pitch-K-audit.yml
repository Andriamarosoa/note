name: S499 independent canonical note event Exact-K and pitch names evaluation against true sources
on:
  push:
    branches: [codex/s498-canonical-note-event-K-joint-graph]
    paths:
      - scripts/s499_score_canonical_musical_onsets_against_true_MIDI_XML.py
      - .github/workflows/v273-s499-canonical-event-true-pitch-K-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_independent_canonical_BasicPitch_birth_vs_original_S80_and_V88:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install only numerical scoring runtime, no source model retraining
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Verify canonical event matching and true note set comparison
        run: |
          python -m py_compile scripts/s499_score_canonical_musical_onsets_against_true_MIDI_XML.py
          python -m scripts.s499_score_canonical_musical_onsets_against_true_MIDI_XML --self-test
      - name: Restore source note groups from previous SHA-original audio-only freeze
        run: |
          gh run download 38590187399 \
            -n s498-true-S80-guitar-V88-piano-canonical-unique-musical-note-onset-groups-no-truth \
            -D model/S498 --repo "${{ github.repository }}"
      - name: Restore authentic 45 IDMT guitar true MIDI-supported XML attacks
        run: |
          gh run download 38570219836 \
            -n s488-original-IDMT-45-true-guitar-21-poly-BasicPitch-note-set-vs-S80-ExactK \
            -D model/S488 --repo "${{ github.repository }}"
      - name: Restore genuine 322 MAESTRO piano attack identities / note-name ground truth
        run: |
          gh run download 38560885111 \
            -n s476-MAESTRO-original-V88-K-new-onsets-vs-sounding-322-same-events-audit \
            -D model/S476 --repo "${{ github.repository }}"
      - name: Score all fixed canonical policies against real positive attack events only
        run: |
          python -u -m scripts.s499_score_canonical_musical_onsets_against_true_MIDI_XML \
            --graph model/S498 --report model/S498/report.json \
            --idmt model/S488/S488_45_TRUE_GUITAR_SOURCE_NOTESETS_PAIRED.jsonl \
            --idmt-report model/S488/report.json \
            --piano model/S476/S476_ORIGINAL_S470_PIANO_NEW_NOTE_VS_SOUNDING_322.jsonl \
            --piano-report model/S476/report.json --out model/S499
          python - <<'PY'
          import json
          r=json.load(open('model/S499/report.json'))
          assert r['status']=='S499_GUITAR_S80_PIANO_V88_CANONICAL_MUSICAL_K_AND_NOTES_PAIRED'
          assert r['source_native_candidate_aliases_not_extra_note_events']
          assert r['zero_label_based_training_or_threshold_selection']
          assert r['unknown_external_musical_groups_not_groundtruth_negatives']
          assert r['original_source_models_and_Live_and_offsets_unchanged']
          assert r['no_promotion']
          for k in ('guitar_S80','piano_V88'):
            assert 'BP_birth' in r['by_source'][k]['group_policies']
            assert 'joint_Kactive_softprior' in r['by_source'][k]['group_policies']
          print('S499 original all real source positive events checked for K loss and note identities')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s499-canonical-Knew-Kactive-soft-original-S80-V88-full-pitchset-eval
          path: model/S499/
          retention-days: 90
