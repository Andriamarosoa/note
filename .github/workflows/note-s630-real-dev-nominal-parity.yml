name: "S630 full 17 real DEV original K and note event vs batched ONNX"
on:
  push:
    branches: [codex/note-s630-batched-onnx-live-audit]
    paths:
      - '.github/workflows/note-s630-real-dev-nominal-parity.yml'
      - 'scripts/s630_validate_real_dev_batched.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-17dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen ONNX CPU only dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Seed original pinned 17 GuitarSet and URMP DEV sources only
        run: |
          python -m scripts.s615_seed_full_development --root data/S630_dev --dev-only
      - name: Extract SAME original 256-hop acoustics from each real recording
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.s615_prepare_multihop import prepare_one
          root=Path('data/S630_dev')
          songs=[s for s in json.loads((root/'protocol.json').read_text())['sources'] if s['split']=='dev']
          assert len(songs)==17
          for i,s in enumerate(songs,1):
              print(i,prepare_one(root,s,256),flush=True)
          PY
      - name: Quantify S613 full hybrid original per-frame event vs frozen ONNX batch4
        run: |
          python -m scripts.s630_validate_real_dev_batched \
            --root data/S630_dev --out results/S630_17_REAL_DEV_BATCH_4_PARITY.json
      - name: Assert fixed original canonical baseline and report any real variance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/S630_17_REAL_DEV_BATCH_4_PARITY.json').read_text())
          assert r['source_count']==17 and r['test_sources_read']==0
          assert r['status']=='S630_VALIDATED_FULL_ORIGINAL_17_DEV'
          assert (r['original_hybrid']['TP'],r['original_hybrid']['FP'],r['original_hybrid']['FN'])==(1241,734,838)
          print('S630_VERDICT',json.dumps(dict(
              all_nominal_events_identical=r['all_nominal_events_identical'],
              baseline=r['original_hybrid'],batch4=r['batch_four_hybrid'],
              max_p_difference=r['max_absolute_pitch_probability_difference'],
              max_K_difference=r['max_absolute_count_probability_difference'],
              original_K=r['original_grouped_K'],
              batch_K=r['batched_grouped_K']),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s630-full-frozen-s613-batched-4-real-17dev-parity
          path: results/S630_17_REAL_DEV_BATCH_4_PARITY.json
          retention-days: 30
