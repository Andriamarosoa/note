name: S540 prospective five piano 49-pitch acoustic onset features at all V88 K0-K6 frozen source times PREMIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s540_five_new_source_per_pitch_49x11_features_PREMIDI.py
      - .github/workflows/v273-s540-raw49-original-five-composer-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_unseen_piano_prelabeled_49_pitch_acoustic_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install raw 49-note and harmonic source features
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2
      - name: Test raw spectral feature ABI without MIDI
        run: |
          python -m py_compile scripts/s540_five_new_source_per_pitch_49x11_features_PREMIDI.py
          python -m scripts.s540_five_new_source_per_pitch_49x11_features_PREMIDI --self-test
      - name: Restore SHA-pinned preselected five new composer names and original V88 event predictions
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656509448 -n s538-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S538 --repo "${{ github.repository }}"
          gh run download 38656730774 -n s539-five-new-composers-BasicPitch-fixed-original-note-predictions-PREMIDI -D model/S539 --repo "${{ github.repository }}"
      - name: Verify source whole WAV SHA from S538 and extract original all V88 K0 note physics without opening MIDI
        run: |
          python -u -m scripts.s540_five_new_source_per_pitch_49x11_features_PREMIDI \
            --manifest model/S537/report.json \
            --v88 model/S538/S538_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S538/report.json \
            --bp model/S539/S539_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --bp-report model/S539/report.json --out model/S540
          python - <<'PY'
          import json
          r=json.load(open('model/S540/report.json'))
          assert r['status']=='S540_PRELABEL_FIVE_NEW_PIANO_ALL_V88_RAW_49_PITCH_FEATURES'
          assert len(r['per_recording'])==5
          assert r['original_V88_onset_candidates']>0
          assert r['real_audio_piano_five_source_WAV_SHAs_verified']
          assert r['all_49_pitch_features_at_every_piano_V88_event']
          assert r['no_original_true_MIDI_annotation_read'] and r['no_promotion']
          print('S540 SUCCESS five composer 49x11 acoustic NOTE_ON pitch features preMIDI sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s540-five-composers-original-V88-all-event-49x11-WAV-physical-pitch-features-preMIDI
          path: model/S540/
          retention-days: 90
