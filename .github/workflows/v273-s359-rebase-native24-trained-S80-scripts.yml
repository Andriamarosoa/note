name: S359 rebuild exact original trained S80 Python source stages to prospective 24 chords without XML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s359_deterministic_rebase_original_S80_stages_24_IDMT.py'
      - '.github/workflows/v273-s359-rebase-native24-trained-S80-scripts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s359-preXML-source-twenty-real-model-rebase
  cancel-in-progress: true
jobs:
  deterministic_source_provenance_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Compile ALL 20 faithfully rebased historical S80 stages with fake dimensions first WITHOUT XML or models
        run: |
          python -u -m scripts.s359_deterministic_rebase_original_S80_stages_24_IDMT \
            --test-n 1234 --source-root scripts --out model/S359compile
          python - <<'PY'
          import json
          r=json.load(open('model/S359compile/generation_report.json'))
          assert len(r['derived_stage_source_proofs'])==20
          assert r['new_native_event_count']==1234
          assert not r['annotation_XML_opened']
          assert not r['model_fit_or_checkpoint_tuning']
          print('S359 PASS all twenty original native S80 replay scripts compile under arbitrary native dimension')
          PY
      - name: Require real original official freeze predictions on all 24 prospectively preregistered WAVs SHA-locked
        run: |
          gh run watch 38330563316 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38330563316 \
            -n s358-24-new-IDMT-dataset1-chords-original-V88-official-PREXML \
            -D model/S358 --repo ${{ github.repository }}
      - name: Seal deterministic generated Python sources and original source SHA for EXACT model-event count (XML still UNREAD)
        run: |
          python -u -m scripts.s359_deterministic_rebase_original_S80_stages_24_IDMT \
            --s358 model/S358/S358_official_V88_dataset1_prospective_24_WAV_predictions.npz \
            --report model/S358/report.json \
            --source-root scripts \
            --out model/S359
          python - <<'PY'
          import json
          r=json.load(open('model/S359/generation_report.json'))
          assert len(r['derived_stage_source_proofs'])==20
          assert r['new_original_WAV_count']==24
          assert not r['annotation_XML_opened']
          assert not r['model_fit_or_checkpoint_tuning']
          print('S359 PASS exact original source maps 24 WAV SHA frozen stage inputs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s359-IDMT-original-20trained-S80-source-stages-rebased-to-24-WAV-PREXML
          path: model/S359/
          retention-days: 90
