name: V27.3 selector contract and coherent decision experiment

on:
  push:
    branches: [codex/v273-selector-contract-repair]
    paths:
      - 'scripts/v273_selector_contract.py'
      - 'scripts/learn_v273_coherent_selector.py'
      - 'scripts/evaluate_v273_selector_repair.py'
      - 'test/test_v273_selector_contract.py'
      - 'test/test_v273_coherent_selector.py'
      - '.github/workflows/v273-selector-contract-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        arm: [legacy, contracts, coherent]
    name: "Selector repair: ${{ matrix.arm }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install original experimental ML versions
        run: |
          python -m pip install -r requirements-train.txt
          python -m pip install scipy==1.17.1 scikit-learn==1.4.2
      - name: Verify producer separation, contracts and real neural gradients
        run: |
          python -m unittest -v test.test_v273_selector_contract test.test_v273_coherent_selector
      - name: Retrieve archived complete selector and native cohort
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37758789956
          name: v273-audit-aware-selection-both
          path: model/selector-repair/reference
      - name: Retrieve aligned harmonic feature rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37740493178
          pattern: v273-harmonic-global-fold-*
          path: model/selector-repair/features
      - name: Train and evaluate four recording-disjoint exposed folds
        run: |
          python -m scripts.evaluate_v273_selector_repair \
            --reference model/selector-repair/reference/predictions-and-selected-combinations.npz \
            --features model/selector-repair/features \
            --arm ${{ matrix.arm }} \
            --output model/selector-repair-${{ matrix.arm }}
      - name: Append measured native results
        run: cat model/selector-repair-${{ matrix.arm }}/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-selector-repair-${{ matrix.arm }}
          path: model/selector-repair-${{ matrix.arm }}/
          retention-days: 90
