name: S124 verify deduplicated research workflow triggers
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s124_github_workflow_dedup_audit.py'
      - 'analysis/workflow_dedup_manifest.json'
      - '.github/workflows/v273-s124-dedup-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 40 historic duplicate triggers removed
        run: python scripts/s124_github_workflow_dedup_audit.py
