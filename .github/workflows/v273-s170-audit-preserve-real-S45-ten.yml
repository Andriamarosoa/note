name: S170 independently audit positive S45 ten-source action and SHA-archive S163-S170 proofs
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s170_audit_S45_ten_family_accepted_action.py'
      - '.github/workflows/v273-s170-audit-preserve-real-S45-ten.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: s170-audit-preserve-S45-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit_and_preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s170_audit_S45_ten_family_accepted_action --self-test
      - name: Original real S45 5/16 research-only outputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198248491
          name: v273-s163-five-of-sixteen-original-S45-family-Ridge-95-models-GOAT
          path: evidence/S163
      - name: Original 5-family negative-risk independent diagnostic
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198578807
          name: v273-s165-original-S45-five-family-frozen-negative-risk-explanation
          path: evidence/S165
      - name: 3 additional original S19 S20 S27 trained recurrent source predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198716623
          name: v273-s166-authentic-trained-S19-S20-S27-recurrent-sources-newGOAT
          path: evidence/S166
      - name: Original 8 family Ridge risks
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198877007
          name: v273-s167-eight-of-sixteen-genuine-source-original-S45-152-Ridge-risks
          path: evidence/S167
      - name: 2 original S24 S25 B-first source families
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38199078698
          name: v273-s168-original-S24-S25-Bfirst-trained-source-producers-GOAT
          path: evidence/S168
      - name: Original 10 family 190 genuine Ridge fit results
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38199247838
          name: v273-s169-ten-of-sixteen-original-S45-source-190-original-ridge-models
          path: evidence/S169
      - name: Independently replay S169 risk decision and identify positive source
        run: |
          set -euo pipefail
          python -m scripts.s170_audit_S45_ten_family_accepted_action \
            --input evidence/S169/ten_source_S45_original_ridge_GOAT.npz \
            --out evidence/S170/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/S169/report.json').read_text())
          b=json.loads(Path('evidence/S170/report.json').read_text())
          assert a['original_family_source_count']==10
          assert a['original_family_specific_Ridge_fits_verified']==190
          assert a['S45_partial_K_changed_vs_S18']==1
          assert b['accepted_action_count']==1
          assert b['original_missing_source_families']==6
          assert not b['GOAT_MIDI_or_trueK_used']
          assert not b['S80_promoted'] and not a['official_S80_promotion']
          print('S170 original S45 1 selected action verified without labels')
          PY
      - name: Preserve SHA-256 evidence and original risk model sources references
        run: |
          set -euo pipefail
          mkdir -p model/S170
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > model/S170/FILES_SHA256SUMS
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf model/S170/v273-S163-S170-real-trained-partial-S45-GOAT-evidence.tar.gz evidence
          (cd model/S170 && sha256sum v273-S163-S170-real-trained-partial-S45-GOAT-evidence.tar.gz > BUNDLE_SHA256)
      - name: Permanent original-weight-derived evidence prerelease, explicitly NOT S80
        env:
          GH_${{ github.token }}: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v273-S163-S170-real-original-S45-10of16-GOAT-research'
          if gh release view "$TAG" --repo "$GITHUB_${{ github.repository }}SITORY" >/dev/null 2>&1; then
            echo 'Immutable research release already exists, refusing to overwrite'
            exit 1
          fi
          gh release create "$TAG" \
            model/S170/v273-S163-S170-real-trained-partial-S45-GOAT-evidence.tar.gz \
            model/S170/FILES_SHA256SUMS model/S170/BUNDLE_SHA256 \
            --repo "$GITHUB_${{ github.repository }}SITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'S163-S170 10/16 original S45 trained producers + 190 Ridge fits, NO S80 PROMOTION' \
            --notes 'Label-blind research-only evidence: original trained S19 S20 S24 S25 S27 S11 S12 S38 S40 S41 model sources, 190 original S45 fitted Ridge checkpoints, 10-of-16 source agreement, one risk-selected action on GOAT, not proven corrected. Remaining six producers and original S5 upstream missing. No independent S80 Exact-K score. freeze_local_combo remains official.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s170-original-ten-family-risk-proof-SHA-archive-receipt
          path: |
            model/S170/FILES_SHA256SUMS
            model/S170/BUNDLE_SHA256
            evidence/S170/report.json
          retention-days: 90
