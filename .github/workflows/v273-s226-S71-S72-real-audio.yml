name: S226 forward original S71 S72 recovered checkpoint models on native GOAT WAV
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s226_original_S71_S72_frozen_on_GOAT.py'
      - '.github/workflows/v273-s226-S71-S72-real-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s226-real-original-S71-S72-${{ github.ref }}
  cancel-in-progress: true
jobs:
  execute_original_risk_models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original trained S71 and S72 model inference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: S69 original historic veto and true native S18 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38295588099
          name: s221-original-S69-veto-fourfold-no-fold-oracle
          path: model/S221
      - name: S70 four genuine frozen logistic heads new WAV decisions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38296662215
          name: s223-original-S70-four-frozen-models-GOAT-foldfree
          path: model/S223
      - name: Original GOAT acoustic 58, 42x49 PR16 trajectory, exact native timestamps
        run: test -s analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz
      - name: Recover original four S71 trained risk heads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38296880555
          name: s224-original-four-S71-acoustic-risk-checkpoints-historic-exact
          path: model/S224
      - name: Recover original four S72 trained temporal risk heads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38297080728
          name: s225-recovered-original-S72-four-temporal-risk-checkpoints
          path: model/S225
      - name: Execute original S71 S72 frozen trained-model stage on new WAV audio, fold neutral
        run: >-
          python -m scripts.s226_original_S71_S72_frozen_on_GOAT
          --s69 model/S221/original_S69_fourfold_rule_consensus.npz
          --s70 model/S223/original_S70_4fold_no_oracle_GOAT.npz
          --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz
          --s71 model/S224 --s72 model/S225 --out model/S226
      - name: Verify model source completeness and all four original S72 domains
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np
          r=json.loads(Path('model/S226/report.json').read_text())
          assert r['events']==57 and r['real_original_model_count']==8
          assert r['model_S71_count']==r['model_S72_count']==4
          assert r['original_S71_input_width']==119 and r['original_S72_input_width']==465
          assert r['label_free_S82_geom46_recomputed']
          assert not r['labels_read'] and not r['new_models_trained'] and not r['S80_promoted']
          with np.load('model/S226/original_S71_S72_new_WAV_foldfree.npz',allow_pickle=False) as z:
            assert z['original_pr16_geometry46'].shape==(57,46)
            for name in ('s72_risk_all_K','s72_risk_poly_guard_K','s72_poly_all_K','s72_poly_poly_guard_K'):
              assert z[name].shape==(57,) and np.isin(z[name],range(7)).all()
          print('S226 PASS genuine 8 trained S71/S72 models, original acoustic geometry, no labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s226-original-S71-S72-frozen-models-new-WAV-GOAT
          path: model/S226/
          retention-days: 90
