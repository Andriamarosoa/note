name: GuitarSet contour format

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/guitarset-contour-format.yml"
      - "scripts/inspect_guitarset_contour_format.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore official GuitarSet cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
      - name: Inspect pitch contour serialization
        run: python -B scripts/inspect_guitarset_contour_format.py
