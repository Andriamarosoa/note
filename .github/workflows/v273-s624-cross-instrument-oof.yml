name: S624 source blocked native NOTE event-head audit URMP Guitar
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s624_cross_domain_oof_event_gate.py
      - .github/workflows/v273-s624-cross-instrument-oof.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  held_compositions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original NOTE native dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Event pairing and live architecture tests
        run: python -m unittest -v test.test_s619_event_gate test.test_strict_live
      - name: Eight composition folds across real URMP GuitarSet dev
        run: python -m scripts.s624_cross_domain_oof_event_gate --out /tmp/S624
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S624-multisource-composition-oof-only
          path: /tmp/S624/
          if-no-files-found: warn
          retention-days: 60
