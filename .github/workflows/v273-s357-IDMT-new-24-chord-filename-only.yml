name: S357 preregister 24 completely new IDMT Dataset1 chord filename groups BEFORE XML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s357_prelabel_24_new_IDMT_dataset1_chord_families.py'
      - '.github/workflows/v273-s357-IDMT-new-24-chord-filename-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s357-24-chord-WAV-XML-name-only
  cancel-in-progress: true
jobs:
  filename_precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Retrieve original already committed WAV/XML ZIP filename-only manifest S276
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
      - name: Read only ZIP central-directory names, exclude first 12 known XML-open chord families and SHA-seal 24 other filename families
        run: |
          python -u -m scripts.s357_prelabel_24_new_IDMT_dataset1_chord_families \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S357
          python - <<'PY'
          import json
          x=json.load(open('model/S357/report.json'))
          assert x['new_unseen_WAV_count']==len(x['next_twentfour'])==24
          assert x['previous_12_filename_family_hard_excluded']
          assert len(set(z['composition_family_from_filename_only'] for z in x['next_twentfour']))==24
          assert not x['all_XML_annotation_contents_read']
          assert not x['all_WAV_contents_read']
          assert not x['official_promotion']
          print('S357 PASS future 24 first WAV selection fully preregistered before any WAV/XML read')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s357-original-IDMT-dataset1-24-new-chord-WAV-XML-NAMES-PREXML
          path: model/S357/
          retention-days: 90
