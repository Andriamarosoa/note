name: S386 genuine new32 original V88 acoustic S97 58D and S5 527D prelabel features
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - '.github/workflows/v273-s386-Dataset2-new32-original-S97-S5-owned527.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s386-new32-genuine-original-source-S97-527
  cancel-in-progress: true
jobs:
  authentic_original_S97_S5_views_for_32_new_WAVs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Reuse new WAV official true native V88 prelabel rows plus S385 SHA authenticated original model source scripts
        run: |
          gh run watch 38336530561 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38336530561 \
            -n s384-32-new-Dataset2-IDMT-original-V88-source-only-PREXML \
            -D model/S384 --repo ${{ github.repository }}
          gh run download 38336365196 \
            -n s383-32-more-Dataset2-original-SHA-WAV-XML-NAMES-NEVER-READ \
            -D model/S383 --repo ${{ github.repository }}
          gh run watch 38336828058 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38336828058 \
            -n s385-new32-original-S5-S8-S18-five-original-trained-modules-PREXML \
            -D model/S385 --repo ${{ github.repository }}
          N=$(python -c "import json; print(json.load(open('model/S385/report.json'))['N'])")
          for src in model/S385/*.py; do cp "$src" "scripts/$(basename "$src" | sed "s/_964/_${N}/g")"; done
          echo "N=$N" >> "$GITHUB_ENV"
          test -s "scripts/s306_original_IDMT_dataset2_${N}_S97_native_views.py"
      - name: Original acoustic S97 58D+245D+490D+294D genuine WAV features on exact S384 events
        run: |
          python -u -m "scripts.s306_original_IDMT_dataset2_${N}_S97_native_views" \
            --s384 model/S384/S384_official_V88_dataset2_new32_WAV_predictions.npz \
            --s384report model/S384/report.json \
            --s383 model/S383/report.json \
            --out model/S306
          python - <<'PY'
          import json,numpy as np
          j=json.load(open('model/S306/report.json'))
          assert j['WAV_count']==32 and j['events']>0
          assert not j['annotation_XML_MIDI_read']
          with np.load('model/S306/S306_IDMT_dataset2_original_S97_on_frozen_native_events.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(j['events'],58)
            assert z['flow245'].shape==(j['events'],245)
            assert z['morphology490'].shape==(j['events'],490)
          print('S386 S97 SHA source first 32 new true audio tracks, NO labels')
          PY
      - name: Original S5 owned527 feature constructor and original PR16 ownership46 from SAME native V88 event IDs
        run: |
          python -u -m "scripts.s307_original_S5_527D_IDMT_dataset2_${N}" \
            --s306 model/S306/S306_IDMT_dataset2_original_S97_on_frozen_native_events.npz \
            --s384 model/S384/S384_official_V88_dataset2_new32_WAV_predictions.npz \
            --out model/S307
          python - <<'PY'
          import json,numpy as np
          j=json.load(open('model/S307/report.json'))
          assert j['WAV_count']==32 and j['original_feature_width']==527
          assert j['no_XML_or_MIDI_contents_read']
          with np.load('model/S307/S307_IDMT_dataset2_true_original_S5_527D_input.npz',allow_pickle=False) as z:
            assert z['original_S5_input_owned527'].shape==(j['native_events'],527)
          print('S386 PASS true original 527D S5 source, 32 original WAVs, original SHA unchanged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s386-new32-original-IDMT-dataset2-S97-527D-source-authentic-preXML
          path: |
            model/S306/
            model/S307/
          retention-days: 90
