name: V27.3 Candidate Hidden1 Multi-Fold Validation

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-candidate-hidden1-multifold-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-candidate-hidden1-multifold
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-candidate-hidden1-multifold-${{ github.run_id }}

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        val_fold: [0, 1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate worker
        run: python -m py_compile scripts/audit_v273_candidate_hidden1_multifold_worker.py

      - name: Restore frozen shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/reuse
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          test -f model/bundle/bundle.json

      - name: Restore exact fold-0 internal checkpoints
        if: matrix.val_fold == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v273-inner-candidate-hidden1-audit-37247417133             --repo "${{ github.repository }}"             --pattern v273-inner-candidate-hidden1-audit-result.tgz             --dir model/download
          tar -xzf model/download/v273-inner-candidate-hidden1-audit-result.tgz -C model/reuse
          test -f model/reuse/inner_uniform.weights.h5
          test -f model/reuse/inner_freeze_local_combo.weights.h5

      - name: Run rotating internal fold audit
        shell: bash
        run: |
          EXTRA=()
          if [ "${{ matrix.val_fold }}" = "0" ]; then
            EXTRA+=(--reuse-uniform-weights model/reuse/inner_uniform.weights.h5)
            EXTRA+=(--reuse-freeze-weights model/reuse/inner_freeze_local_combo.weights.h5)
          fi
          python -B scripts/audit_v273_candidate_hidden1_multifold_worker.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --val-fold "${{ matrix.val_fold }}"             --output "model/fold-${{ matrix.val_fold }}"             "${EXTRA[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-candidate-hidden1-fold-${{ matrix.val_fold }}
          path: model/fold-${{ matrix.val_fold }}/
          retention-days: 90

  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: v273-candidate-hidden1-fold-*
          path: model/folds

      - name: Summarize strict multi-fold stability
        run: |
          python -B scripts/summarize_v273_candidate_hidden1_multifold.py             --input-root model/folds             --output model/summary

      - name: Publish multi-fold audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-candidate-hidden1-multifold-folds.tgz -C model/folds .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 candidate_hidden1 multi-fold internal validation"             --notes-file model/summary/report.md
          gh release upload "$TAG"             model/summary/report.json             model/summary/report.md             model/v273-candidate-hidden1-multifold-folds.tgz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-candidate-hidden1-multifold-summary
          path: model/summary/
          retention-days: 90
