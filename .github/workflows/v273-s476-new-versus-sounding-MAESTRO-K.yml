name: S476 piano source K true-new-notes vs held-sounding MIDI labels ablation on same frozen V88
on:
  push:
    branches: [codex/s476-maestro-newnotes-vs-activeK]
    paths:
      - scripts/s476_compare_MAESTRO_newnote_K_vs_sounding_K_same_V88.py
      - .github/workflows/v273-s476-new-versus-sounding-MAESTRO-K.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrospective_check_that_different_instruments_share_exactK_truth_definition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore real MIDI decoder and original numeric library
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test piano sounding chord K versus newly struck MIDI K scientific distinction
        run: |
          python -m py_compile scripts/s476_compare_MAESTRO_newnote_K_vs_sounding_K_same_V88.py
          python -m scripts.s476_compare_MAESTRO_newnote_K_vs_sounding_K_same_V88 --self-test
      - name: Restore frozen real original V88 outputs and read-only third source official preregistration
        run: |
          gh run download 38559067956 \
            -n s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI \
            -D model/S470 --repo ${{ github.repository }}
          gh run download 38558629021 \
            -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI \
            -D model/S469 --repo ${{ github.repository }}
      - name: Restore independent third corpus S471 322 exact MIDI matched note rows
        run: |
          gh run download 38559667980 \
            -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze \
            -D model/S471 --repo ${{ github.repository }}
      - name: Score exactly same frozen V88 events with new-onset K and sounding-K separately
        run: |
          python -u -m scripts.s476_compare_MAESTRO_newnote_K_vs_sounding_K_same_V88 \
            --frozen model/S470/S470_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --frozen-report model/S470/report.json \
            --manifest model/S469/report.json \
            --s471 model/S471/S471_POSTFREEZE_REAL_PIANO_MIDI_MATCHED_ONSETS.jsonl \
            --s471-report model/S471/report.json \
            --out model/S476
          python - <<'PY'
          import json
          r=json.load(open('model/S476/report.json'))
          assert r['status']=='S476_THIRD_MAESTRO_PIANO_NEW_ONSET_K_VS_SUSTAINING_K_READONLY'
          assert r['matched_onsets']==322
          assert r['original_soundK_exact']==24 and r['original_soundK_poly_exact']==6
          assert r['zero_S80_replay_asserted'] and r['no_promotion']
          assert r['original_V88_predicted_K_unchanged']
          print('S476 same frozen model K compared to two true-pitch counting definitions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s476-MAESTRO-original-V88-K-new-onsets-vs-sounding-322-same-events-audit
          path: model/S476/
          retention-days: 90
