name: S410 held-song LONG NOTE offset rescue independent train-only gate
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s410_long_note_offset_expert_train_only_gate.py'
      - '.github/workflows/v273-s410-long-note-offset-trainonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s410-long-note-trainonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  four_song_disjoint_offset_gate_experts:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Validate frozen note-only S408 correction feature shape and safety
        run: |
          python -m py_compile scripts/s410_long_note_offset_expert_train_only_gate.py
          python -u -m scripts.s410_long_note_offset_expert_train_only_gate --self-test
      - name: Recover S408 verified 33475 note onset pitch offset predictions
        run: |
          gh run download 38371603686 -n s408-real-note-offsets-pitch-conditioned-S80-S402-S407-songheld-NOPROMOTION -D model/S408 --repo ${{ github.repository }}
          test -f model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz
      - name: Retrieve original GuitarSet note_midi for training-only nested held-fold + final score
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 2 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Train four S410 experts, freeze thresholds via INNER composition-only validation
        run: |
          python -u -m scripts.s410_long_note_offset_expert_train_only_gate \
            --source model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S410
          python - <<'PY'
          import json
          a=json.load(open('model/S410/report.json'))
          assert a['status']=='S410_S408_LONG_NOTE_OFFSET_EXPERT_HELD_COMPOSITION'
          assert a['count_and_note_references_untouched']
          assert a['no_held_song_target_for_fitting_or_threshold']
          assert a['measured_S410']['note_onset_pitch_matched']==25120
          assert all(x['composition_overlap']==0 for x in a['fold_proofs'])
          assert len(a['fold_proofs'])==4 and a['official_promotion'] is False
          print('S410 genuine complete note Offset test; compare S408 baseline and S410')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s410-real-GuitarSet-song-disjoint-long-note-offset-rescue-NOPROMOTION
          path: model/S410/
          retention-days: 90
