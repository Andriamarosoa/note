name: S498 canonical one musical onset per note birth graph, original S80 soft K prior no MIDI
on:
  push:
    branches: [codex/s498-canonical-note-event-K-joint-graph]
    paths:
      - scripts/s498_canonical_musical_note_birth_graph_no_annotations.py
      - .github/workflows/v273-s498-canonical-musical-graph-premidi.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  canonical_birth_events_with_original_K_prior:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install original graph matching and numeric ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Test source spectral duplicate collapse but preserve genuine repeated-pitch new attacks
        run: |
          python -m py_compile scripts/s498_canonical_musical_note_birth_graph_no_annotations.py
          python -m scripts.s498_canonical_musical_note_birth_graph_no_annotations --self-test
      - name: Restore immutable original S80 guitar and V88 piano native K events before labels
        run: |
          gh run download 38576329909 \
            -n s491-true-guitar-S80-and-piano-V88-K0only-BasicPitch-one-to-one-frozen-NOXML \
            -D model/S491 --repo "${{ github.repository }}"
      - name: Restore independent real audio note names from before external XML or MIDI opened
        run: |
          gh run download 38569589535 \
            -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML \
            -D model/S487 --repo "${{ github.repository }}"
          gh run download 38568724837 \
            -n s485-spotify-basicpitch-3-original-MAESTRO-piano-audio-to-notes-frozen-PREMIDI \
            -D model/S485 --repo "${{ github.repository }}"
      - name: Produce independent source-originated canonical note birth groups with true source K used only as prior
        run: |
          python -u -m scripts.s498_canonical_musical_note_birth_graph_no_annotations \
            --s491 model/S491 --s491report model/S491/report.json \
            --s487 model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --s487report model/S487/report.json \
            --s485 model/S485/S485_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --s485report model/S485/report.json --out model/S498
          python - <<'PY'
          import json
          r=json.load(open('model/S498/report.json'))
          assert r['status']=='S498_TWO_SOURCE_CANONICAL_NOTE_ONSET_GRAPH_SOURCE_K_AS_SOFT_PRIOR_PRELABEL'
          assert r['one_independent_pitch_birth_group_exactly_one_canonical_note_event']
          assert r['Knew_and_Kactive_independently_reported']
          assert r['source_no_original_S80_or_V88_changes']
          assert r['no_original_MIDI_XML_annotations_read_in_canonical_model']
          assert r['no_training_no_promotion']
          for corpus in ('guitar_S80','piano_V88'):
            assert r['source_summaries'][corpus]['canon_birth_event_ids_unique']
          print('S498 canonical notes generated no XML or MIDI, legacy source K files unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s498-true-S80-guitar-V88-piano-canonical-unique-musical-note-onset-groups-no-truth
          path: model/S498/
          retention-days: 90
