name: S280 four ORIGINAL trained S5 fold models on 506 native IDMT dataset3 rows
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s280_original_S5_fourfold_on_506_dataset3.py'
      - '.github/workflows/v273-s280-IDMT-dataset3-original-S5-fours.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s280-real-original-s5-on-dataset3-native
  cancel-in-progress: true
jobs:
  four_immutable_original_heldfold_S5_checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original S5 joblib/sklearn binary version
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Download original S5 training checkpoints, verified SHA256
        run: |
          set -euo pipefail
          for f in 0 1 2 4; do
            mkdir -p "model/S5original/fold$f"
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/Andriamarosoa/note/7165e1ef54510aa9effc9f597b2783c832ca907a/analysis/evidence/v273-open-k0-k6/series5/models/fold$f/model.joblib" \
              -o "model/S5original/fold$f/model.joblib"
          done
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_v273_s5_owned527_recovery import FOLDS,MODEL_DIGEST,digest
          for f in FOLDS:
            assert digest(Path(f'model/S5original/fold{f}/model.joblib'))==MODEL_DIGEST[f]
          print('S280 ORIGINAL S5 trained checkpoint hashes all verified')
          PY
      - name: Download S279 original S5 527D inputs on 506 original V88 events
        run: |
          gh run download 38319535537 \
            -n s279-IDMT-dataset3-506-original-527D-S5-input-no-labels \
            -D model/S279 --repo ${{ github.repository }}
      - name: Predict original 4 held fold S5 checkpoints without opening XML
        run: |
          python -u -m scripts.s280_original_S5_fourfold_on_506_dataset3 \
            --s279 model/S279/S279_IDMT_dataset3_true_original_S5_527D_input.npz \
            --models model/S5original --out model/S280
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S280/report.json'))
          assert r['original_native_reference_event_count']==506
          assert r['original_trained_S5_fold_count']==4
          assert r['original_fold_models_never_retrained']
          assert not r['unseen_IDMT_XML_MIDI_contents_read']
          assert not r['official_S80_promotion']
          with np.load('model/S280/original_S5_fourfold_506_dataset3_native_unlabelled.npz',allow_pickle=False) as z:
            assert z['original_S5_raw_probability_by_fold'].shape==(4,506,7)
            assert z['original_S5_prior_probability_by_fold'].shape==(4,506,7)
            assert z['original_S5_K_by_fold'].shape==(4,506)
          print('S280 PASS four genuine source S5 original models on 506 new IDMT native events')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s280-IDMT-dataset3-506-original-4S5-trained-folds-no-XML
          path: model/S280/
          retention-days: 90
