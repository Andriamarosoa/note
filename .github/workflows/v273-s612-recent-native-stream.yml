name: S612 recent NOTE S569 S578 S585 streaming fidelity
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - 'src/causal_note/recent_*.py'
      - 'scripts/live_recent_notes.py'
      - 'scripts/note_runtime.py'
      - 'scripts/s612*'
      - 'test/test_recent_native.py'
      - '.github/workflows/v273-s612-recent-native-stream.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s612-recent-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recent_heads_and_selections:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen numerical ABI and original comparison scripts
        run: |
          python -m pip install -r requirements-live.txt mido==1.3.3
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Native feature, selection and preserved Live contracts
        run: |
          python -m unittest -v test.test_recent_native test.test_native_stream test.test_live_k_midi_bridge test.test_note_runtime_modes test.test_v273_harmonic_trajectory
          python -m scripts.note_runtime --mode recent-notes --status
      - name: Restore original trained heads and original audio-only ledgers
        run: python -m scripts.s612_restore_artifacts --out data/S612
      - name: Frozen outputs plus real URMP PCM, no fitting or threshold search
        run: python -u -m scripts.s612_validate_recent_stream --assets data/S612 --fetch-urmp --out logs/S612
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s612-recent-native-stream-parity-and-rolling-audit
          path: logs/S612/
          retention-days: 90
