name: Onset compiled PCM256 exact event parity
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Verified event integrity HGB run whose sealed predictions are reproduced
        required: true
        default: '39915038301'
permissions: {contents: read, actions: read}
concurrency:
  group: onset-compiled-parity256-${{ github.ref }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  verify_compiled_outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned compiler and validate exact arithmetic
        run: |
          python -m pip install -r requirements-onset256.txt
          python -m unittest discover -s tests -v
      - name: Download original signed models, WAVs and sealed reference outputs
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          mkdir -p /tmp/compiled_inputs/{risk,four,fp,s701,manifest,traces} /tmp/compiled_previous
          gh run download "$SOURCE_RUN" --repo Andriamarosoa/note --name ONSET_EVENT_INTEGRITY_HGB69_PCM256_PAIRED_AND_FRESH_REPLAY --dir /tmp/compiled_previous
          gh run download 39741883968 --repo Andriamarosoa/note --name ONSET_HARDNEGATIVE_HARMONIC_RESTRIKE_MLP69_NATIVE256_REAL_REPLAY --dir /tmp/compiled_inputs/risk
          gh run download 39759373185 --repo Andriamarosoa/note --name ONSET_FN_RECOVERY_FOUR_NEURAL_HEADS_TRAINED256_AND_REAL_WAV --dir /tmp/compiled_inputs/four
          gh run download 39775357133 --repo Andriamarosoa/note --name ONSET_FP_69_70_74_SAME_TRAIN_NEURAL_PCM256_REAL_80WAV_ABLATION --dir /tmp/compiled_inputs/fp
          gh run download 39085408073 --repo Andriamarosoa/note --name S701_CAUSAL_ONSET_LEARNED_TRAIN_HELD_COMPOSITION --dir /tmp/compiled_inputs/s701
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/compiled_inputs/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/compiled_inputs/traces
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          rec=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())['guitar_archives']['GuitarSet_audio']
          with urllib.request.urlopen(rec['url'],timeout=180) as src,Path('/tmp/compiled_inputs/GuitarSet_audio.zip').open('wb') as out:
              for data in iter(lambda:src.read(2**20),b''):out.write(data)
          PY
      - name: Reproduce every sealed Onset event on 80 original WAVs with compiled weights
        run: |
          python -m scripts.validate_compiled_onset256 --root /tmp/compiled_inputs --previous /tmp/compiled_previous --out /tmp/compiled_result --workers 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ONSET_COMPILED_PCM256_EXACT_EVENT_PARITY
          path: /tmp/compiled_result/
          if-no-files-found: warn
          retention-days: 60
