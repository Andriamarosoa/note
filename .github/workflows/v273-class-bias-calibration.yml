name: V27.3 Class Bias Calibration

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-class-bias-calibration-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-class-bias-calibration
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-class-bias-calibration-${{ github.run_id }}

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate class-bias calibration contract
        run: |
          python -m py_compile scripts/calibrate_v273_class_bias.py
          python - <<'PY'
          import numpy as np
          from scripts.calibrate_v273_class_bias import fit_bias, softmax_logits
          p=np.array([[.7,.2,.1,0,0,0,0],[.1,.8,.1,0,0,0,0],[.2,.2,.6,0,0,0,0]],dtype=float)
          p[:,3:]=1e-8
          p/=p.sum(1,keepdims=True)
          y=np.array([0,1,2])
          b,q,h=fit_bias(p,y)
          assert b.shape==(7,) and np.isfinite(b).all()
          assert q.shape==p.shape and np.allclose(q.sum(1),1.0)
          print({'bias':b.tolist(),'iterations':len(h)})
          PY

      - name: Restore frozen bundle and outer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/best model/uniform
          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37217693737 \
            --repo "${{ github.repository }}" \
            --pattern v273-loss-weighting-targeted_k23_half_k4_quarter.tgz \
            --dir model/download
          tar -xzf model/download/v273-loss-weighting-targeted_k23_half_k4_quarter.tgz -C model/best

          gh release download v273-loss-weighting-37208199201 \
            --repo "${{ github.repository }}" \
            --pattern v273-loss-weighting-uniform.tgz \
            --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          test -f model/bundle/bundle.json
          test -f model/best/report.json
          test -f model/best/predictions.npz
          test -f model/uniform/report.json
          test -f model/uniform/predictions.npz

      - name: Fit class biases on inner fold and evaluate frozen outer
        run: |
          python -B scripts/calibrate_v273_class_bias.py \
            --bundle model/bundle \
            --config analysis/v273-native-paired-config.json \
            --best-outer model/best \
            --uniform-outer model/uniform \
            --output model/result

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "V27.3 class-bias calibration" \
            --notes-file model/result/report.md
          gh release upload "$TAG" \
            model/result/report.json \
            model/result/report.md \
            model/result/outer-class-bias-predictions.npz \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-class-bias-calibration
          path: model/result/
          retention-days: 90
