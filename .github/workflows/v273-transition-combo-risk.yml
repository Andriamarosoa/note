name: V27.3 Learned Source-Target Subset Risk Arbiter

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'scripts/learn_v273_transition_combo_risk.py'
      - 'scripts/evaluate_v273_transition_combo_risk.py'
      - 'test/test_v273_transition_combo_risk.py'
      - '.github/workflows/v273-transition-combo-risk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  train-transition-combinations:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install frozen exact-K ML dependencies
        run: |
          python -m pip install -r requirements-train.txt
          python -m pip install scipy==1.17.1 scikit-learn==1.4.2
      - name: Test real trainable subset gate and fold audit contract
        run: |
          python -m py_compile scripts/learn_v273_transition_combo_risk.py scripts/evaluate_v273_transition_combo_risk.py
          python -m unittest -v test.test_v273_transition_combo_risk
      - name: Retrieve source cohort
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37605163312
          name: yourmt3-exactk-cohort
          path: model/cohort
      - name: Retrieve audio features from outer folds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37740493178
          pattern: v273-harmonic-global-fold-*
          path: model/features
      - name: Learn K-initial K-proposed subset risks on crossfit training folds
        run: |
          python -B scripts/evaluate_v273_transition_combo_risk.py \
            --cohort model/cohort \
            --features model/features \
            --output model/transition-combo
      - name: Publish native K0-K6 results and per-selection audits
        run: cat model/transition-combo/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-source-target-subset-neural-audit
          path: model/transition-combo/
          retention-days: 90
