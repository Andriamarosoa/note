name: V27.3 S40 verify and archive temporal convolutional K2-K6 specialist
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series40-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure actual temporal CNN training and crossfold testing succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 37880762289 --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - name: Install original native modeling dependencies and torch
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recover original unmodified sound sequences for second forward inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Fetch S18 and four crossfold saved Conv1D models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37880762289 --repo "$GITHUB_REPOSITORY" --name v273-series40-temporal-cnn --dir model/S40
      - name: Independent 4x folded CNN re-inference and six exact-K posteriors audit
        run: >-
          python -m scripts.verify_v273_s40_temporal_cnn
          --features model/features
          --s18 model/S18/predictions.npz
          --input model/S40
          --output model/S40-verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series40-verified
          path: model/S40-verified/
          retention-days: 90
      - name: Preserve every K2-K6 correction and failure with 4 CNN weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series40-temporal-cnn.tar.gz -C model S40 S40-verified
          (cd model/archive && sha256sum v273-series40-temporal-cnn.tar.gz > SHA256SUMS)
          gh release create "v273-series40-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series40-temporal-cnn.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S40 genuine temporal-CNN polyphonic expert ${GITHUB_RUN_ID}" \
            --notes "Four 42-frame temporal convolutional K1-K6 specialists, six predeclared S18 variants, complete event-by-event corrections and regressions and independent forward-pass replay. H9 excluded, H8 masked. Development cohort already inspected; no auto-promotion."
