name: S269 historical frozen S69 fourfold rules on full reconstructed GuitarSet 59309
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s269_original_S69_fourfold_GuitarSet_59309.py'
      - '.github/workflows/v273-s269-original-S69-GuitarSet-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s269-original-59309-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay_frozen_S69:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Require S268 real original S46 193-policy fold-neutral 59309 branch inference success
        run: gh run watch 38314164725 --exit-status --interval 15
      - name: Obtain genuine original source from all 19 S46 expert branches and historical 36 PR16
        run: |
          gh run download 38314164725 -n s268-GuitarSet-original-S46-193foldneutral-59309 -D model/S268
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
          gh run download 38177948016 -n v273-s69-s46-risk-replay -D model/S69original
      - name: Run original historical S69 veto thresholds with exact S268 and real OOF PR16
        run: |
          python -u -m scripts.s269_original_S69_fourfold_GuitarSet_59309 \
            --s268 model/S268/S268_original_193_S46_foldneutral_59309_GUITARSET.npz \
            --pr16 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --rules model/S69original/report.json --out model/S269
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S269/report.json'))
          assert r['count']==59309 and not r['S80_promoted']
          with np.load('model/S269/S269_original_S69_fourfold_rule_consensus_GUITARSET.npz') as z:
            assert z['balanced_protected_K'].shape==(59309,)
            assert z['polymax_protected_K'].shape==(59309,)
          print('S269 PASS S69 original historical thresholds on newly reconstructed original GuitarSet fourfold source')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s269-GuitarSet-59309-original-S69-fourfold
          path: model/S269/
          retention-days: 90
