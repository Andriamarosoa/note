name: V10 spectral string-slot architecture

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v100_spectral_string_slots.py'
      - '.github/workflows/v100-spectral-string-slots.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  mine-spectral:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          set -o pipefail
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download matching V9.1 frozen cache shard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v91-cache
          gh run download 33600690679 --repo "$GITHUB_REPOSITORY" --name "v91-cache-${{ matrix.shard }}" --dir model/source-v91-cache
          count=$(find model/source-v91-cache -name 'v91-cache-shard-*.npz' | wc -l)
          echo "v91_cache_files=$count"
          test "$count" -eq 1
      - name: Compile V10
        env:
          PYTHONPATH: src
        run: python -m py_compile scripts/train_v100_spectral_string_slots.py
      - name: Mine time-frequency cache
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v100_spectral_string_slots.py mine \
            --cache-dir model/source-v91-cache \
            --shard-index ${{ matrix.shard }} \
            --output-dir model/v100-spectral/shard-${{ matrix.shard }} \
            2>&1 | tee model/v100-spectral-shard-${{ matrix.shard }}.log
      - name: Verify spectral shard
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json, pathlib, os
          s=os.environ['SHARD']
          p=pathlib.Path(f'model/v100-spectral/shard-{s}/report.json')
          d=json.loads(p.read_text())
          assert d['architecture']['runtime_inputs_use_annotations'] is False
          assert d['architecture']['string_labels_training_only'] is True
          assert d['data']['cluster_count'] > 0
          assert d['data']['slot_diagnostics']['occupancy_exact_count_match_fraction'] >= 0.99
          print('tracks', d['data']['track_count'], 'clusters', d['data']['cluster_count'], 'shape', d['cache']['spectral_shape'])
          PY
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload V10 spectral shard
        uses: actions/upload-artifact@v4
        with:
          name: v100-spectral-${{ matrix.shard }}
          path: |
            model/v100-spectral/shard-${{ matrix.shard }}/v100-spectral-shard-*.npz
            model/v100-spectral/shard-${{ matrix.shard }}/report.json
            model/v100-spectral-shard-${{ matrix.shard }}.log
          compression-level: 1
          if-no-files-found: error
          retention-days: 7

  train-eval:
    needs: mine-spectral
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          set -o pipefail
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download all spectral shards
        uses: actions/download-artifact@v4
        with:
          pattern: v100-spectral-*
          path: model/v100-spectral-merged
          merge-multiple: true
      - name: Verify spectral shard set
        shell: bash
        run: |
          set -o pipefail
          count=$(find model/v100-spectral-merged -name 'v100-spectral-shard-*.npz' | wc -l)
          echo "spectral_shards=$count"
          test "$count" -eq 8
          du -sh model/v100-spectral-merged
      - name: Download frozen V8.4/V8.6/V8.7/V8.8 and V9.1 report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v84 model/source-v86 model/source-v87 model/source-v88 model/source-v91
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          gh run download 33586296528 --repo "$GITHUB_REPOSITORY" --name v86-state-transition-proposal-pilot --dir model/source-v86
          gh run download 33588164652 --repo "$GITHUB_REPOSITORY" --name v87-causal-candidate-memory-pilot --dir model/source-v87
          gh run download 33589654195 --repo "$GITHUB_REPOSITORY" --name v88-regime-gated-moe-pilot --dir model/source-v88
          gh run download 33600690679 --repo "$GITHUB_REPOSITORY" --name v91-ordinal-full-train --dir model/source-v91
          test -f model/source-v91/v91-ordinal/result/report.json
      - name: Train V10 and evaluate locked12 once
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v100_spectral_string_slots.py train-eval \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --v91-report model/source-v91/v91-ordinal/result/report.json \
            --cache-dir model/v100-spectral-merged \
            --output-dir model/v100-spectral-result \
            2>&1 | tee model/v100-spectral-train.log
      - name: Verify isolation and summarize V10
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model/v100-spectral-result/report.json').read_text())
          a=d['architecture']; c=d['configuration']; data=d['data']; l=d['locked12']
          assert a['base_trainable'] is False
          assert a['runtime_inputs_use_annotations'] is False
          assert a['string_labels_training_only'] is True
          assert a['offset_stream_executed'] is False
          assert a['offset_weights_modified'] is False
          assert c['decode_mode_selected_on_locked_validation'] is False
          assert data['composition_group_leakage'] is False
          assert data['full_train_track_count'] == 240
          assert data['cache_shard_count'] == 8
          print('decode_mode', c['decode_mode'])
          print('epochs_ran', c['epochs_ran'])
          print('parameters', a['v100_trainable_parameters'])
          print('spectral_shape', a['spectral_map_shape'])
          print('cardinality', l['v100_cardinality'])
          print('string_slots', l['v100_string_slots'])
          for regime in ('global','solo','comp'):
              v88=l['frozen_v88_baseline_metrics'][regime]
              v91=l['v91_metrics'][regime]
              v10=l['v100_metrics'][regime]
              oracle=l['oracle_exact_cardinality_metrics'][regime]
              print(regime,
                    'v88', f"{v88['f1']:.6f}",
                    'v91', f"{v91['f1']:.6f}",
                    'v10', f"{v10['f1']:.6f}",
                    'delta_v91', f"{v10['f1']-v91['f1']:+.6f}",
                    'oracle', f"{oracle['f1']:.6f}",
                    'P', f"{v10['precision']:.6f}",
                    'R', f"{v10['recall']:.6f}",
                    'pred_ref', f"{v10['prediction_reference_ratio']:.6f}")
          PY
      - name: Upload V10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v100-spectral-string-slots
          path: |
            model/v100-spectral-train.log
            model/v100-spectral-result/report.json
            model/v100-spectral-result/v100-spectral-string-slots.weights.h5
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
