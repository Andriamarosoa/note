name: Audit unweighted low-K raw audio and group ownership - fold 3

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths: ['analysis/v273-acoustic-residual-launch.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v273-acoustic-residual-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  AUDIT_TAG: v273-acoustic-residual-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest -v test.test_v273_acoustic_residual test.test_v273_low_k_audit
      - name: Preserve protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Unweighted low-K acoustic and group ownership audit' \
            --notes-file analysis/v273-acoustic-residual-protocol.md
      - uses: actions/cache/restore@v4
        id: guitarset
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
      - name: Download original audio and annotations when needed
        if: steps.guitarset.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Restore frozen outer inputs and decision audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          x=json.loads(Path('analysis/v273-acoustic-residual-launch.json').read_text())
          Path('model/download').mkdir(parents=True)
          for asset in x['assets']:
              subprocess.run(['gh','release','download',asset['tag'],'--repo','Andriamarosoa/note',
                              '--pattern',asset['asset'],'--dir','model/download'],check=True)
              extract_verified(Path('model/download')/asset['asset'],Path('model')/asset['destination'],asset['sha256'])
          PY
      - name: Replay raw audio features and audit neighboring-group assignments
        run: |
          python -B scripts/audit_v273_acoustic_residual.py --outer model/outer --previous model/previous \
            --dataset data/GuitarSet --config analysis/v273-native-paired-config.json --output model/acoustic-audit
      - name: Preserve complete or partial acoustic audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/acoustic-audit \
            --name acoustic-audit --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-audit
          path: model/acoustic-audit
          if-no-files-found: warn
          retention-days: 90
