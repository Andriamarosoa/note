name: "S627 interaction controls from immutable TP/FN/FP audit"
on:
  push:
    branches: [codex/note-s627-multidimensional-causal-audit]
    paths: ['.github/workflows/note-s627-multifactor-posthoc.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  multifactor-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download verified full S613 17 DEV original per-note forensic report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/S627
          gh run download 38889998300 --repo Andriamarosoa/note \
            --name s627-original-S613-17dev-each-TP-FN-FP-all-dimensions \
            --dir /tmp/S627
          test -f /tmp/S627/S627_MULTIDIMENSIONAL_REAL_TP_FN_FP.json
      - name: Audit interactions with corpus, true active K, pitch register, timing
        run: |
          python -m scripts.s627_interactions_from_audit \
            --source-audit /tmp/S627/S627_MULTIDIMENSIONAL_REAL_TP_FN_FP.json \
            --out results/S627_CONDITIONED_MULTIFACTOR_INTERACTIONS.json
      - name: Assert conditioning did not lose truth notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/S627_CONDITIONED_MULTIFACTOR_INTERACTIONS.json').read_text())
          assert d['status']=='S627_MULTIFACTOR_INTERACTIONS_OBSERVATIONAL_ONLY'
          assert d['truth_note_events']==2079 and d['test_sources_read']==0
          assert d['baseline']['TP']==1241 and d['baseline']['FN']==838
          for key,items in d['cross_tabs'].items():
              assert sum(i['n'] for i in items)==2079,key
              assert sum(i['missed'] for i in items)==838,key
          print('CONDITIONED_HARMONIC',json.dumps(d['controlled_interval_contrasts']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s627-context-interactions-and-conditioned-harmonic-association
          path: results/S627_CONDITIONED_MULTIFACTOR_INTERACTIONS.json
          retention-days: 45
