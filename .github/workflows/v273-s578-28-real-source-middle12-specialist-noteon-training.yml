name: S578 28-original-composer 52D global vs MIDI60-71 specialized note F1 source held
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s578_train_28_source_middle12_specialist_vs_global52_composerblocked.py
      - .github/workflows/v273-s578-28-real-source-middle12-specialist-noteon-training.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  fit_18_source_composer_held_49_true_note_pitches_and_two_full_training_models:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pin physical source-note and MIDI matching dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Tests 7D original, 34D harmonic/strike contrast physical pitch features without MIDI
        run: |
          python -m py_compile scripts/s578_train_28_source_middle12_specialist_vs_global52_composerblocked.py
          python -m scripts.s578_train_28_source_middle12_specialist_vs_global52_composerblocked --self-test
      - name: Restore oldest original S469 three and S537 five already exposed piano audio/MIDI feature proofs
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656791368 -n s540-five-composers-original-V88-all-event-49x11-WAV-physical-pitch-features-preMIDI -D model/S540 --repo "${{ github.repository }}"
          gh run download 38657068577 -n s542-VALIDATED-5-new-composer-noteon-F1-genuine-postfrozen-piano-MIDI-and-restrikes -D model/S542 --repo "${{ github.repository }}"
      - name: Restore originally prospective S545 and S554 five-source MIDI outcomes, NOW annotated development, source SHA only
        run: |
          gh run download 38658066587 -n s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY -D model/S545 --repo "${{ github.repository }}"
          gh run download 38659675965 -n s549-next-five-S545-composers-V88-raw49-pitch-PREMIDI -D model/S549 --repo "${{ github.repository }}"
          gh run download 38659753045 -n s551-five-NEW-S545-composers-MIDI-SHA-verified-NoteOn-F1-S528-vs-S546 -D model/S551 --repo "${{ github.repository }}"
          gh run download 38663678664 -n s554-next-five-metadata-only-composer-component-disjoint-before-new-model-noteon-validation -D model/S554 --repo "${{ github.repository }}"
          gh run download 38663870685 -n s557-next-five-S554-composers-V88-raw49-pitch-PREMIDI -D model/S557 --repo "${{ github.repository }}"
          gh run download 38663995955 -n s559-five-NEW-S554-composers-MIDI-SHA-verified-NoteOn-F1-S528-vs-S546 -D model/S559 --repo "${{ github.repository }}"
      - name: Restore S561 final five already independently scored new sources, NOW training development only
        run: |
          gh run download 38666895837 -n s561-next-5-component-disjoint-music-after-18-exposed-METADATA-ONLY -D model/S561 --repo "${{ github.repository }}"
          gh run download 38667773991 -n s565-next-five-S561-composers-V88-raw49-pitch-PREMIDI -D model/S565 --repo "${{ github.repository }}"
          gh run download 38668197551 -n s567-five-UNSEEN-new-S561-composers-real-MIDI-noteon-S546-vs-S562-physical34-F1 -D model/S567 --repo "${{ github.repository }}"
      - name: Include fifth old original S570 cohort after independent S575 real MIDI eval for training only
        run: |
          gh run download 38670092733 -n s570-fourth-five-new-source-names-exclude23-previous-composer-components-NO-AUDIO-MIDI -D model/S570 --repo "${{ github.repository }}"
          gh run download 38670454679 -n s573-next-five-S570-composers-V88-raw49-pitch-PREMIDI -D model/S573 --repo "${{ github.repository }}"
          gh run download 38671119840 -n s575-fourth-new-composer-cohort-real-MIDI-source-verified-S569-temporal-vs-S562-physical34-NoteOn-F1 -D model/S575 --repo "${{ github.repository }}"
      - name: Train 23 actual source-held composer strict temporal reattack experts and two FULL23 checkpoints from genuine MIDI
        run: |
          python -u -m scripts.s578_train_28_source_middle12_specialist_vs_global52_composerblocked \
            --old-manifest model/S469/report.json --old-midi-report model/S471/report.json \
            --old-features model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --old-feature-report model/S527/report.json \
            --new-manifest model/S537/report.json --new-midi-report model/S542/report.json \
            --new-features model/S540/S540_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --new-feature-report model/S540/report.json \
            --s545-manifest model/S545/report.json --s545-midi-report model/S551/report.json \
            --s545-features model/S549/S549_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --s545-feature-report model/S549/report.json \
            --s554-manifest model/S554/report.json --s554-midi-report model/S559/report.json \
            --s554-features model/S557/S557_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --s554-feature-report model/S557/report.json             --s561-manifest model/S561/report.json --s561-midi-report model/S567/report.json             --s561-features model/S565/S565_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl             --s561-feature-report model/S565/report.json \
            --s570-manifest model/S570/report.json --s570-midi-report model/S575/report.json \
            --s570-features model/S573/S573_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --s570-feature-report model/S573/report.json --out model/S578
          python - <<'PY'
          import json
          r=json.load(open('model/S578/report.json'))
          assert r['status']=='S578_TWENTYEIGHT_TRUE_PIANO_SOURCE_MIDDLE_MIDI_60_71_EXPERT_VS_GLOBAL_NOTEON'
          assert r['actual_28_midi_pitch_sources']==28
          assert r['composer_and_co_composer_connected_components_five_held_folds']
          assert set(r['three_predeclared_musical_policies'])=={'global28','specialist_mid_replace','specialist_mid_blend50'}
          assert r['no_future_S577_MIDI_or_WAV_read_for_training']
          assert len(r['weights_before_S577_exposure'])==2
          assert r['no_promotion'] and r['original_reference_S80_Live_ExactK_unchanged']
          print('S578 28-source true MIDI trained global and mid-only heads, locked before untouched S577 WAV or MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s578-28-real-composer-midi-trained-global52-and-mid12-52D-before-S577-WAV
          path: model/S578/
          retention-days: 90
