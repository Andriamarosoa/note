name: S547 true new S545 composer-disjoint original V88 MIDI-blind acoustic predictor
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s547_original_v88_new_S545_five_maestro_WAV_premidi.py
      - .github/workflows/v273-s547-V88-five-next-composer-original-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_new_composers_true_original_v88_source_preMIDI:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install identical original V88 frozen TF/NumPy inference dependencies
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Test original WAV compatibility without MIDI
        run: |
          python -m py_compile scripts/s547_original_v88_new_S545_five_maestro_WAV_premidi.py
          python -m scripts.s547_original_v88_new_S545_five_maestro_WAV_premidi --self-test
      - name: Restore five new composers whose filenames were SHA preregistered without WAV/MIDI
        run: |
          gh run download 38658066587 -n s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY -D model/S545 --repo "${{ github.repository }}"
          test -f model/S545/report.json
      - name: Restore exact original S80-era V84-V88 independent acoustic source pipeline and source code SHA
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
             --repo "${{ github.repository }}" --pattern v273-rebuilt-proposal-sources.zip --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
             Path('model/original-sources'),
             'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
             validate=validate_sources)
          PY
      - name: Restore unchanged original historical freeze_local_combo exact K weights
        run: |
          mkdir -p model/freeze-original model/freeze-download
          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo "${{ github.repository }}" --pattern v273-uniform-anchored-freeze-result.tgz --dir model/freeze-download
          tar -xzf model/freeze-download/v273-uniform-anchored-freeze-result.tgz -C model/freeze-original
          test -s model/freeze-original/freeze_local_combo.weights.h5
      - name: Restore original four guitar-only train S466 birth heads, no MAESTRO tuning
        run: |
          gh run download 38552253544 \
            -n s466-GuitarSet-59k-composition-held-birth-continuation-Kblind-4-models-no-promotion \
            -D model/S466 --repo "${{ github.repository }}"
          test -f model/S466/S466_birth_vs_nonbirth_fold3.joblib
      - name: Download only 5 new selected original WAV recordings and freeze ALL candidate V88 times and K BEFORE MIDI
        run: |
          python -u -m scripts.s547_original_v88_new_S545_five_maestro_WAV_premidi \
            --manifest model/S545/report.json \
            --source-dir model/original-sources \
            --weights model/freeze-original/freeze_local_combo.weights.h5 \
            --birthmodels model/S466 --birthreport model/S466/report.json \
            --out model/S547
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S547/report.json'))
          assert r['status']=='S547_MAESTRO_V3_REAL_AUDIO_ORIGINAL_PRETRAINED_V88_PLUS_S466_PREMIDI'
          assert r['five_original_piano_recordings']==5 and r['actual_new_composer_count']==5
          assert r['original_V88_event_count']>0 and r['source_s545_composer_components_disjoint_from_old_eight']
          assert r['prelabel_predictions_frozen'] and not r['paired_MIDI_annotation_files_OPENED']
          assert r['original_complete_S80_NOT_REPLAYED'] and r['no_promotion']
          with np.load('model/S547/S547_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz') as z:
              assert z['original_GuitarSet_birth4_prob'].shape==(4,r['original_V88_event_count'])
              assert z['original_V88_probabilities'].shape==(r['original_V88_event_count'],7)
              assert len(set(z['member'].astype(str)))==5
          print('S547 SUCCESS 5 new composers five complete source V88 audio forecasts SHA sealed PRE-MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s547-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model
          path: |
            model/S547/report.json
            model/S547/S547_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz
          retention-days: 90
