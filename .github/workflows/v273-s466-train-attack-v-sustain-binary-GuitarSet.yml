name: S466 dedicated source K blind onset-birth vs continuation head GuitarSet song-held
on:
  push:
    branches: [codex/s466-birth-vs-continuation-learner]
    paths:
      - scripts/s466_train_separate_acoustic_birth_v_continuation_guitarset.py
      - .github/workflows/v273-s466-train-attack-v-sustain-binary-GuitarSet.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s466-GuitarSet-birth-v-continuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train_birth_discriminator_by_held_composition_and_nested_safety_recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original GuitarSet model numeric ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify onset true labels and threshold abstention when notes missed
        run: |
          python -m py_compile scripts/s466_train_separate_acoustic_birth_v_continuation_guitarset.py
          python -m scripts.s466_train_separate_acoustic_birth_v_continuation_guitarset --self-test
      - name: Restore true 59k original GuitarSet real acoustic V88/S97 features and immutable annotation-only K
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore untouched original S80 reference produced before any onset birth experiment
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Train only original GuitarSet four held-composition birth experts and separate inner gate validation
        run: |
          python -u -m scripts.s466_train_separate_acoustic_birth_v_continuation_guitarset \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --out model/S466
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S466/report.json'))
          assert d['status']=='S466_GUITARSET_TRAIN_ONLY_COMPOSITION_DISJOINT_BINARY_BIRTH_HEAD'
          assert d['source_GuitarSet_original_events']==59309
          assert d['positive_true_birth_count']>100 and d['negative_unmatched_birth_count']>100
          assert d['trained_four_fold_heads']==4
          assert d['original_S80_K_global_correct']==53529
          assert d['original_S80_K_true_poly_correct']==6054
          assert d['IDMT_not_read_during_training_or_threshold_selection']
          assert d['model_no_original_S80_K_as_input'] and d['no_promotion']
          assert all(z['source_no_label_leakage'] for z in d['all_folds'])
          with np.load('model/S466/S466_GUITARSET_S80_UNCHANGED_BINARY_BIRTH_OOF.npz') as z:
            assert len(z['row_id'])==59309
            assert np.isfinite(z['birth_prob_OOF']).all()
          print('S466 original GuitarSet note-birth discrimination trained without IDMT labels or S80 changes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s466-GuitarSet-59k-composition-held-birth-continuation-Kblind-4-models-no-promotion
          path: model/S466/
          retention-days: 90
