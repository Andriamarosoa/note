name: S356 independent read-only per-WAV confidence audit of S354 prospective chord S80 gains
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s356_independent_chord_S80_gain_distribution_audit.py'
      - '.github/workflows/v273-s356-prospective-chord-paired-concentration-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s356-exposed-xml-frozen-read-only-477
  cancel-in-progress: true
jobs:
  exact_corrections_and_song_cluster_significance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore S354 genuine first post-frozen chord XML score and exact original prediction identities
        run: |
          gh run download 38327717118 \
            -n s354-PROSPECTIVE-IDMT-dataset1-12chords-477-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/S354 --repo ${{ github.repository }}
      - name: Independently reproduce all 17 corrections 4 regressions / score distribution across twelve original recording IDs
        run: |
          python -u -m scripts.s356_independent_chord_S80_gain_distribution_audit \
            --source model/S354/report.json \
            --pred model/S354/S354_postfrozen_477_two_distinct_protocols.npz \
            --out model/S356
          python - <<'PY'
          import json
          r=json.load(open('model/S356/report.json'))
          a=r['paired_all_native_if_XML_complete']
          p=r['paired_true_poly_attack_only']
          assert a['events']==477 and (a['official_correct'],a['S80_correct'])==(442,455)
          assert (a['S80_corrections'],a['S80_regressions'])==(17,4)
          assert (p['events'],p['official_correct'],p['S80_correct'])==(20,6,11)
          assert len(r['per_WAV'])==12
          assert r['WAV_group_signflip_all']['n_wav']==12
          assert r['source_predictions_unmodified']
          assert not r['independent_XML_K0_exhaustiveness_proven']
          assert not r['independent_song_composition_identity_proven']
          assert not r['reference_promotion_authorized']
          print('S356 PASS exact paired source stats, grouped CIs, recordings and bounded nonpromotion')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s356-prospective-chord-S80-exact-WAV-cluster-McNemar-uncertainty-no-promotion
          path: model/S356/
          retention-days: 90
