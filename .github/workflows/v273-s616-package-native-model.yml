name: S616 package frozen NOTE S601 assets
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - .github/workflows/v273-s616-package-native-model.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  package_checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package original S601 and S614 checkpoints and scripts
        run: |
          test -s model/experimental/S601_URMP_candidate_gate_xz.joblib
          test -s model/live/strict_note/NOTE_strict_live.npz
          mkdir -p /tmp/s616
          cp model/experimental/S601_URMP_candidate_gate_xz.joblib /tmp/s616/
          cp model/live/strict_note/NOTE_strict_live.npz /tmp/s616/
          cp src/causal_note/strict_live.py /tmp/s616/
          cp scripts/s601_bp_candidate_gate.py /tmp/s616/
          sha256sum /tmp/s616/* > /tmp/s616/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: original-frozen-NOTE-checkpoints
          path: /tmp/s616/
          retention-days: 30
