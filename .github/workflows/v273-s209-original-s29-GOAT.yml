name: S209 replay genuine original 38 S29 Q gates on recovered S18 audio
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s209_original_s29_GOAT.py'
      - 'scripts/v273_s29_original_stepwise.py'
      - '.github/workflows/v273-s209-original-s29-GOAT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s209-original-s29-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_S29_forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same numerical and torch CPU versions as original S29
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Preserve proof that replay engine is exact original S29 source text
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          url='https://raw.githubusercontent.com/Andriamarosoa/note/854ada718ac9bf1556f00c96b8e1aa90402d6ab3/scripts/train_v273_stepwise_scheduler.py'
          original=urllib.request.urlopen(url,timeout=30).read()
          local=open('scripts/v273_s29_original_stepwise.py','rb').read()
          assert original==local,'original S29 engine text drift'
          print('S209 ORIGINAL S29 SOURCE BIT EXACT',hashlib.sha256(original).hexdigest())
          PY
      - name: Download 38 authentic S29 Q regressors and 19 original S20 source networks
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37865173636
          name: v273-series29-stepwise-scheduler
          path: model/S29
      - name: Download genuine S20 original 19 networks
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37858383973
          name: v273-series20-residual
          path: model/S20
      - name: Route all 19 genuine held-piece S29 models on GOAT using recovered S18
        run: >-
          python -m scripts.s209_original_s29_GOAT
          --s29 model/S29 --s20 model/S20
          --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz
          --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz
          --out model/S209
      - name: Verify models and fail-closed promotion guard
        run: |
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S209/report.json'))
          assert d['original_S29_Q_models']==38 and d['original_S20_networks']==19
          assert d['branches']==19 and not d['promotion']
          assert not d['original_S35_reconnected'] and not d['independent_accuracy_measured']
          assert not d['labels_read'] and not d['refitted']
          with np.load('model/S209/s29_original_all_19_GOAT.npz',allow_pickle=False) as z:
              assert z['predicted_K'].shape==(19,57)
              assert z['actions'].shape==(19,57,3)
              assert z['calls'].shape==(19,57,2)
          print('S209 PASS original S29 weights, dynamic subbatch routing, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s209-original-S29-on-recovered-S18-new-audio-NO-promotion
          path: model/S209/
          retention-days: 90
