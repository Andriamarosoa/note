name: S617 native causal new-onset path URMP development
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s617_live_attack_bridge.py
      - scripts/s617_live_dev_scan.py
      - test/test_s617_live_attack_bridge.py
      - .github/workflows/v273-s617-live-attack-bridge.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original causal inference and URMP IO
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scipy==1.14.1
      - name: Assert causal, no-foreign-model and baseline invariants
        run: python -m unittest -v test.test_strict_live test.test_s616_live_guard test.test_s617_live_attack_bridge
      - name: Train-free scan on five original URMP development recordings
        run: python -m scripts.s617_live_dev_scan --out /tmp/S617
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S617-causal-attack-bridge-dev-only
          path: /tmp/S617/
          retention-days: 60
          if-no-files-found: warn
