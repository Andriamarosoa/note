name: S725 actual E2 followed by E3 while E2 sustains, CAL-only forensic
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - .github/workflows/note-s725-real-e2-e3-cal-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s725-real-e2-e3-targeted-unique
  cancel-in-progress: true
jobs:
  S725_real_e2_e3_independent_followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install same CPU inference and released live dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate real E2/E3 truth-overlap and unique matched event contracts
        run: |
          python -m compileall -q scripts/s725_real_e2_e3_overlap_audit.py
          python -m unittest -v test.test_s725_real_e2_e3_overlap_audit test.test_s725_source_memory
      - name: Require previously signed S725 full six-score validation
        run: |
          gh run watch 39122894425 --repo "${{ github.repository }}" --exit-status --interval 20
      - name: Load signed S708, actual S725 epoch2 and original S675 NoteOff
        run: |
          mkdir -p /tmp/s725e2/s708 /tmp/s725e2/s725 /tmp/s725e2/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s725e2/s708
          gh run download 39122894425 --repo "${{ github.repository }}" --name S725_CAUSAL_NOTE_OWNERSHIP_MEMORY_MATCHED_K_ABLATION --dir /tmp/s725e2/s725
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s725e2/s707
          test -s /tmp/s725e2/s708/s708_selected.pt
          test -s /tmp/s725e2/s725/with_memory_epoch2.pt
          test -s /tmp/s725e2/s725/no_memory_epoch2.pt
          test -s /tmp/s725e2/s725/report.json
          test -s /tmp/s725e2/s707/s675_hazard.joblib
      - name: Re-evaluate exact real E2-then-E3 while E2 still sounds, on CAL only
        run: |
          python -m scripts.s725_real_e2_e3_overlap_audit --s708-dir /tmp/s725e2/s708 --s725-dir /tmp/s725e2/s725 --offset-checkpoint /tmp/s725e2/s707/s675_hazard.joblib --out /tmp/s725e2/results
      - name: Check no research-to-LIVE promotion and genuine exposed split caveats
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s725e2/results/report.json'))
          assert not r['promoted'] and not r['TEST_opened']
          assert r['CAL_only'] and len(r['tracks'])==32
          assert set(r['totals'])=={'S708_frozen','no_memory_epoch2','with_memory_epoch2'}
          for name,counts in r['totals'].items():
              assert counts['E3_on_E2_total'] == counts['E3_on_E2_matched']+counts['E3_on_E2_missed']
              assert counts['E3_on_E2_total']>=0
          print('S725_E2_E3_CAUSAL_REAL_CAL_VERDICT',json.dumps({
              'cases':r['totals']['S708_frozen']['E3_on_E2_total'],
              'counts':r['totals'],'warning':r['scope_warning']},sort_keys=True))
          PY
      - name: Archive exact real-world E2/E3 diagnosis with full per-track evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S725_REAL_E2_ACTIVE_NEW_E3_MATCHED_CAL_AUDIT
          path: /tmp/s725e2/results/report.json
          retention-days: 45
          if-no-files-found: warn
