name: S632 register specialist native LIVE rescue independent DEV audit
on:
  push:
    branches: [codex/s632-register-rescue-audit]
    paths:
      - 'src/causal_note/register_rescue.py'
      - 'scripts/s632_dual_register_rescue_audit.py'
      - 'test/test_s632_register_rescue.py'
      - '.github/workflows/v273-s632-register-rescue.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s632-register-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specialist_unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact NOTE runtime environment
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify specialist register gates and previous native ABI
        run: |
          python -m compileall -q src/causal_note/register_rescue.py scripts/s632_dual_register_rescue_audit.py test/test_s632_register_rescue.py
          python -m unittest -v test.test_s632_register_rescue test.test_s630_batched_live
  pinned_real_dev_17_sources:
    needs: specialist_unit_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install NOTE frozen audio and native ONNX dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compare S614 versus 22 causal register and K-veto options, separately per corpus and register
        run: python -m scripts.s632_dual_register_rescue_audit --out /tmp/S632
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S632-bass-high-recovered-notes-false-positive-DEV
          path: /tmp/S632
          if-no-files-found: warn
          retention-days: 60
