name: S158 no-duplicate-run proof S8/S9 source equals existing S153/S154 parent
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s158_s8_s9_s154_parent_parity.py'
      - '.github/workflows/v273-s158-no-redundant-cascade.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s158-source-no-reruns-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no_duplicate_expensive_training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s158_s8_s9_s154_parent_parity --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38196167459
          name: v273-s157-original-S8-learned-checkpoints-exact-S9-rule-GOAT-no-MIDI
          path: model/S157
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195528700
          name: v273-s153-original-trained-S13-S14-S15-safe-union-newGOAT-adaptedS9
          path: model/S153
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195685473
          name: v273-s154-original-S13-S14-S15-S16-S17-S18-checkpoint-cascade-GOAT
          path: model/S154
      - name: Assert S157 authentic original S8/S9 same native input as previously executed S13-S18
        run: |
          python -m scripts.s158_s8_s9_s154_parent_parity \
            --s157 model/S157/s8_s9_original_trained_veto_GOAT_adapted_sources.npz \
            --s153 model/S153/original_S13_S14_S15_saved_models_GOAT_adapter.npz \
            --s154 model/S154/original_S15_to_S18_trained_GOAT_adapted_S9.npz \
            --out model/S158/report.json
          python - <<'PY'
          import json
          r=json.load(open('model/S158/report.json'))
          assert r['native_events']==57
          assert r['new_original_S8_S9_vs_S153_existing_parent_mismatches']==0
          assert r['new_original_S8_S9_vs_S154_existing_parent_mismatches']==0
          assert not r['original_S5_global_poly_heads_used']
          assert not r['exact_historical_S9_equivalence_established']
          assert not r['S80_promoted'] and not r['GOAT_label_MIDI_read']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v273-s158-no-duplicate-S8-S9-to-S154-parent-parity
          path: model/S158/
          retention-days: 90
