name: S221 run original S69 frozen veto rules on original audio without fold oracle
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s221_S69_no_fold_oracle.py'
      - '.github/workflows/v273-s221-S69-no-fold-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s221-fourfold-S69-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_s69_foldfree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original S69 label-free numeric runtime
        run: python -m pip install numpy==1.26.4
      - name: Test fold-specific historical rule quorum independently of original recording
        run: python -m scripts.s221_S69_no_fold_oracle --self-test
      - name: Restore S219 193 original source S46 policies with 4-fold branch-neutral consensus
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294699823
          name: s219-conditional-specialist-S46-19-branch-4fold-candidate
          path: model/S219
      - name: Restore original 36 neural PR16 policy predictions on same native WAV audio
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - name: Restore original historical S69 frozen veto rules and thresholds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38177948016
          name: v273-s69-s46-risk-replay
          path: model/originalS69
      - name: Execute frozen original S69 veto for four hypothetical folds and 3-of-4 consensus
        run: |
          set -euo pipefail
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          test -s "$S85" && test -s model/originalS69/report.json
          python -m scripts.s221_S69_no_fold_oracle \
            --s219 model/S219/conditional_sparse_193_policy_prediction.npz \
            --pr16 "$S85" --rules model/originalS69/report.json --out model/S221
      - name: Verify no labels, original 36 neural policies, 193 source policies, and no promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np,json
          r=json.loads(Path('model/S221/report.json').read_text())
          assert r['count']==57 and r['pr16_real_policies']==36 and r['original_S46_policy_bank']==193
          assert r['S69_frozen_original_policy_names']==['balanced','polymax']
          assert r['original_training_thresholds_unchanged']
          assert not r['truth_or_midi_used'] and not r['models_retrained']
          assert not r['independent_accuracy_measured'] and not r['S80_promoted']
          with np.load('model/S221/original_S69_fourfold_rule_consensus.npz',allow_pickle=False) as z:
              assert len(z['row_id'])==57 and z['balanced_protected_K'].shape==(57,)
              assert z['polymax_protected_K'].shape==(57,)
              assert z['balanced_fold_veto'].shape==(4,57)
          print('S221 PASS authentic S69 thresholds, four-fold folded no-oracle voting, source-only GOAT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s221-original-S69-veto-fourfold-no-fold-oracle
          path: model/S221/
          retention-days: 90
