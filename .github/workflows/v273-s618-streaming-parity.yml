name: S618 prove streaming runtime parity and causality
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s618_streaming_runtime.py
      - test/test_s618_streaming_runtime.py
      - .github/workflows/v273-s618-streaming-parity.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  causal_stream_parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original NOTE inference runtime
        run: python -m pip install -r requirements-live-strict.txt
      - name: Check native streaming, no future lookahead, and original S614
        run: |
          python -m unittest -v test.test_s618_streaming_runtime test.test_s618_attack_head test.test_strict_live
