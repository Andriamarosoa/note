name: V8.4 onset-only validation novelty audit

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v84-validation-novelty-fast.yml"
      - "scripts/audit_v84_validation_novelty.py"
      - "scripts/audit_v84_validation_novelty_onset_only.py"
      - "src/causal_note/v84_onset_predictor.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen V8.4 A/B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-v84
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          test -f model/source-v84/v84-pilot/control.epoch-01.keras
          test -f model/source-v84/v84-pilot/replay.epoch-03.keras
      - name: Compile onset-only diagnostic
        env:
          PYTHONPATH: src
        run: python -m py_compile src/causal_note/v84_onset_predictor.py scripts/audit_v84_validation_novelty.py scripts/audit_v84_validation_novelty_onset_only.py
      - name: Audit frozen V8.4 onset streams
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          mkdir -p model/v84-validation-novelty-fast
          python -B scripts/audit_v84_validation_novelty_onset_only.py \
            --control-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --replay-model model/source-v84/v84-pilot/replay.epoch-03.keras \
            --output model/v84-validation-novelty-fast/audit.json \
            2>&1 | tee model/v84-validation-novelty-fast/audit.log
      - name: Verify baselines and summarize transfer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model/v84-validation-novelty-fast/audit.json').read_text())
          assert d['configuration']['validation_threshold_refit'] is False
          assert d['configuration']['offset_training_or_mutation'] is False
          c=d['arms']['control_epoch_01']['baseline']; r=d['arms']['replay_epoch_03']['baseline']
          assert abs(c['global']['f1']-0.440561)<5e-4, c['global']
          assert abs(c['comp']['f1']-0.575076)<5e-4, c['comp']
          assert abs(r['global']['f1']-0.409429)<5e-4, r['global']
          assert abs(r['solo']['f1']-0.471233)<5e-4, r['solo']
          assert abs(r['comp']['f1']-0.377642)<5e-4, r['comp']
          for arm in ('control_epoch_01','replay_epoch_03'):
              a=d['arms'][arm]
              print('\nARM',arm,'BASELINE',json.dumps(a['baseline'],sort_keys=True))
              for regime in ('global','solo','comp'):
                  for feature in ('fixed_positive_flux_enrichment','contour_positive_flux_enrichment'):
                      print('AUC',regime,feature,json.dumps(a['rank_separation'][regime].get(feature),sort_keys=True))
              for x in a['transferred_train_rules']:
                  print('RULE',x['name'],json.dumps({'descriptive':x['descriptive'],'exact':x['exact_postfilter_metrics']},sort_keys=True))
          PY
      - name: Upload onset-only validation novelty artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v84-validation-novelty-fast
          path: |
            model/v84-validation-novelty-fast/audit.json
            model/v84-validation-novelty-fast/audit.log
          if-no-files-found: warn
          retention-days: 14
