name: S621 fixed S619 event gate transferable to GuitarSet DEV
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s621_s619_guitar_transfer.py
      - .github/workflows/v273-s621-event-gate-guitar-transfer.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cross_development:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original native NOTE inference, not a foreign recognition model
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify original NOTE S614 state machine
        run: python -m unittest -v test.test_s619_event_gate test.test_strict_live
      - name: Train source-disjoint event classifier and check 12 real GuitarSet DEV
        run: python -m scripts.s621_s619_guitar_transfer --out /tmp/S621
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S621-frozen-OOF-policy-cross-GuitarSet
          path: /tmp/S621/
          if-no-files-found: warn
          retention-days: 60
