name: S264 GuitarSet 59309 replay five authentic S45 source families on recovered S5 S18
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s264_original_S45_five_audio_guitarset_59309.py'
      - '.github/workflows/v273-s264-guitarset-five-original-S45.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s264-five-family-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovered_source_forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original compatible numpy sklearn torch
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore 19 original S11 saved risk models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853663514
          name: v273-series11-native-risk
          path: model/S11
      - name: Restore 19 original S12 logistic models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853979683
          name: v273-series12-full-audio
          path: model/S12
      - name: Restore original S38 four expert heads from four folds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880386031
          name: v273-series38-poly-harmonic-expert
          path: model/S38
      - name: Restore four original S40 temporal CNNs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880762289
          name: v273-series40-temporal-cnn
          path: model/S40
      - name: Restore 19 original S41 six-route fusion gates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37881191015
          name: v273-series41-six-head-neural-fusion
          path: model/S41
      - name: Require exact GuitarSet 59309 S97 source and original S18 4fold complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38312084676 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: True S238 original trained 133-head S18 predictions on 59309 native GUITARSET events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311814895
          name: s238-guitarset-original-full-S5-S18-133-checkpoint-4fold-59309-predictions
          path: model/S260
      - name: Original native S97 original audio source 59309 matched event IDs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38312084676
          name: s262-guitarset-59309-native-real-S97-source
          path: model/S262source
      - name: Run five genuine trained S45 source families on recovered S5/S18 parent folds
        run: >-
          python -m scripts.s264_five_S45_genuine_original_GUITARSET
          --s18 model/S260/S260_original_S5_to_S18_true_V88_native_GUITARSET_59309.npz
          --s97 model/S262source/original_GuitarSet_59309_S97.npz
          --s11 model/S11 --s12 model/S12 --s38 model/S38
          --s40 model/S40 --s41 model/S41 --out model/S264
      - name: Verify all original families, genuine 19 branches and label-free proof
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S264/report.json'))
          assert r['branches']==19 and r['events']==59309
          assert r['fold_branches']==[5,4,5,5] and len(r['family_ids'])==5
          assert r['former_S135_PR16_source_replaced']
          assert r['S11_S12_original_S9_parent_used']
          assert r['S38_S40_S41_original_S18_parent_used']
          assert not r['S80_promoted'] and not r['independent_accuracy_measured']
          assert not r['labels_read'] and not r['new_models_trained']
          with np.load('model/S264/five_rebased_S11_S12_S38_S40_S41.npz',allow_pickle=False) as z:
              assert z['proposals_K'].shape==(19,59309,5)
              assert len(set(map(str,z['branch_piece'])))==19
          print('S264 PASS 5 re-based trained S45 families, authentic S9/S18 parents, 19 branches, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s264-guitarset-five-original-S45-59309
          path: model/S264/
          retention-days: 90
