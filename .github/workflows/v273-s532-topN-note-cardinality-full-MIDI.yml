name: S532 independent old BP chord safe raw pitch top 1 2 3 limit full piano MIDI NoteOn audit
on:
  push:
    branches: [codex/s530-full-maestro-noteon-f1]
    paths:
      - scripts/s532_independent_pitch_topN_cap_noteon_midi_F1.py
      - .github/workflows/v273-s532-topN-note-cardinality-full-MIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit_predeclared_new_only_note_topN_without_changing_old_exact_chords:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore original MIDI, numpy and bipartite note onset matching
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Check protected polyphonic note set survives pitch cap
        run: |
          python -m py_compile scripts/s532_independent_pitch_topN_cap_noteon_midi_F1.py
          python -m scripts.s532_independent_pitch_topN_cap_noteon_midi_F1 --self-test
      - name: Retrieve SHA original complete MIDI piano sources and their previously frozen note classifiers
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
          gh run download 38648729508 -n s530-full-330-real-MAESTRO-MIDI-noteon-prec-recall-F1-vs-protected-S529 -D model/S530 --repo "${{ github.repository }}"
      - name: Compare all true NoteOn pitch events from fixed max1 max2 max3 with full prior unbounded
        run: |
          python -u -m scripts.s532_independent_pitch_topN_cap_noteon_midi_F1 \
            --manifest model/S469/report.json --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json \
            --full-report model/S530/report.json --out model/S532
          python - <<'PY'
          import json
          r=json.load(open("model/S532/report.json"))
          assert r["status"]=="S532_INDEPENDENT_FROZEN_PITCH_CARDINALITY_ABLATION_FULL_MIDI"
          assert r["original_S530_no_cap_note_predictions_independently_reproduced"]
          assert all(k in r["policies"] for k in ("no_cap","max_1","max_2","max_3"))
          assert r["original_BP_note_births_never_deleted_or_modified"]
          assert r["complete_original_piano_MIDI_attacks"]==330
          assert r["no_promotion"]
          print("S532 fixed topN cap independent true MIDI replay passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s532-note-head-top1-top2-top3-safe-MIDI-cardinality-noteon-F1-audit
          path: model/S532/
          retention-days: 90
