name: S688 octave aware weak Onset harmonic disambiguation four locks
on:
  push:
    branches: [codex/note-s688-octave-aware-rescue]
    paths:
      - scripts/s688_octave_aware_novelty.py
      - scripts/s688_octave_robust_four_lock.py
      - test/test_s688_octave_aware_novelty.py
      - .github/workflows/note-s688-octave-aware-four-lock.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: note-s688-octave-past-only
  cancel-in-progress: true
jobs:
  octave_disambiguation:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen native NOTE and S675 requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compile and verify no suppressions of original native Onsets
        run: |
          python -m compileall -q scripts/s688_octave_aware_novelty.py scripts/s688_octave_robust_four_lock.py
          python -m unittest -v test.test_s688_octave_aware_novelty
      - name: Download original frozen S675 trained real GuitarSet checkpoint
        run: |
          mkdir -p /tmp/s688_s675
          gh run download 39056766998 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s688_s675
          test -f /tmp/s688_s675/s675_hazard.joblib
          test -f /tmp/s688_s675/s675_checkpoint.json
      - name: Nine TRAIN composition guard and 12 DEV independent retrospective assessment
        run: python -m scripts.s688_octave_robust_four_lock --out /tmp/s688 --checkpoint /tmp/s688_s675/s675_hazard.joblib
      - name: Save real audio frozen K onset and S675 full note evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S688_OCTAVE_FUNDAMENTAL_FALSE_ATTACK_GUARD
          path: /tmp/s688/report.json
          if-no-files-found: warn
          retention-days: 60
