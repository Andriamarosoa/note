name: S332 real V88 freeze_local_combo on 12 IDMT dataset1 tracks prelabel
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s332_official_V88_dataset1_prospective_12_WAV_16_WAV_source_only.py'
      - '.github/workflows/v273-s332-native-IDMT-dataset1-chord-prelabel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s332-native-idmt-dataset1-prelabel
  cancel-in-progress: true
jobs:
  original_freeze_native_on_twelve_IDMT_dataset1_WAV:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original trained V8 native inference stack
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore pinned original V84 V86 V87 V88 model source archive
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
            --repo ${{ github.repository }} \
            --pattern v273-rebuilt-proposal-sources.zip \
            --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
            Path('model/original-sources'),
            'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
            validate=validate_sources)
          PY
      - name: Restore immutable official freeze_local_combo weights
        run: |
          mkdir -p model/freeze-original model/freeze-download
          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo ${{ github.repository }} \
            --pattern v273-uniform-anchored-freeze-result.tgz \
            --dir model/freeze-download
          tar -xzf model/freeze-download/v273-uniform-anchored-freeze-result.tgz -C model/freeze-original
          test -s model/freeze-original/freeze_local_combo.weights.h5
      - name: Restore S276 filename-only cohort (NO XML or audio contents)
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 \
            --repo ${{ github.repository }}
      - name: Execute original pretrained V84-V88 and freeze local combo on twelve prospective reserve WAVs
        run: |
          python -m py_compile scripts/s332_official_V88_dataset1_prospective_12_WAV_16_WAV_source_only.py
          python -u -m scripts.s332_official_V88_dataset1_prospective_12_WAV_16_WAV_source_only \
            --sources model/original-sources \
            --weights model/freeze-original/freeze_local_combo.weights.h5 \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S332
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S332/report.json'))
          assert r['count_WAV']==12 and r['original_native_event_count']>0
          assert sum(r['predicted_K0to6_histogram'])==r['original_native_event_count']
          assert not r['XML_MIDI_annotated_contents_read']
          assert not r['S275_same_native_event_predictions_computed']
          assert not r['promotion_eligible']
          assert r['SHA_ranks_1_to_48_excluded'] and r['selected_dataset1_prospective_prospective_12_WAV']
          with np.load('model/S332/S332_official_V88_dataset1_prospective_12_WAV_16_WAV_predictions.npz',allow_pickle=False) as z:
            n=len(z['row_id'])
            assert z['incumbent_probabilities'].shape==(n,7)
            assert z['end_samples'].shape==(n,)
          print('S332 PASS: true native V88 and actual unchanged freeze_local_combo output on IDMT dataset1; labels unopened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled
          path: |
            model/S332/report.json
            model/S332/S332_official_V88_dataset1_prospective_12_WAV_16_WAV_predictions.npz
          retention-days: 90
