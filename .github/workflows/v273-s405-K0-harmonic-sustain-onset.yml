name: S405 K0 harmonic sustain and separate onset contract test
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'src/causal_note/k_first_multihead_notes_s404.py'
      - 'src/causal_note/k0_sustain_harmonic_onset_decoder_s405.py'
      - '.github/workflows/v273-s405-K0-harmonic-sustain-onset.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s405-k0-harmonic-sustain-onset-${{ github.ref }}
  cancel-in-progress: true
jobs:
  K0_is_absence_of_new_attacks_NOT_harmonic_silence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch for architecture tests
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Test S404 separates new onset from ringing frame
        run: |
          python -m py_compile src/causal_note/k_first_multihead_notes_s404.py src/causal_note/k0_sustain_harmonic_onset_decoder_s405.py
          python -u src/causal_note/k_first_multihead_notes_s404.py
      - name: Test S405 loud K0 harmonics, K1 new strike, K2, retrigger and release
        run: |
          python -u src/causal_note/k0_sustain_harmonic_onset_decoder_s405.py
          python - <<'PY'
          from pathlib import Path
          a=Path('src/causal_note/k_first_multihead_notes_s404.py').read_text()
          b=Path('src/causal_note/k0_sustain_harmonic_onset_decoder_s405.py').read_text()
          assert 'note_logits=onset' in a and 'note_logits=frame+onset' not in a
          assert 'select_exact_k_notes(' in b
          assert 'predicted_k==0 and any' in b
          assert 'harmonic_presence_nonzero' in b
          print('S405 VERIFIED: K0 does not zero acoustic frames or harmonics; it blocks only new MIDI NoteOn')
          PY
