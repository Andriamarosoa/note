name: S145 diagnose S41 57/57 abstentions vs real candidate supply, no labels
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s145_s41_eligibility_vs_gate.py'
      - '.github/workflows/v273-s145-s41-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s145-S41-abstention-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s145_s41_eligibility_vs_gate --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38193181798
          name: v273-s144-original-S38-S40-S41-39-models-GOAT-conditional
          path: model/s144
      - name: Analyse 5 authentic neural expert proposals against 6-action trained gate
        run: |
          python -m scripts.s145_s41_eligibility_vs_gate \
            --input model/s144/original_s41_new_deploy_composite_GOAT.npz \
            --output model/s145
          python - <<'PY'
          import json
          r=json.load(open('model/s145/report.json'))
          assert r['GOAT_real_native_rows']==57
          assert r['KEEP_argmax']==57 and r['actual_changed_K']==0
          assert not r['truth_MIDI_read'] and not r['promotion']
          assert len(r['heads'])==5
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s145-original-neural-fusion-S41-zero-action-diagnostic
          path: model/s145/
          retention-days: 90
