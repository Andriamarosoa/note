name: V13 causal event-set outer-clean

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v130_causal_event_set_decoder.py'
      - 'scripts/run_v130_outer_clean.py'
      - 'scripts/summarize_v130_causal_event_set_decoder.py'
      - '.github/workflows/v130-causal-event-set.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'

jobs:
  preflight:
    name: V13 architecture preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V13 files
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v130_causal_event_set_decoder.py
          python -m py_compile scripts/run_v130_outer_clean.py
          python -m py_compile scripts/summarize_v130_causal_event_set_decoder.py
      - name: Build V13 Keras graph
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          python - <<'PY'
          from scripts import train_v130_causal_event_set_decoder as v
          model, weights, shape = v._build_model()
          assert v.EVENT_QUERIES == 6
          assert 'event_count_norm' in model.output_names
          for q in range(6):
              assert f'event_present_{q}' in model.output_names
              assert f'event_time_{q}' in model.output_names
              assert f'event_candidate_{q}' in model.output_names
          print('params', model.count_params(), 'tf_shape', shape, 'outputs', len(model.output_names))
          PY

  fold:
    name: V13 outer fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train and evaluate outer-clean V13 fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "model/v130-fold-${{ matrix.fold }}"
          python -B scripts/run_v130_outer_clean.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --output-dir "model/v130-fold-${{ matrix.fold }}" \
            2>&1 | tee "model/v130-fold-${{ matrix.fold }}/train.log"
      - name: Verify fold isolation and audited guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold='${{ matrix.fold }}'
          r=json.loads(Path(f'model/v130-fold-{fold}/report-fold-{fold}.json').read_text())
          q=r['protocol']
          assert q['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert q['outer_fold_used_for_training'] is False
          assert q['outer_fold_used_for_epoch_selection'] is False
          assert q['runtime_inputs_use_annotations'] is False
          assert q['categorical_cardinality_head_exists'] is False
          assert q['presence_threshold_tuned'] is False
          assert q['presence_threshold'] == 0.5
          assert q['cardinality_decode'] == 'sum(event_presence>=0.5)'
          assert r['event_diagnostics']['status'] == 'disabled_before_run_after_static_audit'
          print('fold', fold,
                'epochs', r['data']['selected_epochs'],
                'v104', r['strata']['aggregate']['v104']['metrics']['global']['f1'],
                'v130', r['strata']['aggregate']['v130']['metrics']['global']['f1'],
                'prefix_violation', r['presence']['prefix_violation_rate'])
          PY
      - name: Upload V13 fold
        uses: actions/upload-artifact@v4
        with:
          name: v130-event-set-fold-${{ matrix.fold }}
          path: model/v130-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Summarize V13 outer-clean
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install summary dependency
        run: python -m pip install numpy
      - name: Download V13 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v130-event-set-fold-*
          path: model/v130-folds
          merge-multiple: false
      - name: Summarize five outer folds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v130-summary
          python -B scripts/summarize_v130_causal_event_set_decoder.py \
            --input-dir model/v130-folds \
            --output-dir model/v130-summary \
            2>&1 | tee model/v130-summary/summary.log
      - name: Verify clean aggregate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v130-summary/report.json').read_text())
          p=r['protocol']
          assert p['five_outer_composition_folds'] is True
          assert p['every_row_evaluated_once_outer_clean'] is True
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['categorical_cardinality_head_exists'] is False
          assert p['cardinality_is_event_presence_count'] is True
          assert p['presence_threshold_tuned'] is False
          print('clusters', r['data']['clusters'])
          print('global v104', r['strata']['aggregate']['v104']['metrics']['global']['f1'])
          print('global v130', r['strata']['aggregate']['v130']['metrics']['global']['f1'])
          print('poly delta', r['comparison']['v130_minus_v104_poly_exact'])
          print('k6 delta', r['comparison']['v130_minus_v104_k6_exact'])
          print('folds won', r['comparison']['folds_won_vs_v104'])
          print('promotion', r['comparison']['promotion_candidate'])
          PY
      - name: Upload V13 summary
        uses: actions/upload-artifact@v4
        with:
          name: v130-causal-event-set-summary
          path: model/v130-summary
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
