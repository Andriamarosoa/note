name: S135 no-training posterior Pareto combination of S133 and S134
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s135_s5_anchor_soft_posterior.py'
      - '.github/workflows/v273-s135-stitch.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s135-soft-stitch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stitch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s135_s5_anchor_soft_posterior --self-test
      - name: Fetch authentic SHA-verified original S5 fold0 posterior
        run: |
          set -euo pipefail
          mkdir -p model/archived
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/predictions.npz \
            analysis/evidence/v273-open-k0-k6/series5/models/fold0/report.json | tar -x -C model/archived
      - name: Fetch frozen S133 new student predictions from successful run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190510117
          name: v273-s133-two-lightgbm-S5-teacher-students
          path: model/s133
      - name: Fetch frozen S134 new student predictions from successful run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190754219
          name: v273-s134-soft-original-S5-teacher-student
          path: model/s134
      - name: Join original fold0 events and GOAT, apply fixed label-blind posterior anchoring
        run: |
          set -euo pipefail
          S133_FOLD="$(find model/s133 -name control111_fold0.npz -print -quit)"
          S133_GOAT="$(find model/s133 -name control111_GOAT.npz -print -quit)"
          S134_FOLD="$(find model/s134 -name heldout_fold0_teacher_probabilities.npz -print -quit)"
          S134_GOAT="$(find model/s134 -name GOAT_57_label_blind.npz -print -quit)"
          ARCHIVE=model/archived/analysis/evidence/v273-open-k0-k6/series5/models/fold0
          test -s "$S133_FOLD" && test -s "$S134_FOLD" && test -s "$S133_GOAT" && test -s "$S134_GOAT"
          python -u -m scripts.s135_s5_anchor_soft_posterior \
            --s133-fold0 "$S133_FOLD" --s134-fold0 "$S134_FOLD" \
            --s133-goat "$S133_GOAT" --s134-goat "$S134_GOAT" \
            --archived-teacher "$ARCHIVE/predictions.npz" \
            --teacher-info "$ARCHIVE/report.json" --out model/s135
          python - <<'PY'
          import json
          r=json.load(open('model/s135/report.json'))
          assert r['historic_fold0_rows']==15952 and r['GOAT_real_wave_events']==57
          assert not r['GuitarSet_true_K_read'] and not r['GOAT_MIDI_truth_read']
          assert not r['original_S5_recovered'] and not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/s135/
          retention-days: 30
