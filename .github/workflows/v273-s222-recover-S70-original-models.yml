name: S222 reconstruct four original S70 trained fold checkpoints bit-exact
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s222_recover_original_S70_fold_models.py'
      - '.github/workflows/v273-s222-recover-S70-original-models.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s222-original-S70-weights-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconstruct_original_s70_models:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original S70 fit numerics
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Download immutable original S69 historical fold replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38177948016
          name: v273-s69-s46-risk-replay
          path: model/S69
      - name: Download 59309 original PR16 vote and probability training rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-summary
          path: model/PR16
      - name: Download independent immutable original S70 saved historic predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38153394681
          name: v273-s70-poly-meta-replay
          path: model/S70_original
      - name: Reproduce four original trained logistic models and original threshold selection
        run: >-
          python -m scripts.s222_recover_original_S70_fold_models
          --s69 model/S69/predictions.npz
          --pr model/PR16/predictions.npz
          --probs model/PR16/probabilities.npz
          --s70 model/S70_original/predictions.npz
          --out model/S222
      - name: Require historical exact replay before models are eligible for future audio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/S222/report.json').read_text())
          assert r['historical_event_count']==59309
          assert r['recovered_fold_models']==4
          assert r['original_S70_crossfit_predictions_bit_exact']
          assert set(r['replay'])=={'proposed_poly','downward_poly'}
          assert all(v['mismatches']==0 for v in r['replay'].values())
          assert len(list(Path('model/S222/models').glob('*.joblib')))==4
          assert not r['external_audio_labels_used'] and not r['independent_ExactK_measured']
          assert not r['S80_promoted']
          print('S222 PASS four S70 original fold models and thresholds historically exact; no external labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s222-recovered-original-S70-four-fold-checkpoints-exact-history
          path: model/S222/
          retention-days: 90
