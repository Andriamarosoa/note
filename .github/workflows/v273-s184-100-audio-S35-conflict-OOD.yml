name: S184 independently audit 100 IDMT S35 general-vs-poly specialist conflicts and 58D shift
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s184_independent_s35_idmt_disagreement.py'
      - '.github/workflows/v273-s184-100-audio-S35-conflict-OOD.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s184-truthfree-crossheads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NumPy for independent descriptive audit only
        run: python -m pip install numpy==1.26.4
      - name: Verify all-K versus forced-K2plus interpretation
        run: python -m scripts.s184_independent_s35_idmt_disagreement --self-test
      - name: Load unseen real IDMT audio-only K expert posteriors
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38208926118
          name: v273-s183-IDMT-real-original-S35-fast-range-derived-no-annotations-no-S80
          path: model/S183
      - name: Load new 255 subsets without original S1-S4 equivalence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38208974455
          name: v273-s179-new-8vote-255groups-not-original-S1-S4-not-promoted
          path: model/S179
      - name: Count true original expert disagreement and pretrained acoustic feature shift
        run: |
          python -u -m scripts.s184_independent_s35_idmt_disagreement \
            --s183 model/S183/S178_IDMT_audio_only_S35_source_heads.npz \
            --s179 model/S179/S179_new_8vote_255group_audio_only.npz \
            --old analysis/evidence/v273-regression-loops/prepared/inputs.npz \
            --out model/S184
          python - <<'PY'
          import json
          d=json.load(open('model/S184/report.json'))
          assert d['native_unseen_audio_events']==100
          assert d['K2plus_predictions_by_first_four_forced_by_training_support']
          assert d['allclass_mean_K2_K3_K4_rows']==7
          assert d['new_255_groups_on_K234_events']==1785
          assert not d['XML_MIDI_new_true_K_read']
          assert not d['weights_or_thresholds_retrained']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s184-independent-S35-forced-poly-vs-allK-audio-no-label-audit
          path: model/S184/
          retention-days: 90
