name: S178 acquire genuine IDMT audio-only guitar benchmark and run original S35 experts
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s178_idmt_audio_only_native_s35_heads.py'
      - '.github/workflows/v273-s178-IDMT-audio-original-S35.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s178-idmt-original-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  external_idmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compatible frozen S35 numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Assert annotated data never passed to the historical model
        run: python -m scripts.s178_idmt_audio_only_native_s35_heads --self-test
      - name: Download exactly checksum-pinned original external corpus ZIP with no annotation file opens
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request
          from scripts.s178_idmt_audio_only_native_s35_heads import download
          from scripts.s177_preregister_external_polyphony_source import audit, API
          req=urllib.request.Request(API,headers={'Accept':'application/json','User-Agent':'S80-label-blind-research/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              source=audit(json.load(r))
          Path('model/input').mkdir(parents=True)
          path=Path('model/input/IDMT-SMT-GUITAR_V2.zip')
          download(source['source_url'],path,source['size_bytes'])
          print('Official external corpus ZIP downloaded; no XML, MIDI, JSON or annotation contents opened')
          PY
      - name: Retrieve original pretrained S35 experts only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37868356632
          name: v273-series35-extended-head-router
          path: model/S35
      - name: Infer original acoustic pretrained expert heads on deterministic selected IDMT WAV onsets
        run: |
          set -euo pipefail
          python -u -m scripts.s178_idmt_audio_only_native_s35_heads \
            --archive model/input/IDMT-SMT-GUITAR_V2.zip \
            --models model/S35 --out model/S178 --max-tracks 10 --max-events 10
          python - <<'PY'
          import json
          import numpy as np
          d=json.load(open('model/S178/report.json'))
          assert d['selected_wav_count']==10
          assert d['acoustic_only_events']>=10
          assert d['original_pretrained_acoustic_expert_count']==28
          assert not d['XML_MIDI_or_truth_read']
          assert not d['released_original_WAV_bytes']
          assert not d['training_on_new_dataset']
          assert not d['independent_ExactK_accuracy_measured']
          assert not d['promoted_S80']
          with np.load('model/S178/S178_IDMT_audio_only_S35_source_heads.npz',allow_pickle=False) as z:
              assert z['source_predicted_K'].shape==(d['acoustic_only_events'],7)
              assert z['source_probabilities'].shape==(d['acoustic_only_events'],7,7)
              assert not {'truth','true_K','midi','labels'}&set(z.files)
          PY
          rm -f model/input/IDMT-SMT-GUITAR_V2.zip
      - name: Publish only derived audio features checkpoint hashes and no-label research predictions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s178-IDMT-real-original-S35-audio-only-features-no-labels-no-raw-WAV-NO-S80
          path: model/S178/
          retention-days: 90
