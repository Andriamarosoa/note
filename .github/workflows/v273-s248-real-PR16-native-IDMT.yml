name: S248 genuine 12 original PR16 neural heads and 36 policies on 1034 native IDMT events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s248_real_PR16_12_neural_36_policies_native_IDMT.py'
      - '.github/workflows/v273-s248-real-PR16-native-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s248-original-PR16-native-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_12_PR16_MLP_frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original PR16 numpy_forward math ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Download unchanged original PR16 fold-zero trained 12 MLP snapshots and normalizers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-model-0
          path: model/PR16-original
      - name: Download original 1034 exact freeze-native audio summary58 trajectory42x49 on IDMT
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38302179397
          name: s234-idmt-unseen-original-S97-features-aligned-to-official-freeze-event-IDs
          path: model/S234
      - name: Download 46D original ownership geometry from actual V88 native boundaries and S5 527D proof
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38303479914
          name: s236-idmt-1034-real-original-V88-geometry46-and-S5-owned527-features
          path: model/S236
      - name: Actual 12 authentic original PR16 trained network forwards and exact 36 original policy decisions
        run: |
          python -m py_compile scripts/s248_real_PR16_12_neural_36_policies_native_IDMT.py
          python -u -m scripts.s248_real_PR16_12_neural_36_policies_native_IDMT \
            --s234 model/S234/S234_original_S97_audio_views_on_real_freeze_native_events.npz \
            --s236 model/S236/S236_original_owned527_native_reference_IDMT.npz \
            --models model/PR16-original/fold-0 \
            --out model/S248
      - name: Verify original all 12 trained neural heads and 36 exact historical policy votes on 1034 label-free native reference events
        run: |
          python - <<'PY'
          import json,numpy as np,hashlib
          from pathlib import Path
          r=json.load(open('model/S248/report.json'))
          assert r['original_reference_native_event_count']==1034
          assert r['original_trained_network_checkpoints']==12
          assert r['original_36_policy_definitions_exact']
          assert len(r['original_neural_head_SHA256'])==12
          assert not r['models_retrained'] and not r['XML_MIDI_content_read']
          assert not r['independent_accuracy_measured'] and not r['S80_promoted']
          p=Path('model/S248/pr16_external_36_policies.npz')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['output_SHA256']
          with np.load(p,allow_pickle=False) as z:
            assert z['pr16_policy_K'].shape==(1034,36)
            assert z['pr16_network_probabilities'].shape==(1034,12,7)
            assert z['pr16_vote_count'].shape==(1034,7)
            assert np.isin(z['pr16_policy_K'],range(7)).all()
          print('S248 PASS all 12 frozen trained original PR16 MLPs and 36 original policy formulas on 1034 native IDMT events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s248-genuine-original-12-PR16-36policy-1034-native-IDMT
          path: model/S248/
          retention-days: 90
