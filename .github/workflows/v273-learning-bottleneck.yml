name: Diagnose frozen count learning and generalization - fold 3

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths: ['analysis/v273-learning-bottleneck-launch.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v273-learning-bottleneck-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  AUDIT_TAG: v273-learning-bottleneck-${{ github.run_id }}

jobs:
  protocol:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest -v test.test_v273_learning_bottleneck
      - name: Preserve diagnostic protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Frozen count learning and generalization audit - fold 3' \
            --notes-file analysis/v273-learning-bottleneck-protocol.md

  audit:
    needs: protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        weighting: [uniform, weighted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Restore exact frozen inputs and checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_WEIGHTING: ${{ matrix.weighting }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          cfg=json.loads(Path('analysis/v273-learning-bottleneck-launch.json').read_text())
          Path('model/download').mkdir(parents=True)
          for asset in cfg['assets']:
              if asset['destination'] not in ('bundle',os.environ['AUDIT_WEIGHTING']):
                  continue
              subprocess.run(['gh','release','download',cfg['source_release'],'--repo','Andriamarosoa/note',
                              '--pattern',asset['asset'],'--dir','model/download'],check=True)
              extract_verified(Path('model/download')/asset['asset'],Path('model')/asset['destination'],asset['sha256'])
          PY
      - name: Evaluate frozen models on original fit and held-out rows
        run: |
          python -B scripts/audit_v273_learning_bottleneck.py --model model/${{ matrix.weighting }} \
            --bundle model/bundle --config analysis/v273-native-paired-config.json \
            --weighting ${{ matrix.weighting }} --output model/audit-${{ matrix.weighting }}
      - name: Preserve complete or partial diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/audit-${{ matrix.weighting }} \
            --name learning-${{ matrix.weighting }} --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-${{ matrix.weighting }}
          path: model/audit-${{ matrix.weighting }}
          if-no-files-found: warn
          retention-days: 90
