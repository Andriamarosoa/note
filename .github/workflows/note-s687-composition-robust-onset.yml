name: S687 composition-robust genuine onset novelty under four locks
on:
  push:
    branches: [codex/note-s687-composition-robust-onset-selection]
    paths:
      - scripts/s687_composition_robust_novelty.py
      - test/test_s687_composition_robust_novelty.py
      - .github/workflows/note-s687-composition-robust-onset.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: note-s687-train-nine-compositions
  cancel-in-progress: true
jobs:
  train_composition_guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native strict LIVE and NoteOff S675 requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify strict nine-composition policy and causal rules
        run: |
          python -m compileall -q scripts/s687_composition_robust_novelty.py test/test_s687_composition_robust_novelty.py
          python -m unittest -v test.test_s687_composition_robust_novelty test.test_s686_causal_fundamental_novelty
      - name: Restore unchanged frozen S675 trained checkpoint from successful Windows CI
        run: |
          mkdir -p /tmp/s687_s675
          gh run download 39056766998 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s687_s675
          test -f /tmp/s687_s675/s675_hazard.joblib
          test -f /tmp/s687_s675/s675_checkpoint.json
      - name: Score 36 TRAIN nine-composition policies, strict S675 full notes, then DEV
        run: python -m scripts.s687_composition_robust_novelty --checkpoint /tmp/s687_s675/s675_hazard.joblib --out /tmp/s687
      - name: Archive true Onset K NoteOff full-note nonregression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S687_9_COMPOSITION_ONSET_EXACTK_S675_GUARDS
          path: /tmp/s687/report.json
          if-no-files-found: warn
          retention-days: 60
