name: S338 S353 full prelabel original S80 on 477 prospective Dataset1 chord events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s338_S18_consensus_dataset1_477.py'
      - 'scripts/s339_S97_bridge_dataset1_477.py'
      - 'scripts/s340_S29_19_dataset1_477.py'
      - 'scripts/s341_S35_19_dataset1_477.py'
      - 'scripts/s342_original_five_S45_dataset1_477.py'
      - 'scripts/s343_recurrent_S45_dataset1_477.py'
      - 'scripts/s344_original_fundamental58_dataset1_477.py'
      - 'scripts/s345_full_S45_S46_dataset1_477.py'
      - 'scripts/s346_S46_consensus_dataset1_477.py'
      - 'scripts/s347_S274_twofold_dataset1_477.py'
      - 'scripts/s348_PR16_36_dataset1_477.py'
      - 'scripts/s349_S69_fourfold_dataset1_477.py'
      - 'scripts/s350_S70_fourfold_dataset1_477.py'
      - 'scripts/s351_S71_S72_dataset1_477.py'
      - 'scripts/s352_full_S80_dataset1_477.py'
      - 'scripts/s353_freeze_paired_S80_dataset1_477.py'
      - '.github/workflows/v273-s338-s353-full-chords-S80-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s338-s353-full-frozen-chord-477-S80-PREXML
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Require exact 133 trained original S18 fold outputs on unlabelled 477 native events
        run: gh run watch 38327166477 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Restore immutable 477 original S18 and 527D feature bank and official reference
        run: |
          gh run download 38327166477 \
            -n s336-s337-original-477-S5-S18-folds-IDMT-dataset1-PREXML \
            -D model/S336S337 --repo ${{ github.repository }}
          gh run download 38327110346 \
            -n s334-s335-12-IDMT-dataset1-chords-477-original-S97-527D-PREXML \
            -D model/S334S335 --repo ${{ github.repository }}
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
      - name: Compute real S18 3 of 4 fold-neutral parent then genuine S97 native audio view
        run: |
          python -u -m scripts.s338_S18_consensus_dataset1_477 \
            --s337 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --out model/S338
          python -u -m scripts.s339_S97_bridge_dataset1_477 \
            --s337 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s334 model/S334S335/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --out model/S339
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S338/report.json'))
          b=json.load(open('model/S339/report.json'))
          assert a['native_event_count']==477 and b['original_canonical_reference_events']==477
          with np.load('model/S338/S338_original_S18_foldneutral_477_IDMT.npz',allow_pickle=False) as z:
            assert z['S18_piece_neutral_consensus_K'].shape==(477,)
          with np.load('model/S339/S339_original_IDMT_dataset1_native_S97_audio.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(477,58)
          print('S338/S339 PASS fold-neutral S18 and S97 source, no XML')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chords-477-S338-S339-source
          path: |
            model/S338/
            model/S339/
  trained_ten:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S338-S339-source
          path: model/source
      - name: Restore 477 real original S18 trained fold predictions and historical S29/S20/S35 models
        run: |
          gh run download 38327166477 \
            -n s336-s337-original-477-S5-S18-folds-IDMT-dataset1-PREXML \
            -D model/S336S337 --repo ${{ github.repository }}
          gh run download 37865173636 -n v273-series29-stepwise-scheduler -D model/S29 --repo ${{ github.repository }}
          gh run download 37858383973 -n v273-series20-residual -D model/S20 --repo ${{ github.repository }}
          gh run download 37868356632 -n v273-series35-extended-head-router -D model/S35 --repo ${{ github.repository }}
      - name: Run original 19 S29 trained Q/RNN and 36 original S35 experts
        run: |
          python -u -m scripts.s340_S29_19_dataset1_477 \
            --s29 model/S29 --s20 model/S20 \
            --s18 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
            --out model/S340
          python -u -m scripts.s341_S35_19_dataset1_477 \
            --s209 model/S340/S340_original_s29_all_19_dataset1.npz \
            --s18 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
            --s35 model/S35 --out model/S341
      - name: Restore ten original pretrained S11/S12/S38/S40/S41 and recurrent S19/S20/S25 families
        run: |
          gh run download 37853663514 -n v273-series11-native-risk -D model/S11 --repo ${{ github.repository }}
          gh run download 37853979683 -n v273-series12-full-audio -D model/S12 --repo ${{ github.repository }}
          gh run download 37880386031 -n v273-series38-poly-harmonic-expert -D model/S38 --repo ${{ github.repository }}
          gh run download 37880762289 -n v273-series40-temporal-cnn -D model/S40 --repo ${{ github.repository }}
          gh run download 37881191015 -n v273-series41-six-head-neural-fusion -D model/S41 --repo ${{ github.repository }}
          gh run download 37858017067 -n v273-series19-recurrent -D model/S19 --repo ${{ github.repository }}
          gh run download 37862417522 -n v273-series25-trained-Bfirst -D model/S25 --repo ${{ github.repository }}
      - name: Run ten real trained S45 sources on same 477 original V88 candidate groups
        run: |
          python -u -m scripts.s342_original_five_S45_dataset1_477 \
            --s18 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
            --s11 model/S11 --s12 model/S12 --s38 model/S38 --s40 model/S40 --s41 model/S41 \
            --out model/S342
          python -u -m scripts.s343_recurrent_S45_dataset1_477 \
            --s18 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
            --s19 model/S19 --s20 model/S20 --s25 model/S25 --out model/S343
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S342/report.json'))
          b=json.load(open('model/S343/report.json'))
          assert a['events']==b['events']==477 and a['branches']==b['branches']==19
          with np.load('model/S343/five_rebased_recurrent_S19_S20_S24_S25_S27.npz',allow_pickle=False) as z:
            assert z['proposals_K'].shape==(19,477,5)
          print('S340..S343 PASS trained original 19 source branches and ten S45 family models')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chords-477-S340-S343-ten
          path: |
            model/S340/
            model/S341/
            model/S342/
            model/S343/
  trained_rare:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore 12 original chord SHA pinned WAV candidates, source S97 features and prelabel ZIP names
        run: |
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
          gh run download 38327110346 \
            -n s334-s335-12-IDMT-dataset1-chords-477-original-S97-527D-PREXML \
            -D model/S334S335 --repo ${{ github.repository }}
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
      - name: Build original harmonic/fundamental 58D features without XML for each of 477 real native chord events
        run: |
          python -u -m scripts.s344_original_fundamental58_dataset1_477 \
            --s334 model/S334S335/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --s332report model/S332/report.json \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S344
      - name: Restore five historical rare original trained expert checkpoints under historical sklearn ABI
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 h5py==3.16.0
          gh run download 38234363815 \
            -n recovered-five-original-family-runtime-historical-and-GOAT-proof \
            -D model/rare-runtime --repo ${{ github.repository }}
      - name: Evaluate original trained rare S1-S4/coherent family, with full history proof and no new XML
        run: |
          python -u -m scripts.recover_v273_missing_s45 \
            --runtime model/rare-runtime/runtime \
            --historical-proof model/rare-runtime/historical/report.json \
            --external model/S344/S344_fundamental58_dataset1_original_477.npz \
            --s5 model/S344/S344_original_S5_label_free_reference.npz \
            --out model/rare
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/rare/report.json'))
          assert r['external_events']==477 and len(r['family_ids'])==5
          with np.load('model/rare/external_five_families.npz',allow_pickle=False) as z:
            assert z['predictions'].shape==(19,477,5)
          print('S344 five ORIGINAL rare families PASS no new XML')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chords-477-S344-rare5
          path: |
            model/S344/
            model/rare/
  pr16:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore original trained 12 neural PR16 and 36 policy contracts
        run: |
          gh run download 37837235723 -n v273-open-model-0 -D model/PR16-original --repo ${{ github.repository }}
          gh run download 38327110346 \
            -n s334-s335-12-IDMT-dataset1-chords-477-original-S97-527D-PREXML \
            -D model/S334S335 --repo ${{ github.repository }}
      - name: Replay genuine 12 neural PR16 and 36 original PR16 policies before XML
        run: |
          python -u -m scripts.s348_PR16_36_dataset1_477 \
            --s334 model/S334S335/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s335 model/S334S335/S335/S335_IDMT_dataset1_true_original_S5_527D_input.npz \
            --models model/PR16-original/fold-0 --out model/S348
          python - <<'PY'
          import numpy as np
          with np.load('model/S348/pr16_external_36_policies.npz',allow_pickle=False) as z:
            assert z['pr16_policy_K'].shape==(477,36)
          print('S348 PASS original 12 pretrained neural/36 decision heads')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chords-477-S348-PR16
          path: model/S348/
  s46:
    needs: [source, trained_ten, trained_rare]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S338-S339-source
          path: model/source
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S340-S343-ten
          path: model/ten
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S344-rare5
          path: model/rarebank
      - name: Restore original S18 fourfold source and 304 S45 pretrained Ridge risks
        run: |
          gh run download 38327166477 \
            -n s336-s337-original-477-S5-S18-folds-IDMT-dataset1-PREXML \
            -D model/S336S337 --repo ${{ github.repository }}
          gh run download 37891039201 \
            -n v273-series45-specialized-risk-heads -D model/S45 --repo ${{ github.repository }}
      - name: Execute ALL 16 original S45 champion families, all 304 Ridge risk heads and 193 S46 original policies
        run: |
          python -u -m scripts.s345_full_S45_S46_dataset1_477 \
            --five model/rarebank/rare/external_five_families.npz \
            --s35 model/ten/S341/S341_original_s29_to_s35_dataset1.npz \
            --s242 model/ten/S342/five_rebased_S11_S12_S38_S40_S41.npz \
            --s243 model/ten/S343/five_rebased_recurrent_S19_S20_S24_S25_S27.npz \
            --s18 model/S336S337/S337/S337_original_S5_to_S18_true_V88_native_IDMT_477.npz \
            --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
            --models model/S45/models \
            --catalog analysis/v273_s45_original_champion_catalog.json --out model/S345
          python -u -m scripts.s346_S46_consensus_dataset1_477 \
            --s246 model/S345 \
            --s338 model/source/S338/S338_original_S18_foldneutral_477_IDMT.npz \
            --out model/S346
          python -u -m scripts.s347_S274_twofold_dataset1_477 \
            --s346 model/S346/S346_original_193_S46_foldneutral_477_IDMT.npz \
            --s338 model/source/S338/S338_original_S18_foldneutral_477_IDMT.npz \
            --out model/S347
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S345/report.json'))
          assert r['original_native_reference_event_count']==477
          assert r['original_s45_ridge_checkpoint_count']==304
          assert r['original_s46_policy_count']==193
          with np.load('model/S347/S347_original_source_counterfactual_S274_gate_477.npz',allow_pickle=False) as z:
            assert z['S46_193_policy_K'].shape==(477,193)
          print('S345/S347 PASS complete original S46 policy bank and genuine S274 second variant')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chords-477-S345-S347-S46
          path: |
            model/S345/report.json
            model/S346/
            model/S347/
  s80_and_seal:
    needs: [source, pr16, s46]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S338-S339-source
          path: model/source
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S345-S347-S46
          path: model/fusion
      - uses: actions/download-artifact@v4
        with:
          name: chords-477-S348-PR16
          path: model/pr16
      - name: Restore all real original S69 S70 S71 S72 S79 and final S80 trained model checkpoints and frozen baseline
        run: |
          gh run download 38177948016 -n v273-s69-s46-risk-replay -D model/S69rules --repo ${{ github.repository }}
          gh run download 38296428889 -n s222-recovered-original-S70-four-fold-checkpoints-exact-history -D model/S222 --repo ${{ github.repository }}
          gh run download 38296880555 -n s224-original-four-S71-acoustic-risk-checkpoints-historic-exact -D model/S224 --repo ${{ github.repository }}
          gh run download 38297080728 -n s225-recovered-original-S72-four-temporal-risk-checkpoints -D model/S225 --repo ${{ github.repository }}
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/S80historic --repo ${{ github.repository }}
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
      - name: Replay every pretrained S69 through S80 historical checkpoint for ORIGINAL and S274 source S46 banks on 477 identical native events
        run: |
          set -euo pipefail
          for scenario in original twofold; do
            if [ "$scenario" = original ]; then
              s46="model/fusion/S346/S346_original_193_S46_foldneutral_477_IDMT.npz"
            else
              s46="model/fusion/S347/S347_original_source_counterfactual_S274_gate_477.npz"
            fi
            python -u -m scripts.s349_S69_fourfold_dataset1_477 \
              --s247 "$s46" --pr16 model/pr16/S348/pr16_external_36_policies.npz \
              --rules model/S69rules/report.json --out "model/S349_$scenario"
            python -u -m scripts.s350_S70_fourfold_dataset1_477 \
              --s221 "model/S349_$scenario/S349_original_S69_fourfold_rule_consensus_IDMT.npz" \
              --s85 model/pr16/S348/pr16_external_36_policies.npz \
              --s222 model/S222 --out "model/S350_$scenario"
            python -u -m scripts.s351_S71_S72_dataset1_477 \
              --s69 "model/S349_$scenario/S349_original_S69_fourfold_rule_consensus_IDMT.npz" \
              --s70 "model/S350_$scenario/S350_original_S70_4fold_no_oracle_IDMT.npz" \
              --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
              --s71 model/S224 --s72 model/S225 --out "model/S351_$scenario"
            python -u -m scripts.s352_full_S80_dataset1_477 \
              --s226 "model/S351_$scenario/S351_original_S71_S72_native_IDMT.npz" \
              --s219 "$s46" --s85 model/pr16/S348/pr16_external_36_policies.npz \
              --s97 model/source/S339/S339_original_IDMT_dataset1_native_S97_audio.npz \
              --s80 model/S80historic --out "model/S352_$scenario"
          done
      - name: SHA seal two complete reconstructed S80 predictions plus immutable official freeze_local_combo 477 original V88 event IDs BEFORE XML
        run: |
          python -u -m scripts.s353_freeze_paired_S80_dataset1_477 \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --old model/S352_original/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --new model/S352_twofold/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --out model/S353
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S353/prelabel_comparison.json'))
          assert r['native_events']==477 and r['WAV_count']==12
          assert not r['truth_XML_or_MIDI_read'] and not r['official_S80_promotion']
          assert r['all_results_on_exact_same_original_V88_native_events']
          for stage in ('original','twofold'):
            with np.load(f'model/S352_{stage}/S352_full_original_S80_unseen_IDMT_477_frozen.npz',allow_pickle=False) as z:
              assert z['s80_K'].shape==(477,)
          print('S353 SEALED original official, reconstructed S80 and S274 S80 BEFORE any prospective chord XML is opened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chords-477-S349-S353-three-frozen-original-S80-PREXML
          path: |
            model/S349_original/report.json
            model/S349_twofold/report.json
            model/S350_original/report.json
            model/S350_twofold/report.json
            model/S351_original/report.json
            model/S351_twofold/report.json
            model/S352_original/
            model/S352_twofold/
            model/S353/
          retention-days: 90
