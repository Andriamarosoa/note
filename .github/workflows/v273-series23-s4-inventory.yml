name: V27.3 S23 inspect historical S4 poly donor
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series23-s4-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve permanent original open-K0-K6 summary archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern v273-open-summary.tar --dir model/source
          mkdir -p model/summary
          tar -xf model/source/v273-open-summary.tar -C model/summary
      - name: Inventory S2/S3/S4/S5 predictions and model provenance
        run: |
          echo '# Model series4 donor inventory' >> "$GITHUB_STEP_SUMMARY"
          find model/summary -maxdepth 6 -type f | sort | grep -E 'series[2345]|predictions.npz|report.json' | head -80 | tee model/series23-inventory.txt
          cat model/series23-inventory.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect S4 archived estimator source and original probability matrix
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
          python - <<'PY'
          import json
          import joblib
          import numpy as np
          from numpy.random import _pickle as numpy_pickle
          original_generator_ctor=numpy_pickle.__bit_generator_ctor
          def compatible_generator_ctor(name):
              if isinstance(name,type) and issubclass(name,np.random.BitGenerator):
                  return name()
              return original_generator_ctor(name)
          numpy_pickle.__bit_generator_ctor=compatible_generator_ctor
          from pathlib import Path
          dest=Path('model/series23-source-schema.json')
          weights=Path('analysis/evidence/v273-open-k0-k6/series4/models')
          schema={'models':{},'summary':{}}
          for p in sorted(weights.glob('fold*__*.joblib')):
              obj=joblib.load(p)
              schema['models'][p.name]={
                  'type':type(obj).__name__,
                  'keys':list(obj.keys()) if isinstance(obj,dict) else [],
                  'value_types':{k:type(v).__name__ for k,v in obj.items()} if isinstance(obj,dict) else {},
                  'array_shapes':{k:list(v.shape) for k,v in obj.items()
                       if hasattr(v,'shape')} if isinstance(obj,dict) else {},
                  'estimator_features':{k:int(v.n_features_in_) for k,v in obj.items()
                       if hasattr(v,'n_features_in_')} if isinstance(obj,dict) else {}
              }
          with np.load('model/summary/predictions.npz',allow_pickle=False) as z:
              schema['summary']['keys']=list(z.files)
              schema['summary']['shapes']={k:list(z[k].shape) for k in z.files}
              if 'variant_ids' in z:
                  schema['summary']['variant_ids']=list(map(str,z['variant_ids']))[:30]
          rep=json.loads(Path('model/summary/report.json').read_text())
          schema['summary']['report_keys']=list(rep.keys())
          dest.write_text(json.dumps(schema,indent=2)+'\n')
          print(json.dumps(schema)[:8500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v273-series23-S4-inventory
          path: |
            model/series23-inventory.txt
            model/series23-source-schema.json
          retention-days: 90
