name: S390 original GuitarSet heldfold NEW K5 acoustic producer NO PROMOTION
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s390_k5_new_acoustic_candidate_heldfold.py'
      - '.github/workflows/v273-s390-new-K5-acoustic-heldfold.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s390-k5-crossfit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  training_and_K5_K4_leakage_guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Restore original frozen audio features and separated GuitarSet truth ONLY
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore original historical held-piece OOF S80 prediction benchmark
        run: |
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/OldS80 --repo ${{ github.repository }}
      - name: Restore S272 reconstructed S80 unchanged predictions for descriptive-only paired ledger
        run: |
          gh run download 38314291222 -n s272-guitarset-59309-new-full-original-weight-S80-foldneutral-locked -D model/S272 --repo ${{ github.repository }}
      - name: Restore independent original YourMT3+ checkpoint prediction export unchanged
        run: |
          gh run download 37605163312 -n yourmt3-exactk-summary -D model/YourMT3 --repo ${{ github.repository }}
      - name: Train per-fold 104D and 1133D K5 proposal heads, score strict OOF and descriptive S272-only paired results
        run: |
          python -u -m scripts.s390_k5_new_acoustic_candidate_heldfold \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --historical model/OldS80/predictions.npz \
            --s272 model/S272/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --your model/YourMT3/predictions.npz \
            --out model/S390
          python - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('model/S390/report.json').read_text())
          assert a['status']=='S390_K5_SOURCE_ACOUSTIC_PRODUCER_TRUE_FOLD_HELD_DEVELOPMENT'
          assert a['true_group_and_fold_disjoint_new_model']
          assert not a['official_promotion'] and not a['original_S80_checkpoint_changed']
          assert set(a['reports'])=={'audio104','audio1133'}
          for view in a['reports']:
              assert len(a['reports'][view]['fold_proofs'])==4
              assert all(p['member_intersections_after_exclusion']==0 for p in a['reports'][view]['fold_proofs'])
              assert len(list(pathlib.Path('model/S390').glob(view+'_trained_without_fold*.joblib')))==4
          print('S390 TRAINING PASS: real K5 producer, 8 models, strict source heldfold, no reference update')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s390-true-original-heldfold-GuitarSet-104D-1133D-K5-source-trained-DIAGNOSTIC
          path: model/S390/
          retention-days: 90
