name: Audit native overcount true K below 4 - fold 3

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths: ['analysis/v273-low-k-audit-launch.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v273-low-k-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  AUDIT_TAG: v273-low-k-audit-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - run: python -m unittest -v test.test_v273_low_k_audit test.test_v273_window_pair
      - name: Preserve diagnostic protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Native low-K overcount audit - fold 3 only' \
            --notes-file analysis/v273-low-k-audit-protocol.md
      - name: Restore checksum-pinned outer inputs and four completed models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          cfg=json.loads(Path('analysis/v273-low-k-audit-launch.json').read_text())
          Path('model/download').mkdir(parents=True)
          for asset in cfg['assets']:
              subprocess.run(['gh','release','download',asset['tag'],'--repo','Andriamarosoa/note',
                              '--pattern',asset['asset'],'--dir','model/download'],check=True)
              extract_verified(Path('model/download')/asset['asset'],Path('model')/asset['destination'],asset['sha256'])
          PY
      - name: Download pinned annotations
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          python - <<'PY'
          from scripts.rebuild_v273_sources import digest
          assert digest('data/GuitarSet/annotation.zip','md5')=='b39b78e63d3446f2e54ddb7a54df9b10'
          PY
      - name: Audit labels, replay actual models and probe low-K overcounts
        run: |
          python -B scripts/audit_v273_low_k.py --results model/results --outer model/outer \
            --annotations data/GuitarSet/annotation.zip --config analysis/v273-native-paired-config.json \
            --probe --output model/low-k-audit
      - name: Preserve complete or partial diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/low-k-audit \
            --name low-k-audit --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: low-k-audit
          path: model/low-k-audit
          if-no-files-found: warn
          retention-days: 90
