name: S581 prospective five piano 49-pitch acoustic onset features at all V88 K0-K6 frozen source times PREMIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s581_fifth_original_49_pitch_physics_PREMIDI.py
      - .github/workflows/v273-s581-fifth-49pitch-WAV-physics-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_unseen_piano_prelabeled_49_pitch_acoustic_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install raw 49-note and harmonic source features
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2
      - name: Test raw spectral feature ABI without MIDI
        run: |
          python -m py_compile scripts/s581_fifth_original_49_pitch_physics_PREMIDI.py
          python -m scripts.s581_fifth_original_49_pitch_physics_PREMIDI --self-test
      - name: Restore SHA-pinned preselected five new composer names and original V88 event predictions
        run: |
          gh run download 38674975248 -n s577-fifth-novel-five-original-maestro-train-composers-after28-exposed-ONLY-METADATA -D model/S577 --repo "${{ github.repository }}"
          gh run download 38675197873 -n s579-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S579 --repo "${{ github.repository }}"
          gh run download 38675300000 -n s580-next-five-S577-BasicPitch-original-pitch-names-PREMIDI -D model/S580 --repo "${{ github.repository }}"
      - name: Verify source whole WAV SHA from S579 and extract original all V88 K0 note physics without opening MIDI
        run: |
          python -u -m scripts.s581_fifth_original_49_pitch_physics_PREMIDI \
            --manifest model/S577/report.json \
            --v88 model/S579/S579_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S579/report.json \
            --bp model/S580/S580_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --bp-report model/S580/report.json --out model/S581
          python - <<'PY'
          import json
          r=json.load(open('model/S581/report.json'))
          assert r['status']=='S581_PRELABEL_FIVE_NEW_PIANO_ALL_V88_RAW_49_PITCH_FEATURES'
          assert len(r['per_recording'])==5
          assert r['original_V88_onset_candidates']>0
          assert r['real_audio_piano_five_source_WAV_SHAs_verified']
          assert r['all_49_pitch_features_at_every_piano_V88_event']
          assert r['no_original_true_MIDI_annotation_read'] and r['no_promotion']
          print('S581 SUCCESS five composer 49x11 acoustic NOTE_ON pitch features preMIDI sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s581-next-five-S577-composers-V88-raw49-pitch-PREMIDI
          path: model/S581/
          retention-days: 90
