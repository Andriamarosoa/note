name: V27.3 Native Global Polyguard Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'scripts/summarize_v273_harmonic_global_polyguard.py'
      - '.github/workflows/v273-harmonic-global-polyguard.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed scoring libraries
        run: python -m pip install numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - name: Verify source
        run: |
          python -m py_compile scripts/summarize_v273_harmonic_global_polyguard.py
          python -m py_compile scripts/summarize_v273_harmonic_global.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37605163312
          name: yourmt3-exactk-cohort
          path: model/cohort
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37740493178
          pattern: v273-harmonic-global-fold-*
          path: model/features
      - name: Evaluate poly-protected full K0-K6 Exact-K
        run: |
          python -B scripts/summarize_v273_harmonic_global_polyguard.py \
            --cohort model/cohort \
            --input-root model/features \
            --output model/result
      - name: Summarize exact K results
        run: cat model/result/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-global-polyguard-audit
          path: model/result/
          retention-days: 90
