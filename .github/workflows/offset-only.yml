name: offset ONLY exact source-score revalidation
on:
  push:
    branches: [codex/note-best-offset-s708-protected]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: offset-only-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencies and single-axis tests
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 
          
          python -m unittest discover -s tests -v
  signed_fit80:
    needs: smoke
    if: contains(github.event.head_commit.message, '[run-fit80]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pin scoring dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 
          
      - name: Read sealed S800 manifest and signed FIT80 tracks
        run: |
          mkdir -p /tmp/only_offset/manifest /tmp/only_offset/traces /tmp/only_offset/s708
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/only_offset/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/only_offset/traces
          META="$(find /tmp/only_offset/manifest -name report.json -type f -print -quit)"
          FIT="$(find /tmp/only_offset/traces -name fit_000.json -type f -print -quit)"
          test -s "$META"; test -s "$FIT"
          printf '%s\n' "$META" > /tmp/only_offset/manifest_path
          printf '%s\n' "$(dirname "$FIT")" > /tmp/only_offset/traces_dir
          

      - name: Revalidate the ONLY preserved offset raw metric on 80 tracks
        run: |
          python -m scripts.replay_signed --axis offset --manifest "$(cat /tmp/only_offset/manifest_path)" --traces "$(cat /tmp/only_offset/traces_dir)" --out /tmp/only_offset/result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OFFSET_ONLY_H0_FIT80
          path: /tmp/only_offset/result/report.json
          if-no-files-found: warn
          retention-days: 45
