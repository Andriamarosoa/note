name: S174 independently replay restored original S1-S4 checkpoints without truth
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s174_replay_archived_s1_s4_without_truth.py'
      - '.github/workflows/v273-s174-replay-restored-original-S1-S4.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s174-original-checkpoints-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_original_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original regression loop environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Test archived replay prohibition of labels and data contract
        run: python -m scripts.s174_replay_archived_s1_s4_without_truth --self-test
      - name: Fetch S172 independently recovered trained archive outputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38205875589
          name: v273-s172-original-S1-S3-S4-recovered-archive-checksums-not-full-S45
          path: model/S172
      - name: Run exact historical original frozen S1 S2 S3 S4 decisions on 7493 eligible historical events
        run: |
          set -euo pipefail
          python -u -m scripts.s174_replay_archived_s1_s4_without_truth \
            --root . --restored model/S172/recovered_historical_models --out model/S174
          python - <<'PY'
          import json
          r=json.load(open('model/S174/report.json'))
          assert len(r['historical_regression_family_proofs'])==4
          assert all(x['historical_original_decision_mismatches']==0
                     for x in r['historical_regression_family_proofs'])
          assert r['historical_trueK_or_MIDI_read'] is False
          assert r['new_audio_family_count_still']==11
          assert not r['original_S80_validated']
          assert not r['official_S80_promotion']
          PY
      - name: Preserve replay checksums and negative S80 promotion receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s174-restored-original-S1-S4-frozen-replay-NO-GOAT-NO-S80
          path: model/S174/
          retention-days: 90
