name: S413 paired regression audit S412 continuous WAV vs frozen user S408
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s413_compare_S412_vs_user_reference_S408_paired_note_offset_errors.py'
      - '.github/workflows/v273-s413-paired-S412-vs-S408-offset-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s413-true-S408-S412-paired-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit_held_song_pitch_and_offset_corrections_regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify exact paired note correction regression counts
        run: |
          python -m py_compile scripts/s413_compare_S412_vs_user_reference_S408_paired_note_offset_errors.py
          python -u -m scripts.s413_compare_S412_vs_user_reference_S408_paired_note_offset_errors --self-test
      - name: Restore immutable S412 song-held outputs (including original frozen S408)
        run: |
          gh run download 38375133317 -n s412-songheld-REAL-full-WAV-note-offset-vs-S408-user-baseline-NOPROMOTION -D model/S412 --repo ${{ github.repository }}
          test -f model/S412/S412_continuous_MIC_note_offset_4fold_predictions.npz
      - name: Retrieve source GuitarSet real JAMS only for scoring
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Evaluate corrections/regr by K composition duration and octave and preserve S408
        run: |
          python -u -m scripts.s413_compare_S412_vs_user_reference_S408_paired_note_offset_errors \
            --predictions model/S412/S412_continuous_MIC_note_offset_4fold_predictions.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S413
          python - <<'PY'
          import json
          r=json.load(open('model/S413/report.json'))
          assert r['status']=='S413_FROZEN_S412_VS_ACTIVE_S408_PAIRED_ERRORS'
          assert r['report']['all']['n']==25120
          assert r['report']['all']['S408_correct']==13050
          assert r['report']['all']['S412_correct']==14313
          assert r['S408_baseline_still_active']
          assert sum(x['n'] for x in r['report']['by_duration'].values())==25120
          assert sum(x['n'] for x in r['report']['by_song_fold'].values())==25120
          print('S413 PASS paired 25120 note corrections/regressions and frozen S408 baseline')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s413-paired-S412-vs-active-S408-note-offset-gains-regressions-GuitarSet
          path: model/S413/
          retention-days: 90
