name: V27.3 S20 audit B feedback regressions by K
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series20-feedback-audit.yml'
      - 'scripts/audit_v273_aba_feedback.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Retrieve original trained residual feedback and no-B controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37858383973 --repo "$GITHUB_REPOSITORY" --name v273-series20-residual --dir model/S20
      - name: Audit all K0-K6 transitions and every corrected/regressed event
        run: python -m scripts.audit_v273_aba_feedback --input model/S20 --output model/S20-feedback-audit
      - name: Publish causal-control paired audit and evidence
        run: cat model/S20-feedback-audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-series20-B-feedback-audit
          path: model/S20-feedback-audit/
          retention-days: 90
