name: V18 evidence-seeded candidate competition

on:
  push:
    branches: [v180-evidence-seeded-competition]
    paths:
      - 'scripts/train_v180_evidence_seeded_competition.py'
      - 'scripts/run_v180_reporting_compat.py'
      - 'scripts/summarize_v180_evidence_seeded_competition.py'
      - '.github/workflows/v180-evidence-seeded-competition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_V173_RUN: '33829092700'
  CONTROL_SEED: '16061'

jobs:
  preflight:
    name: V18 evidence-seeded competition preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V18
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v180_evidence_seeded_competition.py
          python -m py_compile scripts/run_v180_reporting_compat.py
          python -m py_compile scripts/summarize_v180_evidence_seeded_competition.py
      - name: Prove V18 treatment
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        run: |
          python - <<'PY'
          import random
          import numpy as np
          import tensorflow as tf
          from tensorflow import keras
          from scripts import train_v172_mass_preserving_exchangeable as v172
          from scripts import train_v173_poibin_count_consistency as v173
          from scripts import train_v180_evidence_seeded_competition as v180

          assert v180.DEFAULT_SEED == v173.DEFAULT_SEED == 16061
          assert v180.PRESENCE_THRESHOLD == v173.PRESENCE_THRESHOLD == .5
          assert v173.COUNT_NLL_WEIGHT == .35
          assert len(v172.PERMUTATIONS) == 720
          assert v180.EVENT_QUERIES == 6
          assert v180.FUSED_FEATURE_FROM_END == 3

          # Same six-decision coefficient algebra as canonical V17.3.
          labels=np.zeros((200,6),dtype=np.float32)
          labels[:100,0]=1; labels[:50,1]=1; labels[:24,2]=1
          labels[:10,3]=1; labels[:4,4]=1; labels[:1,5]=1
          spec=v172._weight_spec(labels,np.arange(len(labels)))
          for k,row in spec['mass']['proof_by_k'].items():
              assert abs(row['original_total_presence_coefficient_mass']-row['compressed_total_presence_coefficient_mass']) < 1e-9, (k,row)

          tf.keras.backend.clear_session()
          random.seed(16061); np.random.seed(16061); tf.random.set_seed(16061)
          model,lw,token_shape=v180._build_model(spec)
          assert lw['event_count_norm'] == 0.0
          assert model.get_layer('v180_evidence_anchor_indices').trainable_weights == []
          assert model.get_layer('v180_evidence_anchor_seed').trainable_weights == []
          assert model.get_layer('v180_shared_candidate_cross_attention') is not None
          assert model.get_layer('v180_shared_tf_cross_attention') is not None
          assert model.get_layer('v180_shared_proposal_self_attention') is not None
          assert model.get_layer('v180_shared_local_hidden') is not None
          assert model.get_layer('v180_shared_presence') is not None
          assert all('fixed_anonymous' not in layer.name for layer in model.layers)

          bad=[]
          for layer in model.layers:
              if layer.trainable_weights and ('v180_event_' in layer.name or layer.name.startswith('event_present_') or layer.name.startswith('event_candidate_') or layer.name.startswith('event_time_')):
                  bad.append((layer.name,len(layer.trainable_weights)))
          assert not bad, bad
          local=model.get_layer('v180_shared_local_hidden')
          assert len(local._inbound_nodes) == 6, len(local._inbound_nodes)

          rng=np.random.default_rng(180)
          inputs={}
          for t in model.inputs:
              name=t.name.split(':',1)[0]
              shape=[2]+[int(x) for x in t.shape[1:]]
              inputs[name]=rng.normal(size=shape).astype(np.float32)
          # Make frozen fused score deterministic and verify exact top-6 anchor selection.
          cm=np.zeros_like(inputs['candidate_mask'],dtype=np.float32)
          cm[0,:9]=1.0; cm[1,:3]=1.0
          inputs['candidate_mask']=cm
          inputs['candidate_set'][:,:, -3]=np.linspace(0.01,0.99,inputs['candidate_set'].shape[1])[None,:]
          idx_np, valid_np=v180._anchor_indices_np(inputs['candidate_set'],cm)
          anchor_model=keras.Model(model.inputs,[model.get_layer('v180_evidence_anchor_indices').output,model.get_layer('v180_evidence_anchor_valid').output])
          idx_tf,valid_tf=anchor_model(inputs,training=False)
          np.testing.assert_array_equal(np.asarray(idx_tf),idx_np)
          np.testing.assert_array_equal(np.asarray(valid_tf),valid_np)
          assert int(valid_np[0].sum()) == 6
          assert int(valid_np[1].sum()) == 3

          out=model(inputs,training=False)
          pres=np.concatenate([np.asarray(out[f'event_present_{q}']) for q in range(6)],axis=1)
          assert pres.shape == (2,6)
          # Row 1 has only 3 valid evidence anchors: remaining proposal presences must be exactly zero.
          assert np.max(np.abs(pres[1,3:])) < 1e-8, pres[1]
          for row in range(2):
              valid_q=int(valid_np[row].sum())
              for q in range(valid_q):
                  c=np.asarray(out[f'event_candidate_{q}'])[row]
                  t=np.asarray(out[f'event_time_{q}'])[row]
                  assert np.max(np.abs(c[cm[row] < .5])) < 1e-7
                  np.testing.assert_allclose(c.sum(),1.0,rtol=1e-4,atol=1e-4)
                  np.testing.assert_allclose(t.sum(),1.0,rtol=1e-4,atol=1e-4)
          cn=np.asarray(out['event_count_norm'])
          np.testing.assert_allclose(cn[:,0],pres.sum(1)/6.0,rtol=1e-6,atol=1e-6)

          print('params',model.count_params(),'trainable_tensors',len(model.trainable_weights),'token_shape',token_shape)
          print('shared_local_inbound_nodes',len(local._inbound_nodes),'q_specific_trainable_layers',bad)
          print('anchor_valid_counts',valid_np.sum(1).tolist())
          print('V18 preflight OK')
          PY

  fold:
    name: V18 evidence competition fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train V18
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          out="model/v180-fold-${{ matrix.fold }}"
          mkdir -p "$out"
          python -B scripts/run_v180_reporting_compat.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --arm mass_permutation \
            --seed "$CONTROL_SEED" \
            --output-dir "$out" \
            2>&1 | tee "$out/train.log"
      - name: Verify V18 protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold='${{ matrix.fold }}'
          r=json.loads(Path(f'model/v180-fold-{fold}/report-fold-{fold}.json').read_text())
          p=r['protocol']; a=r['v180']['architecture']
          assert p['v180_evidence_seeded_competition'] is True
          assert p['fixed_anonymous_seed_count'] == 0
          assert p['learned_anonymous_seed_count'] == 0
          assert p['proposal_anchor_selection_trainable'] is False
          assert p['proposal_anchor_hard_ownership'] is False
          assert p['v173_poisson_binomial_count_objective_unchanged'] is True
          assert p['v173_count_nll_weight'] == .35
          assert p['mass_preserving_exchangeable_weights_unchanged'] is True
          assert p['exact_720_truth_matching_unchanged'] is True
          assert p['runtime_presence_threshold'] == .5 and p['runtime_presence_threshold_tuned'] is False
          assert p['categorical_cardinality_head_exists'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          g=r['strata']['aggregate']['v180_evidence_seeded']['metrics']['global']
          print(fold,'epochs',r['data']['selected_epochs'],'f1',g['f1'],'pred_ref',g['prediction_reference_ratio'],'gini',a['outer_activity_gini'],'effective_slots',a['outer_effective_active_slots'],'corr',a['outer_active_occupancy_correlation'],'C<K',a['rows_candidate_infeasible_c_lt_k'])
          PY
      - name: Upload V18 fold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v180-evidence-fold-${{ matrix.fold }}
          path: model/v180-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: warn
          retention-days: 30

  summarize:
    name: Summarize and audit V18
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy<2.0'
      - name: Download V18 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v180-evidence-fold-*
          path: model/v180-all
          merge-multiple: false
      - name: Download canonical V17.3 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v173-poibin-fold-*
          path: model/v173-all
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V173_RUN }}
          github-token: ${{ github.token }}
      - name: Download canonical V17.3 summary
        uses: actions/download-artifact@v4
        with:
          name: v173-poibin-count-consistency-summary
          path: model/v173-summary
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V173_RUN }}
          github-token: ${{ github.token }}
      - name: Aggregate V18
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v180-summary
          python -B scripts/summarize_v180_evidence_seeded_competition.py \
            --input-dir model/v180-all \
            --v173-fold-dir model/v173-all \
            --v173-summary-dir model/v173-summary \
            --output-dir model/v180-summary \
            2>&1 | tee model/v180-summary/summary.log
      - name: Verify aggregate protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v180-summary/report.json').read_text()); p=r['protocol']; c=r['comparison']; g=r['gates']
          assert p['v180_evidence_seeded_competition'] is True
          assert p['mandatory_post_implementation_audit'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_rows_as_v173'] is True
          assert p['same_seed'] == 16061
          assert p['presence_threshold'] == .5 and p['threshold_tuned'] is False
          assert p['fixed_or_learned_anonymous_seed_count'] == 0
          assert p['v173_poisson_binomial_count_objective_unchanged'] is True
          assert p['mass_preserving_exchangeable_weights_unchanged'] is True
          assert p['exact_720_truth_matching_unchanged'] is True
          assert p['locked12_indexed_or_evaluated'] is False
          print(json.dumps(c,indent=2,sort_keys=True)); print(json.dumps(g,indent=2,sort_keys=True))
          PY
      - name: Upload V18 summary
        uses: actions/upload-artifact@v4
        with:
          name: v180-evidence-seeded-competition-summary
          path: model/v180-summary
          retention-days: 30
