name: S494 label-free alternative K0-first audio onset association freeze with duplication risk
on:
  push:
    branches: [codex/s494-K0-priority-onset-proof-freeze]
    paths:
      - scripts/s494_freeze_K0_priority_BasicPitch_birth_shadow.py
      - .github/workflows/v273-s494-K0-priority-pretruth-frozen.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_native_K0_first_competing_real_onset_evidence_without_XML_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numeric and one-to-one source event matching ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Check each BP attack is matched at most once
        run: |
          python -m py_compile scripts/s494_freeze_K0_priority_BasicPitch_birth_shadow.py
          python -m scripts.s494_freeze_K0_priority_BasicPitch_birth_shadow --self-test
      - name: Restore S491 source K0-only frozen K from historical S80 and V88
        run: |
          gh run download 38576329909 \
            -n s491-true-guitar-S80-and-piano-V88-K0only-BasicPitch-one-to-one-frozen-NOXML \
            -D model/S491 --repo ${{ github.repository }}
      - name: Restore original independent BasicPitch audio notes for both sources with no XML
        run: |
          gh run download 38569589535 \
            -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML \
            -D model/S487 --repo ${{ github.repository }}
          gh run download 38568724837 \
            -n s485-spotify-basicpitch-3-original-MAESTRO-piano-audio-to-notes-frozen-PREMIDI \
            -D model/S485 --repo ${{ github.repository }}
      - name: Freeze non-mutating alternative source K0-first per-model birth evidence, count competing K>=1 candidates
        run: |
          python -u -m scripts.s494_freeze_K0_priority_BasicPitch_birth_shadow \
            --s491 model/S491 --s491report model/S491/report.json \
            --s487 model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --s487report model/S487/report.json \
            --s485 model/S485/S485_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --s485report model/S485/report.json \
            --out model/S494
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S494/report.json'))
          assert r['status']=='S494_SOURCE_K0_FIRST_PRETRAINED_ONSET_EVIDENCE_PRELABEL_SHADOW'
          assert r['read_no_XML_or_MIDI_truth_during_inference']
          assert r['original_S80_and_V88_unchanged']
          assert r['potential_duplicate_note_sourceKnonzero_conflicts_explicitly_audited']
          assert r['no_promotion']
          for name in ('guitar_S80','piano_V88'):
            with np.load('model/S494/S494_'+name+'_K0_FIRST_PRIORITY_SHADOW_PRETRUTH.npz') as x:
              before=x['source_K']
              for key in ('proposed_K0_priority_BP_birth_K',
                          'proposed_K0_priority_BP_activeAtBPonsetPlus30_K'):
                assert np.array_equal(before[before>0],x[key][before>0])
          print('S494 two source K0 priority policies safely frozen without truth')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s494-source-K0-first-two-real-audio-corpora-pretruth-duplicate-risk-shadow
          path: model/S494/
          retention-days: 90
