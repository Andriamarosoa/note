name: V27.3 Exclusive Rerank Guard

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-exclusive-rerank-launch.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  TAG: v273-exclusive-rerank-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - name: Compile and test rerank
        run: |
          python -m py_compile scripts/audit_v273_exclusive_rerank_guard.py
          python -B -m unittest test.test_v273_exclusive_rerank_guard -v
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Restore frozen fold exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/exports
          for f in 0 1 2 4; do
            mkdir -p "model/exports/fold-$f"
            gh run download 37356100423               --repo "${{ github.repository }}"               --name "v273-internal-minimal-residual-failure-fold-$f"               --dir "model/exports/fold-$f"
          done
          for f in 0 1 2 4; do
            test -f "model/exports/fold-$f/replay.npz"
            test -f "model/exports/fold-$f/manifest.json"
          done
      - name: Restore verified candidate capacity control
        run: |
          mkdir -p model/evidence
          unzip -q analysis/evidence/v273-candidate-ranking/evidence.zip -d model/evidence
          test -f model/evidence/capacity/features.npz
          test -f model/evidence/capacity/report.json
      - name: Restore diagnostic cases
        run: |
          unzip -q analysis/evidence/v273-residual-acoustics/evidence.zip -d model/evidence-source
          test -f model/evidence-source/acoustic/cases.jsonl
          test "$(wc -l < model/evidence-source/acoustic/cases.jsonl)" -eq 488
      - name: Run exclusive rerank guard
        run: |
          python -B scripts/audit_v273_exclusive_rerank_guard.py             --exports model/exports             --dataset data/GuitarSet             --capacity model/evidence/capacity             --cases model/evidence-source/acoustic/cases.jsonl             --output model/result
      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-exclusive-rerank-results.tgz -C model/result .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 exclusive-support reconstruction rerank"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/result/features.npz             model/result/scores.npz             model/v273-exclusive-rerank-results.tgz             --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-exclusive-rerank-results
          path: model/result/
          retention-days: 90
