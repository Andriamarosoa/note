name: S258 original GuitarSet 59309 native views and S5 527D fourfold rerun
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s258_guitarset_59309_original_native_source_4fold.py'
      - '.github/workflows/v273-s258-guitarset-59309-original-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s258-guitarset-59309-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_four_fold_source_59309:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original source inputs numeric stack
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Original trusted PR16 crossfold truth/base/12 trained model posteriors/36 source policies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-summary
          path: model/pr16
      - name: Original raw native GuitarSet fold0 audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/input/fold0
      - name: Original raw native GuitarSet fold1 audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/input/fold1
      - name: Original raw native GuitarSet fold2 audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/input/fold2
      - name: Original raw native GuitarSet fold4 audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/input/fold4
      - name: Build exact native GuitarSet 59309 full-fold source, preserve OOF truth separately
        run: |
          python -m scripts.s258_guitarset_59309_original_native_source_4fold \
            --source model/input --pr16 model/pr16 --out model/S258
          python - <<'PY'
          import json
          r=json.load(open('model/S258/report.json'))
          assert r['original_events']==59309 and r['original_true_poly_K2plus_events']==7385
          assert r['truth_is_separated_from_all_predictor_archives']
          assert r['historical_PR16_true_OOF_baseline_unchanged']
          assert not r['S80_new_score_measured'] and not r['official_promotion']
          print('S258 TRUE 59309 original GuitarSet source, 527D, 58D, 42x49, 46D and 245D ready')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16
          path: model/S258/
          retention-days: 90
