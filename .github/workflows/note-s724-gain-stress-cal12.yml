name: S724 independent GuitarSet CAL PCM gain stress 0.5x 1x 2x
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - .github/workflows/note-s724-gain-stress-cal12.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s724-gain-stress-cal12-unique
  cancel-in-progress: true
jobs:
  real_CAL_gain_stress_S708_vs_S724:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install strictly same CPU audio and neural dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original and timbre feature contracts, compile gain-stress script
        run: |
          python -m compileall -q scripts/s724_gain_robustness_cal12.py
          python -m unittest -v test.test_s724_loudness_timbre test.test_s713_metric_contract
      - name: Ensure original experiment S724 finished successfully before sourcing weights
        run: |
          gh run watch 39118797590 --repo "${{ github.repository }}" --exit-status --interval 20
      - name: Retrieve signed S708+S724 and S707 offset, no exposure to HELD/DEV or new TEST
        run: |
          mkdir -p /tmp/s724gain/s708 /tmp/s724gain/s724 /tmp/s724gain/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s724gain/s708
          gh run download 39118797590 --repo "${{ github.repository }}" --name S724_JOINT_CAUSAL_ACOUSTIC_NOVELTY_EXACTK_NO_PROMOTION --dir /tmp/s724gain/s724 || \
          gh run download 39118797590 --repo "${{ github.repository }}" --name S724_LEVEL_TIMBRE_EXACTK_FIT_CAL_NO_PROMOTION --dir /tmp/s724gain/s724
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s724gain/s707
          test -s /tmp/s724gain/s708/s708_selected.pt
          test -s /tmp/s724gain/s724/s724_epoch2.pt
          test -s /tmp/s724gain/s724/report.json
          test -s /tmp/s724gain/s707/s675_hazard.joblib
      - name: Recompute causal PCM at predeclared gains on 12 CAL tracks; compare emitted note streams
        run: |
          python -m scripts.s724_gain_robustness_cal12 --s708-dir /tmp/s724gain/s708 --s724-dir /tmp/s724gain/s724 --offset-checkpoint /tmp/s724gain/s707/s675_hazard.joblib --out /tmp/s724gain/report
      - name: Verify clipping not hidden and no model promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s724gain/report/report.json'))
          assert not r['promoted'] and not r['TEST_opened'] and r['CAL_only']
          assert len(r['per_gain']['tracks'])==12
          assert len(r['per_gain']['levels'])==3
          for track in r['per_gain']['tracks']:
              assert set(track['results'])=={'soft_0.5','nominal_1.0','loud_2.0'}
              for v in track['results'].values():
                  assert 0<=v['clip_fraction']<=1
          print('S724_REAL_CAL_GAIN_STRESS_FINAL',json.dumps({
             'gain_robustness':r['gain_robustness'],
             'any_clipping':r['any_clipping'],
             'no_promotion':not r['promoted']},sort_keys=True),flush=True)
          PY
      - name: Preserve all 12 real-world paired gain scores and clipping samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S724_REAL_GUITAR_PAIRED_LEVEL_0_5_1_2_CAL12
          path: /tmp/s724gain/report/report.json
          if-no-files-found: warn
          retention-days: 45
