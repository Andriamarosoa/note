name: S701 learned causal per-pitch Onset without Exact-K or S675 regressions
on:
  push:
    branches: [codex/note-s701-learned-causal-onset-first]
    paths:
      - scripts/s701_train_causal_onset_shadow.py
      - test/test_s701_causal_onset.py
      - .github/workflows/note-s701-learned-causal-onset.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s701-learned-onset
  cancel-in-progress: true
jobs:
  learn_held_composition_onset:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original NOTE dependencies and frozen model
        run: python -m pip install -r requirements-live-strict.txt
      - name: Unit tests causal feature ABI and invariants
        run: |
          python -m compileall -q scripts/s701_train_causal_onset_shadow.py test/test_s701_causal_onset.py
          python -m unittest -v test.test_s701_causal_onset test.test_s695_persistent_onset
      - name: Obtain existing frozen S675 model artifact
        run: |
          mkdir -p /tmp/s701_s675
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s701_s675
          test -s /tmp/s701_s675/s675_hazard.joblib
          test -s /tmp/s701_s675/s675_checkpoint.json
      - name: Train on five TRAIN compositions and freeze four held composition guards before DEV
        run: python -m scripts.s701_train_causal_onset_shadow --out /tmp/s701 --checkpoint /tmp/s701_s675/s675_hazard.joblib
      - name: Preserve shadow benchmark and checkpoint even if training fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S701_CAUSAL_ONSET_LEARNED_TRAIN_HELD_COMPOSITION
          path: |
            /tmp/s701/report.json
            /tmp/s701/s701_onset_shadow.joblib
          if-no-files-found: warn
          retention-days: 60
