name: S250 four genuine original trained S70 fold checkpoints on 1034 native IDMT events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s250_S70_original_fourfold_native_IDMT.py'
      - '.github/workflows/v273-s250-original-S70-native-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s250-original-fourtrained-S70-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine_original_S70_fourfold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact verified original S70 59k historical runtime ABI
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Restore authentic original S249 S69 balanced/polymax decisions from 193 S46/36 PR16 policies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307579536
          name: s249-original-S69-4fold-genuine-S46-PR16-1034-IDMT
          path: model/S249
      - name: Restore 12 genuine original MLP and 36 PR16 trained K decisions for same native event IDs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307419228
          name: s248-genuine-original-12-PR16-36policy-1034-native-IDMT
          path: model/S248
      - name: Restore four original S70 frozen trained models and fold-exclusive training thresholds bit-exact on history
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38296428889
          name: s222-recovered-original-S70-four-fold-checkpoints-exact-history
          path: model/S222
      - name: Execute 4 original pretrained S70 logistic classifiers on 1034 event S69 and PR16 views with no new training
        run: |
          python -m py_compile scripts/s250_S70_original_fourfold_native_IDMT.py
          python -u -m scripts.s250_S70_original_fourfold_native_IDMT \
            --s221 model/S249/S249_original_S69_fourfold_rule_consensus_IDMT.npz \
            --s85 model/S248/pr16_external_36_policies.npz \
            --s222 model/S222 --out model/S250
      - name: Assert original model 4-fold probabilities and untouched 1034 native-IDMT K0–6 decisions
        run: |
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/S250/report.json'))
          assert r['rows']==1034 and r['original_S70_fitted_models']==4
          assert r['original_PR16_policies']==36 and r['original_PR16_neural_heads']==12
          assert set(r['policies'])=={'proposed_poly','downward_poly'}
          assert not r['external_true_K_read'] and not r['model_weights_retrained']
          assert not r['independent_ExactK_measured'] and not r['S80_promoted']
          with np.load('model/S250/S250_original_S70_4fold_no_oracle_IDMT.npz',allow_pickle=False) as z:
            assert z['row_id'].shape==(1034,)
            assert z['proposed_poly_K'].shape==(1034,)
            assert z['downward_poly_K'].shape==(1034,)
            assert z['proposed_poly_fold_K'].shape==(4,1034)
            assert np.isin(z['proposed_poly_K'],range(7)).all()
          print('S250 PASS original 4 trained S70 historical checkpoints and thresholds on 1034 native IDMT group IDs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s250-original-trained-S70-4fold-1034-IDMT-native-no-labels
          path: model/S250/
          retention-days: 90
