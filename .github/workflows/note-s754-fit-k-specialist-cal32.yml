name: S754 FIT causal K2-K6 specialist twelve real full MIDI CAL32 loops
on:
  push:
    branches: [codex/note-s754-fit-k-specialist-twelve-cal32-loops]
    paths:
      - scripts/s754_fit_k_specialist_cal32_loops.py
      - test/test_s754_fit_k_specialist.py
      - .github/workflows/note-s754-fit-k-specialist-cal32.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s754-fit-k-specialist-cal32
  cancel-in-progress: true
jobs:
  FIT80_training_and_full_MIDI_CAL32:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original signed NOTE runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify K-head causal future invariance and historical native events
        run: |
          python -m compileall -q scripts/s754_fit_k_specialist_cal32_loops.py
          python -m unittest -v \
            test.test_s754_fit_k_specialist \
            test.test_s753_khead_decoder_anatomy \
            test.test_s752_six_role_integrity \
            test.test_s750_six_axis_audit \
            test.test_s746_instance_guard
      - name: Recover signed S708 and S707 source checkpoints
        run: |
          mkdir -p /tmp/s754/s708 /tmp/s754/s707
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s754/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s754/s707
          test -s /tmp/s754/s708/report.json
          test -s /tmp/s754/s708/s708_selected.pt
          test -s /tmp/s754/s707/s675_hazard.joblib
      - name: Train FIT80 independent K specialists and score twelve complete CAL32 MIDI streams
        run: |
          python -m scripts.s754_fit_k_specialist_cal32_loops \
            --s708-dir /tmp/s754/s708 \
            --offset-checkpoint /tmp/s754/s707/s675_hazard.joblib \
            --out /tmp/s754/output
      - name: Verify the six original CAL32 metrics, source SHA and nonregression gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s754/output/report.json').read_text())
          assert r['complete'] and r['reference_parity']['valid']
          assert r['loops']==12 and len(r['CAL'])==12
          assert r['schema']=='S754_FIT_ONLY_K2_K6_SPECIALISTS_TWELVE_FULL_MIDI_CAL32'
          assert r['selected']=='S708_frozen' and not r['promoted']
          assert r['training']=='FIT80 only'
          assert r['FIT']['decisions']>10000
          assert set(map(int,r['FIT']['class_counts'].keys()))==set(range(7))
          assert r['no_truth_at_inference']
          assert not r['LIVE_changed'] and not r['TEST_opened'] and not r['HELD_opened']
          for name,item in r['CAL'].items():
              assert len(item['scores'])==6 and len(item['delta'])==6
              assert not item['six_gt80'] or item['safe']
              if item['safe']:
                  assert not any(item[key] for key in
                      ('correct_source_offsets_lost','long_onsets_lost','onset_tp_lost'))
          print('S754_12_FULL_MIDI_LOOP_SCORES',json.dumps({
              'reference':r['reference_scores'],
              'head_reference':r['reference_head'],
              'CAL_candidate':r['CAL_candidate'],
              'loops':r['CAL']}))
          PY
      - name: Publish diagnostics including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S754_FIT80_K2_K6_SPECIALISTS_TWELVE_MIDI_CAL32
          path: |
            /tmp/s754/output/report.json
            /tmp/s754/output/s754_*.joblib
          retention-days: 45
          if-no-files-found: warn
