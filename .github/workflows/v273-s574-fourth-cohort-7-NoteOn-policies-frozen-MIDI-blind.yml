name: S574 freeze 7 23-source temporal reattack note policies versus physical34/S546 on fourth music WAV BEFORE MIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s574_fourth_held_real_audio_restrike_onset_policy_freeze_PREMIDI.py
      - .github/workflows/v273-s574-fourth-cohort-7-NoteOn-policies-frozen-MIDI-blind.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  SHA_freeze_7_old_vs_restrike_23source_trained_pitch_heads_without_test_MIDI:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore pinned real model and music note matching ABIs
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: True prelabel synthetic tests, 7 frozen note policies, BP chords protected
        run: |
          python -m py_compile scripts/s574_fourth_held_real_audio_restrike_onset_policy_freeze_PREMIDI.py
          python -m scripts.s574_fourth_held_real_audio_restrike_onset_policy_freeze_PREMIDI --self-test
      - name: Restore only 5 preregistered and original sound-derived V88, BP and raw49 audio evidence, never MIDI
        run: |
          gh run download 38670092733 -n s570-fourth-five-new-source-names-exclude23-previous-composer-components-NO-AUDIO-MIDI -D model/S570 --repo "${{ github.repository }}"
          gh run download 38670185242 -n s571-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S571 --repo "${{ github.repository }}"
          gh run download 38670258232 -n s572-next-five-S570-BasicPitch-original-pitch-names-PREMIDI -D model/S572 --repo "${{ github.repository }}"
          gh run download 38670454679 -n s573-next-five-S570-composers-V88-raw49-pitch-PREMIDI -D model/S573 --repo "${{ github.repository }}"
      - name: Restore only OLD real 8/18 and 23-source authentic fixed model weights and their SHA proofs
        run: |
          gh run download 38658337209 -n s546-sixteen-real-8-composer-held-pitch-models-acoustic-plus-harmonic-true-noteon -D model/S546 --repo "${{ github.repository }}"
          gh run download 38667229236 -n s562-real-18-composer-trained-original7-vs-physical-fundamental34-NoteOn-heads -D model/S562 --repo "${{ github.repository }}"
          gh run download 38670001388 -n s569-real-23-composer-temporal52-restrike-two-genuine-NoteOn-heads -D model/S569 --repo "${{ github.repository }}"
          test -s model/S569/S569_TWENTYTHREE_REAL_SOURCE_TRAINED_attack_positive_sites_52D.joblib
          test -s model/S569/S569_TWENTYTHREE_REAL_SOURCE_TRAINED_attack_and_ghost_events_52D.joblib
      - name: Freeze all genuine name pitch attacks and SHA before any S570 original MIDI may be accessed
        run: |
          python -u -m scripts.s574_fourth_held_real_audio_restrike_onset_policy_freeze_PREMIDI \
            --manifest model/S570/report.json --v88-report model/S571/report.json \
            --bp-report model/S572/report.json \
            --features model/S573/S573_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --feature-report model/S573/report.json \
            --s546-report model/S546/report.json --s562-report model/S562/report.json \
            --s569-report model/S569/report.json \
            --s546-weights model/S546 --s562-weights model/S562 --s569-weights model/S569 \
            --out model/S574
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('model/S574/report.json'))
          assert r['status']=='S574_FOURTH_SOURCE_FIVE_COMPOSER_REAL_NOTEON_SEVEN_POLICY_MIDI_BLIND_FROZEN'
          assert r['original_S570_MIDI_NOT_read_for_inference']
          assert r['no_S570_ground_truth_used_for_training_model_or_policy']
          assert len(r['all_seven_policies_preregistered_before_true_MIDI'])==7
          assert len(r['real_original_source_model_SHA_checkpoints'])==11
          p=Path('model/S574/S574_FIVE_FULL_REAL_AUDIO_NAMED_NOTEON_7_POLICIES_PREMIDI.jsonl')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['full_named_note_on_predictions_sha']
          assert r['original_S80_ExactK_GuitarSet_Live_unmodified'] and r['no_promotion']
          print('S574 ALL seven original/full physical/current acoustic reattack note policies SHA sealed before paired MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s574-fourth-source-7-old-vs-restrike-52D-fitted-note-policies-SHA-frozen-BEFORE-MIDI
          path: model/S574/
          retention-days: 90
