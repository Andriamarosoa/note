name: Verify recovered eight producers and original 255 groups on GOAT
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - scripts/recover_v273_255_producers.py
      - .github/workflows/v273-recovered-255-producers.yml
      - analysis/evidence/v273-recovered-255/inputs/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovered-255-producers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-producers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src
            analysis/evidence/v273-audit-memory/source-archives
            analysis/evidence/v273-regression-loops/prepared
            analysis/evidence/v273-recovered-255
            analysis/evidence/v273-recovered-s5-s18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 h5py==3.16.0
      - name: Verify preserved feature and model bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('analysis/evidence/v273-recovered-255')
          for name,record in json.loads((root/'manifest.json').read_text()).items():
              data=(root/name).read_bytes()
              assert len(data)==record['bytes']
              assert hashlib.sha256(data).hexdigest()==record['sha256'],name
          PY
      - name: Reconstruct all 70 specialists and verify 14 frozen correctors
        run: >-
          python -m scripts.recover_v273_255_producers --stage recover
          --fundamentals analysis/evidence/v273-recovered-255/inputs/historical_fundamental58.npz
          --out model/recovered-255/runtime
      - name: Infer all 255 groups and nine reference audits on real GOAT inputs
        run: >-
          python -m scripts.recover_v273_255_producers --stage infer
          --runtime model/recovered-255/runtime
          --external analysis/evidence/v273-recovered-255/inputs/external_audio_inputs.npz
          --s5 analysis/evidence/v273-recovered-s5-s18/external_s5.npz
          --out model/recovered-255/GOAT
      - name: Independently compare sealed local and CI group outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np
          root=Path('model/recovered-255')
          r=json.loads((root/'runtime/report.json').read_text())
          assert r['group_decisions_checked']==13375005
          assert r['group_decision_mismatches']==0
          assert r['specialist_cached_probabilities_bit_exact']
          assert r['logistic_models_reconstructed']==70
          assert not r['receiver_labels_used_for_fit'] and not r['corrector_retrained']
          with np.load(root/'GOAT/external_255x9.npz',allow_pickle=False) as actual, np.load('analysis/evidence/v273-recovered-255/external_255x9.npz',allow_pickle=False) as expected:
              assert set(actual.files)==set(expected.files)
              for key in actual.files:
                  a,b=actual[key],expected[key]
                  assert a.shape==b.shape,key
                  if a.dtype.kind=='f':
                      assert np.allclose(a,b,atol=2e-5,rtol=0),key
                  else:
                      assert np.array_equal(a,b),key
          g=json.loads((root/'GOAT/report.json').read_text())
          assert g['group_audits_shape']==[4,5,255,9]
          assert not g['new_audio_annotations_read'] and not g['S80_promoted']
          assert not g['full_S45_16_families_complete']
          print('255 GROUPS: ORIGINAL HISTORICAL PARITY AND SAME NEW AUDIO OUTPUTS VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-eight-producers-255-group-runtime-and-GOAT-proof
          path: model/recovered-255/
          retention-days: 90
