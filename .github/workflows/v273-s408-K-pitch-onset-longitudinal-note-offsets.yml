name: S408 note-conditioned OFFSET prediction song-held with S80 S402 S407
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s408_train_pitch_conditioned_held_song_note_offsets.py'
      - '.github/workflows/v273-s408-K-pitch-onset-longitudinal-note-offsets.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s408-K-pitch-songheld-note-offsets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_GuitarSet_per_note_supervised_offset_evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU regressors and MIDI array math
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test pitch-specific GT pairing including duplicate MIDI pitches
        run: |
          python -m py_compile scripts/s408_train_pitch_conditioned_held_song_note_offsets.py
          python -u -m scripts.s408_train_pitch_conditioned_held_song_note_offsets --self-test
      - name: Restore source-only original GuitarSet native acoustic 59309 groups
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore protected frozen S80 cardinality K0..K6 
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Restore held-composition K-conditioned MIDI pitch S402
        run: |
          gh run download 38361853607 -n s402-K-fed-to-MIDI-neural-input-composition-disjoint-4fold-DEVELOPMENT-NOPROMOTION -D model/S402 --repo ${{ github.repository }}
          test -f model/S402/S402_K_FIRST_S80_MIDI_NOTE_59309_SONG_OOF.npz
      - name: Restore song-held audio onset localization S407
        run: |
          gh run download 38369185178 -n s407-S80-frozen-K-onset-timing-SONG-HELD-4fold-original-GuitarSet -D model/S407 --repo ${{ github.repository }}
          test -f model/S407/S407_frozen_S80_K_and_songheld_timing.npz
      - name: Download official GuitarSet note_midi onset AND duration labels
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 2 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Fit 4 held-song physical note duration/offset regressors and paired baselines
        run: |
          python -u -m scripts.s408_train_pitch_conditioned_held_song_note_offsets \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s402 model/S402/S402_K_FIRST_S80_MIDI_NOTE_59309_SONG_OOF.npz \
            --s407 model/S407/S407_frozen_S80_K_and_songheld_timing.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S408
          python - <<'PY'
          import json
          d=json.load(open('model/S408/report.json'))
          assert d['status']=='S408_SONGHELD_PITCH_CONDITIONED_NOTE_OFFSET_REAL_GUITARSET'
          assert d['original_tracks']==190 and d['original_events']==59309
          assert d['predicted_new_note_instances']==33475
          assert d['annotated_gt_notes']==34954
          assert len(d['four_fold_proofs'])==4
          assert all(f['composition_overlap']==0 for f in d['four_fold_proofs'])
          assert all(v['note_onset_pitch_matched']==d['metrics']['per_pitch_duration_median_training_only']['note_onset_pitch_matched'] for v in d['metrics'].values())
          assert d['S80_reference_unchanged'] and d['S402_pitch_reference_unchanged'] and d['S407_timing_reference_unchanged']
          print('S408 VALID real note onset+pitch+offset evaluation 4 folds, NO PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s408-real-note-offsets-pitch-conditioned-S80-S402-S407-songheld-NOPROMOTION
          path: model/S408/
          retention-days: 90
