name: S107 audit used S5 feature dimensions
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s107_s5_active_feature_audit.py'
      - '.github/workflows/v273-s107-s5-features.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Restore pinned original S5 checkpoints
        run: |
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/history
      - name: Inspect all 527 model split dimensions
        run: python scripts/s107_s5_active_feature_audit.py --root model/history/analysis/evidence/v273-open-k0-k6/series5/models --out model/s107/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s107-s5-active-feature-audit
          path: model/s107/report.json
