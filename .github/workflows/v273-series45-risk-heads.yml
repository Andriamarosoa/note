name: V27.3 S45 learn dedicated risk head per high-correction loop
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series45-risk-heads.yml'
      - 'scripts/train_v273_s45_specialized_risk_heads.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical and acoustic source preprocessing packages
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit test family-specific two-outcome risk heads
        run: python -m scripts.train_v273_s45_specialized_risk_heads --self-test
      - name: Recover all verified 910 S43 vectors and all S44 compromise champions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/S43-bundle model/S43 model/S44
          gh release download v273-series43-research-37888008660 --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --dir model/S43-bundle
          tar -xzf model/S43-bundle/v273-series43-all-corrections.tar.gz -C model/S43
          gh run download 37890613101 --repo "$GITHUB_REPOSITORY" --name v273-series44-per-family-compromises --dir model/S44
      - name: Restore original native signal features and S18 reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Fit each family's learned compromise heads excluding evaluated piece
        run: >-
          python -m scripts.train_v273_s45_specialized_risk_heads
          --features model/features
          --s18 model/S18/predictions.npz
          --bank model/S43/S43-evidence/S43-audit/all_distinct_native_predictions.npz
          --manifest model/S44/report.json
          --output model/S45
      - name: Publish learned correction risk and per-class regression compromises
        run: cat model/S45/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series45-specialized-risk-heads
          path: model/S45/
          retention-days: 90
