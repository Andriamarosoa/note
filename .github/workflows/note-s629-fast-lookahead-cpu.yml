name: "S629 one-pass low-CPU future-head tests and benchmark"
on:
  push:
    branches: [codex/note-s629-shared-hop-lowcpu-lookahead]
    paths:
      - '.github/workflows/note-s629-fast-lookahead-cpu.yml'
      - 'src/causal_note/lookahead.py'
      - 'test/test_s629_shared_hop_lookahead.py'
      - 'scripts/s629_benchmark_shared_cpu.py'
      - 'scripts/live_strict_notes.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-and-causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen NOTE ONNX CPU inference dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Verify single-pass reference event parity, no future before capture, arbitrary callback sizes
        run: |
          python -m compileall -q src/causal_note/lookahead.py scripts/live_strict_notes.py scripts/s629_benchmark_shared_cpu.py
          python -m unittest -v test.test_s629_shared_hop_lookahead test.test_s628_true_audio_lookahead
      - name: Benchmark same 1.5s PCM original vs exact S628 phase and S629 single-pass lookahead
        run: |
          python -m scripts.s629_benchmark_shared_cpu --block-size 256 --duration-s 1.5
          python -m scripts.s629_benchmark_shared_cpu --block-size 512 --duration-s 1.5
