name: S542 TRUE held-out five-composer full MAESTRO NOTE_ON MIDI validation after source SHA freeze
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s542_validate_5_new_maestro_noteon_MIDI_only_after_freeze.py
      - .github/workflows/v273-s542-prospective-postfreeze-five-song-noteon-MIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify_all_prelabel_SHA_before_even_opening_paired_MIDI:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original independent exact MIDI note onset matching library
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Selftest exact true MIDI pitch note identities and one-to-one timing without target songs
        run: |
          python -m py_compile scripts/s542_validate_5_new_maestro_noteon_MIDI_only_after_freeze.py
          python -m scripts.s542_validate_5_new_maestro_noteon_MIDI_only_after_freeze --self-test
      - name: Restore exact original S537 and pretrained S538/S540 PRELABEL source SHAs
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656509448 -n s538-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S538 --repo "${{ github.repository }}"
          gh run download 38656791368 -n s540-five-composers-original-V88-all-event-49x11-WAV-physical-pitch-features-preMIDI -D model/S540 --repo "${{ github.repository }}"
      - name: Restore immutable S541 four actual NOTE_ON named pitches per source policies all sealed before paired MIDI
        run: |
          gh run download 38656969947 -n s541-FROZEN-before-MIDI-5-original-MAESTRO-composers-S528-S533-S536-noteon-policies -D model/S541 --repo "${{ github.repository }}"
          test -s model/S541/S541_FIVE_NEW_MAESTRO_ORIGINAL_REAL_WAV_NOTE_NAMES_ALL_POLICIES_PREMIDI.jsonl
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('model/S541/report.json'))
          b=Path('model/S541/S541_FIVE_NEW_MAESTRO_ORIGINAL_REAL_WAV_NOTE_NAMES_ALL_POLICIES_PREMIDI.jsonl').read_bytes()
          assert hashlib.sha256(b).hexdigest()==r['frozen_prediction_ledger_SHA256']
          assert r['four_policies_predeclared']==['BP_birth','raw_mean_0p7','dedup80','dedup100_harm080']
          assert not r['original_true_MIDI_note_contents_OPENED']
          print('S542 embargo: four original NOTE_ON hypothesis forecasts frozen and SHA verified')
          PY
      - name: ONLY NOW open original independent MAESTRO MIDI and audit complete NoteOn F1 per composer and actual repeated pitch
        run: |
          python -u -m scripts.s542_validate_5_new_maestro_noteon_MIDI_only_after_freeze \
            --manifest model/S537/report.json \
            --source-report model/S538/report.json \
            --features-report model/S540/report.json \
            --features model/S540/S540_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --frozen-report model/S541/report.json \
            --predictions model/S541/S541_FIVE_NEW_MAESTRO_ORIGINAL_REAL_WAV_NOTE_NAMES_ALL_POLICIES_PREMIDI.jsonl \
            --out model/S542
          python - <<'PY'
          import json
          r=json.load(open("model/S542/report.json"))
          assert r['status']=='S542_PROSPECTIVE_FIVE_NEW_PIANO_COMPOSER_NOTEON_POSTFROZEN_MIDI_VALIDATION'
          assert r['model_and_policy_S541_predicted_note_SHA_FROZEN_BEFORE_MIDI']
          assert r['separate_original_MAESTRO_composers']==5
          assert r['truth_only_opened_after_all_policy_predictions_sha_verified']
          assert r['tolerances_ms']==[30,50,80]
          assert len(r['per_new_recording_source_proof'])==5
          assert len(r['scores'])==4
          assert r['no_training_or_test_threshold_choice_after_MIDI']
          assert r['no_promotion']
          print('S542 PASS full 5 original composer genuine MIDI source NOTE_ON F1, no source S80 merge')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s542-VALIDATED-5-new-composer-noteon-F1-genuine-postfrozen-piano-MIDI-and-restrikes
          path: model/S542/
          retention-days: 90
