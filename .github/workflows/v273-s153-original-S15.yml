name: S153 genuine original S13 and S14 trained K0 risk models plus S15 safe union on GOAT
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s153_original_s13_s15_GOAT.py'
      - 'scripts/loop_v273_conditional_k01.py'
      - 'scripts/verify_v273_series15_union.py'
      - '.github/workflows/v273-s153-original-S15.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s153-original-S13-S15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_saved_S13_S15:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Assert restored original S14 S15 source identical to archived original
        run: |
          git fetch --depth=1 origin 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 || true
          python - <<'PY'
          import subprocess
          for path in ('scripts/loop_v273_conditional_k01.py','scripts/verify_v273_series15_union.py'):
              expected=subprocess.check_output(['git','show','854ada718ac9bf1556f00c96b8e1aa90402d6ab3:'+path])
              assert expected==open(path,'rb').read(),path+' was not restored verbatim'
          PY
      - run: |
          python -m scripts.loop_v273_birth_flow --self-test
          python -m scripts.loop_v273_conditional_k01 --self-test
          python -m scripts.s153_original_s13_s15_GOAT --self-test
      - name: Fetch authentic original S13 K0 regression weights
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37854384791
          name: v273-series13-birth-flow
          path: model/S13
      - name: Fetch authentic original S14 K0 to K1 rollback weights
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37855070118
          name: v273-series14-conditional-k01
          path: model/S14
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Connect 26 S13, 32 S14 and 9 original S15 union policies on GOAT without labels
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -m scripts.s153_original_s13_s15_GOAT \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s13 model/S13 --s14 model/S14 --out model/S153
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S153/report.json'))
          assert r['GOAT_native_audio_events']==57
          assert r['original_checkpoints_S13']>0 and r['original_checkpoints_S14']>0
          assert r['original_S15_9_union_policies']
          assert not r['original_S9_S5_equivalence_on_GOAT']
          assert not r['promoted_S80'] and not r['MIDI_or_true_K_accessed']
          with np.load('model/S153/original_S13_S14_S15_saved_models_GOAT_adapter.npz',allow_pickle=False) as z:
              assert z['S15_predictions'].shape==(57,9)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s153-original-trained-S13-S14-S15-safe-union-newGOAT-adaptedS9
          path: model/S153/
          retention-days: 90
