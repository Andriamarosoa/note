name: S728 REAL octave and third-harmonic missed-vs-false-onset diagnostic
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - .github/workflows/note-s728-real-octave-forensics.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s728-real-octave-forensics
  cancel-in-progress: true
jobs:
  S728_real_octaves_151_CAL:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU Torch and original Audio source protocol
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test exact true-octave event matching and no oracle leakage
        run: |
          python -m compileall -q scripts/s728_real_octave_overlap_audit.py
          python -m unittest -v test.test_s728_real_octave_overlap_audit test.test_s727_harmonic_competition_loss
      - name: Wait for fully trained and CAL-frozen S727 weights
        run: |
          gh run watch 39124756179 --repo "${{ github.repository }}" --exit-status --interval 20
      - name: Download original frozen S708, matched S727 training variants, S707 original offset
        run: |
          mkdir -p /tmp/s728/s708 /tmp/s728/s727 /tmp/s728/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s728/s708
          gh run download 39124756179 --repo "${{ github.repository }}" --name S727_OCTAVE_HARD_NEGATIVE_EXACTK_FIT_LOOPS --dir /tmp/s728/s727
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s728/s707
          test -s /tmp/s728/s708/s708_selected.pt
          test -s /tmp/s728/s727/harmonic_1p0_epoch1.pt
          test -s /tmp/s728/s727/harmonic_1p8_epoch1.pt
          test -s /tmp/s728/s727/harmonic_1p8_epoch2.pt
          test -s /tmp/s728/s727/harmonic_2p6_epoch1.pt
          test -s /tmp/s728/s727/harmonic_2p6_epoch2.pt
          test -s /tmp/s728/s707/s675_hazard.joblib
      - name: Real GuitarSet CAL32 full emitted NoteOn S707 comparisons for 151 octave and 67 fifth overlaps
        run: |
          python -m scripts.s728_real_octave_overlap_audit --s708-dir /tmp/s728/s708 --s727-dir /tmp/s728/s727 --offset-checkpoint /tmp/s728/s707/s675_hazard.joblib --out /tmp/s728/forensics
      - name: Prove no missing real notes fabricated in statistics or promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s728/forensics/report.json'))
          assert not r['promoted'] and not r['TEST_opened'] and r['CAL_only']
          assert len(r['tracks'])==32
          assert r['sums']['S708_frozen']['12']['observed_real_targets']==151
          assert r['sums']['S708_frozen']['19']['observed_real_targets']==67
          for name,entries in r['sums'].items():
              for d,v in entries.items():
                  assert v['correct_real_onsets']+v['missed_real_onsets']==v['observed_real_targets']
                  assert v['spurious_harmonic_child_onsets']>=0
          print('S728_REAL_CAL_HARMONIC_SEPARATION_FINAL',
                json.dumps(r['sums'],sort_keys=True),flush=True)
          PY
      - name: Archive real source matched octave and false child onset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S728_REAL_OCTAVE_ONSETS_VS_HARMONIC_IMPOSTORS_CAL32
          path: /tmp/s728/forensics/report.json
          retention-days: 45
          if-no-files-found: warn
