name: S639 frozen 12 GuitarSet recordings NOTE vs MIDI error taxonomy
on:
  push:
    branches: [codex/s634-midi-live-transport]
    paths:
      - scripts/s639_audit_same_audio_disagreement.py
      - test/test_s639_same_audio_disagreement.py
      - .github/workflows/v273-s639-note-midi-regression-taxonomy.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_immutable_S638_full_results:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve EXACT frozen full 12-source S638 results
        uses: actions/download-artifact@v4
        with:
          name: S638-twelve-GuitarSet-recordings-real-matched-F1
          run-id: 38811643000
          github-token: ${{ github.token }}
          path: /tmp/S638
      - name: Verify taxonomy invariants and original S635 scorer
        run: |
          python -m unittest -v test.test_s639_same_audio_disagreement test.test_s635_shared_midi_metric
      - name: Extract raw corrections, misses and register strengths without model retraining
        run: |
          python -m scripts.s639_audit_same_audio_disagreement \
            --input /tmp/S638/frozen_inputs_and_emissions.json \
            --metrics /tmp/S638/common_metric.json \
            --out /tmp/S639/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S639-frozen-full-12-GuitarSet-note-midi-correct-vs-failure-taxonomy
          path: /tmp/S639
          if-no-files-found: warn
          retention-days: 60
