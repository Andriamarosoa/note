name: S453 source-rooted IDMT wrong K0 K2 K3 ledger across V88 S5 S8 S18 S80
on:
  push:
    branches: [codex/s453-external-S80-stage-K-error-ledger]
    paths:
      - 'scripts/s453_audit_external_IDMT_original_S5_to_S80_first_K_loss.py'
      - '.github/workflows/v273-s453-external-S80-stage-K-failure-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s453-idmt-original-stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit_pretrained_external_506_IDMT_stage_K_loss:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numpy historical source ABI, no model fitting
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test stage fold quorum, abstention to freeze and no K0 label inflation
        run: |
          python -m py_compile scripts/s453_audit_external_IDMT_original_S5_to_S80_first_K_loss.py
          python -m scripts.s453_audit_external_IDMT_original_S5_to_S80_first_K_loss --self-test
      - name: Retrieve unaltered originally preregistered audio-only source and V88 K
        run: |
          gh run download 38318827219 -n s276-IDMT-central-directory-only-prospective-WAV-cohort -D model/S276 --repo ${{ github.repository }}
          gh run download 38319155819 -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled -D model/S277 --repo ${{ github.repository }}
      - name: Restore actual four original trained S5 and 133 S8-S18 source-model predictions
        run: |
          gh run download 38319717743 -n s280-IDMT-dataset3-506-original-4S5-trained-folds-no-XML -D model/S280 --repo ${{ github.repository }}
          gh run download 38319911630 -n s281-IDMT-dataset3-506-original-S5-S18-fourfold-133trained -D model/S281 --repo ${{ github.repository }}
          gh run download 38320164646 -n s282-s283-IDMT-dataset3-506-native-original-S18-quorum-S97-source -D model/S282S283 --repo ${{ github.repository }}
      - name: Restore full original frozen trained S80 and existing source-K note-name inventory
        run: |
          gh run download 38320939533 -n s294-s298-two-complete-frozen-S80-original-vs-S274-IDMT-dataset3-506-PREXML -D model/S294S298 --repo ${{ github.repository }}
          gh run download 38530705707 -n s450-original-S80-IDMT-dataset3-506-S430-vs-S446-note-names-frozen-PREXML -D model/S450 --repo ${{ github.repository }}
          gh run download 38531001313 -n s451-original-S80-external-IDMT-true-musical-notes-paired-no-promotion -D model/S451 --repo ${{ github.repository }}
      - name: Root-cause by exact source-row and true K without refitting or policy tuning
        run: |
          python -u -m scripts.s453_audit_external_IDMT_original_S5_to_S80_first_K_loss \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s280 model/S280/S280_original_S5_fourfold_506_dataset3_native_unlabelled.npz \
            --s281 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s282 model/S282S283/S282/S282_original_S18_foldneutral_506_IDMT.npz \
            --s297 model/S294S298/S297_original/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --s450 model/S450/S450_IDMT_EXTERNAL_FROZEN_NOTE_NAMES.npz \
            --s451-report model/S451/report.json \
            --out model/S453
          python - <<'PY'
          import json
          d=json.load(open('model/S453/report.json'))
          assert d['status']=='S453_ORIGINAL_S5_S8_S18_S80_EXTERNAL_IDMT_WRONGK_STAGE_AUDIT'
          assert d['source_native_events']==506
          assert d['matched_note_annotation_events']==47
          assert d['valid_pitch_supported_events']==45
          assert d['matched_true_poly_events']==21
          assert d['unknown_unmatched_not_K0']==459
          assert d['original_stage_ledger']['S80']['true_poly']['exact']==7
          assert d['original_source_predictions_untouched'] and d['no_retraining_or_threshold_search']
          assert d['no_promotion']
          print('S453 success source V88/S5/S8/S18/S72/S79/S80 failure provenance K0 K2 K3')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion
          path: model/S453/
          retention-days: 90
