name: S823 exact original S795 23 features causal last-observation MIDI256 experiment
on:
  push:
    branches: [codex/note-s823-legacy-s795-features-causal256]
    paths:
      - src/causal_note/s823_legacy23_asof_midi256.py
      - scripts/s823_replay_legacy23_asof_midi256.py
      - test/test_s823_legacy23_asof_midi256.py
      - .github/workflows/note-s823-s795-asof256.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Prove S795 23D ABI, current-only S810 61D math and no hidden future
        run: |
          python -m compileall -q src/causal_note/s823_legacy23_asof_midi256.py scripts/s823_replay_legacy23_asof_midi256.py test/test_s823_legacy23_asof_midi256.py
          python -m unittest -v test.test_s823_legacy23_asof_midi256 test.test_s815_activek_teacher test.test_s813_native256
          python -m scripts.verify_series_reports --series S823
  real_fit80:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Restore 80 exact S795 snapshot inputs and per-256 MIDI timelines from S800 run
        run: |
          mkdir -p /tmp/s823/manifest /tmp/s823/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s823/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s823/traces
          META="$(find /tmp/s823/manifest -name report.json -type f -print -quit)"
          FIT="$(find /tmp/s823/traces -name fit_000.json -type f -print -quit)"
          test -s "$META"
          test -s "$FIT"
          printf '%s\n' "$(dirname "$META")" > /tmp/s823/manifest_dir
          printf '%s\n' "$(dirname "$FIT")" > /tmp/s823/traces_dir
      - name: Train 5 independent composition folds on actual S795 source features, 256 scoring
        run: |
          python -m scripts.s823_replay_legacy23_asof_midi256 --manifest-dir "$(cat /tmp/s823/manifest_dir)" --traces "$(cat /tmp/s823/traces_dir)" --out /tmp/s823/result
      - name: Fail closed if any true MIDI256 or S800 signature differs; block promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s823/result/report.json'))
          assert r['schema']=='S823_S795_LEGACY_TRUE23_ASOF1024_AT_256_FIT80_V1' and r['complete']
          assert len(r['folds'])==5 and len(r['tracks'])==80
          assert r['original_H0_activeK']['correct']==142213
          assert r['original_H0_activeK']['frames']==249411
          assert r['metric_hop_samples']==r['decision_hop_samples']==256
          assert r['observed_legacy_source_clock_samples']==1024
          assert r['S795_23_genuine_original_channels']
          assert r['S795_depends_on_S708_posteriors_K_and_source_MIDI']
          assert not r['native_PCM256_audio_reextracted']
          assert not r['six_axis_independence_verified']
          assert not r['independent_teacher_eligible']
          for mode in ('raw23','agg61'):
              assert r['by_mode'][mode]['frames']==249411
              x=r['by_mode'][mode]
              assert x['correct']+x['undercount']+x['overcount']==249411
          assert r['cal_selected']['frames']==249411
          assert r['observations_without_snapshot']>0
          assert r['source_observations']>0
          assert not r['unification_gate']['allow_unification']
          assert not any(r[k] for k in ('promotion','CAL_opened','HELD_opened',
             'TEST_opened','source_MIDI_modified','production_LIVE_modified',
             'added_lookahead_samples','added_hold_samples'))
          print('S823_VALIDATED_GENUINE_S795_23CHANNEL_ONLY',json.dumps({
             'raw23':r['by_mode']['raw23'],'agg61':r['by_mode']['agg61'],
             'cal_selected':r['cal_selected'],'H0':r['original_H0_activeK'],
             'S795_1024_source_obs':r['source_observations'],
             'initial_256_missing':r['observations_without_snapshot']},
             sort_keys=True),flush=True)
          print('S823_CAUSAL256_DECISIONS_STALE1024_SOURCE_NOT_NATIVE_DSP',flush=True)
          print('S823_NEVER_PROMOTE_PEER_AXES_NOT_INDEPENDENT',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S823_SIGNED_S795_TRUE_23_61_ASOF1024_TO_MIDI256_NOT_PROMOTABLE
          path: |
            /tmp/s823/result/report.json
            /tmp/s823/result/models/
          retention-days: 45
          if-no-files-found: warn
