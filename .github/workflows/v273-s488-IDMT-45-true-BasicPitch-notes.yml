name: S488 postfreeze paired true IDMT guitar note sets against pretrained Basic Pitch
on:
  push:
    branches: [codex/s488-IDMT-BasicPitch-independent-notes]
    paths:
      - scripts/s488_score_frozen_BasicPitch_on_45_IDMT_true_guitar_notes.py
      - .github/workflows/v273-s488-IDMT-45-true-BasicPitch-notes.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_postfreeze_45_original_guitar_true_chords_and_note_names:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original IDMT live audit reader dependencies only
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Verify exact named polyphony matching and real MIDI counts
        run: |
          python -m py_compile scripts/s488_score_frozen_BasicPitch_on_45_IDMT_true_guitar_notes.py
          python -m scripts.s488_score_frozen_BasicPitch_on_45_IDMT_true_guitar_notes --self-test
      - name: Restore original independent pretrained real guitar notes BEFORE original XML is opened
        run: |
          gh run watch 38569589535 --exit-status --repo ${{ github.repository }}
          gh run download 38569589535 \
            -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML \
            -D model/S487 --repo ${{ github.repository }}
          test -f model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl
      - name: Restore original 506 V88 events, full source S80 immutable, and exact predeclared 5 WAV original ZIP
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38319155819 \
            -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled \
            -D model/S277 --repo ${{ github.repository }}
          gh run download 38320939533 \
            -n s294-s298-two-complete-frozen-S80-original-vs-S274-IDMT-dataset3-506-PREXML \
            -D model/S294S298 --repo ${{ github.repository }}
          gh run download 38533183193 \
            -n s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion \
            -D model/S453 --repo ${{ github.repository }}
      - name: Open same authentic IDMT XML ONLY AFTER verifying 5 original pretrained freeze fingerprints
        run: |
          python -u -m scripts.s488_score_frozen_BasicPitch_on_45_IDMT_true_guitar_notes \
            --frozen model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --frozenreport model/S487/report.json \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s453 model/S453/S453_independent_original_IDMT_stage_audit.jsonl \
            --s453report model/S453/report.json \
            --s297 model/S294S298/S297_original/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --out model/S488
          python - <<'PY'
          import json
          r=json.load(open('model/S488/report.json'))
          assert r['status']=='S488_PAIRED_IDMT_45_TRUE_GUITAR_ATTACKS_MULTISOURCE_BASIC_PITCH'
          assert r['exact_original_matched_annotation_rows']==45
          assert r['original_matched_true_poly']==21
          assert r['original_S80_exactK_matching_active_30ms']==25
          assert r['original_S80_true_poly_exactK_matching_active']==7
          assert r['source_note_predictions_frozen_before_xml']
          assert r['missing_459_native_candidates_not_true_K0']
          assert r['no_S80_live_or_pitches_modified'] and r['no_promotion']
          print('S488 original guitar true note names verified after independent trained-model freeze, source S80 unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s488-original-IDMT-45-true-guitar-21-poly-BasicPitch-note-set-vs-S80-ExactK
          path: model/S488/
          retention-days: 90
