name: S207 independent all-19 branch S46 stability audit
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s207_audit_original_19_branch_stability.py'
      - '.github/workflows/v273-s207-branch-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s207-branch-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_branch_consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lean audit dependency
        run: python -m pip install numpy==1.26.4
      - name: Download proven S206 all nineteen original held-piece branch outputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38237264206
          name: s206-all-19-branches-16-s45-193-s46-not-promotion
          path: model/S206
      - name: Compare all S45 sources and all 193 S46 policies across branches
        run: python -m scripts.s207_audit_original_19_branch_stability --s206 model/S206 --out model/S207
      - name: Enforce unbiased diagnosis and non-promotion status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('model/S207/report.json').read_text())
          assert q['branch_count']==19 and q['fold_branch_counts']==[5,4,5,5]
          assert len(q['within_fold'])==4 and q['S46_columns']==193 and q['family_count']==16
          assert q['events']==57
          assert not q['truth_labels_read'] and not q['new_final_aggregation_rule_selected']
          assert not q['independent_ExactK_accuracy_measured'] and not q['promoted']
          print('S207 PASS: 19 authentic held-piece branches independently compared without labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s207-s45-s46-19-branch-stability-no-promotion
          path: model/S207/
          retention-days: 90
