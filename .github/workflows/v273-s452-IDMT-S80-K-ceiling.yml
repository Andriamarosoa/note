name: S452 external IDMT causal upper bound of S80 K locked note accuracy
on:
  push:
    branches: [codex/s450-idmt-external-s446-notes]
    paths:
      - 'scripts/s452_IDMT_note_accuracy_source_K_ceiling.py'
      - '.github/workflows/v273-s452-IDMT-S80-K-ceiling.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal_note_error_decomposition_from_two_frozen_reports:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify annotated K-locked ceiling and no K0 benchmark inflation
        run: |
          python -m py_compile scripts/s452_IDMT_note_accuracy_source_K_ceiling.py
          python -m scripts.s452_IDMT_note_accuracy_source_K_ceiling --self-test
      - name: Restore S450 original exact source K and frozen note identities
        run: |
          gh run download 38530705707 -n s450-original-S80-IDMT-dataset3-506-S430-vs-S446-note-names-frozen-PREXML -D model/S450 --repo ${{ github.repository }}
          test -f model/S450/report.json
      - name: Restore independent postfreeze external note XML scoring only
        run: |
          gh run download 38531001313 -n s451-original-S80-external-IDMT-true-musical-notes-paired-no-promotion -D model/S451 --repo ${{ github.repository }}
          test -f model/S451/report.json
      - name: Decompose irreducible wrong-K loss from additional note identity errors by true K
        run: |
          python -u -m scripts.s452_IDMT_note_accuracy_source_K_ceiling \
            --s450-report model/S450/report.json \
            --s451-report model/S451/report.json \
            --out model/S452
          python - <<'PY'
          import json
          d=json.load(open('model/S452/report.json'))
          assert d['status']=='S452_EXTERNAL_K_LOCKED_NOTE_IDENTITY_CEILING_AUDIT'
          assert d['event_population_total']==506
          assert d['metrics']['true_poly_K2plus']['n']==21
          assert d['metrics']['true_poly_K2plus']['exactK_correct']==7
          assert d['metrics']['true_poly_K2plus']['S446_correct_whole_chords']==4
          assert d['original_K0_not_blindly_scored'] and d['no_promotions_or_training']
          print('S452 source-K ceiling independently reproduced: true poly 7/21 upper bound')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s452-original-S80-external-IDMT-K-locked-note-identity-ceilings
          path: model/S452/
