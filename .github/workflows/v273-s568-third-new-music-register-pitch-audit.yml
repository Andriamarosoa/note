name: S568 independently replay S567 actual five-composer NOTE_ON by register after frozen predictions
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s568_new_S561_register_audit_exact_noteon_physical34.py
      - .github/workflows/v273-s568-third-new-music-register-pitch-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  restore_original_post_MIDI_sha_and_replay_all_note_counts_by_low_mid_high:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original source note and one-to-one MIDI matching
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test strict MIDI 40-88 note register and real repeated note ownership
        run: |
          python -m py_compile scripts/s568_new_S561_register_audit_exact_noteon_physical34.py
          python -m scripts.s568_new_S561_register_audit_exact_noteon_physical34 --self-test
      - name: Restore exact initial new 5 composer metadata and six SHA-frozen pre-MIDI policies, do not retrain
        run: |
          gh run download 38666895837 -n s561-next-5-component-disjoint-music-after-18-exposed-METADATA-ONLY -D model/S561 --repo "${{ github.repository }}"
          gh run download 38668099481 -n s566-Seven-S561-new-note-policies-18trained-physical34-vs-raw7-and-S546-SHA-sealed-NO-MIDI -D model/S566 --repo "${{ github.repository }}"
          gh run download 38668197551 -n s567-five-UNSEEN-new-S561-composers-real-MIDI-noteon-S546-vs-S562-physical34-F1 -D model/S567 --repo "${{ github.repository }}"
      - name: Independently reproduce all old source NoteOn scores by LOW/MID/HIGH register with real MIDI SHA proof
        run: |
          python -u -m scripts.s568_new_S561_register_audit_exact_noteon_physical34 \
            --manifest model/S561/report.json --freeze-report model/S566/report.json \
            --score-report model/S567/report.json \
            --frozen-predictions model/S566/S566_FIVE_NEW_MAESTRO_FULL_NAMED_NOTEON_POLICIES_PRE_MIDI.jsonl \
            --out model/S568
          python - <<'PY'
          import json
          r=json.load(open('model/S568/report.json'))
          assert r['status']=='S568_TRUE_INDEPENDENT_REGISTER_PITCH_NOTEON_CAUSES_POST_S567'
          assert r['all_register_counts_S567_independently_replayed_for_every_policy_tolerance']
          assert len(r['full_register_scores'])==7
          assert len(r['register_progress_and_remaining_errors'])==3
          assert r['measurements_are_POSTHOC_NOT_new_prospective_validation']
          assert r['no_promotion'] and r['cannot_promote_original_S80_or_ExactK_or_Live']
          print('S568 PASS independently verified all S567 real note-on F1 MIDI totals separately by register')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s568-five-NEW-S561-composers-causal-register-40-59-60-71-72-88-MIDI-pitch-audit
          path: model/S568/
          retention-days: 90
