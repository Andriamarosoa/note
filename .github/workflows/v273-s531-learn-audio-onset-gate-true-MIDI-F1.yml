name: S531 true held-song acoustic noteon gate suppresses duplicate false K0 pitches, full MIDI F1
on:
  push:
    branches: [codex/s530-full-maestro-noteon-f1]
    paths:
      - scripts/s531_train_held_raw_wav_onset_validity_gate_for_new_notes.py
      - .github/workflows/v273-s531-learn-audio-onset-gate-true-MIDI-F1.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  held_song_audio_only_onset_validity_heads:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numpy/scipy logistic ExtraTrees and actual MIDI parser
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Selftest note-on gate never deletes original already-born Basic Pitch notes
        run: |
          python -m py_compile scripts/s531_train_held_raw_wav_onset_validity_gate_for_new_notes.py
          python -m scripts.s531_train_held_raw_wav_onset_validity_gate_for_new_notes --self-test
      - name: Restore SHA-frozen original piano track selection and full MIDI 330-onset annotations
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
      - name: Restore real 49-pitch audio descriptors and six held trained pitch experts
        run: |
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648729508 -n s530-full-330-real-MAESTRO-MIDI-noteon-prec-recall-F1-vs-protected-S529 -D model/S530 --repo "${{ github.repository }}"
      - name: Train 3 actual held original piano song note-on gates per architecture, score every predicted + true note across full audio
        run: |
          python -u -m scripts.s531_train_held_raw_wav_onset_validity_gate_for_new_notes \
            --manifest model/S469/report.json \
            --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --pitch model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --pitch-report model/S528/report.json \
            --full-report model/S530/report.json \
            --out model/S531
          python - <<'PY'
          import json
          r=json.load(open('model/S531/report.json'))
          assert r['status']=='S531_TRUE_TRAINED_RAW_ACOUSTIC_NOTEON_GATE_HELD_SONG_MAESTRO'
          assert r['physical_candidate_positives']==322
          assert r['physical_candidate_unmatched']==253
          assert r['original_true_MIDI_groups']==330
          assert r['genuine_model_checkpoints']==6
          assert len(r['policies'])==4
          assert r['S528_pitch_crossfit_probabilities_NOT_used_in_event_gate_training']
          assert r['original_S80_ExactK_and_Live_unchanged'] and r['no_promotion']
          print('S531 six train-on-two-held-one full-interval MIDI onset validity models pass')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s531-six-genuine-held-song-noteon-gates-330-MIDI-onsets-253-unmatched-candidates-F1
          path: model/S531/
          retention-days: 90
