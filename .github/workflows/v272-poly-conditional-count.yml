name: V27.2 conditional polyphonic count

on:
  push:
    branches: [v272-poly-conditional-count]
    paths:
      - 'scripts/train_v272_poly_conditional_count.py'
      - 'test/test_v272_poly_conditional_count.py'
      - 'analysis/v272-poly-conditional-count-protocol.md'
      - '.github/workflows/v272-poly-conditional-count.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  PYTHONPATH: '.:src'
  V104_NESTED_RUN: '33647694565'
  V271_RUN: '34270082405'

jobs:
  preflight:
    name: Protocol and source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: python -m pip install -r requirements-train.txt

      - name: Compile and test frozen V27.2 rules
        run: |
          python -c 'import tensorflow; assert tensorflow.__version__ == "2.15.1"'
          python -m py_compile scripts/train_v272_poly_conditional_count.py
          python -m unittest test.test_v272_poly_conditional_count test.test_v271_poly_rescue test.test_v260_count_weighting -v

      - name: Verify immutable source runs and live artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              [Number(process.env.V104_NESTED_RUN), '345dea1e92f6281583c58590a0b1286ce4df459b'],
              [Number(process.env.V271_RUN), 'aed78122c5d85079c84b597e78331ba080f8b4b3'],
            ];
            for (const [run_id, sha] of sources) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
              });
              if (run.head_sha !== sha || run.conclusion !== 'success') {
                throw new Error(`invalid source run ${run_id}`);
              }
            }
            const v104 = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.V104_NESTED_RUN),
              per_page: 100,
            });
            if (!v104.some(a => a.name === 'v104-nested-spectral-bundle' && !a.expired)) {
              throw new Error('frozen V10.4 spectral bundle is unavailable');
            }
            const v271 = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.V271_RUN),
              per_page: 100,
            });
            const folds = v271.filter(a => /^v271-poly-rescue-fold-[0-4]$/.test(a.name) && !a.expired);
            if (folds.length !== 5) {
              throw new Error(`expected five live V27.1 fold artifacts, found ${folds.length}`);
            }
            if (!v271.some(a => a.name === 'v271-verified-guitarset' && !a.expired)) {
              throw new Error('verified V27.1 GuitarSet artifact is unavailable');
            }

      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v271-verified-guitarset
          path: data/GuitarSet
          repository: Andriamarosoa/note
          run-id: ${{ env.V271_RUN }}
          github-token: ${{ github.token }}

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Share verified GuitarSet with fold jobs
        uses: actions/upload-artifact@v4
        with:
          name: v272-verified-guitarset
          path: |
            data/GuitarSet/annotation.zip
            data/GuitarSet/audio_mono-pickup_mix.zip
          compression-level: 0
          retention-days: 7

  fold:
    name: Conditional poly count fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: python -m pip install -r requirements-train.txt

      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v272-verified-guitarset
          path: data/GuitarSet

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen nested spectral cache
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.V104_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen V27.1 fold
        uses: actions/download-artifact@v4
        with:
          name: v271-poly-rescue-fold-${{ matrix.fold }}
          path: model/v271-source
          repository: Andriamarosoa/note
          run-id: ${{ env.V271_RUN }}
          github-token: ${{ github.token }}

      - name: Train conditional poly head and evaluate untouched outer fold
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v272_poly_conditional_count.py fold \
            --dataset-dir data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --v271-dir model/v271-source \
            --outer-fold ${{ matrix.fold }} \
            --output-dir model/v272-fold-${{ matrix.fold }} \
            2>&1 | tee model/v272-fold-${{ matrix.fold }}.log

      - name: Verify fold guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold = ${{ matrix.fold }}
          report = json.loads(Path(f'model/v272-fold-{fold}/report-fold-{fold}.json').read_text())
          p = report['protocol']
          assert p['experiment'] == 'v272_poly_conditional_count'
          assert p['outer_labels_used_for_arm_or_epoch_selection'] is False
          assert p['threshold_tuning'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          before = report['outer']['v271']
          after = report['outer']['v272']
          assert (after['correct'] - before['correct']) == (after['poly_correct'] - before['poly_correct'])
          print('fold', fold,
                'selected', report['inner']['selected_arm'],
                'epochs', report['inner']['selected_epochs'],
                'v271 poly', before['poly_exact'],
                'v272 poly', after['poly_exact'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v272-poly-conditional-fold-${{ matrix.fold }}
          path: |
            model/v272-fold-${{ matrix.fold }}
            model/v272-fold-${{ matrix.fold }}.log
          retention-days: 90

  summary:
    name: Final frozen outer summary
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install 'numpy>=1.23.5,<2'

      - uses: actions/download-artifact@v4
        with:
          pattern: v272-poly-conditional-fold-*
          path: model/v272-all

      - name: Aggregate and reproduce V27.1 reference
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v272_poly_conditional_count.py summarize \
            --input-dir model/v272-all \
            --output-dir model/v272-summary \
            2>&1 | tee model/v272-summary.log

      - name: Print final decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('model/v272-summary/report.json').read_text())
          print('reference poly exact-K:', r['reference']['cardinality']['poly_exact'])
          print('conditional poly exact-K:', r['poly_conditional']['cardinality']['poly_exact'])
          print('delta poly pp:', r['delta']['poly_exact_k_percentage_points_vs_v271'])
          print('delta global exact pp:', r['delta']['exact_k_percentage_points_vs_v271'])
          print('delta F1 pp:', r['delta']['event_f1_percentage_points_vs_v271'])
          print('promote:', r['decision']['promote_poly_conditional'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v272-poly-conditional-summary
          path: |
            model/v272-summary
            model/v272-summary.log
          retention-days: 90
