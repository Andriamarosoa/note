name: S663 learned candidate ranking for GuitarSet 80 percent NoteOff goal
on:
  push:
    branches: [codex/s663-offset-candidate-ranking]
    paths:
      - scripts/s663_candidate_offset_ranker.py
      - .github/workflows/v273-s663-offset-ranking.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s663-offset-ranking
  cancel-in-progress: true
jobs:
  held_composition_offset_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Compile and self-test S663
        run: |
          python -m compileall -q scripts/s663_candidate_offset_ranker.py
          python -m scripts.s663_candidate_offset_ranker --self-test
      - name: Restore original S425 immutable MIDI note and offset predictions
        run: |
          mkdir -p model/S425
          gh run download 38513725784 -n s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions -D model/S425 --repo ${{ github.repository }}
          test -f model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz
      - name: Download pinned GuitarSet annotation JAMS
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Compute real offset candidate oracle and predict new cross-composition residual offsets
        run: |
          python -m scripts.s663_candidate_offset_ranker --frozen model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz --annotations data/GuitarSet/annotation.zip --out /tmp/s663-offset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S663_80PCT_OFFSET_FEASIBILITY_REAL_GUITARSET
          path: /tmp/s663-offset/report.json
          if-no-files-found: warn
          retention-days: 60
