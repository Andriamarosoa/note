name: S205 audit 16 mixed-parent S45 families and S46 193 policies
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s205_experimental_s45_s46_bridge.py'
      - '.github/workflows/v273-s205-experimental-s45-s46-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s205-s45-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_mixed_source_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical S45 Ridge compatible environment
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Install original S45 transitive PyTorch import dependency
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore 304 original S45 risk checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891039201
          name: v273-series45-specialized-risk-heads
          path: model/S45
      - name: Retrieve preserved S173 eleven adapted source proposals
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38206160849
          name: v273-s173-real-trained-S35-adapted-11-source-S45-risks-NO-S80
          path: model/S173
      - name: Run four fail-closed research branches through all 16 S45 risk families and 193 S46 policies
        run: |
          set -euo pipefail
          ELEVEN="$(find model/S173 -name S173_S35_adapted_11_family_GOAT.npz -print -quit)"
          test -s "$ELEVEN"
          test -d model/S45/models
          python -m scripts.s205_experimental_s45_s46_bridge \
            --five analysis/evidence/v273-recovered-five-families/external_five_families.npz \
            --eleven "$ELEVEN" \
            --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz \
            --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz \
            --models model/S45/models \
            --catalog analysis/v273_s45_original_champion_catalog.json \
            --out model/S205
      - name: Assert no unsupported S80 promotion or independent performance claim
        run: |
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          p=Path('model/S205')
          d=json.loads((p/'report.json').read_text())
          assert d['family_count']==16 and len(d['fold_results'])==4
          assert d['risk_checkpoint_count']==304
          assert not d['S80_promoted'] and not d['original_S80_equivalence_proven']
          assert not d['independent_accuracy_measured'] and not d['truth_labels_read']
          for fold in (0,1,2,4):
              with np.load(p/f'fold{fold}/s46/predictions.npz',allow_pickle=False) as z:
                  assert z['predictions'].shape==(57,193)
                  assert len(z['variant_ids'])==193
          print('S205 PASS 4x16 original-risk families, 4x193 S46 diagnostic, NO S80 PROMOTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s205-experimental-16-s45-193-s46-not-promotion
          path: model/S205/
          retention-days: 90
