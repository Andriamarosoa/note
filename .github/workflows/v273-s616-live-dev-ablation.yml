name: S616 LIVE native causal selection ablations
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s616_live_guard.py
      - scripts/s616_live_dev_ablation.py
      - test/test_s616_live_guard.py
      - .github/workflows/v273-s616-live-dev-ablation.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  urmp_development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged NOTE inference runtime plus audio IO
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scipy==1.14.1
      - name: Test causal effects and unchanged S614 selection
        run: python -m unittest -v test.test_s616_live_guard test.test_strict_live
      - name: Run 15 prerecorded ablations on original five URMP development songs
        run: python -m scripts.s616_live_dev_ablation --out /tmp/S616
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S616-live-dev-ablation-only
          path: /tmp/S616/
          if-no-files-found: warn
          retention-days: 60
