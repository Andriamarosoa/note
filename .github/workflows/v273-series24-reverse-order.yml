name: V27.3 S24 reverse B before A frozen-weight test
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series24-reverse-order.yml'
      - 'scripts/audit_v273_inverse_ab_order.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numpy and PyTorch CPU
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify B-first operation really changes A
        run: python -m scripts.audit_v273_inverse_ab_order --self-test
      - name: Retrieve verified original pickup acoustic fold features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/audio/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Get certified S18 conservative decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Get original S20 learned A/B checkpoints, probabilities, case audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37858383973 --repo "$GITHUB_REPOSITORY" --name v273-series20-residual --dir model/S20
      - name: Replay all 19 pieces in inverse order and compare per-K regression cases
        run: >-
          python -m scripts.audit_v273_inverse_ab_order
          --features model/features
          --s18 model/S18/predictions.npz
          --s20 model/S20
          --s20-probs model/S20/probabilities.npz
          --output model/S24
      - name: Publish paired complete inverse-order audit
        run: cat model/S24/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series24-inverse-order
          path: model/S24/
          retention-days: 90
