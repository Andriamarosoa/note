name: V27.3 series12 full-audio regression consensus
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series12-full-audio.yml'
      - 'scripts/loop_v273_full_audio_risk.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v273-series12-full-audio
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Unit tests for consensus and veto scope
        run: python -m scripts.loop_v273_full_audio_risk --self-test
      - name: Get full acoustic feature archives from pinned original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio-tars
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio-tars
          for fold in 0 1 2 4; do
            mkdir -p "model/full-audio/fold-$fold"
            tar -xf "model/audio-tars/v273-open-features-$fold.tar" -C "model/full-audio/fold-$fold"
          done
      - name: Get verified series9 decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37853130781 --repo "$GITHUB_REPOSITORY" --name v273-series9-posthoc-audit --dir model/series9-input
      - name: Fit piece-excluded acoustic risk gates and audit 24 policies
        run: >-
          python -m scripts.loop_v273_full_audio_risk
          --features model/full-audio
          --series9 model/series9-input/predictions.npz
          --output model/series12-full-audio
      - name: Publish full correction/regression audit
        run: cat model/series12-full-audio/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series12-full-audio
          path: model/series12-full-audio/
          retention-days: 90
