name: S794 original S708 versus newer wrapper CAL32 exact MIDI parity
on:
  push:
    branches: [codex/note-s794-activek-zero-delay-forensics]
    paths:
      - scripts/s794_source_path_parity.py
      - .github/workflows/note-s794-source-path-parity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact frozen S794 CPU environment
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m compileall -q scripts/s794_source_path_parity.py
      - name: Recover unchanged S708 / S707 checkpoint
        run: |
          mkdir -p /tmp/s794path/s708 /tmp/s794path/s707
          gh run download 39094682419 --repo Andriamarosoa/note \
            --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s794path/s708
          gh run download 39059008484 --repo Andriamarosoa/note \
            --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL \
            --dir /tmp/s794path/s707
          test -s /tmp/s794path/s708/report.json
          test -s /tmp/s794path/s708/s708_selected.pt
          test -s /tmp/s794path/s707/s675_hazard.joblib
      - name: Compare CAL32 archived original and convenience decoder event streams
        run: |
          python -m scripts.s794_source_path_parity \
            --s708 /tmp/s794path/s708 \
            --offset-checkpoint /tmp/s794path/s707/s675_hazard.joblib \
            --out /tmp/s794path/experiment
      - name: Record honest parity results; do not relax strict promotion gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/s794path/experiment/report.json'))
          assert p['complete'] and p['done']==32
          assert not p['promoted'] and not p['TEST_opened'] and not p['HELD_opened']
          print("S794_ORIGINAL_SOURCE_DRIFT",p["original_signed_drift"])
          print("S794_WRAPPER_SOURCE_DRIFT",p["modern_signed_drift"])
          print("S794_DIFFERENT_TRACKS",len(p["wrapper_vs_original"]))
          print("S794_IS_A_REPRODUCIBILITY_PROBE_NOT_A_MODEL_SCORE")
          PY
      - name: Preserve track-level differences even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S794_ORIGINAL_VS_WRAPPER_CAL32_MIDI_PARITY
          path: /tmp/s794path/experiment/report.json
          retention-days: 45
          if-no-files-found: warn
