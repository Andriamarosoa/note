name: S631 learn variable attack-to-decision time from genuine NOTE audio
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s631_adaptive_latency.py
      - scripts/s631_train_adaptive_policy.py
      - test/test_s631_adaptive_latency.py
      - .github/workflows/v273-s631-adaptive-latency-train.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s631-learned-stop-policy
  cancel-in-progress: false
jobs:
  train_known_composition_split:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original causal NOTE inference and training runtime
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify original NOTE and adaptive head causal contracts
        run: |
          python -m compileall -q src/causal_note/s631_adaptive_latency.py scripts/s631_train_adaptive_policy.py
          python -m unittest -v test.test_strict_live test.test_s631_adaptive_latency
      - name: Fit action head only on 35 real train titles; evaluate 17 dev
        run: python -m scripts.s631_train_adaptive_policy --out /tmp/S631
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S631-genuine-trained-adaptive-latency-DEV-only
          path: /tmp/S631
          retention-days: 60
          if-no-files-found: warn
