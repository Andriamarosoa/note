name: S714 independent exact K, harmonic coincidence and MIDI event audit
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - scripts/s714_audit_s708_cardinality.py
      - test/test_s714_s708_cardinality.py
      - .github/workflows/note-s714-event-cardinality-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s714-cardinality-event-audit
  cancel-in-progress: true
jobs:
  forensic_event_recount:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned native inference/metric dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Static check and independent synthetic truth/stream contracts
        run: |
          python -m compileall -q scripts/s714_audit_s708_cardinality.py test/test_s714_s708_cardinality.py
          python -m unittest -v test.test_s714_s708_cardinality test.test_s713_metric_contract
      - name: Download frozen S708 HELD and DEV emitted event artifacts
        run: |
          mkdir -p /tmp/s714_source /tmp/s714
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s714_source
          test -s /tmp/s714_source/report.json
          test -s /tmp/s714_source/held_events.jsonl
          test -s /tmp/s714_source/dev_events.jsonl
          (cd /tmp/s714_source && zip -q /tmp/s714/s708_frozen_emissions.zip report.json held_events.jsonl dev_events.jsonl)
      - name: Independent replay of all 44 real guitar tracks
        run: |
          python -m scripts.s714_audit_s708_cardinality --artifact /tmp/s714/s708_frozen_emissions.zip --out /tmp/s714/report.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/s714/report.json'))
          a=j['splits']['DEV'];b=j['splits']['HELD']
          assert a['tracks']==12 and b['tracks']==32
          assert a['summary']['candidate']['frames']==48970
          assert a['summary']['candidate']['under']==13658
          assert a['summary']['candidate']['over']==6433
          assert a['ambiguous_simultaneous_pitch_frames']==218
          assert b['summary']['candidate']['under']==36323
          assert b['summary']['candidate']['over']==13629
          assert b['ambiguous_simultaneous_pitch_frames']==489
          assert a['summary']['candidate']['by_true_k']['3']['under']==3750
          print('S714 FROZEN_44_GUITAR_TRACKS_REPLAYED_EXACT_K_MATCH',flush=True)
          PY
      - name: Archive independent forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S714_S708_INDEPENDENT_EXACTK_EVENT_FORENSICS
          path: /tmp/s714/report.json
          retention-days: 60
          if-no-files-found: warn
