name: S539 prospective five new composer Basic Pitch prelabel MIDI notes from sealed WAV only
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s539_freeze_5new_maestro_basicpitch_notes_PREMIDI.py
      - .github/workflows/v273-s539-basicpitch-five-new-source-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_new_composers_original_SPOTIFY_BP_note_output:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen independent Basic Pitch model and inference ABI
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Check exact E3-G3-B3 MIDI pitch names without MIDI
        run: |
          python -m py_compile scripts/s539_freeze_5new_maestro_basicpitch_notes_PREMIDI.py
          python -m scripts.s539_freeze_5new_maestro_basicpitch_notes_PREMIDI --self-test
      - name: Verify preregistration and original source V88 five-composer WAV proof
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656509448 -n s538-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S538 --repo "${{ github.repository }}"
      - name: Run fixed unmodified Basic Pitch note predictor on the same SHA-frozen five new piano WAVs
        run: |
          python -u -m scripts.s539_freeze_5new_maestro_basicpitch_notes_PREMIDI \
            --manifest model/S537/report.json --s538 model/S538/report.json --out model/S539
          python - <<'PY'
          import json
          r=json.load(open('model/S539/report.json'))
          assert r['status']=='S539_PRETRAINED_BASIC_PITCH_NOTE_EVENTS_ON_THIRD_SOURCE_MAESTRO_PREMIDI'
          assert r['prediction_windows_piano']==5
          assert r['original_WAV_content_SHA_verified']
          assert not r['original_MAESTRO_MIDI_ANNOTATIONS_OPENED']
          assert r['S537_new_composers_before_WAV_MIDI']
          assert r['no_promotion']
          print('S539 PASS five independent composer source Basic Pitch NOTE_NAME predictions frozen BEFORE MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s539-five-new-composers-BasicPitch-fixed-original-note-predictions-PREMIDI
          path: model/S539/
          retention-days: 90
