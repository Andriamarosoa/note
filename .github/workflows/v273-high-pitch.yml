name: Compare native K with high pitch rescue

'on':
  push:
    branches: [codex/v273-high-pitch-rescue]
    paths: ['analysis/v273-high-pitch-launch.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v273-high-pitch-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  AUDIT_TAG: v273-high-pitch-${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - run: python -B -m unittest -v test.test_v273_high_pitch test.test_v273_residual_native test.test_v273_residual_map
      - name: Verify paired initialization and synthetic learning
        run: python -B scripts/v273_high_pitch_native.py --output model/high-pitch-preflight
      - name: Preserve the fixed protocol and preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'High pitch rescue comparison - internal fold 3' \
            --notes-file analysis/v273-high-pitch-protocol.md
          python -B scripts/archive_v273_native_stage.py --root model/high-pitch-preflight \
            --name high-pitch-preflight --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-pitch-preflight
          path: model/high-pitch-preflight
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore pinned source audio and native inputs
        run: python -B scripts/restore_v273_residual_native_inputs.py --root model/source --with-audio --launch analysis/v273-high-pitch-launch.json
      - name: Construct normal and compressed views on the 190 inner tracks only
        run: |
          python -B scripts/prepare_v273_high_pitch.py \
            --dataset model/source/GuitarSet --bundle model/source/native-window-bundle \
            --geometry model/source/ownership-inputs --config analysis/v273-native-paired-config.json \
            --output model/high-pitch-build --workers 2
      - name: Preserve consolidated input arrays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('model/high-pitch-build');target=Path('model/high-pitch-inputs')
          target.mkdir()
          for name in ('maps.npy','report.json','validation-registers.npz'):
              (source/name).replace(target/name)
          PY
          python -B scripts/archive_v273_native_stage.py --root model/high-pitch-inputs \
            --name high-pitch-inputs --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: high-pitch-inputs
          path: model/high-pitch-inputs
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: high-pitch-audit-inputs
          path: |
            model/high-pitch-inputs/report.json
            model/high-pitch-inputs/validation-registers.npz
          retention-days: 90

  train:
    needs: [preflight, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arm: [observed_only, with_high_pitch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-preflight
          path: model/high-pitch-preflight
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-inputs
          path: model/high-pitch-inputs
      - name: Restore identical candidate inputs and ownership
        run: python -B scripts/restore_v273_residual_native_inputs.py --root model/source --launch analysis/v273-high-pitch-launch.json
      - name: Train the assigned input treatment for 12 epochs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/train_v273_high_pitch.py --arm ${{ matrix.arm }} \
            --bundle model/source/native-window-bundle --geometry model/source/ownership-inputs \
            --maps model/high-pitch-inputs --preflight model/high-pitch-preflight \
            --config analysis/v273-native-paired-config.json \
            --output model/high-pitch-${{ matrix.arm }} --release-tag "$AUDIT_TAG"
      - name: Preserve completed or partial training
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/high-pitch-${{ matrix.arm }} \
            --name high-pitch-${{ matrix.arm }} --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-pitch-${{ matrix.arm }}
          path: model/high-pitch-${{ matrix.arm }}
          if-no-files-found: warn
          retention-days: 90

  verdict:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-observed_only
          path: model/results/high-pitch-observed_only
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-with_high_pitch
          path: model/results/high-pitch-with_high_pitch
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-audit-inputs
          path: model/audit-inputs
      - uses: actions/download-artifact@v4
        with:
          name: high-pitch-preflight
          path: model/high-pitch-preflight
      - name: Independently recount the fixed-epoch results
        run: |
          python -B scripts/audit_v273_high_pitch.py --root model/results \
            --config analysis/v273-native-paired-config.json --output model/high-pitch-verdict \
            --audit-inputs model/audit-inputs --preflight model/high-pitch-preflight
          cat model/high-pitch-verdict/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/high-pitch-verdict \
            --name high-pitch-verdict --tag "$AUDIT_TAG"
          gh release edit "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --notes-file model/high-pitch-verdict/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: high-pitch-verdict
          path: model/high-pitch-verdict
          retention-days: 90
