name: S533 nine frozen harmonic rivalry and same-pitch reentry loops full MIDI NoteOn
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s533_harmonic_competition_temporal_duplicate_loops.py
      - .github/workflows/v273-s533-fundamental-harmonic-temporal-loops.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compare_harmonics_and_temporal_dedup_midi_F1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install independent numeric MIDI matcher
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Self-test original polyphonic chord protection and physical harmonic competition
        run: |
          python -m py_compile scripts/s533_harmonic_competition_temporal_duplicate_loops.py
          python -m scripts.s533_harmonic_competition_temporal_duplicate_loops --self-test
      - name: Restore three verified audio and complete MIDI sources with 49 true pitch features and genuine note probabilities
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
          gh run download 38648729508 -n s530-full-330-real-MAESTRO-MIDI-noteon-prec-recall-F1-vs-protected-S529 -D model/S530 --repo "${{ github.repository }}"
      - name: Verify nine independent harmonic and temporal duplicate policies across all 416 note attacks and all emitted predictions
        run: |
          python -u -m scripts.s533_harmonic_competition_temporal_duplicate_loops \
            --manifest model/S469/report.json --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json \
            --full-report model/S530/report.json --out model/S533
          python - <<'PY'
          import json
          s=json.load(open('model/S533/report.json'))
          assert s['status']=='S533_NINE_FROZEN_HARMONIC_DEDUP_LOOPS_MAESTRO_NOTEON'
          assert s['independent_original_S530_score_replayed']
          assert len(s['tests'])==9 and s['original_330_true_MIDI_onsets_all_evaluated']
          assert s['no_promotion'] and s['reference_S80_ExactK_Live_untouched']
          print('S533 nine frozen acoustic hypothesis audits PASS, no baseline modification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s533-nine-fundamental-harmonic-temporal-repeat-noteon-policy-audits
          path: model/S533/
          retention-days: 90
