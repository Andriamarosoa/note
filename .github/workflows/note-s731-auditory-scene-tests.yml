name: S731 human-inspired old-plus-new auditory source competition tests
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - src/causal_note/s731_auditory_scene.py
      - test/test_s731_auditory_scene.py
      - .github/workflows/note-s731-auditory-scene-tests.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: note-s731-auditory-scene-tests
  cancel-in-progress: true
jobs:
  S731_strict_causal_counterfactual_acoustic_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU audio dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove original 288D unchanged and no future K, novelty vs shared parent gain for any note
        run: |
          python -m compileall -q src/causal_note/s731_auditory_scene.py
          python -m unittest -v test.test_s731_auditory_scene test.test_s730_additive_k_guard test.test_s713_metric_contract
