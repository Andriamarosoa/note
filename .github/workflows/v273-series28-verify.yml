name: V27.3 S28 verify adaptive scheduler and archive
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series28-verify.yml'
      - 'scripts/verify_v273_adaptive_scheduler.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover fixed learned route estimator dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch original S28 full audit and 152 classifier models
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37864237149 --repo "$GITHUB_REPOSITORY" --name v273-series28-adaptive-scheduler --dir model/S28-original
      - name: Fetch source S27 decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37864168525 --repo "$GITHUB_REPOSITORY" --name v273-series27-partial-revisits --dir model/S27
      - name: Fetch trained B-first source proposals
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37862417522 --repo "$GITHUB_REPOSITORY" --name v273-series25-trained-Bfirst --dir model/S25
      - name: Fetch S18 conservative parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Retrieve original source acoustic features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/acoustic
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/acoustic
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/acoustic/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Independently replay 152 gate weights and complete action choice
        run: >-
          python -m scripts.verify_v273_adaptive_scheduler
          --features model/features
          --s18 model/S18/predictions.npz
          --s27 model/S27/predictions.npz
          --s25 model/S25/predictions.npz
          --input model/S28-original
          --output model/S28-verified
      - name: Publish verified full-prediction audit
        run: cat model/S28-verified/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series28-verified
          path: model/S28-verified/
          retention-days: 90
      - name: Preserve full learned order and revisit arbitration research
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series28-learned-scheduler.tar.gz -C model S28-original S28-verified
          (cd model/archive && sha256sum v273-series28-learned-scheduler.tar.gz > SHA256SUMS)
          gh release create "v273-series28-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series28-learned-scheduler.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 learned order and selective revisit scheduler ${GITHUB_RUN_ID}" \
            --notes "152 piece-excluded learned routing models choose between S18, A-first full/partial and B-first, complete saved masks and scores, all per-event corrections and regressions. No unseen-music validation or promotion."
