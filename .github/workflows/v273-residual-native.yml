name: Compare native K with causal residual maps

'on':
  push:
    branches: [codex/v273-residual-native-pair]
    paths: ['analysis/v273-residual-native-launch.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v273-residual-native-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  AUDIT_TAG: v273-residual-native-${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - run: python -B -m unittest -v test.test_v273_residual_native test.test_v273_residual_map test.test_v273_stable_prediction
      - name: Verify paired initialization and synthetic learning
        run: python -B scripts/v273_residual_native.py --output model/residual-preflight
      - name: Preserve the fixed protocol and preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Native residual map comparison - internal fold 3' \
            --notes-file analysis/v273-residual-native-protocol.md
          python -B scripts/archive_v273_native_stage.py --root model/residual-preflight \
            --name residual-preflight --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-preflight
          path: model/residual-preflight
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Restore pinned source audio and native inputs
        run: python -B scripts/restore_v273_residual_native_inputs.py --root model/source --with-audio
      - name: Construct maps on the 190 inner tracks only
        run: |
          python -B scripts/prepare_v273_residual_native.py \
            --dataset model/source/GuitarSet --bundle model/source/native-window-bundle \
            --geometry model/source/ownership-inputs --config analysis/v273-native-paired-config.json \
            --output model/residual-build --workers 2
      - name: Preserve consolidated input arrays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('model/residual-build');target=Path('model/residual-inputs')
          target.mkdir()
          for name in ('maps.npy','ownership-packed.npy','report.json'):
              (source/name).replace(target/name)
          PY
          python -B scripts/archive_v273_native_stage.py --root model/residual-inputs \
            --name residual-inputs --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: residual-inputs
          path: model/residual-inputs
          retention-days: 90

  train:
    needs: [preflight, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arm: [observed_only, with_residual]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: residual-preflight
          path: model/residual-preflight
      - uses: actions/download-artifact@v4
        with:
          name: residual-inputs
          path: model/residual-inputs
      - name: Restore identical candidate inputs and ownership
        run: python -B scripts/restore_v273_residual_native_inputs.py --root model/source
      - name: Train the assigned input treatment for 12 epochs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/train_v273_residual_native.py --arm ${{ matrix.arm }} \
            --bundle model/source/native-window-bundle --geometry model/source/ownership-inputs \
            --maps model/residual-inputs --preflight model/residual-preflight \
            --config analysis/v273-native-paired-config.json \
            --output model/residual-${{ matrix.arm }} --release-tag "$AUDIT_TAG"
      - name: Preserve completed or partial training
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/residual-${{ matrix.arm }} \
            --name residual-${{ matrix.arm }} --tag "$AUDIT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-${{ matrix.arm }}
          path: model/residual-${{ matrix.arm }}
          if-no-files-found: warn
          retention-days: 90

  verdict:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: residual-observed_only
          path: model/results/residual-observed_only
      - uses: actions/download-artifact@v4
        with:
          name: residual-with_residual
          path: model/results/residual-with_residual
      - name: Independently recount the fixed-epoch results
        run: |
          python -B scripts/audit_v273_residual_native.py --root model/results \
            --config analysis/v273-native-paired-config.json --output model/residual-verdict
          cat model/residual-verdict/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/residual-verdict \
            --name residual-verdict --tag "$AUDIT_TAG"
          gh release edit "$AUDIT_TAG" --repo "$GITHUB_REPOSITORY" --notes-file model/residual-verdict/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: residual-verdict
          path: model/residual-verdict
          retention-days: 90
