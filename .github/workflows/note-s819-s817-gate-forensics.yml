name: S819 true archived S817 high-polyphony activation forensics MIDI256
on:
  push:
    branches: [codex/note-s819-independent-model-review]
    paths:
      - scripts/s819_s817_gate_forensics.py
      - .github/workflows/note-s819-s817-gate-forensics.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Require actual independent external-model consultations and six checks
        run: |
          gh run view 39552451395 --repo Andriamarosoa/note --json status,conclusion
          test "$(gh run view 39552451395 --repo Andriamarosoa/note --json conclusion --jq .conclusion)" = success
      - name: Download truly trained frozen 5x S817 high polyphony specialists
        run: |
          mkdir -p /tmp/s819/s817
          gh run download 39543749810 --repo Andriamarosoa/note --name S817_FIVEHEAD_ACTIVEK_TEMPORAL_K4_K6_FIT80_RESULTS --dir /tmp/s819/s817
          R="$(find /tmp/s819/s817 -path '*/result/report.json' -type f -print -quit)"
          test -s "$R"
          test -s "$(dirname "$(dirname "$R")")/fresh256/report.json"
          printf '%s\n' "$(dirname "$R")" > /tmp/s819/s817_dir
      - name: Download genuine frozen 5x S815 ActiveK three-head checkpoints
        run: |
          mkdir -p /tmp/s819/s815
          gh run download 39536863317 --repo Andriamarosoa/note --name S815_ACTIVE_K_PRIVATE_MIDI256_FIT80_RESULTS --dir /tmp/s819/s815
          R="$(find /tmp/s819/s815 -path '*/experiment/report.json' -type f -print -quit)"
          test -s "$R"
          printf '%s\n' "$(dirname "$R")" > /tmp/s819/s815_dir
      - name: Restore original S800 80 signed FIT80 manifests and note annotations
        run: |
          mkdir -p /tmp/s819/manifest /tmp/s819/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s819/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s819/traces
          MANIFEST="$(find /tmp/s819/manifest -name report.json -type f -print -quit)"
          TRACE="$(find /tmp/s819/traces -name fit_000.json -type f -print -quit)"
          test -s "$MANIFEST"
          test -s "$TRACE"
          printf '%s\n' "$MANIFEST" > /tmp/s819/manifest_file
          printf '%s\n' "$(dirname "$TRACE")" > /tmp/s819/traces_dir
      - name: Download exactly SHA pinned original GuitarSet audio PCM
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          source=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())['guitar_archives']['GuitarSet_audio']
          output=Path('/tmp/s819/guitar_audio.zip')
          with urllib.request.urlopen(source['url'],timeout=180) as inp,output.open('wb') as dest:
              while block:=inp.read(4194304):dest.write(block)
          assert output.stat().st_size==source['size']
          h=hashlib.sha256()
          with output.open('rb') as inp:
              for b in iter(lambda:inp.read(4194304),b''):h.update(b)
          assert h.hexdigest()==source['sha256']
          print('S819_AUTHENTIC_ORIGINAL_PCM_SHA',h.hexdigest())
          PY
      - name: Extract 80 authentic 44.1kHz recordings at causal 256-sample hop
        run: |
          python -m scripts.s813_prepare_native256 --manifest "$(cat /tmp/s819/manifest_file)" --traces "$(cat /tmp/s819/traces_dir)" --audio-zip /tmp/s819/guitar_audio.zip --out /tmp/s819/fresh256 --workers 2
      - name: Forensic real S817 high-polyphony gating and source parity, no new training
        run: |
          python -m scripts.s819_s817_gate_forensics --cache /tmp/s819/fresh256 --s817-dir "$(cat /tmp/s819/s817_dir)" --s815-dir "$(cat /tmp/s819/s815_dir)" --out /tmp/s819/gate_audit
      - name: Fail closed on missing/changed source or original scores
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s819/gate_audit/report.json'))
          assert r['complete'] and len(r['tracks'])==80 and len(r['folds'])==5
          assert r['original_baseline_s815']['correct']==141946
          assert r['original_teacher_s817']['correct']==141946
          assert r['n_original_decisions_changed']==0
          assert r['metric_hop_samples']==256 and r['decision_hop_samples']==256
          assert len(r['outer_policy_totals'])==9
          assert all(v['active_k']['frames']==249411 for v in r['outer_policy_totals'].values())
          assert not r['new_training'] and not r['promotion']
          assert not r['outer_labels_used_for_calibration'] and not r['production_live_modified']
          print('S819_GATING_VERIFIED_9_POLICIES')
          print('S819_TRUE_POLICY_CHANGED_COUNTS',json.dumps({
              k:v['changed_frames'] for k,v in r['outer_policy_totals'].items()},sort_keys=True))
          PY
      - name: Retain genuine S817 high-polyphony calibrated and fixed-policy posthoc results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S819_S817_TRUE_PCM256_GATE_POLICY_AUDIT_NOT_PROMOTION
          path: |
            /tmp/s819/gate_audit/report.json
            /tmp/s819/fresh256/report.json
          retention-days: 45
          if-no-files-found: warn
