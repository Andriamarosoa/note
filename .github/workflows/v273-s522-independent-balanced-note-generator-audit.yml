name: S522 independently verify original S519 and balanced S521 real 14-head note-selector model gains losses
on:
  push:
    branches: [codex/s521-balanced-14head-audio-note-attention]
    paths:
      - scripts/s522_independent_compare_S519_S521_nested_14head_note_fusion.py
      - .github/workflows/v273-s522-independent-balanced-note-generator-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  original_note_K_and_exact_named_notes_source_S519_versus_S521:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install only independent numpy note scorer; no model retraining
        run: python -m pip install numpy==1.26.4
      - name: Validate that same K and wrong pitch is still a note regression
        run: |
          python -m py_compile scripts/s522_independent_compare_S519_S521_nested_14head_note_fusion.py
          python -m scripts.s522_independent_compare_S519_S521_nested_14head_note_fusion --self-test
      - name: Restore original eight authentic musical note truth and thirteen source heads
        run: |
          gh run download 38596480284 \
            -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table \
            -D model/S505 --repo "${{ github.repository }}"
      - name: Restore genuine frozen nested S519 neural attention and generator checkpoints
        run: |
          gh run download 38643896675 \
            -n s519-14head-true-S509-S516-nested-eight-recordingheld-trained-neural-MIDI-pitch-fusion \
            -D model/S519 --repo "${{ github.repository }}"
      - name: Restore S521 balanced training held predictions after their full training and artifact upload succeeds
        run: |
          for trial in $(seq 1 90); do
            if gh run download 38644423162 \
              -n s521-class-balanced-8-recording-held-14head-S509-S516-real-audio-neural-note-generator \
              -D model/S521 --repo "${{ github.repository }}"; then
              break
            fi
            if [ "$trial" -eq 90 ]; then
              echo 'No SHA-frozen balanced true neural training result; independent comparison blocked' >&2
              exit 1
            fi
            sleep 15
          done
      - name: Recompute named-note F1, missing fundamentals, per-K ExactK, correction and regression across both actual trained networks
        run: |
          python -u -m scripts.s522_independent_compare_S519_S521_nested_14head_note_fusion \
            --source model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --source-report model/S505/report.json \
            --r519 model/S519/report.json \
            --p519 model/S519/S519_TRUE_NESTED_OOF_NEURAL_14HEAD_AND_GENERATOR_PROBS.jsonl \
            --weights519 model/S519 \
            --r521 model/S521/report.json \
            --p521 model/S521/S521_TRUE_NESTED_OOF_NEURAL_14HEAD_AND_GENERATOR_PROBS.jsonl \
            --weights521 model/S521 --out model/S522
          python - <<'PY'
          import json
          z=json.load(open('model/S522/report.json'))
          assert z['status']=='S522_INDEPENDENT_TRUE_NOTE_S519_VS_S521_14HEAD_ATTENTION_AUDIT'
          assert z['eight_true_trained_S519_neural_and_acoustic_checkpoint_pairs_verified']
          assert z['eight_true_trained_S521_neural_and_acoustic_checkpoint_pairs_verified']
          assert z['every_genuinely_added_missing_note_and_false_addition_independently_counted']
          assert z['S521_informed_by_seen_S519_scores_so_NOT_prospective_blind']
          assert z['no_full_event_onset_F1_or_verified_negative_onsets']
          assert z['full_original_reference_S80_V88_Live_unchanged']
          assert z['no_promotion']
          print('S522 independently audited 32 actual trained checkpoints and every note regression on guitar and piano')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s522-independent-32-source-neural-checkpoints-balanced-note-detection-audit-S519-vs-S521
          path: model/S522/
          retention-days: 90
