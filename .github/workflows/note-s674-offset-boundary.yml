name: S674 causal per-note NoteOff hazard on real GuitarSet
on:
  push:
    branches: [codex/note-s674-offset-boundary-head]
    paths:
      - scripts/s674_true_noteoff_boundary_classifier.py
      - test/test_s674_offset_boundary.py
      - .github/workflows/note-s674-offset-boundary.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: note-s674-causal-offset-one
  cancel-in-progress: true
jobs:
  guitarset_noteoff_hazard:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original native NOTE runtime and supervised head
        run: |
          python -m pip install -r requirements-live-strict.txt
      - name: Compile and test S674 invariance
        run: |
          python -m compileall -q scripts/s674_true_noteoff_boundary_classifier.py test/test_s674_offset_boundary.py
          python -m unittest -v test.test_s674_offset_boundary
      - name: Evaluate past-only hazard versus identical NoteOn and K on 36 TRAIN and 12 DEV
        run: |
          python -m scripts.s674_true_noteoff_boundary_classifier --out /tmp/s674_hazard
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S674_CAUSAL_NOTEOFF_HAZARD_GUITARSET
          path: /tmp/s674_hazard/report.json
          if-no-files-found: warn
          retention-days: 60
