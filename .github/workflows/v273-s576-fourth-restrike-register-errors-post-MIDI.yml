name: S576 independently replay S575 actual five-composer NOTE_ON by register after frozen predictions
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s576_register_and_fast_restrike_audit_fourth_held_true_MIDI.py
      - .github/workflows/v273-s576-fourth-restrike-register-errors-post-MIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  restore_original_post_MIDI_sha_and_replay_all_note_counts_by_low_mid_high:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original source note and one-to-one MIDI matching
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test strict MIDI 40-88 note register and real repeated note ownership
        run: |
          python -m py_compile scripts/s576_register_and_fast_restrike_audit_fourth_held_true_MIDI.py
          python -m scripts.s576_register_and_fast_restrike_audit_fourth_held_true_MIDI --self-test
      - name: Restore exact initial new 5 composer metadata and six SHA-frozen pre-MIDI policies, do not retrain
        run: |
          gh run download 38670092733 -n s570-fourth-five-new-source-names-exclude23-previous-composer-components-NO-AUDIO-MIDI -D model/S570 --repo "${{ github.repository }}"
          gh run download 38670528441 -n s574-fourth-source-7-old-vs-restrike-52D-fitted-note-policies-SHA-frozen-BEFORE-MIDI -D model/S574 --repo "${{ github.repository }}"
          gh run download 38671119840 -n s575-fourth-new-composer-cohort-real-MIDI-source-verified-S569-temporal-vs-S562-physical34-NoteOn-F1 -D model/S575 --repo "${{ github.repository }}"
      - name: Independently reproduce all old source NoteOn scores by LOW/MID/HIGH register with real MIDI SHA proof
        run: |
          python -u -m scripts.s576_register_and_fast_restrike_audit_fourth_held_true_MIDI \
            --manifest model/S570/report.json --freeze-report model/S574/report.json \
            --score-report model/S575/report.json \
            --frozen-predictions model/S574/S574_FIVE_FULL_REAL_AUDIO_NAMED_NOTEON_7_POLICIES_PREMIDI.jsonl \
            --out model/S576
          python - <<'PY'
          import json
          r=json.load(open('model/S576/report.json'))
          assert r['status']=='S576_TRUE_INDEPENDENT_REGISTER_PITCH_NOTEON_CAUSES_POST_S575'
          assert r['all_register_counts_S575_independently_replayed_for_every_policy_tolerance']
          assert len(r['full_register_scores'])==7
          assert len(r['register_progress_and_remaining_errors'])==3
          assert r['measurements_are_POSTHOC_NOT_new_prospective_validation']
          assert r['no_promotion'] and r['cannot_promote_original_S80_or_ExactK_or_Live']
          print('S576 PASS independently verified all S575 real note-on F1 MIDI totals separately by register')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s576-five-NEW-S570-composers-causal-register-40-59-60-71-72-88-MIDI-pitch-audit
          path: model/S576/
          retention-days: 90
