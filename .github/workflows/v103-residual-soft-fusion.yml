name: V10.3 residual soft fusion

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v103_residual_soft_fusion.py'
      - '.github/workflows/v103-residual-soft-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  train-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V10 spectral caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v100-spectral-cache
          for shard in 0 1 2 3 4 5 6 7; do
            mkdir -p "model/v100-spectral-cache/$shard"
            gh run download 33605122369 --repo "$GITHUB_REPOSITORY" --name "v100-spectral-$shard" --dir "model/v100-spectral-cache/$shard"
          done
          test "$(find model/v100-spectral-cache -name 'v100-spectral-shard-*.npz' | wc -l)" -eq 8

      - name: Download frozen experts and proposal stack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v84 model/source-v86 model/source-v87 model/source-v88 model/source-v101 model/source-v102 /tmp/v103-artifacts
          download_artifact () {
            local id="$1"
            local dest="$2"
            local zip="/tmp/v103-artifacts/${id}.zip"
            gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$zip"
            unzip -q "$zip" -d "$dest"
          }
          download_artifact 9826945605 model/source-v84
          download_artifact 9830602382 model/source-v86
          download_artifact 9831120911 model/source-v87
          download_artifact 9831664553 model/source-v88
          download_artifact 9842799517 model/source-v101
          download_artifact 9845793222 model/source-v102
          test -f model/source-v101/v101-string-query-result/report.json
          test -f model/source-v101/v101-string-query-result/v101-string-query-attention.weights.h5
          test -f model/source-v102/v102-source-time-result/report.json
          test -f model/source-v102/v102-source-time-result/v102-source-time-assignment.weights.h5

      - name: Compile V10.3
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/train_v103_residual_soft_fusion.py

      - name: Run V10.3 clean disagreement audit, gate fit and locked12
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v103_residual_soft_fusion.py \
            --cache-dir model/v100-spectral-cache \
            --v101-weights model/source-v101/v101-string-query-result/v101-string-query-attention.weights.h5 \
            --v101-report model/source-v101/v101-string-query-result/report.json \
            --v102-weights model/source-v102/v102-source-time-result/v102-source-time-assignment.weights.h5 \
            --v102-report model/source-v102/v102-source-time-result/report.json \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --output-dir model/v103-residual-soft-fusion-result \
            2>&1 | tee model/v103-residual-soft-fusion.log

      - name: Verify V10.3 protocol and summarize
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v103-residual-soft-fusion-result/report.json').read_text())
          a=r['architecture']; c=r['configuration']; d=r['data']; l=r['locked12']
          assert a['experts_trainable'] is False
          assert a['hard_routing'] is False
          assert a['runtime_inputs_use_annotations'] is False
          assert a['offset_stream_executed'] is False
          assert a['offset_weights_modified'] is False
          assert a['cluster_window_ms'] == 40.0
          assert c['decode_mode_selected_on_locked_validation'] is False
          assert c['gate_fit_uses_locked12'] is False
          assert d['clean_common_holdout_group_count'] >= 3
          print('common_holdout_groups', d['clean_common_holdout_group_count'])
          print('gate_fit_clusters', d['gate_fit_cluster_count'])
          print('gate_params', a['gate_trainable_parameters'])
          print('v101', l['v101_metrics'])
          print('v102', l['v102_metrics'])
          print('v103', l['v103_metrics'])
          print('v103_cardinality', l['v103_cardinality'])
          print('v103_poly', l['v103_poly_by_k'])
          print('disagreement', l['disagreement'])
          print('alpha', l['alpha_mean'], l['alpha_median'], l['alpha_p90'])
          PY

      - name: Upload V10.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v103-residual-soft-fusion
          path: |
            model/v103-residual-soft-fusion.log
            model/v103-residual-soft-fusion-result/report.json
            model/v103-residual-soft-fusion-result/v103-residual-soft-fusion.weights.h5
            model/v103-residual-soft-fusion-result/v103-feature-scaler.npz
          if-no-files-found: error
          retention-days: 14
