name: S143 original S12 LOPO logistic checkpoints on real GOAT audio (research only)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s143_external_original_s12.py'
      - '.github/workflows/v273-s143-original-s12.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s143-original-S12-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s143_external_original_s12 --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853979683
          name: v273-series12-full-audio
          path: model/s12
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/s85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/s135
      - name: Check 19 original S12 saved trained LOPO models on new audio, no MIDI
        run: |
          set -euo pipefail
          S97="$(find model/s97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/s85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/s135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -u -m scripts.s143_external_original_s12 \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s12 model/s12 --out model/s143
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/s143/report.json'))
          assert r['GOAT_events']==57 and r['source_S12_model_count']>=15
          assert r['original_weights_and_scalers_unchanged']
          assert not r['true_S12_champion_reproduced'] and not r['S80_promoted']
          with np.load('model/s143/S12_original_logistic_risk_models_GOAT.npz',allow_pickle=False) as z:
              assert z['means'].shape==(57,7)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s143-original-S12-logistic-crosspiece-trained-models-GOAT
          path: model/s143/
          retention-days: 90
