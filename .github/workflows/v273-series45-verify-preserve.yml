name: V27.3 S45 verify and preserve learned compromise heads per family
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series45-verify-preserve.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm full S45 304-fit research run completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 37891039201 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
      - name: Install original native acoustic and crosspiece risk runtime
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve same native acoustic sequence and S18 untouched reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Retrieve all S45 trained family-specific heads and event outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37891039201 --repo "$GITHUB_REPOSITORY" --name v273-series45-specialized-risk-heads --dir model/S45
      - name: Replay all 304 models and 204 new selection policies using no ground truth
        run: >-
          python -m scripts.verify_v273_s45_specialized_risk_heads
          --features model/features
          --s18 model/S18/predictions.npz
          --input model/S45
          --output model/S45-verified
      - name: Publish complete per-family corrections and regressions
        run: cat model/S45/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series45-independent-verification
          path: model/S45-verified/
          retention-days: 90
      - name: Preserve all individual heads, corrections, regressions and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series45-specialized-heads.tar.gz -C model S45 S45-verified
          (cd model/archive && sha256sum v273-series45-specialized-heads.tar.gz > SHA256SUMS)
          gh release create "v273-series45-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series45-specialized-heads.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S45 piece-held compromise heads for 16 historical families ${GITHUB_RUN_ID}" \
            --notes "304 held-piece models learning correction vs regression risk separately for 16 source families, 192 per-family gates and 12 cross-family arbitration policies, all K0-6 corrections/regressions saved. H9 excluded. Historical source selection biased by same development cohort; no promotion."
