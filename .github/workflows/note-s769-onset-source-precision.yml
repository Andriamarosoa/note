name: S769 independent source Onset FP veto FIT80 and GuitarSet CAL32
on:
  push:
    branches: [codex/note-s769-onset-source-precision-80]
    paths:
      - scripts/s769_source_onset_precision_fit80.py
      - test/test_s769_source_onset_precision.py
      - .github/workflows/note-s769-onset-source-precision.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s769-source-onset-precision
  cancel-in-progress: true
jobs:
  independent_source_onset_quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen signed NOTE runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate true causal source Onset classifier, isolation and temporal firewall
        run: |
          python -m compileall -q scripts/s769_source_onset_precision_fit80.py
          python -m unittest -v \
            test.test_s763_independent_decoders \
            test.test_s768_independent_onset_lattice \
            test.test_s769_source_onset_precision
      - name: Download frozen S708/S707 signed artifacts
        run: |
          mkdir -p /tmp/s769/s708 /tmp/s769/s707
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s769/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s769/s707
          test -s /tmp/s769/s708/report.json
          test -s /tmp/s769/s708/s708_selected.pt
          test -s /tmp/s769/s707/s675_hazard.joblib
      - name: FIT80 five-composition source-Onset FP learner then CAL32 frozen threshold
        run: |
          python -m scripts.s769_source_onset_precision_fit80 \
            --s708-dir /tmp/s769/s708 \
            --offset-checkpoint /tmp/s769/s707/s675_hazard.joblib \
            --out /tmp/s769/report
      - name: Check six-score signed parity and shadow-only F1 success honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/s769/report/report.json").read_text())
          assert j["schema"]=="S769_FIT80_SOURCE_ONSET_PRECISION_VETO"
          assert j["complete"] and j["source_reference_parity"]["valid"]
          assert j["fit_recordings_done"]==80 and j["cal_recordings_done"]==32
          assert j["ONSET_only_not_MIDI"] and j["source_midi_immutable"]
          assert not j["promoted"] and j["selected"]=="S708_frozen"
          assert not j["LIVE_changed"] and not j["TEST_opened"] and not j["HELD_opened"]
          assert len(j["FIT"]["folds"])==5
          assert len(j["FIT"]["thresholds"])==11
          assert len(j["CAL"]["precision_veto"])==11
          assert j["CAL"]["frozen_risk_over_80"]==(
              j["CAL"]["frozen_score"]["f1"]>.8)
          print("S769_INDEPENDENT_SOURCE_FP_SHADOW",json.dumps({
              "source":j["source"],"fit":j["FIT"],"cal":j["CAL"]}))
          PY
      - name: Publish full independent source quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S769_ONSET_PRECISION_FIT80_CAL32
          path: /tmp/s769/report/report.json
          retention-days: 45
          if-no-files-found: warn
