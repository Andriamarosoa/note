name: "S628 real audio 5ms future configurable NOTE ablation"
on:
  push:
    branches: [codex/note-s628-lookahead-5ms-ablation]
    paths:
      - '.github/workflows/note-s628-real-future-lookahead.yml'
      - 'src/causal_note/lookahead.py'
      - 'test/test_s628_true_audio_lookahead.py'
      - 'scripts/s628_evaluate_audio_lookahead.py'
      - 'scripts/live_strict_notes.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s628-real-5ms-future-${{ github.ref }}
  cancel-in-progress: true
jobs:
  future-causal-acoustics:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native NOTE neural + ONNX inference dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Run actual lookahead safety tests including causal future corruption and absolute emission times
        run: |
          python -m compileall -q src/causal_note/lookahead.py scripts/s628_evaluate_audio_lookahead.py test/test_s628_true_audio_lookahead.py
          python -m unittest -v test.test_s628_true_audio_lookahead test.test_s627_multidimensional_failure_audit
      - name: Download original 17 GuitarSet and URMP DEV composition recordings only
        run: |
          python -m scripts.s615_seed_full_development --root data/S628_dev --dev-only
      - name: Extract original native hop256 spectral heads for 17 source-disjoint DEV songs
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.s615_prepare_multihop import prepare_one
          import json
          root=Path('data/S628_dev')
          dev=[s for s in json.loads((root/'protocol.json').read_text())['sources'] if s['split']=='dev']
          assert len(dev)==17
          for i,s in enumerate(dev,1):
              print(i,prepare_one(root,s,256),flush=True)
          PY
      - name: Evaluate physically observed 2.5/5/10ms future vs delayed-only and zero-lookahead S613
        run: |
          python -m scripts.s628_evaluate_audio_lookahead \
            --root data/S628_dev \
            --model model/live/strict_note/NOTE_strict_live.npz \
            --out results/S628_REAL_5MS_FUTURE_NOTEON_K.json
      - name: Confirm baseline identity and future data availability, show 5ms variants K1-K6
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('results/S628_REAL_5MS_FUTURE_NOTEON_K.json').read_text())
          assert r['status']=='S628_5MS_LOOKAHEAD_DEV_ONLY_NO_PROMOTION'
          assert r['no_future_before_arrival'] and r['test_sources_read']==0
          b=r['frozen_s613_hybrid_reference']
          assert (b['TP'],b['FP'],b['FN'])==(1241,734,838)
          assert len(r['experiments'])==15
          for row in r['experiments']:
              assert row['TP']-1241==(row['recovered_missed_truth']-row['lost_previously_correct_truth'])
              if row['requested_lookahead_ms']==5.:
                  print('S628_5MS',json.dumps(dict(
                      mode=row['mode'],F1=row['F1'],
                      TP=row['TP'],FP=row['FP'],FN=row['FN'],
                      newly_recovered_TP=row['recovered_missed_truth'],
                      lost_existing_TP=row['lost_previously_correct_truth'],
                      K3=row['grouped_onset_K'].get('3'),
                      K4=row['grouped_onset_K'].get('4'))))
          print('S628_BEST',json.dumps(r['best_dev_f1']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s628-original-S613-real-future-5ms-frozen-head-17dev
          path: results/S628_REAL_5MS_FUTURE_NOTEON_K.json
          retention-days: 45
