name: V27.3 Group-Debiased Exact-K A/B

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-group-debiased-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-group-debiased-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  EXPERIMENT_TAG: v273-group-debiased-${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Validate treatment contract
        run: |
          python -m py_compile scripts/train_v273_group_debiased_ab.py
          python - <<'PY'
          import numpy as np
          from scripts.train_v273_group_debiased_ab import build_model, weight_hash
          seed=16061+1003
          a=build_model('baseline',seed)
          b=build_model('group_debiased',seed)
          assert weight_hash(a)==weight_hash(b)
          pa=sum(int(np.prod(v.shape)) for v in a.trainable_variables)
          pb=sum(int(np.prod(v.shape)) for v in b.trainable_variables)
          assert pa==pb
          assert [x.name.split(':')[0] for x in a.inputs]==[x.name.split(':')[0] for x in b.inputs]
          print({'initial_weight_hash':weight_hash(a),'trainable_params':pa})
          PY
      - name: Freeze protocol release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$EXPERIMENT_TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "V27.3 Group-Debiased Exact-K A/B" \
            --notes "Matched fold-3 A/B. Baseline versus removal of V8.8 router/local-cardinality pseudo-count interface. Fixed 31 frames, uniform weighting, seed/order, 8 epochs. No automatic promotion."

  train:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Restore frozen shared bundle and Cluster A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/cluster
          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-failure-clustering-36999901054 \
            --repo "${{ github.repository }}" \
            --pattern v273-failure-clustering-rows.csv \
            --dir model/cluster

          test -f model/bundle/bundle.json
          test -f model/cluster/v273-failure-clustering-rows.csv

      - name: Train matched baseline and Group-Debiased arms
        run: |
          python -B scripts/train_v273_group_debiased_ab.py \
            --bundle model/bundle \
            --config analysis/v273-native-paired-config.json \
            --cluster-rows model/cluster/v273-failure-clustering-rows.csv \
            --output model/result

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d model/result ]; then
            tar -czf model/v273-group-debiased-result.tgz -C model/result .
            gh release upload "$EXPERIMENT_TAG" model/v273-group-debiased-result.tgz --repo "${{ github.repository }}" --clobber || true
            if [ -f model/result/report.md ]; then
              gh release edit "$EXPERIMENT_TAG" --repo "${{ github.repository }}" --notes-file model/result/report.md || true
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-group-debiased-result
          path: model/result/
          if-no-files-found: warn
          retention-days: 90
