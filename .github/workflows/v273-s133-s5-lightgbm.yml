name: S133 LightGBM original S5 teacher distillation (research only)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s133_s5_lightgbm_teacher_student.py'
      - '.github/workflows/v273-s133-s5-lightgbm.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s133-teacher-student-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 lightgbm==4.6.0
      - run: python -m scripts.s133_s5_lightgbm_teacher_student --self-test
      - name: Restore original SHA-verified S5 fold posteriors
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          for FOLD in 0 1 2 4; do
            git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/report.json" \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/predictions.npz" | tar -x -C model/history
          done
      - name: Original GuitarSet fold0
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/features/fold0
      - name: Original GuitarSet fold1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/features/fold1
      - name: Original GuitarSet fold2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/features/fold2
      - name: Original GuitarSet fold4
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/features/fold4
      - name: GOAT native 111D control features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38184381730
          name: v273-s116-original-S4-control111-GOAT
          path: model/s116
      - name: GOAT native 245D flow
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - name: Frozen S129 heldout teacher baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38188446402
          name: v273-s129-new-s5-student111-goat-blind
          path: model/s129
      - name: Fit two students, audit heldout teacher and predict GOAT label-blind
        run: |
          set -euo pipefail
          S116="$(find model/s116 -name external_s4_control111.npz -print -quit)"
          S97="$(find model/s97 -name original_s45_audio_only.npz -print -quit)"
          S129="$(find model/s129 -name held_fold0_teacher_fidelity.npz -print -quit)"
          test -s "$S116" && test -s "$S97" && test -s "$S129"
          python -u -m scripts.s133_s5_lightgbm_teacher_student \
            --features-root model/features \
            --teacher-root model/history/analysis/evidence/v273-open-k0-k6/series5/models \
            --s116 "$S116" --s97 "$S97" --s129 "$S129" --out model/s133
          python - <<'PY'
          import json
          r=json.load(open('model/s133/report.json'))
          assert r["heldout_rows"]==15952 and r["GOAT_new_wave_events"]==57
          assert not r["historical_true_K_read"] and not r["external_MIDI_labels_read"]
          assert not r["original_S5_527D_reproduced"] and not r["S80_promoted"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s133-two-lightgbm-S5-teacher-students
          path: model/s133/
          retention-days: 30
