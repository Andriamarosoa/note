name: S371 exposed two-cohort K3-protect deterministic ablation vs lost true K2 corrections
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s371_exposed_K3_protection_vs_K2_regression_ablation.py'
      - '.github/workflows/v273-s371-exposed-K3-guard-K2-loss-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s371-old-36-wav-K3-K2-ablation-no-training
  cancel-in-progress: true
jobs:
  loss_ledger_K3_k2_parent_guard_counterfactual_without_any_fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Download 12 plus 24 original fourfold S18 training checkpoint outputs from PRELABEL runs
        run: |
          gh run download 38327334843 \
            -n chords-477-S338-S339-source -D model/first_parent --repo ${{ github.repository }}
          gh run download 38331203079 \
            -n chords-967-S338-S339-source -D model/second_parent --repo ${{ github.repository }}
      - name: Restore XML ground truth ALREADY opened postfrozen to measure ONLY this ablation (NO new performance claim)
        run: |
          gh run download 38327717118 \
            -n s354-PROSPECTIVE-IDMT-dataset1-12chords-477-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/first_true --repo ${{ github.repository }}
          gh run download 38331684749 \
            -n s363-PROSPECTIVE-IDMT-dataset1-24chords-967-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/second_true --repo ${{ github.repository }}
      - name: Quantify actual lost K2 corrections if restoring incumbent K3 when all S18 disagree, no new head or tuned policy
        run: |
          python -u -m scripts.s371_exposed_K3_protection_vs_K2_regression_ablation \
            --s18first model/first_parent/S338/S338_original_S18_foldneutral_477_IDMT.npz \
            --labfirst model/first_true/S354_postfrozen_477_two_distinct_protocols.npz \
            --s18second model/second_parent/S338/S338_original_S18_foldneutral_967_IDMT.npz \
            --labsecond model/second_true/S363_postfrozen_967_two_distinct_protocols.npz \
            --out model/S371
          python - <<'PY'
          import json
          r=json.load(open('model/S371/report.json'))
          assert r['original_native_events']==1444 and r['original_wavs']==36
          assert r['trigger_sample_total']==sum(x['trigger_count'] for x in r['each_original_cohort'])
          assert r['trueK_histogram_of_triggered_events'][3]>=6
          assert r['validation_xml_previously_exposed'] and not r['official_S80_promotion']
          assert not r['any_new_training']
          print('S371 PASS K3 rescue versus K2 regression quantified on old data only - NOT VALIDATION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s371-exposed-36WAV-K3-baseline-protect-ablative-K2-loss-only
          path: model/S371/
          retention-days: 90
