name: "S629 low-CPU 5-10ms shared-hop accuracy vs frozen S613"
on:
  push:
    branches: [codex/note-s629-shared-hop-lowcpu-lookahead]
    paths:
      - '.github/workflows/note-s629-original-data-dev-eval.yml'
      - 'scripts/s629_evaluate_shared_lookahead.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-17-dev-labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact frozen original hybrid inference libraries
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Verify conditional future head combination and no backdating
        run: |
          python -m unittest -v test.test_s629_shared_hop_lookahead test.test_s628_true_audio_lookahead
      - name: Seed 17 source-disjoint DEV GuitarSet and URMP recordings only
        run: |
          python -m scripts.s615_seed_full_development --root data/S629_dev --dev-only
      - name: Build original strictly-causal 256-hop reference acoustics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.s615_prepare_multihop import prepare_one
          root=Path('data/S629_dev')
          dev=[s for s in json.loads((root/'protocol.json').read_text())['sources'] if s['split']=='dev']
          assert len(dev)==17
          for i,s in enumerate(dev,1):
              print(i,prepare_one(root,s,256),flush=True)
          PY
      - name: Compare one-pass 5.80 and 11.61ms native future, 5 fusion modes, original S613 and K3/K4
        run: |
          python -m scripts.s629_evaluate_shared_lookahead \
            --root data/S629_dev \
            --model model/live/strict_note/NOTE_strict_live.npz \
            --out results/S629_REAL_SHARED_LOOKAHEAD_DEV.json
      - name: Verify frozen original NoteOn baseline and all ten configured conditions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/S629_REAL_SHARED_LOOKAHEAD_DEV.json').read_text())
          assert x['status']=='S629_DEV_ONLY_SHARED_LOOKAHEAD_NO_PROMOTION'
          assert x['source_dev_count']==17 and x['test_sources_read']==0
          assert (x['frozen_original']['TP'],x['frozen_original']['FP'],x['frozen_original']['FN'])==(1241,734,838)
          assert len(x['all_trials'])==10
          for row in x['all_trials']:
              assert row['recovered_old_misses']-row['lost_previously_correct']==row['TP']-1241
              print('VERIFIED_S629_TRIAL '+json.dumps(dict(
                  requested_ms=row['requested_ms'],effective_ms=row['effective_ms'],
                  mode=row['mode'],TP=row['TP'],FP=row['FP'],FN=row['FN'],F1=row['F1'],
                  recovered=row['recovered_old_misses'],lost=row['lost_previously_correct'],
                  K3=row['grouped_onset_K_by_true'].get('3'),
                  K4=row['grouped_onset_K_by_true'].get('4')
              )))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s629-frozen-S613-shared-future-original-17dev-scores
          path: results/S629_REAL_SHARED_LOOKAHEAD_DEV.json
          retention-days: 45
