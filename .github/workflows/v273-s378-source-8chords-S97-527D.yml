name: S378 24-WAV faithful-rebase S334 S335 genuine original S97 and 527D S5 features on frozen 255 Dataset1 chords PREXML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s334_original_dataset1_S97_255.py'
      - 'scripts/s335_original_S5_527D_dataset1_255.py'
      - '.github/workflows/v273-s378-source-8chords-S97-527D.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s378-genuine-255-original-native-audio
  cancel-in-progress: true
jobs:
  original_255_native_audio_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore hashed generated S359 faithful ORIGINAL S80 source stage implementations
        run: |
          gh run download 38335633796 \
            -n s377-20-genuine-original-S5-to-S80-modules-on-255-last8-WAVs-ABIs-PREXML \
            -D model/S377 --repo ${{ github.repository }}
          for file in model/S377/*.py; do cp "$file" "scripts/$(basename "$file" | sed 's/_477/_255/g')"; done
          test -s scripts/s334_original_dataset1_S97_255.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore 8 original V88 native IDMT chord WAV output SHA already frozen BEFORE XML
        run: |
          gh run download 38335062261 \
            -n s374-last8-IDMT-source-only-true-original-V88-official-PREXML \
            -D model/S374 --repo ${{ github.repository }}
          gh run download 38334876066 \
            -n s372-prospective-last8-original-IDMT-Dataset1-WAV-XML-NAMES-UNOPENED \
            -D model/S372 --repo ${{ github.repository }}
      - name: Build source-only original S97 acoustics on exact 255 original V88 events
        run: |
          python -u -m scripts.s334_original_dataset1_S97_255 \
            --s332 model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz \
            --s332report model/S374/report.json \
            --s276 model/S372/report.json \
            --out model/S334
      - name: Build untouched original 527D S5 and PR16 46D source feature contract on same native event IDs
        run: |
          python -u -m scripts.s335_original_S5_527D_dataset1_255 \
            --s334 model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s332 model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz \
            --out model/S335
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S334/report.json'))
          b=json.load(open('model/S335/report.json'))
          assert a['events']==b['native_events']==255 and a['WAV_count']==b['WAV_count']==8
          assert not a['annotation_XML_MIDI_read'] and not b['independent_ExactK_measured']
          with np.load('model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(255,58)
            assert z['sequence42x49'].shape==(255,42,49)
          with np.load('model/S335/S335_IDMT_dataset1_true_original_S5_527D_input.npz',allow_pickle=False) as z:
            assert z['original_S5_input_owned527'].shape==(255,527)
          print('S334/S335 PASS original 8 chord WAV features, no XML')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s334-s335-8-IDMT-dataset1-chords-255-original-S97-527D-PREXML
          path: |
            model/S334/
            model/S335/
          retention-days: 90
