name: S648 genuine causal event-birth TRAIN calibration DEV
on:
  push:
    branches: [codex/s648-causal-event-birth-head]
    paths:
      - src/causal_note/s648_event_birth.py
      - scripts/s648_train_birth_event.py
      - test/test_s648_event_birth.py
      - .github/workflows/v273-s648-actual-train-birth-head.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s648-causal-event-birth
  cancel-in-progress: false
jobs:
  fit_train_calibrate_train_then_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install unchanged S614 original CPU requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Causality, original S614 equivalence, one-birth-per-frame tests
        run: |
          python -m compileall -q src/causal_note/s648_event_birth.py scripts/s648_train_birth_event.py
          python -m unittest -v test.test_s648_event_birth test.test_strict_live
      - name: Train born-event model ONLY on fit subset of TRAIN, calibrate on heldout TRAIN, then evaluate DEV
        run: |
          python -u -m scripts.s648_train_birth_event --out /tmp/S648
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S648-trained-event-birth-FIT-CALIB-DEV-model-report
          path: /tmp/S648/
          if-no-files-found: warn
          retention-days: 60
