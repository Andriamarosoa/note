name: V27 class-conditional count fusion

on:
  push:
    branches: [v270-class-conditional-count-fusion]
    paths:
      - 'scripts/audit_v270_class_conditional_fusion.py'
      - 'test/test_v270_class_conditional_fusion.py'
      - 'analysis/v270-class-conditional-fusion-protocol.md'
      - '.github/workflows/v270-class-conditional-count-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TF_CPP_MIN_LOG_LEVEL: '2'
  PYTHONPATH: '.:src'
  V104_NESTED_RUN: '33647694565'
  V111_AUDIT_RUN: '33664141756'
  V260_RUN: '34201830555'

jobs:
  audit:
    name: Frozen low-K fusion audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: python -m pip install -r requirements-train.txt

      - name: Verify immutable source runs
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              [Number(process.env.V104_NESTED_RUN), '345dea1e92f6281583c58590a0b1286ce4df459b'],
              [Number(process.env.V111_AUDIT_RUN), '91717bb8fc0381ce91d807aacfa910fb8a7b1355'],
              [Number(process.env.V260_RUN), '5f41972a6e2f081d6f2ad652beae31dfff9f0076'],
            ];
            for (const [run_id, sha] of sources) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
              });
              if (run.head_sha !== sha || run.conclusion !== 'success') {
                throw new Error(`invalid source run ${run_id}`);
              }
            }

      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v260-verified-guitarset
          path: data/GuitarSet
          repository: Andriamarosoa/note
          run-id: ${{ env.V260_RUN }}
          github-token: ${{ github.token }}

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen nested spectral cache
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.V104_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen V10.4 outer-clean predictions
        uses: actions/download-artifact@v4
        with:
          name: v111-nested-outer-clean-audit
          path: model/v111-source
          repository: Andriamarosoa/note
          run-id: ${{ env.V111_AUDIT_RUN }}
          github-token: ${{ github.token }}

      - name: Download all V26 fold predictions
        uses: actions/download-artifact@v4
        with:
          pattern: v260-count-pair-fold-*
          path: model/v260-source
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.V260_RUN }}
          github-token: ${{ github.token }}

      - name: Compile and test the fixed rules
        run: |
          python -m py_compile scripts/audit_v270_class_conditional_fusion.py
          python -m unittest test.test_v270_class_conditional_fusion -v

      - name: Evaluate both frozen fusion rules
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/audit_v270_class_conditional_fusion.py \
            --dataset-dir data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --v111-dir model/v111-source \
            --v260-dir model/v260-source \
            --output-dir model/v270-class-conditional-fusion \
            2>&1 | tee model/v270-class-conditional-fusion.log

      - name: Verify provenance and structural guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('model/v270-class-conditional-fusion/report.json').read_text())
          protocol = report['protocol']
          assert protocol['experiment'] == 'v270_class_conditional_count_fusion'
          assert protocol['trainable_parameters'] == 0
          assert protocol['outer_labels_used_by_fusion_rules'] is False
          assert protocol['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert protocol['automatic_promotion'] is False
          baseline = report['cardinality']['v104']['poly_correct']
          assert report['cardinality']['null_veto']['poly_correct'] >= baseline
          assert report['cardinality']['low_k_fusion']['poly_correct'] >= baseline
          for name in ('v104', 'v260_uniform', 'null_veto', 'low_k_fusion'):
              card = report['cardinality'][name]
              event = report['event_metrics'][name]['global']
              print(name, 'exact_k', card['exact'], 'poly_exact_k', card['poly_exact'],
                    'f1', event['f1'], 'tp/fp/fn', event['true_positive'],
                    event['false_positive'], event['false_negative'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v270-class-conditional-count-fusion
          path: |
            model/v270-class-conditional-fusion.log
            model/v270-class-conditional-fusion
          if-no-files-found: warn
          retention-days: 90
