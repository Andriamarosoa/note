name: S101 original S38 S40 S41 saved checkpoint census
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s101_neural_checkpoint_census.py'
      - '.github/workflows/v273-s101-checkpoint-census.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880386031
          name: v273-series38-poly-harmonic-expert
          path: model/source/S38
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880762289
          name: v273-series40-temporal-cnn
          path: model/source/S40
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37881191015
          name: v273-series41-six-head-neural-fusion
          path: model/source/S41
      - name: Verify 16 plus 4 plus 19 original saved models
        run: python scripts/s101_neural_checkpoint_census.py --root model/source --out model/s101/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s101-original-neural-checkpoint-census
          path: model/s101/report.json
