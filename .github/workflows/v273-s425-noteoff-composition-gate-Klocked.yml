name: S425 native MIDI note-off disagreement audit vs S422 preserving S80 K
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s425_songheld_select_S422_S420_offsets_no_K_regression.py'
      - '.github/workflows/v273-s425-noteoff-composition-gate-Klocked.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s425-native-NoteOff-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train_held_composition_noteoff_gate_with_frozen_MIDI_outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numpy and sklearn dependencies, no external teacher
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify source script and note evaluation synthetic test
        run: |
          python -m py_compile scripts/s425_songheld_select_S422_S420_offsets_no_K_regression.py
          python -m scripts.s425_songheld_select_S422_S420_offsets_no_K_regression --self-test
      - name: Download previously FROZEN S420 native MIDI pitches/onsets/offsets
        run: |
          gh run download 38384016298 -n s420-native-S419-S417-full-MIDI-onset-offset-59309-S80-K-locked -D model/S420 --repo ${{ github.repository }}
          test -f model/S420/S420_original_K_NATIVE_full_notes_33475.npz
      - name: Download previously FROZEN S422 full WAV survival NoteOff challenger
        run: |
          gh run download 38394264593 -n s422-native-5s-WAV-pitch-survival-S80-ExactK-LOCKED-note-offsets -D model/S422 --repo ${{ github.repository }}
          test -f model/S422/S422_NATIVE_pitch_survival_full_MIDI_note_offsets.npz
      - name: Restore ORIGINAL S80 development reference 59309 event predictions unchanged
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
          test -f model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz
      - name: Retrieve verified GuitarSet JAMS labels for TRAIN-ONLY group selection and final scoring
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Train composition-only conservative note-off selection per actual MIDI note and preserve every S80 K
        run: |
          python -u -m scripts.s425_songheld_select_S422_S420_offsets_no_K_regression \
            --s420 model/S420/S420_original_K_NATIVE_full_notes_33475.npz \
            --s422 model/S422/S422_NATIVE_pitch_survival_full_MIDI_note_offsets.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S425
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S425/report.json'))
          assert d['status']=='S425_TRAIN_ONLY_DISAGREEMENT_GATE_S80_EXACTK_LOCKED'
          assert d['exactK_regressions']==0
          assert d['independent_exported_JSONL_exactK_replay']
          assert d['original_K_event_groups']==59309 and d['emitted_new_notes']==33475
          assert d['exact_K_global_correct_original']==d['exact_K_global_correct_S425']==53529
          assert d['exact_K_poly_correct_original']==d['exact_K_poly_correct_S425']==6054
          assert d['correct_pitch_and_onset_original']==25395
          assert d['metrics']['S420']['correct_offsets_conditional_on_matched_pitch_onset']==16140
          assert d['metrics']['S422']['correct_offsets_conditional_on_matched_pitch_onset']==16340
          assert all(f['composition_overlap']==0 for f in d['fold_training_audits'])
          assert d['no_official_promotion']
          with np.load('model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz') as f:
            assert len(f['original_S80_row_id'])==59309 and len(f['MIDI'])==33475
            assert np.all(f['S425_offset_samples']>f['onset_samples'])
          print('S425 validated full MIDI note comparison; zero Exact K regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions
          path: model/S425/
          retention-days: 90
