name: S618 learned native attack head train and development loop
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s618_attack_head.py
      - scripts/s618_train_dev.py
      - test/test_s618_attack_head.py
      - .github/workflows/v273-s618-native-attack-head.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s618-native-attack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  train_and_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original NOTE runtime, no foreign recognition weights
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scipy==1.14.1
      - name: Compile and verify new causal head and original untouched selection
        run: |
          python -m compileall -q src/causal_note/s618_attack_head.py scripts/s618_train_dev.py
          python -m unittest -v test.test_s618_attack_head test.test_strict_live test.test_s616_live_guard
      - name: Train only on 17 source train URMP titles, evaluate on 5 dev titles
        run: python -m scripts.s618_train_dev --out /tmp/S618
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S618-native-learned-attack-head-URMP-train-dev
          path: /tmp/S618/
          if-no-files-found: warn
          retention-days: 60
