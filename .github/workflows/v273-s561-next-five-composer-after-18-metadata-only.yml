name: S561 metadata-only next five composers excluding ALL 13 prior exposed audio sources before any WAV or MIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s561_preregister_further_source_composers_excluding_18_metadata_only.py
      - .github/workflows/v273-s561-next-five-composer-after-18-metadata-only.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  preregister_five_future_source_validation_pieces_from_original_maestro_metadata_ONLY:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prove composer-compound exclusion and determinism with no audio or MIDI
        run: |
          python -m py_compile scripts/s561_preregister_further_source_composers_excluding_18_metadata_only.py
          python -m scripts.s561_preregister_further_source_composers_excluding_18_metadata_only --self-test
      - name: Restore only original fixed metadata manifests, no labels and no WAV allowed in job
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38658066587 -n s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY -D model/S545 --repo "${{ github.repository }}"
          gh run download 38663678664 -n s554-next-five-metadata-only-composer-component-disjoint-before-new-model-noteon-validation -D model/S554 --repo "${{ github.repository }}"
      - name: Five brand new S561 composer names and WAV paths sealed using only public SHA-pinned CSV
        run: |
          python -u -m scripts.s561_preregister_further_source_composers_excluding_18_metadata_only \
            --old model/S469/report.json --new model/S537/report.json \
            --prior model/S545/report.json --last model/S554/report.json --out model/S561
          python - <<'PY'
          import json
          r=json.load(open('model/S561/report.json'))
          assert r['status']=='S561_PREREGISTERED_FIVE_MORE_TRAIN_SPLIT_COMPOSERS_AFTER_S544_NO_WAV_MIDI'
          assert r['five_next_distinct_composers']==5
          assert r['original_previous_S469_3_S537_5_S545_5_S554_5_component_excluded']
          assert r['co_composer_COMPONENTS_fully_excluded_and_pairwise_disjoint']
          assert r['MAESTRO_original_split_used']=='train'
          assert r['source_MIDI_files_not_read'] and r['source_WAV_files_not_read']
          assert r['no_promotion'] and r['original_reference_S80_ExactK_Live_untouched']
          print('S561 TRUE NEW DATA ONLY metadata preregistered, NO source WAV/MIDI opened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s561-next-5-component-disjoint-music-after-18-exposed-METADATA-ONLY
          path: model/S561/report.json
          retention-days: 90
