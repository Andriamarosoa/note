name: S775 native audio FFT and posterior cross-worker reproducibility
on:
  push:
    branches: [codex/note-s775-native-front-end-repro]
    paths:
      - scripts/s775_native_frontend_repro.py
      - .github/workflows/note-s775-front-end-repro.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  locate:
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test and restore frozen offset model
        run: |
          python -m compileall -q scripts/s775_native_frontend_repro.py
          python -m unittest -v test.test_s773_causal_repro_by_stage
          mkdir -p /tmp/s775/s707
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s775/s707
          test -s /tmp/s775/s707/s675_hazard.joblib
      - name: Audit raw WAV vs native FFT features vs native posterior vs sharp harmonic
        run: |
          python -m scripts.s775_native_frontend_repro \
            --offset-checkpoint /tmp/s775/s707/s675_hazard.joblib \
            --threads ${{ matrix.threads }} \
            --out /tmp/s775/report
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s775/report/report.json'))
          assert r['complete'] and len(r['records'])==2
          assert not r['labels_used'] and not r['promoted'] and r['source_MIDI_untouched']
          assert all(set(x['stages'])=={'raw_audio','native_FFT_features','native_pitch_post','native_K_post','sharp_harmonic','decision_ends'} for x in r['records'])
          print('S775_FRONTEND_HASHES_RECORDED')
          PY
      - name: Preserve forensic stage hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S775_NATIVE_FRONTEND_THREADS_${{ matrix.threads }}
          path: /tmp/s775/report/report.json
          retention-days: 45
          if-no-files-found: warn
