name: S98 original S45 family provenance (label blind)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s98_s45_original_family_provenance.py'
      - '.github/workflows/v273-s98-s45-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37890613101
          name: v273-series44-per-family-compromises
          path: model/s44
      - run: python scripts/s98_s45_original_family_provenance.py --s44-report model/s44/report.json --output model/s98/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v273-s98-original-family-provenance
          path: model/s98/report.json
          retention-days: 90
