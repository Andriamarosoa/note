name: S458 learn physical acoustic 1098D source K0 K6 on GuitarSet song-held NO S80 promotion
on:
  push:
    branches: [codex/s458-K-blind-acoustic-ablation]
    paths:
      - 'scripts/s458_train_independent_audio_only_K_blind_songheld.py'
      - '.github/workflows/v273-s458-K-blind-acoustic-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s458-acoustic-K-songheld-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_song_group_train_only_new_K0_K6_acoustic_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original pinned sklearn numpy acoustic ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Selftest physical real event features, K candidate and abstention
        run: |
          python -m py_compile scripts/s458_train_independent_audio_only_K_blind_songheld.py
          python -m scripts.s458_train_independent_audio_only_K_blind_songheld --self-test
      - name: Restore original true GuitarSet 59309 V88 acoustics and isolated training annotations
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          test -f model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz
          test -f model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz
      - name: Restore original S80 complete 59309 predicted K, NOT the edited K5 candidate
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
          test -f model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz
      - name: 'Train only GuitarSet: four song-held multiclass K heads and inner label-blind composition groups'
        run: |
          python -u -m scripts.s458_train_independent_audio_only_K_blind_songheld \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --out model/S458
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S458/report.json'))
          assert r['status']=='S458_REAL_ACOUSTIC_1098D_COMP_DISJOINT_K0_K6_CANDIDATE'
          assert r['original_K_reference_guitarset_global']==53529
          assert r['original_K_reference_guitarset_poly']==6054
          assert r['real_source_N']==59309
          assert len(r['all_model_folds'])==4
          assert all(f['train_held_song_overlap']==0 and f['held_labels_not_used_for_model_or_gate']
                     for f in r['all_model_folds'])
          assert r['original_S80_changed_or_promoted'] is False
          assert r['no_external_IDMT_labels_or_weights'] and r['source_K_not_a_network_feature']
          assert r['no_promotion']
          with np.load('model/S458/S458_K_CANDIDATE_GUITARSET_OOF_ONLY.npz') as z:
            assert len(z['row_id'])==59309
            assert np.isin(z['original_source_S80_K'],range(7)).all()
            assert np.isin(z['S458_candidate_K'],range(7)).all()
          print('S458 composition-held GuitarSet train dev complete; official original S80 preserved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s458-new-acoustic-1098D-K-head-GuitarSet-songheld-train-only-S80-NOPROMOTION
          path: model/S458/
          retention-days: 90
