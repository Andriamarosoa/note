name: V27.3 S36b independent proof and permanent archive
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series36b-verify.yml'
      - 'scripts/verify_v273_s36b_risk.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable 38 Q-model replay dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0 joblib==1.4.2
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recover original music signal events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Retrieve conservative S18 complete S35 and S36b trained risk heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37868356632 --repo "$GITHUB_REPOSITORY" --name v273-series35-extended-head-router --dir model/S35
          gh run download 37869664139 --repo "$GITHUB_REPOSITORY" --name v273-series36b-risk-judge --dir model/S36b
      - name: Independently re-evaluate every learned model and compare every event decision
        run: >-
          python -m scripts.verify_v273_s36b_risk
          --features model/features
          --s18 model/S18/predictions.npz
          --s35 model/S35/predictions.npz
          --routes model/S35/routing.npz
          --input model/S36b
          --output model/S36b-verified
      - name: Publish independently replayed evidence
        run: cat model/S36b-verified/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series36b-verified
          path: model/S36b-verified/
          retention-days: 90
      - name: Preserve positive 2 correction/zero regression and ALL alternative policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series36b-research.tar.gz -C model S36b S36b-verified
          (cd model/archive && sha256sum v273-series36b-research.tar.gz > SHA256SUMS)
          gh release create "v273-series36b-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series36b-research.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S36b poly risk evidence ${GITHUB_RUN_ID}" \
            --notes "38 piece-held risk gate weights, original 18-head S35 outputs and 36 policies, all corrected/regressed cases, independently replayed 2 new corrections and 0 regressions on the exposed development cohort. H9 excluded. No production promotion or unseen-music validation."
