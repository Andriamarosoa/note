name: V27.3 S39 diagnose poly expert vs gate deficiency
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series39-complementarity.yml'
      - 'scripts/audit_v273_s39_poly_complementarity.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Await complete preregistered S38 trained acoustic outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 37880386031 --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - run: python -m pip install numpy==1.26.4
      - name: Recover 59k native predictions and all four new crossfold K1-K6 specialists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37880386031 --repo "$GITHUB_REPOSITORY" --name v273-series38-poly-harmonic-expert --dir model/S38
      - name: Measure true poly novelty, lost S18 cases, and non-deployable oracle ceiling
        run: >-
          python -m scripts.audit_v273_s39_poly_complementarity
          --pred model/S38/predictions.npz
          --probs model/S38/new_expert_probs.npz
          --output model/S39
      - name: 'Publish data-driven verdict: acoustic recognition or arbitration blocker'
        run: cat model/S39/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series39-poly-complementarity
          path: model/S39/
          retention-days: 90
