name: S489 prototype original sound WAV to actual E3 G3 named note events, no MIDI file
on:
  push:
    branches: [codex/s489-sound-to-note-names-cli]
    paths:
      - scripts/s489_sound_to_note_names_pretrained_cli.py
      - .github/workflows/v273-s489-standalone-sound-to-pitch-names.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s489-independent-note-names-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual_piano_realWAV_E3G3_name_output_no_midi:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual independent multi-instrument pretrained pitch model runtime
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Validate note names E3 G3 B3 and onsets from polyphonic pitches
        run: |
          python -m py_compile scripts/s489_sound_to_note_names_pretrained_cli.py
          python -m scripts.s489_sound_to_note_names_pretrained_cli --self-test
      - name: Restore source MAESTRO real original WAV identity without looking at MIDI
        run: |
          gh run download 38558629021 \
            -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI \
            -D model/S469 --repo ${{ github.repository }}
          gh run download 38559067956 \
            -n s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI \
            -D model/S470 --repo ${{ github.repository }}
      - name: Produce one genuine 12 second original real piano WAV from source fixed audio manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.s470_MAESTRO_real_piano_native_original_V88_and_birth_PREMIDI import fetch_track
          from scripts.s277_original_freeze_dataset3_native_prelabel import decode_external_wav,pcm
          m=json.load(open('model/S469/report.json'))
          r=json.load(open('model/S470/report.json'))
          i=m['selected_sources'][0]
          meta=next(x for x in r['exact_original_audio_source_fingerprints']
                    if x['WAV_filename_SHA256']==i['filename_SHA256'])
          raw,_=fetch_track(m['audio_mirror_directory'],i['audio_filename'])
          assert hashlib.sha256(raw).hexdigest()==meta['original_WAV_SHA256']
          audio,_=decode_external_wav(raw)
          start=int(i['audio_excerpt_start_seconds']*44100)
          length=12*44100
          Path('genuine_original_piano_source.wav').write_bytes(pcm(audio[start:start+length]))
          print('S489 prepared original independent piano WAV, no MIDI labels')
          PY
      - name: Execute sound to actual note names, verify notes are from model not sample illustration
        run: |
          python -m scripts.s489_sound_to_note_names_pretrained_cli \
            --audio genuine_original_piano_source.wav --pretty > original_piano_named_notes.json
          python - <<'PY'
          import json
          d=json.load(open('original_piano_named_notes.json'))
          assert d['status']=='S489_EXPERIMENTAL_PRETRAINED_NOTE_NAME_DETECTOR'
          assert d['MIDI_file_not_saved'] and d['source_Live_and_onset_offset_unchanged']
          assert d['total_predicted_note_events']>0 and d['birth_groups']>0
          assert all(len(q['note_names'])==q['K_new_notes']
                     for q in d['note_events'])
          assert not list(__import__('pathlib').Path('.').glob('*.mid'))
          print('S489 real WAV ->',d['note_events'][:6],'experimental note names; MIDI file not generated')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s489-genuine-original-piano-WAV-to-pitch-name-note-JSON-not-MIDI
          path: original_piano_named_notes.json
          retention-days: 90
