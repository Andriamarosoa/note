name: S105 original S5 frozen model forward pass
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s105_s5_frozen_forward.py'
      - '.github/workflows/v273-s105-s5-forward.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original_forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Restore original S5 checkpoint bytes
        run: |
          mkdir -p model/historical
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/historical
      - name: Verify real 4x527 to 7 probability model forwards without labels
        run: python scripts/s105_s5_frozen_forward.py --models model/historical/analysis/evidence/v273-open-k0-k6/series5/models --checkpoints-only
