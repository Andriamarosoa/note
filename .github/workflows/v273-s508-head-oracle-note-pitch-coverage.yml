name: S508 real thirteen note head selection capacity per pitch and K (diagnostic oracle only)
on:
  push:
    branches: [codex/s505-neural-note-selector-songheld]
    paths:
      - scripts/s508_audit_neural_head_exact_notes_oracle_pitch_coverage.py
      - .github/workflows/v273-s508-head-oracle-note-pitch-coverage.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  determine_if_more_neural_epochs_or_new_pitch_candidate_heads_are_needed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install pure numerical audited source tools
        run: python -m pip install numpy==1.26.4
      - name: Test chord oracle and pitch combination are different decision possibilities
        run: |
          python -m py_compile scripts/s508_audit_neural_head_exact_notes_oracle_pitch_coverage.py
          python -m scripts.s508_audit_neural_head_exact_notes_oracle_pitch_coverage --self-test
      - name: Restore genuine original S505 eight musical recordings note and 13-head truth-paired table
        run: |
          gh run download 38596480284 \
            -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table \
            -D model/S505 --repo "${{ github.repository }}"
      - name: Distinguish whole-head oracle, independent candidate note coverage and missing acoustic true pitches
        run: |
          python -u -m scripts.s508_audit_neural_head_exact_notes_oracle_pitch_coverage \
            --data model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --report model/S505/report.json --out model/S508
          python - <<'PY'
          import json
          z=json.load(open('model/S508/report.json'))
          assert z['status']=='S508_TRUE_NOTE_PITCH_HEAD_SELECTION_ORACLE_CAPACITY_NOT_MODEL'
          assert z['oracle_used_true_notes_ONLY_for_posthoc_diagnostic']
          assert z['independent_per_note_selection_not_yet_trained']
          assert z['no_original_S80_Live_changes'] and z['no_promotion']
          for k in ('guitar_S80','piano_V88'):
            n=z['by_source'][k]['summary']
            assert n['baseline_correct']<=n['individually_correct_proposal_available']
            assert n['individually_correct_proposal_available']<=n['union_can_cover_all_true_pitches']
          print('S508 immutable diagnostic proves how much of the missing accuracy requires true NEW pitch proposals')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s508-thirteen-actual-note-heads-oracle-and-independent-pitch-coverage-by-K
          path: model/S508/
          retention-days: 90
