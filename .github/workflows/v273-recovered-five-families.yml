name: Verify recovered S1 S2 S3 S4 and coherent selector on real audio
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - scripts/recover_v273_missing_s45.py
      - .github/workflows/v273-recovered-five-families.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovered-five-families-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src
            analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original model environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 h5py==3.16.0
      - name: Verify preserved reference files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('analysis/evidence/v273-recovered-five-families')
          for name,record in json.loads((root/'manifest.json').read_text()).items():
              data=(root/name).read_bytes()
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256'],name
          PY
      - name: Restore and verify the frozen eight producers
        run: >-
          python -m scripts.recover_v273_255_producers --stage recover
          --fundamentals analysis/evidence/v273-recovered-255/inputs/historical_fundamental58.npz
          --saved-specialists analysis/evidence/v273-recovered-255/specialists.joblib
          --saved-recovery-report analysis/evidence/v273-recovered-255/recovery_report.json
          --out model/recovered-five/runtime
      - name: Replay five complete families from regenerated historical inputs
        run: >-
          python -m scripts.recover_v273_missing_s45
          --runtime model/recovered-five/runtime
          --out model/recovered-five/historical
      - name: Run nineteen frozen branches on new GOAT acoustic inputs
        run: >-
          python -m scripts.recover_v273_missing_s45
          --runtime model/recovered-five/runtime
          --historical-proof model/recovered-five/historical/report.json
          --external analysis/evidence/v273-recovered-255/inputs/external_audio_inputs.npz
          --s5 analysis/evidence/v273-recovered-s5-s18/external_s5.npz
          --out model/recovered-five/external
      - name: Verify original S45 champion hashes and independent new-audio parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,numpy as np
          root=Path('model/recovered-five')
          r=json.loads((root/'historical/report.json').read_text())
          assert r['status']=='HISTORICAL_PASS' and r['complete_historical_cohort']
          assert not r['cached_receiver_producers'] and not r['predictive_models_fitted']
          assert r['raw_policy_decisions_checked']==1101471 and r['five_champion_decisions_checked']==37465
          with np.load('analysis/evidence/v273-regression-loops/prepared/inputs.npz') as d, np.load(root/'historical/historical_five_families.npz') as z:
              catalog={r['family']:r for r in json.loads(Path('analysis/v273_s45_original_champion_catalog.json').read_text())['original_families']}
              for j,fam in enumerate(z['family_ids']):
                  native=d['native_baseline'].copy()
                  native[d['native_position']]=z['predictions'][:,j]
                  assert hashlib.sha256(native.astype('i1').tobytes()).hexdigest()==catalog[str(fam)]['original_vector_sha256'],str(fam)
          for folder,name in [('historical','historical_five_families.npz'),('external','external_five_families.npz')]:
              with np.load(root/folder/name,allow_pickle=False) as a, np.load(Path('analysis/evidence/v273-recovered-five-families')/name,allow_pickle=False) as b:
                  assert set(a.files)==set(b.files)
                  for key in a.files:
                      assert a[key].shape==b[key].shape,key
                      if a[key].dtype.kind=='f':
                          assert np.allclose(a[key],b[key],atol=2e-5,rtol=0),key
                      else:
                          assert np.array_equal(a[key],b[key]),key
          e=json.loads((root/'external/report.json').read_text())
          assert e['branches']==19 and e['external_events']==57 and e['eligible_events']==5
          assert not e['new_audio_labels_read'] and not e['full_S45_16_families_complete'] and not e['S80_promoted']
          print('FIVE ORIGINAL S45 CHAMPION HASHES AND NEW AUDIO OUTPUTS VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-five-original-family-runtime-historical-and-GOAT-proof
          path: model/recovered-five/
          retention-days: 90
