name: V22 hard-negative scorer intervention

on:
  push:
    branches: [v220-hard-negative-scorer-intervention]
    paths:
      - 'scripts/audit_v220_hard_negative_scorer_intervention.py'
      - '.github/workflows/v220-hard-negative-scorer-intervention.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_V190_RUN: '33995600250'

jobs:
  intervention:
    name: Test hard-negative center scorer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile intervention
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/audit_v220_hard_negative_scorer_intervention.py
      - name: Download GuitarSet annotations
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Download GuitarSet pickup-mix audio
        shell: bash
        run: |
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip 'https://zenodo.org/record/3371780/files/audio_mono-pickup_mix.zip?download=1'
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download canonical V19 fold artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v190-dense-fold-*
          path: model/v190-all
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V190_RUN }}
          github-token: ${{ github.token }}
      - name: Run V22 intervention
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v220-intervention
          python -B scripts/audit_v220_hard_negative_scorer_intervention.py data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --v190-fold-dir model/v190-all \
            --output-dir model/v220-intervention \
            2>&1 | tee model/v220-intervention/audit.log
      - name: Verify intervention protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v220-intervention/report.json').read_text()); p=r['protocol']; q=r['pooled']
          assert p['v220_hard_negative_scorer_intervention'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_five_saved_v190_models'] is True
          assert p['v190_decoder_retrained'] is False and p['conv_latent_retrained'] is False
          assert p['scorer_training_rows_are_final_fit_only'] is True
          assert p['scorer_hyperparameter_sweep'] is False
          assert p['runtime_presence_threshold'] == 0.5 and p['runtime_presence_threshold_tuned'] is False
          assert p['locked12_indexed_or_evaluated'] is False
          assert len(r['folds']) == 5
          print(json.dumps({'delta_f1_pp':q['delta_f1_pp'],'fold_wins':q['fold_wins'],'mean_old_hard_auc':q['mean_old_hard_auc'],'mean_new_hard_auc':q['mean_new_hard_auc'],'mean_anchor_set_changed_fraction':q['mean_anchor_set_changed_fraction'],'old_v19_cardinality':q['old_v19_cardinality'],'new_v22_cardinality':q['new_v22_intervention_cardinality']},indent=2,sort_keys=True))
          PY
      - name: Upload V22 intervention
        uses: actions/upload-artifact@v4
        with:
          name: v220-hard-negative-scorer-intervention
          path: model/v220-intervention
          retention-days: 30
