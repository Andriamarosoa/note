name: S99 trace 16 original S45 champion implementations
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s99_trace_s45_original_producers.py'
      - '.github/workflows/v273-s99-trace-original-producers.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover original S45 commit
        run: git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38181001445
          name: v273-s98-original-family-provenance
          path: model/s98
      - name: Match exact champion variants against original source paths
        run: python scripts/s99_trace_s45_original_producers.py --s98 model/s98/report.json --out model/s99/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v273-s99-original-S45-source-location
          path: model/s99/report.json
          retention-days: 90
