name: V8.1 causal burst pilot

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v81-pilot.yml"
      - "scripts/train_v81.py"
      - "src/causal_note/v81_model.py"
      - "src/causal_note/v81_targets.py"
      - "test/test_v8.py"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Run V8 and V8.1 unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest test.test_v8 -v

      - name: Smoke V8.1 training path
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          mkdir -p model
          python -B scripts/train_v81.py \
            --smoke \
            --output model/causal-boundaries-v81-smoke.keras \
            2>&1 | tee model/v81-smoke.log

      - name: Train V8.1 three-epoch pilot
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v81.py \
            --epochs 3 \
            --filters 32 \
            --train-examples 800 \
            --validation-examples 200 \
            --learning-rate 0.001 \
            --output model/causal-boundaries-v81-pilot.keras \
            2>&1 | tee model/v81-pilot-train.log

      - name: Sweep every V8.1 epoch on locked validation subset
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          for epoch in 01 02 03; do
            python -B scripts/sweep_v8_thresholds.py \
              --model "model/causal-boundaries-v81-pilot.epoch-${epoch}.keras" \
              --limit-tracks 12 \
              --thresholds 0.01 0.02 0.05 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 0.95 \
              --output "model/v81-pilot-epoch-${epoch}-sweep.json" \
              > "model/v81-pilot-epoch-${epoch}-sweep.log"
          done

      - name: Consolidate stream metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = {"schema_version": 1, "epochs": {}}
          print("epoch threshold onset_pred onset_P onset_R onset_F1 offset_pred offset_P offset_R offset_F1 false_onsets/h false_offsets/h")
          for epoch in (1, 2, 3):
              path = Path(f"model/v81-pilot-epoch-{epoch:02d}-sweep.json")
              data = json.loads(path.read_text())
              report["epochs"][str(epoch)] = data
              for threshold, payload in data["sweep"].items():
                  global_ = payload["aggregates"]["global"]
                  onset = global_["onset"]
                  offset = global_["offset"]
                  rates = global_["rates_per_hour"]
                  print(
                      epoch,
                      threshold,
                      onset["prediction"],
                      f'{onset["precision"]:.6f}',
                      f'{onset["recall"]:.6f}',
                      f'{onset["f1"]:.6f}',
                      offset["prediction"],
                      f'{offset["precision"]:.6f}',
                      f'{offset["recall"]:.6f}',
                      f'{offset["f1"]:.6f}',
                      f'{rates["false_onsets"]:.3f}',
                      f'{rates["false_offsets"]:.3f}',
                  )
              print("runtime", epoch, data["runtime"])
          Path("model/v81-pilot-all-epochs.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload V8.1 pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-pilot
          path: |
            model/v81-smoke.log
            model/v81-pilot-train.log
            model/v81-pilot-epoch-*-sweep.log
            model/v81-pilot-epoch-*-sweep.json
            model/v81-pilot-all-epochs.json
            model/causal-boundaries-v81-pilot.keras
            model/causal-boundaries-v81-pilot.epoch-*.keras
          if-no-files-found: warn
          retention-days: 7
