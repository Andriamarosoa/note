name: S241 genuine original S29 to S35 expert router on 1034 native IDMT events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s241_original_S29_S35_on_native_IDMT.py'
      - '.github/workflows/v273-s241-original-S29-S35-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s241-original-S35-native-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true_S29_to_S35_original_experts:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original S35 trained expert and Q gate model runtime
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Require original S29 19 branch results on genuine 1034 native events completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38305601838 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: Download exact original 38 S29 Q / 19 S20 native-audio results
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38305601838
          name: s240-original-S29-19piece-1034-IDMT-unlabelled-inference
          path: model/S240
      - name: Restore exact native 1034-row audio for all original S35 825D expert views
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38305601838
          name: s240-original-S97-native-1034-audio-join-for-S29-S35
          path: model/S240bridge
      - name: Restore original S18 four distinct folded parents
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38304553740
          name: s238-idmt-original-full-S5-S18-133-checkpoint-4fold-1034-predictions
          path: model/S238
      - name: Restore 36 authentic original S35 expert checkpoints and 72 quality gates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37868356632
          name: v273-series35-extended-head-router
          path: model/S35
      - name: Execute genuine original S35 recursive router on all 19 S29 heldpiece checkpoint predictions
        run: |
          python -m py_compile scripts/s241_original_S29_S35_on_native_IDMT.py
          python -u -m scripts.s241_original_S29_S35_on_native_IDMT \
            --s209 model/S240/s29_original_all_19_IDMT.npz \
            --s18 model/S238/S238_original_S5_to_S18_true_V88_native_IDMT_1034.npz \
            --s97 model/S240bridge/s240_original_IDMT_native_S97_audio.npz \
            --s35 model/S35 --out model/S241
      - name: Require original trained 36 S35 experts, all 19 K0-K6 source branches and no labels
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S241/report.json'))
          assert r['original_S35_expert_checkpoints']==36
          assert r['original_S35_quality_gate_checkpoints']>0
          assert r['branches']==19 and r['events']==1034
          assert r['source_S20_for_S29_proxy_eliminated']
          assert not r['labels_read'] and not r['models_refitted']
          assert not r['S80_promoted'] and not r['independent_ExactK_scored']
          with np.load('model/S241/original_s29_to_s35_IDMT.npz',allow_pickle=False) as z:
              assert z['S35_K'].shape==(19,1034)
              assert z['S35_actions'].shape==(19,1034,3)
              assert np.isin(z['S35_K'],range(7)).all()
          print('S241 PASS genuine original 36 S35 pretrained experts + original Q gates on IDMT 1034 unlabelled native events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s241-original-authentic-S29-to-S35-19branches-IDMT1034
          path: model/S241/
          retention-days: 90
