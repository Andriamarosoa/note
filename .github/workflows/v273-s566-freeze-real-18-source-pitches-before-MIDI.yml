name: S566 freeze physical 18-source note heads vs S546 on fresh S561 music BEFORE MIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s566_freeze_new_18_source_physical_pitch_head_before_S561_midi.py
      - .github/workflows/v273-s566-freeze-real-18-source-pitches-before-MIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  sound_only_then_SHA_freeze_7_predeclared_noteon_experts:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pin genuine model CPU source-trained ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Test frozen source original BasicPitch MIDI chord and seven policies without MIDI
        run: |
          python -m py_compile scripts/s566_freeze_new_18_source_physical_pitch_head_before_S561_midi.py
          python -m scripts.s566_freeze_new_18_source_physical_pitch_head_before_S561_midi --self-test
      - name: Restore only new composer S561 WAV models and PRElabel raw acoustic note physics
        run: |
          gh run download 38666895837 -n s561-next-5-component-disjoint-music-after-18-exposed-METADATA-ONLY -D model/S561 --repo "${{ github.repository }}"
          gh run download 38667195568 -n s563-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S563 --repo "${{ github.repository }}"
          gh run download 38667294210 -n s564-next-five-S561-BasicPitch-original-pitch-names-PREMIDI -D model/S564 --repo "${{ github.repository }}"
          gh run download 38667298304 -n s565-next-five-S561-composers-V88-raw49-pitch-PREMIDI -D model/S565 --repo "${{ github.repository }}"
      - name: Restore original only 18-source real trained S562 fitted acoustic lower harmonics and 8-source S546 true weights
        run: |
          gh run download 38658337209 -n s546-sixteen-real-8-composer-held-pitch-models-acoustic-plus-harmonic-true-noteon -D model/S546 --repo "${{ github.repository }}"
          gh run download 38667229236 -n s562-real-18-composer-trained-original7-vs-physical-fundamental34-NoteOn-heads -D model/S562 --repo "${{ github.repository }}"
          test -s model/S562/S562_FULL18_raw7_REAL_COMPOSER_DISJOINT_HELD_SOURCE_FIT.joblib
          test -s model/S562/S562_FULL18_competing_fundamental34_REAL_COMPOSER_DISJOINT_HELD_SOURCE_FIT.joblib
      - name: Emit and SHA-freeze all 7 NoteOn policies on S561 WAV before EVER opening S561 paired MIDI
        run: |
          python -u -m scripts.s566_freeze_new_18_source_physical_pitch_head_before_S561_midi \
            --manifest model/S561/report.json --v88-report model/S563/report.json \
            --bp-report model/S564/report.json \
            --features model/S565/S565_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --feature-report model/S565/report.json \
            --s546-report model/S546/report.json --s562-report model/S562/report.json \
            --s546-weights model/S546 --s562-weights model/S562 --out model/S566
          python - <<'PY'
          import json
          from pathlib import Path
          import hashlib
          r=json.load(open('model/S566/report.json'))
          assert r['status']=='S566_FIVE_NEW_S561_SOUNDFROZEN_S546_VS_S562_NOTEON_BEFORE_MIDI'
          assert r['original_S561_MIDI_NOT_read_for_feature_model_or_policy_selection']
          assert len(r['all_seven_policies_preregistered_before_MIDI'])==7
          assert len(r['original_sha_8_plus_2_train_model_checkpoints_verified'])==10
          f=Path('model/S566/S566_FIVE_NEW_MAESTRO_FULL_NAMED_NOTEON_POLICIES_PRE_MIDI.jsonl')
          assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==r['output_pitch_name_ledger_SHA']
          assert r['no_promotion'] and r['full_S80_K_and_Live_unchanged']
          print('S566 MIDI BLIND FREEZE SUCCESS original seven NoteOn prediction policies SHA sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s566-Seven-S561-new-note-policies-18trained-physical34-vs-raw7-and-S546-SHA-sealed-NO-MIDI
          path: model/S566/
          retention-days: 90
