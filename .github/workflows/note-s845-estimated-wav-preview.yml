name: S845 raw-guitar WAV reconstruction preview software tests
on:
  push:
    branches: [codex/note-s845-raw-wave-acoustic-decoder256]
    paths:
      - 'scripts/s845_export_real_audio_estimates256.py'
      - 'tests/test_s845_real_audio_preview256.py'
      - '.github/workflows/note-s845-estimated-wav-preview.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s845-preview-software-only
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  raw256_audio_preview_no_midi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact 256 real microphone WAV streaming, no pitch DSP, no MIDI
        run: |
          python -m unittest discover -s tests -p 'test_s845_real_audio_preview256.py' -v
          python -m compileall -q scripts/s845_export_real_audio_estimates256.py
          echo "S845_ESTIMATED_WAV_PREVIEW_SOFTWARE_TEST_ONLY_NO_REAL_MUSICAL_SCORE"
