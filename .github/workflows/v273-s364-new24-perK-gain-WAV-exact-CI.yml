name: S364 exact 24-WAV per-K paired S80 gain on 967 ORIGINAL native events no tuning
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s364_new24_prospective_S80_perK_gain_audit.py'
      - '.github/workflows/v273-s364-new24-perK-gain-WAV-exact-CI.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s364-strict-evidence-967-24-WAV-native
  cancel-in-progress: true
jobs:
  paired_perK_gain_and_composition_conservative_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Require first labeled S363 full prescored frozen 24 WAV XML validity and SHA lock PASS
        run: gh run watch 38331684749 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Restore first prospective S363 scoring immutable artifact, not original label source files
        run: |
          gh run download 38331684749 \
            -n s363-PROSPECTIVE-IDMT-dataset1-24chords-967-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/S363 --repo ${{ github.repository }}
      - name: Exhaustive exact grouped 24-WAV signflip, bootstrapped per-K fixes and regressions, zero S80 weight change
        run: |
          python -u -m scripts.s364_new24_prospective_S80_perK_gain_audit \
            --source model/S363/report.json \
            --pred model/S363/S363_postfrozen_967_two_distinct_protocols.npz \
            --out model/S364
          python - <<'PY'
          import json
          r=json.load(open('model/S364/report.json'))
          a=r['paired_all_native_if_XML_complete']
          assert a['events']==967 and a['S80_corrections']-a['S80_regressions']==a['diff_correct']
          assert len(r['per_WAV'])==24
          assert r['WAV_group_signflip_all']['n_wav']==24
          assert r['paired_true_poly_attack_only']['events']==sum(r['by_K'][str(k)]['events'] for k in range(2,7))
          assert not r['independent_XML_K0_exhaustiveness_proven']
          assert not r['independent_song_composition_identity_proven']
          assert not r['reference_promotion_authorized']
          print('S364 PASS 24 independent filename hash groups, exact WAV signflip+paired K corrections, NO reference change')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s364-S80-original-24-new-IDMT-chords-967-events-ExactK-perK-signflip-CI-NOpromotion
          path: model/S364/
          retention-days: 90
