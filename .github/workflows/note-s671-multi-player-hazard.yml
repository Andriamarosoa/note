name: S671 causal per-note NoteOff hazard on real GuitarSet
on:
  push:
    branches: [codex/note-s671-multi-player-hazard]
    paths:
      - scripts/s671_causal_hazard_more_players.py
      - test/test_s671_authentic_train_augmentation.py
      - .github/workflows/note-s671-multi-player-hazard.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: note-s671-causal-offset-one
  cancel-in-progress: true
jobs:
  guitarset_noteoff_hazard:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original native NOTE runtime and supervised head
        run: |
          python -m pip install -r requirements-live-strict.txt
      - name: Compile and test S671 invariance
        run: |
          python -m compileall -q scripts/s671_causal_hazard_more_players.py test/test_s671_authentic_train_augmentation.py
          python -m unittest -v test.test_s671_authentic_train_augmentation
      - name: Evaluate past-only hazard versus identical NoteOn and K on expanded TRAIN 00-03 players and 12 DEV
        run: |
          python -m scripts.s671_causal_hazard_more_players --out /tmp/s671_hazard
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S671_CAUSAL_NOTEOFF_HAZARD_GUITARSET
          path: /tmp/s671_hazard/report.json
          if-no-files-found: warn
          retention-days: 60
