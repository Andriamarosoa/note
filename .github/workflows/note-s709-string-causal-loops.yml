name: S709 six-string native causal heads with joint count and boundary learning
on:
  push:
    branches: [codex/note-s709-string-causal-loops]
    paths:
      - src/causal_note/s709_string_heads.py
      - scripts/s709_train_string_heads.py
      - test/test_s709_string_heads.py
      - .github/workflows/note-s709-string-causal-loops.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s709-string-causal-loops
  cancel-in-progress: false
jobs:
  temporal_loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      S709_ARGS: --work /tmp/s709_work --out /tmp/s709 --offset-checkpoint /tmp/s709_s675/s675_hazard.joblib --warmstart /tmp/s709_s706/s706_selected.pt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned causal inference and training dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify temporal prefixes, incremental parity and causal event metrics
        run: |
          python -m compileall -q src/causal_note/s709_string_heads.py scripts/s709_train_string_heads.py
          python -m unittest -v test.test_s709_string_heads test.test_s705_temporal_heads test.test_s704_joint_loops
      - name: Retrieve verified S675 baseline
        run: |
          mkdir -p /tmp/s709_s675
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s709_s675
      - name: Prepare separated FIT and CAL with causal acoustic histories
        run: python -m scripts.s709_train_string_heads prepare $S709_ARGS
      - name: Retrieve immutable S706 encoder for warm start
        run: |
          gh run watch 39093239181 --repo "${{ github.repository }}" --exit-status --interval 30
          mkdir -p /tmp/s709_s706
          gh run download 39093239181 --repo "${{ github.repository }}" --name S706_SHARP_SPECTRAL_TEMPORAL_CAUSAL_LOOPS --dir /tmp/s709_s706
      - name: Learning loop 1 - epochs 1 to 8
        run: python -m scripts.s709_train_string_heads train $S709_ARGS --epoch 8
      - name: Calibration loop 1 - 144 joint selections
        run: python -m scripts.s709_train_string_heads calibrate $S709_ARGS --epoch 8
      - name: Publish first calibration checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: S709_CAL_LOOP_8
          path: |
            /tmp/s709/round_8.json
            /tmp/s709/training_to_8.json
          retention-days: 60
      - name: Learning loop 2 - epochs 9 to 16
        run: python -m scripts.s709_train_string_heads train $S709_ARGS --epoch 16
      - name: Calibration loop 2 - 144 joint selections
        run: python -m scripts.s709_train_string_heads calibrate $S709_ARGS --epoch 16
      - name: Publish second calibration checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: S709_CAL_LOOP_16
          path: |
            /tmp/s709/round_16.json
            /tmp/s709/training_to_16.json
          retention-days: 60
      - name: Learning loop 3 - epochs 17 to 30
        run: python -m scripts.s709_train_string_heads train $S709_ARGS --epoch 30
      - name: Calibration loop 3 and final freeze
        run: python -m scripts.s709_train_string_heads calibrate $S709_ARGS --epoch 30
      - name: Evaluate frozen model on HELD and diagnostic DEV once
        run: python -m scripts.s709_train_string_heads evaluate $S709_ARGS
      - name: Preserve checkpoints, all loops and exact emissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S709_SIX_STRING_NATIVE_CAUSAL_HEADS
          path: /tmp/s709/
          if-no-files-found: warn
          retention-days: 60
