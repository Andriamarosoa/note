name: "S628 frozen S613 +5ms future CPU worker overhead"
on:
  push:
    branches: [codex/note-s628-lookahead-5ms-ablation]
    paths:
      - '.github/workflows/note-s628-cpu-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-versus-five-ms:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inference-only CPU dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Compare original vs actual +5ms future FFT and neural costs
        run: |
          python -m scripts.s628_benchmark_cpu --block-size 256 --duration 1.5
          python -m scripts.s628_benchmark_cpu --block-size 512 --duration 1.5
