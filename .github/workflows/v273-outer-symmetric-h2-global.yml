name: V27.3 Outer Symmetric H2 Global

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-outer-symmetric-h2-global-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-outer-symmetric-h2-global
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  TAG: v273-outer-symmetric-h2-global-${{ github.run_id }}

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install runtime
        run: |
          python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
          python -m pip install librosa==0.10.2.post1 soxr==0.3.7

      - name: Validate evaluation script
        run: python -m py_compile scripts/evaluate_v273_outer_symmetric_h2_global.py

      - name: Restore GuitarSet
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Restore frozen bundle, robust weights, and outer B_low predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/freeze model/base

          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37208199201             --repo "${{ github.repository }}"             --pattern v273-loss-weighting-uniform.tgz             --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          gh release download v273-uniform-anchored-freeze-37233793945             --repo "${{ github.repository }}"             --pattern v273-uniform-anchored-freeze-result.tgz             --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/freeze

          gh release download v273-outer-b-low-eval-37316567815             --repo "${{ github.repository }}"             --pattern predictions.npz             --dir model/base

          test -f model/uniform/uniform.weights.h5
          test -f model/freeze/freeze_local_combo.weights.h5
          test -f model/base/predictions.npz

      - name: Measure global H2 score
        run: |
          rm -rf model/result
          python -B scripts/evaluate_v273_outer_symmetric_h2_global.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --dataset data/GuitarSet             --uniform-weights model/uniform/uniform.weights.h5             --freeze-weights model/freeze/freeze_local_combo.weights.h5             --outer-predictions model/base/predictions.npz             --output model/result
          cat model/result/report.md

      - name: Publish exploratory measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 exploratory outer symmetric H2 global measurement"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/result/predictions.npz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-outer-symmetric-h2-global
          path: model/result/
          retention-days: 90
