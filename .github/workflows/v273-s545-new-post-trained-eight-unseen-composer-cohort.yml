name: S545 metadata-only five NEW source-composer songs to test trained S544 without previous MIDI leakage
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s545_preregister_another_five_unseen_composers_after_training_METADATA_ONLY.py
      - .github/workflows/v273-s545-new-post-trained-eight-unseen-composer-cohort.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  seal_completely_different_five_source_composers_before_any_paired_audio_or_MIDI:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check known old8 composers and previously heard WAVs must all be excluded
        run: |
          python -m py_compile scripts/s545_preregister_another_five_unseen_composers_after_training_METADATA_ONLY.py
          python -m scripts.s545_preregister_another_five_unseen_composers_after_training_METADATA_ONLY --self-test
      - name: Restore prior three and five exposed composer audio names, metadata only
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
      - name: Check official CSV exact SHA and preregister five new train split composers with no WAV or MIDI
        run: |
          python -u -m scripts.s545_preregister_another_five_unseen_composers_after_training_METADATA_ONLY \
            --old model/S469/report.json --new model/S537/report.json --out model/S545
          python - <<'PY'
          import json
          r=json.load(open('model/S545/report.json'))
          assert r['status']=='S545_PREREGISTERED_FIVE_MORE_TRAIN_SPLIT_COMPOSERS_AFTER_S544_NO_WAV_MIDI'
          assert r['five_next_distinct_composers']==5
          assert r['original_S469_3_composers_PLUS_S537_5_composers_excluded']
          assert r['co_composer_COMPONENTS_fully_excluded_and_pairwise_disjoint']
          assert r['MAESTRO_original_split_used']=='train'
          assert not r['source_MIDI_files_not_read'] is False
          assert r['source_WAV_files_not_read']
          assert r['no_promotion'] and r['original_reference_S80_ExactK_Live_untouched']
          print('S545 another five fully previously unexposed artist/composer names frozen before WAV/MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY
          path: model/S545/report.json
          retention-days: 90
