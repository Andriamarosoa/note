name: S654 learned pitch-wise K-risk specialist trained from S648 out-of-fit new note events
on:
  push:
    branches: [codex/s654-learned-pitch-risk-selector]
    paths:
      - src/causal_note/s654_pitch_risk_selector.py
      - scripts/s654_train_risk_on_unseen_birth_events.py
      - test/test_s654_pitch_risk_selector.py
      - .github/workflows/v273-s654-learned-event-specialist.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s654-composition-disjoint-pitch-risk
  cancel-in-progress: false
jobs:
  real_trained_note_risk_specialist:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen NOTE native environment
        run: python -m pip install -r requirements-live-strict.txt
      - uses: actions/download-artifact@v4
        with:
          name: S648-trained-event-birth-FIT-CALIB-DEV-model-report
          run-id: 38821104076
          github-token: ${{ github.token }}
          path: /tmp/S648
      - name: Test true candidate event verification, causal risk and no-op S614
        run: |
          python -m compileall -q src/causal_note/s654_pitch_risk_selector.py scripts/s654_train_risk_on_unseen_birth_events.py
          python -m unittest -v test.test_s654_pitch_risk_selector test.test_s652_event_round_audit
      - name: Fit unseen-composition correction/regression expert on 7 original sources, calibrate on four and replay 17 DEV
        run: |
          python -u -m scripts.s654_train_risk_on_unseen_birth_events \
            --birth-checkpoint /tmp/S648/S648_birth_event_fit_train_only.joblib \
            --out /tmp/S654
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S654-trained-pitch-risk-specialist-and-event-regression-evidence
          path: /tmp/S654/
          if-no-files-found: warn
          retention-days: 60
