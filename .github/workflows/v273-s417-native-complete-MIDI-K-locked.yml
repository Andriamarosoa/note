name: S417 native full MIDI notes temporal note-offs S80 K0-K6 immutable
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s417_native_S416_MIDI_pitch_plus_continuous_WAV_note_off.py'
      - '.github/workflows/v273-s417-native-complete-MIDI-K-locked.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s417-native-K-locked-noteoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_noteoff_with_complete_WAV_context:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify native complete MIDI note decoding and Exact-K contracts
        run: |
          python -m py_compile scripts/s417_native_S416_MIDI_pitch_plus_continuous_WAV_note_off.py
          python -u -m scripts.s417_native_S416_MIDI_pitch_plus_continuous_WAV_note_off --self-test
      - name: Require successful original S416 NATIVE MIDI pitch training without YourMT3
        run: |
          gh run watch 38381449092 --exit-status --repo ${{ github.repository }}
      - name: Restore full 59309 actual S416 held-composition native MIDI predictions
        run: |
          gh run download 38381449092 -n s416-native-CNN-time-pitch-note-head-songheld-S80-ExactK-LOCKED-NO-YourMT -D model/S416 --repo ${{ github.repository }}
          test -f model/S416/S416_NATIVE_Kfirst_MIDI_NOTE_59309_SONG_OOF.npz
      - name: Restore original S80 untouched K predictions and native spectral signals
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Restore original song-held S407 note Onset times
        run: |
          gh run download 38369185178 -n s407-S80-frozen-K-onset-timing-SONG-HELD-4fold-original-GuitarSet -D model/S407 --repo ${{ github.repository }}
      - name: Restore previous S408 and S412 comparator note outputs, NOT model inputs
        run: |
          gh run download 38375133317 -n s412-songheld-REAL-full-WAV-note-offset-vs-S408-user-baseline-NOPROMOTION -D model/S412 --repo ${{ github.repository }}
      - name: Fetch official complete continuous GuitarSet MIC audio and JAMS labels
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/audio_mono-mic.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/audio_mono-mic.zip
          echo '275966d6610ac34999b58426beb119c3  data/GuitarSet/audio_mono-mic.zip' | md5sum -c -
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Train native per-MIDI-note duration heads from continuous WAV and composition-held JAMS
        run: |
          python -u -m scripts.s417_native_S416_MIDI_pitch_plus_continuous_WAV_note_off \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s416 model/S416/S416_NATIVE_Kfirst_MIDI_NOTE_59309_SONG_OOF.npz \
            --s407 model/S407/S407_frozen_S80_K_and_songheld_timing.npz \
            --source-mic data/GuitarSet/audio_mono-mic.zip \
            --annotations data/GuitarSet/annotation.zip \
            --prior-s412 model/S412/S412_continuous_MIC_note_offset_4fold_predictions.npz \
            --out model/S417
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S417/report.json'))
          assert d['status']=='S417_NATIVE_KFIRST_COMPLETE_NOTE_ONSET_OFFSET_MODEL'
          assert d['original_events']==59309
          assert d['original_new_note_count']==33475
          assert d['zero_ExactK_regressions']==0
          assert d['source_original_S80_exactK_correct_global']==53529
          assert d['source_original_S80_exactK_correct_poly']==6054
          assert d['no_YourMT3_in_training_or_inference']
          assert len(d['folds'])==8
          assert all(r['composition_overlap']==0 for r in d['folds'])
          with np.load('model/S417/S417_native_model_MIDI_notes_and_offsets.npz') as z:
            assert len(z['full_original_row_id'])==59309
            assert int(z['full_original_S80_K'].sum())==33475
            assert len(z['MIDI'])==33475
            assert np.all(z['offset_absolute_error']>z['onset_samples'])
          print('S417 VERIFIED native full NoteOn/MIDI/NoteOff with independent JSONL 59309 S80 K invariance')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s417-NATIVE-complete-MIDI-notes-K0-K6-LOCKED-no-YourMT3-SONGHELD
          path: model/S417/
          retention-days: 90
