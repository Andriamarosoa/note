name: S282 S283 original S18 fold-neutral quorum and genuine S97 audio bridge IDMT dataset3 506
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s282_S217_fold_consensus_dataset3_506.py'
      - 'scripts/s283_S97_bridge_dataset3_506.py'
      - '.github/workflows/v273-s282-s283-idmt-dataset3-S18-neutral-S97-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s282-283-idmt-dataset3-source-only
  cancel-in-progress: true
jobs:
  original_source_aligned_quorum_and_acoustics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore exactly 506 S281 original fourfold S5 to S18 native source IDs
        run: |
          gh run download 38319911630 \
            -n s281-IDMT-dataset3-506-original-S5-S18-fourfold-133trained \
            -D model/S281 --repo ${{ github.repository }}
      - name: Restore S278 and S277 native immutable source and original official freeze
        run: |
          gh run download 38319390256 \
            -n s278-IDMT-dataset3-506-native-real-S97-no-XML \
            -D model/S278 --repo ${{ github.repository }}
          gh run download 38319155819 \
            -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled \
            -D model/S277 --repo ${{ github.repository }}
      - name: Apply historical S217 >=3-of-4 precommitted vote rule, original freeze fallback
        run: |
          python -u -m scripts.s282_S217_fold_consensus_dataset3_506 \
            --s281 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --out model/S282
      - name: Produce true original native audio source bank for S29 S35 and all S45 checkpoints
        run: |
          python -u -m scripts.s283_S97_bridge_dataset3_506 \
            --s281 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s278 model/S278/S278_IDMT_dataset3_original_S97_on_frozen_native_events.npz \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --out model/S283
      - name: Verify source only, canonical ID and unchanged original fold routing
        run: |
          python - <<'PY'
          import numpy as np,json
          a=json.load(open('model/S282/report.json'))
          b=json.load(open('model/S283/report.json'))
          assert a['native_event_count']==b['original_canonical_reference_events']==506
          assert a['original_fold_count']==4
          assert not a['labelled_song_annotations_read']
          assert not b['labels_MIDI_XML_read']
          assert not a['S80_promoted'] and not b['official_S80_promoted']
          with np.load('model/S282/S282_original_S18_foldneutral_506_IDMT.npz',allow_pickle=False) as z:
            assert z['original_S18_by_fold_K'].shape==(4,506)
            assert z['S18_piece_neutral_consensus_K'].shape==(506,)
          with np.load('model/S283/S283_original_IDMT_dataset3_native_S97_audio.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(506,58) and z['geometry3'].shape==(506,3)
          print('S282/S283 PASS source-only native original S18 quorum and S97 views')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s282-s283-IDMT-dataset3-506-native-original-S18-quorum-S97-source
          path: |
            model/S282/
            model/S283/
          retention-days: 90
