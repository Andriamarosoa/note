name: V27.3 S28 learned head order and partial revisit scheduler
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series28-adaptive-scheduler.yml'
      - 'scripts/train_v273_adaptive_scheduler.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical libraries, Ridge and PyTorch for acoustic feature reader
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify choosing full A/B path versus partial and no change
        run: python -m scripts.train_v273_adaptive_scheduler --self-test
      - name: Download original audio and harmonic feature envelopes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/original-tars
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/original-tars
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/original-tars/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Download 19-fold correct conservative S18 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Download S27 actual sparse revisit and full-depth candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37864168525 --repo "$GITHUB_REPOSITORY" --name v273-series27-partial-revisits --dir model/S27
      - name: Download independently numerically replayed trained B-first actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37862417522 --repo "$GITHUB_REPOSITORY" --name v273-series25-trained-Bfirst --dir model/S25
      - name: Fit 152 piece-excluded order and revisit arbitration gates
        run: >-
          python -m scripts.train_v273_adaptive_scheduler
          --features model/features
          --s18 model/S18/predictions.npz
          --s27 model/S27/predictions.npz
          --s25 model/S25/predictions.npz
          --output model/S28
      - name: Publish per-K routing accuracy and corrections/regressions
        run: cat model/S28/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series28-adaptive-scheduler
          path: model/S28/
          retention-days: 90
