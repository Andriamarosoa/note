name: V28 final moderate weighting chunk worker

on:
  workflow_call:
    inputs:
      chunk:
        required: true
        type: number

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  train:
    name: Moderate 35 percent loss, epochs block ${{ inputs.chunk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          name: v280-i-prepared
          path: model/v280-i-prepared
      - name: Download completed first chunk
        if: inputs.chunk == 2
        uses: actions/download-artifact@v4
        with:
          name: v280-i-moderate-1
          path: model/v280-i-previous
      - name: Train real GuitarSet rows with fixed 35 percent polyphonic loss mass
        shell: bash
        run: |
          set -o pipefail
          previous=()
          if test '${{ inputs.chunk }}' = '2'; then
            previous=(--previous-dir model/v280-i-previous)
          fi
          python -B scripts/train_v280_moderate_final.py train-chunk \
            --prepared-dir model/v280-i-prepared \
            --chunk '${{ inputs.chunk }}' "${previous[@]}" \
            --output-dir model/v280-i-training \
            2>&1 | tee "$RUNNER_TEMP/v280-i-training.log"
      - name: Preserve training log
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/v280-i-training.log"; then
            mkdir -p model/v280-i-training
            cp "$RUNNER_TEMP/v280-i-training.log" model/v280-i-training/training.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v280-i-moderate-${{ inputs.chunk }}
          path: model/v280-i-training
          if-no-files-found: error
          retention-days: 90
