name: S412 REAL continuous WAV note Offsets vs user selected S408 baseline
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s412_evaluate_real_continuous_WAV_sustain_note_offset_against_S408.py'
      - '.github/workflows/v273-s412-full-WAV-continuous-Offset-vs-S408.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s412-continuous-WAV-offset-${{ github.ref }}
  cancel-in-progress: true
jobs:
  four_songheld_full_WAV_offset_experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test full WAV K-conditioned pitch and offset source contract
        run: |
          python -m py_compile scripts/s412_evaluate_real_continuous_WAV_sustain_note_offset_against_S408.py
          python -u -m scripts.s412_evaluate_real_continuous_WAV_sustain_note_offset_against_S408 --self-test
      - name: Restore immutable original S408 predicted notes and offsets
        run: |
          gh run download 38371603686 -n s408-real-note-offsets-pitch-conditioned-S80-S402-S407-songheld-NOPROMOTION -D model/S408 --repo ${{ github.repository }}
          test -f model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz
      - name: Restore S411 TRUE continuous time-grid acoustic context from 190 WAVs
        run: |
          gh run download 38374781473 -n s411-real-full-GuitarSet-continuous-MIC-10ms-pitch-note-survival-input-N33475 -D model/S411 --repo ${{ github.repository }}
          test -f model/S411/S411_continuous_mic_pitch_features_for_S408_notes.npz
      - name: Retrieve official JAMS labels for TRAIN and scoring after acoustic inputs are frozen
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Crossfit new full WAV Offset regressor with independent composition folds
        run: |
          python -u -m scripts.s412_evaluate_real_continuous_WAV_sustain_note_offset_against_S408 \
            --source model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz \
            --continuous model/S411/S411_continuous_mic_pitch_features_for_S408_notes.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S412
          python - <<'PY'
          import json
          r=json.load(open('model/S412/report.json'))
          assert r['status']=='S412_CONTINUOUS_WAV_MIC_NOTE_OFFSET_SONGHELD_EVALUATION'
          assert r['measured']['S408_frozen_baseline']['offset_50ms_correct_given_note_onset_pitch']==13050
          assert r['original_note_predictions']==33475 and r['matched_pitch_onset_truth']==25120
          assert r['train_holdout_compositions_disjoint']
          assert r['input_full_audio_10ms_grid_including_K0']
          assert r['different_mic_source_than_original_S258_pickup_mix']
          assert all(z['composition_overlap']==0 for z in r['fold_evidence'])
          print('S412 full continuous WAV vs frozen user-selected S408 reference verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s412-songheld-REAL-full-WAV-note-offset-vs-S408-user-baseline-NOPROMOTION
          path: model/S412/
          retention-days: 90
