name: S816 frozen ActiveK anti-overcount MIDI256 real FIT80 experiment
on:
  push:
    branches: [codex/note-s816-activek-risk-selector]
    paths:
      - scripts/s816_reselect_activek256.py
      - test/test_s816_risk_selector.py
      - series/S816/**
      - .github/workflows/note-s816-activek-risk.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Validate calibration-only risk gate, provenance and syntax
        run: |
          python -m compileall -q scripts/s816_reselect_activek256.py test/test_s816_risk_selector.py
          python -m unittest -v test.test_s816_risk_selector test.test_s815_activek_teacher test.test_s813_teacher_contract test.test_s809_axis_isolation
          python -m scripts.verify_series_reports --series S816
  real_fit80:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Download immutable completed S815 three-head models
        run: |
          mkdir -p /tmp/s816/s815
          gh run download 39536863317 --repo Andriamarosoa/note --name S815_ACTIVE_K_PRIVATE_MIDI256_FIT80_RESULTS --dir /tmp/s816/s815
          find /tmp/s816/s815 -maxdepth 3 -name report.json -print
          OLD="$(find /tmp/s816/s815 -path '*/experiment/report.json' -type f -print -quit)"
          test -s "$OLD"
          OLD_DIR="$(dirname "$OLD")"
          test -s "$(dirname "$OLD_DIR")/fresh256/report.json"
          test -s "$OLD_DIR/models/BN1_active_k.joblib"
          printf '%s\n' "$OLD_DIR" > /tmp/s816/old_path
      - name: Restore genuine signed S800 FIT80 manifest and immutable labels
        run: |
          mkdir -p /tmp/s816/manifest /tmp/s816/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s816/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s816/traces
          MANIFEST="$(find /tmp/s816/manifest -name report.json -type f -print -quit)"
          TRACK="$(find /tmp/s816/traces -name fit_000.json -type f -print -quit)"
          test -s "$MANIFEST"
          test -s "$TRACK"
          printf '%s\n' "$MANIFEST" > /tmp/s816/manifest_path
          printf '%s\n' "$(dirname "$TRACK")" > /tmp/s816/traces_path
      - name: Download exact SHA pinned original GuitarSet mono PCM
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          reg=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          src=reg['guitar_archives']['GuitarSet_audio']
          dst=Path('/tmp/s816/GuitarSet_audio.zip')
          with urllib.request.urlopen(src['url'],timeout=180) as inp,dst.open('wb') as out:
              while chunk:=inp.read(4*1024*1024):
                  out.write(chunk)
          assert dst.stat().st_size==src['size']
          h=hashlib.sha256()
          with dst.open('rb') as inp:
              for chunk in iter(lambda:inp.read(4*1024*1024),b''):
                  h.update(chunk)
          assert h.hexdigest()==src['sha256']
          print('S816_AUTHENTIC_PCM_SHA',h.hexdigest())
          PY
      - name: Repeat strictly causal fresh PCM DSP256 extraction for all 80 recordings
        run: |
          python -m scripts.s813_prepare_native256 --manifest "$(cat /tmp/s816/manifest_path)" --traces "$(cat /tmp/s816/traces_path)" --audio-zip /tmp/s816/GuitarSet_audio.zip --out /tmp/s816/fresh256 --workers 2
      - name: Re-score frozen S815 teacher with calibrated overcount penalty at real MIDI256
        run: |
          python -m scripts.s816_reselect_activek256 --cache /tmp/s816/fresh256 --source-dir "$(cat /tmp/s816/traces_path)" --previous-dir "$(cat /tmp/s816/old_path)" --out /tmp/s816/result
      - name: Require fixed reference, no promotion and explicit regression test
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s816/result/report.json'))
          assert r['complete'] and len(r['tracks'])==80 and len(r['folds'])==5
          assert (r['sample_rate_hz'],r['feature_hop_samples'],r['decision_hop_samples'],r['metric_hop_samples'])==(44100,256,256,256)
          assert r['source_active_k']['correct']==142213
          assert r['frozen_s815_active_k']['correct']==141946
          assert r['candidate_active_k']['frames']==249411
          assert not r['retrained_models'] and not r['source_MIDI_modified']
          assert not any(r[k] for k in ('CAL_opened','HELD_opened','TEST_opened','LIVE_measured','promotion'))
          assert not r['unification_gate']['allow_unification']
          print('S816_TRUE_ACTIVE_K',r['candidate_active_k'])
          print('S816_H0',r['source_active_k'])
          print('S816_FROZEN_S815',r['frozen_s815_active_k'])
          print('S816_DELTAS',r['delta_vs_h0_pp'],r['delta_vs_s815_pp'])
          print('S816_NO_AUTOMATIC_PROMOTION',True)
          PY
      - name: Retain complete frozen-decision and true-K audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S816_FROZEN_ACTIVEK_RISK_RESELECT_GUITARSET_MIDI256
          path: |
            /tmp/s816/result/report.json
            /tmp/s816/result/decisions/
            /tmp/s816/fresh256/report.json
          retention-days: 45
          if-no-files-found: warn
