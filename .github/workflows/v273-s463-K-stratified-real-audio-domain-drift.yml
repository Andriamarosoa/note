name: S463 compare actual original GuitarSet versus IDMT audio distributions conditional on true K
on:
  push:
    branches: [codex/s462-idmt-event-alignment-causal-audit]
    paths:
      - scripts/s463_compare_original_IDMT_GuitarSet_K_stratified_audio_shift.py
      - .github/workflows/v273-s463-K-stratified-real-audio-domain-drift.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s463-IDMT-vs-GuitarSet-acoustic-K-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare_actual_same_K_acoustic_feature_banks_without_training:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime for real original audio feature distribution analysis
        run: python -m pip install numpy==1.26.4
      - name: Test quantile drift measurements without fitting a classification model
        run: |
          python -m py_compile scripts/s463_compare_original_IDMT_GuitarSet_K_stratified_audio_shift.py
          python -m scripts.s463_compare_original_IDMT_GuitarSet_K_stratified_audio_shift --self-test
      - name: Restore true original GuitarSet 59k acoustic features + separately held real K
        run: |
          gh run download 38311525987 \
            -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 \
            -D model/S258 --repo ${{ github.repository }}
      - name: Restore ORIGINAL IDMT 506 acoustic windows original S80 and S453 verified 47 matched actual note labels
        run: |
          gh run download 38320164646 \
            -n s282-s283-IDMT-dataset3-506-native-original-S18-quorum-S97-source \
            -D model/S282S283 --repo ${{ github.repository }}
          gh run download 38320939533 \
            -n s294-s298-two-complete-frozen-S80-original-vs-S274-IDMT-dataset3-506-PREXML \
            -D model/S294S298 --repo ${{ github.repository }}
          gh run download 38533183193 \
            -n s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion \
            -D model/S453 --repo ${{ github.repository }}
      - name: Characterize same-K distribution shift across 58D 245D 490D 294D 3D blocks
        run: |
          python -u -m scripts.s463_compare_original_IDMT_GuitarSet_K_stratified_audio_shift \
            --s258 model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s258-truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --s283 model/S282S283/S283/S283_original_IDMT_dataset3_native_S97_audio.npz \
            --s297 model/S294S298/S297_original/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --s453 model/S453/S453_independent_original_IDMT_stage_audit.jsonl \
            --s453-report model/S453/report.json \
            --out model/S463
          python - <<'PY'
          import json
          r=json.load(open('model/S463/report.json'))
          assert r['status']=='S463_ORIGINAL_IDMT_GUITARSET_MATCHED_TRUE_K_ACOUSTIC_DOMAIN_SHIFT_READONLY'
          assert r['original_GuitarSet_native_rows']==59309
          assert r['original_IDMT_native_rows']==506
          assert r['actual_known_IDMT_true_K_rows']==45
          assert r['original_S80_exactK_correct_on_matched']==25
          assert r['original_S80_exactK_wrong_on_matched']==20
          assert not r['no_train_refit_reweighting_or_model_promotion'] is False
          assert r['no_promotion'] and r['not_a_causal_audio_shift_proof']
          print('S463 validated trueK-stratified acoustic domain shift vs original features')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s463-GuitarSet-vs-IDMT-45-genuine-annotated-trueK-stratified-acoustic-feature-shift
          path: model/S463/
          retention-days: 90
