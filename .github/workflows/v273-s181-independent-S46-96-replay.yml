name: S181 independent all 96 S46 policies replay and event-level proposal truth-free audit
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s181_independent_s180_s46_replay.py'
      - '.github/workflows/v273-s181-independent-S46-96-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s181-independent-S46-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay_every_policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only NumPy for truly independent risk selection audit
        run: python -m pip install numpy==1.26.4
      - name: Test independent numeric selector before reading any saved source
        run: python -m scripts.s181_independent_s180_s46_replay --self-test
      - name: Restore the real 11-source S45 Ridge proposal evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38206160849
          name: v273-s173-real-trained-S35-adapted-11-source-S45-risks-NO-S80
          path: model/S173
      - name: Restore S180 experimentally executed 96 frozen S46 decisions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38208449350
          name: v273-s180-96-partial-original-S46-policies-on-11-sources-no-labels
          path: model/S180
      - name: Independently recalculate all 96 masks utilities and resulting event transitions
        run: |
          set -euo pipefail
          python -u -m scripts.s181_independent_s180_s46_replay \
            --s173 model/S173/S173_S35_adapted_11_family_GOAT.npz \
            --s180 model/S180/S180_partial_S46_two_groups_97_preds.npz \
            --out model/S181
          python - <<'PY'
          import json
          d=json.load(open('model/S181/report.json'))
          assert d['S46_policies_independently_replayed']==96
          assert d['policy_decision_mismatches']==0
          assert not d['full_16_source_votes_available']
          assert not d['annotation_truth_or_MIDI_read']
          assert not d['independent_ExactK_accuracy_measured']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s181-independent-96-S46-mask-utility-event-audit-no-labels
          path: model/S181/
          retention-days: 90
