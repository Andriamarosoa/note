name: S176 verify S1 GOAT original 58D feature order and K2-K4 opportunity
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s176_verify_original_s1_acoustic_goat_inputs.py'
      - '.github/workflows/v273-s176-S1-acoustic-GOAT-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s176-original-S1-audio-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_original_acoustic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical acoustic feature source dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Original class eligibility and order selftest
        run: python -m scripts.s176_verify_original_s1_acoustic_goat_inputs --self-test
      - name: Original GOAT S97 58D tensors; no MIDI
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - name: Reproduced original-trained S35 GOAT S18 parent and 11 source features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38206160849
          name: v273-s173-real-trained-S35-adapted-11-source-S45-risks-NO-S80
          path: model/S173
      - name: Derive source S1 feature names from real implementation, compare historic training and GOAT
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S173="$(find model/S173 -name S173_S35_adapted_11_family_GOAT.npz -print -quit)"
          for f in "$S97" "$S173"; do test -s "$f"; done
          python -u -m scripts.s176_verify_original_s1_acoustic_goat_inputs \
            --root . --s97 "$S97" --s173 "$S173" --out model/S176
          python - <<'PY'
          import json
          d=json.load(open('model/S176/report.json'))
          assert d['original_acoustic_58_feature_key_and_order_parity']
          assert sum(d['native_GOAT_parent_S18_adapted_K_histogram'])==57
          assert d['new_audio_S45_original_family_count']==11
          assert not d['full_original_S1_S4_source_proposals_on_GOAT']
          assert not d['true_K_or_MIDI_opened']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s176-S1-original-58D-feature-order-GOAT-no-S80
          path: model/S176/
          retention-days: 90
