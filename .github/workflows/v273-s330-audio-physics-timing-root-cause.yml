name: S330 root cause test physical audio attack RMS and spectral flux vs V88 and XML (no correction)
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s330_exposed_audio_physics_V88_XML_timing.py'
      - '.github/workflows/v273-s330-audio-physics-timing-root-cause.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s330-exposed-physical-attack-V88-XML-diagnostic
  cancel-in-progress: true
jobs:
  independent_physical_audio_rms_fft_timing_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Test sample-origin physical transient timing on generated guitar-like waveform and negative silence control
        run: python -u -m scripts.s330_exposed_audio_physics_V88_XML_timing --self-test
      - name: Restore original S302 official native 964 V88 candidates, S305 protocol and previously exposed XML SHA evidence
        run: |
          gh run download 38322507433 \
            -n s302-IDMT-dataset2-16WAV-true-original-V88-native-official-unlabelled \
            -D model/S302 --repo ${{ github.repository }}
          gh run download 38323261561 \
            -n s305-Dataset2-16reserveWAV-964events-original-K0K6-attack-protocol-PREXML \
            -D model/S305 --repo ${{ github.repository }}
          gh run download 38324513980 \
            -n s327-PROSPECTIVE-IDMT-dataset2-964-postfrozen-original-attack-ExactK0to6-NOTpromotion \
            -D model/S327 --repo ${{ github.repository }}
      - name: Audit raw PCM electrical onset vs original V88 peak and XML timestamp under two independent physical novelty estimators
        run: |
          python -u -m scripts.s330_exposed_audio_physics_V88_XML_timing \
            --s305 model/S305/report.json \
            --s302 model/S302/S302_official_V88_dataset2_rank49plus_16_WAV_predictions.npz \
            --s302report model/S302/report.json \
            --s327 model/S327/report.json \
            --s327pred model/S327/S327_original_964_attackK0to6_XML_annotations_postfrozen.npz \
            --out model/S330
          python - <<'PY'
          import json
          r=json.load(open('model/S330/report.json'))
          assert r['original_WAVs']==16 and r['original_V88_events']==964
          assert r['original_inclip_annotated_onsets']==250
          assert r['estimates']['all']['n']==250
          assert r['no_model_or_candidate_time_shift_applied']
          assert r['no_prediction_or_truth_reassignment']
          assert r['these_are_XML_local_diagnostic_peaks_not_independent_true_audio_onsets']
          assert not r['official_S80_promotion']
          print('S330 PASS independent audio physics diagnostic; no model or evaluation policy tuning')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s330-exposed-audio-physics-rms-fft-V88-versus-XML-no-model-tuning
          path: model/S330/
          retention-days: 90
