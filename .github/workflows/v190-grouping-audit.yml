name: V19 candidate-group supervision audit

on:
  push:
    branches: [v190-grouping-audit]
    paths:
      - 'scripts/audit_v190_candidate_group_supervision.py'
      - '.github/workflows/v190-grouping-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'

jobs:
  audit:
    name: Audit candidate-to-birth grouping supervision
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile audit
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/audit_v190_candidate_group_supervision.py
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Run grouping audit
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v190-grouping-audit
          python -B scripts/audit_v190_candidate_group_supervision.py data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --output-dir model/v190-grouping-audit \
            2>&1 | tee model/v190-grouping-audit/audit.log
      - name: Verify audit protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v190-grouping-audit/report.json').read_text())
          p=r['protocol']; h=r['headline']
          assert p['training_universe_rows'] == 76768
          assert p['runtime_annotations_required'] is False
          assert p['locked12_touched'] is False
          assert p['no_training'] is True
          assert h['positive_rows'] > 0 and h['poly_rows'] > 0
          assert h['pair_samples'] > 1000
          print(json.dumps(h, indent=2, sort_keys=True))
          PY
      - name: Upload grouping audit
        uses: actions/upload-artifact@v4
        with:
          name: v190-candidate-group-supervision-audit
          path: model/v190-grouping-audit
          retention-days: 30
