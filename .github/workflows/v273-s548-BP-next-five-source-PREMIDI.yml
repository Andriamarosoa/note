name: S548 prospective five new composer Basic Pitch prelabel MIDI notes from sealed WAV only
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s548_original_basicpitch_S545_new_composers_PREMIDI.py
      - .github/workflows/v273-s548-BP-next-five-source-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_new_composers_original_SPOTIFY_BP_note_output:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen independent Basic Pitch model and inference ABI
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Check exact E3-G3-B3 MIDI pitch names without MIDI
        run: |
          python -m py_compile scripts/s548_original_basicpitch_S545_new_composers_PREMIDI.py
          python -m scripts.s548_original_basicpitch_S545_new_composers_PREMIDI --self-test
      - name: Verify preregistration and original source V88 five-composer WAV proof
        run: |
          gh run download 38658066587 -n s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY -D model/S545 --repo "${{ github.repository }}"
          gh run download 38659307689 -n s547-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S547 --repo "${{ github.repository }}"
      - name: Run fixed unmodified Basic Pitch note predictor on the same SHA-frozen five new piano WAVs
        run: |
          python -u -m scripts.s548_original_basicpitch_S545_new_composers_PREMIDI \
            --manifest model/S545/report.json --s547 model/S547/report.json --out model/S548
          python - <<'PY'
          import json
          r=json.load(open('model/S548/report.json'))
          assert r['status']=='S548_PRETRAINED_BASIC_PITCH_NOTE_EVENTS_ON_THIRD_SOURCE_MAESTRO_PREMIDI'
          assert r['prediction_windows_piano']==5
          assert r['original_WAV_content_SHA_verified']
          assert not r['original_MAESTRO_MIDI_ANNOTATIONS_OPENED']
          assert r['S545_new_composers_before_WAV_MIDI']
          assert r['no_promotion']
          print('S548 PASS five independent composer source Basic Pitch NOTE_NAME predictions frozen BEFORE MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s548-next-five-S545-BasicPitch-original-pitch-names-PREMIDI
          path: model/S548/
          retention-days: 90
