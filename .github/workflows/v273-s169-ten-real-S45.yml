name: S169 ten authentic S45 source proposals and 190 original trained Ridge checkpoints
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s169_s45_ten_original_sources_risks.py'
      - '.github/workflows/v273-s169-ten-real-S45.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s169-ten-original-S45-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine_ten_trained_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s169_s45_ten_original_sources_risks --self-test
      - name: Original S45 304 Ridge models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891039201
          name: v273-series45-specialized-risk-heads
          path: model/S45
      - name: 8 original source-family results and all 152 matched Ridge trained models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198877007
          name: v273-s167-eight-of-sixteen-genuine-source-original-S45-152-Ridge-risks
          path: model/S167
      - name: 2 original Bfirst trained S24/S25 source families
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38199078698
          name: v273-s168-original-S24-S25-Bfirst-trained-source-producers-GOAT
          path: model/S168
      - name: Original GOAT acoustic native events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - name: Source reference and original PR16 on GOAT
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - name: Explicit S5 student adapter, no claiming original S5
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Compute actual ten-family consensus feature and risks (NOT 16-source S45)
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          S167="$(find model/S167 -name eight_of_sixteen_original_ridge_risks_GOAT.npz -print -quit)"
          S168="$(find model/S168 -name original_S24_S25_38_trained_Bfirst_GOAT.npz -print -quit)"
          for f in "$S97" "$S85" "$S135" "$S167" "$S168"; do test -s "$f"; done
          python -u -m scripts.s169_s45_ten_original_sources_risks \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s167 "$S167" --s168 "$S168" --s45 model/S45 \
            --catalog analysis/v273_s45_original_champion_catalog.json --out model/S169
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S169/report.json'))
          assert r['original_family_source_count']==10
          assert r['missing_original_family_sources']==6
          assert r['original_family_specific_Ridge_fits_verified']==190
          assert r['fixed_lambda1_cut0'] and not r['all_original_16_source_votes_available']
          assert not r['GOAT_MIDI_true_K_opened'] and not r['official_S80_promotion']
          with np.load('model/S169/ten_source_S45_original_ridge_GOAT.npz',allow_pickle=False) as z:
              assert z['ten_source_K'].shape==(57,10)
              assert z['original_ridge_risks'].shape==(57,10,2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s169-ten-of-sixteen-original-S45-source-190-original-ridge-models
          path: model/S169/
          retention-days: 90
