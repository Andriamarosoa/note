name: S240 original S29 all 19 held-piece Q routes on 1034 unseen IDMT native events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s240_original_S29_19_pretrained_IDMT.py'
      - 'scripts/s240b_original_IDMT_S97_1034_bridge.py'
      - '.github/workflows/v273-s240-original-S29-on-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s240-original-S29-native-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  S29_full_authentic_19piece_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original numerical and original S20 PyTorch inference
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore certified original S18 trained model outputs on 1034 official native events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38304553740
          name: s238-idmt-original-full-S5-S18-133-checkpoint-4fold-1034-predictions
          path: model/S238
      - name: Restore S234 1034 original IDMT S97 acoustic views
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38302179397
          name: s234-idmt-unseen-original-S97-features-aligned-to-official-freeze-event-IDs
          path: model/S234
      - name: Restore exact V88 canonical original start and end samples
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38303449423
          name: s235-original-V88-native-endpoints-sealed-events
          path: model/S235
      - name: Assemble true 1034-event original S97 input from S234 S235 S238
        run: |
          python -m scripts.s240b_original_IDMT_S97_1034_bridge \
            --s238 model/S238/S238_original_S5_to_S18_true_V88_native_IDMT_1034.npz \
            --s234 model/S234/S234_original_S97_audio_views_on_real_freeze_native_events.npz \
            --s235 model/S235/S235_official_freeze_local_combo_IDMT_new_native_16songs.npz \
            --out model/S240bridge
      - name: Download 38 original S29 frozen Q regressors
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37865173636
          name: v273-series29-stepwise-scheduler
          path: model/S29
      - name: Download all 19 original S20 source PyTorch trained models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37858383973
          name: v273-series20-residual
          path: model/S20
      - name: Run exact original S29 model sequence with 19 branch parents and 1034 new native observations
        run: |
          python -m py_compile scripts/s240_original_S29_19_pretrained_IDMT.py
          python -u -m scripts.s240_original_S29_19_pretrained_IDMT \
            --s29 model/S29 --s20 model/S20 \
            --s18 model/S238/S238_original_S5_to_S18_true_V88_native_IDMT_1034.npz \
            --s97 model/S240bridge/s240_original_IDMT_native_S97_audio.npz \
            --out model/S240
      - name: Confirm 38 original Q and 19 original source models, event alignment, zero labels
        run: |
          python - <<'PY'
          import json,numpy as np
          x=json.load(open('model/S240/report.json'))
          assert x['events']==1034 and x['branches']==19
          assert x['original_S29_Q_models']==38 and x['original_S20_networks']==19
          assert x['original_S29_model_execution']
          assert not x['labels_read'] and not x['refitted']
          assert not x['promotion'] and not x['independent_accuracy_measured']
          with np.load('model/S240/s29_original_all_19_IDMT.npz') as z:
            assert z['predicted_K'].shape==(19,1034)
            assert z['actions'].shape==(19,1034,3)
            assert z['calls'].shape==(19,1034,2)
            assert np.isin(z['predicted_K'],range(7)).all()
          print('S240 PASS authentic 38 S29 Q and 19 S20 models on 1034 unseen native audio events; labels still unopened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s240-original-S29-19piece-1034-IDMT-unlabelled-inference
          path: model/S240/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s240-original-S97-native-1034-audio-join-for-S29-S35
          path: model/S240bridge/
          retention-days: 90
