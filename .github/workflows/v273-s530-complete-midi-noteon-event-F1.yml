name: S530 retrospective full-interval MAESTRO MIDI NoteOn pitch plus onset F1 including negatives
on:
  push:
    branches: [codex/s530-full-maestro-noteon-f1]
    paths:
      - scripts/s530_full_maestro_stream_noteon_pitch_event_F1_audit.py
      - .github/workflows/v273-s530-complete-midi-noteon-event-F1.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  score_all_original_MAESTRO_note_onsets_and_all_S529_emissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original MIDI event matching and numerics
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Selftest single true note cannot match twice and wrong pitch counts as FP and FN
        run: |
          python -m py_compile scripts/s530_full_maestro_stream_noteon_pitch_event_F1_audit.py
          python -m scripts.s530_full_maestro_stream_noteon_pitch_event_F1_audit --self-test
      - name: Original pre-frozen MAESTRO filenames and independently complete MIDI onset matching baseline
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
      - name: Restore all V88 K0 candidate acoustic features and 6 actual songheld trained pitch probabilities
        run: |
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
      - name: Reopen SHA-original complete true MIDI and count every 330 attack and every emitted candidate note pitch
        run: |
          python -u -m scripts.s530_full_maestro_stream_noteon_pitch_event_F1_audit \
            --manifest model/S469/report.json \
            --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json \
            --out model/S530
          python - <<'PY'
          import json
          r=json.load(open("model/S530/report.json"))
          assert r["status"]=="S530_FULL_36SECOND_MAESTRO_NOTEON_PITCH_AND_ATTACK_RETROSPECTIVE"
          assert r["original_true_MIDI_onset_groups_including_8_without_V88"]==330
          assert r["original_frozen_V88_candidate_groups"]==575
          assert len(r["scoring"])==5
          for k,s in r["scoring"].items():
              v=s["total"]
              assert v["groups_true"]==330
              assert v["onset_tp"]+v["onset_fn"]==330
              assert v["note_tp"]+v["note_fp"]>=v["note_tp"]
              assert 0<=v["note_on_pitch_F1"]<=1
          assert r["original_S80_K_and_Live_unchanged"] and r["no_promotion"]
          print("S530 FULL-INTERVAL RETROSPECTIVE NOTE_ON AUDIT PASS (not new blind corpus)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s530-full-330-real-MAESTRO-MIDI-noteon-prec-recall-F1-vs-protected-S529
          path: model/S530/
          retention-days: 90
