name: S365 SHA-verify existing 967 native original+S274 S80 frozen artifacts after stale 12-WAV CI assertion
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - '.github/workflows/v273-s365-verify-967-S80-prelabel-SHA-seal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s365-verify-frozen-967-S80-without-new-inference
  cancel-in-progress: true
jobs:
  audit_SHA_of_complete_S80_predictors_no_new_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Recover already-uploaded complete source-only S80 trace after harmless stale old-WAV-count assertion
        run: |
          gh run download 38331203079 \
            -n chords-967-S349-S353-three-frozen-original-S80-PREXML \
            -D model/S349S353 --repo ${{ github.repository }}
          gh run download 38330563316 \
            -n s358-24-new-IDMT-dataset1-chords-original-V88-official-PREXML \
            -D model/S358 --repo ${{ github.repository }}
      - name: Confirm bit-identical 967 native event IDs and archived original checksum BEFORE enabling first XML read
        run: |
          python - <<'PY'
          import json,hashlib,numpy as np
          from pathlib import Path
          root=Path('model/S349S353')
          r=json.loads((root/'S353/prelabel_comparison.json').read_text())
          official=Path('model/S358/S358_official_V88_dataset1_prospective_24_WAV_predictions.npz')
          old=root/'S352_original/S352_full_original_S80_unseen_IDMT_967_frozen.npz'
          new=root/'S352_twofold/S352_full_original_S80_unseen_IDMT_967_frozen.npz'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert r['status']=='S353_TWO_COMPLETE_S80_S274_CANDIDATES_PRELABEL_IDENTICAL_967_V88_EVENTS'
          assert r['native_events']==967 and r['WAV_count']==24
          assert r['all_results_on_exact_same_original_V88_native_events']
          assert r['truth_XML_or_MIDI_read'] is False and r['official_S80_promotion'] is False
          assert r['original_baseline_freeze_SHA256']==sha(official)
          assert r['original_S80_SHA256']==sha(old)
          assert r['S274_twofold_S80_SHA256']==sha(new)
          with np.load(official,allow_pickle=False) as a,np.load(old,allow_pickle=False) as b,np.load(new,allow_pickle=False) as c:
            assert np.array_equal(a['row_id'],b['row_id'])
            assert np.array_equal(a['row_id'],c['row_id'])
            assert np.array_equal(a['incumbent_K'],b['incumbent_freeze_K'])
            assert np.array_equal(a['incumbent_K'],c['incumbent_freeze_K'])
            assert len(a['row_id'])==967
            assert np.count_nonzero(b['s80_K']!=a['incumbent_K'])==32
            assert np.array_equal(b['s80_K'],c['s80_K'])
          print('S365 PASS 967 original native V88 events, 24 WAVs, 32 candidate modifications, SHA sealed and NO annotations opened')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s365-verified-existing-967-native-24chord-original-S80-SHA-PREXML
          path: |
            model/S349S353/S352_original/
            model/S349S353/S352_twofold/
            model/S349S353/S353/
          retention-days: 90
