name: V10.1 string-query harmonic attention

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v101_string_query_attention.py'
      - 'scripts/run_v101_fixed_pitch_index.py'
      - '.github/workflows/v101-string-query-attention.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  train-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          set -o pipefail
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen V10 spectral caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v100-spectral-cache
          for shard in 0 1 2 3 4 5 6 7; do
            mkdir -p "model/v100-spectral-cache/$shard"
            gh run download 33605122369 --repo "$GITHUB_REPOSITORY" --name "v100-spectral-$shard" --dir "model/v100-spectral-cache/$shard"
          done
          count=$(find model/v100-spectral-cache -name 'v100-spectral-shard-*.npz' | wc -l)
          echo "spectral_shards=$count"
          test "$count" -eq 8
          du -sh model/v100-spectral-cache
      - name: Download frozen stack and V10 report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v84 model/source-v86 model/source-v87 model/source-v88 model/source-v100
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          gh run download 33586296528 --repo "$GITHUB_REPOSITORY" --name v86-state-transition-proposal-pilot --dir model/source-v86
          gh run download 33588164652 --repo "$GITHUB_REPOSITORY" --name v87-causal-candidate-memory-pilot --dir model/source-v87
          gh run download 33589654195 --repo "$GITHUB_REPOSITORY" --name v88-regime-gated-moe-pilot --dir model/source-v88
          gh run download 33605122369 --repo "$GITHUB_REPOSITORY" --name v100-spectral-string-slots --dir model/source-v100
          test -f model/source-v100/v100-spectral-result/report.json
      - name: Compile V10.1
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/train_v101_string_query_attention.py scripts/run_v101_fixed_pitch_index.py
      - name: Train V10.1 and evaluate locked12 once
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/run_v101_fixed_pitch_index.py \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --v100-report model/source-v100/v100-spectral-result/report.json \
            --cache-dir model/v100-spectral-cache \
            --output-dir model/v101-string-query-result \
            2>&1 | tee model/v101-string-query-train.log
      - name: Verify isolation and summarize V10.1
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model/v101-string-query-result/report.json').read_text())
          a=d['architecture']; c=d['configuration']; data=d['data']; l=d['locked12']
          assert a['base_trainable'] is False
          assert a['runtime_inputs_use_annotations'] is False
          assert a['string_labels_training_only'] is True
          assert a['pitch_labels_training_only'] is True
          assert a['ordinal_decoder_consumes_string_evidence'] is True
          assert a['offset_stream_executed'] is False
          assert a['offset_weights_modified'] is False
          assert c['decode_mode_selected_on_locked_validation'] is False
          assert data['composition_group_leakage'] is False
          assert data['full_train_track_count'] == 240
          assert data['cache_shard_count'] == 8
          assert data['pitch_supervision']['slot_pitch_mask_agreement'] >= 0.999
          assert data['pitch_supervision']['indexing_fix'] == 'global_cluster_row'
          print('decode_mode', c['decode_mode'])
          print('epochs_ran', c['epochs_ran'])
          print('parameters', a['v101_trainable_parameters'])
          print('tf_tokens', a['tf_token_grid'], a['tf_token_count'])
          print('pitch_supervision', data['pitch_supervision'])
          print('holdout_pitch', d['holdout_pitch'])
          print('cardinality', l['v101_cardinality'])
          print('string_slots', l['v101_string_slots'])
          for regime in ('global','solo','comp'):
              v91=l['v91_metrics'][regime]
              v10=l['v100_metrics'][regime]
              v101=l['v101_metrics'][regime]
              oracle=l['oracle_exact_cardinality_metrics'][regime]
              print(regime,
                    'v91', f"{v91['f1']:.6f}",
                    'v10', f"{v10['f1']:.6f}",
                    'v101', f"{v101['f1']:.6f}",
                    'delta_v10', f"{v101['f1']-v10['f1']:+.6f}",
                    'oracle', f"{oracle['f1']:.6f}",
                    'P', f"{v101['precision']:.6f}",
                    'R', f"{v101['recall']:.6f}",
                    'pred_ref', f"{v101['prediction_reference_ratio']:.6f}")
          PY
      - name: Upload V10.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v101-string-query-attention
          path: |
            model/v101-string-query-train.log
            model/v101-string-query-result/report.json
            model/v101-string-query-result/v101-string-query-attention.weights.h5
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
