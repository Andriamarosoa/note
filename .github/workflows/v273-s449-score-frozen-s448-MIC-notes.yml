name: S449 score frozen authentic MIC notes S446 vs untouched S437 by true K
on:
  push:
    branches: [codex/s448-s446-real-mic-transfer]
    paths:
      - 'scripts/s449_independent_original_MIC_S446_named_note_audit.py'
      - '.github/workflows/v273-s449-score-frozen-s448-MIC-notes.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s449-paired-real-mic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independently_rescore_same_174_real_MIC_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Independent per-note correction/regression audit unit test
        run: |
          python -m py_compile scripts/s449_independent_original_MIC_S446_named_note_audit.py
          python -m scripts.s449_independent_original_MIC_S446_named_note_audit --self-test
      - name: Restore frozen S448 notes before any MIC truth
        run: |
          gh run download 38528850597 -n s448-authentic-12-MIC-s446-note-sets-frozen-NO-ANNOTATION -D model/S448 --repo ${{ github.repository }}
          gh run download 38523251921 -n s437-twelve-real-guitar-MIC-K-balanced-frozen-note-names-no-truth -D model/S437 --repo ${{ github.repository }}
          test -f model/S448/S448_FROZEN_REAL_MIC_NOTE_NAMES.jsonl
          test -f model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl
      - name: Restore unchanged native source timing and original S80 source K
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Now open official GuitarSet JAMS after S448 output freeze
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Paired real microphone chord identity truth audit S449 without model fitting
        run: |
          python -u -m scripts.s449_independent_original_MIC_S446_named_note_audit \
            --s437-names model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl \
            --s437-report model/S437/report.json \
            --s448-names model/S448/S448_FROZEN_REAL_MIC_NOTE_NAMES.jsonl \
            --s448-report model/S448/report.json \
            --original-events model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S449
          python - <<'PY'
          import json
          r=json.load(open('model/S449/report.json'))
          assert r['status']=='S449_S446_REAL_GUITAR_MIC_PAIRED_RETROSPECTIVE_AUDIT'
          assert r['score']['original_S437']['all_events']==174
          assert r['score']['original_S437']['poly_K2plus_whole_chords_correct']==27
          assert r['original_S80_K_unchanged'] and r['exactK_regressions']==0
          assert not r['promotion'] and r['S438_labels_known_from_prior_work_not_a_true_blind_holdout']
          print('S449 paired real MIC note identification audited; S80 exactly preserved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s449-actual-real-MIC-songheld-S446-vs-S437-note-identity-audit
          path: model/S449/
          retention-days: 90
