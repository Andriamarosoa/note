name: S244 original fundamental 58D recovered on true 1034 unseen IDMT native events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s244_native_IDMT_original_fundamental58.py'
      - '.github/workflows/v273-s244-fundamental58-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s244-original58-native-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_harmonic_fundamental_58:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original spectrogram feature dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Restore original S234 1034-event native audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38302179397
          name: s234-idmt-unseen-original-S97-features-aligned-to-official-freeze-event-IDs
          path: model/S234
      - name: Restore exact V88 original native event boundaries and unchanged official freeze predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38303449423
          name: s235-original-V88-native-endpoints-sealed-events
          path: model/S235
      - name: Restore SHA-pinned sixteen original WAVs S231 with no XML content
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38299545404
          name: s231-IDMT-ranks33to48-unopened-song-WAV-feature-hash-preseal
          path: model/S231
      - name: Recompute exact original fundamental-bank 58D on identical canonical native IDMT group instants
        run: |
          python -m py_compile scripts/s244_native_IDMT_original_fundamental58.py
          python -u -m scripts.s244_native_IDMT_original_fundamental58 \
            --s234 model/S234/S234_original_S97_audio_views_on_real_freeze_native_events.npz \
            --s235 model/S235/S235_official_freeze_local_combo_IDMT_new_native_16songs.npz \
            --s231 model/S231/report.json \
            --out model/S244
      - name: Verify original source spectral family inputs and sealed labels
        run: |
          python - <<'PY'
          import json,numpy as np,hashlib
          from pathlib import Path
          r=json.load(open('model/S244/report.json'))
          assert r['original_reference_events']==1034 and r['original_feature_count']==58
          assert r['original_fundamental_count']==58
          assert r['original_primary_max_scaled_deviation_from_S234']<1e-3
          assert r['no_XML_or_MIDI_content_read'] and r['no_new_training']
          assert not r['independent_ExactK_measured'] and not r['S80_promoted']
          p=Path('model/S244/S244_original_fundamental58_on_1034_native_IDMT.npz')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['original_fundamental_audio_SHA256']
          with np.load(p,allow_pickle=False) as z:
            assert z['fundamental'].shape==(1034,58) and z['features'].shape==(1034,58)
            assert len(z['feature_names'])==58 and len(z['row_id'])==1034
          print('S244 PASS original S1-S4 acoustic/fundamental native 58D source, labels unopened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s244-idmt-original-58D-fundamental-all-1034-native-unlabelled
          path: model/S244/
          retention-days: 90
