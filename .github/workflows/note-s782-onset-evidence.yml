name: S782 causal missed-onset spectral and harmonic taxonomy
on:
  push:
    branches: [codex/note-s782-onset-miss-causal-forensics]
    paths:
      - scripts/s782_missed_onset_acoustic_forensics.py
      - test/test_s782_missed_onset_forensics.py
      - .github/workflows/note-s782-onset-evidence.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen NOTE CPU runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify diagnostic evidence and no-future causality tests
        run: |
          python -m compileall -q scripts/s782_missed_onset_acoustic_forensics.py
          python -m unittest -v test.test_s782_missed_onset_forensics
      - name: Preflight stable report schema before CAL32
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/s782_missed_onset_acoustic_forensics.py').read_text()
          assert 'schema="S782_CAUSAL_MISSED_ONSET_DIAGNOSTIC_CAL32"' in s
          assert 'labels_used_only_after_prediction=True' in s
          print('S782_SCHEMA_PREFLIGHT_PASS')
          PY
      - name: Restore signed S708/S707 snapshots
        run: |
          mkdir -p /tmp/s782/s708 /tmp/s782/s707
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s782/s708
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s782/s707
          test -s /tmp/s782/s708/report.json
          test -s /tmp/s782/s708/s708_selected.pt
          test -s /tmp/s782/s707/s675_hazard.joblib
      - name: Audit missed attacks by composition, pitch register, true polyphony and harmonic overlap
        run: |
          python -m scripts.s782_missed_onset_acoustic_forensics \
            --s708-dir /tmp/s782/s708 \
            --offset-checkpoint /tmp/s782/s707/s675_hazard.joblib \
            --out /tmp/s782/report
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s782/report/report.json'))
          assert r['complete'] and r['cal_recordings_done']==32
          assert r['schema']=='S782_CAUSAL_MISSED_ONSET_DIAGNOSTIC_CAL32'
          assert r['labels_used_only_after_prediction'] and r['source_MIDI_immutable']
          assert r['diagnostic_not_realtime_prediction']
          assert not r['promoted'] and not r['LIVE_changed'] and not r['TEST_opened'] and not r['HELD_opened']
          assert set(r['results']['by_composition'])=={'BN2','Jazz2'}
          assert sum(z['total'] for z in r['results']['by_composition'].values())==r['results']['all']['total']
          print('S782_CAUSAL_MISS_TAXONOMY_VERIFIED',r['results']['all']['missed'])
          PY
      - name: Preserve missed-onset causal evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S782_MISSED_ONSET_SPECTRAL_TAXONOMY
          path: /tmp/s782/report/report.json
          retention-days: 45
          if-no-files-found: warn
