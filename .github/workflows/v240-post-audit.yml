name: V24 corrected selection audit
on:
  push:
    branches: [v240-post-audit]
    paths:
      - 'scripts/audit_v240_selection.py'
      - 'test/test_v240_selection_audit.py'
      - '.github/workflows/v240-post-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install 'numpy>=1.23.5,<2'
      - name: Test audit
        env: {PYTHONPATH: '.:src'}
        run: python -m unittest test.test_v240_selection_audit test.test_v240_candidate_subset -v
      - name: Verify canonical source run
        uses: actions/github-script@v7
        with:
          script: |
            const {data:r}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:34168832668});
            if(r.head_sha!=='980a052e6cd9eee7896962ceb3a458e0ae258334'||r.conclusion!=='success') throw new Error('Wrong or incomplete canonical V24 run');
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download corrected V24 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v240-categorical-k-candidate-subset-fold-*
          path: model/v240-all
          repository: Andriamarosoa/note
          run-id: 34168832668
          github-token: ${{ github.token }}
      - name: Audit saved predictions only
        env: {PYTHONPATH: '.:src'}
        run: |
          set -o pipefail
          python -m scripts.audit_v240_selection --dataset-dir data/GuitarSet --cache-dir model/v100-spectral-cache --fold-dir model/v240-all --output-dir model/v240-audit | tee v240-audit.log
          cat model/v240-audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v240-selection-audit
          path: |
            model/v240-audit
            v240-audit.log
          retention-days: 90
