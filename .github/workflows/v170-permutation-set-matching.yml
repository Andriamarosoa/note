name: V17 permutation-invariant set matching outer-clean

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v170_permutation_set_matching.py'
      - 'scripts/run_v170_reporting_compat.py'
      - 'scripts/summarize_v170_permutation_set_matching.py'
      - 'scripts/audit_v170_cardinality_after.py'
      - '.github/workflows/v170-permutation-set-matching.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  V16_REFERENCE_RUN: '33778269817'

jobs:
  preflight:
    name: V17 graph and set-loss preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V17 pipeline
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v170_permutation_set_matching.py
          python -m py_compile scripts/run_v170_reporting_compat.py
          python -m py_compile scripts/summarize_v170_permutation_set_matching.py
          python -m py_compile scripts/audit_v170_cardinality_after.py
      - name: Audit graph, permutation invariance and one training batch
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          python - <<'PY'
          import numpy as np
          import tensorflow as tf
          from scripts import train_v170_permutation_set_matching as v

          assert v.EVENT_QUERIES == 6
          assert len(v.PERMUTATIONS) == 720
          model, weights, shape = v._build_model()
          assert isinstance(model.output, dict)
          assert 'event_set' in model.output
          assert 'event_count_norm' in model.output
          assert not any('cardinality' in x.lower() for x in model.output.keys())
          assert model.get_layer('v160_global_reconciliation_attention') is not None

          b = 2
          yt = np.zeros((b, 6, v.SET_WIDTH), dtype=np.float32)
          yt[:, :2, 0] = 1.0
          yt[:, :2, v.SET_VALID_OFFSET] = 1.0
          for row in range(b):
              for q in range(2):
                  yt[row, q, v.SET_TIME_OFFSET + (q + row) % v.TIME_FRAMES] = 1.0
                  yt[row, q, v.SET_CANDIDATE_OFFSET + (3 * q + row) % v.MAX_CANDIDATES] = 1.0

          rng = np.random.default_rng(17071)
          yp = np.zeros_like(yt)
          yp[:, :, 0] = rng.uniform(0.05, 0.95, size=(b, 6))
          yp[:, :, v.SET_VALID_OFFSET] = 1.0
          t = rng.uniform(0.01, 1.0, size=(b, 6, v.TIME_FRAMES)).astype(np.float32)
          t /= t.sum(axis=2, keepdims=True)
          c = rng.uniform(0.01, 1.0, size=(b, 6, v.MAX_CANDIDATES)).astype(np.float32)
          c /= c.sum(axis=2, keepdims=True)
          yp[:, :, v.SET_TIME_OFFSET:v.SET_CANDIDATE_OFFSET] = t
          yp[:, :, v.SET_CANDIDATE_OFFSET:] = c
          loss = v._set_loss()
          a = np.asarray(loss.call(tf.constant(yt), tf.constant(yp)))
          bval = np.asarray(loss.call(tf.constant(yt[:, [2,0,5,1,4,3], :]), tf.constant(yp)))
          np.testing.assert_allclose(a, bval, rtol=1e-5, atol=1e-6)

          x = {}
          for tensor in model.inputs:
              name = tensor.name.split(':', 1)[0]
              dims = [2] + [int(d) if d is not None else 1 for d in tensor.shape[1:]]
              if 'mask' in name:
                  x[name] = np.ones(dims, dtype=np.float32)
              else:
                  x[name] = rng.normal(0.0, 0.2, size=dims).astype(np.float32)
          y = {}
          for slot in range(6):
              y[f'string_{slot}'] = np.zeros((2, 1), dtype=np.float32)
              y[f'pitch_{slot}'] = np.zeros((2, 1), dtype=np.float32)
              y[f'time_{slot}'] = np.full((2, v.TIME_FRAMES), 1.0 / v.TIME_FRAMES, dtype=np.float32)
          y['event_set'] = yt
          y['event_count_norm'] = np.full((2, 1), 2.0 / 6.0, dtype=np.float32)
          result = model.train_on_batch(x, y, return_dict=True)
          if not all(np.all(np.isfinite(np.asarray(value))) for value in result.values()):
              raise RuntimeError(f'non-finite smoke loss: {result}')
          print('params', model.count_params(), 'tf_shape', shape, 'losses', result)
          PY

  fold:
    name: V17 outer fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train and evaluate outer-clean V17 fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "model/v170-fold-${{ matrix.fold }}"
          python -B scripts/run_v170_reporting_compat.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --output-dir "model/v170-fold-${{ matrix.fold }}" \
            2>&1 | tee "model/v170-fold-${{ matrix.fold }}/train.log"
      - name: Verify V17 fold protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f='${{ matrix.fold }}'
          r=json.loads(Path(f'model/v170-fold-{f}/report-fold-{f}.json').read_text())
          p=r['protocol']
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['outer_fold_used_for_training'] is False
          assert p['outer_fold_used_for_epoch_selection'] is False
          assert p['runtime_inputs_use_annotations'] is False
          assert p['categorical_cardinality_head_exists'] is False
          assert p['presence_threshold_tuned'] is False and p['presence_threshold'] == 0.5
          assert p['permutation_invariant_set_matching'] is True
          assert p['ordered_query_presence_targets'] is False
          assert p['set_matching_permutations'] == 720
          card=r['strata']['aggregate']['v170']['cardinality']
          poly=card.get('poly_cluster_accuracy', card.get('poly_accuracy', card.get('poly_exact_accuracy')))
          print('fold',f,'epochs',r['data']['selected_epochs'],
                'v104',r['strata']['aggregate']['v104']['metrics']['global']['f1'],
                'v170',r['strata']['aggregate']['v170']['metrics']['global']['f1'],
                'poly',poly,
                'k5',r['per_true_k']['5']['v170']['exact'],
                'k6',r['per_true_k']['6']['v170']['exact'])
          PY
      - name: Upload V17 fold even after terminal reporting failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v170-permutation-set-fold-${{ matrix.fold }}
          path: model/v170-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: warn
          retention-days: 30

  summarize:
    name: Summarize V17 outer-clean
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install summary dependency
        run: python -m pip install 'numpy<2.0'
      - name: Download V17 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v170-permutation-set-fold-*
          path: model/v170-folds
          merge-multiple: false
      - name: Summarize five folds
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p model/v170-summary
          python -B scripts/summarize_v170_permutation_set_matching.py --input-dir model/v170-folds --output-dir model/v170-summary 2>&1 | tee model/v170-summary/summary.log
      - name: Verify aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v170-summary/report.json').read_text())
          assert r['data']['clusters'] == 76768
          assert r['protocol']['permutation_invariant_set_matching'] is True
          assert r['protocol']['historical_validation_or_locked12_indexed_or_evaluated'] is False
          print('v104',r['strata']['aggregate']['v104']['f1'])
          print('v170',r['strata']['aggregate']['v170']['f1'])
          print('poly',r['cardinality']['v170']['poly_accuracy'])
          print('k5',r['per_true_k']['5']['v170']['exact'])
          print('k6',r['per_true_k']['6']['v170']['exact'])
          print('promotion',r['comparison']['promotion_candidate'])
          PY
      - name: Upload V17 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v170-permutation-set-summary
          path: model/v170-summary
          if-no-files-found: warn
          retention-days: 30

  after_audit:
    name: Deep cardinality audit after V17
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download frozen V16 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v160-parallel-coverage-fold-*
          path: model/v160-reference
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.V16_REFERENCE_RUN }}
          github-token: ${{ github.token }}
      - name: Download V17 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v170-permutation-set-fold-*
          path: model/v170-folds
          merge-multiple: false
      - name: Run same-protocol after audit
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p model/v170-after-audit
          python -B scripts/audit_v170_cardinality_after.py \
            --v16-input-dir model/v160-reference \
            --v17-input-dir model/v170-folds \
            --cache-dir model/v100-spectral-cache \
            --output-dir model/v170-after-audit \
            2>&1 | tee model/v170-after-audit/audit.log
      - name: Verify after-audit invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v170-after-audit/report.json').read_text())
          p=r['protocol']
          assert p['audit_only'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['locked12_indexed_or_evaluated'] is False
          assert p['threshold_tuned'] is False
          assert p['candidate_ranking_changed'] is False
          assert p['same_rows_v16_v17'] is True
          print(json.dumps(r['comparison'], indent=2, sort_keys=True))
          PY
      - name: Upload V17 after-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v170-cardinality-after-audit
          path: model/v170-after-audit
          if-no-files-found: warn
          retention-days: 30
