name: S492 independently score two frozen source K0 only rescue policies vs true notes and unannotated rows
on:
  push:
    branches: [codex/s492-shadow-K0-paired-positive-vs-unknown]
    paths:
      - scripts/s492_audit_shadow_K0_birth_candidate_true_vs_unknown.py
      - .github/workflows/v273-s492-true-vs-unknown-K0-rescue-postfreeze.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent_true_attacks_and_unlabelled_candidate_risk_after_K0_shadow_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load numeric ABI and validate source K0 correction arithmetic
        run: |
          python -m pip install numpy==1.26.4
          python -m py_compile scripts/s492_audit_shadow_K0_birth_candidate_true_vs_unknown.py
          python -m scripts.s492_audit_shadow_K0_birth_candidate_true_vs_unknown --self-test
      - name: Restore immutable source K0 proposals frozen WITHOUT EXTERNAL TRUTH
        run: |
          gh run download 38576329909 \
            -n s491-true-guitar-S80-and-piano-V88-K0only-BasicPitch-one-to-one-frozen-NOXML \
            -D model/S491 --repo ${{ github.repository }}
      - name: Restore paired original real IDMT guitar XML and MAESTRO piano MIDI true attacks only AFTER proposal freeze
        run: |
          gh run download 38570219836 \
            -n s488-original-IDMT-45-true-guitar-21-poly-BasicPitch-note-set-vs-S80-ExactK \
            -D model/S488 --repo ${{ github.repository }}
          gh run download 38560885111 \
            -n s476-MAESTRO-original-V88-K-new-onsets-vs-sounding-322-same-events-audit \
            -D model/S476 --repo ${{ github.repository }}
      - name: Compare two immutable K0-only policies for actual positive corrections AND unannotated changes
        run: |
          python -u -m scripts.s492_audit_shadow_K0_birth_candidate_true_vs_unknown \
            --guitar model/S491/S491_guitar_S80_SOURCE_K0_ONLY_FROZEN.npz \
            --piano model/S491/S491_piano_V88_SOURCE_K0_ONLY_FROZEN.npz \
            --source-report model/S491/report.json \
            --s488 model/S488/S488_45_TRUE_GUITAR_SOURCE_NOTESETS_PAIRED.jsonl \
            --s488report model/S488/report.json \
            --s476 model/S476/S476_ORIGINAL_S470_PIANO_NEW_NOTE_VS_SOUNDING_322.jsonl \
            --s476report model/S476/report.json \
            --out model/S492
          python - <<'PY'
          import json
          r=json.load(open('model/S492/report.json'))
          assert r['status']=='S492_SHA_FROZEN_SOURCE_K0_ONLY_POSITIVE_VS_UNANNOTATED_AUDIT'
          assert r['no_new_blind_validation_claim'] and r['no_unknown_trueK0_or_false_event_assumption']
          assert r['two_policy_results_both_reported_no_selection'] and r['no_promotion']
          for name in ('guitar_S80','piano_V88'):
            for policy in ('birth','active30'):
              p=r['by_source'][name][policy]
              assert p['source_K_nonzero_ever_modified']==0
              assert p['annotated_true_attack_K_metrics']['regressed']==0
          print('S492 source real positive K0 rescues separated from false-positive unknown risks')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s492-IDMT-and-MAESTRO-two-K0-only-shadow-gates-genuine-positive-vs-UNKNOWN
          path: model/S492/
          retention-days: 90
