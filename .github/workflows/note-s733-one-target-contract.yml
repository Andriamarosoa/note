name: S733 sequential one-target neural selector unit contract
on:
  push:
    branches: [codex/note-s733-sequential-specialist]
    paths:
      - src/causal_note/s733_one_target_selector.py
      - test/test_s733_one_target_selector.py
      - .github/workflows/note-s733-one-target-contract.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no_train_no_promotion_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install PyTorch CPU
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check syntax and target isolation / OOF contracts
        run: |
          python -m compileall -q src/causal_note/s733_one_target_selector.py
          python -m unittest -v test.test_s733_one_target_selector
