name: S210 verify recovered original S29 to true S35 trained router
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s210_true_S29_S35_connector.py'
      - '.github/workflows/v273-s210-original-s29-s35.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s210-true-original-s29-s35-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen_S29_S35:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original compatible numerical, torch CPU environment
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore S209 authentic S29 new-wave output from successful pinned run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38238398102
          name: s209-original-S29-on-recovered-S18-new-audio-NO-promotion
          path: model/S209
      - name: Restore unchanged trained original S35 experts and Q gates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37868356632
          name: v273-series35-extended-head-router
          path: model/S35
      - name: Run original S35 router fed by authentic S29 on four S18 fold branches
        run: |
          set -euo pipefail
          test -s model/S209/s29_original_all_19_GOAT.npz
          test -d model/S35/models
          python -m scripts.s210_true_S29_S35_connector \
            --s209 model/S209/s29_original_all_19_GOAT.npz \
            --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz \
            --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz \
            --s35 model/S35 \
            --out model/S210
      - name: Confirm 19 original branches and non-promotion
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S210/report.json'))
          assert r['original_S35_expert_checkpoints']==36
          assert r['original_S35_quality_gate_checkpoints']>0
          assert r['branches']==19 and r['events']==57
          assert r['source_S20_for_S29_proxy_eliminated']
          assert not r['S80_promoted'] and not r['full_S80_reconstructed']
          assert not r['labels_read'] and not r['models_refitted']
          with np.load('model/S210/original_s29_to_s35_GOAT.npz',allow_pickle=False) as z:
              assert z['S35_K'].shape==(19,57) and z['S35_actions'].shape==(19,57,3)
          print('S210 PASS: true S29 source replaced S20 surrogate under trained S35 fold Q gates')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s210-original-S29-original-S35-19-branches-experimental
          path: model/S210/
          retention-days: 90
