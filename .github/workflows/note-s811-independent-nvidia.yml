name: S811 blind independent NVIDIA audit of S810 axis F1
on:
  push:
    branches: [codex/note-s811-blind-nvidia-s810-error-attribution]
    paths:
      - scripts/s811_blind_nvidia.py
      - scripts/s811_review_critique.py
      - series/S811/fit80_blind_evidence.md
      - .github/workflows/note-s811-independent-nvidia.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Ensure unbiased context and provenance
        run: |
          python -m compileall -q scripts/s811_blind_nvidia.py scripts/s811_review_critique.py
          python - <<'PY'
          from pathlib import Path
          from scripts.s811_blind_nvidia import MODELS,PROMPT,context,h
          e=context(Path('series/S811/fit80_blind_evidence.md'))
          assert len(MODELS)==len(set(MODELS.values()))==3
          assert 'S810' in e and '154245' in e and '142827' in e
          assert 'preferred solution' not in PROMPT.lower()
          print('S811_IDENTICAL_MODEL_INPUT_SHA',h(e))
          print('S811_NEUTRAL_PROMPT_SHA',h(PROMPT))
          PY
          python -m scripts.verify_series_reports --series S811
  blind_nvidia:
    if: needs.smoke.result == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[blind-s810]'))
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        role: [model_a, model_b, model_c]
    name: S811 independent NVIDIA ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Consult provider once; shared evidence, no peer opinions
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -m scripts.s811_blind_nvidia \
            --role ${{ matrix.role }} \
            --evidence series/S811/fit80_blind_evidence.md \
            --out /tmp/s811/reviews/review_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S811_NVIDIA_${{ matrix.role }}_UNVERIFIED_REVIEW
          path: /tmp/s811/reviews/review_${{ matrix.role }}.json
          if-no-files-found: warn
          retention-days: 60
  skeptical_triage:
    if: always() && needs.smoke.result == 'success' && needs.blind_nvidia.result == 'success'
    needs: [smoke,blind_nvidia]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S811_NVIDIA_*_UNVERIFIED_REVIEW
          path: /tmp/s811/reviews
          merge-multiple: true
      - name: Verify independent context and reject automatic model consensus
        run: |
          python -m scripts.s811_review_critique \
            --evidence series/S811/fit80_blind_evidence.md \
            --reviews /tmp/s811/reviews \
            --out /tmp/s811/triage.json
      - uses: actions/upload-artifact@v4
        with:
          name: S811_INDEPENDENT_NVIDIA_CRITIQUE_NOT_A_PROMOTION
          path: /tmp/s811/triage.json
          if-no-files-found: error
