name: V27.3 S36b piece-held acoustic risk judge
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series36b-risk.yml'
      - 'scripts/train_v273_s36b_crosspiece_risk.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible source and risk learner dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0 joblib==1.4.2
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit-test all observed piece/route risk features and no H9
        run: python -m scripts.train_v273_s36b_crosspiece_risk --self-test
      - name: Download original 42-frame acoustic and 335-dimensional expert input folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Fetch original reference and all 18-head predictions/paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37868356632 --repo "$GITHUB_REPOSITORY" --name v273-series35-extended-head-router --dir model/S35
      - name: Fit each piece-held risk head and audit global/poly K0 K6 regressions
        run: >-
          python -m scripts.train_v273_s36b_crosspiece_risk
          --features model/features
          --s18 model/S18/predictions.npz
          --s35 model/S35/predictions.npz
          --routes model/S35/routing.npz
          --output model/S36b
      - name: Publish complete learned risk scores
        run: cat model/S36b/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series36b-risk-judge
          path: model/S36b/
          retention-days: 90
