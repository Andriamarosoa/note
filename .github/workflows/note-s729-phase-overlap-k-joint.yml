name: S729 phase-reset source overlap vs no-phase matched controls, Exact-K + six-score CAL audit
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - src/causal_note/s729_phase_overlap_evidence.py
      - scripts/s729_phase_source_exactk_training.py
      - test/test_s729_phase_overlap_evidence.py
      - .github/workflows/note-s729-phase-overlap-k-joint.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s729-phase-overlap-joint-exactk
  cancel-in-progress: true
jobs:
  S729_FIT_train_CAL_choice_independent_event_comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original CPU neural and GuitarSet protocol deps
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove phase-reset from real octave excitation vs uniform parent phase and S708 logits
        run: |
          python -m compileall -q src/causal_note/s729_phase_overlap_evidence.py scripts/s729_phase_source_exactk_training.py
          python -m unittest -v test.test_s729_phase_overlap_evidence test.test_s720_poly_onset_training test.test_s718_onset_audit test.test_s713_metric_contract
      - name: Fetch signed original S708 and S707 75D specialist (no new reference)
        run: |
          mkdir -p /tmp/s729/s708 /tmp/s729/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s729/s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s729/s707
          test -s /tmp/s729/s708/report.json
          test -s /tmp/s729/s708/s708_selected.pt
          test -s /tmp/s729/s707/s675_hazard.joblib
      - name: FIT-train causal 32D spectral phase candidate and exactly matched control with Exact-K
        run: |
          python -m scripts.s729_phase_source_exactk_training --s708-dir /tmp/s729/s708 --offset-checkpoint /tmp/s729/s707/s675_hazard.joblib --out /tmp/s729/results
      - name: Enforce immutable baseline, true model training and no automatic promotion
        if: success()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/s729/results/report.json')
          a=json.loads(p.read_text())
          assert a['promoted'] is False and a['TEST_opened'] is False
          assert a['CAL_only_model_selection'] and a['learned_ExactK_conditioning_preserved']
          assert set(a['train'])=={'no_phase_epoch1','no_phase_epoch2','with_phase_epoch1','with_phase_epoch2'}
          assert a['CAL']['selected'] in a['CAL']['eligible']
          assert all(len(a[x]['tracks'])==n for x,n in (('HELD',32),('DEV',12)))
          print('S729_FROZEN_CAL_EXACT_K_COOPERATION_VALIDATED',
              json.dumps({'selected':a['CAL']['selected'],
                'eligible':a['CAL']['eligible'],
                'shadow_qualifies':a['shadow_qualifies'],
                'cal_six_scores':{name:{k:round(row[k],5) for k in (
                    'onset_f1','exact_k','active_exact_k','offset_accuracy',
                    'full_note_f1','frame_pitch_f1')} for name,row in a['CAL']['scores'].items()}}),flush=True)
          PY
      - name: Archive 320D independently trained heads and comparative source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S729_CAUSAL_PHASE_HARMONIC_OVERLAP_MATCHED_EXACTK_ABLATION
          path: /tmp/s729/results
          retention-days: 45
          if-no-files-found: warn
