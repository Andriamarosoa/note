name: S800 FIT80 five-head OOF real-evidence replay (signed S795 parity)
on:
  push:
    branches: [codex/note-s800-fit-oof-replay-traces]
    paths:
      - scripts/s800_oof_trace.py
      - scripts/s800_fit_oof_replay.py
      - scripts/s800_verify_oof.py
      - scripts/s800_six_role_audits.py
      - test/test_s800_oof_trace.py
      - .github/workflows/note-s800-fit-oof-traces.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install scientific tests dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and exercise immutable FIT OOF evidence, source timing
        run: |
          python -m compileall -q scripts/s800_oof_trace.py scripts/s800_fit_oof_replay.py scripts/s800_verify_oof.py scripts/s800_six_role_audits.py test/test_s800_oof_trace.py
          python -m unittest -v test.test_s800_oof_trace test.test_s795_activek_experts test.test_s793_zero_added_latency
          python -m scripts.verify_series_reports --series S800
  fit80_replay:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install identical S795 model runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore IMMUTABLE S708 checkpoint, offset hazard and frozen S795 FIT reference
        run: |
          mkdir -p /tmp/s800/s708 /tmp/s800/offset /tmp/s800/s795
          gh run download 39094682419 --repo Andriamarosoa/note \
            --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s800/s708
          gh run download 39059008484 --repo Andriamarosoa/note \
            --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s800/offset
          gh run download 39340511467 --repo Andriamarosoa/note \
            --name S795_ACTIVEK_MULTIHEAD_REAL_MIDI256_FIT80_CAL32 --dir /tmp/s800/s795
          test -s /tmp/s800/s708/report.json
          test -s /tmp/s800/s708/s708_selected.pt
          test -s /tmp/s800/offset/s675_hazard.joblib
          test -s /tmp/s800/s795/experiment/report.json || test -s /tmp/s800/s795/report.json
      - name: Replay unchanged S795 training FIT80 and persist OOF-by-fragment
        run: |
          test -f /tmp/s800/s795/experiment/report.json && \
            cp /tmp/s800/s795/experiment/report.json /tmp/s800/s795_frozen.json || \
            cp /tmp/s800/s795/report.json /tmp/s800/s795_frozen.json
          python -m scripts.s800_fit_oof_replay \
            --s708 /tmp/s800/s708 \
            --s795-report /tmp/s800/s795_frozen.json \
            --offset-checkpoint /tmp/s800/offset/s675_hazard.joblib \
            --out /tmp/s800/replay
      - name: Verify EVERY OOF partition and original FIT80 source counts
        run: |
          python -m scripts.s800_verify_oof \
            --report-dir /tmp/s800/replay \
            --out /tmp/s800/verification.json
      - name: Archive whole authentic FIT OOF probability bank (research, private)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES
          path: /tmp/s800/replay/fit_oof/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Archive fail-closed identity checks, signed baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S800_FIT80_PARITY_AND_MANIFEST
          path: |
            /tmp/s800/replay/report.json
            /tmp/s800/verification.json
            /tmp/s800/s795_frozen.json
          if-no-files-found: warn
          retention-days: 45
  six_audits:
    if: always()
    needs: [smoke,fit80_replay]
    name: S800 independent ${{ matrix.role }} forensic audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch FIT evidence checksums (fail closed if replay failed)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: S800_FIT80_PARITY_AND_MANIFEST
          path: /tmp/s800/input
      - name: Six independent evidence-consuming role audits
        run: |
          python -m scripts.s800_six_role_audits \
            --role ${{ matrix.role }} \
            --report /tmp/s800/input/report.json \
            --verification /tmp/s800/input/verification.json \
            --out /tmp/s800/audits/role_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S800_AUDIT_${{ matrix.role }}
          path: /tmp/s800/audits/role_${{ matrix.role }}.json
          if-no-files-found: warn
  consensus:
    if: always()
    needs: [smoke,fit80_replay,six_audits]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S800_AUDIT_*
          path: /tmp/s800/audits
          merge-multiple: true
      - name: Require six independent PASS audit records and reject missing evidence
        run: |
          python -m scripts.s787_audit_consensus \
            --reports-dir /tmp/s800/audits \
            --out /tmp/s800/consensus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S800_FINAL_SIX_AUDIT_CONSENSUS
          path: /tmp/s800/consensus.json
