name: S220 independent Counter replay of sparse specialist S46 branch fusion
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s220_independent_sparse_fold_proposal_audit.py'
      - '.github/workflows/v273-s220-independent-sparse-S46.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s220-independent-sparse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_sparse_counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only numpy
        run: python -m pip install numpy==1.26.4
      - name: Original S215 19 branches and source S46 decisions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38242983478
          name: s215-complete-16-original-source-S45-S46-all19-branches
          path: model/S215
      - name: Frozen S217 consensus S18 parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294189867
          name: s217-19branch-piece-neutral-frozen-S18-S46-consensus-NO-accuracy
          path: model/S217
      - name: Saved S219 conditional specialist S46 deployment proposal
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294699823
          name: s219-conditional-specialist-S46-19-branch-4fold-candidate
          path: model/S219
      - name: Independently recompute each 193-policy cell using per-fold Counter votes
        run: >-
          python -m scripts.s220_independent_sparse_fold_proposal_audit
          --s215 model/S215
          --s217 model/S217/one_piece_neutral_193_policy_prediction.npz
          --s219 model/S219/conditional_sparse_193_policy_prediction.npz
          --out model/S220
      - name: Assert all independent S46 evidence and no unseen accuracy claims
        run: |
          python - <<'PY'
          import json
          r=json.load(open('model/S220/report.json'))
          assert len(r['all_checks_passed'])==7 and all(r['all_checks_passed'].values())
          assert r['events']==57 and r['policies']==193 and r['branch_count']==19
          assert r['accepted_non_parent_policy_cells']>=0
          assert not r['no_labels_read']==False and not r['independent_ExactK_scored']
          assert not r['S80_promoted']
          print('S220 PASSED independent conditional branch vote replay')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s220-independent-conditional-specialist-S46-verification
          path: model/S220/
          retention-days: 90
