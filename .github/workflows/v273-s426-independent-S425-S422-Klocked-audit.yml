name: S426 independent S425 vs S422 MIDI NoteOff audit with S80 K lock
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s426_audit_S425_S422_frozen_noteoff_same_GT_K_locked.py'
      - '.github/workflows/v273-s426-independent-S425-S422-Klocked-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s426-independent-S425-S422-noteoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  score_frozen_actual_MIDI_notes_against_same_GuitarSet_JAMS:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: S426 independent note pairing contract
        run: |
          python -m py_compile scripts/s426_audit_S425_S422_frozen_noteoff_same_GT_K_locked.py
          python -m scripts.s426_audit_S425_S422_frozen_noteoff_same_GT_K_locked --self-test
      - name: Restore original S422 and S425 MIDI prediction JSONL files
        run: |
          gh run download 38394264593 -n s422-native-5s-WAV-pitch-survival-S80-ExactK-LOCKED-note-offsets -D model/S422 --repo ${{ github.repository }}
          gh run download 38513725784 -n s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions -D model/S425 --repo ${{ github.repository }}
          test -f model/S422/S422_NATIVE_K_PROTECTED_full_MIDI_events.jsonl
          test -f model/S425/S425_K_LOCKED_native_full_MIDI_note_events.jsonl
      - name: Restore immutable original S80 K and GuitarSet MIDI truth
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Compare same GT MIDI note IDs and independently replay ALL actual exported NoteOns
        run: |
          python -u -m scripts.s426_audit_S425_S422_frozen_noteoff_same_GT_K_locked \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s422 model/S422/S422_NATIVE_K_PROTECTED_full_MIDI_events.jsonl \
            --s425 model/S425/S425_K_LOCKED_native_full_MIDI_note_events.jsonl \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S426
          python - <<'PY'
          import json
          d=json.load(open('model/S426/report.json'))
          assert d['status']=='S426_INDEPENDENT_S425_S422_FROZEN_MIDI_NOTE_PAIRED_AUDIT'
          assert d['actual_per_row_K_identical_for_all_59309_events']
          assert d['actual_exported_MIDI_note_on_events']==33475
          assert d['original_K_rows']==59309 and d['exactK_regressions']==0
          assert d['true_GuitarSet_note_events']==34954
          assert d['same_true_note_corrections_vs_regressions']['S422_correct']==16340
          assert d['same_true_note_corrections_vs_regressions']['S425_correct']==16543
          assert d['MIDI_pitch_and_onset_instances_identical']
          assert not d['official_promotion'] and d['live_mode_untouched']
          print('S426 PASS: 0 K regressions, paired native MIDI note audit independent from selection')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s426-independent-MIDI-S425-vs-S422-same-GuitarSet-Klocked-paired-audit
          path: model/S426/
          retention-days: 90
