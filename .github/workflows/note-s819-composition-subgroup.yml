name: S819 exact composition and recording-group causal-risk audit
on:
  push:
    branches: [codex/note-s819-independent-model-review]
    paths:
      - scripts/s819_composition_subgroup_audit.py
      - .github/workflows/note-s819-composition-subgroup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch unmodified true MIDI256 S819 outer policy decisions by recording
        run: |
          mkdir -p /tmp/s819-deep/gate
          gh run download 39553290558 --repo Andriamarosoa/note --name S819_S817_TRUE_PCM256_GATE_POLICY_AUDIT_NOT_PROMOTION --dir /tmp/s819-deep/gate
          test -s /tmp/s819-deep/gate/gate_audit/report.json
      - name: Fetch independent SHA-matched true GT-K original 80 tracks
        run: |
          mkdir -p /tmp/s819-deep/prior
          gh run download 39543749810 --repo Andriamarosoa/note --name S817_FIVEHEAD_ACTIVEK_TEMPORAL_K4_K6_FIT80_RESULTS --dir /tmp/s819-deep/prior
          test -s /tmp/s819-deep/prior/result/report.json
      - name: Reconcile 5 composition, 80 recordings, six cardinalities and counters
        run: |
          python -m compileall -q scripts/s819_composition_subgroup_audit.py
          python -m scripts.s819_composition_subgroup_audit --s819-report /tmp/s819-deep/gate/gate_audit/report.json --s817-report /tmp/s819-deep/prior/result/report.json --out /tmp/s819-deep/audited_subgroups.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s819-deep/audited_subgroups.json'))
          assert r['all_compositions']['delta_correct']==-683
          assert r['compositions']['SS1']['delta_correct']==-558
          assert r['recording_groups']['SS1']['SS1-100-C#']['delta_correct']==-487
          assert r['recording_groups']['SS1']['SS1-68-E']['delta_correct']==-71
          assert r['recording_groups']['Funk2']['Funk2-119-G']['delta_correct']==98
          assert r['recording_groups']['Funk2']['Funk2-108-Eb']['delta_correct']==-90
          assert r['recording_groups']['Rock3']['Rock3-148-C']['delta_correct']==44
          assert r['recording_groups']['Rock3']['Rock3-117-Bb']['delta_correct']==-22
          assert r['all_compositions']['changed_audio_decisions']==4867
          assert not r['promotion'] and not r['production_live_changed']
          print('S819_GROUP_AUDIT_PASS_SAME_80_TRACKS_NO_PROMOTION',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S819_SIGNED_FIVE_COMPOSITION_TRACK_GROUP_AUDIT
          path: /tmp/s819-deep/audited_subgroups.json
          retention-days: 45
          if-no-files-found: error
