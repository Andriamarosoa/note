name: S204 independently replay already-trained S133-S135 genuine 111D students from permanent release, no new models
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s204_existing_s5_student_release_goat_111d_replay.py'
      - '.github/workflows/v273-s204-existing-original-student-replay-goat.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s204-existing-student-release-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_existing_student_archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original published S133 LightGBM model dependency pins
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 lightgbm==4.6.0
      - name: Model shape and original data source selftest
        run: python -m scripts.s204_existing_s5_student_release_goat_111d_replay --self-test
      - name: Download permanent original S136 release trained student checkpoints with SHA references
        run: |
          set -euo pipefail
          mkdir -p model/S204/release
          gh release download v273-s133-s135-student-research-38190945241 \
            --repo "${{ github.repository }}" --pattern 'v273-S133-S135-teacher-students.tar.gz' \
            --pattern 'BUNDLE_SHA256' --dir model/S204/release
          (cd model/S204/release && sha256sum -c BUNDLE_SHA256)
          mkdir -p model/S204/source
          tar -xzf model/S204/release/v273-S133-S135-teacher-students.tar.gz -C model/S204/source
      - name: Restore only authentic GOAT audio-derived 111D source, not MIDI
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38184381730
          name: v273-s116-original-S4-control111-GOAT
          path: model/S204/s116
      - name: Re-run archived deployed S133 and S134 models and S135 blending on unchanged 57 audio GOAT events
        run: |
          set -euo pipefail
          SOURCE="$(find model/S204/s116 -name external_s4_control111.npz -print -quit)"
          test -s "$SOURCE"
          python -u -m scripts.s204_existing_s5_student_release_goat_111d_replay \
            --release model/S204/source --s116 "$SOURCE" --out model/S204/result/report.json
          python - <<'PY'
          import json
          d=json.load(open('model/S204/result/report.json'))
          assert d['GOAT_57_audio_only_predictions_count']==57
          assert d['original_S135_replayed_adjusted_events']==2
          assert d['original_S133_saved_GOAT_posterior_max_error']<5e-6
          assert d['original_S134_saved_GOAT_posterior_max_error']<5e-6
          assert d['S135_student_already_rejected_as_official_replacement']
          assert not d['GOAT_true_labels_opened']
          assert not d['original_historic_527D_S5_recovered']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s204-authenticated-preexisting-S5-student-111D-57-GOAT-exact-deploy-replay-not-promotion
          path: model/S204/result/
          retention-days: 90
