name: V27.1 nested poly rescue

on:
  push:
    branches: [v271-poly-rescue]
    paths:
      - 'scripts/audit_v271_poly_rescue.py'
      - 'test/test_v271_poly_rescue.py'
      - 'analysis/v271-poly-rescue-protocol.md'
      - '.github/workflows/v271-poly-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  PYTHONPATH: '.:src'
  V104_NESTED_RUN: '33647694565'
  V111_AUDIT_RUN: '33664141756'
  V260_RUN: '34201830555'

jobs:
  preflight:
    name: Protocol and source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: python -m pip install -r requirements-train.txt

      - name: Compile and test frozen V27.1 rules
        run: |
          python -c 'import tensorflow; assert tensorflow.__version__ == "2.15.1"'
          python -m py_compile scripts/audit_v271_poly_rescue.py
          python -m unittest test.test_v271_poly_rescue test.test_v270_class_conditional_fusion test.test_v260_count_weighting -v

      - name: Verify immutable source runs and live inner artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              [Number(process.env.V104_NESTED_RUN), '345dea1e92f6281583c58590a0b1286ce4df459b'],
              [Number(process.env.V111_AUDIT_RUN), '91717bb8fc0381ce91d807aacfa910fb8a7b1355'],
              [Number(process.env.V260_RUN), '5f41972a6e2f081d6f2ad652beae31dfff9f0076'],
            ];
            for (const [run_id, sha] of sources) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
              });
              if (run.head_sha !== sha || run.conclusion !== 'success') {
                throw new Error(`invalid source run ${run_id}`);
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.V104_NESTED_RUN),
              per_page: 100,
            });
            const liveInner = artifacts.filter(a => a.name.startsWith('v104-nested-inner-') && !a.expired);
            if (liveInner.length !== 20) {
              throw new Error(`expected 20 live nested inner artifacts, found ${liveInner.length}`);
            }

      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v260-verified-guitarset
          path: data/GuitarSet
          repository: Andriamarosoa/note
          run-id: ${{ env.V260_RUN }}
          github-token: ${{ github.token }}

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Share verified GuitarSet with fold jobs
        uses: actions/upload-artifact@v4
        with:
          name: v271-verified-guitarset
          path: |
            data/GuitarSet/annotation.zip
            data/GuitarSet/audio_mono-pickup_mix.zip
          compression-level: 0
          retention-days: 7

  fold:
    name: Poly rescue fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: python -m pip install -r requirements-train.txt

      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v271-verified-guitarset
          path: data/GuitarSet

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen nested spectral cache
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.V104_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Download strict V10.4 inner shards
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-inner-*
          path: model/v104-inner
          merge-multiple: true
          repository: Andriamarosoa/note
          run-id: ${{ env.V104_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen V10.4 outer-clean predictions
        uses: actions/download-artifact@v4
        with:
          name: v111-nested-outer-clean-audit
          path: model/v111-source
          repository: Andriamarosoa/note
          run-id: ${{ env.V111_AUDIT_RUN }}
          github-token: ${{ github.token }}

      - name: Download frozen V26 fold
        uses: actions/download-artifact@v4
        with:
          name: v260-count-pair-fold-${{ matrix.fold }}
          path: model/v260-source
          repository: Andriamarosoa/note
          run-id: ${{ env.V260_RUN }}
          github-token: ${{ github.token }}

      - name: Replay inner calibration and evaluate untouched outer fold
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/audit_v271_poly_rescue.py fold \
            --dataset-dir data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --v104-inner-dir model/v104-inner \
            --v111-dir model/v111-source \
            --v260-dir model/v260-source \
            --outer-fold ${{ matrix.fold }} \
            --output-dir model/v271-fold-${{ matrix.fold }} \
            2>&1 | tee model/v271-fold-${{ matrix.fold }}.log

      - name: Verify fold guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold = ${{ matrix.fold }}
          report = json.loads(Path(f'model/v271-fold-{fold}/report-fold-{fold}.json').read_text())
          p = report['protocol']
          assert p['experiment'] == 'v271_poly_rescue'
          assert p['threshold_calibrated_inner_only'] is True
          assert p['outer_labels_used_for_threshold_selection'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['event_f1_used_for_threshold_selection'] is False
          assert report['outer']['poly_rescue']['poly_correct'] >= report['outer']['low_k_fusion']['poly_correct']
          print('fold', fold, 'threshold', report['outer']['threshold'],
                'low poly', report['outer']['low_k_fusion']['poly_exact'],
                'rescue poly', report['outer']['poly_rescue']['poly_exact'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v271-poly-rescue-fold-${{ matrix.fold }}
          path: |
            model/v271-fold-${{ matrix.fold }}
            model/v271-fold-${{ matrix.fold }}.log
          retention-days: 90

  summary:
    name: Final frozen outer summary
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install 'numpy>=1.23.5,<2'

      - uses: actions/download-artifact@v4
        with:
          pattern: v271-poly-rescue-fold-*
          path: model/v271-all

      - name: Aggregate and reproduce V27 reference
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/audit_v271_poly_rescue.py summarize \
            --input-dir model/v271-all \
            --output-dir model/v271-summary \
            2>&1 | tee model/v271-summary.log

      - name: Print final decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('model/v271-summary/report.json').read_text())
          print('reference poly exact-K:', r['reference']['cardinality']['poly_exact'])
          print('poly_rescue poly exact-K:', r['poly_rescue']['cardinality']['poly_exact'])
          print('delta poly pp:', r['delta']['poly_exact_k_percentage_points_vs_low_k_fusion'])
          print('delta global exact pp:', r['delta']['exact_k_percentage_points_vs_low_k_fusion'])
          print('delta F1 pp:', r['delta']['event_f1_percentage_points_vs_low_k_fusion'])
          print('promote:', r['decision']['promote_poly_rescue'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v271-poly-rescue-summary
          path: |
            model/v271-summary
            model/v271-summary.log
          retention-days: 90
