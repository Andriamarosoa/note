name: S272 measure genuine new foldneutral full S80 output on 59309 GuitarSet before scoring
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s272_full_new_S80_GuitarSet_59309.py'
      - '.github/workflows/v273-s272-full-S80-GuitarSet-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s272-GuitarSet-full-S80-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_model_weights_new_4fold_deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Require genuinely trained original 8 S71 S72 fold checkpoints complete
        run: gh run watch 38314244883 --exit-status --interval 15
      - name: Restore original pretrained complete models and true native reference audio/PR16
        run: |
          gh run download 38314244883 -n s271-guitarset-59309-original-S71-S72-eight-risk-heads -D model/S271
          gh run download 38314164725 -n s268-GuitarSet-original-S46-193foldneutral-59309 -D model/S268
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
          gh run download 38312084676 -n s262-guitarset-59309-native-real-S97-source -D model/S262source
          gh run download 38187186049 -n v273-s80-traceable-repair -D model/S80historic
      - name: Execute genuine four saved S79 K1 trained models and S147 exact S80 K0 K2 tail on all 59309 GuitarSet native source rows
        run: |
          python -u -m scripts.s272_full_new_S80_GuitarSet_59309 \
            --s226 model/S271/S271_original_S71_S72_native_GUITARSET.npz \
            --s219 model/S268/S268_original_193_S46_foldneutral_59309_GUITARSET.npz \
            --s85 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --s97 model/S262source/original_GuitarSet_59309_S97.npz \
            --s80 model/S80historic --out model/S272
          python - <<'PY'
          import json,numpy as np,hashlib
          from pathlib import Path
          r=json.load(open('model/S272/report.json'))
          assert r['original_native_WAV_events']==59309
          assert r['S79_original_trained_K1_models']==4
          assert r['S80_K0_K2_original_final_formula_exact']
          assert r['GUITARSET_events_previously_exposed'] and r['historical_training_overlap_other_fold_models']
          assert r['diagnostic_only_not_out_of_fold'] and not r['official_promotion']
          p=Path('model/S272/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz')
          with np.load(p) as z:
            assert z['s80_K'].shape==(59309,)
            assert z['K1_by_fold_threshold_action'].shape==(4,59309)
          print('S272 NEW FULL ORIGINAL-WEIGHT S80 59309 GuitarSet source SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s272-guitarset-59309-new-full-original-weight-S80-foldneutral-locked
          path: model/S272/
          retention-days: 90
