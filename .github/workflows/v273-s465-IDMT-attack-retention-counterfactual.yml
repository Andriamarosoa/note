name: S465 original IDMT attack vs sustain RMS safe K-locked diagnostic no promotion
on:
  push:
    branches: [codex/s465-onset-retain-safety-audit]
    paths:
      - scripts/s465_diagnostic_onset_vs_sustain_S80_Kprotected_recall_sweep.py
      - .github/workflows/v273-s465-IDMT-attack-retention-counterfactual.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate_true_onset_recall_risks_before_any_filter_promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric API for original S464 frozen waveform metrics
        run: python -m pip install numpy==1.26.4
      - name: Selftest false candidate drop versus true-K0-note loss
        run: |
          python -m py_compile scripts/s465_diagnostic_onset_vs_sustain_S80_Kprotected_recall_sweep.py
          python -m scripts.s465_diagnostic_onset_vs_sustain_S80_Kprotected_recall_sweep --self-test
      - name: Restore SHA-frozen S464 waveform metrics and S453 original XML-matched true notes
        run: |
          gh run download 38548309592 \
            -n s464-real-IDMT-original-5WAV-excess-417-far-K0-waveform-RMS-evidence \
            -D model/S464 --repo ${{ github.repository }}
          gh run download 38533183193 \
            -n s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion \
            -D model/S453 --repo ${{ github.repository }}
      - name: Measure true note recall vs dense native candidates, never modify original S80
        run: |
          python -u -m scripts.s465_diagnostic_onset_vs_sustain_S80_Kprotected_recall_sweep \
            --s464 model/S464/S464_original_realWAV_event_acoustic_RMS_506.jsonl \
            --s464-report model/S464/report.json \
            --s453 model/S453/S453_independent_original_IDMT_stage_audit.jsonl \
            --s453-report model/S453/report.json \
            --out model/S465
          python - <<'PY'
          import json
          d=json.load(open('model/S465/report.json'))
          assert d['status']=='S465_S464_IDMT_ATTACK_VS_SUSTAIN_RETENTION_ABLATION_NO_PROMOTION'
          assert d['native_original_events']==506 and d['original_XML_note_attack_events']==47
          assert d['original_XML_supported_true_poly']==21
          assert d['original_external_far_candidates']==418
          assert d['original_far_predicted_K0']==417
          assert d['source_S80_K_preserved'] and d['no_filter_or_new_S80_predictions_executed']
          assert d['threshold_search_NOT_promotion_eligible'] and d['no_promotion']
          print('S465 success: true onset recall guard & candidate suppression tradeoffs verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s465-original-IDMT-47-real-attacks-vs-417-farK0-transient-K-protected-gate-audit
          path: model/S465/
          retention-days: 90
