name: S642 actual streaming causal note parity
on:
  push:
    branches: [codex/s642-trained-weak-onset-delay]
    paths:
      - src/causal_note/s642_streaming_runtime.py
      - test/test_s642_streaming_runtime.py
      - .github/workflows/v273-s642-streaming-parity.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block_vs_offline_same_samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install ORIGINAL NOTE native requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Confirm four policies causal prefix no backwards MIDI events
        run: |
          python -m compileall -q src/causal_note/s642_streaming_runtime.py
          python -m unittest -v test.test_s642_streaming_runtime test.test_s642_dual_learned test.test_strict_live
