name: S305 preregister exact historical K0-K6 attack targets on 964 native IDMT dataset2 reserve WAV events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s305_prelabel_16_dataset2_original_attack_K0K6_policy.py'
      - '.github/workflows/v273-s305-original-historical-attack-K0K6-prelabel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s305-original-attack-K0K6-964-prelabel
  cancel-in-progress: true
jobs:
  prospective_16_WAV_excluded_first48_K0K6_prelabel_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Test original exact historical note attack matching from GuitarSet target
        run: python -u -m scripts.s305_prelabel_16_dataset2_original_attack_K0K6_policy --self-test
      - name: Restore untouched S276 original WAV selection precommit and S302 first source-only predictions
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38322507433 \
            -n s302-IDMT-dataset2-16WAV-true-original-V88-native-official-unlabelled \
            -D model/S302 --repo ${{ github.repository }}
      - name: Freeze exact historical trained K0–K6 semantics and 964 native row identities before opening XML
        run: |
          python -u -m scripts.s305_prelabel_16_dataset2_original_attack_K0K6_policy \
            --selection model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --report model/S302/report.json \
            --source model/S302/S302_official_V88_dataset2_rank49plus_16_WAV_predictions.npz \
            --out model/S305
          python - <<'PY'
          import json
          r=json.load(open('model/S305/report.json'))
          assert r['original_V88_native_events']==964
          assert r['source_original_S302_WAVs']==16
          assert sum(r['source_official_original_freeze_K0to6_prediction_histogram'])==964
          assert r['SHA_filename_rank_1_to_48_excluded']
          assert len(r['per_WAV_preregistered'])==16
          assert r['XML_pitch_offset_and_sustained_note_activity_ignored']
          assert r['all_XML_contents_untouched']
          assert r['full_candidate_S80_predictions_must_be_sealed_before_XML']
          assert not r['new_independent_ExactK_scored']
          assert not r['official_S80_promotion']
          print('S305 PASS exact historical K0-K6 note attack truth protocol precommitted on 16 untouched WAVs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s305-Dataset2-16reserveWAV-964events-original-K0K6-attack-protocol-PREXML
          path: model/S305/
          retention-days: 90
