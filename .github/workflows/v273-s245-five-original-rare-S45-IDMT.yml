name: S245 original five rare S1 S2 S3 S4 coherent S45 source families on 1034 untouched IDMT native events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - '.github/workflows/v273-s245-five-original-rare-S45-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s245-original-five-S1-S4-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historical_five_original_recovered_models:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original rare S1-S4 full trained source environment
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0 h5py==3.11.0
      - name: Require original S244 spectrogram and fundamental58 truly original 1034 events
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38306376167 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: Restore original 58D harmonic and fundamental views from S244 on native IDMT
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38306376167
          name: s244-idmt-original-58D-fundamental-all-1034-native-unlabelled
          path: model/S244
      - name: Restore original hash-verified five-family trained runtime and its COMPLETE 7493 historical proof
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38234363815
          name: recovered-five-original-family-runtime-historical-and-GOAT-proof
          path: model/S245runtime
      - name: Verify original complete historical five rare champion proof before new-IDMT inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('model/S245runtime/historical/report.json')
          assert p.is_file()
          r=json.loads(p.read_text())
          assert r['status']=='HISTORICAL_PASS' and r['complete_historical_cohort']
          assert not r['cached_receiver_producers'] and not r['predictive_models_fitted']
          assert r['raw_policy_decisions_checked']==1101471
          assert r['five_champion_decisions_checked']==37465
          assert Path('model/S245runtime/runtime/specialists.joblib').is_file()
          print('S245 verified original 5 recovered 59309-vector S44 champion hashes')
          PY
      - name: Execute original S1 S2 S3 S4/coherent historical trained risk and specialist producers on 1034 native IDMT without annotations
        run: |
          python -u -m scripts.recover_v273_missing_s45 \
            --runtime model/S245runtime/runtime \
            --historical-proof model/S245runtime/historical/report.json \
            --external model/S244/S244_original_fundamental58_on_1034_native_IDMT.npz \
            --s5 model/S244/S244_original_S5_label_free_reference.npz \
            --out model/S245
      - name: Require 19 original piece branch five-family proposals on 1034 canonical source IDs without IDMT labels
        run: |
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/S245/report.json'))
          assert r['status']=='FIVE_ORIGINAL_FAMILIES_EXECUTED_ALL_NINETEEN_BRANCHES'
          assert r['external_events']==1034 and r['branches']==19
          assert len(r['family_ids'])==5 and not r['predictive_models_fitted']
          assert not r['new_audio_labels_read'] and not r['S80_promoted']
          with np.load('model/S245/external_five_families.npz',allow_pickle=False) as z:
            assert z['predictions'].shape==(19,1034,5)
            assert len(z['row_id'])==1034 and len(z['branch_fold'])==19
            assert np.isin(z['predictions'],range(7)).all()
          print('S245 PASS all five original historical rare S1/S2/S3/S4/coherent models on true IDMT 1034 original V88 native events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s245-five-original-historic-S1-S2-S3-S4-coherent-on-1034-IDMT
          path: model/S245/
          retention-days: 90
