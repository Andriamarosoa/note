name: V27.3 B_low Subclustering Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-b-low-subclustering-launch.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  TAG: v273-b-low-subclusters-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - name: Compile and unit-test clustering
        run: |
          python -m py_compile scripts/audit_v273_b_low_subclusters.py
          python -B -m unittest test.test_v273_b_low_subclusters -v
      - name: Restore frozen fold exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/exports
          for f in 0 1 2 4; do
            mkdir -p "model/exports/fold-$f"
            gh run download 37356100423               --repo "${{ github.repository }}"               --name "v273-internal-minimal-residual-failure-fold-$f"               --dir "model/exports/fold-$f"
          done
          for f in 0 1 2 4; do
            test -f "model/exports/fold-$f/replay.npz"
            test -f "model/exports/fold-$f/manifest.json"
          done
      - name: Run B_low subclustering audit
        run: |
          python -B scripts/audit_v273_b_low_subclusters.py             --exports model/exports             --output model/result
      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-b-low-subclusters-results.tgz -C model/result .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 B_low base-K3 subclustering audit"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/v273-b-low-subclusters-results.tgz             --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-b-low-subclusters-results
          path: model/result/
          retention-days: 90
