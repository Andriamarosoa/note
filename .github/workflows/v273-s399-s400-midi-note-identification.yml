name: S399 S400 S80 K5 guarded reference note pitch identity from original audio
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s399_s80_exactK_constrained_midi_pitch_decoder.py'
      - 'scripts/s400_evaluate_S399_MIDI_note_pitches_GuitarSet.py'
      - '.github/workflows/v273-s399-s400-midi-note-identification.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s399-s400-actual-MIDI-identification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_note_predictions_and_after_SHA_pitch_scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned minimal note pitch inference stack
        run: python -m pip install numpy==1.26.4
      - name: Compile notes detector and paired JAMS evaluator
        run: |
          python -m py_compile scripts/s399_s80_exactK_constrained_midi_pitch_decoder.py scripts/s400_evaluate_S399_MIDI_note_pitches_GuitarSet.py
          python -m scripts.s399_s80_exactK_constrained_midi_pitch_decoder --self-test
      - name: Restore original acoustic 42x49 pitch-harmonic trajectories for 59309 original events
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore user's S397 guarded NEW ACTIVE S80 reference final predictions
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397artifact --repo ${{ github.repository }}
          find model/S397artifact -maxdepth 5 -type f | head -30
          test -f model/S397artifact/S397/report.json
          test -f model/S397artifact/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz
      - name: S399 source-only MIDI pitch note detection, SHAs before reading any annotations
        run: |
          python -u -m scripts.s399_s80_exactK_constrained_midi_pitch_decoder \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397artifact/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --source-report model/S397artifact/S397/report.json \
            --out model/S399
          python - <<'PY'
          import json
          r=json.load(open('model/S399/report.json'))
          assert r['status']=='S399_LABEL_BLIND_REAL_PITCH_SOURCE_S80_K5_GUARD_REFERENCE'
          assert r['predicted_cardinality_eq_reference_all_rows']
          assert r['labels_read'] is False and r['predictor_uses_ground_truth'] is False
          assert r['reference_id']=='S80_S397_K5_GUARDED'
          print('S399 sealed MIDI predicted note identities and exact S80 K per event')
          PY
      - name: ONLY AFTER S399 SHA seal download original GuitarSet JAMS note_midi annotations
        run: |
          mkdir -p data/GuitarSet
          # Official GuitarSet v1.1.0 mirror, verified by the exact official MD5.
          # Zenodo primary was returning HTTP 503 on 2026-10-13.
          curl -L --fail --retry 3 --retry-delay 2 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: S400 genuine MIDI note-by-note scoring and label audit without retraining
        run: |
          python -u -m scripts.s400_evaluate_S399_MIDI_note_pitches_GuitarSet \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --source model/S399/S399_S80_K5_GUARDED_MIDI_note_predictions_N59309.npz \
            --source-report model/S399/report.json \
            --original-truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S400
          python - <<'PY'
          import json
          a=json.load(open('model/S400/report.json'))
          assert a['status']=='S400_FIRST_PITCH_IDENTITY_EVALUATION_S80_S397_DEVELOPMENT'
          assert a['reference_exactK_unchanged'] and not a['promoted_to_production']
          assert a['annotation_events_usable']>0
          print('S400 verified note-pitch multiset scores over',a['annotation_events_usable'],'events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s399-s400-first-real-S80-exactK-constrained-MIDI-note-pitch-output-and-audit
          path: |
            model/S399/
            model/S400/
          retention-days: 90
