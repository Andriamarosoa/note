name: S553 retrospective medium-note expert switch and consensual reattack audit on frozen S550 new songs
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s553_posthoc_medium_register_mixture_and_consensus_restrike_audit.py
      - .github/workflows/v273-s553-retrospective-medium-note-and-restrike-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit_middle_note_false_positives_and_physically_genuine_restrikes_without_changing_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact midi 40-88 note matching baseline dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test deterministic six MID-routing head policies independently of MIDI labels
        run: |
          python -m py_compile scripts/s553_posthoc_medium_register_mixture_and_consensus_restrike_audit.py
          python -m scripts.s553_posthoc_medium_register_mixture_and_consensus_restrike_audit --self-test
      - name: Restore original fully independent composer evaluation S545 and preMIDI note ledger S550
        run: |
          gh run download 38658066587 -n s545-next-five-composer-disjoint-MAESTRO-original-train-split-METADATA-ONLY -D model/S545 --repo "${{ github.repository }}"
          gh run download 38659705635 -n s550-S545-new-five-MAESTRO-S528-vs-S546-six-preMIDI-frozen-full-NoteOn-predictions -D model/S550 --repo "${{ github.repository }}"
          gh run download 38659753045 -n s551-five-NEW-S545-composers-MIDI-SHA-verified-NoteOn-F1-S528-vs-S546 -D model/S551 --repo "${{ github.repository }}"
      - name: Replay six combinations of source frozen notes, verify entire true pitch MIDI against S551 and audit corrections and regressions posthoc
        run: |
          python -u -m scripts.s553_posthoc_medium_register_mixture_and_consensus_restrike_audit \
            --manifest model/S545/report.json \
            --freeze-report model/S550/report.json \
            --score-report model/S551/report.json \
            --predictions model/S550/S550_NEXT_FIVE_REAL_WAV_NOTEON_PREDICTIONS_PREMIDI.jsonl \
            --out model/S553
          python - <<'PY'
          import json
          r=json.load(open('model/S553/report.json'))
          assert r['status']=='S553_POST_HOC_MIDDLE_PITCH_REGISTER_AND_REAL_RESTRIKE_EXPERT_ROUTING'
          assert len(r['scoring'])==7 and len(r['per_composer'])==5
          assert r['retrospectively_seen_development_SET_NOT_NEW_TEST']
          assert r['source_MIDI_previously_OPENED_in_S551']
          assert r['no_promotion'] and r['original_K_S80_live_and_freeze_local_combo_unchanged']
          print('S553 PASS 5 composer fully valid F1 and true register protection/correction audit, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s553-five-source-exposed-MAESTRO-mid-note-expert-gate-and-restrike-corrections-audit
          path: model/S553/
          retention-days: 90
