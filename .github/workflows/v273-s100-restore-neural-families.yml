name: S100 original S38 S40 S41 source neural selftests
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/train_v273_s38_poly_harmonic_expert.py'
      - 'scripts/train_v273_s40_temporal_cnn.py'
      - 'scripts/train_v273_s41_neural_fusion.py'
      - 'scripts/train_v273_extended_dynamic_router.py'
      - 'scripts/v273_extended_head_bank.py'
      - '.github/workflows/v273-s100-restore-neural-families.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original_selftests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical numerical and neural dependencies
        run: |
          pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test original S38 and extended features
        run: |
          python -m scripts.train_v273_extended_dynamic_router --self-test
          python -m scripts.train_v273_s38_poly_harmonic_expert --self-test
      - name: Test original temporal CNN S40
        run: python -m scripts.train_v273_s40_temporal_cnn --self-test
      - name: Test original neural fusion S41
        run: python -m scripts.train_v273_s41_neural_fusion --self-test
