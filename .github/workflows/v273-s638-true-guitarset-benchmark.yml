name: S638 real same-PCM GuitarSet F1 NOTE vs MIDI v2.2.1
on:
  push:
    branches: [codex/s634-midi-live-transport]
    paths:
      - scripts/s638_note_midi_same_guitarset.py
      - .github/workflows/v273-s638-true-guitarset-benchmark.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s638-shared-guitarset-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  three_distinct_known_development_compositions:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src:midi_reference
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Pull frozen original MIDI v2.2.1 model plus decoder
        uses: actions/checkout@v4
        with:
          repository: Andriamarosoa/midi
          ref: 536536f54290fdc4f63db28aa063d2e324121642
          path: midi_reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install both original execution environments, no retraining
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install 'tensorflow-cpu==2.15.1' 'soundfile==0.12.1' 'sounddevice==0.5.2' 'mido==1.3.3'
      - name: Check both genuine models, strict same-source annotation and decoder replay
        run: |
          python -m compileall -q scripts/s638_note_midi_same_guitarset.py
          python -m scripts.s638_note_midi_same_guitarset --midi-root midi_reference --out /tmp/S638
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S638-three-GuitarSet-compositions-real-matched-F1
          path: /tmp/S638/
          if-no-files-found: warn
          retention-days: 60
