name: S427 short-note safety guard vs S425 full MIDI F1 zero S80 K regression
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s427_train_only_short_note_offset_safety_guard.py'
      - '.github/workflows/v273-s427-short-note-K-protected-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s427-short-note-safety-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimize_train_songs_only_and_check_s425_frozen_baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test preregistered safety policies and compile
        run: |
          python -m py_compile scripts/s427_train_only_short_note_offset_safety_guard.py
          python -m scripts.s427_train_only_short_note_offset_safety_guard --self-test
      - name: Restore original frozen native S425 true 33,475 note instances
        run: |
          gh run download 38513725784 -n s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions -D model/S425 --repo ${{ github.repository }}
          test -f model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz
      - name: Restore unchanged original S80 and official GuitarSet truth for TRAIN composition labels
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Evaluate training-selected short-note safe guard and independent 59,309 S80 exact-K event replay
        run: |
          python -u -m scripts.s427_train_only_short_note_offset_safety_guard \
            --s425 model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S427
          python - <<'PY'
          import json
          r=json.load(open('model/S427/report.json'))
          assert r['status']=='S427_TRAIN_ONLY_SHORT_NOTE_GUARD_NATIVE_S80_K_LOCKED'
          assert r['protected_S80_exactK_count_N']==59309
          assert r['native_NoteOn_count']==33475
          assert r['S425_correct_complete_notes']==16543
          assert r['exactK_regressions']==0 and r['independently_verified_exported_midi_K_per_row']
          assert r['unchanged_MIDI_pitch_and_onset'] and r['Live_unchanged']
          assert all(x['composition_overlap']==0 for x in r['train_only_selection'])
          assert not r['no_official_promotion']
          print('S427 PASS: K unchanged and full note comparison checked')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s427-short-note-train-held-safety-gate-vs-S425-native-full-note-K-locked
          path: model/S427/
          retention-days: 90
