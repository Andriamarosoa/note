name: "S630 Windows-overflow investigation: frozen hybrid batched inference"
on:
  push:
    branches: [codex/note-s630-batched-onnx-live-audit]
    paths:
      - '.github/workflows/note-s630-batched-onnx-throughput.yml'
      - 'src/causal_note/batched_live.py'
      - 'scripts/live_strict_notes.py'
      - 'scripts/s630_benchmark_cpu.py'
      - 'test/test_s630_batched_live.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inference-throughput:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original frozen hybrid and numerical dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Validate no altered nominal MIDI notes, timestamps, source and float model
        run: |
          python -m compileall -q src/causal_note/batched_live.py scripts/live_strict_notes.py scripts/s630_benchmark_cpu.py
          python -m unittest -v test.test_s630_batched_live test.test_s629_shared_hop_lookahead
      - name: CPU benchmark original and frozen batched 2/4/8 with 256 callback
        run: |
          python -m scripts.s630_benchmark_cpu --duration-s 2.0 --callback-size 256
      - name: CPU benchmark with 1024-sample input callback, original hop 256
        run: |
          python -m scripts.s630_benchmark_cpu --duration-s 2.0 --callback-size 1024
