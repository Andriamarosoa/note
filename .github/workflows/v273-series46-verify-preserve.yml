name: V27.3 S46 independently verify poly compromises and preserve them
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series46-verify-preserve.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore immutable completed S45 learned family heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/S45bundle model
          gh release download v273-series45-research-37891074478 --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --dir model/S45bundle
          tar -xzf model/S45bundle/v273-series45-specialized-heads.tar.gz -C model
      - name: Retrieve all 192 S46 poly-compromise decisions and class-level audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37891336823 --repo "$GITHUB_REPOSITORY" --name v273-series46-poly-class-compromises --dir model/S46
      - name: Independently replay exact K decisions plus identify global-safe poly improvements
        run: >-
          python -m scripts.verify_v273_s46_poly_compromises
          --s45risk model/S45/risk_scores.npz
          --s45pred model/S45/predictions.npz
          --s46 model/S46/predictions.npz
          --report model/S46/report.json
          --output model/S46-verified
      - name: Publish S46 true-K per-fold corrections and losses
        run: cat model/S46/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series46-independent-proof
          path: model/S46-verified/
          retention-days: 90
      - name: Preserve every original correction and regression with SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series46-poly-compromises.tar.gz -C model S46 S46-verified
          (cd model/archive && sha256sum v273-series46-poly-compromises.tar.gz > SHA256SUMS)
          gh release create "v273-series46-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series46-poly-compromises.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S46 class-conditioned poly tradeoffs ${GITHUB_RUN_ID}" \
            --notes "192 original K-aware polyphonic compromise policies, correction and regression by K0-K6 and folds, verified against frozen S45 risk scores with no oracle/H9 in selection. New poly-positive tradeoffs remain exploratory on already inspected music; no promotion."
