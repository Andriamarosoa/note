name: "S624 census: actual annotated note overlaps in pinned NOTE train/dev"
on:
  push:
    branches: [codex/note-s624-groundtruth-overlap-census]
    paths: ['.github/workflows/note-s624-annotation-census.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-annotation-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only labeled-source parser and audit dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Verify definitions of exact overlap and close/harmonic pitch pairs
        run: |
          python -m unittest -v test.test_s624_audit_real_overlap
      - name: Count actual 53 TRAIN +17 DEV source annotations (no WAV required)
        run: |
          python -m scripts.s624_audit_real_overlap \
            --root data/S624_labels_only \
            --out results/S624_REAL_70_SOURCE_OVERLAP_CENSUS.json
      - name: Verify composition isolation and full 70-source split coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/S624_REAL_70_SOURCE_OVERLAP_CENSUS.json').read_text())
          assert x['test_sources_read']==0 and x['train_sources']==53 and x['dev_sources']==17
          assert x['summaries']['train']['raw']['sources']==53
          assert x['summaries']['dev']['raw']['sources']==17
          assert x['summaries']['train_GuitarSet']['raw']['sources']==36
          assert x['summaries']['train_URMP']['raw']['sources']==17
          assert x['summaries']['dev_GuitarSet']['raw']['sources']==12
          assert x['summaries']['dev_URMP']['raw']['sources']==5
          a={(row['corpus'],row['composition']) for row in x['per_source'] if row['split']=='train'}
          b={(row['corpus'],row['composition']) for row in x['per_source'] if row['split']=='dev'}
          assert a.isdisjoint(b)
          for split in ('train','dev'):
              result=x['summaries'][split]
              raw=result['raw']
              assert raw['original_annotated']>=raw['notes_in_pitch_range']>0
              assert sum(result['duration_by_active_distinct_pitch_K_s'].values())>0
              print('VERIFIED_'+split.upper(),json.dumps(result,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s624-source-true-annotated-polyphony-census
          path: results/S624_REAL_70_SOURCE_OVERLAP_CENSUS.json
          retention-days: 45
