name: V21 frozen V19 latent-conv audit

on:
  push:
    branches: [v210-latent-conv-audit]
    paths:
      - 'scripts/audit_v210_v190_latent_conv.py'
      - '.github/workflows/v210-latent-conv-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_V190_RUN: '33995600250'

jobs:
  audit:
    name: Audit frozen V19 conv latent
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile audit
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/audit_v210_v190_latent_conv.py
      - name: Download GuitarSet annotations only
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Build filename-only audio index archive
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          root=Path('data/GuitarSet')
          with zipfile.ZipFile(root/'annotation.zip','r') as src, zipfile.ZipFile(root/'audio_mono-pickup_mix.zip','w',compression=zipfile.ZIP_STORED) as dst:
              for name in src.namelist():
                  if name.endswith('.jams'):
                      dst.writestr(PurePosixPath(name).name[:-5] + '_mix.wav', b'')
          print('filename-only audio index built; waveform bytes are not read')
          PY
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download canonical V19 fold artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v190-dense-fold-*
          path: model/v190-all
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V190_RUN }}
          github-token: ${{ github.token }}
      - name: Run V21 latent audit
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v210-latent-audit
          python -B scripts/audit_v210_v190_latent_conv.py data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --v190-fold-dir model/v190-all \
            --output-dir model/v210-latent-audit \
            2>&1 | tee model/v210-latent-audit/audit.log
      - name: Verify audit protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v210-latent-audit/report.json').read_text()); p=r['protocol']; o=r['pooled_outer']
          assert p['v210_v190_latent_conv_audit'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_five_saved_v190_models'] is True and p['v190_retrained'] is False
          assert p['probe_training_rows_are_final_fit_only'] is True and p['probe_evaluation_rows_are_outer_only'] is True
          assert p['probe_hyperparameter_sweep'] is False
          assert p['locked12_indexed_or_evaluated'] is False
          assert len(r['folds']) == 5
          print(json.dumps({'cardinality':{'actual_v19':o['actual_v19_cardinality'],'conv_probe':o['conv_cardinality_probe'],'raw_probe':o['raw_cardinality_probe']},'cell_birth':o['cell_birth_mean_fold_auc'],'player_conv':o['player_conv'],'style_prefix_conv':o['style_prefix_conv'],'energy_r2_conv':o['energy_r2_conv'],'count_error_recovery':o['conv_probe_recovers_actual_v19_count_errors'],'count_correct_breakage':o['conv_probe_breaks_actual_v19_correct_counts']},indent=2,sort_keys=True))
          PY
      - name: Upload V21 audit
        uses: actions/upload-artifact@v4
        with:
          name: v210-v190-latent-conv-audit
          path: model/v210-latent-audit
          retention-days: 30
