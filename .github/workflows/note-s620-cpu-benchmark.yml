name: "S620 dual-hop strict CPU headroom budget"
on:
  push:
    branches: [codex/note-live-s620-dual-hop]
    paths: ['.github/workflows/note-s620-cpu-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Benchmark frozen S613 vs two-hop note proposals with same causal PCM
        run: |
          python -m scripts.s620_benchmark_dual_hop --block-size 256 --duration-s 2
          python -m scripts.s620_benchmark_dual_hop --block-size 512 --duration-s 2
