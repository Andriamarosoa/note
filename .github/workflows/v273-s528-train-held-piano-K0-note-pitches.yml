name: S528 actual held piano note E3-G3 pitch heads trained on all V88 physical onset candidates including K0
on:
  push:
    branches: [codex/s525-physical-onset-rescue-audit]
    paths:
      - scripts/s528_train_held_raw_note_pitches_at_all_V88_events.py
      - .github/workflows/v273-s528-train-held-piano-K0-note-pitches.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train_new_true_note_pitches_on_other_two_recordings_and_verify_held_piano:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore numerical ExtraTrees true acoustic pitch learning prerequisites
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Self-test correct pitch F1 versus complete chord Exact-K mismatch
        run: |
          python -m py_compile scripts/s528_train_held_raw_note_pitches_at_all_V88_events.py
          python -m scripts.s528_train_held_raw_note_pitches_at_all_V88_events --self-test
      - name: Restore SHA-frozen independent true RAW spectral per-pitch evidence from S527
        run: |
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
      - name: Restore fixed original MIDI 322 true positive piano note-on training/evaluation identities only
        run: |
          gh run download 38560885111 -n s476-MAESTRO-original-V88-K-new-onsets-vs-sounding-322-same-events-audit -D model/S476 --repo "${{ github.repository }}"
      - name: Restore independent read-only S526 true onsets missed by canonical BP to score recovered pitches
        run: |
          gh run download 38646978013 -n s526-frozen-V88-true-piano-onsets-lost-through-BP-canonical-K0-filter -D model/S526 --repo "${{ github.repository }}"
      - name: Train three composer-held genuine models with raw acoustic only vs optional BP clues
        run: |
          python -u -m scripts.s528_train_held_raw_note_pitches_at_all_V88_events \
            --features model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --features-report model/S527/report.json \
            --truth model/S476/S476_ORIGINAL_S470_PIANO_NEW_NOTE_VS_SOUNDING_322.jsonl \
            --truth-report model/S476/report.json \
            --lost model/S526/S526_LOST_NOTE_ONSET_PRESENT_IN_V88_PRELABEL.jsonl \
            --lost-report model/S526/report.json \
            --out model/S528
          python - <<'PY'
          import json
          r=json.load(open('model/S528/report.json'))
          assert r["status"]=="S528_TRAINED_THREE_RECORDING_HELD_PIANO_NOTE_HEADS_ALL_V88_K0_SITES"
          assert r["truly_trained_6_models"]==6
          assert r["original_V88_K0_K6_candidate_events_all_575_evaluated"]
          assert len(r["models"])==6
          assert r["unpaired_253_piano_original_V88_candidates_NOT_labeled_negative"]
          assert r["original_S80_Live_reference_and_K_unchanged"] and r["no_promotion"]
          for kind in ("raw_only","with_BP"):
            for threshold in ("0.5","0.7"):
              item=r["scoring"][kind][threshold]["overall"]
              assert item["evaluated_TRUE_attacks_only"]==322
              assert item["originally_BP_missing_102"]["n"]==102
              assert item["originally_BP_matched_220"]["n"]==220
          print("S528 trained and evaluated all 6 actual pitch-head models on held recordings, no full-stream F1 claim")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit
          path: model/S528/
          retention-days: 90
