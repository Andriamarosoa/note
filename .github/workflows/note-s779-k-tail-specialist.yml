name: S779 FIT80 five-fold K5 K6 specialist CAL32 audit
on:
  push:
    branches: [codex/note-s779-exactk-tail-specialist]
    paths:
      - scripts/s779_fit80_k_tail_specialist.py
      - test/test_s779_fit80_k_tail_specialist.py
      - .github/workflows/note-s779-k-tail-specialist.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train_k_tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test class-tail causal independence
        run: |
          python -m compileall -q scripts/s779_fit80_k_tail_specialist.py
          python -m unittest -v test.test_s779_fit80_k_tail_specialist
      - name: Restore signed S708 and S707
        run: |
          mkdir -p /tmp/s779/s708 /tmp/s779/s707
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s779/s708
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s779/s707
          test -s /tmp/s779/s708/report.json
          test -s /tmp/s779/s708/s708_selected.pt
          test -s /tmp/s779/s707/s675_hazard.joblib
      - name: FIT80 grouped OOF 31D K-tail head and frozen CAL32 evaluation
        run: |
          python -m scripts.s779_fit80_k_tail_specialist \
            --s708-dir /tmp/s779/s708 \
            --offset-checkpoint /tmp/s779/s707/s675_hazard.joblib \
            --out /tmp/s779/report
      - name: Verify no live or MIDI promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s779/report/report.json'))
          assert r['complete'] and r['fit_recordings_done']==80 and r['cal_recordings_done']==32
          assert r['schema']=='S779_CLASS_AWARE_EXACTK_TAIL_SPECIALIST_FIT80'
          assert r['decision_clock_samples']==1024
          assert not r['promoted'] and not r['LIVE_changed'] and not r['final_MIDI_changed']
          assert not r['TEST_opened'] and not r['HELD_opened']
          print('S779_FIT_SELECTED',r['selected_tail_weight'])
          print('S779_CAL_INDEPENDENT_K',r['CAL']['selected']['exact_accuracy'])
          PY
      - name: Keep full FIT and CAL 7x7 confusion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S779_K5_K6_FIT80_OOF_CAL32_SPECIALIST
          path: /tmp/s779/report/report.json
          retention-days: 45
          if-no-files-found: warn
