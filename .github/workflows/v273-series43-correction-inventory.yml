name: V27.3 S43 audit every recoverable correction from largest first
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series43-correction-inventory.yml'
      - 'scripts/collect_v273_s43_archives.py'
      - 'scripts/audit_v273_s43_all_corrections.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-all-corrections:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy to independently check all source K classes
        run: python -m pip install numpy==1.26.4
      - name: Inventory and retrieve successful original S9 through S41 decision artifacts, including losing runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.collect_v273_s43_archives
          --repo "$GITHUB_REPOSITORY"
          --output model/S43-sources
      - name: Read all historical 208 regression loop candidates, 41 remembered variants, and S9-S41 native vectors
        run: >-
          python -m scripts.audit_v273_s43_all_corrections
          --root .
          --collection model/S43-sources
          --output model/S43-audit
      - name: Publish descending-ranked best corrections per loop and alias-aware complementary head signals
        run: cat model/S43-audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series43-all-correction-inventory
          path: |
            model/S43-sources/source_manifest.json
            model/S43-audit/
          retention-days: 90
