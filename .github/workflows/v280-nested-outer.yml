name: V28 nested five-fold outer training

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'scripts/train_v280_nested_outer.py'
      - 'test/test_v280_nested_outer.py'
      - 'analysis/v280-nested-outer-protocol.md'
      - 'analysis/v280-internal-ablation-results.md'
      - '.github/workflows/v280-nested-outer.yml'
      - '.github/workflows/v280-outer-fold-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v280-nested-outer-training
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  prepare:
    name: Verify provenance, resume tests and five-fold data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - name: Verify immutable data, internal selection and V27.3 reference sources
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const sources = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.train_v280_nested_outer import SOURCES; print(json.dumps(SOURCES))'
            ], {encoding: 'utf8'}));
            for (const source of Object.values(sources)) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: source.run_id,
              });
              if (run.head_sha !== source.head_sha || run.conclusion !== 'success') {
                throw new Error(`source run changed or incomplete: ${source.run_id}`);
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner, repo: context.repo.repo, run_id: source.run_id, per_page: 100,
              });
              const matches = artifacts.filter(a => a.name === source.artifact && !a.expired);
              if (matches.length !== 1 || matches[0].digest !== source.digest) {
                throw new Error(`missing or changed source artifact: ${source.artifact}`);
              }
              core.info(`${source.artifact}: immutable digest verified`);
            }
      - name: Test Adam resume, nested exclusion, complete refit and V28 regressions
        run: |
          python -m py_compile scripts/train_v280_nested_outer.py
          python -m unittest -v \
            test.test_v280_nested_outer \
            test.test_v280_internal_ablation \
            test.test_v280_real_smoke \
            test.test_v280_harmonic_count \
            test.test_v280_causal_cqt_mining
      - uses: actions/download-artifact@v4
        with:
          name: v280-cluster-metadata
          path: model/v280-cluster-metadata
          repository: Andriamarosoa/note
          run-id: '34346175521'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v272-verified-guitarset
          path: data/GuitarSet
          repository: Andriamarosoa/note
          run-id: '34287254337'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v280-causal-cqt-outer-clean-cache
          path: model
          repository: Andriamarosoa/note
          run-id: '34323015277'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v280-e-internal-comparison
          path: model/v280-e-selection
          repository: Andriamarosoa/note
          run-id: '34351021229'
          github-token: ${{ github.token }}
      - name: Verify GuitarSet checksums
        run: |
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
          echo 'aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip' | md5sum -c -
          df -h .
      - name: Prepare the canonical 240 tracks and nested partitions
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v280_nested_outer.py prepare \
            --dataset-dir data/GuitarSet \
            --cluster-dir model/v280-cluster-metadata \
            --cqt-dir model/v280-causal-cqt-cache \
            --selection-dir model/v280-e-selection \
            --output-dir model/v280-f-prepared \
            2>&1 | tee "$RUNNER_TEMP/v280-f-preparation.log"
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-prepared-all
          path: model/v280-f-prepared
          if-no-files-found: error
          compression-level: 3
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-preparation-audit
          path: |
            model/v280-f-prepared/manifest.json
            model/v280-f-prepared/split.json
            model/v280-f-prepared/labels.npz
            model/v280-f-prepared/evaluation.npz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v280-f-preparation-log
          path: ${{ runner.temp }}/v280-f-preparation.log
          if-no-files-found: warn
          retention-days: 30

  fold_0:
    name: Outer fold 0
    needs: prepare
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 0
  fold_1:
    name: Outer fold 1
    needs: fold_0
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 1
  fold_2:
    name: Outer fold 2
    needs: fold_1
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 2
  fold_3:
    name: Outer fold 3
    needs: fold_2
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 3
  fold_4:
    name: Outer fold 4
    needs: fold_3
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 4

  aggregate:
    name: Audit all five folds and compare with V27.3
    needs: fold_4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.23.5,<2.0'
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-preparation-audit
          path: model/v280-f-prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: v280-f-fold-?
          path: model/v280-f-results
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: v273-selective-transition-summary
          path: model/v273-reference
          repository: Andriamarosoa/note
          run-id: '34297767492'
          github-token: ${{ github.token }}
      - name: Recompute every score and verify paired coverage before any decision
        run: |
          python -B scripts/train_v280_nested_outer.py aggregate \
            --prepared-dir model/v280-f-prepared \
            --input-dir model/v280-f-results \
            --reference-dir model/v273-reference \
            --output-dir model/v280-f-summary
          cat model/v280-f-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-outer-comparison
          path: model/v280-f-summary
          if-no-files-found: error
          retention-days: 90
