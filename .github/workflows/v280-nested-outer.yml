name: V28 resume fold 0 evaluation and remaining folds

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'scripts/train_v280_nested_outer.py'
      - 'test/test_v280_nested_outer.py'
      - 'analysis/v280-nested-outer-protocol.md'
      - 'analysis/v280-internal-ablation-results.md'
      - '.github/workflows/v280-nested-outer.yml'
      - '.github/workflows/v280-outer-fold-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v280-nested-outer-training
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  prepare:
    name: Verify the correction and preserve completed fold 0 training
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - name: Verify the exact failed attempt and immutable saved artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const source = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.train_v280_nested_outer import RECOVERY_SOURCE; print(json.dumps(RECOVERY_SOURCE))'
            ], {encoding: 'utf8'}));
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: source.run_id});
            if (run.head_sha !== source.head_sha || run.status !== 'completed'
                || run.conclusion !== 'failure' || run.run_attempt !== source.run_attempt) {
              throw new Error('The frozen failed attempt changed; refusing automatic recovery');
            }
            const {data: job} = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}',
              {...repo, job_id: source.failed_job_id});
            if (job.run_id !== source.run_id || job.conclusion !== 'failure'
                || !job.steps.some(s => s.name === 'Verify the nested refit and predict the held fold once'
                  && s.conclusion === 'failure')) {
              throw new Error('The frozen pre-inference audit failure does not match');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...repo, run_id: source.run_id, per_page: 100});
            if (artifacts.some(a => a.name === 'v280-f-fold-0')) {
              throw new Error('An outer fold-0 result already exists in the source attempt');
            }
            for (const [name, expected] of Object.entries(source.artifacts)) {
              const matches = artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length !== 1 || matches[0].id !== expected.id || matches[0].digest !== expected.digest) {
                throw new Error('Missing or changed recovery artifact: ' + name);
              }
              core.info(name + ': original ID and digest verified');
            }
      - name: Run roundoff, provenance, Adam resume and V28 regression tests
        run: |
          python -m py_compile scripts/train_v280_nested_outer.py
          python -m unittest -v \
            test.test_v280_nested_outer \
            test.test_v280_internal_ablation \
            test.test_v280_real_smoke \
            test.test_v280_harmonic_count \
            test.test_v280_causal_cqt_mining
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-prepared-all
          path: model/v280-f-prepared
          repository: Andriamarosoa/note
          run-id: '34437608635'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-fold-0-probe-2
          path: model/v280-f-probe-2
          repository: Andriamarosoa/note
          run-id: '34437608635'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-fold-0-refit-2
          path: model/v280-f-refit-2
          repository: Andriamarosoa/note
          run-id: '34437608635'
          github-token: ${{ github.token }}
      - name: Reproduce the saved inner selection and verify all preserved files
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts import train_v280_nested_outer as f
          prepared = Path('model/v280-f-prepared')
          _, arrays, _ = f.load_prepared(prepared)
          prepared_sha = f.e.smoke._sha256_file(prepared / 'manifest.json')
          assert prepared_sha == f.RECOVERY_SOURCE['prepared_manifest_sha256']
          states = {}
          for phase in ('probe', 'refit'):
              root = Path('model/v280-f-' + phase + '-2')
              state = f.load_state(root, fold=0, phase=phase, prepared_sha=prepared_sha, allow_recovery=True)
              f.validate_training_history(state, arrays)
              assert state['chunk'] == 2 and state['epochs_completed'] == state['epoch_budget']
              states[phase] = state
          best = f.verify_probe_predictions(states['probe'],
              f.read_npz(Path('model/v280-f-probe-2/validation-predictions.npz')), arrays)
          assert states['refit']['selection'] == {
              'epoch': best['epoch'], 'validation': best['validation'],
              'probe_state_sha256': f.RECOVERY_SOURCE['state_sha256']['probe']}
          assert states['refit']['epoch_budget'] == best['epoch']
          f.e.emit('fold0_recovery_verified', selected_epoch=best['epoch'],
              refit_updates=states['refit']['optimizer_updates'], fold0_retraining_required=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-prepared-all
          path: model/v280-f-prepared
          if-no-files-found: error
          compression-level: 3
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-preparation-audit
          path: |
            model/v280-f-prepared/manifest.json
            model/v280-f-prepared/split.json
            model/v280-f-prepared/labels.npz
            model/v280-f-prepared/evaluation.npz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-fold-0-probe-2
          path: model/v280-f-probe-2
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-fold-0-refit-2
          path: model/v280-f-refit-2
          if-no-files-found: error
          retention-days: 90

  fold_0:
    name: Evaluate the saved fold 0 model without retraining
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-prepared-all
          path: model/v280-f-prepared
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-fold-0-probe-2
          path: model/v280-f-probe-2
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-fold-0-refit-2
          path: model/v280-f-refit-2
      - name: Apply the numeric audit correction and predict fold 0 once
        run: |
          python -B scripts/train_v280_nested_outer.py evaluate \
            --recover-fold0 \
            --prepared-dir model/v280-f-prepared \
            --fold 0 \
            --probe-dir model/v280-f-probe-2 \
            --refit-dir model/v280-f-refit-2 \
            --output-dir model/v280-f-fold-0
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-fold-0
          path: model/v280-f-fold-0
          if-no-files-found: error
          retention-days: 90

  fold_1:
    name: Outer fold 1
    needs: fold_0
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 1
  fold_2:
    name: Outer fold 2
    needs: fold_1
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 2
  fold_3:
    name: Outer fold 3
    needs: fold_2
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 3
  fold_4:
    name: Outer fold 4
    needs: fold_3
    uses: ./.github/workflows/v280-outer-fold-worker.yml
    with:
      fold: 4

  aggregate:
    name: Audit all five folds and compare with V27.3
    needs: fold_4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.23.5,<2.0'
      - uses: actions/download-artifact@v4
        with:
          name: v280-f-preparation-audit
          path: model/v280-f-prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: v280-f-fold-?
          path: model/v280-f-results
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: v273-selective-transition-summary
          path: model/v273-reference
          repository: Andriamarosoa/note
          run-id: '34297767492'
          github-token: ${{ github.token }}
      - name: Recompute every score and verify paired coverage before any decision
        run: |
          python -B scripts/train_v280_nested_outer.py aggregate \
            --recover-fold0 \
            --prepared-dir model/v280-f-prepared \
            --input-dir model/v280-f-results \
            --reference-dir model/v273-reference \
            --output-dir model/v280-f-summary
          cat model/v280-f-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v280-f-outer-comparison
          path: model/v280-f-summary
          if-no-files-found: error
          retention-days: 90
