name: S721 selective S708 plus polyphonic trained S720 head shrinkage CAL six-metric review
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - scripts/s721_shrink_poly_heads.py
      - test/test_s721_shrink_poly_heads.py
      - .github/workflows/note-s721-onset-shrinkage-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s721-selective-poly-head-shrinkage
  cancel-in-progress: true
jobs:
  S721_same_split_no_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned NOTE and CPU PyTorch
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test exact original probability and head-specific ablation contracts
        run: |
          python -m compileall -q scripts/s721_shrink_poly_heads.py
          python -m unittest -v test.test_s721_shrink_poly_heads test.test_s720_poly_onset_training test.test_s713_metric_contract
      - name: Fetch original S708, actual trained S720 checkpoints, pinned S707
        run: |
          mkdir -p /tmp/s721/s708 /tmp/s721/s720 /tmp/s721/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s721/s708
          gh run download 39113354252 --repo "${{ github.repository }}" --name S720_POLY_ONSET_FIT_CAUSAL_CAL_HELD_DEV_NO_PROMOTION --dir /tmp/s721/s720
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s721/s707
          test -s /tmp/s721/s708/s708_selected.pt
          test -s /tmp/s721/s720/poly_bass_epoch1.pt
          test -s /tmp/s721/s720/report.json
          test -s /tmp/s721/s707/s675_hazard.joblib
      - name: Test head-specific frozen source probabilities on real GuitarSet CAL; seal then re-evaluate HELD and DEV
        run: |
          python -m scripts.s721_shrink_poly_heads --s708-dir /tmp/s721/s708 --s720-dir /tmp/s721/s720 --offset-checkpoint /tmp/s721/s707/s675_hazard.joblib --out /tmp/s721/results
      - name: Validate no promotion, source SHA, and six-metric CAL selection
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s721/results/report.json'))
          assert r['promoted'] is False and r['TEST_opened'] is False
          assert r['CAL_selection_only'] is True
          assert r['CAL']['selected'] in r['CAL']['eligible']
          assert r['shadow_qualifies'] or r['frozen_selection']['name']=='S708_frozen' or not (r['HELD']['validated'] and r['DEV']['validated'])
          print('S721_REAL_GUITAR_CAUSAL_SELECTIVE_BLEND_EVIDENCE',json.dumps({
              'selected':r['frozen_selection'],
              'eligible':r['CAL']['eligible'],
              'CAL_F1':{k:round(v['onset_f1'],6) for k,v in r['CAL']['scores'].items()},
              'shadow_qualifies':r['shadow_qualifies']},sort_keys=True),flush=True)
          PY
      - name: Archive independent model matching and trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S721_CAUSAL_ONSET_SUSTAIN_K_SHRINKAGE_NO_PROMOTION
          path: /tmp/s721/results/report.json
          if-no-files-found: warn
          retention-days: 45
