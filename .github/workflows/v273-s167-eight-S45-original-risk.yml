name: S167 eight authentic S45 producer families with original 152 family Ridge models on GOAT
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s167_s45_eight_sources_original_ridge.py'
      - '.github/workflows/v273-s167-eight-S45-original-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s167-original-S45-eight-sources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_eight_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s167_s45_eight_sources_original_ridge --self-test
      - name: Original S45 genuine 304 trained Ridge checkpoint archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891039201
          name: v273-series45-specialized-risk-heads
          path: model/S45
      - name: Immutable five trained original source results S163
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198248491
          name: v273-s163-five-of-sixteen-original-S45-family-Ridge-95-models-GOAT
          path: model/S163
      - name: Immutable original trained S19 S20 S27 recurrent source results S166
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198716623
          name: v273-s166-authentic-trained-S19-S20-S27-recurrent-sources-newGOAT
          path: model/S166
      - name: Original S18 source native parent, adapted upstream S9
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195685473
          name: v273-s154-original-S13-S14-S15-S16-S17-S18-checkpoint-cascade-GOAT
          path: model/S154
      - name: Native S97 original acoustic inputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - name: Original native PR16 freeze and policy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - name: Explicitly new S135 adapted parent
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Original 8/16 real pretrained source decisions and 152 Ridge checkpoints, no MIDI
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          S154="$(find model/S154 -name original_S15_to_S18_trained_GOAT_adapted_S9.npz -print -quit)"
          S163="$(find model/S163 -name five_of_sixteen_original_weight_risk_GOAT.npz -print -quit)"
          S166="$(find model/S166 -name authentic_S19_S20_S27_original_weights_GOAT.npz -print -quit)"
          for f in "$S97" "$S85" "$S135" "$S154" "$S163" "$S166"; do test -s "$f"; done
          python -u -m scripts.s167_s45_eight_sources_original_ridge \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s154 "$S154" --s163 "$S163" --s166 "$S166" \
            --s45 model/S45 --catalog analysis/v273_s45_original_champion_catalog.json \
            --out model/S167
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S167/report.json'))
          assert d['GOAT_native_audio_events']==57
          assert d['original_family_source_count']==8
          assert d['missing_original_family_source_count']==8
          assert d['true_original_model_checkpoint_provenance_count']==152
          assert not d['source_16_original_families_all_executable']
          assert not d['GOAT_MIDI_truth_read'] and not d['S80_promoted']
          with np.load('model/S167/eight_of_sixteen_original_ridge_risks_GOAT.npz',allow_pickle=False) as z:
              assert z['eight_proposal_K'].shape==(57,8)
              assert z['original_ridge_two_risks'].shape==(57,8,2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s167-eight-of-sixteen-genuine-source-original-S45-152-Ridge-risks
          path: model/S167/
          retention-days: 90
