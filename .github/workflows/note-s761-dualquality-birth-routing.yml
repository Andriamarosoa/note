name: S761 FIT80 dual-quality heads 12 CAL32 protected MIDI loops
on:
  push:
    branches: [codex/note-s761-fit-dualquality-birth-routing]
    paths:
      - scripts/s761_fit_dualquality_birth_routing.py
      - test/test_s761_fit_dualquality_birth_routing.py
      - .github/workflows/note-s761-dualquality-birth-routing.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s761-dualquality-cal32
  cancel-in-progress: true
jobs:
  signed_native_event_protection_and_twelve_full_midi_cal32:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install signed NOTE runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify native note-off protection and causal future invariance
        run: |
          python -m compileall -q scripts/s761_fit_dualquality_birth_routing.py
          python -m unittest -v \
            test.test_s761_fit_dualquality_birth_routing \
            test.test_s757_source_collision_guard \
            test.test_s756_source_protected_mux \
            test.test_s755_pitch_coherent_k \
            test.test_s754_fit_k_specialist \
            test.test_s753_khead_decoder_anatomy \
            test.test_s750_six_axis_audit \
            test.test_s746_instance_guard
      - name: Restore signed S708 S707 and FIT80 S755 four specialist checkpoints
        run: |
          mkdir -p /tmp/s756/s708 /tmp/s756/s707 /tmp/s756/models
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s756/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s756/s707
          gh run download 39213327892 --repo "Andriamarosoa/note" --name S755_PITCH_COHERENT_RARE_K_FIT80_CAL32 --dir /tmp/s756/models
          test -s /tmp/s756/s708/report.json
          test -s /tmp/s756/s708/s708_selected.pt
          test -s /tmp/s756/s707/s675_hazard.joblib
          test -s /tmp/s756/models/s755_depth3_rare.joblib
          test -s /tmp/s756/models/s755_depth3_rare_strong.joblib
          test -s /tmp/s756/models/s755_depth5_rare.joblib
          test -s /tmp/s756/models/s755_depth5_rare_strong.joblib
      - name: Test 12 source-protected complete MIDI mergers on real GuitarSet CAL32
        run: |
          python -m scripts.s761_fit_dualquality_birth_routing \
            --s708-dir /tmp/s756/s708 \
            --offset-checkpoint /tmp/s756/s707/s675_hazard.joblib \
            --specialist-dir /tmp/s756/models \
            --out /tmp/s756/output
      - name: Independently enforce source signature and strict six-score safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s756/output/report.json').read_text())
          assert r["complete"] and r["reference_parity"]["valid"]
          assert r["schema"]=="S761_FIT80_DUAL_ONSET_COMPLETE_QUALITY_CAL32"
          assert r["loops"]==12 and len(r["CAL"])==12
          assert r["CAL_recordings_done"]==32
          assert r["selected"]=="S708_frozen" and not r["promoted"]
          assert r["original_release_unchanged"]
          assert r["no_truth_at_inference"]
          assert r["FIT_recordings_done"]==80
          assert r["FIT"]["trained_composition_count"]>0
          assert r["FIT"]["candidate_rows"]>=0
          assert r["heads"]=="FIT80_onset_and_complete"
          assert not r["LIVE_changed"] and not r["HELD_opened"] and not r["TEST_opened"]
          axes=("onset_f1","exact_k","active_exact_k","offset_accuracy",
                "full_note_f1","frame_pitch_f1")
          for name,trial in r["CAL"].items():
              assert trial["source_events_preserved"]
              assert set(trial["scores"])==set(axes)
              assert trial["safe"]==(
                  all(trial["delta"][m]>=-1e-12 for m in axes)
                  and all(x==0 for x in trial["lost"].values()))
              assert trial["six_gt80"]==(
                  trial["safe"] and all(trial["scores"][m]>.8 for m in axes))
          print("S761_FIT_DUALQUALITY_TWELVE_FULL_MIDI_SCORES",json.dumps({
              "reference":r["reference_scores"],
              "candidate":r["CAL_candidate"],
              "all_12":r["CAL"]}))
          PY
      - name: Publish all trial metrics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S761_FIT_DUALQUALITY_TWELVE_CAL32
          path: /tmp/s756/output/report.json
          retention-days: 45
          if-no-files-found: warn
