name: V10.3 clean two-group gate

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/run_v103_two_group_clean.py'
      - '.github/workflows/v103-two-group-clean.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  train-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p model/v100-spectral-cache
          for shard in 0 1 2 3 4 5 6 7; do
            mkdir -p "model/v100-spectral-cache/$shard"
            gh run download 33605122369 --repo "$GITHUB_REPOSITORY" --name "v100-spectral-$shard" --dir "model/v100-spectral-cache/$shard"
          done
      - name: Download frozen experts and stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p model/source-v84 model/source-v86 model/source-v87 model/source-v88 model/source-v101 model/source-v102 /tmp/v103c
          f(){ gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" > "/tmp/v103c/$1.zip"; unzip -q "/tmp/v103c/$1.zip" -d "$2"; }
          f 9826945605 model/source-v84
          f 9830602382 model/source-v86
          f 9831120911 model/source-v87
          f 9831664553 model/source-v88
          f 9842799517 model/source-v101
          f 9845793222 model/source-v102
      - name: Compile V10.3
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/train_v103_residual_soft_fusion.py scripts/run_v103_two_group_clean.py
      - name: Run clean V10.3
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          set -o pipefail
          python -B scripts/run_v103_two_group_clean.py \
            --cache-dir model/v100-spectral-cache \
            --v101-weights model/source-v101/v101-string-query-result/v101-string-query-attention.weights.h5 \
            --v101-report model/source-v101/v101-string-query-result/report.json \
            --v102-weights model/source-v102/v102-source-time-result/v102-source-time-assignment.weights.h5 \
            --v102-report model/source-v102/v102-source-time-result/report.json \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --output-dir model/v103-residual-soft-fusion-result \
            2>&1 | tee model/v103-residual-soft-fusion.log
      - name: Verify and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v103-residual-soft-fusion-result/report.json').read_text())
          a=r['architecture']; c=r['configuration']; d=r['data']; l=r['locked12']
          assert a['experts_trainable'] is False and a['hard_routing'] is False
          assert c['gate_fit_uses_locked12'] is False and c['decode_mode_selected_on_locked_validation'] is False
          assert d['clean_common_holdout_group_count'] == 2
          print('clean_groups', d['clean_common_holdout_groups'])
          print('gate_fit_clusters', d['gate_fit_cluster_count'])
          print('v101', l['v101_metrics'])
          print('v102', l['v102_metrics'])
          print('v103', l['v103_metrics'])
          print('cardinality', l['v103_cardinality'])
          print('poly', l['v103_poly_by_k'])
          print('alpha', l['alpha_mean'], l['alpha_median'], l['alpha_p90'])
          PY
      - name: Upload V10.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v103-clean-two-group-fusion
          path: |
            model/v103-residual-soft-fusion.log
            model/v103-residual-soft-fusion-result/report.json
            model/v103-residual-soft-fusion-result/v103-residual-soft-fusion.weights.h5
            model/v103-residual-soft-fusion-result/v103-feature-scaler.npz
          if-no-files-found: error
          retention-days: 14
