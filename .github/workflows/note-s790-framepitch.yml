name: S790 independent causal Frame Pitch FIT80 CAL32 plus six mandatory audits
on:
  push:
    branches: [codex/note-s790-independent-framepitch-causal-expert]
    paths:
      - scripts/s790_independent_framepitch_expert.py
      - scripts/s790_six_role_audits.py
      - test/test_s790_independent_framepitch_expert.py
      - test/test_s790_six_role_audits.py
      - .github/workflows/note-s790-framepitch.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  train_and_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU runtime with scikit-learn
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run Frame Pitch and six-auditor negative preflight tests
        run: |
          python -m compileall -q scripts/s790_independent_framepitch_expert.py scripts/s790_six_role_audits.py
          python -m unittest -v test.test_s790_independent_framepitch_expert test.test_s790_six_role_audits
          python -m scripts.verify_series_reports --series S790
      - name: Restore authentic signed S708 and S707
        run: |
          mkdir -p /tmp/s790/s708 /tmp/s790/s707
          gh run download 39094682419 --repo Andriamarosoa/note \
            --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS \
            --dir /tmp/s790/s708
          gh run download 39059008484 --repo Andriamarosoa/note \
            --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL \
            --dir /tmp/s790/s707
          test -s /tmp/s790/s708/report.json
          test -s /tmp/s790/s708/s708_selected.pt
          test -s /tmp/s790/s707/s675_hazard.joblib
      - name: Record source change list relative to protected S789
        run: |
          git fetch --no-tags origin codex/note-s789-deep-data-audit
          git diff --name-only FETCH_HEAD HEAD > /tmp/s790/changed_paths.txt
          echo S790_CHANGED_PATHS
          cat /tmp/s790/changed_paths.txt
      - name: Run FIT80 composition OOF and CAL32 frozen 49 pitch head
        run: |
          python -m scripts.s790_independent_framepitch_expert \
            --s708 /tmp/s790/s708 \
            --offset-checkpoint /tmp/s790/s707/s675_hazard.joblib \
            --out /tmp/s790/experiment
      - name: Verify experiment does not claim promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s790/experiment/report.json').read_text())
          assert r['complete']
          assert (r['fit_recordings_done'],r['cal_recordings_done'])==(80,32)
          assert r['feature_dimension']==40 and r['decision_clock_samples']==1024
          assert not any(r[k] for k in ('promoted','LIVE_changed','final_MIDI_changed','ONSET_OFFSET_changed','HELD_opened','TEST_opened'))
          assert r['no_CAL_training_or_selection']
          print('S790_SELECTED_FIT',r['selected_policy'])
          print('S790_FIT_BASE',r['FIT']['baseline']['f1'])
          print('S790_CAL_SHADOW_BASE',r['CAL']['baseline']['f1'])
          print('S790_CAL_SHADOW_TRIAL',r['CAL']['frozen']['f1'])
          PY
      - name: Export immutable S790 report and six-auditor inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S790_FIT80_CAL32_FRAMEPITCH_INDEPENDENT_SHADOW
          path: |
            /tmp/s790/experiment/report.json
            /tmp/s790/s708/report.json
            /tmp/s790/s708/s708_selected.pt
            /tmp/s790/changed_paths.txt
          retention-days: 45
          if-no-files-found: warn
  specialist_audit:
    needs: train_and_freeze
    name: Independent ${{ matrix.role }} Frame Pitch audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: S790_FIT80_CAL32_FRAMEPITCH_INDEPENDENT_SHADOW
          path: /tmp/s790
      - name: Individually verify ${{ matrix.role }} from immutable S790 and S708
        run: |
          python -m scripts.s790_six_role_audits \
            --role ${{ matrix.role }} \
            --report /tmp/s790/experiment/report.json \
            --signed /tmp/s790/s708/report.json \
            --checkpoint /tmp/s790/s708/s708_selected.pt \
            --source scripts/s790_independent_framepitch_expert.py \
            --changed /tmp/s790/changed_paths.txt \
            --out /tmp/s790/audits/role_${{ matrix.role }}.json
      - name: Archive independent specialist finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S790_AUDIT_${{ matrix.role }}
          path: /tmp/s790/audits/role_${{ matrix.role }}.json
          retention-days: 45
          if-no-files-found: warn
  consensus:
    needs: [train_and_freeze, specialist_audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S790_AUDIT_*
          path: /tmp/s790/audits
          merge-multiple: true
      - name: Six specialist reports required, fail closed
        run: |
          python -m scripts.s787_audit_consensus \
            --reports-dir /tmp/s790/audits \
            --out /tmp/s790/consensus/report.json
      - name: Preserve each report and consensus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S790_SIX_AUDITS_CONSENSUS
          path: |
            /tmp/s790/audits/role_*.json
            /tmp/s790/consensus/report.json
          retention-days: 45
          if-no-files-found: warn
