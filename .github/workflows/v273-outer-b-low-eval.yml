name: V27.3 Outer Eval B-Low Corrector

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-outer-b-low-eval-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-outer-b-low-eval
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-outer-b-low-eval-${{ github.run_id }}

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2

      - name: Validate evaluation script
        run: python -m py_compile scripts/evaluate_v273_outer_b_low_corrector.py

      - name: Restore frozen bundle, checkpoints, base outer predictions, and internal selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/freeze model/base model/selection

          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37208199201 \
            --repo "${{ github.repository }}" \
            --pattern v273-loss-weighting-uniform.tgz \
            --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo "${{ github.repository }}" \
            --pattern v273-uniform-anchored-freeze-result.tgz \
            --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/freeze

          gh release download v273-outer-robust-group-eval-37290794473 \
            --repo "${{ github.repository }}" \
            --pattern predictions.npz \
            --dir model/base

          gh release download v273-internal-b-like-subfamily-37297010313 \
            --repo "${{ github.repository }}" \
            --pattern report.json \
            --dir model/selection

          test -f model/uniform/uniform.weights.h5
          test -f model/freeze/freeze_local_combo.weights.h5
          test -f model/base/predictions.npz
          test -f model/selection/report.json

      - name: Verify frozen internal selection
        run: |
          python - <<'PY'
          import json
          r=json.load(open("model/selection/report.json"))
          assert r["outer_fold_3_used"] is False
          assert r["strict_candidate_count"] == 1
          s=r["selected_config"]
          assert s["config_id"] == "B_low|C=0.01|cw=none"
          assert s["strict_robust"] is True
          assert s["positive_global_folds"] == 3
          assert s["total_global_net"] == 19
          assert s["total_poly_net"] == 19
          assert s["min_global_net"] == 0
          print("Internal B_low selection locked:", s["config_id"])
          PY

      - name: Evaluate fixed B_low corrector on outer fold 3
        run: |
          python -B scripts/evaluate_v273_outer_b_low_corrector.py \
            --bundle model/bundle \
            --config analysis/v273-native-paired-config.json \
            --uniform-weights model/uniform/uniform.weights.h5 \
            --freeze-weights model/freeze/freeze_local_combo.weights.h5 \
            --outer-group-predictions model/base/predictions.npz \
            --selection-report model/selection/report.json \
            --output model/result

      - name: Publish outer evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "V27.3 one-shot outer eval of B_low corrector" \
            --notes-file model/result/report.md
          gh release upload "$TAG" \
            model/result/report.json \
            model/result/report.md \
            model/result/predictions.npz \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-outer-b-low-eval
          path: model/result/
          retention-days: 90
