name: S196 actual 7493 historical 255 group proposals and authentic audit summary reconstruction
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s196_restore_actual_historical_255_group_proposals.py'
      - '.github/workflows/v273-s196-authentic-original-255-audit-summary-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s196-historical-255-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact_preserved_parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original historical array scientific environment
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Verify 8 head 255 integer mask group order
        run: python -m scripts.s196_restore_actual_historical_255_group_proposals --self-test
      - name: Restore both independently preserved original 255 action matrices plus original 20D aggregated audits and parent risk logits
        run: |
          set -euo pipefail
          python -u -m scripts.s196_restore_actual_historical_255_group_proposals --root . --out model/S196
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S196/report.json'))
          assert d['original_255_x_7493_proposals_recovered']==7493*255
          assert d['original_historical_255_proposal_mismatches_independent_archive']==0
          assert d['reconstructed_group_membership_summary_max_abs_error']<1e-10
          assert d['all_authentic_parent_risk_logits_restored']
          assert not d['full_original_255x9_audit_tensor_available']
          assert not d['truth_labels_or_MIDI_values_accessed']
          assert not d['S80_promoted']
          with np.load('model/S196/authentic_archived_255_and_20D_aggregated_audits.npz',allow_pickle=False) as z:
              assert z['original_255_proposals'].shape==(7493,255)
              assert z['original_20D_destination_aggregates'].shape==(7493,7,20)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s196-authentic-historical-255-proposals-20D-audit-means-parent-risk-not-9D
          path: model/S196/
          retention-days: 90
