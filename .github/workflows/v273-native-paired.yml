name: V27.3 paired native decay on rebuilt sources

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths: ['analysis/v273-native-paired-launch.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v273-native-paired
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  EXPERIMENT_TAG: v273-native-decay-${{ github.run_id }}

jobs:
  prepare:
    name: Verify paired protocol and rebuilt inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v273-native-runtime
      - name: Verify successful source producer
        uses: actions/github-script@v7
        with:
          script: |
            const cfg = require('./analysis/v273-native-paired-config.json');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: cfg.source_run_id});
            if (run.conclusion !== 'success' || run.head_sha !== cfg.source_commit)
              throw new Error('rebuilt input producer mismatch');
      - name: Test native networks, paired minibatches and isolation guards
        run: |
          python -c 'import tensorflow; assert tensorflow.__version__ == "2.15.1"'
          python -m unittest -v test.test_v273_decay_native_inputs test.test_v273_native_paired test.test_v273_source_rebuild test.test_v273_selective_transition_corrector test.test_v271_poly_rescue
      - name: Restore checksum-pinned native caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/prepare_v273_native_experiment.py \
            --config analysis/v273-native-paired-config.json --output-dir model/native-cache
      - name: Verify archived composition folds on the real rebuilt data
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from scripts.train_v171_controlled_assignment_ab import _fold_context
          from scripts.train_v260_count_weighting import validate_partitions
          from scripts.train_v273_native_paired import evidence_table
          from scripts.rebuild_v273_sources import write_json
          args=SimpleNamespace(cache_dir=Path('model/native-cache'), dataset_dir=Path('data/GuitarSet'),
                               fold_manifest=Path('analysis/v273-native-paired-config.json'), outer_fold=1)
          ctx=_fold_context(args)
          outer,fit,val,final=validate_partitions(ctx)
          _,evidence=evidence_table(ctx['cache']['spectral'])
          write_json(Path('model/native-cache/native-evidence-audit.json'),evidence)
          print({'rows':len(ctx['k']),'outer':len(outer),'fit':len(fit),'val':len(val),'evidence':evidence})
          PY
      - name: Create durable experiment backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$EXPERIMENT_TAG" \
            analysis/v273-native-paired-config.json model/native-cache/verified-inputs.json \
            model/native-cache/native-evidence-audit.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "V27.3 native decay comparison — run $GITHUB_RUN_ID" \
            --notes-file analysis/v273-native-paired-protocol.md
      - uses: actions/upload-artifact@v4
        with:
          name: v273-native-verified-inputs
          path: model/native-cache
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  expert:
    name: Shared expert ${{ matrix.pair }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        pair: ['0-1', '0-2', '0-3', '0-4', '0-deploy',
               '1-0', '1-2', '1-3', '1-4', '1-deploy',
               '2-0', '2-1', '2-3', '2-4', '2-deploy',
               '3-0', '3-1', '3-2', '3-4', '3-deploy',
               '4-0', '4-1', '4-2', '4-3', '4-deploy']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v273-native-runtime
      - uses: actions/download-artifact@v4
        with:
          name: v273-native-verified-inputs
          path: model/native-cache
      - name: Verify sources before expert training
        run: |
          python -c "from scripts.v273_native_protocol import verify_native_cache; verify_native_cache('model/native-cache','analysis/v273-native-paired-config.json')"
      - name: Train the shared experts on isolated composition folds
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          IFS=- read -r OUTER HELD <<< "$PAIR"
          if [ "$HELD" = deploy ]; then
            MODE_ARGS=(--mode outer --seed "$((10791 + OUTER))")
          else
            MODE_ARGS=(--mode inner --inner-fold "$HELD" --seed "$((10491 + OUTER*100 + HELD))")
          fi
          python -B scripts/train_v104_nested_expert.py data/GuitarSet \
            --cache-dir model/native-cache \
            --v101-report model/native-cache/expert-config/v101-report.json \
            --v102-report model/native-cache/expert-config/v102-report.json \
            --fold-manifest analysis/v273-native-paired-config.json \
            --outer-fold "$OUTER" "${MODE_ARGS[@]}" --save-weights --output-dir model/expert
      - name: Back up completed or partial expert results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/expert \
            --name v273-native-expert-${{ matrix.pair }} --tag "$EXPERIMENT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-native-expert-${{ matrix.pair }}
          path: model/expert
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn

  paired:
    name: V27.3 with versus without native decay fold ${{ matrix.fold }}
    needs: expert
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/v273-native-runtime
      - uses: actions/download-artifact@v4
        with:
          name: v273-native-verified-inputs
          path: model/native-cache
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-native-expert-${{ matrix.fold }}-*
          path: model/experts
      - name: Rebuild the shared historical deployment anchor
        run: |
          python -B scripts/eval_v104_nested_outer.py data/GuitarSet \
            --cache-dir model/native-cache --inner-dir model/experts --outer-dir model/experts \
            --outer-fold ${{ matrix.fold }} --seed $((10521 + ${{ matrix.fold }})) \
            --fold-manifest analysis/v273-native-paired-config.json --save-weights \
            --output-dir model/result/anchor
      - name: Train the two native V27.3 arms and evaluate after calibration
        run: |
          python -B scripts/train_v273_native_paired.py \
            --dataset-dir data/GuitarSet --cache-dir model/native-cache \
            --expert-dir model/experts --anchor-dir model/result/anchor \
            --fold-manifest analysis/v273-native-paired-config.json \
            --outer-fold ${{ matrix.fold }} --output-dir model/result/paired
      - name: Back up completed or partial paired training
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/result \
            --name v273-native-paired-fold-${{ matrix.fold }} --tag "$EXPERIMENT_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-native-paired-fold-${{ matrix.fold }}
          path: model/result
          compression-level: 1
          retention-days: 90
          if-no-files-found: warn

  summary:
    name: Summarize five paired folds
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-native-paired-fold-*
          path: model/folds
      - name: Aggregate identical outer examples
        run: |
          python -B scripts/summarize_v273_native_paired.py --input-dir model/folds \
            --config analysis/v273-native-paired-config.json --output-dir model/summary
          cat model/summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Back up final results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/archive_v273_native_stage.py --root model/summary \
            --name v273-native-paired-summary --tag "$EXPERIMENT_TAG"
          gh release upload "$EXPERIMENT_TAG" model/summary/summary.md model/summary/summary.json --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-native-paired-summary
          path: model/summary
          retention-days: 90
          if-no-files-found: error
