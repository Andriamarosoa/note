name: S457 exact root causes of S454 conservative K gate abstention NO promotion
on:
  push:
    branches: [codex/s457-audit-upstream-K-gate-failures]
    paths:
      - 'scripts/s457_diagnose_S454_K_head_gating_abstention.py'
      - '.github/workflows/v273-s457-gate-rejection-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report_S454_failure_modes_without_external_label_fitting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate diagnostic gate error taxonomy
        run: |
          python -m py_compile scripts/s457_diagnose_S454_K_head_gating_abstention.py
          python -m scripts.s457_diagnose_S454_K_head_gating_abstention --self-test
      - name: Restore GuitarSet train-only S454 model selections and original external stage proof
        run: |
          gh run download 38534666034 -n s454-new-acoustic-1098D-K-head-GuitarSet-songheld-train-only-S80-NOPROMOTION -D model/S454 --repo ${{ github.repository }}
          gh run download 38533183193 -n s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion -D model/S453 --repo ${{ github.repository }}
          test -f model/S454/report.json
          test -f model/S453/report.json
      - name: Quantify correction false positives and safety blockers per K and fold, no retuning
        run: |
          python -u -m scripts.s457_diagnose_S454_K_head_gating_abstention \
            --s454 model/S454/report.json \
            --s453 model/S453/report.json \
            --out model/S457
          python - <<'PY'
          import json
          a=json.load(open('model/S457/report.json'))
          assert a['status']=='S457_S454_INNER_K_GATE_ABSTENTION_TRAINING_ONLY_DIAGNOSTIC'
          assert a['S454_trained_fold_count']==4 and a['all_120_threshold_checks_rejected']
          assert a['original_reference_unchanged'] and a['no_promotion']
          assert not a['external_info_used_for_prediction_model_or_thresholds']
          print('S457 research gate-failure root causes verified; S80 remains original')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s457-S454-120-inner-validation-K0K4-abstention-causes-NOPROMOTION
          path: model/S457/
          retention-days: 90
