name: S286 S287 ten original S45 source families on 506 native Dataset3 events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s286_original_five_S45_dataset3_506.py'
      - 'scripts/s287_original_recurrent_S45_dataset3_506.py'
      - '.github/workflows/v273-s286-s287-ten-S45-families-dataset3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s286-s287-original-ten-S45-dataset3
  cancel-in-progress: true
jobs:
  original_S45_five_neural_and_five_recurrent_producers:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original compatible PyTorch/sklearn inference
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore canonical 506 native S18 fourfold decisions and S97 acoustics
        run: |
          gh run download 38319911630 \
            -n s281-IDMT-dataset3-506-original-S5-S18-fourfold-133trained \
            -D model/S281 --repo ${{ github.repository }}
          gh run download 38320164646 \
            -n s282-s283-IDMT-dataset3-506-native-original-S18-quorum-S97-source \
            -D model/S282283 --repo ${{ github.repository }}
      - name: Download 5 original trained S11/S12/S38/S40/S41 families
        run: |
          gh run download 37853663514 -n v273-series11-native-risk -D model/S11 --repo ${{ github.repository }}
          gh run download 37853979683 -n v273-series12-full-audio -D model/S12 --repo ${{ github.repository }}
          gh run download 37880386031 -n v273-series38-poly-harmonic-expert -D model/S38 --repo ${{ github.repository }}
          gh run download 37880762289 -n v273-series40-temporal-cnn -D model/S40 --repo ${{ github.repository }}
          gh run download 37881191015 -n v273-series41-six-head-neural-fusion -D model/S41 --repo ${{ github.repository }}
      - name: Run original S11 S12 S38 S40 S41 producers without labels
        run: |
          python -u -m scripts.s286_original_five_S45_dataset3_506 \
            --s18 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s97 model/S282283/S283/S283_original_IDMT_dataset3_native_S97_audio.npz \
            --s11 model/S11 --s12 model/S12 --s38 model/S38 \
            --s40 model/S40 --s41 model/S41 --out model/S286
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/S286/report.json'))
          assert r['branches']==19 and r['events']==506 and len(r['family_ids'])==5
          assert not r['labels_read'] and not r['S80_promoted']
          with np.load('model/S286/five_rebased_S11_S12_S38_S40_S41.npz',allow_pickle=False) as z:
            assert z['proposals_K'].shape==(19,506,5)
          print('S286 PASS original 5 saved S45 trained families on Dataset3')
          PY
      - name: Download original trained 19 S19/S20/S25 recurrent heads
        run: |
          gh run download 37858017067 -n v273-series19-recurrent -D model/S19 --repo ${{ github.repository }}
          gh run download 37858383973 -n v273-series20-residual -D model/S20 --repo ${{ github.repository }}
          gh run download 37862417522 -n v273-series25-trained-Bfirst -D model/S25 --repo ${{ github.repository }}
      - name: Reproduce five S19 S20 S24 S25 S27 recurrent trained producers
        run: |
          python -m scripts.s168_original_S24_S25_Bfirst_GOAT --self-test
          python -m scripts.s166_external_original_S19_S20_S27 --self-test
          python -u -m scripts.s287_original_recurrent_S45_dataset3_506 \
            --s18 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s97 model/S282283/S283/S283_original_IDMT_dataset3_native_S97_audio.npz \
            --s19 model/S19 --s20 model/S20 --s25 model/S25 --out model/S287
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/S287/report.json'))
          assert r['branches']==19 and r['fold_branch_counts']==[5,4,5,5]
          assert not r['truth_labels_read'] and not r['S80_promoted']
          with np.load('model/S287/five_rebased_recurrent_S19_S20_S24_S25_S27.npz',allow_pickle=False) as z:
            assert z['proposals_K'].shape==(19,506,5)
          print('S287 PASS all five authentic recurrent trained source families')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s286-s287-original-ten-S45-families-19branches-dataset3-506-prelabel
          path: |
            model/S286/
            model/S287/
          retention-days: 90
