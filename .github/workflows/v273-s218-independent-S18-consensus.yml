name: S218 independently verify original S18 S46 hierarchical consensus
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s218_independent_verify_S18_fold_consensus.py'
      - '.github/workflows/v273-s218-independent-S18-consensus.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s218-independent-S18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_counter_oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Minimal independent environment
        run: python -m pip install numpy==1.26.4
      - name: Restore original 19-branch S45 and S46 outputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38242983478
          name: s215-complete-16-original-source-S45-S46-all19-branches
          path: model/S215
      - name: Restore sealed output from independent algorithm candidate S217
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294189867
          name: s217-19branch-piece-neutral-frozen-S18-S46-consensus-NO-accuracy
          path: model/S217
      - name: Independent Counter-based reimplementation for all original S18 S46 fold votes
        run: >-
          python -m scripts.s218_independent_verify_S18_fold_consensus
          --s215 model/S215
          --s217 model/S217/one_piece_neutral_193_policy_prediction.npz
          --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz
          --out model/S218
      - name: Enforce independent bit-exact replay and acknowledge any S46 suppression
        run: |
          python - <<'PY'
          import json
          r=json.load(open('model/S218/report.json'))
          assert len(r['all_checks_passed'])==8 and all(r['all_checks_passed'].values())
          assert r['branches']==19 and r['variants']==193 and r['rows']==57
          assert r['prior_s18_fold_disagreements']==6
          assert r['final_number_of_s18_values_per_event']==1
          assert r['final_S18_abstentions']>=0
          assert r['original_S46_branch_corrections_before_vote']>=0
          assert not r['independent_ExactK_accuracy_measured'] and not r['S80_promoted']
          print('S218 verified all 57 x 193 predictions independently; S46 accepted intervention count:',
                r['S46_policy_event_corrections_surviving_3_of_4'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s218-independent-S18-S46-4fold-vote-verification
          path: model/S218/
          retention-days: 90
