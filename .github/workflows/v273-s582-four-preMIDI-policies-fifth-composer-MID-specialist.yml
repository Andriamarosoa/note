name: S582 frozen four physical mid specialist note policies on fifth cohort audio BEFORE MIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s582_freeze_middle_specialist_28_vs_global_23_pre_S577_MIDI.py
      - .github/workflows/v273-s582-four-preMIDI-policies-fifth-composer-MID-specialist.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  freeze_prior23_vs_fitted28_middle12_real_NOTE_ON_before_true_MIDI:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore sklearn genuine CPU inference ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Verify strict 12-only mid pitches and four predeclared policies BEFORE opening any MIDI
        run: |
          python -m py_compile scripts/s582_freeze_middle_specialist_28_vs_global_23_pre_S577_MIDI.py
          python -m scripts.s582_freeze_middle_specialist_28_vs_global_23_pre_S577_MIDI --self-test
      - name: Restore only fifth registration's public CSV without audio or labels
        run: gh run download 38675435536 -n s577-fifth-novel-five-original-maestro-train-composers-after28-exposed-ONLY-METADATA -D model/S577 --repo "${{ github.repository }}"
      - name: Restore latest SUCCESSFUL fifth-cohort original WAV V88, BasicPitch and physical MIDI-blind note features
        run: |
          set -euo pipefail
          v88="$(gh run list --repo "${{ github.repository }}" --workflow v273-s579-fifth-original-V88-WAV-PREMIDI.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          bp="$(gh run list --repo "${{ github.repository }}" --workflow v273-s580-fifth-BP-prelabel.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          ft="$(gh run list --repo "${{ github.repository }}" --workflow v273-s581-fifth-49pitch-WAV-physics-PREMIDI.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          test -n "$v88" && test "$v88" != null
          test -n "$bp" && test "$bp" != null
          test -n "$ft" && test "$ft" != null
          gh run download "$v88" -n s579-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S579 --repo "${{ github.repository }}"
          gh run download "$bp" -n s580-next-five-S577-BasicPitch-original-pitch-names-PREMIDI -D model/S580 --repo "${{ github.repository }}"
          gh run download "$ft" -n s581-next-five-S577-composers-V88-raw49-pitch-PREMIDI -D model/S581 --repo "${{ github.repository }}"
      - name: Restore authentic fitted MIDI source-trained old23 and new28 original weights by report-SHA only
        run: |
          gh run download 38670001388 -n s569-real-23-composer-temporal52-restrike-two-genuine-NoteOn-heads -D model/S569 --repo "${{ github.repository }}"
          gh run download 38675146653 -n s578-28-real-composer-midi-trained-global52-and-mid12-52D-before-S577-WAV -D model/S578 --repo "${{ github.repository }}"
          test -s model/S569/S569_TWENTYTHREE_REAL_SOURCE_TRAINED_attack_positive_sites_52D.joblib
          test -s model/S578/S578_FULL28_general28_52D_TRUE_AUDIO_NOTE_MODEL.joblib
          test -s model/S578/S578_FULL28_mid12_52D_TRUE_AUDIO_NOTE_MODEL.joblib
      - name: Generate and SHA freeze actual 4 note-on policies under label embargo, including all V88 pitch events
        run: |
          python -u -m scripts.s582_freeze_middle_specialist_28_vs_global_23_pre_S577_MIDI \
            --manifest model/S577/report.json --v88-report model/S579/report.json \
            --bp-report model/S580/report.json \
            --features model/S581/S581_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --feature-report model/S581/report.json \
            --old-model-report model/S569/report.json --new-model-report model/S578/report.json \
            --old-weights model/S569 --new-weights model/S578 --out model/S582
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open("model/S582/report.json"))
          p=Path("model/S582/S582_NEW_FIFTH_COMPOSERS_FOUR_NAMED_NOTES_PREMIDI.jsonl")
          assert r["status"]=="S582_FIFTH_COMPOSER_NEW_MIDDLE_HEAD_FOUR_POLICIES_FROZEN_BEFORE_MIDI"
          assert r["source_MIDI_NOT_read_before_frozen_named_note_event_sha"]
          assert r["only_MIDI60_71_routed_to_specialist_all_other_unchanged"]
          assert len(r["four_predeclared_old_vs_new_same_song_policies"])==4
          assert len(r["trained_models_sha"])==3
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r["frozen_named_noteon_SHA"]
          assert r["no_promotion"] and r["original_S80_Live_ExactK_GuitarSet_unchanged"]
          print("S582 PASS all original note-on predictions SHA-frozen before any MIDI; source and weights independently verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s582-four-frozen-noteon-source-policies-global28-vs-mid12-before-original-S577-MIDI
          path: model/S582/
          retention-days: 90
