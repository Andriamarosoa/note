name: V27.3 Reference Hidden1 Nested Confirmation
on:
  push:
    branches: [codex/v273-failure-clustering]
    paths: ['analysis/v273-reference-hidden1-nested-launch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v273-reference-hidden1-nested
  cancel-in-progress: false
env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-reference-hidden1-nested-${{ github.run_id }}
jobs:
  outer:
    strategy:
      fail-fast: false
      matrix:
        outer_fold: [0,1,2,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - run: python -m py_compile scripts/validate_v273_reference_hidden1_nested_worker.py
      - name: Restore bundle and historical outer-fold checkpoints
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p model/download model/bundle model/outer-folds
          gh release download v273-window-pair-36351028493 --repo "${{ github.repository }}" --pattern native-window-bundle.zip --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          gh release download v273-candidate-hidden1-multifold-37271262794 --repo "${{ github.repository }}" --pattern v273-candidate-hidden1-multifold-folds.tgz --dir model/download
          tar -xzf model/download/v273-candidate-hidden1-multifold-folds.tgz -C model/outer-folds
      - name: Run nested confirmation for held-out fold
        run: |
          python -B scripts/validate_v273_reference_hidden1_nested_worker.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --outer-fold-root model/outer-folds             --outer-fold "${{ matrix.outer_fold }}"             --output "model/result-${{ matrix.outer_fold }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-reference-hidden1-nested-fold-${{ matrix.outer_fold }}
          path: model/result-${{ matrix.outer_fold }}/
          retention-days: 90
  summarize:
    needs: outer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-reference-hidden1-nested-fold-*
          path: model/results
      - run: python -B scripts/summarize_v273_reference_hidden1_nested.py --input-root model/results --output model/summary
      - name: Publish confirmatory validation
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tar -czf model/v273-reference-hidden1-nested-results.tgz -C model/results .
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "V27.3 reference hidden1 nested confirmation" --notes-file model/summary/report.md
          gh release upload "$TAG" model/summary/report.json model/summary/report.md model/v273-reference-hidden1-nested-results.tgz --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-reference-hidden1-nested-summary
          path: model/summary/
          retention-days: 90
