name: S541 prospective freeze 4 note-on policy forecasts on 5 MAESTRO composers BEFORE MIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s541_freeze_s536_on_five_new_composers_no_MIDI.py
      - .github/workflows/v273-s541-freeze-5-song-notes-before-MIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  never_open_original_held_MIDI_until_four_policy_sound_NoteOn_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original trained ExtraTrees checkpoint and immutable pitch feature ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Check four fixed protected policies and original BP chords remain intact
        run: |
          python -m py_compile scripts/s541_freeze_s536_on_five_new_composers_no_MIDI.py
          python -m scripts.s541_freeze_s536_on_five_new_composers_no_MIDI --self-test
      - name: Restore S537 immutable preregistration, S538 frozen V88 and S539 pretrained BP WITHOUT any MIDI
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656509448 -n s538-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S538 --repo "${{ github.repository }}"
          gh run download 38656730774 -n s539-five-new-composers-BasicPitch-fixed-original-note-predictions-PREMIDI -D model/S539 --repo "${{ github.repository }}"
          gh run download 38656791368 -n s540-five-composers-original-V88-all-event-49x11-WAV-physical-pitch-features-preMIDI -D model/S540 --repo "${{ github.repository }}"
      - name: Restore only S528 3 genuine source-trained external held pitch models, no new S537 labels
        run: |
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          test -s model/S528/S528_raw_only_held0_ACTUAL_PIANO_AUDIO_NOTE_HEAD.joblib
          test -s model/S528/S528_raw_only_held1_ACTUAL_PIANO_AUDIO_NOTE_HEAD.joblib
          test -s model/S528/S528_raw_only_held2_ACTUAL_PIANO_AUDIO_NOTE_HEAD.joblib
      - name: WITHOUT reading MIDI emit and SHA-seal exact named notes from BP, raw, dedup80, dedup100 plus harmonic
        run: |
          python -u -m scripts.s541_freeze_s536_on_five_new_composers_no_MIDI \
            --manifest model/S537/report.json \
            --source-report model/S538/report.json --bp-report model/S539/report.json \
            --features model/S540/S540_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --features-report model/S540/report.json \
            --old-training-report model/S528/report.json --weights model/S528 \
            --out model/S541
          python - <<'PY'
          import json
          r=json.load(open("model/S541/report.json"))
          assert r['status']=='S541_FIVE_NEW_COMPOSER_PREMIDI_FROZEN_S528_BP_S533_S536_NAMED_NOTES'
          assert r['all_FIVE_new_S537_composers_scored_without_labels']
          assert r['original_s528_three_SOURCE_HELD_real_audio_models_ENSEMBLE_MEAN']
          assert len(r['actual_original_S528_weight_checkpoints_SHA_verified'])==3
          assert r['four_policies_predeclared']==['BP_birth','raw_mean_0p7','dedup80','dedup100_harm080']
          assert r['original_BP_birth_chords_never_suppressed']
          assert not r['original_true_MIDI_note_contents_OPENED'] and r['no_promotion']
          print("S541 ALL five-composer original NOTE NAMES pre-MIDI sealed. Only now S542 may read MIDI.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s541-FROZEN-before-MIDI-5-original-MAESTRO-composers-S528-S533-S536-noteon-policies
          path: model/S541/
          retention-days: 90
