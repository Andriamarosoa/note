name: S686 causal harmonic fundamental onset rescue four-lock GuitarSet
on:
  push:
    branches: [codex/note-s686-causal-fundamental-novelty-rescue]
    paths:
      - scripts/s686_causal_fundamental_novelty.py
      - test/test_s686_causal_fundamental_novelty.py
      - .github/workflows/note-s686-causal-fundamental-rescue.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s686-rescue-evidence
  cancel-in-progress: true
jobs:
  fundamental_rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install NOTE native model and sklearn
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compile, test causal FFT-only rescues
        run: |
          python -m compileall -q scripts/s686_causal_fundamental_novelty.py test/test_s686_causal_fundamental_novelty.py
          python -m unittest -v test.test_s686_causal_fundamental_novelty
      - name: Retrieve previously trained certified S675 release head
        run: |
          mkdir -p /tmp/s686_s675
          gh run download 39056766998 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s686_s675
          test -f /tmp/s686_s675/s675_hazard.joblib
          test -f /tmp/s686_s675/s675_checkpoint.json
      - name: Audit 20 CAL and 16 held TRAIN plus 12 DEV with frozen source heads
        run: python -m scripts.s686_causal_fundamental_novelty --out /tmp/s686 --checkpoint /tmp/s686_s675/s675_hazard.joblib
      - name: Save complete evidence including rejections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S686_GUITARSET_WEAK_FUNDAMENTAL_CAUSAL_NOVELTY
          path: /tmp/s686/report.json
          if-no-files-found: warn
          retention-days: 60
