name: V27.3 Inner Candidate Hidden1 Transplant Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-inner-candidate-hidden1-audit-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-inner-candidate-hidden1-audit
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-inner-candidate-hidden1-audit-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate internal-only audit
        run: |
          python -m py_compile scripts/audit_v273_inner_posttrain_candidate_hidden1.py
          python - <<'PY'
          from scripts.audit_v273_inner_posttrain_candidate_hidden1 import (
              FREEZE_LOCAL, TRANSPLANT_LAYER, EPOCHS
          )
          assert FREEZE_LOCAL==("candidate_norm","candidate_hidden2","cardinality")
          assert TRANSPLANT_LAYER=="candidate_hidden1"
          assert EPOCHS==8
          print({"freeze":FREEZE_LOCAL,"transplant":TRANSPLANT_LAYER,"epochs":EPOCHS})
          PY

      - name: Restore frozen shared bundle only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          test -f model/bundle/bundle.json

      - name: Run inner-only audit
        run: |
          python -B scripts/audit_v273_inner_posttrain_candidate_hidden1.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --output model/result

      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-inner-candidate-hidden1-audit-result.tgz -C model/result .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 inner candidate_hidden1 post-train transplant audit"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/result/predictions.npz             model/v273-inner-candidate-hidden1-audit-result.tgz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-inner-candidate-hidden1-audit
          path: model/result/
          retention-days: 90
