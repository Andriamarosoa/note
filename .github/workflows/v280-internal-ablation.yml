name: V28 internal harmonic ablation training

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'scripts/train_v280_internal_ablation.py'
      - 'test/test_v280_internal_ablation.py'
      - 'analysis/v280-internal-ablation-protocol.md'
      - '.github/workflows/v280-internal-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v280-internal-ablation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_DETERMINISTIC_OPS: '1'
  TF_NUM_INTRAOP_THREADS: '4'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  prepare:
    name: Freeze internal partitions and prepare real training rows
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Verify sources against the frozen protocol
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const sources = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.train_v280_internal_ablation import SOURCES; print(json.dumps(SOURCES))'
            ], {encoding: 'utf8'}));
            for (const source of Object.values(sources)) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: source.run_id,
              });
              if (run.head_sha !== source.head_sha || run.conclusion !== 'success') {
                throw new Error(`source run changed or incomplete: ${source.run_id}`);
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner, repo: context.repo.repo, run_id: source.run_id, per_page: 100,
              });
              const matches = artifacts.filter(a => a.name === source.artifact && !a.expired);
              if (matches.length !== 1 || matches[0].digest !== source.digest) {
                throw new Error(`missing or changed artifact: ${source.artifact}`);
              }
              core.info(`${source.artifact}: ${matches[0].size_in_bytes} bytes; digest verified`);
            }

      - name: Run V28 regression tests including paired initialization and weighted losses
        run: |
          python -m py_compile scripts/train_v280_internal_ablation.py
          python -m unittest -v \
            test.test_v280_internal_ablation \
            test.test_v280_real_smoke \
            test.test_v280_harmonic_count \
            test.test_v280_causal_cqt_mining

      - name: Download preserved cluster metadata
        uses: actions/download-artifact@v4
        with:
          name: v280-cluster-metadata
          path: model/v280-cluster-metadata
          repository: Andriamarosoa/note
          run-id: '34346175521'
          github-token: ${{ github.token }}
      - name: Download verified GuitarSet
        uses: actions/download-artifact@v4
        with:
          name: v272-verified-guitarset
          path: data/GuitarSet
          repository: Andriamarosoa/note
          run-id: '34287254337'
          github-token: ${{ github.token }}
      - name: Download verified causal CQT cache
        uses: actions/download-artifact@v4
        with:
          name: v280-causal-cqt-outer-clean-cache
          path: model
          repository: Andriamarosoa/note
          run-id: '34323015277'
          github-token: ${{ github.token }}

      - name: Check GuitarSet checksums
        run: |
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
          echo 'aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip' | md5sum -c -
          df -h .

      - name: Prepare every internal row with composition guards
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v280-e-prepare-logs
          python -B scripts/train_v280_internal_ablation.py prepare \
            --dataset-dir data/GuitarSet \
            --cluster-dir model/v280-cluster-metadata \
            --cqt-dir model/v280-causal-cqt-cache \
            --output-dir model/v280-e-prepared \
            2>&1 | tee model/v280-e-prepare-logs/preparation.log

      - name: Publish verified training cache for both arms
        uses: actions/upload-artifact@v4
        with:
          name: v280-e-prepared-internal
          path: model/v280-e-prepared
          if-no-files-found: error
          compression-level: 3
          retention-days: 7
      - name: Preserve preparation manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v280-e-preparation-audit
          path: |
            model/v280-e-prepared/manifest.json
            model/v280-e-prepared/split.json
            model/v280-e-prepare-logs
          if-no-files-found: warn
          retention-days: 30

  train:
    name: Train ${{ matrix.arm }} for 12 epochs
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [harmonic, no_harmonic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - uses: actions/download-artifact@v4
        with:
          name: v280-e-prepared-internal
          path: model/v280-e-prepared

      - name: Train from scratch and validate on different compositions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v280-e-logs
          python -B scripts/train_v280_internal_ablation.py train \
            --prepared-dir model/v280-e-prepared \
            --arm '${{ matrix.arm }}' \
            --output-dir 'model/v280-e-${{ matrix.arm }}' \
            2>&1 | tee 'model/v280-e-logs/${{ matrix.arm }}.log'

      - name: Preserve weights, validation predictions, history and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v280-e-${{ matrix.arm }}
          path: |
            model/v280-e-${{ matrix.arm }}
            model/v280-e-logs/${{ matrix.arm }}.log
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Verify both arms and compare internal validation
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.23.5,<2.0'
      - uses: actions/download-artifact@v4
        with:
          name: v280-e-harmonic
          path: model/v280-e-results
      - uses: actions/download-artifact@v4
        with:
          name: v280-e-no_harmonic
          path: model/v280-e-results

      - name: Recompute metrics and verify identities and equal training budgets
        run: |
          python scripts/train_v280_internal_ablation.py compare \
            --input-dir model/v280-e-results \
            --output-dir model/v280-e-comparison
      - name: Publish comparison summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('model/v280-e-comparison/comparison.json').read_text())
          print('## V28.0-E internal training comparison')
          print()
          print('| Variant | Best epoch | Internal polyphonic Exact-K | Internal global Exact-K |')
          print('|---|---:|---:|---:|')
          for name, arm in r['arms'].items():
              m = arm['selected_validation']
              print(f"| {name} | {arm['best_epoch']} | {m['poly_exact_k']:.4%} | {m['exact_k']:.4%} |")
          print()
          print(f"Internal preference: {r['internal_preference']}.")
          print('Single internal development split; no outer score or promotion. V27.3 remains the reference.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v280-e-internal-comparison
          path: model/v280-e-comparison
          if-no-files-found: error
          retention-days: 90
