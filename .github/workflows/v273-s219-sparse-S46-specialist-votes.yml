name: S219 active specialist S46 fusion without treating silent folds as vetoes
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s219_sparse_s46_specialist_branch_fusion.py'
      - '.github/workflows/v273-s219-sparse-S46-specialist-votes.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s219-sparse-S46-specialist-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sparse_fold_specialists:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal inference dependencies
        run: python -m pip install numpy==1.26.4
      - name: Test abstention versus genuine conflicting specialist folds
        run: python -m scripts.s219_sparse_s46_specialist_branch_fusion --self-test
      - name: Original checkpoint 19-branch S45 S46 source bank
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38242983478
          name: s215-complete-16-original-source-S45-S46-all19-branches
          path: model/S215
      - name: Immutable original S18 4-fold parent consensus source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38294189867
          name: s217-19branch-piece-neutral-frozen-S18-S46-consensus-NO-accuracy
          path: model/S217
      - name: Recombine source-only active specialists without labels or retraining
        run: >-
          python -m scripts.s219_sparse_s46_specialist_branch_fusion
          --s215 model/S215
          --s217 model/S217/one_piece_neutral_193_policy_prediction.npz
          --out model/S219
      - name: Verify branch invariance, parent consistency and no quality claims
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S219/report.json'))
          assert r['branches']==19 and r['folds']==[0,1,2,4]
          assert r['policy_variants']==193 and r['sample_count']==57
          assert r['original_S18_parent_policy']=='S217 majority3of4 else freeze unchanged'
          assert r['branch_identity_permutation_invariant']
          assert r['new_S46_interventions_after_sparse_fusion']>=0
          assert not r['labels_read'] and not r['score_measured']
          assert r['new_deployment_accuracy_unverified'] and not r['S80_promoted']
          with np.load('model/S219/conditional_sparse_193_policy_prediction.npz',allow_pickle=False) as z:
            assert z['s46_policy_K'].shape==(57,193)
            assert np.array_equal(z['s46_policy_K'][:,0],z['s18_consensus_K'])
            assert np.isin(z['s46_policy_K'],range(7)).all()
          print('S219 PASS: conditional specialist consensus, source interventions:',
                r['new_S46_interventions_after_sparse_fusion'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s219-conditional-specialist-S46-19-branch-4fold-candidate
          path: model/S219/
          retention-days: 90
