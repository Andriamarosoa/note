name: S187 postfreeze frozen S185 disjoint IDMT chord CSV format inspection
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s187_idmt_frozen_s185_annotation_csv_schema.py'
      - '.github/workflows/v273-s187-postfreeze-IDMT-chord-schemas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s187-csv-postfreeze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  annotation_schema_after_predictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import shared ZIP remote reader dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test exact track path and CSV schema parser without labels
        run: python -m scripts.s187_idmt_frozen_s185_annotation_csv_schema --self-test
      - name: Read only exact-matched original CSV labels for ten already-frozen second IDMT WAVs
        run: python -u -m scripts.s187_idmt_frozen_s185_annotation_csv_schema --output model/S187/chord_CSV_postfreeze_schema.json
      - name: Fail closed on ExactK inference from chord-name category
        run: |
          python - <<'PY'
          import json
          d=json.load(open('model/S187/chord_CSV_postfreeze_schema.json'))
          assert d['frozen_S185_GitHub_run_id']==38209386300
          assert d['frozen_10_disjoint_WAV_count']==10
          assert d['exact_matched_same_instrument_chord_CSV_files']>=1
          assert not d['new_annotations_converted_into_exact_pitch_count']
          assert not d['ExactK_accuracy_measured']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s187-postfreeze-S185-chord-label-format-only-NO-ExactK-score
          path: model/S187/
          retention-days: 90
