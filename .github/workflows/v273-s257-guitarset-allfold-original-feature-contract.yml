name: S257 GuitarSet full 59309 original fold feature contract and rebuild feasibility
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - '.github/workflows/v273-s257-guitarset-allfold-original-feature-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s257-native-59309-feature-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_4fold_audio_source_shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Original 527D S4 owned/acoustic views, fold0
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/input/fold0
      - name: Original 527D S4 owned/acoustic views, fold1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/input/fold1
      - name: Original 527D S4 owned/acoustic views, fold2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/input/fold2
      - name: Original 527D S4 owned/acoustic views, fold4
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/input/fold4
      - name: Inventory individual feature data types, native ownership and critical original model input views
        run: |
          python - <<'PY'
          import numpy as np,zipfile,json
          from pathlib import Path
          report=dict(status='S257_ORIGINAL_59309_FEATURES_READY_FOR_NEW_S80_FOLD_NEUTRAL',folds={})
          for fold in [0,1,2,4]:
            d={}
            for f in sorted(Path(f'model/input/fold{fold}').rglob('*')):
              if not f.is_file():continue
              if f.suffix=='.npz':
                with np.load(f,allow_pickle=False) as z:
                  d[str(f.relative_to(Path(f'model/input/fold{fold}')))]={
                    k:{'shape':list(z[k].shape),'dtype':str(z[k].dtype)} for k in z.files}
              elif f.suffix=='.zip':
                with zipfile.ZipFile(f) as z:
                  d[str(f.name)]={'zip_entries':z.namelist()[:15]}
              else:
                d[str(f.name)]={'size':f.stat().st_size}
            report['folds'][str(fold)]=d
          Path('model/S257').mkdir(parents=True,exist_ok=True)
          Path('model/S257/report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2),flush=True)
          assert any(report['folds'].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s257-original-guitarset-59309-4fold-audio-feature-schema-for-S80
          path: model/S257/
