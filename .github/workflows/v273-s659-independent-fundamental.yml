name: S659 causal independent fundamental guard real GuitarSet
on:
  push:
    branches: [codex/s659-independent-fundamental-probe]
    paths:
      - scripts/s659_independent_fundamental_probe.py
      - test/test_s659_independent_fundamental_probe.py
      - .github/workflows/v273-s659-independent-fundamental.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s659-independent-fundamental
  cancel-in-progress: true
jobs:
  measure_realtime_causal_octaves:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact NOTE native runtime
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compile and unit-test S659
        run: |
          python -m compileall -q scripts/s659_independent_fundamental_probe.py test/test_s659_independent_fundamental_probe.py
          python -m unittest -v test.test_s659_independent_fundamental_probe
      - name: Validate on 36 TRAIN recordings and 12 DEV real GuitarSet
        run: python -m scripts.s659_independent_fundamental_probe --out /tmp/s659_fundamental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S659_GUITARSET_CAUSAL_FUNDAMENTAL_GUARD
          path: /tmp/s659_fundamental/report.json
          if-no-files-found: warn
          retention-days: 60
