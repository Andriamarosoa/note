name: S439 freeze label-blind real MIC K-locked joint musical-note candidates
on:
  push:
    branches: [codex/s439-joint-pitch-competition-klocked]
    paths:
      - 'scripts/s439_klocked_real_MIC_joint_pitch_challengers.py'
      - '.github/workflows/v273-s439-real-MIC-joint-pitch-Klocked.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s439-joint-chord-freeze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freeze_joint_notes_without_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original acoustic extraction environment
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test combinatorial note decoder strictly preserves K0..K6
        run: |
          python -m py_compile scripts/s439_klocked_real_MIC_joint_pitch_challengers.py
          python -m scripts.s439_klocked_real_MIC_joint_pitch_challengers --self-test
      - name: Restore genuine S437 predictions BEFORE labels
        run: |
          gh run download 38523251921 -n s437-twelve-real-guitar-MIC-K-balanced-frozen-note-names-no-truth -D model/S437 --repo ${{ github.repository }}
          test -f model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl
      - name: Restore genuine MIC WAV without any annotations
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 4 -o data/GuitarSet/audio_mono-mic.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/audio_mono-mic.zip
          echo '275966d6610ac34999b58426beb119c3  data/GuitarSet/audio_mono-mic.zip' | md5sum -c -
      - name: Freeze two preregistered joint combinations on 174 genuine MIC events with unchanged S80 K
        run: |
          python -u -m scripts.s439_klocked_real_MIC_joint_pitch_challengers \
            --names model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl \
            --s437-report model/S437/report.json \
            --mic-zip data/GuitarSet/audio_mono-mic.zip \
            --out model/S439
          python - <<'PY'
          import json
          d=json.load(open('model/S439/report.json'))
          assert d['status']=='S439_K_LOCKED_LABEL_BLIND_REAL_MIC_JOINT_NOTE_SET_CHALLENGERS'
          assert d['n_events']==174 and d['distinct_compositions']==12
          assert d['S80_K_regressions']==0 and d['all_Original_S80_K_unchanged']
          assert d['no_JAMS_annotations_opened'] and d['fixed_weights_before_S440_labels']
          assert set(d['candidates'])=={'conservative','exploratory'}
          assert d['not_validated_and_not_promoted']
          print('S439 prospective frozen challenger outputs validated; truth still unopened')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s439-real-MIC-joint-note-set-candidates-FROZEN-BEFORE-TRUE-JAMS
          path: model/S439/
          retention-days: 90
