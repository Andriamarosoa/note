name: S502 13 conditional note-onset head selections from true frozen Exact-K and pitch sources
on:
  push:
    branches: [codex/s502-note-heads-selections]
    paths:
      - scripts/s502_note_birth_head_selection_adapters.py
      - .github/workflows/v273-s502-note-birth-head-selections.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent_real_original_K_pitch_head_selection_bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install pure source pretrained note predictions numerical adapter ABI
        run: python -m pip install numpy==1.26.4
      - name: Test original Exact-K style head availability, action/K masks, no invented notes or promotion
        run: |
          python -m py_compile scripts/s502_note_birth_head_selection_adapters.py
          python -m scripts.s502_note_birth_head_selection_adapters --self-test
      - name: Restore original real guitar S80 and piano V88 canonical note event graph before labels
        run: |
          gh run download 38590187399 \
            -n s498-true-S80-guitar-V88-piano-canonical-unique-musical-note-onset-groups-no-truth \
            -D model/S498 --repo "${{ github.repository }}"
      - name: Restore SHA-frozen actual note pitch selections from original model without XML/MIDI
        run: |
          gh run download 38591108937 \
            -n s500-joint-count-constrained-harmonic-ranked-pitch-names-original-S80-guitar-V88-piano-PREXML \
            -D model/S500 --repo "${{ github.repository }}"
      - name: Materialize 13 specialist selection candidates and neural-compatible head-K masks WITHOUT labels
        run: |
          python -u -m scripts.s502_note_birth_head_selection_adapters \
            --graph model/S498 --graph-report model/S498/report.json \
            --names model/S500 --names-report model/S500/report.json \
            --out model/S502
          python - <<'PY'
          import json,numpy as np
          z=json.load(open('model/S502/report.json'))
          assert z['status']=='S502_CLASS_CONDITIONAL_NOTE_HEADS_SELECTIONS_ARCHITECTURE_PRELABEL'
          assert z['number_of_registered_heads']==13
          assert z['only_fallback_head_currently_eligible_for_production']
          assert z['no_NN_training_or_external_ground_truth_used']
          assert z['no_promotion']
          for corpus in ('guitar_S80','piano_V88'):
            with np.load('model/S502/S502_'+corpus+'_HEAD_K_MASKS_PRELABEL.npz') as a:
              assert a['head_k_mask'].shape[1:]==(13,7)
              assert a['head_mask'].shape[1]==13
              assert np.all(a['production_eligible'][:,0])
              assert not np.any(a['production_eligible'][:,1:])
              assert a['head_k_mask'][:,0,:].all()
          print('S502 13 genuinely distinct source-auditable audio-note head masks built; NO trained selector or production modification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s502-original-S80-V88-thirteen-real-note-heads-class-conditional-selections-PREXML
          path: model/S502/
          retention-days: 90
