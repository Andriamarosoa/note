name: S637 same real MIDI mic WAV replayed through NOTE S614 transport
on:
  push:
    branches: [codex/s634-midi-live-transport]
    paths:
      - scripts/s637_real_recording_same_audio.py
      - .github/workflows/v273-s637-microphone-recording-a-b.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual_recorded_audio_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the same real original WAV and MIDI transcription
        uses: actions/checkout@v4
        with:
          repository: Andriamarosoa/midi
          ref: 536536f54290fdc4f63db28aa063d2e324121642
          path: midi_reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install real NOTE inference and MIDI-only pure Python parser
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install mido==1.3.3
      - name: Reuse identical recorded microphone WAV without ground-truth claims
        run: |
          python -m scripts.s637_real_recording_same_audio \
            --wav midi_reference/runs/polyphonic/live_poly_v2.wav \
            --midi midi_reference/runs/polyphonic/live_poly_v2_v221_fallback90.mid \
            --midi-report midi_reference/runs/polyphonic/live_poly_v2_v221_fallback90.json \
            --out /tmp/S637/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S637-original-same-real-audio-AB-counts-and-CPU-no-labels
          path: /tmp/S637
          if-no-files-found: warn
          retention-days: 60
