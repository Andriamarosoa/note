name: S369 prove first true K3 undercount stage original S18 vs S46 vs S69 on six frozen regressions
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s369_original_S18_S46_S69_6_K3_regression_point_of_origin.py'
      - '.github/workflows/v273-s369-frozen-S18-S46-S69-K3-origin.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s369-original-s18-s46-s69-six-K3-source
  cancel-in-progress: true
jobs:
  replay_preregistered_S69_and_locate_original_S18_or_S46_K3_bottleneck:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA-logged deterministic original prelabel trained S69 stage
        run: |
          gh run download 38330878525 \
            -n s359-IDMT-original-20trained-S80-source-stages-rebased-to-24-WAV-PREXML \
            -D model/S359 --repo ${{ github.repository }}
          for file in model/S359/*.py; do cp "$file" "scripts/$(basename "$file" | sed 's/_477/_967/g')"; done
          test -s scripts/s349_S69_fourfold_dataset1_967.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore genuine prelabel original S18 fourfold and S46 193 trained original bank on SAME 967 event IDs
        run: |
          gh run download 38331203079 \
            -n chords-967-S338-S339-source -D model/source --repo ${{ github.repository }}
          gh run download 38331203079 \
            -n chords-967-S345-S347-S46 -D model/fusion --repo ${{ github.repository }}
          gh run download 38331203079 \
            -n chords-967-S348-PR16 -D model/pr16 --repo ${{ github.repository }}
          gh run download 38177948016 \
            -n v273-s69-s46-risk-replay -D model/S69rules --repo ${{ github.repository }}
      - name: Replay original trained fourfold S69 rules to get TRUE original upstream K3 source; NO labels read
        run: |
          python -u -m scripts.s349_S69_fourfold_dataset1_967 \
            --s247 model/fusion/S346/S346_original_193_S46_foldneutral_967_IDMT.npz \
            --pr16 model/pr16/pr16_external_36_policies.npz \
            --rules model/S69rules/report.json \
            --out model/S349replay
          python - <<'PY'
          import numpy as np
          with np.load('model/source/S338/S338_original_S18_foldneutral_967_IDMT.npz',allow_pickle=False) as a,np.load('model/fusion/S346/S346_original_193_S46_foldneutral_967_IDMT.npz',allow_pickle=False) as b,np.load('model/S349replay/S349_original_S69_fourfold_rule_consensus_IDMT.npz',allow_pickle=False) as c:
            assert len(a['row_id'])==967
            assert np.array_equal(a['row_id'],b['row_id'])
            assert np.array_equal(a['row_id'],c['row_id'])
            assert np.array_equal(a['S18_piece_neutral_consensus_K'],b['S18_parent_K'])
            assert np.array_equal(a['S18_piece_neutral_consensus_K'],c['S18_parent_K'])
          print('S369 PASS source S18->S46->S69 replay identity checks BEFORE any already-exposed truth joined')
          PY
      - name: Restore S365 original S80 PREXML immutable SHAs and S363 postfrozen truth only for READONLY six-row diagnosis
        run: |
          gh run download 38331662519 \
            -n s365-verified-existing-967-native-24chord-original-S80-SHA-PREXML \
            -D model/prelabel --repo ${{ github.repository }}
          gh run download 38331684749 \
            -n s363-PROSPECTIVE-IDMT-dataset1-24chords-967-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/scored --repo ${{ github.repository }}
      - name: Distinguish first true K3->K2 failure among S18, S46, S69, show 4 S18 real fold votes and each parent source
        run: |
          python -u -m scripts.s369_original_S18_S46_S69_6_K3_regression_point_of_origin \
            --s338 model/source/S338/S338_original_S18_foldneutral_967_IDMT.npz \
            --s346 model/fusion/S346/S346_original_193_S46_foldneutral_967_IDMT.npz \
            --s349 model/S349replay/S349_original_S69_fourfold_rule_consensus_IDMT.npz \
            --truth model/scored/S363_postfrozen_967_two_distinct_protocols.npz \
            --frozen model/prelabel/S352_original/S352_full_original_S80_unseen_IDMT_967_frozen.npz \
            --out model/S369
          python - <<'PY'
          import json
          j=json.load(open('model/S369/report.json'))
          assert j['true_K3_regressions']==6
          assert sum(j['regressions_first_K3toK2_stage_counts'].values())==6
          assert j['true_K2_reference_corrections_on_second_cohort']==8
          assert j['first_source_to_underestimate_identified_no_model_fit']
          assert j['cannot_claim_independent_K3_repair_from_this_test']
          assert not j['official_promotion']
          print('S369 PASS exact source of undercounted true K3 isolated upstream across 4 S18 heads and S46/S69')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s369-original-six-K3-regressions-S18-S46-S69-first-error-root
          path: model/S369/
          retention-days: 90
