name: V20 multi-peak birth heatmap

on:
  push:
    branches: [v200-multipeak-birth-heatmap]
    paths:
      - 'scripts/train_v200_multipeak_birth_heatmap.py'
      - 'scripts/run_v200_reporting_compat.py'
      - 'scripts/summarize_v200_multipeak_birth_heatmap.py'
      - '.github/workflows/v200-multipeak-birth-heatmap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_V173_RUN: '33829092700'
  SOURCE_V190_RUN: '33995600250'
  CONTROL_SEED: '16061'

jobs:
  preflight:
    name: V20 multi-peak heatmap preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V20
        env: {PYTHONPATH: '.:src'}
        run: |
          python -m py_compile scripts/train_v200_multipeak_birth_heatmap.py
          python -m py_compile scripts/run_v200_reporting_compat.py
          python -m py_compile scripts/summarize_v200_multipeak_birth_heatmap.py
      - name: Prove V20 treatment
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        run: |
          python - <<'PY'
          import random, numpy as np, tensorflow as tf
          from scripts import train_v101_string_query_attention as v101
          from scripts import train_v172_mass_preserving_exchangeable as v172
          from scripts import train_v173_poibin_count_consistency as v173
          from scripts import train_v190_dense_birth_centers as v190
          from scripts import train_v200_multipeak_birth_heatmap as v200

          assert v200.DEFAULT_SEED == v190.DEFAULT_SEED == v173.DEFAULT_SEED == 16061
          assert v200.PRESENCE_THRESHOLD == .5 and v173.COUNT_NLL_WEIGHT == .35
          assert len(v172.PERMUTATIONS) == 720
          assert v200.CENTER_MAP_WEIGHT == v190.CENTER_MAP_WEIGHT == .25

          labels=np.zeros((200,6),np.float32); labels[:100,0]=1; labels[:50,1]=1; labels[:24,2]=1; labels[:10,3]=1; labels[:4,4]=1; labels[:1,5]=1
          spec=v172._weight_spec(labels,np.arange(len(labels)))
          for row in spec['mass']['proof_by_k'].values():
              assert abs(row['original_total_presence_coefficient_mass']-row['compressed_total_presence_coefficient_mass'])<1e-9

          cache={'slot_targets':np.zeros((2,6),np.float32)}; cache['slot_targets'][0,:3]=1; cache['slot_targets'][1,:6]=1
          pitch=np.zeros((2,6),np.float32); pitch[0,:3]=np.asarray([40,47,52])/float(v101.PITCH_SCALE); pitch[1,:6]=np.asarray([40,45,50,55,59,64])/float(v101.PITCH_SCALE)
          tt=np.zeros((2,6,23),np.float32); tt[0,0,10]=1;tt[0,1,10]=1;tt[0,2,11]=1
          for s in range(6):tt[1,s,12]=1
          target,eligible,distinct=v200._multipeak_targets(cache,pitch,tt,np.asarray([3,6]))
          np.testing.assert_array_equal(eligible,np.ones(2,np.float32)); np.testing.assert_allclose(target.sum(1),[3,6],atol=1e-7); assert distinct.tolist()==[3,6]
          loss=v200._focal_heatmap_loss(); y=tf.constant(target[:1]); good=np.full_like(target[:1],.01); good[target[:1]>.5]=.99; bad=np.full_like(target[:1],.01)
          assert float(loss(y,tf.constant(good)).numpy()) < float(loss(y,tf.constant(bad)).numpy())

          tf.keras.backend.clear_session(); random.seed(16061); np.random.seed(16061); tf.random.set_seed(16061)
          model,lw,token_shape=v200._build_model(spec)
          assert model.count_params()==898375, model.count_params()
          assert lw['birth_center_heatmap']==.25 and lw['event_count_norm']==0.0
          assert 'birth_center_heatmap' in model.output_names and 'birth_center_map' not in model.output_names
          assert model.get_layer('birth_center_heatmap').activation.__name__=='sigmoid'
          assert model.get_layer('v190_center_anchor_indices') is not None
          assert len(model.get_layer('v190_shared_local_hidden')._inbound_nodes)==6
          bad_layers=[x.name for x in model.layers if x.trainable_weights and (x.name.startswith('v190_event_') or x.name.startswith('event_present_') or x.name.startswith('event_candidate_') or x.name.startswith('event_time_'))]
          assert not bad_layers,bad_layers

          rng=np.random.default_rng(200); inputs={}
          for t in model.inputs:
              name=t.name.split(':',1)[0]; shape=[2]+[int(x) for x in t.shape[1:]]; inputs[name]=rng.normal(size=shape).astype(np.float32)
          cm=np.zeros_like(inputs['candidate_mask'],np.float32); cm[0,:9]=1;cm[1,:4]=1;inputs['candidate_mask']=cm
          out=model(inputs,training=False); h=np.asarray(out['birth_center_heatmap']); assert h.shape==(2,1472); assert np.all((h>0)&(h<1)); assert not np.allclose(h.sum(1),1.0,atol=1e-3)
          pres=np.concatenate([np.asarray(out[f'event_present_{q}']) for q in range(6)],axis=1); cn=np.asarray(out['event_count_norm']); np.testing.assert_allclose(cn[:,0],pres.sum(1)/6.0,rtol=1e-6,atol=1e-6)
          print('params',model.count_params(),'trainable_tensors',len(model.trainable_weights),'token_shape',token_shape,'heatmap_sum',h.sum(1).tolist())
          print('V20 preflight OK')
          PY

  fold:
    name: V20 multi-peak fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: {fold: [0,1,2,3,4]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Download GuitarSet annotations
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Download GuitarSet pickup-mix audio
        shell: bash
        run: |
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip 'https://zenodo.org/record/3371780/files/audio_mono-pickup_mix.zip?download=1'
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train V20
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          out="model/v200-fold-${{ matrix.fold }}"; mkdir -p "$out"
          python -B scripts/run_v200_reporting_compat.py data/GuitarSet \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" --arm mass_permutation --seed "$CONTROL_SEED" --output-dir "$out" \
            2>&1 | tee "$out/train.log"
      - name: Verify V20 protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f='${{ matrix.fold }}';r=json.loads(Path(f'model/v200-fold-{f}/report-fold-{f}.json').read_text());p=r['protocol'];a=r['v200']['architecture'];g=r['strata']['aggregate']['v200_multipeak_birth_heatmap']['metrics']['global']
          assert p['v200_multipeak_birth_heatmap'] is True and p['v190_dense_birth_centers'] is False
          assert p['dense_center_loss']=='independent_binary_focal' and p['dense_center_loss_weight']==.25 and p['dense_center_loss_weight_tuned'] is False
          assert p['dense_center_target_normalized_across_births'] is False and p['dense_center_independent_cell_probabilities'] is True
          assert p['dense_center_anchor_selection_unchanged_from_v190'] is True and p['dense_conv_parameterization_unchanged_from_v190'] is True
          assert p['v173_count_nll_weight']==.35 and p['runtime_presence_threshold']==.5 and p['runtime_presence_threshold_tuned'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          print(f,'epochs',r['data']['selected_epochs'],'f1',g['f1'],'pred_ref',g['prediction_reference_ratio'],'center',a['dense_center_diagnostics']['top6_exact_center_coverage_poly'],'hit',a['dense_center_diagnostics']['top6_mean_center_hit_fraction_poly'])
          PY
      - name: Upload V20 fold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v200-multipeak-fold-${{ matrix.fold }}
          path: model/v200-fold-${{ matrix.fold }}
          retention-days: 30

  summarize:
    name: Summarize V20 controlled treatment
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install NumPy
        run: python -m pip install 'numpy<2.0'
      - name: Download V20 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v200-multipeak-fold-*
          path: model/v200-all
          merge-multiple: false
      - name: Download canonical V19 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v190-dense-fold-*
          path: model/v190-all
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V190_RUN }}
          github-token: ${{ github.token }}
      - name: Download canonical V17.3 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v173-poibin-fold-*
          path: model/v173-all
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V173_RUN }}
          github-token: ${{ github.token }}
      - name: Download V17.3 summary
        uses: actions/download-artifact@v4
        with:
          name: v173-poibin-count-consistency-summary
          path: model/v173-summary
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V173_RUN }}
          github-token: ${{ github.token }}
      - name: Aggregate V20
        env: {PYTHONPATH: '.:src'}
        shell: bash
        run: |
          set -o pipefail; mkdir -p model/v200-summary
          python -B scripts/summarize_v200_multipeak_birth_heatmap.py --input-dir model/v200-all --v190-fold-dir model/v190-all --v173-fold-dir model/v173-all --v173-summary-dir model/v173-summary --output-dir model/v200-summary 2>&1 | tee model/v200-summary/summary.log
      - name: Verify aggregate protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v200-summary/report.json').read_text());p=r['protocol'];c=r['comparison'];g=r['gates']
          assert p['v200_multipeak_birth_heatmap'] is True and p['controlled_against_v190'] is True
          assert p['outer_clean_rows']==76768 and p['same_rows_as_v190_v173'] is True and p['same_seed']==16061
          assert p['presence_threshold']==.5 and p['threshold_tuned'] is False and p['center_loss_weight']==.25 and p['center_loss_weight_tuned'] is False
          assert p['v190_dense_conv_and_top6_nms_unchanged'] is True and p['v173_set_and_poibin_objectives_unchanged'] is True and p['locked12_indexed_or_evaluated'] is False
          print(json.dumps(c,indent=2,sort_keys=True));print(json.dumps(g,indent=2,sort_keys=True))
          PY
      - name: Upload V20 summary
        uses: actions/upload-artifact@v4
        with:
          name: v200-multipeak-birth-heatmap-summary
          path: model/v200-summary
          retention-days: 30
