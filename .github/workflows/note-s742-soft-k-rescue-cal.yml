name: S742 Soft-K causal MIDI rescue trial (CAL32 no LIVE)
on:
  push:
    branches: [codex/note-s742-active-exactk-causal-audit]
    paths:
      - src/causal_note/s742_soft_activek_decoder.py
      - scripts/s742_shadow_soft_activek_cal.py
      - test/test_s742_soft_activek_decoder.py
      - .github/workflows/note-s742-soft-k-rescue-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s742-soft-k-rescue
  cancel-in-progress: true
jobs:
  measured_midi_k_active_trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install signed frozen S708/S707 runtime and CPU torch
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify causal soft-K NoteOn implementation and 80-percent gate
        run: |
          python -m compileall -q src/causal_note/s742_soft_activek_decoder.py scripts/s742_shadow_soft_activek_cal.py
          python -m unittest -v test.test_s742_soft_activek_decoder test.test_s742_activek_forensics
      - name: Download signed S708, S734 and S707 checkpoints
        run: |
          mkdir -p /tmp/s742/soft_s708 /tmp/s742/soft_s707 /tmp/s742/soft_s734
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s742/soft_s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s742/soft_s707
          gh run download 39137653526 --repo "Andriamarosoa/note" --name S734_ONSET_INDIVIDUAL_NEURAL_EXACTK_LINKED_FIT_CAL_HELD_DEV --dir /tmp/s742/soft_s734
          test -s /tmp/s742/soft_s708/report.json
          test -s /tmp/s742/soft_s708/s708_selected.pt
          test -s /tmp/s742/soft_s707/s675_hazard.joblib
          test -s /tmp/s742/soft_s734/report.json
          test -s /tmp/s742/soft_s734/s733_onset.pt
      - name: Evaluate S742 acoustic soft-K rescue on all 32 CAL recordings
        run: |
          python -m scripts.s742_shadow_soft_activek_cal --s708-dir /tmp/s742/soft_s708 --s734-checkpoint /tmp/s742/soft_s734/s733_onset.pt --s734-report /tmp/s742/soft_s734/report.json --offset-checkpoint /tmp/s742/soft_s707/s675_hazard.joblib --out /tmp/s742/soft_results
      - name: Verify real paired six-MIDI-score no-regression gate and no LIVE promotion
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s742/soft_results/report.json'))
          assert r['completed'] and len(r['report_by_choice'])==6
          assert r['selected']=='S708_frozen' and not r['promoted']
          assert not r['LIVE_changed'] and not r['TEST_opened']
          for name,v in r['report_by_choice'].items():
              assert len(v['actual'])==6 and len(v['delta'])==6
              assert not v['all_six_gt80'] or v['safe']
          print('S742_CAUSAL_ACTIVE_K_REAL_RESULTS',json.dumps({
              'reference':r['reference_scores'],
              'candidates':r['report_by_choice'],
              'CAL_candidate':r.get('CAL_candidate'),
              'promoted':False}))
          PY
      - name: Publish all real CAL candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S742_CAL32_SOFT_K_ACOUSTIC_MIDI_TRIAL
          path: /tmp/s742/soft_results/report.json
          retention-days: 45
          if-no-files-found: warn
