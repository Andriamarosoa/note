name: S834 S809 six isolated axis S708 native PCM256
on:
  push:
    branches: [codex/note-s834-s809-six-axes-native256]
    paths:
      - src/causal_note/s834_native256_decoders.py
      - src/causal_note/s834_s809_six_axis_pcm256.py
      - src/causal_note/s834_s809_native256_audio.py
      - scripts/s834_s809_native256_fit80_replay.py
      - test/test_s834_s809_native256_axes.py
      - series/S834/resume.md
      - series/S834/resultat.md
      - .github/workflows/note-s834-s809-native256-six.yml
  workflow_dispatch:
concurrency:
  group: s834-s809-native-six-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read, actions: read}
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  strict_isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Same locked dependencies as original S708
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove no modification to S708/S712/Joint or any of the other five axis paths
        run: |
          git fetch origin codex/note-s833-crossfit-risk256 --depth=1
          git diff --name-only FETCH_HEAD HEAD | tee /tmp/s834_changed_paths.txt
          python - <<'PY'
          from pathlib import Path
          names=Path('/tmp/s834_changed_paths.txt').read_text().splitlines()
          authorized={'src/causal_note/s834_native256_decoders.py',
                      'src/causal_note/s834_s809_six_axis_pcm256.py',
                      'src/causal_note/s834_s809_native256_audio.py',
                      'scripts/s834_s809_native256_fit80_replay.py',
                      'test/test_s834_s809_native256_axes.py',
                      'series/S834/resume.md','series/S834/resultat.md',
                      '.github/workflows/note-s834-s809-native256-six.yml'}
          assert set(names)<=authorized,(set(names)-authorized)
          assert len(names)>0
          print('S834_PUBLIC_FIVE_AXIS_CODE_FROZEN_AND_IDENTICAL')
          PY
      - name: Original S708 protected, private native256 HGB readout fit/test and no future leaks
        run: |
          python -m compileall -q src/causal_note/s834_native256_decoders.py src/causal_note/s834_s809_six_axis_pcm256.py src/causal_note/s834_s809_native256_audio.py scripts/s834_s809_native256_fit80_replay.py test/test_s834_s809_native256_axes.py
          python -m unittest -v test.test_s834_s809_native256_axes test.test_s809_axis_isolation test.test_s763_independent_decoders test.test_s712_s708_live test.test_s705_temporal_heads
          python -m scripts.verify_series_reports --series S834
  signed_real_five:
    runs-on: ubuntu-24.04
    needs: strict_isolation
    if: contains(github.event.head_commit.message, '[run-fit80]') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Requirements and CPU S708 torch checkpoint
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download signed S708 checkpoint and S800 authentic GuitarSet provenance
        run: |
          mkdir -p /tmp/s834/s708 /tmp/s834/manifest /tmp/s834/traces
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s834/s708
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s834/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s834/traces
          MODEL="$(find /tmp/s834/s708 -name s708_selected.pt -type f -print -quit)"
          META="$(find /tmp/s834/manifest -name report.json -type f -print -quit)"
          FIT="$(find /tmp/s834/traces -name fit_000.json -type f -print -quit)"
          test -s "$MODEL"
          test -s "$(dirname "$MODEL")/report.json"
          test -s "$META"
          test -s "$FIT"
          printf '%s\n' "$(dirname "$MODEL")" > /tmp/s834/s708_dir
          printf '%s\n' "$META" > /tmp/s834/manifest_path
          printf '%s\n' "$(dirname "$FIT")" > /tmp/s834/traces_dir
      - name: SHA-256 pinned authentic original GuitarSet 44.1kHz acoustic mic WAV
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          cfg=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          item=cfg['guitar_archives']['GuitarSet_audio']
          dst=Path('/tmp/s834/GuitarSet_audio.zip')
          with urllib.request.urlopen(item['url'],timeout=180) as src,dst.open('wb') as dst_file:
              for chunk in iter(lambda:src.read(4*1024*1024),b''):
                  dst_file.write(chunk)
          assert dst.stat().st_size==item['size']
          h=hashlib.sha256()
          with dst.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024),b''):h.update(block)
          assert h.hexdigest()==item['sha256']
          print('S834_SOURCE_GUITARSET_SHA_256_VALIDATED')
          PY
      - name: Train only private S708 Active-K readout with real audio and disjoint composition
        run: |
          python -m scripts.s834_s809_native256_fit80_replay --audio-zip /tmp/s834/GuitarSet_audio.zip --traces "$(cat /tmp/s834/traces_dir)" --manifest-path "$(cat /tmp/s834/manifest_path)" --source-checkpoint "$(cat /tmp/s834/s708_dir)/s708_selected.pt" --source-report "$(cat /tmp/s834/s708_dir)/report.json" --native-model model/live/strict_note/NOTE_strict_live.npz --out /tmp/s834/result --tracks-per-composition 16
      - name: 80 true PCM256 tracks and 153600 independent axis counterfactuals
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s834/result/report.json'))
          assert r['complete'] and len(r['tracks'])==80
          assert r['frames']==306536
          assert r['decision_hop_samples']==r['acoustic_feature_hop_samples']==256
          assert r['counterfactual_pairs_tested']==r['counterfactual_pairs_passed']==153600
          assert r['source_signed_midi_unchanged'] and r['original_five_axes_untouched']
          assert not r['official_midi_modified'] and not r['promoted']
          assert not r['external_generalization_verified']
          assert not any(r[k] for k in ('CAL_opened','HELD_opened','TEST_opened'))
          assert set(r['axis_metrics'])==set((
             'exact_k','active_exact_k','onset','offset','frame_pitch','full_note'))
          assert all(t['causal_s708_model_calls']==t['frames'] for t in r['tracks'])
          assert r['source_counts']['active_k_correct']==142213
          print('S834_SIX_AXIS_REAL_PCM256_NONINTERFERENCE_PASS',json.dumps(r['six_axis_shadow_scores']))
          PY
      - name: Upload actual signed proof, do not promote experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S834_REAL_S809_SIX_AXES_PCM256_FIT80
          path: /tmp/s834/result/report.json
          if-no-files-found: warn
          retention-days: 45
