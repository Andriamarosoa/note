name: S702 causal event Onset selection and native state repair
on:
  push:
    branches: [codex/note-s702-event-onset-selection]
    paths:
      - src/causal_note/s702_event_selection.py
      - scripts/s702_train_event_onset_selection.py
      - test/test_s702_event_selection.py
      - .github/workflows/note-s702-event-onset-selection.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s702-event-onset-selection
  cancel-in-progress: false
jobs:
  event_selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact native dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Causal prefix and actual event preservation regressions
        run: |
          python -m compileall -q src/causal_note/s702_event_selection.py scripts/s702_train_event_onset_selection.py test/test_s702_event_selection.py
          python -m unittest -v test.test_s702_event_selection test.test_s701_causal_onset
      - name: Retrieve existing frozen S701 and S675 checkpoints
        run: |
          mkdir -p /tmp/s702_s701 /tmp/s702_s675
          gh run download 39085408073 --repo "${{ github.repository }}" --name S701_CAUSAL_ONSET_LEARNED_TRAIN_HELD_COMPOSITION --dir /tmp/s702_s701
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s702_s675
          test -s /tmp/s702_s701/s701_onset_shadow.joblib
          test -s /tmp/s702_s675/s675_hazard.joblib
          test -s /tmp/s702_s675/s675_checkpoint.json
      - name: Train event quality, freeze on CAL, check HELD and diagnostic DEV
        run: |
          python -m scripts.s702_train_event_onset_selection --out /tmp/s702 --onset-checkpoint /tmp/s702_s701/s701_onset_shadow.joblib --offset-checkpoint /tmp/s702_s675/s675_hazard.joblib
      - name: Preserve results and exact per-note regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S702_CAUSAL_EVENT_ONSET_STATE_AND_QUALITY
          path: /tmp/s702/
          if-no-files-found: warn
          retention-days: 60
