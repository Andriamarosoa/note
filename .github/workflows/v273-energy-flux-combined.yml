name: V27.3 Combined Energy Flux Birth Death Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-energy-flux-combined-launch.json'
      - 'scripts/extract_v273_energy_flux_combined.py'
      - 'scripts/summarize_v273_energy_flux_combined.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [0, 1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - name: Validate scripts
        run: |
          python -m py_compile scripts/extract_v273_energy_flux_combined.py
          python -m py_compile scripts/summarize_v273_energy_flux_combined.py
      - name: Restore GuitarSet
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Restore frozen 488 K2/K3 cases
        run: |
          mkdir -p model/cases
          unzip -q analysis/evidence/v273-residual-acoustics/evidence.zip -d model/cases
          test -f model/cases/acoustic/cases.jsonl
          test "$(wc -l < model/cases/acoustic/cases.jsonl)" -eq 488
      - name: Extract combined features
        run: python -B scripts/extract_v273_energy_flux_combined.py --cases model/cases/acoustic/cases.jsonl --dataset data/GuitarSet --fold ${{ matrix.fold }} --output model/result-${{ matrix.fold }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-energy-flux-combined-fold-${{ matrix.fold }}
          path: model/result-${{ matrix.fold }}/
          retention-days: 90
  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scikit-learn==1.4.2
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-energy-flux-combined-fold-*
          path: model/results
      - name: Evaluate nested combined families
        run: python -B scripts/summarize_v273_energy_flux_combined.py --input-root model/results --output model/summary
      - name: Show result
        run: cat model/summary/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-energy-flux-combined-summary
          path: model/summary/
          retention-days: 90
