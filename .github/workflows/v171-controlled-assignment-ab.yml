name: V17.1 controlled assignment causal AB

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v171_controlled_assignment_ab.py'
      - 'scripts/run_v171_reporting_compat.py'
      - 'scripts/summarize_v171_controlled_assignment_ab.py'
      - '.github/workflows/v171-controlled-assignment-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  CONTROL_SEED: '16061'

jobs:
  preflight:
    name: V17.1 causal isolation preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile controlled A/B
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v171_controlled_assignment_ab.py
          python -m py_compile scripts/run_v171_reporting_compat.py
          python -m py_compile scripts/summarize_v171_controlled_assignment_ab.py
      - name: Prove identical graph initialization and isolate assignment
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        run: |
          python - <<'PY'
          import random
          import numpy as np
          import tensorflow as tf
          from scripts import train_v171_controlled_assignment_ab as v
          assert v.DEFAULT_SEED == 16061
          assert len(v.PERMUTATIONS) == 720
          labels=np.zeros((100,6),dtype=np.float32)
          labels[:55,0]=1; labels[:30,1]=1; labels[:15,2]=1
          w=v._symmetric_class_weights(labels,np.arange(100))
          assert abs(w['positive_coefficient_mass']-w['negative_coefficient_mass']) < 1e-6
          stage={'positive_weight':2.5,'negative_weight':0.625}
          def build(arm):
              tf.keras.backend.clear_session()
              random.seed(16161); np.random.seed(16161); tf.random.set_seed(16161)
              m,_,_=v._build_controlled_model(arm,stage)
              return m
          a=build('ordered')
          aw=[np.asarray(x.numpy()) for x in a.trainable_weights]
          an=[x.name for x in a.trainable_weights]
          b=build('permutation')
          bw=[np.asarray(x.numpy()) for x in b.trainable_weights]
          bn=[x.name for x in b.trainable_weights]
          assert an == bn
          assert len(aw) == len(bw)
          for i,(x,y) in enumerate(zip(aw,bw)):
              np.testing.assert_array_equal(x,y,err_msg=f'initial weight mismatch {i}')
          assert a.count_params() == b.count_params()
          assert a.get_layer('v160_global_reconciliation_attention') is not None
          assert b.get_layer('v160_global_reconciliation_attention') is not None
          rng=np.random.default_rng(7)
          yt=np.zeros((2,6,v.SET_WIDTH),dtype=np.float32)
          yt[:,:2,0]=1; yt[:,:2,v.SET_VALID_OFFSET]=1
          for r in range(2):
              for q in range(2):
                  yt[r,q,v.SET_TIME_OFFSET+(r+q)%v.TIME_FRAMES]=1
                  yt[r,q,v.SET_CANDIDATE_OFFSET+(r+3*q)%v.MAX_CANDIDATES]=1
          yp=np.zeros_like(yt)
          yp[:,:,0]=rng.uniform(.05,.95,size=(2,6))
          yp[:,:,v.SET_VALID_OFFSET]=1
          t=rng.uniform(.01,1,size=(2,6,v.TIME_FRAMES)).astype(np.float32); t/=t.sum(2,keepdims=True)
          c=rng.uniform(.01,1,size=(2,6,v.MAX_CANDIDATES)).astype(np.float32); c/=c.sum(2,keepdims=True)
          yp[:,:,v.SET_TIME_OFFSET:v.SET_CANDIDATE_OFFSET]=t
          yp[:,:,v.SET_CANDIDATE_OFFSET:]=c
          la=v._set_loss('ordered',stage['positive_weight'],stage['negative_weight'])
          lb=v._set_loss('permutation',stage['positive_weight'],stage['negative_weight'])
          ordered=np.asarray(la.call(tf.constant(yt),tf.constant(yp)))
          perm=np.asarray(lb.call(tf.constant(yt),tf.constant(yp)))
          assert np.all(perm <= ordered + 1e-5)
          shuffled=yt[:,[2,0,5,1,4,3],:]
          np.testing.assert_allclose(np.asarray(lb.call(tf.constant(yt),tf.constant(yp))),np.asarray(lb.call(tf.constant(shuffled),tf.constant(yp))),rtol=1e-5,atol=1e-6)
          print('params',a.count_params(),'trainable_tensors',len(aw),'causal isolation preflight OK')
          PY

  fold:
    name: V17.1 ${{ matrix.arm }} fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arm: [ordered, permutation]
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train controlled arm
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          out="model/v171-${{ matrix.arm }}-fold-${{ matrix.fold }}"
          mkdir -p "$out"
          python -B scripts/run_v171_reporting_compat.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --arm "${{ matrix.arm }}" \
            --seed "$CONTROL_SEED" \
            --output-dir "$out" \
            2>&1 | tee "$out/train.log"
      - name: Verify causal protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm='${{ matrix.arm }}'; fold='${{ matrix.fold }}'
          pth=Path(f'model/v171-{arm}-fold-{fold}/report-fold-{fold}.json')
          r=json.loads(pth.read_text()); p=r['protocol']; c=r['controlled_ab']
          assert p['controlled_assignment_ab'] is True
          assert p['assignment_arm'] == arm
          assert p['only_assignment_differs_between_arms'] is True
          assert p['v16_proposal_graph_unchanged'] is True
          assert p['shared_seed'] == 16061
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['outer_fold_used_for_training'] is False
          assert p['outer_fold_used_for_epoch_selection'] is False
          assert p['presence_threshold_tuned'] is False and p['presence_threshold'] == 0.5
          assert p['fit_fold_only_presence_weighting'] is True
          assert p['symmetric_object_no_object_weighting'] is True
          w=c['final_fit_presence_weights']
          assert abs(w['positive_coefficient_mass']-w['negative_coefficient_mass']) < 1e-5
          if arm == 'ordered':
              assert p['permutation_invariant_set_matching'] is False
              assert p['set_matching_permutations'] == 1
          else:
              assert p['permutation_invariant_set_matching'] is True
              assert p['set_matching_permutations'] == 720
          key=f'v171_{arm}'
          print(arm,fold,'epochs',r['data']['selected_epochs'],'f1',r['strata']['aggregate'][key]['metrics']['global']['f1'],'k5',r['per_true_k']['5'][key]['exact'],'k6',r['per_true_k']['6'][key]['exact'])
          PY
      - name: Upload controlled fold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v171-controlled-${{ matrix.arm }}-fold-${{ matrix.fold }}
          path: model/v171-${{ matrix.arm }}-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: warn
          retention-days: 30

  summarize:
    name: Summarize V17.1 causal A/B
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy<2.0'
      - name: Download all controlled folds
        uses: actions/download-artifact@v4
        with:
          pattern: v171-controlled-*
          path: model/v171-controlled
          merge-multiple: false
      - name: Aggregate causal A/B
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p model/v171-summary
          python -B scripts/summarize_v171_controlled_assignment_ab.py \
            --input-dir model/v171-controlled \
            --output-dir model/v171-summary \
            2>&1 | tee model/v171-summary/summary.log
      - name: Verify causal aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v171-summary/report.json').read_text())
          p=r['protocol']
          assert p['causal_assignment_ab'] is True
          assert p['outer_clean_rows'] == 76768
          assert p['same_rows_both_arms'] is True
          assert p['v16_proposal_graph_unchanged'] is True
          assert p['same_seed'] == 16061
          assert p['same_threshold'] == 0.5
          assert p['same_fit_fold_only_symmetric_presence_weighting'] is True
          assert p['locked12_indexed_or_evaluated'] is False
          print(json.dumps(r['comparison'],indent=2,sort_keys=True))
          PY
      - name: Upload causal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v171-controlled-assignment-summary
          path: model/v171-summary
          if-no-files-found: warn
          retention-days: 30
