name: Onset solution effect audit unit tests PCM256
on:
  push:
    branches: [codex/note-onset-solution-effect-audit256]
    paths:
      - 'scripts/audit_onset_solution_effect256.py'
      - 'scripts/live_note_onset256.py'
      - 'tests/test_live_note_onset256.py'
      - 'README_LIVE_NOTE_PCM256.md'
      - 'tests/test_onset_solution_effect_audit256.py'
      - 'series/ONSET_SOLUTION_EFFECT_POSTMORTEM256/**'
      - '.github/workflows/onset-solution-effect-audit256.yml'
  workflow_dispatch:
concurrency:
  group: onset-solution-audit-tests-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  unit_tests_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-onset256-cache.txt
      - name: Validate post-solution effect audit without running training
        run: |
          python -m compileall -q scripts/audit_onset_solution_effect256.py tests/test_onset_solution_effect_audit256.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          import numpy as np
          from onset256.acoustic_live import current_reference
          from scripts.live_note_onset256 import checked_hop
          engine = current_reference(
              fold='BN1',
              base_bundle='model/onset256_research_39915038301',
              recovery_bundle='model/onset256_recovery_20261023',
              native_path='model/live/strict_note/NOTE_strict_live.npz')
          decision = checked_hop(engine,np.zeros(256,np.float32),0)
          assert decision.sample == 256
          print('NOTE_REAL_SIGNED_WEIGHTS_LOADED_PCM256_BN1')
          PY
          echo "UNIT_TESTS_ONLY_NO_FULL_AUDIO_RUN"
