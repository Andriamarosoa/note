name: S147 label-free S80 original K0/K2 tail with 59309 exact replay
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s147_s80_tail_runtime.py'
      - '.github/workflows/v273-s147-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s147-tail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_tail_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m scripts.s147_s80_tail_runtime --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38187186049
          name: v273-s80-traceable-repair
          path: model/s80
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-summary
          path: model/pr16
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891336823
          name: v273-series46-poly-class-compromises
          path: model/s46
      - name: Strip original archives to strictly truth-free inference inputs
        run: |
          set -euo pipefail
          python -m scripts.s147_s80_tail_runtime extract \
            --s80 model/s80/predictions.npz \
            --pr16 model/pr16/predictions.npz \
            --pr16-probs model/pr16/probabilities.npz \
            --s46 model/s46/predictions.npz \
            --out model/s147-stripped.npz
      - name: Run stateless original S80 K0/K2 routes without labels
        run: |
          python -m scripts.s147_s80_tail_runtime apply \
            --input model/s147-stripped.npz --out model/s147
      - name: Assert zero mismatches vs archived 59309 decisions and 46/61 actions
        run: |
          python -m scripts.s147_s80_tail_runtime verify \
            --s80 model/s80/predictions.npz \
            --replay model/s147/predictions.npz \
            --out model/s147/verification.json
          python - <<'PY'
          import json
          d=json.load(open('model/s147/verification.json'))
          assert d['historical_rows']==59309
          assert d['mismatches']=={'s80_K':0,'action_K0':0,'action_K2':0}
          assert d['K0_actions']==46 and d['K2_actions']==61
          assert not d['true_K_read'] and not d['promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s147-exact-historical-K0-K2-label-free-runtime
          path: model/s147/
          retention-days: 90
