name: S658 natural GuitarSet coincident Tone octave gate transfer
on:
  push:
    branches: [codex/s658-natural-guitarset-tone-octave-gate]
    paths:
      - scripts/s658_natural_octave_tone_gate.py
      - test/test_s658_natural_octave_tone_gate.py
      - .github/workflows/v273-s658-natural-tone-octave.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s658-natural-octave-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check_natural_chord_per_note_f1:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen original NOTE dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Check causal NOTE gating and held composition promotion logic
        run: |
          python -m compileall -q scripts/s658_natural_octave_tone_gate.py test/test_s658_natural_octave_tone_gate.py
          python -m unittest -v test.test_s658_natural_octave_tone_gate
      - name: Validate actual NOTE octave gate on natural GuitarSet TRAIN and DEV
        run: python -m scripts.s658_natural_octave_tone_gate --out /tmp/s658_natural_octave
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S658_REAL_GUITARSET_NATURAL_TONE_OCTAVE_GATE
          path: /tmp/s658_natural_octave/report.json
          if-no-files-found: warn
          retention-days: 60
