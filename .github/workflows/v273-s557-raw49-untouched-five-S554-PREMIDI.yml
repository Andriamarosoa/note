name: S557 prospective five piano 49-pitch acoustic onset features at all V88 K0-K6 frozen source times PREMIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s557_new_source_raw49_S554_PREMIDI.py
      - .github/workflows/v273-s557-raw49-untouched-five-S554-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_unseen_piano_prelabeled_49_pitch_acoustic_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install raw 49-note and harmonic source features
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2
      - name: Test raw spectral feature ABI without MIDI
        run: |
          python -m py_compile scripts/s557_new_source_raw49_S554_PREMIDI.py
          python -m scripts.s557_new_source_raw49_S554_PREMIDI --self-test
      - name: Restore SHA-pinned preselected five new composer names and original V88 event predictions
        run: |
          gh run download 38663678664 -n s554-next-five-metadata-only-composer-component-disjoint-before-new-model-noteon-validation -D model/S554 --repo "${{ github.repository }}"
          gh run download 38663781717 -n s555-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S555 --repo "${{ github.repository }}"
          gh run download 38663840345 -n s556-next-five-S554-BasicPitch-original-pitch-names-PREMIDI -D model/S556 --repo "${{ github.repository }}"
      - name: Verify source whole WAV SHA from S555 and extract original all V88 K0 note physics without opening MIDI
        run: |
          python -u -m scripts.s557_new_source_raw49_S554_PREMIDI \
            --manifest model/S554/report.json \
            --v88 model/S555/S555_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S555/report.json \
            --bp model/S556/S556_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --bp-report model/S556/report.json --out model/S557
          python - <<'PY'
          import json
          r=json.load(open('model/S557/report.json'))
          assert r['status']=='S557_PRELABEL_FIVE_NEW_PIANO_ALL_V88_RAW_49_PITCH_FEATURES'
          assert len(r['per_recording'])==5
          assert r['original_V88_onset_candidates']>0
          assert r['real_audio_piano_five_source_WAV_SHAs_verified']
          assert r['all_49_pitch_features_at_every_piano_V88_event']
          assert r['no_original_true_MIDI_annotation_read'] and r['no_promotion']
          print('S557 SUCCESS five composer 49x11 acoustic NOTE_ON pitch features preMIDI sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s557-next-five-S554-composers-V88-raw49-pitch-PREMIDI
          path: model/S557/
          retention-days: 90
