name: S334 S335 genuine original S97 and 527D S5 features on frozen 477 Dataset1 chords PREXML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s334_original_dataset1_S97_477.py'
      - 'scripts/s335_original_S5_527D_dataset1_477.py'
      - '.github/workflows/v273-s334-s335-dataset1-S97-S5-prelabel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s334-335-genuine-477-original-native-audio
  cancel-in-progress: true
jobs:
  original_477_native_audio_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore 12 original V88 native IDMT chord WAV output SHA already frozen BEFORE XML
        run: |
          gh run download 38326594900 \
            -n s332-IDMT-dataset1-12WAV-true-original-V88-native-official-unlabelled \
            -D model/S332 --repo ${{ github.repository }}
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
      - name: Build source-only original S97 acoustics on exact 477 original V88 events
        run: |
          python -u -m scripts.s334_original_dataset1_S97_477 \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --s332report model/S332/report.json \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S334
      - name: Build untouched original 527D S5 and PR16 46D source feature contract on same native event IDs
        run: |
          python -u -m scripts.s335_original_S5_527D_dataset1_477 \
            --s334 model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s332 model/S332/S332_official_V88_dataset1_prospective_12_WAV_predictions.npz \
            --out model/S335
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S334/report.json'))
          b=json.load(open('model/S335/report.json'))
          assert a['events']==b['native_events']==477 and a['WAV_count']==b['WAV_count']==12
          assert not a['annotation_XML_MIDI_read'] and not b['independent_ExactK_measured']
          with np.load('model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(477,58)
            assert z['sequence42x49'].shape==(477,42,49)
          with np.load('model/S335/S335_IDMT_dataset1_true_original_S5_527D_input.npz',allow_pickle=False) as z:
            assert z['original_S5_input_owned527'].shape==(477,527)
          print('S334/S335 PASS original 12 chord WAV features, no XML')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s334-s335-12-IDMT-dataset1-chords-477-original-S97-527D-PREXML
          path: |
            model/S334/
            model/S335/
          retention-days: 90
