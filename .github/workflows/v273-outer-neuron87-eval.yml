name: V27.3 Outer Eval Candidate Hidden1 Neuron87

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-outer-neuron87-eval-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-outer-neuron87-eval
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-outer-neuron87-eval-${{ github.run_id }}

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Validate evaluation script
        run: python -m py_compile scripts/evaluate_v273_outer_candidate_hidden1_neuron87.py

      - name: Restore frozen bundle and checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/freeze model/cluster

          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37208199201             --repo "${{ github.repository }}"             --pattern v273-loss-weighting-uniform.tgz             --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          gh release download v273-uniform-anchored-freeze-37233793945             --repo "${{ github.repository }}"             --pattern v273-uniform-anchored-freeze-result.tgz             --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/freeze

          gh release download v273-failure-clustering-36999901054             --repo "${{ github.repository }}"             --pattern v273-failure-clustering-rows.csv             --dir model/cluster

          test -f model/uniform/uniform.weights.h5
          test -f model/uniform/predictions.npz
          test -f model/freeze/freeze_local_combo.weights.h5
          test -f model/freeze/predictions.npz
          test -f model/cluster/v273-failure-clustering-rows.csv

      - name: Evaluate fixed neuron 87 intervention
        run: |
          python -B scripts/evaluate_v273_outer_candidate_hidden1_neuron87.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-weights model/uniform/uniform.weights.h5             --freeze-weights model/freeze/freeze_local_combo.weights.h5             --uniform-predictions model/uniform/predictions.npz             --freeze-predictions model/freeze/predictions.npz             --cluster-rows model/cluster/v273-failure-clustering-rows.csv             --output model/result

      - name: Publish evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 outer eval of inner-selected candidate_hidden1 neuron 87"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             model/result/predictions.npz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-outer-neuron87-eval
          path: model/result/
          retention-days: 90
