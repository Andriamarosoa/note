name: S141 genuine S40 temporal CNN checkpoint forward on GOAT (not original S80)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s141_external_original_s40_cnn.py'
      - '.github/workflows/v273-s141-original-s40-cnn.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s141-S40-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_s40_external_forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched original S40 library stack
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s141_external_original_s40_cnn --self-test
      - name: Retrieve original real S40 checkpoints from original run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880762289
          name: v273-series40-temporal-cnn
          path: model/s40
      - name: Original audio-only trajectories and features of 57 GOAT native events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - name: Original PR16 policy22 and freeze count from native matched groups
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/s85
      - name: Frozen S135 NEW student predictions (research-only adapted S40 parent)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/s135
      - name: Execute original 4 saved CNNs on 57 real audio groups, no MIDI
        run: |
          set -euo pipefail
          S97="$(find model/s97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/s85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/s135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -m scripts.s141_external_original_s40_cnn \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s40 model/s40 --out model/s141
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/s141/report.json'))
          assert r['GOAT_audio_event_count']==57 and len(r['checkpoints'])==4
          assert r['frozen_original_CNN_weights_unchanged']
          assert not r['S40_parent_inputs_original_equivalence']
          assert not r['S45_original_16_families_reproduced']
          assert not r['promoted'] and not r['GOAT_MIDI_opened']
          with np.load('model/s141/native_s40_GOAT_research.npz',allow_pickle=False) as d:
              assert d['fold_probabilities'].shape==(4,57,7)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s141-original-S40-four-trained-checkpoints-real-GOAT-conditional
          path: model/s141/
          retention-days: 90
