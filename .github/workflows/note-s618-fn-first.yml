name: "S618 causal FN-first rescue: frozen S613 hybrid"
on:
  push:
    branches: [codex/note-live-s618-missed-onset-rescue]
    paths: ['.github/workflows/note-s618-fn-first.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s618-fn-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  missed-attacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native inference dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Verify S618 synthetic causal recovery and input constraints
        run: |
          python -m unittest -v test.test_s618_missed_attack_sweep test.test_s615_exactk_audit
      - name: Seed only the same original 17 GuitarSet URMP dev songs
        run: |
          python -m scripts.s615_seed_full_development --root data/S618_dev --dev-only
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.s615_prepare_multihop import prepare_one
          root=Path('data/S618_dev')
          protocol=json.loads((root/'protocol.json').read_text())
          sources=[s for s in protocol['sources'] if s['split']=='dev']
          assert len(sources)==17
          assert all(s['split']=='dev' for s in sources)
          for i,source in enumerate(sources,1):
              print(i,prepare_one(root,source,256),flush=True)
          PY
      - name: Run FULL real S613 hybrid FN root-cause audit and 10 recovery controls
        run: |
          python -m scripts.s618_missed_attack_sweep \
            --root data/S618_dev \
            --model model/live/strict_note/NOTE_strict_live.npz \
            --out results/S618_FN_first_17dev.json
      - name: Verify and print recovered attacks, regressions, full K1-K4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/S618_FN_first_17dev.json').read_text())
          assert r['status']=='DEV_ONLY_FN_FIRST_SELECTION_SWEEP_NO_PROMOTION'
          assert r['sources']==17
          assert r['checkpoint_architecture']=='native_causal_hybrid'
          assert len(r['tested'])==10
          original=r['tested'][0]
          assert original['TP']==1241 and original['FN']==838,original
          for row in r['tested']:
              assert row['preserved_truth']+row['recovered_missed_truth']==row['TP']
              assert row['additional_TP']==row['recovered_missed_truth']-row['lost_previously_matched_truth']
              print(json.dumps({
                  'selector':row['label'], 'TP':row['TP'],'FP':row['FP'],
                  'FN':row['FN'],'F1':row['F1'],
                  'recovered_new_truth':row['recovered_missed_truth'],
                  'lost_existing_truth':row['lost_previously_matched_truth'],
                  'K3':row['onset_K_by_true_K'].get('3'),
                  'K4':row['onset_K_by_true_K'].get('4'),
              }),flush=True)
          print('MISSED ATTACK ROOT CAUSES:',json.dumps(
              r['original_missed_attack_diagnosis']['categories']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s618-17dev-fn-first-recovery-audit
          path: results/S618_FN_first_17dev.json
          retention-days: 45
