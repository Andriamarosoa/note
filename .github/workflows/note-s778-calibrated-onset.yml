name: S778 causal unweighted harmonic onset strict FIT80 confidence gates
on:
  push:
    branches: [codex/note-s778-onset-prior-calibration]
    paths:
      - scripts/s778_calibrated_harmonic_onset_fit80.py
      - test/test_s778_calibrated_harmonic_onset.py
      - .github/workflows/note-s778-calibrated-onset.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s778-prior-onset-frozen
  cancel-in-progress: true
jobs:
  octave_aware_onset:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen runtime and CPU Torch
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Causality and octave boundary tests
        run: |
          python -m compileall -q scripts/s778_calibrated_harmonic_onset_fit80.py
          python -m unittest -v \
            test.test_s768_independent_onset_lattice \
            test.test_s778_calibrated_harmonic_onset
      - name: Restore immutable S708 and S707
        run: |
          mkdir -p /tmp/s778/s708 /tmp/s778/s707
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s778/s708
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s778/s707
          test -s /tmp/s778/s708/report.json
          test -s /tmp/s778/s708/s708_selected.pt
          test -s /tmp/s778/s707/s675_hazard.joblib
      - name: Fit 5 compositions and score frozen all-pitch harmonic hypotheses on CAL32
        run: |
          python -m scripts.s778_calibrated_harmonic_onset_fit80 \
            --s708-dir /tmp/s778/s708 \
            --offset-checkpoint /tmp/s778/s707/s675_hazard.joblib \
            --out /tmp/s778/report
      - name: Enforce strict signed source parity and no MIDI promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s778/report/report.json').read_text())
          assert r['schema']=='S778_FIT80_UNWEIGHTED_STRICT_THRESHOLD_HARMONIC_ONSET'
          assert r['complete'] and r['source_reference_parity']['valid']
          assert r['fit_recordings_done']==80 and r['cal_recordings_done']==32
          assert len(r['FIT']['folds'])==5
          assert not r['promoted'] and r['selected']=='S708_frozen'
          assert not r['LIVE_changed'] and not r['HELD_opened'] and not r['TEST_opened']
          assert r['ONSET_only_not_MIDI'] and r['no_future_inputs']
          assert r['CAL']['frozen_risk_over_80']==(r['CAL']['frozen_score']['f1']>.8)
          print('S778_FROZEN_ONSET',json.dumps(r['CAL']['frozen_score']))
          PY
      - name: Preserve report whether passing or failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S778_UNWEIGHTED_HARMONIC_ONSET_FIT80_CAL32
          path: /tmp/s778/report/report.json
          retention-days: 45
          if-no-files-found: warn
