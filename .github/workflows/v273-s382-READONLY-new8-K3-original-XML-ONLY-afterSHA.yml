name: S382 FIRST new last eight IDMT XML OPEN only AFTER S381 original K3 expert SHA sealed
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s382_first_postfrozen_new8_XML_K3_expert_score.py'
      - '.github/workflows/v273-s382-READONLY-new8-K3-original-XML-ONLY-afterSHA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s382-eight-original-WAV-first-XML-read-after-trained-GuitarSet-K3-SHA
  cancel-in-progress: true
jobs:
  first_original_XML_postfreeze_K3_expert_by_which_TRUE_K:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: STRICT gate prohibit reading any XML until all 255 original S5/S18 source and trained-only K3 specialist SHAs successfully immutable
        run: |
          gh run watch 38336012636 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Restore original S372 names-only manifest, S374 official V88 source baseline and immutable S381/GuitarSet-only K3 predictions
        run: |
          gh run download 38334876066 \
            -n s372-prospective-last8-original-IDMT-Dataset1-WAV-XML-NAMES-UNOPENED \
            -D model/S372 --repo ${{ github.repository }}
          gh run download 38335062261 \
            -n s374-last8-IDMT-source-only-true-original-V88-official-PREXML \
            -D model/S374 --repo ${{ github.repository }}
          gh run download 38336012636 \
            -n s381-eightIDMT255-true-original-S18-vs-GuitarSet-only-1147K3-PRESCORE-SHA-noXML \
            -D model/S381 --repo ${{ github.repository }}
      - name: FIRST annotation read only after source SHA provenance, score true poly Exact-K and K2/K3 regressions no tuning
        run: |
          python -u -m scripts.s382_first_postfrozen_new8_XML_K3_expert_score \
            --s372 model/S372/report.json \
            --s374 model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz \
            --s374report model/S374/report.json \
            --s380 model/S381/S380/S380_8WAV_original_S18_vs_early_K3_specialist_PRESCORE.npz \
            --s380report model/S381/S380/report.json \
            --out model/S382
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S382/report.json'))
          assert r['status']=='S382_FIRST_UNSEEN_EIGHT_IDMT_K3_SPECIALIST_POSTFROZEN_EVALUATION'
          assert r['original_native_event_count']==255 and r['original_new_WAV_count']==8
          assert r['first_XML_read_after_expert_trained_and_predictions_frozen']
          assert r['original_source_models_trained_only_on_GuitarSet']
          assert sum(r['original_real_K_histogram_if_XML_complete'])==255
          assert not r['S80_promotion'] and r['original_S80_full_tail_not_replayed_on_last8']
          with np.load('model/S382/S382_scored_eight_original_native_255_events.npz',allow_pickle=False) as z:
            assert len(z['row_id'])==255
            assert np.count_nonzero(z['prelabel_K3_action'])==r['original_source_gate_candidates_changed']
          print('S382 PASS truly new original WAV XML postfrozen early specialist paired Exact-K under historical XML-completeness assumption')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s382-first-ever-XML-last8-255-original-early-K3-specialist-trueK-prospective
          path: model/S382/
          retention-days: 90
