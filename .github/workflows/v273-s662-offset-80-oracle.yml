name: S662 80pct GuitarSet Offset oracle plus cross-composition residual head
on:
  push:
    branches: [codex/s662-offset-80-oracle-calibration]
    paths:
      - scripts/s662_80pct_offset_feasibility_and_residual.py
      - .github/workflows/v273-s662-offset-80-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s662-offset-80-one-run
  cancel-in-progress: true
jobs:
  held_composition_offset_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Compile and self-test S662
        run: |
          python -m compileall -q scripts/s662_80pct_offset_feasibility_and_residual.py
          python -m scripts.s662_80pct_offset_feasibility_and_residual --self-test
      - name: Restore original S425 immutable MIDI note and offset predictions
        run: |
          mkdir -p model/S425
          gh run download 38513725784 -n s425-composition-trained-noteoff-S422-S420-selection-zero-S80-K-regressions -D model/S425 --repo ${{ github.repository }}
          test -f model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz
      - name: Download pinned GuitarSet annotation JAMS
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Compute real offset candidate oracle and predict new cross-composition residual offsets
        run: |
          python -m scripts.s662_80pct_offset_feasibility_and_residual --frozen model/S425/S425_K_LOCKED_59309_native_NoteOff_frozen.npz --annotations data/GuitarSet/annotation.zip --out /tmp/s662-offset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S662_80PCT_OFFSET_FEASIBILITY_REAL_GUITARSET
          path: /tmp/s662-offset/report.json
          if-no-files-found: warn
          retention-days: 60
