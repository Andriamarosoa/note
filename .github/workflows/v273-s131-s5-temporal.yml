name: S131 original time-flow and morphology student ablation (no labels)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s131_s5_genuine_temporal_student.py'
      - '.github/workflows/v273-s131-s5-temporal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s131-real-temporal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - run: python -m scripts.s131_s5_genuine_temporal_student --self-test
      - name: Retrieve original SHA-verified S5 teacher posteriors
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          for FOLD in 0 1 2 4; do
            git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/report.json" \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/predictions.npz" | tar -x -C model/history
          done
      - name: Original GuitarSet fold0 waveform-derived inputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/features/fold0
      - name: Original fold1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/features/fold1
      - name: Original fold2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/features/fold2
      - name: Original fold4
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/features/fold4
      - name: New GOAT control 111D
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38184381730
          name: v273-s116-original-S4-control111-GOAT
          path: model/s116
      - name: New GOAT original flow/morphology audio-only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/s97
      - name: Unweighted S129 teacher fidelity predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38188446402
          name: v273-s129-new-s5-student111-goat-blind
          path: model/s129
      - name: Train temporal students only on teacher labels and infer GOAT
        run: |
          set -euo pipefail
          S116="$(find model/s116 -type f -name external_s4_control111.npz -print -quit)"
          S97="$(find model/s97 -type f -name original_s45_audio_only.npz -print -quit)"
          S129="$(find model/s129 -type f -name held_fold0_teacher_fidelity.npz -print -quit)"
          test -s "$S116" && test -s "$S97" && test -s "$S129"
          python -u -m scripts.s131_s5_genuine_temporal_student \
            --original-features model/features \
            --original-s5 model/history/analysis/evidence/v273-open-k0-k6/series5/models \
            --s116 "$S116" --s97 "$S97" --s129 "$S129" --out model/s131
          python - <<'PY'
          import json
          r=json.load(open('model/s131/report.json'))
          assert r['original_teacher_rows']==15952 and r['GOAT_new_audio_groups']==57
          assert not r['truth_K_read'] and not r['GOAT_MIDI_or_labels_read']
          assert not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s131-genuine-temporal-s5-student-ablation
          path: model/s131/
          retention-days: 30
