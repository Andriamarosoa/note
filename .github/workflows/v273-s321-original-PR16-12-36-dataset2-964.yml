name: S321 original 12 trained PR16 heads and 36 policies on 964 reserved native IDMT dataset2 events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s321_real_PR16_12_neural_36policies_dataset2_964.py'
      - '.github/workflows/v273-s321-original-PR16-12-36-dataset2-964.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s321-original-PR16-964
  cancel-in-progress: true
jobs:
  original_12_neural_36_policies_same_964_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore exactly original 12 trained PR16 neural checkpoints and fold-zero normalizers
        run: gh run download 37837235723 -n v273-open-model-0 -D model/PR16-original --repo ${{ github.repository }}
      - name: Restore same 964 sealed S306 original native acoustic and S307 original geometry46
        run: |
          gh run download 38323508991 \
            -n s306-s307-IDMT-dataset2-964-original-S97-S5-527D-audio-before-XML \
            -D model/S306S307 --repo ${{ github.repository }}
      - name: Execute original 12 MLP plus 36 historical policy heads before any new XML opened
        run: |
          python -u -m scripts.s321_real_PR16_12_neural_36policies_dataset2_964 \
            --s306 model/S306S307/S306/S306_IDMT_dataset2_original_S97_on_frozen_native_events.npz \
            --s307 model/S306S307/S307/S307_IDMT_dataset2_true_original_S5_527D_input.npz \
            --models model/PR16-original/fold-0 \
            --out model/S321
          python - <<'PY'
          import numpy as np,json
          r=json.load(open('model/S321/report.json'))
          assert r['original_reference_native_event_count']==964
          assert r['original_trained_network_checkpoints']==12
          assert r['original_36_policy_definitions_exact']
          assert not r['models_retrained'] and not r['XML_MIDI_content_read']
          with np.load('model/S321/pr16_external_36_policies.npz',allow_pickle=False) as z:
            assert z['pr16_policy_K'].shape==(964,36)
            assert z['pr16_network_probabilities'].shape==(964,12,7)
          print('S321 PASS all 12 original trained PR16 networks and 36 policies on prospective cohort')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s321-original-12trained-PR16-36policy-IDMT-dataset2-964-PREXML
          path: model/S321/
          retention-days: 90
