name: S284 S285 original 19 S29 branches and S35 expert routing on 506 IDMT dataset3 V88
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s284_S29_19_original_dataset3_506.py'
      - 'scripts/s285_S29_S35_original_dataset3_506.py'
      - '.github/workflows/v273-s284-s285-original-S29-S35-dataset3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s284-s285-original-S29-S35-dataset3
  cancel-in-progress: true
jobs:
  pretrained_original_S29_S35_on_new_native_events:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original inference numerical and PyTorch ABI
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch original 506 native S18 source from S281 and original acoustics from S283
        run: |
          gh run download 38319911630 \
            -n s281-IDMT-dataset3-506-original-S5-S18-fourfold-133trained \
            -D model/S281 --repo ${{ github.repository }}
          gh run download 38320164646 \
            -n s282-s283-IDMT-dataset3-506-native-original-S18-quorum-S97-source \
            -D model/S282283 --repo ${{ github.repository }}
      - name: Download ORIGINAL 38 S29 Q and all 19 S20 checkpoints
        run: |
          gh run download 37865173636 \
            -n v273-series29-stepwise-scheduler -D model/S29 --repo ${{ github.repository }}
          gh run download 37858383973 \
            -n v273-series20-residual -D model/S20 --repo ${{ github.repository }}
      - name: Replay all historical 19 S29 Q/RNN branches without refitting and without labels
        run: |
          python -u -m scripts.s284_S29_19_original_dataset3_506 \
            --s29 model/S29 --s20 model/S20 \
            --s18 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s97 model/S282283/S283/S283_original_IDMT_dataset3_native_S97_audio.npz \
            --out model/S284
          python - <<'PY'
          import numpy as np,json
          j=json.load(open('model/S284/report.json'))
          assert j['events']==506 and j['original_S29_Q_models']==38
          assert j['original_S20_networks']==19 and j['branches']==19
          assert not j['labels_read'] and not j['promotion']
          with np.load('model/S284/S284_original_s29_all_19_dataset3.npz',allow_pickle=False) as z:
            assert z['predicted_K'].shape==(19,506)
          print('S284 PASS original 19 saved S29 branch policies on 506 new events')
          PY
      - name: Download original immutable 36 S35 acoustic experts and trained dynamic Q gates
        run: |
          gh run download 37868356632 \
            -n v273-series35-extended-head-router \
            -D model/S35 --repo ${{ github.repository }}
      - name: Replay complete genuine S35 gated experts for original 19 S29 branches
        run: |
          python -u -m scripts.s285_S29_S35_original_dataset3_506 \
            --s209 model/S284/S284_original_s29_all_19_dataset3.npz \
            --s18 model/S281/S281_original_S5_to_S18_true_V88_native_IDMT_506.npz \
            --s97 model/S282283/S283/S283_original_IDMT_dataset3_native_S97_audio.npz \
            --s35 model/S35 --out model/S285
          python - <<'PY'
          import json,numpy as np
          j=json.load(open('model/S285/report.json'))
          assert j['events']==506 and j['branches']==19
          assert j['original_S35_expert_checkpoints']==36
          assert not j['labels_read'] and not j['S80_promoted']
          with np.load('model/S285/S285_original_s29_to_s35_dataset3.npz',allow_pickle=False) as z:
            assert z['S35_K'].shape==(19,506)
            assert z['S35_actions'].shape==(19,506,3)
          print('S285 PASS 36 genuine S35 original pretrained acoustic experts and routes on 506 unseen audio events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s284-s285-IDMT-dataset3-506-original-19-S29-S35-branches-prelabel
          path: |
            model/S284/
            model/S285/
          retention-days: 90
