name: S385 compile original S306-S310 trained K3 early-chain checkpoint wrappers for new32 V88 events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s385_orig_S5_S18_five_stage_compile_new32_dataset2.py'
      - '.github/workflows/v273-s385-new32-authentic-S5-S18-source-stage-ABI.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s385-source-original-32-dataset2-S5-S18-preXML
  cancel-in-progress: true
jobs:
  compile_original_source_only_S5_S18_code:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Verify real original V88 native audio source SHA and unopened Dataset2 XML
        run: |
          gh run watch 38336530561 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38336530561 \
            -n s384-32-new-Dataset2-IDMT-original-V88-source-only-PREXML \
            -D model/S384 --repo ${{ github.repository }}
      - name: Compile SHA auditable original trained 5-stage source to exact native 32-WAV V88 event N
        run: |
          python -u -m scripts.s385_orig_S5_S18_five_stage_compile_new32_dataset2 \
            --report model/S384/report.json \
            --official model/S384/S384_official_V88_dataset2_new32_WAV_predictions.npz \
            --source scripts --out model/S385
          python - <<'PY'
          import json
          a=json.load(open('model/S385/report.json'))
          assert a['status']=='S385_AUTHENTIC_5_GUITARSET_HELDFOLD_S5_S18_SOURCE_MODULES_FOR_NEW32_DATASET2'
          assert a['source_new_WAVs']==32 and a['N']>0
          assert a['all_original_5_modules_compiled'] and len(a['code_source_hashes'])==5
          assert not a['model_weight_changes'] and not a['first_dataset2_new32_XML_MIDI_read']
          assert not a['official_promotion']
          print('S385 PASS five original trained source wrappers SHA compiled, genuine 32 WAV original input only, no XML')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s385-new32-original-S5-S8-S18-five-original-trained-modules-PREXML
          path: model/S385/
          retention-days: 90
