name: S201 historic original S5 saved posterior identity against all 24 fixed 104D temporal-zone orders
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s201_s5_original_527D_four_zone_permutation_fidelity.py'
      - '.github/workflows/v273-s201-original-S5-527D-24-zone-permutation-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s201-fixed-24-original-S5-zone-orders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed_candidate_order_posterior_fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse exact S123 original trained-model runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Test all 24 strictly predeclared alternative zone orders
        run: python -m scripts.s201_s5_original_527D_four_zone_permutation_fidelity --self-test
      - name: Restore pinned original S5 fold0 model and saved unmodified original raw probabilities
        run: |
          set -euo pipefail
          mkdir -p model/S201/pinned
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
             analysis/evidence/v273-open-k0-k6/series5/models/fold0 | tar -x -C model/S201/pinned
      - name: Retrieve original acoustic 58 plus 46 plus 42x49 waveform trajectory input on historical fold0
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/S201/audio
      - name: Retrieve original S123 output of fixed log-layout candidate for independent identity parity
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38186603580
          name: v273-s123-original-S5-fold-0-replay-candidate
          path: model/S201/cache
      - name: Read original raw checkpoint posterior but no ground-truth and assess 4 factorial fixed 104D zone orders
        run: |
          set -euo pipefail
          AUDIO="$(find model/S201/audio -name features-fold-0.npz -print -quit)"
          CACHED="$(find model/S201/cache -name replay_predictions.npz -print -quit)"
          P="model/S201/pinned/analysis/evidence/v273-open-k0-k6/series5/models/fold0"
          test -s "$AUDIO" && test -s "$CACHED" && test -s "$P/model.joblib" && test -s "$P/predictions.npz"
          python -u -m scripts.s201_s5_original_527D_four_zone_permutation_fidelity \
            --features "$AUDIO" --original "$P/predictions.npz" \
            --model "$P/model.joblib" --checkpoint-report "$P/report.json" \
            --cached "$CACHED" --count 512 --out model/S201/results/report.json
          python - <<'PY'
          import json
          r=json.load(open('model/S201/results/report.json'))
          assert r['permutations_tested']==24
          assert r['original_historical_fold0_sample_size']==512
          assert not r['archived_S5_training_labels_read']
          assert not r['S5_original_527D_builder_recovered']
          assert not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s201-original-S5-24-104D-block-order-original-posterior-fidelity-512-historical-no-labels
          path: model/S201/results/
          retention-days: 90
