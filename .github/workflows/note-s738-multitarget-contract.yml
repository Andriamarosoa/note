name: S738 reusable dynamic target routing contracts
on:
  push:
    branches: [codex/note-s737-multitarget-fragment-learning-loops]
    paths:
      - src/causal_note/s738_multitarget_routing_contract.py
      - test/test_s738_multitarget_routing_contract.py
      - .github/workflows/note-s738-multitarget-contract.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify_staged_target_isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU runtime
        run: |
          python -m pip install numpy torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run universal target / 32-mask isolation checks
        run: |
          python -m compileall -q src/causal_note/s738_multitarget_routing_contract.py
          python -m unittest -v test.test_s738_multitarget_routing_contract test.test_s736_fragment_mask
