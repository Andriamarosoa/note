name: V9.2 string-factorized cardinality

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v92_string_factorized_cardinality.py'
      - '.github/workflows/v92-string-factorized-cardinality.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          set -o pipefail
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.4/V8.6/V8.7/V8.8 stack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/source-v84 model/source-v86 model/source-v87 model/source-v88
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          gh run download 33586296528 --repo "$GITHUB_REPOSITORY" --name v86-state-transition-proposal-pilot --dir model/source-v86
          gh run download 33588164652 --repo "$GITHUB_REPOSITORY" --name v87-causal-candidate-memory-pilot --dir model/source-v87
          gh run download 33589654195 --repo "$GITHUB_REPOSITORY" --name v88-regime-gated-moe-pilot --dir model/source-v88
          test -f model/source-v84/v84-pilot/control.epoch-01.keras
          test -f model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5
          test -f model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5
          test -f model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5

      - name: Download V9.1 full-train caches and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v91-cache-merged model/source-v91
          gh run download 33600690679 --repo "$GITHUB_REPOSITORY" --pattern 'v91-cache-*' --dir model/v91-cache-merged
          gh run download 33600690679 --repo "$GITHUB_REPOSITORY" --name v91-ordinal-full-train --dir model/source-v91
          count=$(find model/v91-cache-merged -name 'v91-cache-shard-*.npz' | wc -l)
          echo "cache_shards=$count"
          test "$count" -eq 8
          test -f model/source-v91/v91-ordinal/result/report.json

      - name: Compile V9.2
        env:
          PYTHONPATH: src
        run: python -m py_compile scripts/train_v92_string_factorized_cardinality.py

      - name: Train V9.2 and evaluate locked12 once
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v92-string-factorized
          python -B scripts/train_v92_string_factorized_cardinality.py \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --v86-weights model/source-v86/v86-state-transition-pilot/result/v86-state-transition-refiner.weights.h5 \
            --v86-report model/source-v86/v86-state-transition-pilot/result/report.json \
            --v87-weights model/source-v87/v87-candidate-memory-pilot/result/v87-causal-candidate-memory.weights.h5 \
            --v87-report model/source-v87/v87-candidate-memory-pilot/result/report.json \
            --v88-weights model/source-v88/v88-regime-moe-pilot/result/v88-regime-moe.weights.h5 \
            --v88-report model/source-v88/v88-regime-moe-pilot/result/report.json \
            --v91-report model/source-v91/v91-ordinal/result/report.json \
            --cache-dir model/v91-cache-merged \
            --output-dir model/v92-string-factorized/result \
            2>&1 | tee model/v92-string-factorized.log

      - name: Verify isolation and summarize V9.2
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model/v92-string-factorized/result/report.json').read_text())
          a=d['architecture']; c=d['configuration']; data=d['data']; l=d['locked12']
          assert a['base_trainable'] is False
          assert a['runtime_inputs_use_annotations'] is False
          assert a['string_labels_training_only'] is True
          assert a['offset_stream_executed'] is False
          assert a['offset_weights_modified'] is False
          assert c['decode_mode_selected_on_locked_validation'] is False
          assert data['composition_group_leakage'] is False
          assert data['full_train_track_count'] == 240
          r=data['cache_reconstruction']
          assert r['top_sample_match_fraction'] >= 0.999
          assert r['occupancy_exact_count_match_fraction'] >= 0.95
          print('decode_mode', c['decode_mode'])
          print('epochs_ran', c['epochs_ran'])
          print('parameters', a['v92_trainable_parameters'])
          print('cache_reconstruction', r)
          print('cardinality', l['v92_cardinality'])
          print('string_slots', l['v92_string_slots'])
          for regime in ('global','solo','comp'):
              v88=l['frozen_v88_baseline_metrics'][regime]
              v91=l['v91_metrics'][regime]
              v92=l['v92_metrics'][regime]
              oracle=l['oracle_exact_cardinality_metrics'][regime]
              print(regime,
                    'v88', f"{v88['f1']:.6f}",
                    'v91', f"{v91['f1']:.6f}",
                    'v92', f"{v92['f1']:.6f}",
                    'delta_v91', f"{v92['f1']-v91['f1']:+.6f}",
                    'oracle', f"{oracle['f1']:.6f}",
                    'P', f"{v92['precision']:.6f}",
                    'R', f"{v92['recall']:.6f}",
                    'pred_ref', f"{v92['prediction_reference_ratio']:.6f}")
          PY

      - name: Upload V9.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v92-string-factorized-cardinality
          path: |
            model/v92-string-factorized.log
            model/v92-string-factorized/result/report.json
            model/v92-string-factorized/result/v92-string-factorized-cardinality.weights.h5
          if-no-files-found: error
          retention-days: 14
