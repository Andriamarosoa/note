name: V27.3 S72 temporal poly guard (research)

on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/audit_v273_s72_temporal_poly_guard.py'
      - '.github/workflows/v273-s72-temporal-risk.yml'
      - 'analysis/README_V273_S72_TEMPORAL_POLY_RISK.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use same numerical dependencies as S71
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Download verified S71 baseline, do not retrain it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38154433492
          name: v273-s71-acoustic-risk
          path: model/s71
      - name: Download complete original PR16 acoustic trajectories
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          pattern: v273-open-features-*
          path: model/features
      - name: Fit S72 poly-risk critic with training-fold-only thresholds
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m py_compile scripts/audit_v273_s72_temporal_poly_guard.py
          python -m scripts.audit_v273_s72_temporal_poly_guard \
            --s71 model/s71/predictions.npz \
            --features model/features \
            --output model/s72
      - name: Verify per-prediction correctness and conservative source-only veto
        run: |
          python - <<'PY'
          import json,numpy as np
          with np.load('model/s72/predictions.npz',allow_pickle=False) as a:
              y=a['true_K'];b=a['s69_poly_K'];fold=a['fold']
              assert len(y)==len(set(a['global_index']))==59309 and set(fold)=={0,1,2,4}
              report=json.load(open('model/s72/report.json'))
              for k in ('risk_all','risk_poly_guard','poly_all','poly_poly_guard'):
                  p=a['s72_'+k+'_K']
                  source=a['s71_'+k.split('_')[0]+'_K']
                  assert np.all((p==source)|(p==b))
                  actual=int((p==y).sum()),int(((p==y)&(y>=2)).sum())
                  assert actual==(report['results'][k]['correct'],
                                  report['results'][k]['poly'])
                  if k.endswith('poly_guard'):
                      assert np.array_equal(p[b<2],source[b<2])
              assert report['results']['risk_poly_guard']['poly_gain']>=0
              assert report['results']['poly_poly_guard']['poly_gain']>=0
              print('S72 59309 native integrity, exact paired scores and veto invariants passed')
          PY
      - name: Publish research-only measured results
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('model/s72/report.json'))
          print('S72, existing historical folds only. No independent validation.')
          for k,v in r['results'].items():
              print(k,'correct',v['correct'],'poly',v['poly'],'regressions',v['regressions'],
                'delta',v['gain'],'poly delta',v['poly_gain'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s72-temporal-risk
          path: model/s72/
          retention-days: 90
