name: V27.3 Residual Acoustic Checks

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - '.github/workflows/v273-residual-acoustic-checks.yml'
      - 'scripts/audit_v273_internal_residual_acoustics.py'
      - 'scripts/audit_v273_residual_stable_pool.py'
      - 'scripts/probe_v273_residual_dictionary.py'
      - 'scripts/audit_v273_internal_b_low_harmonic_strata.py'
      - 'scripts/v273_residual_audit.py'
      - 'test/test_v273_residual_acoustics.py'
      - 'test/test_v273_residual_audit.py'
      - 'scripts/audit_v273_harmonic_templates.py'
      - 'scripts/audit_v273_harmonic_decay_guard.py'
      - 'scripts/audit_v273_decay_frequency_coverage.py'
      - 'scripts/replay_v273_harmonic_decay_guard.py'
      - 'test/test_v273_harmonic_templates.py'
      - 'scripts/audit_v273_candidate_ranking.py'
      - 'scripts/audit_v273_candidate_capacity_guard.py'
      - 'scripts/replay_v273_candidate_audit.py'
      - 'scripts/audit_v273_reconstruction_criterion.py'
      - 'scripts/audit_v273_log_frequency_guard.py'
      - 'scripts/audit_v273_hann_shape_guard.py'
      - 'scripts/audit_v273_two_variant_frequency_coverage.py'
      - 'scripts/replay_v273_log_frequency_guard.py'
      - 'scripts/replay_v273_hann_shape_guard.py'
      - 'scripts/replay_v273_reconstruction_followups.py'
      - 'scripts/audit_v273_temporal_stability.py'
      - 'scripts/audit_v273_temporal_persistence_guard.py'
      - 'scripts/diagnose_v273_temporal_stability.py'
      - 'scripts/replay_v273_temporal_stability.py'
      - 'test/test_v273_temporal_stability.py'
      - 'analysis/v273-temporal-stability-protocol.md'
      - 'analysis/v273-temporal-persistence-feature-protocol.md'
      - 'test/test_v273_candidate_ranking.py'
      - 'analysis/evidence/v273-residual-acoustics/**'
      - 'analysis/evidence/v273-harmonic-templates/**'
      - 'analysis/evidence/v273-candidate-ranking/**'
      - 'analysis/evidence/v273-reconstruction-criterion/**'
      - 'analysis/evidence/v273-temporal-stability/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: '.:src'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric audit dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2
      - name: Compile audit scripts
        run: >-
          python -m py_compile
          scripts/audit_v273_internal_residual_acoustics.py
          scripts/audit_v273_residual_stable_pool.py
          scripts/probe_v273_residual_dictionary.py
          scripts/audit_v273_harmonic_templates.py
          scripts/audit_v273_harmonic_decay_guard.py
          scripts/audit_v273_decay_frequency_coverage.py
          scripts/replay_v273_harmonic_decay_guard.py
          scripts/audit_v273_candidate_ranking.py
          scripts/audit_v273_candidate_capacity_guard.py
          scripts/replay_v273_candidate_audit.py
          scripts/audit_v273_reconstruction_criterion.py
          scripts/audit_v273_log_frequency_guard.py
          scripts/audit_v273_hann_shape_guard.py
          scripts/audit_v273_two_variant_frequency_coverage.py
          scripts/replay_v273_log_frequency_guard.py
          scripts/replay_v273_hann_shape_guard.py
          scripts/replay_v273_reconstruction_followups.py
          scripts/audit_v273_temporal_stability.py
          scripts/audit_v273_temporal_persistence_guard.py
          scripts/diagnose_v273_temporal_stability.py
          scripts/replay_v273_temporal_stability.py
      - name: Check replay, ownership, matching and deterministic F0 ties
        run: python -B -m unittest test.test_v273_residual_audit test.test_v273_residual_acoustics test.test_v273_harmonic_templates test.test_v273_candidate_ranking test.test_v273_temporal_stability -v
      - name: Verify committed evidence archive
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('analysis/evidence/v273-residual-acoustics')
          manifest = json.loads((root / 'checksums.json').read_text())
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          with zipfile.ZipFile(root / 'evidence.zip') as z:
              assert set(z.namelist()) == set(manifest['archive_members'])
              for name, digest in manifest['archive_members'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest, name
              report = json.loads(z.read('acoustic/report.json'))
              assert report['status'] == 'completed' and report['folds'] == [0, 1, 2, 4]
              assert not report['outer_fold_3_used']
              assert len(z.read('acoustic/cases.jsonl').splitlines()) == report['cases'] == 488
          print('Evidence archive and all member hashes verified; no audio or model loaded.')
          PY
      - name: Replay harmonic decay decisions without audio or fitting
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tempfile, zipfile
          from scripts.replay_v273_harmonic_decay_guard import verify
          root = pathlib.Path('analysis/evidence/v273-harmonic-templates')
          manifest = json.loads((root / 'checksums.json').read_text())
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          with zipfile.ZipFile(root / 'evidence.zip') as z, tempfile.TemporaryDirectory() as temp:
              assert set(z.namelist()) == set(manifest['archive_members'])
              for name, digest in manifest['archive_members'].items():
                  raw = z.read(name)
                  assert hashlib.sha256(raw).hexdigest() == digest, name
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
                  target = pathlib.Path(temp) / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
              print(json.dumps(verify(pathlib.Path(temp) / 'decay'), sort_keys=True))
          PY
      - name: Replay candidate ranking and capacity decisions
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tempfile, zipfile
          from scripts.replay_v273_candidate_audit import verify
          root = pathlib.Path('analysis/evidence/v273-candidate-ranking')
          manifest = json.loads((root / 'checksums.json').read_text())
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          with zipfile.ZipFile(root / 'evidence.zip') as z, tempfile.TemporaryDirectory() as temp:
              assert set(z.namelist()) == set(manifest['archive_members'])
              for name, digest in manifest['archive_members'].items():
                  raw = z.read(name)
                  assert hashlib.sha256(raw).hexdigest() == digest, name
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
                  target = pathlib.Path(temp) / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
              with zipfile.ZipFile('analysis/evidence/v273-residual-acoustics/evidence.zip') as source:
                  cases = pathlib.Path(temp) / 'source-cases.jsonl'
                  cases.write_bytes(source.read('acoustic/cases.jsonl'))
              actual = verify(pathlib.Path(temp) / 'ranking', pathlib.Path(temp) / 'capacity', cases)
              saved = json.loads((pathlib.Path(temp) / 'replay-check.json').read_text())
              assert actual == saved, 'candidate replay differs'
              print(json.dumps({'status': actual['status'], 'cases': actual['ranking_cases'], 'models': actual['models']}, sort_keys=True))
          PY
      - name: Replay reconstruction criterion and follow-up guards
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tempfile, zipfile
          from scripts.replay_v273_reconstruction_followups import verify
          def extract(root, target):
              manifest = json.loads((root / 'checksums.json').read_text())
              for name, digest in manifest['files'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
              with zipfile.ZipFile(root / 'evidence.zip') as z:
                  assert set(z.namelist()) == set(manifest['archive_members'])
                  for name, digest in manifest['archive_members'].items():
                      raw = z.read(name)
                      assert hashlib.sha256(raw).hexdigest() == digest, name
                      path = pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      destination = target / path
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(raw)
          with tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)
              extract(pathlib.Path('analysis/evidence/v273-candidate-ranking'), temp / 'candidate')
              extract(pathlib.Path('analysis/evidence/v273-residual-acoustics'), temp / 'source')
              extract(pathlib.Path('analysis/evidence/v273-reconstruction-criterion'), temp / 'followup')
              root = temp / 'followup'
              actual = verify(temp / 'candidate', temp / 'source/acoustic/cases.jsonl',
                              root / 'criterion', root / 'log', root / 'log-coverage',
                              root / 'hann', root / 'hann-coverage')
              saved = json.loads((root / 'replay-check.json').read_text())
              assert actual == saved, 'reconstruction follow-up replay differs'
              print(json.dumps({'status': actual['status'], 'criterion_cases': actual['criterion_cases'],
                                'unique_spectra': actual['unique_spectra']}, sort_keys=True))
          PY
      - name: Replay temporal spectra, diagnostics and all frozen inner models
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tempfile, zipfile
          from scripts.replay_v273_temporal_stability import verify
          def extract(name, target):
              root = pathlib.Path('analysis/evidence') / name
              manifest = json.loads((root / 'checksums.json').read_text())
              for name, digest in manifest['files'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
              with zipfile.ZipFile(root / 'evidence.zip') as z:
                  assert set(z.namelist()) == set(manifest['archive_members'])
                  for name, digest in manifest['archive_members'].items():
                      raw = z.read(name)
                      assert hashlib.sha256(raw).hexdigest() == digest, name
                      path = pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      destination = target / path
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(raw)
          with tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)
              extract('v273-reconstruction-criterion', temp / 'reference')
              extract('v273-residual-acoustics', temp / 'source')
              extract('v273-temporal-stability', temp / 'new')
              root = temp / 'new'
              actual = verify(temp / 'reference/hann', root / 'temporal', root / 'diagnosis',
                              root / 'persistence', temp / 'source/acoustic/cases.jsonl')
              saved = json.loads((root / 'replay-check.json').read_text())
              assert actual == saved, 'temporal replay differs'
              print(json.dumps(actual, sort_keys=True))
          PY
