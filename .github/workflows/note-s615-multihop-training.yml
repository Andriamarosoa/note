name: S615 native multi-hop training smoke
on:
  push:
    branches: [codex/note-live-s615-multihop-training]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s615-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multihop-training-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "threadpoolctl>=3" "onnxruntime>=1.17,<1.25" "scikit-learn>=1.4,<1.7"
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile S615 source
        run: |
          python -m compileall -q src/causal_note/strict_live.py scripts/s615_prepare_multihop.py scripts/s615_train_multihop.py scripts/live_hop_tuning.py test/test_s615_multihop_training.py
      - name: S613 baseline and multi-hop regression tests
        run: |
          python -m unittest -v test.test_live_adaptive_hop test.test_live_auto_audio_tuning test.test_s615_multihop_training test.test_s615_exactk_audit
      - name: Source split provenance and train checkpoint assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proto=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          groups={split:{(s['corpus'],s['composition']) for s in proto['sources'] if s['split']==split} for split in ('train','dev','test')}
          assert not(groups['train']&groups['dev'] or groups['train']&groups['test'] or groups['dev']&groups['test'])
          print({k:len(v) for k,v in groups.items()})
          PY
