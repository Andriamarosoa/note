name: V27.3 Stable Quartet Full-488

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-stable-quartet-full488-launch.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [0, 1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install runtime
        run: |
          python -m pip install -r requirements-train.txt numpy==1.26.4 scipy==1.17.1 scikit-learn==1.4.2

      - name: Restore GuitarSet
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Restore frozen cases
        run: |
          mkdir -p model/cases
          unzip -q analysis/evidence/v273-residual-acoustics/evidence.zip -d model/cases
          test -f model/cases/acoustic/cases.jsonl

      - name: Restore x4 comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/comparison
          gh run download 37664084466 \
            --repo "${{ github.repository }}" \
            --name "v273-rubberband-x4-disappearance-fold-${{ matrix.fold }}" \
            --dir model/comparison
          test -f model/comparison/comparison.npz

      - name: Extract quartet features on full fold cohort
        run: >-
          python -B scripts/extract_v273_quartet_full488.py
          --cases model/cases/acoustic/cases.jsonl
          --dataset data/GuitarSet
          --comparison model/comparison/comparison.npz
          --fold ${{ matrix.fold }}
          --output model/result-${{ matrix.fold }}

      - uses: actions/upload-artifact@v4
        with:
          name: v273-quartet-full488-fold-${{ matrix.fold }}
          path: model/result-${{ matrix.fold }}/
          retention-days: 90

  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4

      - uses: actions/download-artifact@v4
        with:
          pattern: v273-quartet-full488-fold-*
          path: model/results

      - name: Validate outside common subset
        run: >-
          python -B scripts/summarize_v273_quartet_full488.py
          --input-root model/results
          --output model/summary

      - name: Show result
        run: cat model/summary/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-quartet-full488-summary
          path: model/summary/
          retention-days: 90
