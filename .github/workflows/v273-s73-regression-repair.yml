name: V27.3 S73 regression audit and fail-closed repair

on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/audit_v273_s73_candidate.py'
      - 'analysis/v273_s73_repair_manifest.json'
      - 'analysis/README_V273_S73_REGRESSION_REPAIR.md'
      - '.github/workflows/v273-s73-regression-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Retrieve audited S72 predictions (unmodified)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38155427761
          name: v273-s72-temporal-risk
          path: model/s72
      - name: Audit S73 evidence and reject missing individual decisions
        run: |
          python -m py_compile scripts/audit_v273_s73_candidate.py
          python -m scripts.audit_v273_s73_candidate \
            --s72 model/s72/predictions.npz \
            --manifest analysis/v273_s73_repair_manifest.json \
            --out model/s73-regression-audit
      - name: Verify no accidental promotion and all S73 controls
        run: |
          python - <<'PY'
          import json
          r=json.load(open('model/s73-regression-audit/report.json'))
          m=json.load(open('analysis/v273_s73_repair_manifest.json'))
          assert r['status']=='BLOCKED_MISSING_S73_CASE_PREDICTIONS'
          assert r['promotion']=='NOT_APPROVED' and r['actual_case_metrics'] is None
          a=m['variants']
          assert a['permissive_49p05']['global_correct']==48581
          assert a['permissive_49p05']['poly_correct']==3622
          assert a['conservative_45p09']['global_correct']==49298
          assert a['conservative_45p09']['poly_correct']==3330
          assert a['balanced_45p15']['global_correct']==49271
          assert a['balanced_45p15']['poly_correct']==3334
          assert m['sweep_counts']=={'stage1':8400,'stage2':11220,'specialists':3360}
          print('PASS: S73 audit is blocked, no misleading K0-K6 reproduction, official reference unchanged.')
          PY
      - name: Summarize precise outcome
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('model/s73-regression-audit/report.json'))
          print('S73 historical aggregate audit: 49.05% poly loses 657 global net vs S72.')
          print('Conservative S73 historical 45.09% poly, 83.12% global requires case outputs.')
          print('Case-level K0..K6: NOT AVAILABLE. Promotion:',r['promotion'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s73-regression-audit
          path: model/s73-regression-audit/
          retention-days: 90
