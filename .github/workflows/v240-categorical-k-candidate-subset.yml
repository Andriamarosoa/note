name: V24.0 categorical-K candidate subset

on:
  push:
    branches: [v240-categorical-k-candidate-subset]
    paths:
      - 'scripts/train_v240_categorical_k_candidate_subset.py'
      - 'scripts/run_v240_reporting_compat.py'
      - 'test/test_v240_candidate_subset.py'
      - '.github/workflows/v240-categorical-k-candidate-subset.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_PREAUDIT_RUN: '34126377071'
  CONTROL_SEED: '16061'

jobs:
  preflight:
    name: V24.0 exact-K candidate-subset preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V24.0
        env:
          PYTHONPATH: .:src
        run: |
          python -m unittest test.test_v240_candidate_subset -v
          python -m py_compile scripts/train_v240_categorical_k_candidate_subset.py
          python -m py_compile scripts/run_v240_reporting_compat.py
      - name: Download authorized V23 preaudit
        uses: actions/download-artifact@v4
        with:
          name: v230-preaudit-cardinality-transport
          path: model/v230-preaudit
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_PREAUDIT_RUN }}
          github-token: ${{ github.token }}
      - name: Verify architectural authorization evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v230-preaudit/report.json').read_text())
          assert r['gates']['proceed_to_v23_architecture'] is True
          assert r['gates']['candidate_memory_injective_poly_at_least_97pct'] is True
          assert r['protocol']['locked12_indexed_or_evaluated'] is False
          x=r['candidate_memory']['fully_injective_candidate_recoverable_poly']
          assert x >= .97
          print('preaudit candidate recoverability',x)
          PY
      - name: Prove categorical K is separate from candidate ranking
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        run: |
          python - <<'PY'
          import random
          import numpy as np
          import tensorflow as tf
          from scripts import train_v240_categorical_k_candidate_subset as v240

          tf.keras.backend.clear_session()
          random.seed(16061); np.random.seed(16061); tf.random.set_seed(16061)
          model,lw,_=v240._build_model({})
          assert lw['cardinality'] == 1.0
          assert lw['candidate_subset'] == 1.0
          names={x.name for x in model.layers}
          assert 'v231_transport_plan' not in names
          assert 'v231_transport_scores' not in names
          assert 'v240_candidate_rank_logits' in names
          assert 'v240_candidate_top6' in names

          rng=np.random.default_rng(240)
          batch=3
          inputs={}
          for t in model.inputs:
              name=t.name.split(':',1)[0]
              shape=[batch]+[int(x) for x in t.shape[1:]]
              inputs[name]=rng.normal(size=shape).astype(np.float32)
          mask=np.zeros_like(inputs['candidate_mask'],dtype=np.float32)
          mask[:,:8]=1.0
          inputs['candidate_mask']=mask

          card=model.get_layer('cardinality')
          w,b=card.get_weights(); w[...] = 0.0; b[...] = -20.0; b[3] = 20.0
          card.set_weights([w,b])
          out=model(inputs,training=False)
          hard=np.concatenate([np.asarray(out[f'event_present_{q}']) for q in range(6)],axis=1)
          np.testing.assert_array_equal(hard,np.tile(np.array([[1,1,1,0,0,0]],dtype=np.float32),(batch,1)))
          active=np.asarray(out['candidate_runtime_active']) > .5
          assert np.all(active.sum(1) == 3)
          ids=np.asarray(out['candidate_selected_ids'])[:,:3]
          assert all(len(set(map(int,row))) == 3 for row in ids)
          assert np.all(ids < 8)
          rank=np.asarray(out['candidate_subset'])
          assert np.all(np.isfinite(rank))
          np.testing.assert_allclose(rank.sum(1),1.0,atol=1e-5)

          loss_fn=v240._candidate_subset_loss()
          zero=np.zeros((batch,48),dtype=np.float32)
          zero_loss=np.asarray(loss_fn(zero,out['candidate_subset']))
          assert np.all(np.isfinite(zero_loss))
          np.testing.assert_allclose(zero_loss,0.0,atol=1e-8)

          target=np.zeros((batch,48),dtype=np.float32)
          target[:,1]=1.0; target[:,3]=1.0; target[:,5]=1.0
          with tf.GradientTape() as tape:
              pred=model(inputs,training=True)['candidate_subset']
              loss=tf.reduce_mean(loss_fn(target,pred))
          vars_=model.get_layer('v240_shared_rank_logit').trainable_weights
          grads=[g for g in tape.gradient(loss,vars_) if g is not None]
          gnorm=float(tf.linalg.global_norm(grads).numpy())
          assert np.isfinite(float(loss.numpy()))
          assert np.isfinite(gnorm) and gnorm > 1e-10, gnorm
          print('K=3 unique candidate top-K OK; K0 finite; rank gradient norm',gnorm)
          print('V24.0 preflight OK')
          PY

  fold:
    name: V24.0 fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Train V24.0
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_DETERMINISTIC_OPS: '1'
        shell: bash
        run: |
          set -o pipefail
          out="model/v240-fold-${{ matrix.fold }}"; mkdir -p "$out"
          python -B scripts/run_v240_reporting_compat.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --arm mass_permutation \
            --seed "$CONTROL_SEED" \
            --output-dir "$out" \
            2>&1 | tee "$out/train.log"
      - name: Verify V24.0 fold protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold='${{ matrix.fold }}'
          r=json.loads(Path(f'model/v240-fold-{fold}/report-fold-{fold}.json').read_text())
          p=r['protocol']; a=r['v240']['architecture']; s=a['candidate_subset']
          assert p['v240_categorical_k_candidate_subset'] is True
          assert p['candidate_target_matching'] == 'maximum-cardinality minimum-time-error injective'
          assert p['candidate_target_tolerance_ms'] == 50.0
          assert p['candidate_subset_supervision_requires_complete_match'] is True
          assert p['categorical_cardinality_head_exists'] is True
          assert p['six_independent_presence_bernoullis_exist'] is False
          assert p['candidate_rank_controls_count'] is False
          assert p['dense_transport_used_for_event_identity'] is False
          assert p['transport_plan_exists_in_v240_graph'] is False
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert s['selected_candidate_unique_rate'] >= .999999
          log=Path(f'model/v240-fold-{fold}/train.log').read_text().lower()
          assert 'candidate_subset_loss: nan' not in log
          assert 'val_candidate_subset_loss: nan' not in log
          g=r['strata']['aggregate']['v240_categorical_k_candidate_subset']['metrics']['global']
          c=a['categorical_cardinality']
          print(fold,'epochs',r['data']['selected_epochs'],'f1',g['f1'],'pred_ref',g['prediction_reference_ratio'],'k_exact',c['exact'],'k_poly',c['poly_exact'],'subset_recall',s['mean_positive_candidate_recall'],'subset_exact_poly_feasible',s['exact_subset_poly_feasible_rate'],'realized_exact_k',s['runtime_realized_exact_categorical_k_rate'])
          PY
      - name: Upload V24.0 fold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v240-categorical-k-candidate-subset-fold-${{ matrix.fold }}
          path: model/v240-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: warn
          retention-days: 30
