name: S249 true historical S69 fourfold veto rules on authentic 1034 native IDMT S46 plus PR16
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s249_original_S69_true_IDMT_1034.py'
      - '.github/workflows/v273-s249-real-S69-native-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s249-real-original-S69-IDMT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_S69_true_s46_PR16_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original S69 label-free numerical inference
        run: python -m pip install numpy==1.26.4
      - name: Original true sixteen-family S46 193 source policies under precommitted S219 consensus
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307178111
          name: s247-genuine-S46-193-specialist-consensus-IDMT-native-1034
          path: model/S247
      - name: Original twelve neural heads and all thirty-six real PR16 votes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307419228
          name: s248-genuine-original-12-PR16-36policy-1034-native-IDMT
          path: model/S248
      - name: Restore unmodified original historical S69 fold-veto rules
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38177948016
          name: v273-s69-s46-risk-replay
          path: model/originalS69
      - name: Original S69 folded-veto self-test no direct fold-oracle assignment
        run: python -m scripts.s249_original_S69_true_IDMT_1034 --self-test
      - name: Run genuine S69 historical policy names, rules, original 193 S46 + 36 PR16, on canonical IDMT native events
        run: |
          python -m scripts.s249_original_S69_true_IDMT_1034 \
            --s247 model/S247/S247_original_193_S46_foldneutral_1034_IDMT.npz \
            --pr16 model/S248/pr16_external_36_policies.npz \
            --rules model/originalS69/report.json \
            --out model/S249
      - name: Require strict source K0–K6 and no labels or independent accuracy claims
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S249/report.json'))
          assert r['count']==1034 and r['pr16_original_network_heads']==12
          assert r['pr16_real_policies']==36 and r['original_S46_policy_bank']==193
          assert set(r['policies'])=={'balanced','polymax'}
          assert r['original_training_thresholds_unchanged']
          assert not r['truth_or_midi_used'] and not r['models_retrained']
          assert not r['independent_accuracy_measured'] and not r['S80_promoted']
          with np.load('model/S249/S249_original_S69_fourfold_rule_consensus_IDMT.npz',allow_pickle=False) as z:
            assert z['balanced_protected_K'].shape==(1034,)
            assert z['polymax_protected_K'].shape==(1034,)
            assert z['balanced_fold_veto'].shape==(4,1034)
            assert np.isin(z['polymax_protected_K'],range(7)).all()
          print('S249 PASS genuine historical S69 rule replay from true 193 S46 and 36 PR16 native IDMT votes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s249-original-S69-4fold-genuine-S46-PR16-1034-IDMT
          path: model/S249/
          retention-days: 90
