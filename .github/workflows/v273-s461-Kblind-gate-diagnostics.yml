name: S461 K-blind sourceK 160 threshold diagnosis real acoustic gate abstention
on:
  push:
    branches: [codex/s459-Kblind-external-IDMT-test]
    paths:
      - 'scripts/s461_explain_S458_Kblind_gating_no_gain.py'
      - '.github/workflows/v273-s461-Kblind-gate-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report_S458_failure_modes_without_external_label_fitting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate diagnostic gate error taxonomy
        run: |
          python -m py_compile scripts/s461_explain_S458_Kblind_gating_no_gain.py
          python -m scripts.s461_explain_S458_Kblind_gating_no_gain --self-test
      - name: Restore GuitarSet train-only S458 model selections and original external stage proof
        run: |
          gh run download 38536654031 -n s458-Kblind-1090D-K-head-GuitarSet-songheld-train-only-NOPROMOTION -D model/S458 --repo ${{ github.repository }}
          gh run download 38533183193 -n s453-original-5stage-S80-IDMT-506-K0-K2-K3-error-provenance-no-promotion -D model/S453 --repo ${{ github.repository }}
          test -f model/S458/report.json
          test -f model/S453/report.json
      - name: Quantify correction false positives and safety blockers per K and fold, no retuning
        run: |
          python -u -m scripts.s461_explain_S458_Kblind_gating_no_gain \
            --s458 model/S458/report.json \
            --s453 model/S453/report.json \
            --out model/S461
          python - <<'PY'
          import json
          a=json.load(open('model/S461/report.json'))
          assert a['status']=='S461_S458_INNER_K_GATE_ABSTENTION_TRAINING_ONLY_DIAGNOSTIC'
          assert a['S458_trained_fold_count']==4 and a['all_160_threshold_checks_rejected']
          assert a['original_reference_unchanged'] and a['no_promotion']
          assert not a['external_info_used_for_prediction_model_or_thresholds']
          print('S461 research gate-failure root causes verified; S80 remains original')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s461-S458-160-inner-validation-K0K4-abstention-causes-NOPROMOTION
          path: model/S461/
          retention-days: 90
