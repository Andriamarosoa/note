name: V8 pilot

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v8-pilot.yml"
      - "scripts/sweep_v8_thresholds.py"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Train V8 three-epoch pilot
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          mkdir -p model
          python -B scripts/train_v8.py \
            --epochs 3 \
            --filters 32 \
            --hard-negative-h 4 \
            --rare-extra-train 128 \
            --output model/causal-boundaries-v8-pilot.keras \
            2>&1 | tee model/v8-pilot-train.log

      - name: Sweep pilot thresholds on locked validation subset
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          python -B scripts/sweep_v8_thresholds.py \
            --model model/causal-boundaries-v8-pilot.keras \
            --limit-tracks 12 \
            --thresholds 0.01 0.02 0.05 0.10 0.20 0.30 0.40 0.50 \
            --output model/v8-pilot-sweep.json \
            > model/v8-pilot-sweep.log

      - name: Print pilot summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("model/v8-pilot-sweep.json").read_text())
          print("threshold onset_P onset_R onset_F1 offset_P offset_R offset_F1 false_onsets/h false_offsets/h")
          for threshold, payload in report["sweep"].items():
              global_ = payload["aggregates"]["global"]
              onset = global_["onset"]
              offset = global_["offset"]
              rates = global_["rates_per_hour"]
              print(
                  threshold,
                  f'{onset["precision"]:.6f}',
                  f'{onset["recall"]:.6f}',
                  f'{onset["f1"]:.6f}',
                  f'{offset["precision"]:.6f}',
                  f'{offset["recall"]:.6f}',
                  f'{offset["f1"]:.6f}',
                  f'{rates["false_onsets"]:.3f}',
                  f'{rates["false_offsets"]:.3f}',
              )
          print("runtime", report["runtime"])
          PY

      - name: Upload V8 pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-pilot
          path: |
            model/v8-pilot-train.log
            model/v8-pilot-sweep.log
            model/v8-pilot-sweep.json
            model/causal-boundaries-v8-pilot.keras
            model/causal-boundaries-v8-pilot.point.best.keras
          if-no-files-found: warn
          retention-days: 7
