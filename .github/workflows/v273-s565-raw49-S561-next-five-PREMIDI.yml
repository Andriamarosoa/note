name: S565 prospective five piano 49-pitch acoustic onset features at all V88 K0-K6 frozen source times PREMIDI
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s565_next_five_raw49_PREMIDI.py
      - .github/workflows/v273-s565-raw49-S561-next-five-PREMIDI.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_unseen_piano_prelabeled_49_pitch_acoustic_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install raw 49-note and harmonic source features
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2
      - name: Test raw spectral feature ABI without MIDI
        run: |
          python -m py_compile scripts/s565_next_five_raw49_PREMIDI.py
          python -m scripts.s565_next_five_raw49_PREMIDI --self-test
      - name: Restore SHA-pinned preselected five new composer names and original V88 event predictions
        run: |
          gh run download 38666895837 -n s561-next-5-component-disjoint-music-after-18-exposed-METADATA-ONLY -D model/S561 --repo "${{ github.repository }}"
          gh run download 38667195568 -n s563-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S563 --repo "${{ github.repository }}"
          gh run download 38667294210 -n s564-next-five-S561-BasicPitch-original-pitch-names-PREMIDI -D model/S564 --repo "${{ github.repository }}"
      - name: Verify source whole WAV SHA from S563 and extract original all V88 K0 note physics without opening MIDI
        run: |
          python -u -m scripts.s565_next_five_raw49_PREMIDI \
            --manifest model/S561/report.json \
            --v88 model/S563/S563_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S563/report.json \
            --bp model/S564/S564_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --bp-report model/S564/report.json --out model/S565
          python - <<'PY'
          import json
          r=json.load(open('model/S565/report.json'))
          assert r['status']=='S565_PRELABEL_FIVE_NEW_PIANO_ALL_V88_RAW_49_PITCH_FEATURES'
          assert len(r['per_recording'])==5
          assert r['original_V88_onset_candidates']>0
          assert r['real_audio_piano_five_source_WAV_SHAs_verified']
          assert r['all_49_pitch_features_at_every_piano_V88_event']
          assert r['no_original_true_MIDI_annotation_read'] and r['no_promotion']
          print('S565 SUCCESS five composer 49x11 acoustic NOTE_ON pitch features preMIDI sealed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s565-next-five-S561-composers-V88-raw49-pitch-PREMIDI
          path: model/S565/
          retention-days: 90
