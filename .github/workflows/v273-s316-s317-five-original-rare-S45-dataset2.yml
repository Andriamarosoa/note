name: S316 S317 all five ORIGINAL rare S1-S4 coherent S45 families on 964 IDMT reserve events PREXML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s316_original_fundamental58_IDMT_dataset2_964.py'
      - '.github/workflows/v273-s316-s317-five-original-rare-S45-dataset2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s316-s317-original-rare-five-964
  cancel-in-progress: true
jobs:
  original_fundamental_58D_on_same_S302_native_rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore S302 original 964 true native reference, S306 original acoustic views and S276 prelabel selection
        run: |
          gh run download 38323508991 \
            -n s306-s307-IDMT-dataset2-964-original-S97-S5-527D-audio-before-XML \
            -D model/S306S307 --repo ${{ github.repository }}
          gh run download 38322507433 \
            -n s302-IDMT-dataset2-16WAV-true-original-V88-native-official-unlabelled \
            -D model/S302 --repo ${{ github.repository }}
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
      - name: Original acoustic and fundamental bank feature reconstruction (no XML)
        run: |
          python -u -m scripts.s316_original_fundamental58_IDMT_dataset2_964 \
            --s306 model/S306S307/S306/S306_IDMT_dataset2_original_S97_on_frozen_native_events.npz \
            --s302 model/S302/S302_official_V88_dataset2_rank49plus_16_WAV_predictions.npz \
            --s302report model/S302/report.json \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S316
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S316/report.json'))
          assert r['original_reference_events']==964 and r['WAV_count']==16
          assert r['original_feature_count']==r['original_fundamental_count']==58
          assert r['original_primary_max_scaled_deviation_from_S306']<1e-3
          assert not r['annotation_XML_MIDI_contents_read'] and not r['S80_promoted']
          with np.load('model/S316/S316_fundamental58_dataset2_original_964.npz',allow_pickle=False) as z:
            assert z['fundamental'].shape==(964,58)
            assert z['features'].shape==(964,58)
          print('S316 PASS real original rare family 58D source, labels never opened')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s316-original-fundamental58-IDMT-dataset2-964-native-audio-only
          path: model/S316/
          retention-days: 90
  five_historical_trained_S1_S4_coherent_sources:
    needs: original_fundamental_58D_on_same_S302_native_rows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original historical S1–S4 specialist scikit learn ABI
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 h5py==3.16.0
      - name: Restore exactly SHA-verified fundamental 58D from first job
        uses: actions/download-artifact@v4
        with:
          name: s316-original-fundamental58-IDMT-dataset2-964-native-audio-only
          path: model/S316
      - name: Restore original rare five trained specialists with entire immutable 59309 historical replay proof
        run: |
          gh run download 38234363815 \
            -n recovered-five-original-family-runtime-historical-and-GOAT-proof \
            -D model/S317runtime --repo ${{ github.repository }}
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('model/S317runtime/historical/report.json').read_text())
          assert x['status']=='HISTORICAL_PASS' and x['complete_historical_cohort']
          assert x['raw_policy_decisions_checked']==1101471
          assert x['five_champion_decisions_checked']==37465
          assert not x['predictive_models_fitted']
          assert Path('model/S317runtime/runtime/specialists.joblib').is_file()
          print('S317 all five historically checked source model signatures present')
          PY
      - name: Execute all five REAL trained S1/S2/S3/S4/coherent families on 964 untouched new native events
        run: |
          python -u -m scripts.recover_v273_missing_s45 \
            --runtime model/S317runtime/runtime \
            --historical-proof model/S317runtime/historical/report.json \
            --external model/S316/S316_fundamental58_dataset2_original_964.npz \
            --s5 model/S316/S316_original_S5_label_free_reference.npz \
            --out model/S317
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S317/report.json'))
          assert r['external_events']==964 and r['branches']==19
          assert len(r['family_ids'])==5
          assert not r['new_audio_labels_read'] and not r['S80_promoted']
          with np.load('model/S317/external_five_families.npz',allow_pickle=False) as z:
            assert z['predictions'].shape==(19,964,5)
          print('S317 PASS all five historically verified rare original S45 family models on new audio')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s317-original-five-rare-S45-IDMT-dataset2-964-PREXML
          path: model/S317/
          retention-days: 90
