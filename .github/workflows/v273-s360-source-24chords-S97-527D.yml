name: S360 24-WAV faithful-rebase S334 S335 genuine original S97 and 527D S5 features on frozen 967 Dataset1 chords PREXML
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s334_original_dataset1_S97_967.py'
      - 'scripts/s335_original_S5_527D_dataset1_967.py'
      - '.github/workflows/v273-s360-source-24chords-S97-527D.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s334-335-genuine-967-original-native-audio
  cancel-in-progress: true
jobs:
  original_967_native_audio_features:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore hashed generated S359 faithful ORIGINAL S80 source stage implementations
        run: |
          gh run download 38330878525 \
            -n s359-IDMT-original-20trained-S80-source-stages-rebased-to-24-WAV-PREXML \
            -D model/S359 --repo ${{ github.repository }}
          for file in model/S359/*.py; do cp "$file" "scripts/$(basename "$file" | sed 's/_477/_967/g')"; done
          test -s scripts/s334_original_dataset1_S97_967.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore 24 original V88 native IDMT chord WAV output SHA already frozen BEFORE XML
        run: |
          gh run download 38330563316 \
            -n s358-24-new-IDMT-dataset1-chords-original-V88-official-PREXML \
            -D model/S358 --repo ${{ github.repository }}
          gh run download 38330431853 \
            -n s357-original-IDMT-dataset1-24-new-chord-WAV-XML-NAMES-PREXML \
            -D model/S357 --repo ${{ github.repository }}
      - name: Build source-only original S97 acoustics on exact 967 original V88 events
        run: |
          python -u -m scripts.s334_original_dataset1_S97_967 \
            --s332 model/S358/S358_official_V88_dataset1_prospective_24_WAV_predictions.npz \
            --s332report model/S358/report.json \
            --s276 model/S357/report.json \
            --out model/S334
      - name: Build untouched original 527D S5 and PR16 46D source feature contract on same native event IDs
        run: |
          python -u -m scripts.s335_original_S5_527D_dataset1_967 \
            --s334 model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz \
            --s332 model/S358/S358_official_V88_dataset1_prospective_24_WAV_predictions.npz \
            --out model/S335
          python - <<'PY'
          import json,numpy as np
          a=json.load(open('model/S334/report.json'))
          b=json.load(open('model/S335/report.json'))
          assert a['events']==b['native_events']==967 and a['WAV_count']==b['WAV_count']==24
          assert not a['annotation_XML_MIDI_read'] and not b['independent_ExactK_measured']
          with np.load('model/S334/S334_IDMT_dataset1_original_S97_on_frozen_native_events.npz',allow_pickle=False) as z:
            assert z['summary58'].shape==(967,58)
            assert z['sequence42x49'].shape==(967,42,49)
          with np.load('model/S335/S335_IDMT_dataset1_true_original_S5_527D_input.npz',allow_pickle=False) as z:
            assert z['original_S5_input_owned527'].shape==(967,527)
          print('S334/S335 PASS original 24 chord WAV features, no XML')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s334-s335-24-IDMT-dataset1-chords-967-original-S97-527D-PREXML
          path: |
            model/S334/
            model/S335/
          retention-days: 90
