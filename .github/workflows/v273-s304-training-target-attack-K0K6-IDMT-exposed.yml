name: S304 historical 20ms new-onset K0-K6 XML diagnostic on already exposed IDMT Dataset3
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s304_training_consistent_new_attack_XML_K0K6_diagnostic.py'
      - '.github/workflows/v273-s304-training-target-attack-K0K6-IDMT-exposed.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s304-exposed-XML-training-semantics-verified
  cancel-in-progress: true
jobs:
  original_V9_training_target_compatible_attack_cardinality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Test historical GuitarSet K0 vs new attack assignment with original source code
        run: python -u -m scripts.s304_training_consistent_new_attack_XML_K0K6_diagnostic --self-test
      - name: Restore original prelabel selection / reference and already exposed labels (NO new songs or fitting)
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38319155819 \
            -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled \
            -D model/S277 --repo ${{ github.repository }}
          gh run download 38321142772 \
            -n s299-IDMT-dataset3-postfrozen-XML-note-matched-threeway-report-NOT-global-NOT-promotion \
            -D model/S299 --repo ${{ github.repository }}
      - name: Reproduce original historical 20ms grouped-note attacks K0-K6 on original V88 native positions
        run: |
          python -u -m scripts.s304_training_consistent_new_attack_XML_K0K6_diagnostic \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s299report model/S299/report.json \
            --s299pred model/S299/S299_XML_note_matched_only_506.npz \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s277report model/S277/report.json \
            --out model/S304
          python - <<'PY'
          import json
          r=json.load(open('model/S304/report.json'))
          assert r['cohort_events']==506 and r['recordings']==5
          assert sum(r['XML_derived_attacks_K0to6_histogram'])==506
          assert r['source_original_K_semantics_verified']
          assert r['corpus_already_exposed_to_S299']
          assert not r['XML_all_note_transcription_completeness_independently_proven']
          assert not r['true_negative_K0_exhaustiveness_independently_proven']
          assert not r['official_K0toK6_exactk_measured']
          assert not r['official_S80_promotion']
          print('S304 PASS historical onset-count K0 semantics, exposure and certification caveats preserved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s304-IDMT-exposed-XML-historical-attack-count-K0-K6-diagnostic-not-promotion
          path: model/S304/
          retention-days: 90
