name: S367 audit actual K3 regressions from frozen original S72 S79 S80 stage decisions
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s367_true_K3_source_vs_final_S80_regression_trace.py'
      - '.github/workflows/v273-s367-original-S72-S79-S80-K3-regression-roots.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s367-readonly-fixed-K3-regression-source
  cancel-in-progress: true
jobs:
  original_frozen_stage_trace_6_K3_regressions_15_K2_fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Restore untouched FIRST 12 chord XML labels, only SHA-frozen AFTER original complete S80 models
        run: |
          gh run download 38327717118 \
            -n s354-PROSPECTIVE-IDMT-dataset1-12chords-477-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/first-truth --repo ${{ github.repository }}
          gh run download 38327686633 \
            -n chords-477-S349-S353-three-frozen-original-S80-PREXML \
            -D model/first --repo ${{ github.repository }}
      - name: Restore untouched NEXT 24 chord XML labels, only SHA-frozen AFTER original complete S80 models
        run: |
          gh run download 38331684749 \
            -n s363-PROSPECTIVE-IDMT-dataset1-24chords-967-postfrozen-historical-plus-acoustic-not-promotion \
            -D model/next-truth --repo ${{ github.repository }}
          gh run download 38331662519 \
            -n s365-verified-existing-967-native-24chord-original-S80-SHA-PREXML \
            -D model/next --repo ${{ github.repository }}
      - name: Reconstruct ORIGINAL prelabel stage and true-K3 counterfactual action provenance, NO models refit
        run: |
          python -u -m scripts.s367_true_K3_source_vs_final_S80_regression_trace \
            --first-labels model/first-truth/S354_postfrozen_477_two_distinct_protocols.npz \
            --first-model model/first/S352_original/S352_full_original_S80_unseen_IDMT_477_frozen.npz \
            --second-labels model/next-truth/S363_postfrozen_967_two_distinct_protocols.npz \
            --second-model model/next/S352_original/S352_full_original_S80_unseen_IDMT_967_frozen.npz \
            --out model/S367
          python - <<'PY'
          import json
          r=json.load(open('model/S367/report.json'))
          assert r['pooled_K3_regressions']==6
          assert r['pooled_K2_corrections']==15
          assert r['pooled_K4_regressions']==1
          assert len(r['original_frozen_cohorts'])==2
          assert not r['no_postlabel_model_weights_or_gates_tuned'] is False
          assert r['cannot_validate_K3_fix_on_exposed_audio']
          assert r['official_reference_unchanged']
          print('S367 PASS actual original final 6 K3 regressions mechanistic S72/S79/S80 provenance, NO retraining')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s367-original-S72-S79-S80-6-K3-regressions-15-K2-fixes-unchanged-models
          path: model/S367/
          retention-days: 90
