name: S789 deep forensic data audits x6 on frozen NOTE sources
on:
  push:
    branches: [codex/note-s789-deep-data-audit]
    paths:
      - scripts/s789_deep_data_microscope.py
      - test/test_s789_deep_data_microscope.py
      - .github/workflows/note-s789-deep-data-audit.yml
      - series/S789/resume.md
      - series/S789/resultat.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and negative unit tests before data processing
        run: |
          python -m compileall -q scripts/s789_deep_data_microscope.py
          python -m unittest -v test.test_s789_deep_data_microscope
          python -m scripts.verify_series_reports --series S789
      - name: Fetch immutable S708 S781 S782 source artifacts
        run: |
          mkdir -p /tmp/s789/input/s708 /tmp/s789/input/s781 /tmp/s789/input/s782
          gh run download 39094682419 --repo Andriamarosoa/note \
            --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS \
            --dir /tmp/s789/input/s708
          gh run download 39256936602 --repo Andriamarosoa/note \
            --name S781_K5_K6_BY_COMPOSITION_AND_TEXTURE_AUDIT \
            --dir /tmp/s789/input/s781
          gh run download 39257378677 --repo Andriamarosoa/note \
            --name S782_MISSED_ONSET_SPECTRAL_TAXONOMY \
            --dir /tmp/s789/input/s782
          test -s /tmp/s789/input/s708/report.json
          test -s /tmp/s789/input/s708/dev_audit.json
          test -s /tmp/s789/input/s708/held_audit.json
          test -s /tmp/s789/input/s708/s708_selected.pt
          test -s /tmp/s789/input/s781/report.json
          test -s /tmp/s789/input/s782/report.json
          echo S789_INPUTS_FROZEN_OK
      - name: Save exact common inputs for independent auditors
        uses: actions/upload-artifact@v4
        with:
          name: S789_FROZEN_INPUTS
          path: /tmp/s789/input/
          retention-days: 45
          if-no-files-found: error
  audit:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    name: Deep ${{ matrix.role }} audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: S789_FROZEN_INPUTS
          path: /tmp/s789/input
      - name: Independently audit ${{ matrix.role }} findings and invariants
        run: |
          python -m scripts.s789_deep_data_microscope \
            --role ${{ matrix.role }} \
            --s708 /tmp/s789/input/s708 \
            --s781 /tmp/s789/input/s781 \
            --s782 /tmp/s789/input/s782 \
            --out /tmp/s789/out/role_${{ matrix.role }}.json
      - name: Preserve standalone forensic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S789_DEEP_${{ matrix.role }}
          path: /tmp/s789/out/role_${{ matrix.role }}.json
          retention-days: 45
          if-no-files-found: warn
  consensus:
    if: always()
    needs: [prepare, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S789_DEEP_*
          path: /tmp/s789/audits
          merge-multiple: true
      - name: Fail closed if any of six deep data roles missing
        run: |
          python -m scripts.s787_audit_consensus \
            --reports-dir /tmp/s789/audits \
            --out /tmp/s789/consensus/report.json
      - name: Archive each role and joint data audit consensus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S789_SIX_DEEP_DATA_AUDIT_CONSENSUS
          path: |
            /tmp/s789/audits/role_*.json
            /tmp/s789/consensus/report.json
          retention-days: 45
          if-no-files-found: warn
