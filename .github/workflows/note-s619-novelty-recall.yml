name: "S619 LIVE causal weak-onset novelty FN rescue"
on:
  push:
    branches: [codex/note-live-s619-novelty-onset-rescue]
    paths: ['.github/workflows/note-s619-novelty-recall.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal-fn-rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NOTE native inference requirements
        run: |
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<1.15" "onnxruntime>=1.17,<1.25" "threadpoolctl>=3"
      - name: Test completely causal onset specialist
        run: |
          python -m unittest -v test.test_s619_novelty_rescue test.test_s618_missed_attack_sweep
      - name: Cache 17 original GuitarSet/URMP development songs, no held-out test
        run: |
          python -m scripts.s615_seed_full_development --root data/S619_dev --dev-only
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.s615_prepare_multihop import prepare_one
          root=Path('data/S619_dev')
          specs=[s for s in json.loads((root/'protocol.json').read_text())['sources'] if s['split']=='dev']
          assert len(specs)==17
          for i,s in enumerate(specs):
              print(i,prepare_one(root,s,256),flush=True)
          PY
      - name: Reproduce true frozen hybrid and 18 weak-onset novelty rescue gates
        run: |
          python -m scripts.s619_compare_novelty_rescue \
            --root data/S619_dev \
            --out results/S619_novelty_FN_17dev.json
      - name: Audit real recovered notes and K3-K4 regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('results/S619_novelty_FN_17dev.json').read_text())
          assert report['status']=='DEV_ONLY_CAUSAL_WEAK_ONSET_NOVELTY_ABLATION_NO_PROMOTION'
          assert report['baseline']['TP']==1241 and report['baseline']['FP']==734
          assert report['dev_sources']==17 and len(report['candidates'])==18
          for r in report['candidates']:
              assert r['gain_TP']==r['recovered_old_FN']-r['lost_old_TP']
              print(json.dumps(dict(
                  mode=r['config']['novelty_mode'],
                  onset=r['config']['weak_onset_min'],
                  relative_gate=r['config']['relative_novelty_min'],
                  recovered_FN=r['recovered_old_FN'],
                  lost_old_TP=r['lost_old_TP'],
                  extra_FP=r['gain_FP'], F1=r['F1'],
                  K3=r['grouped_K_by_true_k'].get('3'),
                  K4=r['grouped_K_by_true_k'].get('4'),
              )),flush=True)
          print('BEST F1:',json.dumps(report['best_F1']))
          print('BEST RECALL:',json.dumps(report['best_recall']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s619-causal-onset-novelty-17dev
          path: results/S619_novelty_FN_17dev.json
          retention-days: 45
