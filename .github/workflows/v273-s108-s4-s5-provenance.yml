name: S108 compare original S4 versus S5 feature checkpoint schemas
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s108_s4_s5_checkpoint_provenance.py'
      - '.github/workflows/v273-s108-s4-s5-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Load pinned S4 and S5 checkpoints
        run: |
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 analysis/evidence/v273-open-k0-k6/series4/models analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/history
      - name: Audit checkpoint input dimensions and feature metadata
        run: python scripts/s108_s4_s5_checkpoint_provenance.py --root model/history/analysis/evidence/v273-open-k0-k6 --out model/s108/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s108-s4-s5-feature-provenance
          path: model/s108/report.json
          retention-days: 90
