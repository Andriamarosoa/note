name: S543 full-MIDI postfrozen recall ceiling and one missed good note dedup regression forensic
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s543_audit_source_5_new_composers_pitch_fn_v88_candidates_and_dedup_restrike.py
      - .github/workflows/v273-s543-prospective-new-music-v88-candidate-recall-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  explain_source_noteon_recall_ceiling_and_true_fast_note_restrike_regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install complete independent MIDI note onset and V88 one-to-one matcher
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test every genuine repeated same pitch must stay distinct in evaluation
        run: |
          python -m py_compile scripts/s543_audit_source_5_new_composers_pitch_fn_v88_candidates_and_dedup_restrike.py
          python -m scripts.s543_audit_source_5_new_composers_pitch_fn_v88_candidates_and_dedup_restrike --self-test
      - name: Restore old frozen original V88, new composer manifest and exact sealed predictions
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656509448 -n s538-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S538 --repo "${{ github.repository }}"
          gh run download 38656969947 -n s541-FROZEN-before-MIDI-5-original-MAESTRO-composers-S528-S533-S536-noteon-policies -D model/S541 --repo "${{ github.repository }}"
          gh run download 38657068577 -n s542-VALIDATED-5-new-composer-noteon-F1-genuine-postfrozen-piano-MIDI-and-restrikes -D model/S542 --repo "${{ github.repository }}"
      - name: True SHA-verified post-hoc diagnose lost true notes due to V88 temporal proposal vs pitch selection vs dedup
        run: |
          python -u -m scripts.s543_audit_source_5_new_composers_pitch_fn_v88_candidates_and_dedup_restrike \
            --manifest model/S537/report.json \
            --v88 model/S538/S538_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz \
            --v88-report model/S538/report.json \
            --freeze-report model/S541/report.json \
            --predictions model/S541/S541_FIVE_NEW_MAESTRO_ORIGINAL_REAL_WAV_NOTE_NAMES_ALL_POLICIES_PREMIDI.jsonl \
            --truth-report model/S542/report.json --out model/S543
          python - <<'PY'
          import json
          r=json.load(open('model/S543/report.json'))
          assert r['status']=='S543_NEW_FIVE_COMPOSER_ORIGINAL_V88_MISSING_NOTE_AND_DEDUP_FAILURE_FORENSICS'
          assert r['totals']['true_note_pitches']==754 and r['totals']['true_onsets']==518
          assert r['totals']['true_pitch_lost_on_dedup']==1
          assert len(r['per_recording'])==5
          assert r['analysis_AFTER_held_test_MIDI_is_POSTHOC_and_CAN_NOT_TUNE_TEST']
          assert r['no_promotion'] and r['original_source_S80_K_Live_and_weights_untouched']
          print('S543 PASS independent source V88 candidate recall ceiling and lost real note diagnosis')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s543-independent-five-new-composer-v88-temporal-vs-pitch-error-forensics
          path: model/S543/
          retention-days: 90
