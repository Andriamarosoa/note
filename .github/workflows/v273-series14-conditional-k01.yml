name: V27.3 series14 conditional K0 K1 regression loop
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series14-conditional-k01.yml'
      - 'scripts/loop_v273_conditional_k01.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v273-series14-conditional-k01
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Check thirty-gate contract and action restrictions
        run: python -m scripts.loop_v273_conditional_k01 --self-test
      - name: Retrieve four verified full-audio folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/feature-archives
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/feature-archives
          for fold in 0 1 2 4; do
            mkdir -p "model/full-audio/fold-$fold"
            tar -xf "model/feature-archives/v273-open-features-$fold.tar" -C "model/full-audio/fold-$fold"
          done
      - name: Retrieve series9 prediction parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37853130781 --repo "$GITHUB_REPOSITORY" --name v273-series9-posthoc-audit --dir model/series9-parent
      - name: Crossfit targeted risk classifiers and preserve all thirty policies
        run: >-
          python -m scripts.loop_v273_conditional_k01
          --features model/full-audio
          --series9 model/series9-parent/predictions.npz
          --output model/series14
      - name: Summarize all corrections and regressions
        run: cat model/series14/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series14-conditional-k01
          path: model/series14/
          retention-days: 90
