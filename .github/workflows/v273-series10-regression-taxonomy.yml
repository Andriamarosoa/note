name: V27.3 series10 full regression taxonomy
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series10-regression-taxonomy.yml'
      - 'scripts/audit_v273_series10_regressions.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Load full CI-verified series9 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37853130781 --repo "$GITHUB_REPOSITORY" --name v273-series9-posthoc-audit --dir model/series9-input
      - name: Audit all corrections and regressions K0-K6
        run: >-
          python -m scripts.audit_v273_series10_regressions
          --input model/series9-input/predictions.npz
          --output model/series10-audit
      - run: cat model/series10-audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series10-regression-taxonomy
          path: model/series10-audit/
          retention-days: 90
