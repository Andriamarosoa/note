name: S546 16 actual composer-component-disjoint training folds no composite artist leakage after genuine new source validation
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s546_train_8_source_folds_excluding_SHARED_COMPOSER_COMPONENTS.py
      - .github/workflows/v273-s546-shared-composer-exclusion-noteon-trained-models.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train_on_only_nonoverlapping_composers_component_holdout_eight_source_records:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original source-held forest and native MIDI note scoring
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Test protected old BP note-chord and eight-composer physics schemas
        run: |
          python -m py_compile scripts/s546_train_8_composer_49pitch_noteon_selected_plus_harmonic_experts.py
          python -m scripts.s546_train_8_source_folds_excluding_SHARED_COMPOSER_COMPONENTS --self-test
      - name: Restore three original development piano source and previous MIDI truth SHA
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
      - name: Restore five NEW now already independently evaluated MIDI composer recordings and acoustic prelabels
        run: |
          gh run download 38654030814 -n s537-predeclared-five-distinct-MAESTRO-composers-only-metadata-no-WAV-no-MIDI -D model/S537 --repo "${{ github.repository }}"
          gh run download 38656791368 -n s540-five-composers-original-V88-all-event-49x11-WAV-physical-pitch-features-preMIDI -D model/S540 --repo "${{ github.repository }}"
          gh run download 38657068577 -n s542-VALIDATED-5-new-composer-noteon-F1-genuine-postfrozen-piano-MIDI-and-restrikes -D model/S542 --repo "${{ github.repository }}"
      - name: Train 8 raw pitch and 8 harmonic-selected note heads on actual new MIDI plus old labels with composer-held inference
        run: |
          python -u -m scripts.s546_train_8_composer_49pitch_noteon_selected_plus_harmonic_experts \
            --old-manifest model/S469/report.json --new-manifest model/S537/report.json \
            --old-midi-report model/S471/report.json --new-midi-report model/S542/report.json \
            --old-features model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --old-feature-report model/S527/report.json \
            --new-features model/S540/S540_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --new-feature-report model/S540/report.json --out model/S546
          python - <<'PY'
          import json
          r=json.load(open('model/S546/report.json'))
          assert r['status']=='S546_8_COMPOSER_REAL_NOTE_IDENTITY_EXPERT_TRAINING_AND_RETRO_LOO'
          assert len(r['models'])==16 and len(r['per_original_recording'])==8
          assert len(r['policies'])==4
          assert r['S537_five_source_WAV_and_MIDI_ALREADYSCORED_in_S542']
          assert r['NOT_new_prospective_blind_generalization']
          assert r['shared_composer_collaboration_leakage_is_EXCLUDED']
          assert all(m['trained_on_other_source_recordings_only_with_disjoint_composer_components'] for m in r['models'])
          assert r['no_promotion'] and r['no_reference_promotion_or_live_K_change']
          print('S546 sixteen actual source-excluded musical named-pitch experts trained; all true note event F1 audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s546-sixteen-real-8-composer-held-pitch-models-acoustic-plus-harmonic-true-noteon
          path: model/S546/
          retention-days: 90
