name: S102 S5 upstream model contract and weight integrity
on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/s102_s5_upstream_checkpoint.py'
      - '.github/workflows/v273-s102-s5-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Restore exact historical S5 checkpoint bytes from pinned tag
        run: |
          mkdir -p model/historical
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 analysis/evidence/v273-open-k0-k6/series5/models | tar -x -C model/historical
      - run: python scripts/s102_s5_upstream_checkpoint.py --root model/historical/analysis/evidence/v273-open-k0-k6/series5/models --out model/s102/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s102-upstream-s5-provenance
          path: model/s102/report.json
