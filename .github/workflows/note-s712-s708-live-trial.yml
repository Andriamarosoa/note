name: S712 exact S708 model realtime microphone bridge parity and WAV smoke
on:
  push:
    branches: [codex/note-s712-s708-strict-live-trial]
    paths:
      - src/causal_note/s712_s708_live.py
      - scripts/live_strict_notes.py
      - test/test_s712_s708_live.py
      - .github/workflows/note-s712-s708-live-trial.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s712-s708-live-trial
  cancel-in-progress: true
jobs:
  source_causal_s708_microphone_adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Native NOTE dependencies and selected S708 CPU torch
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Tests of 288D causal features and transport block invariance
        run: |
          python -m compileall -q src/causal_note/s712_s708_live.py scripts/live_strict_notes.py test/test_s712_s708_live.py
          python -m unittest -v test.test_s712_s708_live test.test_s708_cardinality_selection
      - name: Retrieve exact S708 immutable checkpoint and selection (not guessed)
        run: |
          mkdir -p /tmp/s708_model
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s708_model
          test -s /tmp/s708_model/s708_selected.pt
          test -s /tmp/s708_model/report.json
          test -s /tmp/s708_model/selection_frozen.json
      - name: Verify original S708 SHA, frozen policy, and zero lookahead
        run: |
          python - <<'PY'
          from pathlib import Path
          from causal_note.s712_s708_live import load_s708_checkpoint
          model,policy,sha=load_s708_checkpoint(Path('/tmp/s708_model/s708_selected.pt'),Path('/tmp/s708_model/report.json'))
          print("S712 EXACT S708 CHECKPOINT",sha,policy)
          PY
      - name: S708 CLI help and deterministic zero-lookahead WAV smoke
        run: |
          mkdir -p /tmp/s708_smoke
          python - <<'PY'
          import numpy as np, wave
          from pathlib import Path
          sr=44100
          t=np.arange(sr//2,dtype=np.float64)/sr
          x=np.zeros(sr//2,np.float64)
          x[4000:]+=0.17*np.sin(2*np.pi*164.81*t[4000:])
          x[10000:]+=0.14*np.sin(2*np.pi*110.0*t[10000:])
          with wave.open('/tmp/s708_smoke/test.wav','wb') as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
              w.writeframes(np.round(x*32767).astype('<i2').tobytes())
          PY
          python -m scripts.live_strict_notes --help | grep -F -- '--s708-model'
          python -m scripts.live_strict_notes --wav /tmp/s708_smoke/test.wav --block-size 256 --hop-size 256 --s708-model /tmp/s708_model/s708_selected.pt --out /tmp/s708_smoke/s708_events.jsonl
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('/tmp/s708_smoke/s708_events.jsonl')
          for line in path.read_text().splitlines():
              row=json.loads(line)
              assert row['type'] in ('note_on','note_off')
              assert 40 <= row['pitch'] <= 88
              assert row['available_sample'] >= row['decision_sample']
              assert row['s708_shadow_trial']
          print('S712 VERIFIED WAV SMOKE',len(path.read_text().splitlines()),'events')
          PY
      - name: Keep CI report (no false microphone accuracy claims)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S712_S708_SOURCE_ONLY_LIVE_MIC_ADAPTER_SMOKE
          path: /tmp/s708_smoke/s708_events.jsonl
          if-no-files-found: warn
          retention-days: 30
