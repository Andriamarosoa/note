name: S404 YourMT3+ and midi-informed K-first onset/frame/harmonic architecture contract
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'src/causal_note/k_first_multihead_notes_s404.py'
      - '.github/workflows/v273-s404-K-first-multitask-architecture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s404-K-first-multihead-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assert_architecture_and_loss_without_training_or_reference_modification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU only for structural test
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Verify S404 feeds real K to encoder and masks unavailable harmonic training
        run: |
          python -m py_compile src/causal_note/k_first_multihead_notes_s404.py
          python -u src/causal_note/k_first_multihead_notes_s404.py
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('src/causal_note/k_first_multihead_notes_s404.py')
          code=p.read_text()
          assert 'self.k_embed(predicted_k)' in code
          assert 'self.time_encoder(x)' in code
          assert 'self.cross_attention(queries,memory,memory' in code
          assert 'self.onset_head' in code and 'self.frame_head' in code
          assert 'harmonic_valid' in code
          assert 'self.k_pitch(context)' in code
          print('S404 VERIFIED design, NO new source weights trained and S80 unchanged')
          PY
