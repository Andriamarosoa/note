name: S649 native S648 strict live block by block proof
on:
  push:
    branches: [codex/s648-causal-event-birth-head]
    paths:
      - src/causal_note/s649_birth_live_runtime.py
      - test/test_s649_birth_live_runtime.py
      - .github/workflows/v273-s649-strict-birth-live-parity.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test_original_model_stream_invariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original NOTE inference requirements
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compare true block stream and cached causal batch for all fixed policies
        run: |
          python -m unittest -v test.test_s649_birth_live_runtime test.test_s648_event_birth test.test_strict_live
