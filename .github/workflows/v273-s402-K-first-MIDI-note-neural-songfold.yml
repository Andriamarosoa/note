name: S402 K directly INPUT to MIDI note neural head - four song-disjoint folds
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s402_k_input_first_supervised_midi_pitch_network.py'
      - '.github/workflows/v273-s402-K-first-MIDI-note-neural-songfold.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s402-K-input-first-neural-head-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true_notes_MIDI_supervised_crossfit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural note scorer
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Prove K is AN INPUT to the note predictor before loading music
        run: |
          python -m py_compile scripts/s402_k_input_first_supervised_midi_pitch_network.py
          python -u -m scripts.s402_k_input_first_supervised_midi_pitch_network --self-test
      - name: Restore native GuitarSet 42x49 acoustic features and separate truth
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
      - name: Restore user's exact S80 S397 protected cardinality predictions
        run: |
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397artifact --repo ${{ github.repository }}
      - name: Restore frozen S399 original note predictions for paired same-K comparison
        run: |
          gh run download 38354784594 -n s399-s400-first-real-S80-exactK-constrained-MIDI-note-pitch-output-and-audit -D model/S399original --repo ${{ github.repository }}
          test -f model/S399original/S399/S399_S80_K5_GUARDED_MIDI_note_predictions_N59309.npz
      - name: Download original official GuitarSet note_midi JAMS annotations
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 2 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Crossfit 4 real K-conditioned neural note predictors on entirely different compositions
        run: |
          python -u -m scripts.s402_k_input_first_supervised_midi_pitch_network \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397artifact/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s399 model/S399original/S399/S399_S80_K5_GUARDED_MIDI_note_predictions_N59309.npz \
            --annotations data/GuitarSet/annotation.zip \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --out model/S402
          python - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('model/S402/report.json').read_text())
          assert a['status']=='S402_K_AS_DIRECT_PITCH_NETWORK_INPUT_SONG_CROSSFIT'
          assert a['S80_K_at_start_of_pitch_prediction']
          assert a['K_interacts_with_acoustic_pitch_features_BEFORE_MLP']
          assert a['target_K_for_note_training']=='S80 predicted K only, NEVER true K'
          assert a['number_new_pitch_networks']==4 and not a['note_head_promoted']
          assert all(x['composition_overlap']==0 for x in a['fold_proofs'])
          assert all(x['ablated_K_mean_abs_pitch_prob_delta']>0 for x in a['fold_proofs'])
          assert a['metrics']['poly_K2_6']['S399_chord_correct']==1292
          print('S402 K-INPUT EXPERIMENT VERIFIED. Poly net:',
                a['metrics']['poly_K2_6']['S402_net'],
                'F1:',a['metrics']['poly_K2_6']['S402_micro_F1'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s402-K-fed-to-MIDI-neural-input-composition-disjoint-4fold-DEVELOPMENT-NOPROMOTION
          path: model/S402/
          retention-days: 90
