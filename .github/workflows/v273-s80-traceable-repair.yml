name: V27.3 S80 traceable S73 repair (research only)

on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/audit_v273_s80_traceable_repair.py'
      - '.github/workflows/v273-s80-traceable-repair.yml'
      - 'analysis/README_V273_S80_TRACEABLE_REPAIR.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  s80:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen audit deps
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Download S72 (fixed, unmodified)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38155427761
          name: v273-s72-temporal-risk
          path: model/s72
      - name: Download PR16 36 policy heads and probabilities
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-summary
          path: model/pr16
      - name: Download S46 policy votes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891336823
          name: v273-series46-poly-class-compromises
          path: model/s46
      - name: Download verified acoustic features from original PR16 source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          pattern: v273-open-features-*
          path: model/features
      - name: Refit fold-excluded K1 critic and audit 59309 native rows
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile scripts/audit_v273_s80_traceable_repair.py
          python -m scripts.audit_v273_s80_traceable_repair \
            --s72 model/s72/predictions.npz \
            --pr16 model/pr16 \
            --s46 model/s46 \
            --features model/features \
            --output model/s80
      - name: Verify native K0..6 and no promotion
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/s80/report.json'))
          assert r['status']=='RESEARCH_ONLY_NOT_PROMOTED'
          with np.load('model/s80/predictions.npz',allow_pickle=False) as p:
              assert len(p['global_index'])==len(set(map(int,p['global_index'])))==59309
              assert int((p['true_K']>=2).sum())==7385
              for field,n_global,n_poly in [('s72_K',49238,3202),('s79_K',49244,3232),('s80_K',49281,3240)]:
                  hit=p[field]==p['true_K']
                  assert int(hit.sum())==n_global and int((hit&(p['true_K']>=2)).sum())==n_poly
          assert [r['s80']['by_fold'][str(i)]['net'] for i in (0,1,2,4)]==[4,22,7,10]
          assert [r['s80']['by_K'][str(i)]['net'] for i in range(7)]==[-3,8,34,4,0,0,0]
          assert r['actions_by_source']=={'K1_guard':67,'K0_head':46,'K2_head':61}
          print('S80 verified; experimental only, official reference unchanged.')
          PY
      - name: Research-only verdict
        run: |
          echo 'S80 +43 global/+38 poly on previously exposed development folds. Upstream non-nested, routes chosen after prior audits; no promotion.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s80-traceable-repair
          path: model/s80/
          retention-days: 90
