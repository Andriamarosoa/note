name: V27.3 S16 independent replay and evidence archive
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series16-verify.yml'
      - 'scripts/verify_v273_series16.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Retrieve S16 complete CI model and probabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37855705158 --repo "$GITHUB_REPOSITORY" --name v273-series16-k12-k23 --dir model/series16-original
      - name: Verify all 108 gates and four native corrected events
        run: >-
          python -m scripts.verify_v273_series16
          --input model/series16-original
          --output model/series16-replayed
      - name: Publish replay table
        run: cat model/series16-replayed/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series16-replayed
          path: model/series16-replayed/
          retention-days: 90
      - name: Archive full model and decision history for permanent reproducibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series16-research.tar.gz -C model series16-original series16-replayed
          (cd model/archive && sha256sum v273-series16-research.tar.gz > SHA256SUMS)
          gh release create "v273-series16-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series16-research.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 K1 K2 K3 S16 research ${GITHUB_RUN_ID}" \
            --notes "Research only: models, corrected events, all 108 decisions and independent arithmetic replay. No unseen validation, no production promotion."
