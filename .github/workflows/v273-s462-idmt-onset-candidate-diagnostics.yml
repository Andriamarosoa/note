name: S462 quantify IDMT original native event overproduction and XML onset matching
on:
  push:
    branches: [codex/s462-idmt-event-alignment-causal-audit]
    paths:
      - scripts/s462_explain_IDMT_native_onset_vs_XML_anchor_mismatch.py
      - .github/workflows/v273-s462-idmt-onset-candidate-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s462-IDMT-native-vs-XML-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_IDMT_onset_and_XML_bipartite_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original runtime scipy numerical package ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Test exact S451 20ms XML grouping and independent max one-to-one onset matching
        run: |
          python -m py_compile scripts/s462_explain_IDMT_native_onset_vs_XML_anchor_mismatch.py
          python -m scripts.s462_explain_IDMT_native_onset_vs_XML_anchor_mismatch --self-test
      - name: Download sealed audio-only five IDMT native V88 events and original S80 unmodified inference
        run: |
          gh run download 38318827219 -n s276-IDMT-central-directory-only-prospective-WAV-cohort -D model/S276 --repo ${{ github.repository }}
          gh run download 38319155819 -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled -D model/S277 --repo ${{ github.repository }}
          gh run download 38320939533 -n s294-s298-two-complete-frozen-S80-original-vs-S274-IDMT-dataset3-506-PREXML -D model/S294S298 --repo ${{ github.repository }}
          gh run download 38531001313 -n s451-original-S80-external-IDMT-true-musical-notes-paired-no-promotion -D model/S451 --repo ${{ github.repository }}
      - name: Inspect actual original five XML source groups and original V88 event density
        run: |
          python -u -m scripts.s462_explain_IDMT_native_onset_vs_XML_anchor_mismatch \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s277-report model/S277/report.json \
            --s297 model/S294S298/S297_original/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --s451-report model/S451/report.json \
            --out model/S462
          python - <<'PY'
          import json
          r=json.load(open('model/S462/report.json'))
          assert r['status']=='S462_IDMT_EXTERNAL_ORIGINAL_ONSET_XML_MATCHING_FORENSIC'
          assert r['original_native_event_count']==506 and r['original_predicted_S80_K0_count']==456
          assert r['original_s451_80ms_matched_count']==47
          assert r['original_s451_inrange_count']==45
          assert r['original_s451_inrange_S80_K_correct']==25
          assert r['no_audio_model_fitting_or_predictor_replay']
          assert r['unpaired_native_events_NOT_construed_as_true_K0']
          assert r['no_promotion']
          print('S462 AUDIT PASS native onset vs original XML population and source S80 invariants')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s462-original-IDMT-fiveWAV-506-vs-XML-onset-alignment-error-audit-no-promotion
          path: model/S462/
          retention-days: 90
