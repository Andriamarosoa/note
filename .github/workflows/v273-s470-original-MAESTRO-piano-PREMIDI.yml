name: S470 frozen real MAESTRO piano through original V88 and separate S466 birth head preMIDI
on:
  push:
    branches: [codex/s469-maestro-third-source-blind-audit]
    paths:
      - scripts/s470_MAESTRO_real_piano_native_original_V88_and_birth_PREMIDI.py
      - .github/workflows/v273-s470-original-MAESTRO-piano-PREMIDI.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s470-original-third-piano-V88-premidi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_V84_V88_plus_GuitarSet_birth_on_third_source_piano:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact historic model inference stack
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Verify historic PCM and schema without MIDI
        run: |
          python -m py_compile scripts/s470_MAESTRO_real_piano_native_original_V88_and_birth_PREMIDI.py
          python -m scripts.s470_MAESTRO_real_piano_native_original_V88_and_birth_PREMIDI --self-test
      - name: Restore immutable S469 official MAESTRO third-source metadata preregistration
        run: |
          gh run download 38558629021 \
            -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI \
            -D model/S469 --repo ${{ github.repository }}
          test -f model/S469/report.json
      - name: Restore original V84 V86 V87 V88 full source stack GitHub official release
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
            --repo ${{ github.repository }} \
            --pattern v273-rebuilt-proposal-sources.zip \
            --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
             Path('model/original-sources'),
             'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
             validate=validate_sources)
          PY
      - name: Restore unchanged official original freeze_local_combo neural weights
        run: |
          mkdir -p model/freeze-original model/freeze-download
          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo ${{ github.repository }} \
            --pattern v273-uniform-anchored-freeze-result.tgz \
            --dir model/freeze-download
          tar -xzf model/freeze-download/v273-uniform-anchored-freeze-result.tgz -C model/freeze-original
          test -s model/freeze-original/freeze_local_combo.weights.h5
      - name: Restore four GuitarSet-only trained binary new-note head checkpoints
        run: |
          gh run download 38552253544 \
            -n s466-GuitarSet-59k-composition-held-birth-continuation-Kblind-4-models-no-promotion \
            -D model/S466 --repo ${{ github.repository }}
          test -f model/S466/S466_birth_vs_nonbirth_fold3.joblib
      - name: Acquire selected 3 genuine MAESTRO audio files and freeze pretrained predictions BEFORE ANY MIDI
        run: |
          python -u -m scripts.s470_MAESTRO_real_piano_native_original_V88_and_birth_PREMIDI \
            --manifest model/S469/report.json \
            --source-dir model/original-sources \
            --weights model/freeze-original/freeze_local_combo.weights.h5 \
            --birthmodels model/S466 \
            --birthreport model/S466/report.json \
            --out model/S470
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S470/report.json'))
          assert r['status']=='S470_MAESTRO_V3_REAL_AUDIO_ORIGINAL_PRETRAINED_V88_PLUS_S466_PREMIDI'
          assert r['three_original_piano_recordings']==3
          assert r['original_V88_event_count']>0
          assert r['prelabel_predictions_frozen'] and not r['paired_MIDI_annotation_files_OPENED']
          assert r['original_complete_S80_NOT_REPLAYED'] and r['no_full_S80_ExactK_claim']
          assert r['no_promotion']
          with np.load('model/S470/S470_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz') as z:
            assert z['original_GuitarSet_birth4_prob'].shape==(4,r['original_V88_event_count'])
            assert z['original_V88_probabilities'].shape==(r['original_V88_event_count'],7)
          print('S470 verified actual independent piano audio and source original V88 output frozen PRE-MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI
          path: |
            model/S470/report.json
            model/S470/S470_MAESTRO_ORIGINAL_V88_K_BIRTH_FROZEN_PREMIDI.npz
          retention-days: 90
