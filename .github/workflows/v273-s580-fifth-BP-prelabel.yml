name: S580 prospective five new composer Basic Pitch prelabel MIDI notes from sealed WAV only
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s580_fifth_basicpitch_actual_WAV_PREMIDI.py
      - .github/workflows/v273-s580-fifth-BP-prelabel.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  five_new_composers_original_SPOTIFY_BP_note_output:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen independent Basic Pitch model and inference ABI
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Check exact E3-G3-B3 MIDI pitch names without MIDI
        run: |
          python -m py_compile scripts/s580_fifth_basicpitch_actual_WAV_PREMIDI.py
          python -m scripts.s580_fifth_basicpitch_actual_WAV_PREMIDI --self-test
      - name: Verify preregistration and original source V88 five-composer WAV proof
        run: |
          gh run download 38674975248 -n s577-fifth-novel-five-original-maestro-train-composers-after28-exposed-ONLY-METADATA -D model/S577 --repo "${{ github.repository }}"
          gh run download 38675197873 -n s579-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S579 --repo "${{ github.repository }}"
      - name: Run fixed unmodified Basic Pitch note predictor on the same SHA-frozen five new piano WAVs
        run: |
          python -u -m scripts.s580_fifth_basicpitch_actual_WAV_PREMIDI \
            --manifest model/S577/report.json --s579 model/S579/report.json --out model/S580
          python - <<'PY'
          import json
          r=json.load(open('model/S580/report.json'))
          assert r['status']=='S580_PRETRAINED_BASIC_PITCH_NOTE_EVENTS_ON_THIRD_SOURCE_MAESTRO_PREMIDI'
          assert r['prediction_windows_piano']==5
          assert r['original_WAV_content_SHA_verified']
          assert not r['original_MAESTRO_MIDI_ANNOTATIONS_OPENED']
          assert r['S577_new_composers_before_WAV_MIDI']
          assert r['no_promotion']
          print('S580 PASS five independent composer source Basic Pitch NOTE_NAME predictions frozen BEFORE MIDI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s580-next-five-S577-BasicPitch-original-pitch-names-PREMIDI
          path: model/S580/
          retention-days: 90
