name: S836 NOTE PCM256 causal sharp cache — paired no-regression
on:
  push:
    branches: [codex/note-s836-live-sharp-cache256]
    paths:
      - 'src/causal_note/s836_incremental_sharp256.py'
      - 'src/causal_note/s834_s809_native256_audio.py'
      - 'scripts/s834_s809_native256_fit80_replay.py'
      - 'scripts/s836_sharp_cpu_benchmark.py'
      - 'test/test_s836_incremental_sharp256.py'
      - 'series/S836/**'
      - '.github/workflows/note-s836-live-sharp-cache256.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s836-causal-256
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  strict_parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install same NOTE immutable inference runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Audit forbidden cross-axis edits against unchanged S835
        run: |
          git fetch origin codex/note-s835-best-of-six-axes-preserved --depth=1
          git diff --name-only FETCH_HEAD HEAD > /tmp/s836_changed_paths.txt
          python - <<'PY'
          from pathlib import Path
          touched=set(Path('/tmp/s836_changed_paths.txt').read_text().splitlines())
          allowed={
            'src/causal_note/s836_incremental_sharp256.py',
            'src/causal_note/s834_s809_native256_audio.py',
            'scripts/s834_s809_native256_fit80_replay.py',
            'scripts/s836_sharp_cpu_benchmark.py',
            'test/test_s836_incremental_sharp256.py',
            'series/S836/resume.md','series/S836/resultat.md',
            'series/S836/audit_ci_failure.md',
            '.github/workflows/note-s836-live-sharp-cache256.yml'}
          assert touched and touched<=allowed,touched-allowed
          print('S836_FIVE_OTHER_AXIS_HEADS_AND_MIDI_FROZEN')
          PY
      - name: Assert exact 96D sharp parity, every PCM256 step and private six axis invariance
        run: |
          python -m compileall -q src/causal_note/s836_incremental_sharp256.py scripts/s836_sharp_cpu_benchmark.py
          python -m unittest -v test.test_s836_incremental_sharp256 test.test_s834_s809_native256_axes test.test_s835_best_six_registry
          python -m scripts.verify_series_reports --series S836
      - name: Measure paired synthetic FFT p50/p95/p99 same-audio; no musical score claims
        run: |
          python -m scripts.s836_sharp_cpu_benchmark | tee /tmp/s836_cpu_synthetic.log
          grep -q '"strict_feature_parity": true' /tmp/s836_cpu_synthetic.log
      - name: Preserve component audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S836_CAUSAL_SHARP_CPU_PARITY_SYNTHETIC
          path: |
            /tmp/s836_cpu_synthetic.log
            /tmp/s836_changed_paths.txt
          retention-days: 45
          if-no-files-found: warn

  signed_real_five:
    runs-on: ubuntu-24.04
    needs: strict_parity
    if: contains(github.event.head_commit.message, '[run-real5]') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Frozen native NOTE and PyTorch
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore signed S708 model and S800 FIT80 source without CAL/HELD/TEST
        run: |
          mkdir -p /tmp/s836/s708 /tmp/s836/manifest /tmp/s836/traces
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s836/s708
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s836/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s836/traces
          echo "$(dirname "$(find /tmp/s836/s708 -name s708_selected.pt -type f -print -quit)")" > /tmp/s836/s708_dir
          find /tmp/s836/manifest -name report.json -type f -print -quit > /tmp/s836/manifest_path
          echo "$(dirname "$(find /tmp/s836/traces -name fit_000.json -type f -print -quit)")" > /tmp/s836/traces_dir
          test -s "$(cat /tmp/s836/s708_dir)/s708_selected.pt"
          test -s "$(cat /tmp/s836/s708_dir)/report.json"
          test -s "$(cat /tmp/s836/manifest_path)"
      - name: Verify original GuitarSet WAV SHA256 before replay
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          cfg=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          item=cfg['guitar_archives']['GuitarSet_audio']
          dst=Path('/tmp/s836/GuitarSet_audio.zip')
          with urllib.request.urlopen(item['url'],timeout=180) as src,dst.open('wb') as target:
              for chunk in iter(lambda:src.read(4*1024*1024),b''):
                  target.write(chunk)
          assert dst.stat().st_size==item['size']
          digest=hashlib.sha256()
          with dst.open('rb') as f:
              for chunk in iter(lambda:f.read(4*1024*1024),b''):
                  digest.update(chunk)
          assert digest.hexdigest()==item['sha256']
          print('S836_ORIGINAL_PCM_SHA256_VALID')
          PY
      - name: Real GuitarSet same-5-track source - baseline S834 reference
        run: |
          python -m scripts.s834_s809_native256_fit80_replay \
            --audio-zip /tmp/s836/GuitarSet_audio.zip \
            --traces "$(cat /tmp/s836/traces_dir)" \
            --manifest-path "$(cat /tmp/s836/manifest_path)" \
            --source-checkpoint "$(cat /tmp/s836/s708_dir)/s708_selected.pt" \
            --source-report "$(cat /tmp/s836/s708_dir)/report.json" \
            --native-model model/live/strict_note/NOTE_strict_live.npz \
            --sharp-engine reference \
            --out /tmp/s836/baseline --tracks-per-composition 1
      - name: Same 5 signed recordings - optional S836 incremental cache
        run: |
          python -m scripts.s834_s809_native256_fit80_replay \
            --audio-zip /tmp/s836/GuitarSet_audio.zip \
            --traces "$(cat /tmp/s836/traces_dir)" \
            --manifest-path "$(cat /tmp/s836/manifest_path)" \
            --source-checkpoint "$(cat /tmp/s836/s708_dir)/s708_selected.pt" \
            --source-report "$(cat /tmp/s836/s708_dir)/report.json" \
            --native-model model/live/strict_note/NOTE_strict_live.npz \
            --sharp-engine incremental \
            --out /tmp/s836/candidate --tracks-per-composition 1
      - name: Controlled same-audio S836 replay with per-frame SHA audit disabled
        run: |
          python -m scripts.s834_s809_native256_fit80_replay \
            --audio-zip /tmp/s836/GuitarSet_audio.zip \
            --traces "$(cat /tmp/s836/traces_dir)" \
            --manifest-path "$(cat /tmp/s836/manifest_path)" \
            --source-checkpoint "$(cat /tmp/s836/s708_dir)/s708_selected.pt" \
            --source-report "$(cat /tmp/s836/s708_dir)/report.json" \
            --native-model model/live/strict_note/NOTE_strict_live.npz \
            --sharp-engine incremental --no-audit-digests \
            --out /tmp/s836/candidate_clean --tracks-per-composition 1
      - name: Paired six-axis exact scores AND individual track event counters; report CPU regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('/tmp/s836/baseline/report.json').read_text())
          candidate=json.loads(Path('/tmp/s836/candidate/report.json').read_text())
          clean=json.loads(Path('/tmp/s836/candidate_clean/report.json').read_text())
          assert original['s836_audit_digests'] and candidate['s836_audit_digests']
          assert clean['s836_audit_digests'] is False
          for r,mode in ((original,'reference'),(candidate,'incremental')):
              assert r['s836_sharp_engine']==mode and r['complete'] and len(r['tracks'])==5
              assert r['decision_hop_samples']==256 and r['acoustic_feature_hop_samples']==256
              assert all(t['causal_s708_model_calls']==t['frames'] for t in r['tracks'])
              assert r['source_signed_midi_unchanged'] and not r['official_midi_modified']
              assert not r['promoted'] and r['counterfactual_pairs_passed']==r['counterfactual_pairs_tested']
          for key in ('frames','source_counts','source_scores','axis_metrics',
                      'six_axis_shadow_scores','counterfactual_pairs_passed','counterfactual_pairs_tested'):
              assert original[key]==candidate[key], 'S836 changed '+key
          for key in ('frames','source_counts','source_scores','axis_metrics','six_axis_shadow_scores'):
              assert clean[key]==candidate[key], 'S836 instrumentation changed '+key
          cost=[]
          for a,b,c in zip(original['tracks'],candidate['tracks'],clean['tracks']):
              assert a['name']==b['name'] and a['composition']==b['composition']
              for key in ('frames','six_axis_standalone','source_counts','real_pcm_sha256',
                          's836_input_288_sha256','s836_spectral_96_sha256',
                          's836_axis_decision_sha256'):
                  assert a[key]==b[key],a['name']+' differs: '+key
              for key in ('name','composition','frames','six_axis_standalone','source_counts','real_pcm_sha256'):
                  assert b[key]==c[key],'S836 digest-free changed '+key
              assert c['s836_input_288_sha256'] is None
              assert c['s836_axis_decision_sha256'] is None
              p0=a['runtime_cpu_diagnostics'];p1=b['runtime_cpu_diagnostics']
              pclean=c['runtime_cpu_diagnostics']
              old=p0['p95_full_chunk_cpu_ms'];new=p1['p95_full_chunk_cpu_ms']
              cost.append(dict(track=a['name'],baseline_p95_ms=old,cache_p95_ms=new,
                               delta_p95_ms=new-old,
                               baseline_p99_ms=p0['p99_full_chunk_cpu_ms'],
                               cache_p99_ms=p1['p99_full_chunk_cpu_ms'],
                               clean_cache_p95_ms=pclean['p95_full_chunk_cpu_ms'],
                               clean_cache_p99_ms=pclean['p99_full_chunk_cpu_ms']))
          proof=dict(provenance='signed real GuitarSet 5 compositions x 1 recording',
                     strict_six_axis_metric_and_per_track_count_parity=True,
                     every_sample_source_288d_sha_identical=True,
                     every_sample_spectral_96d_sha_identical=True,
                     every_sample_six_axis_decision_sha_identical=True,
                     cache_p95_all_below_5805us=all(x['cache_p95_ms']<5.805 for x in cost),
                     cache_p99_all_below_5805us=all(x['cache_p99_ms']<5.805 for x in cost),
                     clean_cache_p99_all_below_5805us=all(x['clean_cache_p99_ms']<5.805 for x in cost),
                     digest_free_same_music_scores=True,
                     note='A/B ordered tests cannot isolate thermal or machine drift; compare only as association',
                     official_midi_untouched=True,promoted=False,cpu_per_track=cost,
                     hardware_p99_windows_verified=False,
                     full_fit80_80_tracks_not_yet_executed=True)
          Path('/tmp/s836/paired_real5_verdict.json').write_text(json.dumps(proof,indent=2))
          print('S836_REAL5_PAIRED_SIX_AXIS_PARITY',json.dumps(proof))
          PY
      - name: Preserve both signed reports and causal intervention postmortem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S836_REAL5_SIX_AXIS_PAIR_SHADOW_NO_PROMOTION
          path: |
            /tmp/s836/baseline/report.json
            /tmp/s836/candidate/report.json
            /tmp/s836/candidate_clean/report.json
            /tmp/s836/paired_real5_verdict.json
          retention-days: 45
          if-no-files-found: warn
