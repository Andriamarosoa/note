name: V27.3 Targeted Transplant Combination Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-targeted-transplant-combinations-launch.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-targeted-transplant-combinations-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4
      - name: Restore frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/uniform model/weighted
          gh release download v273-window-pair-36351028493 --repo "${{ github.repository }}" --pattern native-window-bundle.zip --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          gh release download v273-loss-weighting-37208199201 --repo "${{ github.repository }}" --pattern v273-loss-weighting-uniform.tgz --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform
          gh release download v273-loss-weighting-37217693737 --repo "${{ github.repository }}" --pattern v273-loss-weighting-targeted_k23_half_k4_quarter.tgz --dir model/download
          tar -xzf model/download/v273-loss-weighting-targeted_k23_half_k4_quarter.tgz -C model/weighted
      - name: Run combination audit
        run: |
          python -B scripts/audit_v273_targeted_transplant_combinations.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-weights model/uniform/uniform.weights.h5             --weighted-weights model/weighted/targeted_k23_half_k4_quarter.weights.h5             --uniform-predictions model/uniform/predictions.npz             --weighted-predictions model/weighted/predictions.npz             --output model/result
      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease             --title "V27.3 targeted transplant combination audit" --notes-file model/result/report.md
          gh release upload "$TAG" model/result/report.json model/result/report.md --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-targeted-transplant-combinations
          path: model/result/
          retention-days: 90
