name: V8.5 transition verifier pilot

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v85-transition-verifier.yml"
      - "scripts/train_v85_transition_verifier.py"
      - "src/causal_note/v84_onset_predictor.py"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.4 control source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-v84
          gh run download 33571604757 --repo "$GITHUB_REPOSITORY" --name v84-independent-ab --dir model/source-v84
          test -f model/source-v84/v84-pilot/control.epoch-01.keras

      - name: Download frozen train-only FP audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-audit
          gh run download 33551039906 --repo "$GITHUB_REPOSITORY" --name v81-train-fp-harmonic-audit --dir model/source-audit
          test -f model/source-audit/v81-train-fp-harmonic-audit.json

      - name: Compile V8.5 pilot
        env:
          PYTHONPATH: src
        run: python -m py_compile src/causal_note/v84_onset_predictor.py scripts/train_v85_transition_verifier.py

      - name: Train frozen-base transition verifier and evaluate locked12
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v85_transition_verifier.py \
            --base-model model/source-v84/v84-pilot/control.epoch-01.keras \
            --train-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --output-dir model/v85-transition-pilot \
            --train-members 30 --epochs 20 \
            2>&1 | tee model/v85-transition-pilot.log

      - name: Verify isolation and report exact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path('model/v85-transition-pilot/report.json').read_text())
          a=d['architecture']; c=d['configuration']; locked=d['locked12']
          assert a['base_trainable'] is False
          assert a['offset_stream_executed_during_verifier_training'] is False
          assert a['offset_weights_modified'] is False
          assert a['runtime_inputs_use_annotations'] is False
          assert c['gate_threshold_selected_on_locked_validation'] is False
          assert len(d['data']['locked_validation_members']) == 12
          assert set(d['data']['source_train_members']).isdisjoint(d['data']['locked_validation_members'])

          b=locked['baseline']
          assert abs(b['global']['f1']-0.44056071363553617) < 5e-4, b['global']
          assert abs(b['solo']['f1']-0.28139904610492844) < 5e-4, b['solo']
          assert abs(b['comp']['f1']-0.5750755794423915) < 5e-4, b['comp']

          print('verifier_parameters', a['verifier_parameters'])
          print('verification_delay_ms', a['verification_delay_ms'])
          print('epochs_ran', c['epochs_ran'])
          print('holdout_gate', d['holdout_calibration']['best']['threshold'])
          print('holdout_macro_f1', d['holdout_calibration']['best']['macro_f1'])
          print('locked_candidate_auc', json.dumps(locked['candidate_auc_tp_high'], sort_keys=True))
          for regime in ('global','solo','comp'):
              base=b[regime]; gated=locked['gated'][regime]
              print(regime,
                    'base_f1', f"{base['f1']:.6f}",
                    'gated_f1', f"{gated['f1']:.6f}",
                    'delta', f"{gated['f1']-base['f1']:+.6f}",
                    'base_pred_ref', f"{base['prediction_reference_ratio']:.6f}",
                    'gated_pred_ref', f"{gated['prediction_reference_ratio']:.6f}",
                    'P', f"{gated['precision']:.6f}",
                    'R', f"{gated['recall']:.6f}")
          PY

      - name: Upload V8.5 pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v85-transition-verifier-pilot
          path: |
            model/v85-transition-pilot/report.json
            model/v85-transition-pilot/v85-transition-verifier.weights.h5
            model/v85-transition-pilot.log
          if-no-files-found: warn
          retention-days: 14
