name: S536 ten adaptive physical reattack and harmonic dedup NoteOn MIDI loops
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s536_onset_burst_adaptive_restrike_dedup_loops.py
      - .github/workflows/v273-s536-physical-onset-restrike-protected-dedup.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  audit_replayed_notes_vs_separable_physical_restrikes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore numeric and real MIDI matching
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Test synthetic real rapid reattack and protected original exact note chords
        run: |
          python -m py_compile scripts/s536_onset_burst_adaptive_restrike_dedup_loops.py
          python -m scripts.s536_onset_burst_adaptive_restrike_dedup_loops --self-test
      - name: Restore original genuine MAESTRO piano MIDI with prelabel trained note probabilities
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
          gh run download 38652938992 -n s533-nine-fundamental-harmonic-temporal-repeat-noteon-policy-audits -D model/S533 --repo "${{ github.repository }}"
      - name: Independently score 10 fixed reattack-aware policies and source S533 original duplicate baseline
        run: |
          python -u -m scripts.s536_onset_burst_adaptive_restrike_dedup_loops \
            --manifest model/S469/report.json --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json \
            --s533-report model/S533/report.json --out model/S536
          python - <<'PY'
          import json
          r=json.load(open('model/S536/report.json'))
          assert r['status']=='S536_TRUE_REARTICULATION_AWARE_NOTEON_DEDUP_HARMONIC_LOOPS'
          assert len(r['tests'])==10 and r['original_80ms_dedup_F1_reproduced']
          assert r['BP_original_birth_notes_preserved']
          assert r['original_S80_ExactK_Live_unchanged'] and r['no_promotion']
          print('S536 all ten true MIDI onsets and physical reattack checks PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s536-ten-acoustic-attack-reentry-aware-harmonic-duplicate-noteon-audits
          path: model/S536/
          retention-days: 90
