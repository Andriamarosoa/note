name: S265 original recurrent S19 S20 S24 S25 S27 trained on all 59309 GuitarSet events
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s265_original_S45_five_recurrent_guitarset_59309.py'
      - '.github/workflows/v273-s265-guitarset-five-recurrent-S45.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s265-original-recurrent-GuitarSet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_s45_recurrent_five:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download unchanged real trained 19 historical S19 S20 S25 fold checkpoints
        run: |
          gh run download 37858017067 -n v273-series19-recurrent -D model/S19
          gh run download 37858383973 -n v273-series20-residual -D model/S20
          gh run download 37862417522 -n v273-series25-trained-Bfirst -D model/S25
      - name: Download all original GuitarSet S18 fourfold decisions plus true S97 audio
        run: |
          gh run watch 38312084676 --exit-status --interval 15
          gh run download 38311814895 -n s260-guitarset-59309-true-original-S5-S18-fourfold-133-checkpoints -D model/S260
          gh run download 38312084676 -n s262-guitarset-59309-native-real-S97-source -D model/S262source
      - name: Reexecute 5 authentic recurrent source families for each of 19 pieces
        run: |
          python -u -m scripts.s265_original_S45_five_recurrent_guitarset_59309 \
            --s18 model/S260/S260_original_S5_to_S18_true_V88_native_GUITARSET_59309.npz \
            --s97 model/S262source/original_GuitarSet_59309_S97.npz \
            --s19 model/S19 --s20 model/S20 --s25 model/S25 --out model/S265
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S265/report.json'))
          assert r['branches']==19 and r['fold_branch_counts']==[5,4,5,5]
          with np.load('model/S265/five_rebased_recurrent_S19_S20_S24_S25_S27.npz') as z:
            assert z['proposals_K'].shape==(19,59309,5)
          print('S265 PASS five original recurrent S45 families on all 59k historical GuitarSet events')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s265-guitarset-five-recurrent-S45-59309
          path: model/S265/
