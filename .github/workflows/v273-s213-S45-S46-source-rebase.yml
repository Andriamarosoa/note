name: S213 compare rebased authentic S45 sources and 19 x 193 S46
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s213_rebased_s45_s46_bridge.py'
      - '.github/workflows/v273-s213-S45-S46-source-rebase.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s213-source-rebase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical S45 original regression runtime
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore all 304 original S45 Ridge checkpoint states
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891039201
          name: v273-series45-specialized-risk-heads
          path: model/S45
      - name: Restore S173 11 original-weight but old-adapted family predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38206160849
          name: v273-s173-real-trained-S35-adapted-11-source-S45-risks-NO-S80
          path: model/S173
      - name: Restore original S29-fed S35 on true reconstructed S18
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38238673938
          name: s210-original-S29-original-S35-19-branches-experimental
          path: model/S210
      - name: Restore five re-based original S45 family predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38241942489
          name: s212-five-authentic-S45-source-families-recovered-S5-S18
          path: model/S212
      - name: Restore immutable original S211 experimental S45-S46 comparison
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38238956956
          name: s211-original-S29-S35-19branch-S45-S46-comparison-experimental
          path: model/S211
      - name: Run all 19 branches through original 304 Ridge critics and all 193 S46 policies
        run: |
          set -euo pipefail
          ELEVEN="$(find model/S173 -name S173_S35_adapted_11_family_GOAT.npz -print -quit)"
          S210="$(find model/S210 -name original_s29_to_s35_GOAT.npz -print -quit)"
          S212="$(find model/S212 -name five_rebased_S11_S12_S38_S40_S41.npz -print -quit)"
          test -s "$ELEVEN" && test -s "$S210" && test -s "$S212"
          test -d model/S45/models && test -s model/S211/report.json
          python -m scripts.s213_rebased_s45_s46_bridge \
            --five analysis/evidence/v273-recovered-five-families/external_five_families.npz \
            --eleven "$ELEVEN" --s210 "$S210" --s212 "$S212" \
            --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz \
            --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz \
            --models model/S45/models \
            --catalog analysis/v273_s45_original_champion_catalog.json \
            --previous211 model/S211 --out model/S213
      - name: Enforce unchanged other S45 sources and strict promotion guard
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          r=json.load(open('model/S213/report.json'))
          assert r['original_branches']==19 and r['families']==16
          assert r['S45_original_ridge_checkpoints']==304 and r['S46_original_policy_count']==193
          assert len(r['newly_rebased_families'])==5 and len(r['still_adapted_families'])==5
          assert r['original_S29_S35_connected']
          assert not r['S80_promoted'] and not r['complete_historical_S45_equivalence']
          assert not r['labels_read'] and not r['predictive_models_retrained']
          assert len(list(Path('model/S213').glob('branch*_fold*/s46/predictions.npz')))==19
          print('S213 PASS five true source replays, five adapted recurrent sources explicitly retained, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s213-rebased-five-s45-all19-s46-comparison-no-promotion
          path: model/S213/
          retention-days: 90
