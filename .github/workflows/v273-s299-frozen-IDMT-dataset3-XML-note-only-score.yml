name: S299 postfrozen first annotated IDMT dataset3 paired S80 exact-K1to6 only, NO promotion
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s299_after_S298_predeclared_XML_scoring_dataset3.py'
      - '.github/workflows/v273-s299-frozen-IDMT-dataset3-XML-note-only-score.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s299-postfreeze-dataset3-XML-note-only
  cancel-in-progress: true
jobs:
  original_SHA_locked_postfreeze_matching_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XML note-only numerical no-training dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Run PRELABEL original 20ms 80ms 30ms note matcher, K0 prohibited and paired ledger synthetic selftest
        run: python -m scripts.s299_after_S298_predeclared_XML_scoring_dataset3 --self-test
      - name: Require S298 full S80 frozen predictions no labels read
        run: gh run watch 38320939533 --repo ${{ github.repository }} --exit-status --interval 15
      - name: Restore unmodified prelabel S298 paired baseline and complete two S80 prediction snapshots
        run: |
          gh run download 38320939533 \
            -n s294-s298-two-complete-frozen-S80-original-vs-S274-IDMT-dataset3-506-PREXML \
            -D model/S298frozen --repo ${{ github.repository }}
      - name: Restore the original prospective five-WAV selection frozen before any XML read
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
      - name: Restore the exact original pretrained official baseline on all 506 native V88 events
        run: |
          gh run download 38319155819 \
            -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled \
            -D model/S277 --repo ${{ github.repository }}
      - name: Verify three SHA-locked model predictions BEFORE reading only five paired XML annotations
        run: |
          python -u -m scripts.s299_after_S298_predeclared_XML_scoring_dataset3 \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s298 model/S298frozen/S298/prelabel_comparison.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --old model/S298frozen/S297_original/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --new model/S298frozen/S297_twofold/S297_full_original_S80_unseen_IDMT_506_frozen.npz \
            --out model/S299
          python - <<'PY'
          import json
          r=json.load(open('model/S299/report.json'))
          assert r['event_population']==506 and r['selected_WAVs']==5
          assert r['unmatched_event_K0_assignment_forbidden']
          assert r['full_Global_ExactK_K0to6_measured'] is False
          assert r['dataset3_unique_named_composition_families']<=4
          assert not r['S80_promoted']
          for x in r['original_paired_comparisons'].values():
            assert x['matched_K1to6']['n']==r['matched_true_K1to6_events']
            assert x['matched_true_poly_K2to6']['n']==r['matched_true_poly_K2to6_events']
          print('S299 annotated original three-way Exact-K matched-note-only report, promotion withheld')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s299-IDMT-dataset3-postfrozen-XML-note-matched-threeway-report-NOT-global-NOT-promotion
          path: model/S299/
          retention-days: 90
