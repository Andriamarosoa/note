name: S706 sharp spectral temporal heads and style-diverse joint loops
on:
  push:
    branches: [codex/note-s706-sharp-temporal-loops]
    paths:
      - src/causal_note/s706_sharp_spectra.py
      - scripts/s706_train_sharp_temporal_loops.py
      - test/test_s706_sharp_spectra.py
      - .github/workflows/note-s706-sharp-temporal-loops.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s706-sharp-temporal-loops
  cancel-in-progress: false
jobs:
  temporal_loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      S706_ARGS: --work /tmp/s706_work --out /tmp/s706 --offset-checkpoint /tmp/s706_s675/s675_hazard.joblib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned causal inference and training dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify temporal prefixes, incremental parity and causal event metrics
        run: |
          python -m compileall -q src/causal_note/s706_sharp_spectra.py scripts/s706_train_sharp_temporal_loops.py
          python -m unittest -v test.test_s706_sharp_spectra test.test_s705_temporal_heads test.test_s704_joint_loops
      - name: Retrieve verified S675 baseline
        run: |
          mkdir -p /tmp/s706_s675
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s706_s675
      - name: Prepare separated FIT and CAL with causal acoustic histories
        run: python -m scripts.s706_train_sharp_temporal_loops prepare $S706_ARGS
      - name: Learning loop 1 - epochs 1 to 10
        run: python -m scripts.s706_train_sharp_temporal_loops train $S706_ARGS --epoch 10
      - name: Calibration loop 1 - 96 joint selections
        run: python -m scripts.s706_train_sharp_temporal_loops calibrate $S706_ARGS --epoch 10
      - name: Publish first calibration checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: S706_CAL_LOOP_10
          path: |
            /tmp/s706/round_10.json
            /tmp/s706/training_to_10.json
          retention-days: 60
      - name: Learning loop 2 - epochs 11 to 20
        run: python -m scripts.s706_train_sharp_temporal_loops train $S706_ARGS --epoch 20
      - name: Calibration loop 2 - 96 joint selections
        run: python -m scripts.s706_train_sharp_temporal_loops calibrate $S706_ARGS --epoch 20
      - name: Publish second calibration checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: S706_CAL_LOOP_20
          path: |
            /tmp/s706/round_20.json
            /tmp/s706/training_to_20.json
          retention-days: 60
      - name: Learning loop 3 - epochs 21 to 40
        run: python -m scripts.s706_train_sharp_temporal_loops train $S706_ARGS --epoch 40
      - name: Calibration loop 3 and final freeze
        run: python -m scripts.s706_train_sharp_temporal_loops calibrate $S706_ARGS --epoch 40
      - name: Evaluate frozen model on HELD and diagnostic DEV once
        run: python -m scripts.s706_train_sharp_temporal_loops evaluate $S706_ARGS
      - name: Preserve checkpoints, all loops and exact emissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S706_SHARP_SPECTRAL_TEMPORAL_CAUSAL_LOOPS
          path: /tmp/s706/
          if-no-files-found: warn
          retention-days: 60
