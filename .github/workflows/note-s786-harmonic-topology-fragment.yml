name: S786 causal harmonic topology and dynamic fragment selection
on:
  push:
    branches: [codex/note-s786-harmonic-topology-fragment-experts]
    paths:
      - scripts/s786_harmonic_topology_fragment_experts.py
      - test/test_s786_harmonic_topology_fragment_experts.py
      - .github/workflows/note-s786-harmonic-topology-fragment.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train_k_tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test 200D pitch topology and per-fragment causal head switch
        run: |
          python -m compileall -q scripts/s786_harmonic_topology_fragment_experts.py
          python -m unittest -v test.test_s786_harmonic_topology_fragment_experts
      - name: Check schema contract before expensive FIT80 processing
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/s786_harmonic_topology_fragment_experts.py').read_text()
          assert 'schema="S786_CAUSAL_PITCH_TOPOLOGY_FRAGMENT_EXPERTS"' in s
          assert 'by_composition=by_composition(cal_rows,"trial")' in s
          assert 'DIM=200' in s
          assert 'selection_micro_regression_limit=.002' in s
          print('S786_SCHEMA_PREFLIGHT_OK')
          PY
      - name: Restore signed S708 and S707
        run: |
          mkdir -p /tmp/s786/s708 /tmp/s786/s707
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s786/s708
          gh run download 39059008484 --repo Andriamarosoa/note --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s786/s707
          test -s /tmp/s786/s708/report.json
          test -s /tmp/s786/s708/s708_selected.pt
          test -s /tmp/s786/s707/s675_hazard.joblib
      - name: FIT80 five-composition harmonic-lattice experts and CAL32 frozen diagnostic
        run: |
          python -m scripts.s786_harmonic_topology_fragment_experts \
            --s708-dir /tmp/s786/s708 \
            --offset-checkpoint /tmp/s786/s707/s675_hazard.joblib \
            --out /tmp/s786/report
      - name: Verify no live or MIDI promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s786/report/report.json'))
          assert r['complete'] and r['fit_recordings_done']==80 and r['cal_recordings_done']==32
          assert r['schema']=='S786_CAUSAL_PITCH_TOPOLOGY_FRAGMENT_EXPERTS'
          assert r['decision_clock_samples']==1024
          assert not r['promoted'] and not r['LIVE_changed'] and not r['final_MIDI_changed']
          assert not r['TEST_opened'] and not r['HELD_opened']
          assert r['topological_dim']==200
          assert r['no_CAL_training_or_selection']
          assert not r['ONSET_OFFSET_changed']
          assert len(r['FIT']['candidates'])==6
          assert len(r['FIT']['baseline_by_composition'])==5
          assert r['FIT']['selected'] in r['FIT']['eligible'] or r['FIT']['selected'] is None
          assert set(r['CAL']['by_composition'])=={'BN2','Jazz2'}
          assert sum(r['CAL']['confusion_k5_k6']['6'])==r['CAL']['frozen']['per_k'][6]['n']
          assert sum(r['CAL']['confusion_k5_k6']['5'])==r['CAL']['frozen']['per_k'][5]['n']
          print('S786_FIT_SELECTED',r['FIT']['selected'])
          print('S786_CAL_INDEPENDENT_K',r['CAL']['frozen']['exact_accuracy'])
          PY
      - name: Keep full FIT and CAL 7x7 confusion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S786_HARMONIC_TOPOLOGY_DYNAMIC_FRAGMENT_FIT80_CAL32
          path: /tmp/s786/report/report.json
          retention-days: 45
          if-no-files-found: warn
