name: S157 original trained S8 and exact S9 rule on GOAT with adapted S5 parents
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s157_original_s8_s9_GOAT.py'
      - 'scripts/loop_v273_learned_risk.py'
      - '.github/workflows/v273-s157-original-S8-S9.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s157-original-S8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learned_original_S8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Assert original S8 file identical to original Git commit
        run: |
          git fetch --depth=1 origin 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 || true
          python - <<'PY'
          import subprocess
          path='scripts/loop_v273_learned_risk.py'
          assert subprocess.check_output(['git','show','854ada718ac9bf1556f00c96b8e1aa90402d6ab3:'+path])==open(path,'rb').read()
          PY
      - run: |
          python -m scripts.loop_v273_learned_risk --self-test
          python -m scripts.s157_original_s8_s9_GOAT --self-test
      - name: Original trained 28D S8 learned gate checkpoint archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37851172129
          name: v273-series7-learned-risk
          path: model/S8
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Original fit S8 -> S9 decoder, with explicit S5 global/poly adapter, NO labels
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135"
          python -u -m scripts.s157_original_s8_s9_GOAT \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s8 model/S8 --out model/S157
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S157/report.json'))
          assert r['real_new_audio_events']==57
          assert r['original_trained_S8_models_executed']>=10
          assert not r['historically_equivalent_to_original_S9']
          assert not r['GOAT_MIDI_read'] and not r['promoted']
          with np.load('model/S157/s8_s9_original_trained_veto_GOAT_adapted_sources.npz',allow_pickle=False) as z:
              assert len(z['S9_original_formula_K'])==57
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s157-original-S8-learned-checkpoints-exact-S9-rule-GOAT-no-MIDI
          path: model/S157/
          retention-days: 90
