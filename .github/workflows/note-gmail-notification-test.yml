name: NOTE Gmail notification smoke test
on:
  push:
    branches:
      - codex/note-github-gmail-notification-test
    paths:
      - .github/workflows/note-gmail-notification-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print harmless notification probe
        run: |
          echo "NOTE GitHub -> Gmail notification smoke test"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow run ID: ${{ github.run_id }}"
          echo "Expected result: success"
          echo "No project data, model or reference has been changed."
      - name: Test successful completion
        run: |
          test "success" = "success"
