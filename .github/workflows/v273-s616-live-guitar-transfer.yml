name: S616 frozen cross-development GuitarSet transfer
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s616_live_guitar_transfer.py
      - .github/workflows/v273-s616-live-guitar-transfer.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original_guitar_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native S614 original runtime and audio packages
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install scipy==1.14.1
      - name: Run unchanged original S614 tests
        run: python -m unittest -v test.test_s616_live_guard test.test_strict_live
      - name: Test five frozen selectors on all GuitarSet 04 development audio
        run: python -m scripts.s616_live_guitar_transfer --out /tmp/S616_Guitar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S616-frozen-original-GuitarSet-dev
          path: /tmp/S616_Guitar/
          if-no-files-found: warn
          retention-days: 60
