name: S301 adversarial K0-K6 unknown-label bounds on sealed IDMT 506 events
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - scripts/s301_adversarial_unknown_K0K6_bounds_506.py
      - .github/workflows/v273-s301-adversarial-K0-K6-bounds-IDMT.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s301-no-new-truth-reread-506
  cancel-in-progress: true
jobs:
  independent_unknown_K0_to_K6_worst_case_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Exhaustive synthetic truth-unknown K0-K6 selftest
        run: python -u -m scripts.s301_adversarial_unknown_K0K6_bounds_506 --self-test
      - name: Download first SHA-locked postfreeze Dataset3 S299 labels and frozen candidates (no XML read)
        run: |
          gh run download 38321142772 \
            -n s299-IDMT-dataset3-postfrozen-XML-note-matched-threeway-report-NOT-global-NOT-promotion \
            -D model/S299 --repo ${{ github.repository }}
      - name: Prove conservative delta interval across ALL 506 native original events
        run: |
          python -u -m scripts.s301_adversarial_unknown_K0K6_bounds_506 \
            --s299 model/S299/report.json \
            --pred model/S299/S299_XML_note_matched_only_506.npz \
            --out model/S301
          python - <<'PY'
          import json
          j=json.load(open('model/S301/report.json'))
          x=j['audited_result']
          assert x['population']==506 and x['truth_known']==47 and x['truth_unknown']==459
          assert x['known_fixes']==4 and x['known_regressions']==1
          assert x['unknown_changed']==2
          assert x['worst_case_full_population_net']==1 and x['best_case_full_population_net']==5
          assert x['definite_full_population_sign_positive']
          assert not x['true_full_population_ExactK_percentage_measured']
          assert not j['official_S80_promotion_allowed']
          print('S301 PASS positive paired change bound does not assert official global Exact-K')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s301-original-S80-506-unmatched-K0K6-adversarial-bounds-not-promotion
          path: model/S301/
          retention-days: 90
