name: S628 verify S627 joint strictly causal streaming adapter
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s628_joint_live.py
      - test/test_s628_joint_live.py
      - .github/workflows/v273-s628-joint-runtime-parity.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native NOTE real-time dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Confirm original NOTE event parity and strictly past-only audio
        run: |
          python -m unittest -v test.test_s628_joint_live test.test_s627_joint_heads test.test_strict_live
