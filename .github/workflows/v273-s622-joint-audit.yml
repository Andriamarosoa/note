name: S622 group OOF learned attack plus event filter
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s622_joint_native_onset_and_event.py
      - .github/workflows/v273-s622-joint-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install NOTE original runtime
        run: python -m pip install -r requirements-live-strict.txt
      - uses: actions/download-artifact@v4
        with:
          name: S618-native-learned-attack-head-URMP-train-dev
          run-id: 38784914444
          github-token: ${{ github.token }}
          path: /tmp/S618
      - name: Test combination with five held compositions
        run: |
          python -m scripts.s622_joint_native_onset_and_event --model /tmp/S618/S618_URMP_train_only_attack_head.joblib --out /tmp/S622
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S622-native-double-head-combo-dev-only
          path: /tmp/S622
          if-no-files-found: warn
          retention-days: 60
