name: V27.3 S30 four-regression corroboration loop
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series30-corroboration.yml'
      - 'scripts/audit_v273_s30_selection_corroboration.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic acoustic source and learned corroboration libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit-test head disagreement features and all fixed corroboration choices
        run: python -m scripts.audit_v273_s30_selection_corroboration --self-test
      - name: Retrieve original source acoustic and harmonic folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/acoustic-tars
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/acoustic-tars
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/acoustic-tars/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Retrieve unchanged S18 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Retrieve S29 dynamic action predictions and paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37865173636 --repo "$GITHUB_REPOSITORY" --name v273-series29-stepwise-scheduler --dir model/S29
      - name: Retrieve source A-first and B-first independently piece-held model outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37858383973 --repo "$GITHUB_REPOSITORY" --name v273-series20-residual --dir model/S20
          gh run download 37862417522 --repo "$GITHUB_REPOSITORY" --name v273-series25-trained-Bfirst --dir model/S25
      - name: Cross-audit all new corrections and old predictions lost
        run: >-
          python -m scripts.audit_v273_s30_selection_corroboration
          --features model/features
          --s18 model/S18/predictions.npz
          --s29 model/S29/predictions.npz
          --routes model/S29/routes.npz
          --s20 model/S20/probabilities.npz
          --s25 model/S25/probabilities.npz
          --output model/S30
      - name: Show all 26 policy outcomes including losses
        run: cat model/S30/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series30-corroboration
          path: model/S30/
          retention-days: 90
