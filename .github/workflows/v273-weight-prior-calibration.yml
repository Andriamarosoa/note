name: V27.3 Weighted Prior Calibration

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-weight-prior-calibration-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-weight-prior-calibration
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-weight-prior-calibration-${{ github.run_id }}

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate calibration contract
        run: |
          python -m py_compile scripts/calibrate_v273_weight_prior.py
          python - <<'PY'
          import numpy as np
          from scripts.train_v273_loss_weighting_ab import class_weight_table
          toy=np.array([0,0,0,1,1,2,2,3,4,5,6],dtype=np.int32)
          t=class_weight_table('targeted_k23_half_k4_quarter',toy)
          assert np.all(t>0) and np.isfinite(t).all()
          print({'base_weight_table_example':t.tolist()})
          PY

      - name: Restore frozen bundle and outer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/best model/uniform
          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-loss-weighting-37217693737 \
            --repo "${{ github.repository }}" \
            --pattern v273-loss-weighting-targeted_k23_half_k4_quarter.tgz \
            --dir model/download
          tar -xzf model/download/v273-loss-weighting-targeted_k23_half_k4_quarter.tgz -C model/best

          gh release download v273-loss-weighting-37208199201 \
            --repo "${{ github.repository }}" \
            --pattern v273-loss-weighting-uniform.tgz \
            --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform

          test -f model/bundle/bundle.json
          test -f model/best/report.json
          test -f model/best/predictions.npz
          test -f model/uniform/report.json
          test -f model/uniform/predictions.npz

      - name: Calibrate on inner fold and evaluate frozen outer
        run: |
          python -B scripts/calibrate_v273_weight_prior.py \
            --bundle model/bundle \
            --config analysis/v273-native-paired-config.json \
            --best-outer model/best \
            --uniform-outer model/uniform \
            --output model/result

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "V27.3 weighted prior calibration" \
            --notes-file model/result/report.md
          gh release upload "$TAG" \
            model/result/report.json \
            model/result/report.md \
            model/result/outer-calibrated-predictions.npz \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-weight-prior-calibration
          path: model/result/
          retention-days: 90
