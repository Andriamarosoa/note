name: V8.1 train FP harmonic audit

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v81-train-fp-harmonic-audit.yml"
      - "scripts/audit_v81_train_fp_harmonics.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.1 epoch-03 model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/v81-pilot
          gh run download 33536348915 \
            --repo "$GITHUB_REPOSITORY" \
            --name v81-pilot \
            --dir model/v81-pilot
          test -f model/v81-pilot/causal-boundaries-v81-pilot.epoch-03.keras

      - name: Compile diagnostic
        env:
          PYTHONPATH: src
        run: python -m py_compile scripts/audit_v81_train_fp_harmonics.py

      - name: Audit real V8.1 train false positives
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          mkdir -p model
          python -B scripts/audit_v81_train_fp_harmonics.py \
            --model model/v81-pilot/causal-boundaries-v81-pilot.epoch-03.keras \
            --threshold 0.40 \
            --target-fp 4000 \
            --min-tracks 24 \
            --max-tracks 64 \
            --control-stride 256 \
            --max-control-rms-delta-db 3.0 \
            --output model/v81-train-fp-harmonic-audit.json \
            2>&1 | tee model/v81-train-fp-harmonic-audit.log

      - name: Print decision metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("model/v81-train-fp-harmonic-audit.json").read_text())
          fp = data["false_positive_onsets"]
          controls = data["matched_controls"]
          print("scope", data["scope"])
          print("FP global", fp["global"])
          print("FP proxy distribution", fp["v82_proxy_distribution"])
          print("controls global", controls["global"])
          print("controls proxy distribution", controls["v82_proxy_distribution"])
          print("match rate", controls["match_rate"])
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-train-fp-harmonic-audit
          path: |
            model/v81-train-fp-harmonic-audit.json
            model/v81-train-fp-harmonic-audit.log
          if-no-files-found: warn
          retention-days: 14
