name: V8.2c controlled continuation A/B

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v82c-continuation-ab.yml"
      - "scripts/train_v82c_ab.py"
      - "test/test_v82c_ab.py"
      - "src/causal_note/v82b_replay.py"
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.1 epoch-03 source and baseline sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-v81
          gh run download 33536348915 \
            --repo "$GITHUB_REPOSITORY" \
            --name v81-pilot \
            --dir model/source-v81
          test -f model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras
          test -f model/source-v81/v81-pilot-epoch-03-sweep.json

      - name: Download frozen V8.1 train-FP audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-audit
          gh run download 33551039906 \
            --repo "$GITHUB_REPOSITORY" \
            --name v81-train-fp-harmonic-audit \
            --dir model/source-audit
          test -f model/source-audit/v81-train-fp-harmonic-audit.json

      - name: Test A/B invariants and compile trainer
        env:
          PYTHONPATH: src
        run: |
          python -m unittest test.test_v82c_ab -v
          python -m py_compile scripts/train_v82c_ab.py

      - name: Smoke controlled continuation path
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v82c_ab.py \
            --source-model model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras \
            --replay-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --filters 32 \
            --learning-rate 0.0001 \
            --smoke \
            --output-dir model/v82c-smoke \
            2>&1 | tee model/v82c-smoke.log

      - name: Train control and replay from identical V8.1 epoch-03 weights
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v82c_ab.py \
            --source-model model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras \
            --replay-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --epochs 3 \
            --filters 32 \
            --train-examples 800 \
            --validation-examples 200 \
            --learning-rate 0.0001 \
            --replay-fraction 0.25 \
            --max-replay-per-track 16 \
            --output-dir model/v82c-pilot \
            2>&1 | tee model/v82c-pilot-train.log

      - name: Verify controlled-experiment manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("model/v82c-pilot/manifest.json").read_text())
          cfg = data["configuration"]
          source = data["source"]
          assert cfg["steps_per_epoch"] == 100
          assert cfg["batch_size"] == 8
          assert cfg["learning_rate"] == 0.0001
          assert cfg["per_head_weight_mass_matched"] is True
          assert cfg["offset_replay_masking"] is False
          assert cfg["backbone_frozen"] is False
          assert source["optimizer_state_restored"] is False
          assert len(source["stream_model_file_sha256"]) == 64
          assert len(source["stream_weights_sha256"]) == 64
          assert len(source["replay_audit_sha256"]) == 64
          assert len(data["epochs"]) == 3
          for epoch in data["epochs"]:
              assert epoch["replay_summary"]["positions"] == 200
              assert epoch["replay_summary"]["max_per_track"] <= 16
              keys = {(row["member"], row["sample"]) for row in epoch["replay_points"]}
              assert len(keys) == 200
              for head, report in epoch["mass_matching"].items():
                  assert abs(report["control_mass"] - report["replay_matched_mass"]) < max(1e-4, abs(report["control_mass"]) * 1e-5), (head, report)
          print(json.dumps({
              "source": source,
              "configuration": cfg,
              "epochs": [
                  {
                      "epoch": row["epoch"],
                      "replay_summary": row["replay_summary"],
                      "control_counts": row["control_supervised_counts"],
                      "replay_counts": row["replay_supervised_counts"],
                      "mass_matching": row["mass_matching"],
                  }
                  for row in data["epochs"]
              ],
          }, indent=2))
          PY

      - name: Sweep both arms on same locked validation subset
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          for arm in control replay; do
            for epoch in 01 02 03; do
              python -B scripts/sweep_v8_thresholds.py \
                --model "model/v82c-pilot/${arm}.epoch-${epoch}.keras" \
                --limit-tracks 12 \
                --thresholds 0.01 0.02 0.05 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 0.95 \
                --output "model/v82c-${arm}-epoch-${epoch}-sweep.json" \
                > "model/v82c-${arm}-epoch-${epoch}-sweep.log"
            done
          done

      - name: Compare source, control, and replay operating points
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def metrics(payload):
              agg = payload["aggregates"]
              onset = agg["global"]["onset"]
              offset = agg["global"]["offset"]
              solo = agg["solo"]["onset"]
              comp = agg["comp"]["onset"]
              return {
                  "onset": {k: onset[k] for k in ("precision", "recall", "f1")},
                  "offset": {k: offset[k] for k in ("precision", "recall", "f1")},
                  "solo_onset": {k: solo[k] for k in ("precision", "recall", "f1")},
                  "comp_onset": {k: comp[k] for k in ("precision", "recall", "f1")},
                  "onset_predictions": onset.get("prediction_count", onset.get("prediction")),
                  "offset_predictions": offset.get("prediction_count", offset.get("prediction")),
              }

          def summarize(path):
              data = json.loads(Path(path).read_text())
              fixed = data["sweep"]["0.400000"]
              candidates = []
              for threshold, payload in data["sweep"].items():
                  g = payload["aggregates"]["global"]
                  score = g["onset"]["f1"] + g["offset"]["f1"]
                  candidates.append((score, -float(threshold), threshold, payload))
              _, _, best_t, best = max(candidates)
              return {
                  "fixed_0_40": metrics(fixed),
                  "best_combined_threshold": best_t,
                  "best_combined": metrics(best),
                  "runtime": data["runtime"],
              }

          report = {
              "schema_version": 1,
              "source_v81_epoch_03": summarize("model/source-v81/v81-pilot-epoch-03-sweep.json"),
              "control": {},
              "replay": {},
          }
          for arm in ("control", "replay"):
              for epoch in (1, 2, 3):
                  report[arm][str(epoch)] = summarize(
                      f"model/v82c-{arm}-epoch-{epoch:02d}-sweep.json"
                  )

          print("arm epoch mode threshold onset_P onset_R onset_F1 offset_P offset_R offset_F1 solo_P solo_R solo_F1")
          source = report["source_v81_epoch_03"]
          m = source["fixed_0_40"]
          print("source 3 fixed 0.400000", *(f'{m[kind][key]:.6f}' for kind, key in (
              ("onset", "precision"), ("onset", "recall"), ("onset", "f1"),
              ("offset", "precision"), ("offset", "recall"), ("offset", "f1"),
              ("solo_onset", "precision"), ("solo_onset", "recall"), ("solo_onset", "f1"),
          )))
          for arm in ("control", "replay"):
              for epoch in (1, 2, 3):
                  row = report[arm][str(epoch)]
                  for mode, threshold, m in (
                      ("fixed", "0.400000", row["fixed_0_40"]),
                      ("best", row["best_combined_threshold"], row["best_combined"]),
                  ):
                      print(arm, epoch, mode, threshold, *(f'{m[kind][key]:.6f}' for kind, key in (
                          ("onset", "precision"), ("onset", "recall"), ("onset", "f1"),
                          ("offset", "precision"), ("offset", "recall"), ("offset", "f1"),
                          ("solo_onset", "precision"), ("solo_onset", "recall"), ("solo_onset", "f1"),
                      )))

          Path("model/v82c-ab-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload V8.2c A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v82c-continuation-ab
          path: |
            model/v82c-smoke.log
            model/v82c-pilot-train.log
            model/v82c-pilot/manifest.json
            model/v82c-pilot/control.keras
            model/v82c-pilot/control.epoch-*.keras
            model/v82c-pilot/replay.keras
            model/v82c-pilot/replay.epoch-*.keras
            model/v82c-*-epoch-*-sweep.log
            model/v82c-*-epoch-*-sweep.json
            model/v82c-ab-summary.json
          if-no-files-found: warn
          retention-days: 7
