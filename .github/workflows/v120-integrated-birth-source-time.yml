name: V12 integrated birth source-time outer-clean

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v120_integrated_birth_source_time.py'
      - 'scripts/summarize_v120_integrated_birth_source_time.py'
      - '.github/workflows/v120-integrated-birth-source-time.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'

jobs:
  fold:
    name: V12 outer fold ${{ matrix.fold }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}

      - name: Compile fold trainer
        env:
          PYTHONPATH: .:src
        run: python -m py_compile scripts/train_v120_integrated_birth_source_time.py

      - name: Train and evaluate outer-clean V12 fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "model/v120-fold-${{ matrix.fold }}"
          python -B scripts/train_v120_integrated_birth_source_time.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --outer-fold "${{ matrix.fold }}" \
            --output-dir "model/v120-fold-${{ matrix.fold }}" \
            2>&1 | tee "model/v120-fold-${{ matrix.fold }}/train.log"

      - name: Verify fold isolation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fold='${{ matrix.fold }}'
          p=Path(f'model/v120-fold-{fold}/report-fold-{fold}.json')
          r=json.loads(p.read_text())
          q=r['protocol']
          assert q['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert q['outer_fold_used_for_training'] is False
          assert q['outer_fold_used_for_epoch_selection'] is False
          assert q['runtime_inputs_use_annotations'] is False
          assert q['birth_threshold_tuned'] is False
          assert q['birth_threshold'] == 0.5
          assert q['multiplicity_loss_receives_k0_weight'] is False
          assert q['tail_losses_receive_k0_weight'] is False
          assert q['positive_pb_loss_receives_k0_weight'] is False
          print('fold', fold,
                'epochs', r['data']['selected_epochs'],
                'v104', r['strata']['aggregate']['v104']['metrics']['global']['f1'],
                'v120', r['strata']['aggregate']['v120']['metrics']['global']['f1'])
          PY

      - name: Upload V12 fold
        uses: actions/upload-artifact@v4
        with:
          name: v120-integrated-fold-${{ matrix.fold }}
          path: model/v120-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Summarize V12 outer-clean
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download V12 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v120-integrated-fold-*
          path: model/v120-folds
          merge-multiple: false

      - name: Compile summarizer
        run: python -m py_compile scripts/summarize_v120_integrated_birth_source_time.py

      - name: Summarize five outer folds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v120-summary
          python -B scripts/summarize_v120_integrated_birth_source_time.py \
            --input-dir model/v120-folds \
            --output-dir model/v120-summary \
            2>&1 | tee model/v120-summary/summary.log

      - name: Verify clean aggregate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v120-summary/report.json').read_text())
          p=r['protocol']
          assert p['five_outer_composition_folds'] is True
          assert p['every_row_evaluated_once_outer_clean'] is True
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['v120_expert_predictions_as_inputs'] is False
          assert p['birth_threshold_tuned'] is False
          print('clusters', r['data']['clusters'])
          print('global v104', r['strata']['aggregate']['v104']['metrics']['global']['f1'])
          print('global v120', r['strata']['aggregate']['v120']['metrics']['global']['f1'])
          print('rock-comp delta', r['comparison']['v120_minus_v104_player00_rock_comp_f1'])
          print('poly delta', r['comparison']['v120_minus_v104_poly_exact'])
          print('promotion', r['comparison']['promotion_candidate'])
          PY

      - name: Upload V12 summary
        uses: actions/upload-artifact@v4
        with:
          name: v120-integrated-birth-source-time-summary
          path: model/v120-summary
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
