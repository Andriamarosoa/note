name: V27.3 S19 verify neural A-B-A weights and archive
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series19-verify.yml'
      - 'scripts/verify_v273_aba_recurrent.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve S19 fitted recurrent weights and 59k multi-pass predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37858017067 --repo "$GITHUB_REPOSITORY" --name v273-series19-recurrent --dir model/series19-original
      - name: Recover original label-free acoustic features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio
          for fold in 0 1 2 4; do
            mkdir -p "model/full-audio/fold-$fold"
            tar -xf "model/audio/v273-open-features-$fold.tar" -C "model/full-audio/fold-$fold"
          done
      - name: Retrieve exact native S18 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/series18
      - name: Independently re-infer from all 19 trained recurrent checkpoints
        run: >-
          python -m scripts.verify_v273_aba_recurrent
          --features model/full-audio
          --s18 model/series18/predictions.npz
          --input model/series19-original
          --output model/series19-verified
      - name: Publish independently recomputed model outputs
        run: cat model/series19-verified/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series19-verified
          path: model/series19-verified/
          retention-days: 90
      - name: Permanently preserve fitted weights, B messages and full audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series19-recurrent-research.tar.gz -C model series19-original series19-verified
          (cd model/archive && sha256sum v273-series19-recurrent-research.tar.gz > SHA256SUMS)
          gh release create "v273-series19-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series19-recurrent-research.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 recurrent A-B-A feedback research ${GITHUB_RUN_ID}" \
            --notes "19 fully fitted recurrent A/B checkpoints, per-pass messages/probabilities, no-B control, full per-K regression audit and independent numeric replay. Experimental, no independent unseen validation or model promotion."
