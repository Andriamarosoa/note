name: S655 native S614 original to S654 specialist strict live streaming parity
on:
  push:
    branches: [codex/s654-learned-pitch-risk-selector]
    paths:
      - src/causal_note/s655_specialist_live_runtime.py
      - test/test_s655_specialist_live_runtime.py
      - .github/workflows/v273-s655-specialist-live-streaming-parity.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original_s614_true_pcm_live_equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original NOTE inference dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Test strict PCM per-hop true reference, accept/refuse and future prefix
        run: |
          python -m compileall -q src/causal_note/s655_specialist_live_runtime.py
          python -m unittest -v test.test_s655_specialist_live_runtime test.test_s654_pitch_risk_selector
