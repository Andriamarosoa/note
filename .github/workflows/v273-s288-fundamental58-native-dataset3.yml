name: S288 true fundamental-58 original rare-family source on 506 IDMT dataset3 prelabel
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s288_original_fundamental58_dataset3_506.py'
      - '.github/workflows/v273-s288-fundamental58-native-dataset3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s288-original-fundamental58-dataset3
  cancel-in-progress: true
jobs:
  original_rare_S1_S4_58D_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Restore S277 genuine original native reference and all S278 features
        run: |
          gh run download 38319155819 -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled -D model/S277 --repo ${{ github.repository }}
          gh run download 38319390256 -n s278-IDMT-dataset3-506-native-real-S97-no-XML -D model/S278 --repo ${{ github.repository }}
          gh run download 38318827219 -n s276-IDMT-central-directory-only-prospective-WAV-cohort -D model/S276 --repo ${{ github.repository }}
      - name: Derive original verified harmonic and fundamental bank on 506 original V88 native moments
        run: |
          python -u -m scripts.s288_original_fundamental58_dataset3_506 \
            --s278 model/S278/S278_IDMT_dataset3_original_S97_on_frozen_native_events.npz \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s277report model/S277/report.json \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --out model/S288
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S288/report.json'))
          assert r['original_reference_events']==506
          assert r['original_feature_count']==r['original_fundamental_count']==58
          assert r['original_primary_max_scaled_deviation_from_S278']<1e-3
          assert not r['annotation_XML_MIDI_contents_read'] and not r['S80_promoted']
          with np.load('model/S288/S288_fundamental58_dataset3_original_506.npz',allow_pickle=False) as z:
            assert z['fundamental'].shape==(506,58)
            assert z['features'].shape==(506,58)
          print('S288 PASS five original S1-S4/coherent source model feature views rebuilt')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s288-dataset3-506-native-original-fundamental58-prelabel
          path: model/S288/
          retention-days: 90
