name: V27.3 causal decay paired diagnostic

on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths:
      - 'src/causal_note/decay_novelty.py'
      - 'scripts/test_v273_decay_internal.py'
      - 'test/test_v273_decay_internal.py'
      - 'requirements-decay.txt'
      - 'analysis/v273-decay-internal-protocol.md'
      - '.github/workflows/v273-decay-internal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v273-decay-internal-diagnostic
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  diagnostic:
    name: Test exponential decay and run four paired internal folds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-decay.txt
      - run: python -m pip install -r requirements-decay.txt
      - name: Test masked attacks, no future access, group exclusion and paired comparison
        run: python -m unittest -v test.test_v273_decay_internal test.test_v280_causal_cqt
      - name: Verify immutable predictions and successfully preserved causal features
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('child_process');
            const fs = require('fs');
            const sources = JSON.parse(execFileSync('python', ['-c',
              'import json; from scripts.test_v273_decay_internal import SOURCES; print(json.dumps(SOURCES))'
            ], {encoding:'utf8'}));
            const repo = {owner:context.repo.owner, repo:context.repo.repo};
            const records = [];
            for (const source of sources) {
              const {data:run} = await github.rest.actions.getWorkflowRun({...repo,run_id:source.run_id});
              if (run.head_sha !== source.head_sha || run.run_attempt !== source.run_attempt)
                throw new Error('Source producer changed');
              if (source.producer_job_id) {
                const {data:job} = await github.rest.actions.getJobForWorkflowRun({...repo,job_id:source.producer_job_id});
                if (job.run_id !== source.run_id || job.status !== 'completed' || job.conclusion !== 'success')
                  throw new Error('Prepared cache producer has not completed successfully');
              } else if (run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('V27.3 source run did not complete successfully');
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {...repo,run_id:source.run_id,per_page:100});
              for (const [name, expected] of Object.entries(source.artifacts)) {
                const matches = artifacts.filter(a => a.name === name && !a.expired);
                if (matches.length !== 1 || matches[0].id !== expected.id || matches[0].digest !== expected.digest)
                  throw new Error('Missing or changed source: '+name);
                records.push({run_id:run.id,head_sha:run.head_sha,artifact:matches[0]});
              }
            }
            fs.writeFileSync('source-verification.json',JSON.stringify(records,null,2)+'\n');
      - uses: actions/download-artifact@v4
        with:
          name: v280-i-prepared
          repository: Andriamarosoa/note
          run-id: '35061192743'
          github-token: ${{ github.token }}
          path: model/v273-decay-source
      - uses: actions/download-artifact@v4
        with:
          name: v273-selective-transition-fold-1
          repository: Andriamarosoa/note
          run-id: '34297767492'
          github-token: ${{ github.token }}
          path: model/v273-decay-reference
      - name: Train paired correctors on real GuitarSet compositions and publish the decision
        run: |
          set -euo pipefail
          python -B scripts/test_v273_decay_internal.py \
            --prepared-dir model/v273-decay-source \
            --reference-dir model/v273-decay-reference \
            --output-dir model/v273-decay-diagnostic 2>&1 | tee decay-diagnostic.log
          cp source-verification.json model/v273-decay-diagnostic/
          cat model/v273-decay-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-decay-internal-diagnostic
          path: |
            model/v273-decay-diagnostic/
            decay-diagnostic.log
            source-verification.json
          if-no-files-found: warn
          retention-days: 90
