name: S707 CAL-driven threshold expansion and causal joint offset integration
on:
  push:
    branches: [codex/note-s707-joint-calibration-refinement]
    paths:
      - src/causal_note/s707_causal_release.py
      - scripts/s707_refine_joint_calibration.py
      - test/test_s707_causal_release.py
      - .github/workflows/note-s707-joint-calibration-refinement.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s707-joint-calibration-refinement
  cancel-in-progress: false
jobs:
  refine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: 705
            run: 39092939353
            artifact: S705_TEMPORAL_HARMONIC_CAUSAL_LOOPS
          - family: 706
            run: 39093239181
            artifact: S706_SHARP_SPECTRAL_TEMPORAL_CAUSAL_LOOPS
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test causal integration and actual emitted-note budget
        run: |
          python -m compileall -q src/causal_note/s707_causal_release.py scripts/s707_refine_joint_calibration.py
          python -m unittest -v test.test_s707_causal_release test.test_s705_temporal_heads test.test_s704_joint_loops
      - name: Await and retrieve immutable source experiment
        run: |
          gh run watch ${{ matrix.run }} --repo "${{ github.repository }}" --exit-status --interval 30
          mkdir -p /tmp/s707_models /tmp/s707_s675
          gh run download ${{ matrix.run }} --repo "${{ github.repository }}" --name "${{ matrix.artifact }}" --dir /tmp/s707_models
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s707_s675
      - name: Expand thresholds on CAL, integrate causal offsets, freeze and evaluate
        run: python -m scripts.s707_refine_joint_calibration --family ${{ matrix.family }} --checkpoints /tmp/s707_models --offset-checkpoint /tmp/s707_s675/s675_hazard.joblib --out /tmp/s707
      - name: Preserve calibration choices and raw emissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S707_REFINED_S${{ matrix.family }}_JOINT_CAUSAL_LOOPS
          path: /tmp/s707/
          if-no-files-found: warn
          retention-days: 60
