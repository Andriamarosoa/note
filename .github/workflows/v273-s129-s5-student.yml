name: S129 new 111D S5 student from original teacher (research only)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s129_s5_111d_student.py'
      - '.github/workflows/v273-s129-s5-student.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s129-s5-student-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - run: python -m scripts.s129_s5_111d_student --self-test
      - name: Restore SHA-pinned genuine teacher fold checkpoints and posteriors
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          for FOLD in 0 1 2 4; do
            git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/report.json" \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/predictions.npz" | tar -x -C model/history
          done
      - name: Download true original GuitarSet audio-derived fold0 features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/features/fold0
      - name: Download original fold1 features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/features/fold1
      - name: Download original fold2 features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/features/fold2
      - name: Download original fold4 features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/features/fold4
      - name: Download existing S116 label-blind GOAT external 111D control features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38184381730
          name: v273-s116-original-S4-control111-GOAT
          path: model/s116
      - name: Train held-out teacher-fidelity model then independently infer GOAT
        run: |
          set -euo pipefail
          S116="$(find model/s116 -type f -name external_s4_control111.npz -print -quit)"
          test -s "$S116"
          python -u -m scripts.s129_s5_111d_student \
            --features-root model/features \
            --original-s5 model/history/analysis/evidence/v273-open-k0-k6/series5/models \
            --s116 "$S116" --out model/s129
          python - <<'PY'
          import json
          r=json.load(open('model/s129/report.json'))
          assert r['GOAT_external_audio_groups']==57
          assert r['held_out_teacher_rows']==15952
          assert not r['historic_true_K_read'] and not r['external_labels_read']
          assert not r['original_S80_pipeline_equivalence'] and not r['promotion']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s129-new-s5-student111-goat-blind
          path: model/s129/
          retention-days: 30
