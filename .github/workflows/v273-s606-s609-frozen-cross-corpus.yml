name: S606-S609 frozen S601 on GuitarSet IDMT MAESTRO
'on':
  push:
    branches:
      - codex/s533-s535-note-fundamental-loops
    paths:
      - analysis/v273_s606_cross_corpus_preregistration.json
      - .github/workflows/v273-s606-s609-frozen-cross-corpus.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: s606-s609-transfer-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  TF_CPP_MIN_LOG_LEVEL: '3'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
jobs:
  audio_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        corpus: [GuitarSet, IDMT, MAESTRO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen numerical and inference versions
        run: python -m pip install setuptools==80.10.2 numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3 tensorflow==2.14.1 basic-pitch==0.4.0 librosa==0.11.0
      - name: Registered audio only; no annotations or fitting
        run: python -m scripts.s606_s609_frozen_cross_corpus freeze --corpus '${{ matrix.corpus }}'
      - uses: actions/upload-artifact@v4
        with:
          name: s608-frozen-${{ matrix.corpus }}
          path: model/S608/
          retention-days: 90
          if-no-files-found: error
  first_score:
    needs: audio_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed scoring versions
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: s608-frozen-*
          path: model/S608/
          merge-multiple: true
      - name: All three corpora frozen before any annotations
        run: python -m scripts.s606_s609_frozen_cross_corpus score
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s609-first-transfer-ALL-gains-and-losses
          path: model/S609/
          retention-days: 90
          if-no-files-found: warn
