name: S203 inspect original Github release asset archives for missing historical S4 S5 owned527 builder
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s203_original_S5_527D_release_asset_forensics.py'
      - '.github/workflows/v273-s203-original-S5-527-release-source-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s203-original-527-releases-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect_previous_unscanned_release_assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NumPy only for binary headers
        run: python -m pip install numpy==1.26.4
      - name: Strict source signature no-label selftest
        run: python -m scripts.s203_original_S5_527D_release_asset_forensics --self-test
      - name: Download exactly five historically published immutable tagged tar archives, no reruns
        run: |
          set -euo pipefail
          mkdir -p model/S203/releases
          for tag in \
            v273-series41-research-37881332296 \
            v273-series43-research-37888008660 \
            v273-series44-research-37890938098 \
            v273-series45-research-37891074478 \
            v273-series46-research-37891464117
          do
            gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.tar.gz' --dir model/S203/releases --clobber
          done
          test "$(find model/S203/releases -type f -name '*.tar.gz' | wc -l)" -eq 5
      - name: Inspect release members and nested .npz headers for exact 416/527 source evidence without labels
        run: |
          python -u -m scripts.s203_original_S5_527D_release_asset_forensics \
            --input model/S203/releases --out model/S203/report.json
          python - <<'PY'
          import json
          d=json.load(open('model/S203/report.json'))
          assert d['release_tarballs_scanned']==5
          assert not d['archive_data_values_or_ground_truth_accessed']
          assert not d['source_file_recoverable_original_S5_owned_builder_proven']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s203-five-historical-tagged-release-archive-S5-owned527-source-audit-no-truth
          path: model/S203/report.json
          retention-days: 90
