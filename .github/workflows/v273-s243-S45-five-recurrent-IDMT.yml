name: S243 replay five original recurrent S45 sources on genuine S5 S18
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s243_five_recurrent_S45_genuine_original_IDMT.py'
      - '.github/workflows/v273-s243-S45-five-recurrent-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s243-five-recurrent-S45-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_recurrent_five:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original recurrent PyTorch environment
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download 19 original S19 recurrent models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37858017067
          name: v273-series19-recurrent
          path: model/S19
      - name: Download 19 original S20 recurrent residual models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37858383973
          name: v273-series20-residual
          path: model/S20
      - name: Download 19 original trained S25 B-first models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37862417522
          name: v273-series25-trained-Bfirst
          path: model/S25
      - name: Verify original five recurrent source producer selftests
        run: |
          python -m scripts.s168_original_S24_S25_Bfirst_GOAT --self-test
          python -m scripts.s166_external_original_S19_S20_S27 --self-test
      - name: True S238 original trained 133-head S18 predictions on 1034 native IDMT events
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38304553740
          name: s238-idmt-original-full-S5-S18-133-checkpoint-4fold-1034-predictions
          path: model/S238
      - name: Original native S97 original audio source 1034 matched event IDs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38305601838
          name: s240-original-S97-native-1034-audio-join-for-S29-S35
          path: model/S240bridge
      - name: Execute five genuine original frozen recurrent models over all 19 branches
        run: >-
          python -m scripts.s243_five_recurrent_S45_genuine_original_IDMT
          --s18 model/S238/S238_original_S5_to_S18_true_V88_native_IDMT_1034.npz
          --s97 model/S240bridge/s240_original_IDMT_native_S97_audio.npz
          --s19 model/S19 --s20 model/S20 --s25 model/S25 --out model/S243
      - name: Validate all original sources S19 S20 S24 S25 S27
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S243/report.json'))
          assert r['branches']==19 and r['fold_branch_counts']==[5,4,5,5]
          assert r['original_S19_models']==r['original_S20_models']==r['original_S25_models']==19
          assert r['source_S135_PR16_removed'] and r['source_parent_recovered_S18']
          assert not r['truth_labels_read'] and not r['new_training'] and not r['S80_promoted']
          with np.load('model/S243/five_rebased_recurrent_S19_S20_S24_S25_S27.npz',allow_pickle=False) as z:
              assert z['proposals_K'].shape==(19,1034,5)
              assert len(z['family_ids'])==5 and len(set(map(str,z['branch_piece'])))==19
          print('S243 PASS five recurrent original-trained S45 sources re-executed on actual S18 parents')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s243-five-rebased-original-recurrent-S45-19-branches
          path: model/S243/
          retention-days: 90
