name: V8.3 split-task controlled A/B

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v83-split-ab.yml"
      - "src/causal_note/v83_model.py"
      - "src/causal_note/v83_predictor.py"
      - "scripts/train_v83_ab.py"
      - "scripts/sweep_v83_thresholds.py"
      - "test/test_v83_model.py"
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Download frozen V8.1 epoch-03 source and baseline sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-v81
          gh run download 33536348915 \
            --repo "$GITHUB_REPOSITORY" \
            --name v81-pilot \
            --dir model/source-v81
          test -f model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras
          test -f model/source-v81/v81-pilot-epoch-03-sweep.json

      - name: Download frozen V8.1 train-FP audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-audit
          gh run download 33551039906 \
            --repo "$GITHUB_REPOSITORY" \
            --name v81-train-fp-harmonic-audit \
            --dir model/source-audit
          test -f model/source-audit/v81-train-fp-harmonic-audit.json

      - name: Test split architecture, initialization, and predictor
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          python -m unittest test.test_v83_model -v
          python -m unittest test.test_v82c_ab -v
          python -m py_compile scripts/train_v83_ab.py scripts/sweep_v83_thresholds.py

      - name: Smoke V8.3 controlled split continuation
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v83_ab.py \
            --source-model model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras \
            --replay-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --filters 32 \
            --split-after 4 \
            --learning-rate 0.0001 \
            --smoke \
            --output-dir model/v83-smoke \
            2>&1 | tee model/v83-smoke.log

      - name: Train split-task control and replay arms
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v83_ab.py \
            --source-model model/source-v81/causal-boundaries-v81-pilot.epoch-03.keras \
            --replay-audit model/source-audit/v81-train-fp-harmonic-audit.json \
            --epochs 3 \
            --filters 32 \
            --split-after 4 \
            --train-examples 800 \
            --validation-examples 200 \
            --learning-rate 0.0001 \
            --replay-fraction 0.25 \
            --max-replay-per-track 16 \
            --output-dir model/v83-pilot \
            2>&1 | tee model/v83-pilot-train.log

      - name: Verify V8.3 experiment manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("model/v83-pilot/manifest.json").read_text())
          cfg = data["configuration"]
          source = data["source"]
          arch = data["architecture"]
          assert arch["split_after"] == 4
          assert arch["shared_dilations"] == [1, 2, 4, 8]
          assert arch["private_dilations"] == [16, 32, 64, 128, 256, 512]
          assert arch["function_preserving_initialization"] is True
          assert source["functional_max_abs_delta"] <= 1e-6
          assert source["v83_parameters"] > source["source_parameters"]
          assert cfg["steps_per_epoch"] == 100
          assert cfg["learning_rate"] == 0.0001
          assert cfg["per_head_weight_mass_matched"] is True
          assert cfg["offset_replay_masking"] is False
          assert cfg["backbone_frozen"] is False
          assert source["optimizer_state_restored"] is False
          assert len(source["stream_model_file_sha256"]) == 64
          assert len(source["source_weights_sha256"]) == 64
          assert len(source["v83_initial_weights_sha256"]) == 64
          assert len(source["replay_audit_sha256"]) == 64
          assert len(data["epochs"]) == 3
          for epoch in data["epochs"]:
              assert epoch["replay_summary"]["positions"] == 200
              assert epoch["replay_summary"]["max_per_track"] <= 16
              assert len({(r["member"], r["sample"]) for r in epoch["replay_points"]}) == 200
              for head, report in epoch["mass_matching"].items():
                  tolerance = max(1e-4, abs(report["control_mass"]) * 1e-5)
                  assert abs(report["control_mass"] - report["replay_matched_mass"]) < tolerance, (head, report)
          print(json.dumps({"source": source, "architecture": arch, "configuration": cfg}, indent=2))
          PY

      - name: Sweep both V8.3 arms on locked 12-track subset
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          for arm in control replay; do
            for epoch in 01 02 03; do
              python -B scripts/sweep_v83_thresholds.py \
                --model "model/v83-pilot/${arm}.epoch-${epoch}.keras" \
                --limit-tracks 12 \
                --thresholds 0.01 0.02 0.05 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 0.95 \
                --output "model/v83-${arm}-epoch-${epoch}-sweep.json" \
                > "model/v83-${arm}-epoch-${epoch}-sweep.log"
            done
          done

      - name: Compare V8.1, V8.3 control, and V8.3 replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def boundary_metrics(record):
              return {
                  key: record[key]
                  for key in ("reference_count", "prediction_count", "true_positive", "false_positive", "false_negative", "precision", "recall", "f1", "prediction_reference_ratio")
                  if key in record
              }

          def metrics(payload):
              agg = payload["aggregates"]
              return {
                  "onset": boundary_metrics(agg["global"]["onset"]),
                  "offset": boundary_metrics(agg["global"]["offset"]),
                  "solo_onset": boundary_metrics(agg["solo"]["onset"]),
                  "solo_offset": boundary_metrics(agg["solo"]["offset"]),
                  "comp_onset": boundary_metrics(agg["comp"]["onset"]),
                  "comp_offset": boundary_metrics(agg["comp"]["offset"]),
              }

          def summarize(path):
              data = json.loads(Path(path).read_text())
              fixed = data["sweep"]["0.400000"]
              candidates = []
              for threshold, payload in data["sweep"].items():
                  g = payload["aggregates"]["global"]
                  score = g["onset"]["f1"] + g["offset"]["f1"]
                  candidates.append((score, -float(threshold), threshold, payload))
              _, _, best_t, best = max(candidates)
              return {
                  "fixed_0_40": metrics(fixed),
                  "best_combined_threshold": best_t,
                  "best_combined": metrics(best),
                  "runtime": data["runtime"],
              }

          report = {
              "schema_version": 1,
              "source_v81_epoch_03": summarize("model/source-v81/v81-pilot-epoch-03-sweep.json"),
              "control": {},
              "replay": {},
          }
          for arm in ("control", "replay"):
              for epoch in (1, 2, 3):
                  report[arm][str(epoch)] = summarize(f"model/v83-{arm}-epoch-{epoch:02d}-sweep.json")

          print("arm epoch mode threshold onset_P onset_R onset_F1 offset_P offset_R offset_F1 solo_P solo_R solo_F1 comp_P comp_R comp_F1")
          for arm, epochs in (("source", {"3": report["source_v81_epoch_03"]}), ("control", report["control"]), ("replay", report["replay"])):
              for epoch, row in epochs.items():
                  modes = (("fixed", "0.400000", row["fixed_0_40"]),)
                  if arm != "source":
                      modes += (("best", row["best_combined_threshold"], row["best_combined"]),)
                  for mode, threshold, m in modes:
                      values = []
                      for kind in ("onset", "offset", "solo_onset", "comp_onset"):
                          values.extend(m[kind][key] for key in ("precision", "recall", "f1"))
                      print(arm, epoch, mode, threshold, *(f"{value:.6f}" for value in values))

          Path("model/v83-ab-summary.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload V8.3 A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v83-split-ab
          path: |
            model/v83-smoke.log
            model/v83-pilot-train.log
            model/v83-pilot/manifest.json
            model/v83-pilot/control.keras
            model/v83-pilot/control.epoch-*.keras
            model/v83-pilot/replay.keras
            model/v83-pilot/replay.epoch-*.keras
            model/v83-*-epoch-*-sweep.log
            model/v83-*-epoch-*-sweep.json
            model/v83-ab-summary.json
          if-no-files-found: warn
          retention-days: 7
