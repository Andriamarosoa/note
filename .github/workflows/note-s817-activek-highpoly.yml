name: S817 private causal temporal K4-K6 ActiveK experiment
on:
  push:
    branches: [codex/note-s817-activek-temporal-highpoly]
    paths:
      - src/causal_note/s817_highpoly_temporal.py
      - scripts/s817_train_highpoly256.py
      - test/test_s817_highpoly_temporal.py
      - series/S817/**
      - .github/workflows/note-s817-activek-highpoly.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Verify causal private history, trained heads, noninterference and reporting
        run: |
          python -m compileall -q src/causal_note/s817_highpoly_temporal.py scripts/s817_train_highpoly256.py test/test_s817_highpoly_temporal.py
          python -m unittest -v test.test_s817_highpoly_temporal test.test_s815_activek_teacher test.test_s813_native256 test.test_s813_teacher_contract test.test_s809_axis_isolation
          python -m scripts.verify_series_reports --series S817
  real_fit80:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Download SHA verified frozen S815 private triple head models
        run: |
          mkdir -p /tmp/s817/previous
          gh run download 39536863317 --repo Andriamarosoa/note --name S815_ACTIVE_K_PRIVATE_MIDI256_FIT80_RESULTS --dir /tmp/s817/previous
          OLD="$(find /tmp/s817/previous -path '*/experiment/report.json' -type f -print -quit)"
          test -s "$OLD"
          PREVIOUS="$(dirname "$OLD")"
          test -s "$(dirname "$PREVIOUS")/fresh256/report.json"
          test -s "$PREVIOUS/models/BN1_active_k.joblib"
          printf '%s\n' "$PREVIOUS" > /tmp/s817/previous_path
      - name: Restore signed S800 original FIT80 real MIDI256 traces and annotations
        run: |
          mkdir -p /tmp/s817/manifest /tmp/s817/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s817/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s817/traces
          SOURCE="$(find /tmp/s817/manifest -name report.json -type f -print -quit)"
          TRACE="$(find /tmp/s817/traces -name fit_000.json -type f -print -quit)"
          test -s "$SOURCE"
          test -s "$TRACE"
          printf '%s\n' "$SOURCE" > /tmp/s817/manifest_path
          printf '%s\n' "$(dirname "$TRACE")" > /tmp/s817/traces_path
      - name: Fetch SHA pinned 44100 Hz original microphone PCM GuitarSet
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          src=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())['guitar_archives']['GuitarSet_audio']
          dest=Path('/tmp/s817/GuitarSet_audio.zip')
          with urllib.request.urlopen(src['url'],timeout=180) as inp,dest.open('wb') as out:
              while piece:=inp.read(4*1024*1024):
                  out.write(piece)
          assert dest.stat().st_size==src['size']
          h=hashlib.sha256()
          with dest.open('rb') as inp:
              for blob in iter(lambda:inp.read(4*1024*1024),b''):
                  h.update(blob)
          assert h.hexdigest()==src['sha256']
          print('S817_AUTHENTIC_AUDIO_SHA',h.hexdigest())
          PY
      - name: Extract fresh genuinely causal PCM256 features for all 80 recordings
        run: |
          python -m scripts.s813_prepare_native256 --manifest "$(cat /tmp/s817/manifest_path)" --traces "$(cat /tmp/s817/traces_path)" --audio-zip /tmp/s817/GuitarSet_audio.zip --out /tmp/s817/fresh256 --workers 2
      - name: Train five pairs of private causal high-polyphony heads on separate compositions
        run: |
          python -m scripts.s817_train_highpoly256 --cache /tmp/s817/fresh256 --traces "$(cat /tmp/s817/traces_path)" --previous-dir "$(cat /tmp/s817/previous_path)" --out /tmp/s817/result
      - name: Verify original H0 and frozen S815 bit-exact score, then no promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s817/result/report.json'))
          assert r['schema']=='S817_REAL_FIT80_FIVE_PRIVATE_ACTIVEK_HEADS_MIDI256_V1' and r['complete']
          assert len(r['tracks'])==80 and len(r['folds'])==5
          assert (r['feature_hop_samples'],r['decision_hop_samples'],r['metric_hop_samples'])==(256,256,256)
          assert r['historical_fit_active_k']['correct']==142213
          assert r['original_s815_fit_active_k']['correct']==141946
          assert r['new_s817_fit_active_k']['frames']==249411
          assert r['two_new_heads'] and r['five_private_head_architecture']
          assert not any(r[k] for k in ('source_MIDI_modified','other_characteristics_modified','CAL_opened','HELD_opened','TEST_opened','promotion','production_LIVE_modified','unified_MIDI_measured'))
          assert not r['unification_gate']['allow_unification']
          print('S817_REAL_ACTIVE_K',r['new_s817_fit_active_k'])
          print('S817_COMPARE_S815',r['original_s815_fit_active_k'])
          print('S817_COMPARE_H0',r['historical_fit_active_k'])
          print('S817_DELTAS',r['delta_vs_s815_pp'],r['delta_vs_h0_pp'])
          print('S817_RESEARCH_ONLY_NOT_PROMOTED')
          PY
      - name: Retain signed result and private specialist models/decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S817_FIVEHEAD_ACTIVEK_TEMPORAL_K4_K6_FIT80_RESULTS
          path: |
            /tmp/s817/result/report.json
            /tmp/s817/result/models/
            /tmp/s817/result/predictions/
            /tmp/s817/fresh256/report.json
          retention-days: 45
          if-no-files-found: warn
