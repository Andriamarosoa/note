name: S627 shared neural attack and event K train dev
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - src/causal_note/s627_joint_heads.py
      - scripts/s627_train_joint_eventK_pitch.py
      - test/test_s627_joint_heads.py
      - .github/workflows/v273-s627-joint-native-head.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s627-multitask-train-${{ github.ref }}
  cancel-in-progress: false
jobs:
  joint_train_and_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged NOTE causal dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Install Torch CPU for TRAINING ONLY (runtime uses numpy)
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original reference and new count semantics
        run: |
          python -m compileall -q scripts/s627_train_joint_eventK_pitch.py src/causal_note/s627_joint_heads.py
          python -m unittest -v test.test_s627_joint_heads test.test_strict_live
      - name: Joint training on composition-disjoint GuitarSet URMP train groups
        run: |
          python -m scripts.s627_train_joint_eventK_pitch --out /tmp/S627 --epochs 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S627-multitask-attack-eventK-native-train-dev
          path: /tmp/S627/
          if-no-files-found: warn
          retention-days: 60
