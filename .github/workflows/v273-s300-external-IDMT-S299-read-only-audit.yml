name: S300 read-only class and composition audit of S299 postfrozen IDMT notes
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s300_read_only_paired_S299_uncertainty_audit.py'
      - '.github/workflows/v273-s300-external-IDMT-S299-read-only-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s300-postfrozen-XML-readonly-no-model-fit
  cancel-in-progress: true
jobs:
  independent_scorecard_no_fit_no_promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore original already post-frozen S299 matched-note results (NEVER scores on other labels)
        run: |
          gh run download 38321142772 \
            -n s299-IDMT-dataset3-postfrozen-XML-note-matched-threeway-report-NOT-global-NOT-promotion \
            -D model/S299 --repo ${{ github.repository }}
      - name: Audit all per-K corrections/regressions and bootstrap on the unchanged annotated cohort
        run: |
          python -u -m scripts.s300_read_only_paired_S299_uncertainty_audit \
            --s299 model/S299/report.json \
            --out model/S300
          python - <<'PY'
          import json
          r=json.load(open('model/S300/report.json'))
          assert r['matched_annotated_K1to6']==47
          assert r['matched_true_poly_K2to6']==23
          assert r['unknown_native_events']==459
          assert r['actual_improvement_poly_correct_events']==3
          assert r['musical_compositions_in_cohort']==4
          assert not r['global_K0to6_ExactK_proven']
          assert not r['composition_disjointness_proven']
          assert not r['promotion_allowed']
          print('S300 PASS original fixed S299 findings, cannot promote S80')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s300-external-S299-fixed-perK-composition-bootstrap-audit-NOT-promotion
          path: model/S300/
          retention-days: 90
