name: S715 frozen S708 CAL-only K budget shadow loops no promotion
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - scripts/s715_shadow_k_calibration.py
      - test/test_s715_shadow_k_calibration.py
      - .github/workflows/note-s715-shadow-k-calibration.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s715-cal-only-shadow
  cancel-in-progress: false
jobs:
  strict_research_cal_and_sealed_validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned NOTE inference and PyTorch CPU
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify experimental CAL guard, native event metrics and compilation
        run: |
          python -m compileall -q scripts/s715_shadow_k_calibration.py
          python -m unittest -v test.test_s715_shadow_k_calibration test.test_s714_s708_cardinality
      - name: Retrieve unmodified frozen S708 and S675 weights
        run: |
          mkdir -p /tmp/s715_s708 /tmp/s715_s675
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s715_s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s715_s675
          test -s /tmp/s715_s708/s708_selected.pt
          test -s /tmp/s715_s708/report.json
          test -s /tmp/s715_s675/s675_hazard.joblib
      - name: CAL-only select, frozen then HELD/DEV six-metric guards
        run: |
          python -m scripts.s715_shadow_k_calibration --s708-dir /tmp/s715_s708 --offset-checkpoint /tmp/s715_s675/s675_hazard.joblib --out /tmp/s715_results
      - name: Save full independent shadow evidence (without promotion)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S715_K_BUDGET_SHADOW_CAL_HELD_DEV_NO_PROMOTION
          path: /tmp/s715_results/report.json
          retention-days: 60
          if-no-files-found: warn
