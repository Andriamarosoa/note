name: V27.3 Candidate Hidden1 Group Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-candidate-hidden1-groups-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-candidate-hidden1-groups
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-candidate-hidden1-groups-${{ github.run_id }}

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        val_fold: [0, 1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate group worker
        run: python -m py_compile scripts/audit_v273_candidate_hidden1_group_worker.py

      - name: Restore bundle and completed multi-fold checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/folds
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-candidate-hidden1-multifold-37271262794             --repo "${{ github.repository }}"             --pattern v273-candidate-hidden1-multifold-folds.tgz             --dir model/download
          tar -xzf model/download/v273-candidate-hidden1-multifold-folds.tgz -C model/folds

      - name: Run exact group audit
        run: |
          python -B scripts/audit_v273_candidate_hidden1_group_worker.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --fold-root model/folds             --val-fold "${{ matrix.val_fold }}"             --output "model/result-${{ matrix.val_fold }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-candidate-hidden1-group-fold-${{ matrix.val_fold }}
          path: model/result-${{ matrix.val_fold }}/
          retention-days: 90

  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-candidate-hidden1-group-fold-*
          path: model/results

      - name: Summarize exact multi-fold groups
        run: |
          python -B scripts/summarize_v273_candidate_hidden1_groups.py             --input-root model/results             --output model/summary

      - name: Publish group audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf model/v273-candidate-hidden1-group-results.tgz -C model/results .
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 candidate_hidden1 exact internal group audit"             --notes-file model/summary/report.md
          gh release upload "$TAG"             model/summary/report.json             model/summary/report.md             model/v273-candidate-hidden1-group-results.tgz             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-candidate-hidden1-group-summary
          path: model/summary/
          retention-days: 90
