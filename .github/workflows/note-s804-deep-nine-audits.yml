name: S804 deep code and real GuitarSet data nine-reviewer audit
on:
  push:
    branches: [codex/note-s804-nvidia-three-model-deep-audit]
    paths:
      - scripts/s804_deep_audit_bundle.py
      - scripts/s804_nvidia_deep_review.py
      - scripts/s804_local_six_audits.py
      - scripts/s804_nine_consensus.py
      - test/test_s804_deep_review.py
      - .github/workflows/note-s804-deep-nine-audits.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile all S804 modules before downloading original evidence
        run: |
          python -m compileall -q scripts/s804_deep_audit_bundle.py scripts/s804_nvidia_deep_review.py scripts/s804_local_six_audits.py scripts/s804_nine_consensus.py test/test_s804_deep_review.py
          python -m unittest -v test.test_s804_deep_review
          python -m scripts.verify_series_reports --series S804
  real_code_data_bundle:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen forensic libraries to inspect all 80 signed FIT snapshots
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download original, same-run provenance for S800 S802 S803
        run: |
          mkdir -p /tmp/s804/s800 /tmp/s804/traces /tmp/s804/s802 /tmp/s804/s803
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s804/s800
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s804/traces
          gh run download 39359182007 --repo Andriamarosoa/note --name S802_REAL_FIT80_TRUTH_MATCHED_COLLISION_CAUSES --dir /tmp/s804/s802
          gh run download 39363062723 --repo Andriamarosoa/note --name S803_REAL_GUITARSET_FIT80_MIDI256_METRICS_AUC --dir /tmp/s804/s803
          test -s /tmp/s804/s800/replay/report.json
          test -s /tmp/s804/s802/forensic.json
          test -s /tmp/s804/s803/s803_fit80.json
          test -n "$(find /tmp/s804/traces -name fit_000.npz -type f -print -quit)"
      - name: Verify 80 real tracks, every Git-tracked Python AST, and causal core
        run: |
          trace_file="$(find /tmp/s804/traces -name fit_000.npz -type f -print -quit)"
          python -m scripts.s804_deep_audit_bundle \
            --root . \
            --manifest /tmp/s804/s800/replay/report.json \
            --traces "$(dirname "$trace_file")" \
            --s802 /tmp/s804/s802/forensic.json \
            --s803 /tmp/s804/s803/s803_fit80.json \
            --out /tmp/s804/evidence/bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S804_SIGNED_80TRACK_CODE_AST_AUDIT_BUNDLE
          path: /tmp/s804/evidence/bundle.json
          if-no-files-found: warn
          retention-days: 45
  six_local_audits:
    needs: [smoke,real_code_data_bundle]
    if: always()
    name: S804 independent ${{ matrix.role }} deterministic deep audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: S804_SIGNED_80TRACK_CODE_AST_AUDIT_BUNDLE
          path: /tmp/s804/evidence
      - name: Independently audit the actual signed GuitarSet/code evidence
        run: |
          python -m scripts.s804_local_six_audits \
            --role ${{ matrix.role }} \
            --bundle /tmp/s804/evidence/bundle.json \
            --out /tmp/s804/audits/role_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S804_LOCAL_AUDIT_${{ matrix.role }}
          path: /tmp/s804/audits/role_${{ matrix.role }}.json
          if-no-files-found: warn
  three_nvidia_reviewers:
    needs: [smoke,real_code_data_bundle]
    name: S804 NVIDIA ${{ matrix.role }} independent code/data deep audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [architecture, data, redteam]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: S804_SIGNED_80TRACK_CODE_AST_AUDIT_BUNDLE
          path: /tmp/s804/evidence
      - name: Run one actual NVIDIA model per role on code AND data
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "NVIDIA key not configured"; exit 1; }
          python -m scripts.s804_nvidia_deep_review \
            --role ${{ matrix.role }} \
            --bundle /tmp/s804/evidence/bundle.json \
            --out /tmp/s804/nvidia/review_${{ matrix.role }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S804_NVIDIA_${{ matrix.role }}
          path: /tmp/s804/nvidia/review_${{ matrix.role }}.json
          if-no-files-found: warn
          retention-days: 45
  consensus_nine:
    needs: [smoke,real_code_data_bundle,six_local_audits,three_nvidia_reviewers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S804_LOCAL_AUDIT_*
          path: /tmp/s804/audits
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: S804_NVIDIA_*
          path: /tmp/s804/reviews
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: S804_SIGNED_80TRACK_CODE_AST_AUDIT_BUNDLE
          path: /tmp/s804/evidence
      - name: Six local PASS plus all THREE genuine distinct NVIDIA responses required
        run: |
          python -m scripts.s787_audit_consensus --reports-dir /tmp/s804/audits --out /tmp/s804/consensus/six.json
          python -m scripts.s804_nine_consensus \
            --six /tmp/s804/consensus/six.json \
            --bundle /tmp/s804/evidence/bundle.json \
            --reviews-dir /tmp/s804/reviews \
            --out /tmp/s804/consensus/nine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S804_NINE_OF_NINE_FAIL_CLOSED_CONSENSUS
          path: /tmp/s804/consensus/*.json
          if-no-files-found: warn
          retention-days: 45
