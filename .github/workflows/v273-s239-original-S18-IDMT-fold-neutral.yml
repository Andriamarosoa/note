name: S239 preregistered S217 fourfold majority on original 1034 IDMT native S18
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s239_S217_fold_consensus_on_1034_true_IDMT_native.py'
      - '.github/workflows/v273-s239-original-S18-IDMT-fold-neutral.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s239-original-IDMT-S18-votes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen_original_S217_policy_no_unseen_label:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent no-model training numeric toolkit
        run: python -m pip install numpy==1.26.4
      - name: Restore real 1034-event fourfold S18 results from exact 133 original historic trained risk checkpoint models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38304553740
          name: s238-idmt-original-full-S5-S18-133-checkpoint-4fold-1034-predictions
          path: model/S238
      - name: Run exact S217 frozen 3of4 vote and independent Counter loop on all 1034 official native event IDs
        run: |
          python -m scripts.s239_S217_fold_consensus_on_1034_true_IDMT_native \
            --s238 model/S238/S238_original_S5_to_S18_true_V88_native_IDMT_1034.npz \
            --out model/S239
      - name: Require exact 1034 original K0 through K6 votes and no promotion before paired labels
        run: |
          python - <<'PY'
          import json,numpy as np,hashlib
          from pathlib import Path
          r=json.load(open('model/S239/report.json'))
          assert r['native_event_count']==1034 and r['original_fold_count']==4
          assert r['original_S18_disagreeing_events']==77
          assert r['all_1034_votes_independently_reproduced_with_Collections_Counter']
          assert r['all_original_V88_native_reference_IDs_unchanged']
          assert not r['labelled_song_annotations_read']
          assert not r['independent_exactK_accuracy_measured'] and not r['S80_promoted']
          p=Path('model/S239/S239_original_S18_foldneutral_1034_IDMT.npz')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['output_SHA256']
          with np.load(p,allow_pickle=False) as z:
            assert z['original_S18_by_fold_K'].shape==(4,1034)
            assert z['S18_piece_neutral_consensus_K'].shape==(1034,)
            assert np.isin(z['S18_piece_neutral_consensus_K'],range(7)).all()
          print('S239 PASS precommitted original S217 fourfold consensus on IDMT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s239-original-S217-S18-4fold-majority-on-1034-IDMT-native-events
          path: model/S239/
          retention-days: 90
