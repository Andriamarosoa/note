name: S255 posthoc root cause audit of six proven S80 regressions vs official freeze on IDMT
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s255_audit_S80_six_regressions_IDMT_stage_ledger.py'
      - '.github/workflows/v273-s255-posthoc-S80-six-regressions-IDMT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s255-S80-posthoc-six-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit_frozen_regression_sources_without_optimizing_on_IDMT_holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install posthoc read-only NumPy analysis environment
        run: python -m pip install numpy==1.26.4
      - name: Restore only original S254 post-freeze XML match ledger (already revealed)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38308757247
          name: s254-independent-postfreeze-paired-S80-vs-freeze-IDMT-16XML-native-1034
          path: model/S254
      - name: Original fourfold S18 3/4 vote consensus native checkpoint source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38304758311
          name: s239-original-S217-S18-4fold-majority-on-1034-IDMT-native-events
          path: model/S239
      - name: Original S46 193 policy precommitted fold consensus source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307178111
          name: s247-genuine-S46-193-specialist-consensus-IDMT-native-1034
          path: model/S247
      - name: Original S69 veto balanced polymax native decision source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307579536
          name: s249-original-S69-4fold-genuine-S46-PR16-1034-IDMT
          path: model/S249
      - name: Original S70 4 fold checkpoint source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307852360
          name: s250-original-trained-S70-4fold-1034-IDMT-native-no-labels
          path: model/S250
      - name: Original S71 S72 8 genuine trained heads stage output source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38307945164
          name: s251-real-original-8-S71-S72-1034-native-IDMT
          path: model/S251
      - name: Frozen S80 prelabel SHA-pinned original checkpoint model source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38308087090
          name: s252-full-original-S80-preXML-1034-IDMT-native-frozen-predictions
          path: model/S252
      - name: Audit exact S18 S46 S69 S70 S71 S72 S79 S80 stage causality for all six measured regressions
        run: |
          python -u -m scripts.s255_audit_S80_six_regressions_IDMT_stage_ledger \
            --xml model/S254/S254_frozen_IDMT_paired_XML_matching_only.npz \
            --s239 model/S239/S239_original_S18_foldneutral_1034_IDMT.npz \
            --s247 model/S247/S247_original_193_S46_foldneutral_1034_IDMT.npz \
            --s249 model/S249/S249_original_S69_fourfold_rule_consensus_IDMT.npz \
            --s250 model/S250/S250_original_S70_4fold_no_oracle_IDMT.npz \
            --s251 model/S251/S251_original_S71_S72_native_IDMT.npz \
            --s252 model/S252/S252_full_original_S80_unseen_IDMT_1034_frozen.npz \
            --out model/S255
      - name: Assert six real regressions, three fixes, zero post-reveal model fitting and no S80 promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('model/S255/report.json'))
          assert r['matched_XML_events']==206
          assert r['frozen_S80_changed_native_events']==33
          assert r['original_S80_corrections']==3 and r['original_S80_regressions']==6
          assert r['original_S80_changed_both_incorrect']==7
          assert len(r['six_rootcause_regression_cases'])==6
          assert len(r['three_original_corrected_cases'])==3
          assert not r['no_models_refit']==False and r['no_thresholds_changed']
          assert not r['S80_promoted'] and r['full_ExactK_K0toK6_not_measured']
          print('S255 PASS: frozen source stages explain all six genuine annotated S80 regressions; NOT an independent retest')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s255-audit-S80-six-confirmed-regressions-fixes-all-original-model-stages
          path: model/S255/
          retention-days: 90
