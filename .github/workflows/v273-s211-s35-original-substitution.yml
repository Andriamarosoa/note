name: S211 audit original S29-fed S35 effect on 19 S45 S46 branches
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s211_s35_original_substitution_audit.py'
      - '.github/workflows/v273-s211-s35-original-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s211-S35-original-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_S35_faithful_source_impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original S45 Ridge + transitive PyTorch dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download 304 original S45 ridge risk heads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37891039201
          name: v273-series45-specialized-risk-heads
          path: model/S45
      - name: Download 11 S173 adapted family sources, including superseded S35
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38206160849
          name: v273-s173-real-trained-S35-adapted-11-source-S45-risks-NO-S80
          path: model/S173
      - name: Retrieve S210 real original S29 to S35 branch outputs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38238673938
          name: s210-original-S29-original-S35-19-branches-experimental
          path: model/S210
      - name: Retrieve sealed S206 reference, 19 x 193 original S46 decisions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38237264206
          name: s206-all-19-branches-16-s45-193-s46-not-promotion
          path: model/S206
      - name: Replay all 19 S45 and S46 branches with true S29-fed S35
        run: |
          set -euo pipefail
          ELEVEN="$(find model/S173 -name S173_S35_adapted_11_family_GOAT.npz -print -quit)"
          S210="$(find model/S210 -name original_s29_to_s35_GOAT.npz -print -quit)"
          test -s "$ELEVEN" && test -s "$S210"
          test -d model/S45/models
          test -s model/S206/report.json
          python -m scripts.s211_s35_original_substitution_audit \
            --five analysis/evidence/v273-recovered-five-families/external_five_families.npz \
            --eleven "$ELEVEN" --s210 "$S210" \
            --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz \
            --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz \
            --models model/S45/models \
            --catalog analysis/v273_s45_original_champion_catalog.json \
            --original206 model/S206 --out model/S211
      - name: Verify only S35 source changed and non-promotion guards
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          d=json.load(open('model/S211/report.json'))
          assert d['branches']==19 and d['families']==16 and d['S46_policy_columns']==193
          assert d['S45_original_ridge_checkpoints']==304
          assert d['ten_other_S45_families_still_adapted']
          assert not d['S80_promoted'] and not d['independent_ExactK_measured']
          assert not d['truth_labels_read'] and not d['models_trained']
          assert len(list(Path('model/S211').glob('branch*_fold*/s46/predictions.npz')))==19
          print('S211 PASS: real S29/S35 source recomputed through all 304 Ridge / 193 S46 policies; no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s211-original-S29-S35-19branch-S45-S46-comparison-experimental
          path: model/S211/
          retention-days: 90
