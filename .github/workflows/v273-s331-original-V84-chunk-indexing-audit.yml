name: S331 audit original trained V84 causal streaming chunk/sample timing invariance
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s331_original_V84_chunk_sample_origin_invariant.py'
      - '.github/workflows/v273-s331-original-V84-chunk-indexing-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s331-source-V84-original-chunk-invariant
  cancel-in-progress: true
jobs:
  original_V84_stateful_vs_fallback_chunk_sample_invariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore original immutable real pretrained V84/V86/V87/V88 models from pinned SHA source archive
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
            --repo ${{ github.repository }} \
            --pattern v273-rebuilt-proposal-sources.zip \
            --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
              Path('model/original-sources'),
              'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
              validate=validate_sources)
          PY
      - name: Assert one onset probability per physical sample and compare three original streaming backends, NO annotations
        run: |
          python -u -m scripts.s331_original_V84_chunk_sample_origin_invariant \
            --sources model/original-sources --out model/S331
          python - <<'PY'
          import json
          r=json.load(open('model/S331/report.json'))
          assert r['all_three_predictors_exact_sample_count']
          assert r['no_implicit_40ms_timestamp_addition']
          assert r['no_XML_read'] and r['no_retraining'] and r['no_promotion']
          assert all(d['onset_presence_max_abs']<2e-4
                     for d in r['max_abs_diff_vs_512'])
          print('S331 PASS actual original V84 causal model chunk consistency on known waveform')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s331-original-V84-actualtrained-sample-origin-chunk-consistency
          path: model/S331/
          retention-days: 90
