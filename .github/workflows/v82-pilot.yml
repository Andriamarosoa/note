name: V8.2 harmonic replay pilot

on:
  push:
    branches:
      - v8-anonymous-cardinality
    paths:
      - ".github/workflows/v82-pilot.yml"
      - "scripts/train_v82.py"
      - "src/causal_note/harmonic_state.py"
      - "test/test_harmonic_state.py"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

      - name: Download official GuitarSet pickup-mix data
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/annotation.zip "https://zenodo.org/records/3371780/files/annotation.zip?download=1"
          curl -L --fail --retry 5 --retry-delay 5 -o data/GuitarSet/audio_mono-pickup_mix.zip "https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip?download=1"

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Run harmonic feature tests
        env:
          PYTHONPATH: src
        run: python -m unittest test.test_harmonic_state -v

      - name: Smoke harmonic replay training
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          mkdir -p model
          python -B scripts/train_v82.py \
            --smoke \
            --min-flux-ratio 0.20 \
            --min-active-harmonic-fraction 0.50 \
            --output model/causal-boundaries-v82-smoke.keras \
            2>&1 | tee model/v82-smoke.log

      - name: Train V8.2 three-epoch pilot
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          python -B scripts/train_v82.py \
            --epochs 3 \
            --filters 32 \
            --train-examples 800 \
            --validation-examples 200 \
            --mine-tracks 40 \
            --probes-per-track 64 \
            --mined-per-track 8 \
            --min-flux-ratio 0.50 \
            --min-active-harmonic-fraction 0.70 \
            --learning-rate 0.001 \
            --output model/causal-boundaries-v82-pilot.keras \
            2>&1 | tee model/v82-pilot-train.log

      - name: Sweep every V8.2 epoch on same locked validation subset
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: |
          set -o pipefail
          for epoch in 01 02 03; do
            python -B scripts/sweep_v8_thresholds.py \
              --model "model/causal-boundaries-v82-pilot.epoch-${epoch}.keras" \
              --limit-tracks 12 \
              --thresholds 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 \
              --output "model/v82-pilot-epoch-${epoch}-sweep.json" \
              > "model/v82-pilot-epoch-${epoch}-sweep.log"
          done

      - name: Print best stream operating points
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          print("epoch threshold onset_pred P R F1 offset_pred P R F1 solo_onset_P solo_onset_R comp_onset_P comp_onset_R")
          for epoch in (1, 2, 3):
              data = json.loads(Path(f"model/v82-pilot-epoch-{epoch:02d}-sweep.json").read_text())
              candidates = []
              for threshold, payload in data["sweep"].items():
                  global_ = payload["aggregates"]["global"]
                  onset = global_["onset"]
                  offset = global_["offset"]
                  score = onset["f1"] + offset["f1"]
                  candidates.append((score, threshold, payload))
              _, threshold, payload = max(candidates, key=lambda row: (row[0], -float(row[1])))
              global_ = payload["aggregates"]["global"]
              comp = payload["aggregates"]["comp"]["onset"]
              solo = payload["aggregates"]["solo"]["onset"]
              onset = global_["onset"]
              offset = global_["offset"]
              print(epoch, threshold, onset["prediction"], f'{onset["precision"]:.6f}', f'{onset["recall"]:.6f}', f'{onset["f1"]:.6f}', offset["prediction"], f'{offset["precision"]:.6f}', f'{offset["recall"]:.6f}', f'{offset["f1"]:.6f}', f'{solo["precision"]:.6f}', f'{solo["recall"]:.6f}', f'{comp["precision"]:.6f}', f'{comp["recall"]:.6f}')
          PY

      - name: Upload V8.2 pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v82-pilot
          path: |
            model/v82-smoke.log
            model/v82-pilot-train.log
            model/v82-pilot-epoch-*-sweep.log
            model/v82-pilot-epoch-*-sweep.json
            model/causal-boundaries-v82-pilot.keras
            model/causal-boundaries-v82-pilot.epoch-*.keras
          if-no-files-found: warn
          retention-days: 7
