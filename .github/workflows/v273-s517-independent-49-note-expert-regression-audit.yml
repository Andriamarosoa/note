name: S517 independent replay of learned 49-pitch raw WAV note experts, all regressions and F1
on:
  push:
    branches: [codex/s515-frame-onset-harmonic-note-experts]
    paths:
      - scripts/s517_independent_true_note_F1_replay_of_raw_harmonic_expert.py
      - .github/workflows/v273-s517-independent-49-note-expert-regression-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify_eight_true_trained_recordingheld_pitch_experts_and_musical_note_sets:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical independent F1/Exact-K benchmark only (no training)
        run: python -m pip install numpy==1.26.4
      - name: Verify wrong notes at correct K still count regressions
        run: |
          python -m py_compile scripts/s517_independent_true_note_F1_replay_of_raw_harmonic_expert.py
          python -m scripts.s517_independent_true_note_F1_replay_of_raw_harmonic_expert --self-test
      - name: Restore unchanged original 8 source S505 true matched note sets from before S516
        run: |
          gh run download 38596480284 -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table -D model/S505 --repo "${{ github.repository }}"
      - name: Restore all 8 genuine trained raw note experts and their per-pitch probabilities
        run: |
          gh run download 38610795544 \
            -n s516-real-trained-49-pitch-independent-WAV-note-generator-eight-recording-held-F1-and-regressions \
            -D model/S516 --repo "${{ github.repository }}"
      - name: Independently replay and validate every MIDI note probability, source K, true note F1, chord fixes/regressions and checkpoint SHA
        run: |
          python -u -m scripts.s517_independent_true_note_F1_replay_of_raw_harmonic_expert \
            --source model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --source-report model/S505/report.json \
            --study-report model/S516/report.json \
            --predictions model/S516/S516_REAL_HELD_RECORDING_EVERY_PITCH_PROBABILITY.jsonl \
            --models model/S516 --out model/S517
          python - <<'PY'
          import json
          r=json.load(open('model/S517/report.json'))
          assert r['status']=='S517_EIGHT_SHA_VERIFIED_RAW_WAV_GENERATOR_NOTE_REPLAY'
          assert r['trained_original_8_fold_model_SHA_verified']
          assert r['independently_recomputed_all_full_chords_and_pitch_F1']
          assert r['conditional_positive_onset_note_F1_not_event_F1']
          assert r['previously_exposed_not_new_blind']
          assert r['no_promotion'] and r['source_S80_Live_not_modified']
          print('S517 true per-note 49 candidate source F1 checked across eight SHA trained models; no unsafe promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s517-eight-real-trained-49-MIDI-note-experts-independent-full-chord-F1-and-K-audit
          path: model/S517/
          retention-days: 90
