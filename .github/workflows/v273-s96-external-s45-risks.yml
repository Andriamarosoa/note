name: S96 original S45 Ridge label-blind runtime test
on:
  pull_request:
    branches: [codex/v273-regression-loops]
    paths:
      - 'scripts/s96_external_s45_risk_runtime.py'
      - '.github/workflows/v273-s96-external-s45-risks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate original model feature contract
        env:
          PYTHONPATH: '.:src'
        run: python -m scripts.s96_external_s45_risk_runtime --self-test
