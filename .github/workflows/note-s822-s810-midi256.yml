name: S822 S810-style 23-vs-61 independent ActiveK on TRUE native MIDI256 FIT80
on:
  push:
    branches: [codex/note-s822-s810-style-midi256-ablation]
    paths:
      - src/causal_note/s822_s810_style_teacher.py
      - scripts/s822_retrain_s810_midi256.py
      - test/test_s822_s810_style_midi256.py
      - .github/workflows/note-s822-s810-midi256.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  smoke:
    name: S822 exact S810 features + causal native256 unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Validate S810 61-feature equality, independent fits and reporting
        run: |
          python -m compileall -q src/causal_note/s822_s810_style_teacher.py scripts/s822_retrain_s810_midi256.py test/test_s822_s810_style_midi256.py
          python -m unittest -v test.test_s822_s810_style_midi256 test.test_s815_activek_teacher test.test_s813_native256 test.test_s809_axis_isolation
          python -m scripts.verify_series_reports --series S822
  real_fit80:
    name: Genuine 80 original GuitarSet recordings native 256
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-s813.txt
      - name: Recover source S800 real MIDI256 events and 80 annotations by SHA
        run: |
          mkdir -p /tmp/s822/manifest /tmp/s822/traces
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s822/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s822/traces
          SOURCE="$(find /tmp/s822/manifest -name report.json -type f -print -quit)"
          TRACE="$(find /tmp/s822/traces -name fit_000.json -type f -print -quit)"
          test -s "$SOURCE"
          test -s "$TRACE"
          printf '%s\n' "$SOURCE" > /tmp/s822/manifest_path
          printf '%s\n' "$(dirname "$TRACE")" > /tmp/s822/traces_path
      - name: Download original SHA-pinned real mono PCM GuitarSet 44.1kHz
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request
          src=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())['guitar_archives']['GuitarSet_audio']
          dest=Path('/tmp/s822/GuitarSet_audio.zip')
          with urllib.request.urlopen(src['url'],timeout=180) as request,dest.open('wb') as output:
              while packet:=request.read(4*1024*1024):output.write(packet)
          assert dest.stat().st_size==src['size']
          digest=hashlib.sha256()
          with dest.open('rb') as inp:
              for chunk in iter(lambda:inp.read(4*1024*1024),b''):digest.update(chunk)
          assert digest.hexdigest()==src['sha256']
          print('S822_ORIGINAL_AUDIO_SHA256',digest.hexdigest(),flush=True)
          PY
      - name: Extract fresh 256-sample actual PCM features and 249411 active labels
        run: |
          python -m scripts.s813_prepare_native256 --manifest "$(cat /tmp/s822/manifest_path)" --traces "$(cat /tmp/s822/traces_path)" --audio-zip /tmp/s822/GuitarSet_audio.zip --out /tmp/s822/fresh256 --workers 2
      - name: Fit controlled S810-style raw23 vs aggregate61 models per composition
        run: |
          python -m scripts.s822_retrain_s810_midi256 --cache /tmp/s822/fresh256 --traces "$(cat /tmp/s822/traces_path)" --out /tmp/s822/result
      - name: Check five fully independent folds same MIDI256 denominators and source H0
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s822/result/report.json'))
          assert r['complete'] and r['schema']=='S822_S810_STYLE_AGG61_ABLATION_NATIVE_MIDI256_FIT80_V1'
          assert len(r['folds'])==5 and len(r['tracks'])==80
          assert (r['feature_hop_samples'],r['decision_hop_samples'],r['metric_hop_samples'])==(256,256,256)
          assert r['original_fit80_active_k']['correct']==142213
          for key in ('raw23_active_k','agg61_active_k','cal_chosen_active_k'):
              assert r[key]['frames']==249411
              assert r[key]['correct']+r[key]['undercount']+r[key]['overcount']==249411
          assert not r['historical_s810_original_1024_channel_abi_equal']
          assert r['s810_style_61_aggregation_equal']
          assert not r['unification_gate']['allow_unification']
          assert not any(r[k] for k in ('promotion','CAL_opened','HELD_opened','TEST_opened',
             'production_LIVE_modified','other_five_axes_modified','unified_midi_measured',
             'added_lookahead_samples','added_hold_samples'))
          print('S822_TRUE_256_RECORD',json.dumps({
             'raw23':r['raw23_active_k'],'agg61':r['agg61_active_k'],
             'selected_by_CAL':r['cal_chosen_active_k'],
             'H0':r['original_fit80_active_k'],
             'gain_61_over_23_pp':r['delta_agg_minus_raw_pp']},
             sort_keys=True),flush=True)
          print('S822_NO_PROMOTION_NO_LIVE_CHANGE',flush=True)
          PY
      - name: Archive all true models predictions and signatures; keep baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S822_REAL_MIDI256_S810_STYLE_RAW23_AGG61_FIT80
          path: |
            /tmp/s822/result/report.json
            /tmp/s822/result/models/
            /tmp/s822/result/predictions/
            /tmp/s822/fresh256/report.json
          retention-days: 45
          if-no-files-found: warn
