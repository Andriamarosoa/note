name: S233 official frozen V84-to-V88 plus freeze_local_combo on untouched IDMT ranks33to48
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s233_official_freeze_on_IDMT_rank33to48.py'
      - '.github/workflows/v273-s233-real-official-freeze-IDMT-ranks33to48.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s233-real-original-official-freeze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual_official_incumbent_native_V8:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original V8 and official count weights ABI
        run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Fetch original candidate stack models SHA-pinned reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
            --repo ${{ github.repository }} \
            --pattern v273-rebuilt-proposal-sources.zip \
            --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
            Path('model/original-sources'),
            'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
            validate=validate_sources)
          PY
      - name: Fetch official unchanged freeze_local_combo original checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/freeze-original model/freeze-download
          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo ${{ github.repository }} \
            --pattern v273-uniform-anchored-freeze-result.tgz \
            --dir model/freeze-download
          tar -xzf model/freeze-download/v273-uniform-anchored-freeze-result.tgz -C model/freeze-original
          test -s model/freeze-original/freeze_local_combo.weights.h5
      - name: S231 untouched original 16 sealed WAV hashes and song identities
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38299545404
          name: s231-IDMT-ranks33to48-unopened-song-WAV-feature-hash-preseal
          path: model/S231
      - name: Ensure S232 native IDMT ranks33to48 prediction artifact is completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38301241411 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: S232 original V84-native event samples, no XML
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38301241411
          name: s232-idmt-ranks33to48-original-V84-V86-native-groups-XML-unopened
          path: model/S232
      - name: Run exact frozen official reference for each song and fingerprint true V88 native groups
        run: |
          python -m py_compile scripts/s233_official_freeze_on_IDMT_rank33to48.py
          python -u -m scripts.s233_official_freeze_on_IDMT_rank33to48 \
            --sources model/original-sources \
            --weights model/freeze-original/freeze_local_combo.weights.h5 \
            --s231 model/S231/report.json \
            --s232 model/S232/IDMT_dataset2_true_V84_native_unlabeled_groups.npz \
            --out model/S233
      - name: Ensure frozen original official baseline scores are native and label-free
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          r=json.loads(Path('model/S233/report.json').read_text())
          assert r['chosen_WAV_count']==16
          assert r['original_native_V8_full_stack_used']
          assert r['original_freeze_local_combo_weights_used']
          assert r['original_official_native_event_count']>0
          assert sum(r['candidate_K_histogram'])==r['original_official_native_event_count']
          assert r['baseline_predictions_locked_before_XML_content_read']
          assert not r['new_audio_XML_content_read'] and not r['new_audio_MIDI_content_read']
          assert not r['new_data_model_fit']
          assert not r['original_S80_same_event_predictions_completed']
          assert not r['independent_paired_ExactK_scored'] and not r['official_S80_promotion']
          with np.load('model/S233/S233_official_freeze_local_combo_IDMT_new_native_16songs.npz',
                       allow_pickle=False) as z:
            n=r['original_official_native_event_count']
            assert z['incumbent_K'].shape==(n,) and z['incumbent_probabilities'].shape==(n,7)
            assert len(set(map(str,z['row_id'])))==n
            assert np.isin(z['incumbent_K'],range(7)).all()
          print('S233 PASS official actual freeze_local_combo predictions on new original native events, unscored')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s233-official-unchanged-freeze-local-combo-original-IDMT-native-reference
          path: model/S233/report.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s233-official-unchanged-freeze-local-combo-original-IDMT-native-predictions
          path: model/S233/S233_official_freeze_local_combo_IDMT_new_native_16songs.npz
          retention-days: 90
