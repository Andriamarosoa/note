name: V10.4 nested deployment audit

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v104_nested_expert.py'
      - 'scripts/eval_v104_nested_outer.py'
      - 'scripts/summarize_v104_nested.py'
      - '.github/workflows/v104-nested-deployment-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  prepare:
    name: Prepare frozen train-only inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile nested audit scripts
        run: python -m py_compile scripts/train_v104_nested_expert.py scripts/eval_v104_nested_outer.py scripts/summarize_v104_nested.py

      - name: Download frozen V10 spectral caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v100-spectral-cache
          for shard in 0 1 2 3 4 5 6 7; do
            mkdir -p "model/v100-spectral-cache/$shard"
            gh run download 33605122369 --repo "$GITHUB_REPOSITORY" --name "v100-spectral-$shard" --dir "model/v100-spectral-cache/$shard"
          done

      - name: Extract frozen train-only expert reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/nested-config /tmp/nested-config/v101 /tmp/nested-config/v102
          gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/artifacts/9842799517/zip" > /tmp/v101.zip
          gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/artifacts/9845793222/zip" > /tmp/v102.zip
          unzip -q /tmp/v101.zip -d /tmp/nested-config/v101
          unzip -q /tmp/v102.zip -d /tmp/nested-config/v102
          cp /tmp/nested-config/v101/v101-string-query-result/report.json model/nested-config/v101-report.json
          cp /tmp/nested-config/v102/v102-source-time-result/report.json model/nested-config/v102-report.json

      - name: Upload spectral bundle
        uses: actions/upload-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          compression-level: 0
          retention-days: 7

      - name: Upload config bundle
        uses: actions/upload-artifact@v4
        with:
          name: v104-nested-config
          path: model/nested-config
          compression-level: 6
          retention-days: 7

  inner:
    name: Inner OOF ${{ matrix.pair }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        pair:
          - '0-1'
          - '0-2'
          - '0-3'
          - '0-4'
          - '1-0'
          - '1-2'
          - '1-3'
          - '1-4'
          - '2-0'
          - '2-1'
          - '2-3'
          - '2-4'
          - '3-0'
          - '3-1'
          - '3-2'
          - '3-4'
          - '4-0'
          - '4-1'
          - '4-2'
          - '4-3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache

      - uses: actions/download-artifact@v4
        with:
          name: v104-nested-config
          path: model/nested-config

      - name: Train inner experts and predict inner plus outer probe
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
          PAIR: ${{ matrix.pair }}
        shell: bash
        run: |
          set -o pipefail
          IFS=- read OUTER INNER <<< "$PAIR"
          python -B scripts/train_v104_nested_expert.py \
            --cache-dir model/v100-spectral-cache \
            --v101-report model/nested-config/v101-report.json \
            --v102-report model/nested-config/v102-report.json \
            --mode inner \
            --outer-fold "$OUTER" \
            --inner-fold "$INNER" \
            --seed "$((10491 + OUTER*100 + INNER))" \
            --output-dir "model/nested-inner-o${OUTER}-i${INNER}" \
            2>&1 | tee "model/nested-inner-o${OUTER}-i${INNER}.log"

      - name: Verify outer isolation
        env:
          PAIR: ${{ matrix.pair }}
        shell: bash
        run: |
          IFS=- read OUTER INNER <<< "$PAIR"
          python - <<PY
          import json
          from pathlib import Path
          r=json.loads(Path('model/nested-inner-o${OUTER}-i${INNER}/v104-nested-outer-${OUTER}-inner-${INNER}.json').read_text())
          assert r['protocol']['historical_validation_or_locked_evaluated'] is False
          assert r['protocol']['outer_fold_used_for_expert_training'] is False
          assert r['protocol']['inner_held_fold_used_for_expert_training'] is False
          assert r['outer_probe_npz'] is not None
          print(r['data'])
          PY

      - name: Upload inner artifact
        uses: actions/upload-artifact@v4
        with:
          name: v104-nested-inner-o${{ strategy.job-index }}-${{ matrix.pair }}
          path: |
            model/nested-inner-o*-i*
            model/nested-inner-o*-i*.log
          compression-level: 6
          if-no-files-found: error
          retention-days: 7

  outer_expert:
    name: Outer deployment experts ${{ matrix.outer }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        outer: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache

      - uses: actions/download-artifact@v4
        with:
          name: v104-nested-config
          path: model/nested-config

      - name: Retrain deployment experts and predict outer fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/train_v104_nested_expert.py \
            --cache-dir model/v100-spectral-cache \
            --v101-report model/nested-config/v101-report.json \
            --v102-report model/nested-config/v102-report.json \
            --mode outer \
            --outer-fold ${{ matrix.outer }} \
            --seed $((10791 + ${{ matrix.outer }})) \
            --output-dir model/nested-outer-${{ matrix.outer }} \
            2>&1 | tee model/nested-outer-${{ matrix.outer }}.log

      - name: Verify outer isolation
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          o=os.environ['OUTER']
          r=json.loads(Path(f'model/nested-outer-{o}/v104-nested-outer-{o}-deploy.json').read_text())
          assert r['protocol']['historical_validation_or_locked_evaluated'] is False
          assert r['protocol']['outer_fold_used_for_expert_training'] is False
          print(r['data'])
          PY
        env:
          OUTER: ${{ matrix.outer }}

      - name: Upload outer expert artifact
        uses: actions/upload-artifact@v4
        with:
          name: v104-nested-outer-expert-${{ matrix.outer }}
          path: |
            model/nested-outer-${{ matrix.outer }}
            model/nested-outer-${{ matrix.outer }}.log
          compression-level: 6
          if-no-files-found: error
          retention-days: 7

  eval:
    name: Evaluate outer ${{ matrix.outer }}
    needs: [inner, outer_expert]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        outer: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache

      - name: Download inner artifacts for this outer fold
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-inner-*-${{ matrix.outer }}-*
          path: model/nested-input/inner
          merge-multiple: true

      - name: Download deployment expert artifact
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-outer-expert-${{ matrix.outer }}
          path: model/nested-input/outer

      - name: Evaluate deployment-matched outer fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/eval_v104_nested_outer.py \
            --cache-dir model/v100-spectral-cache \
            --inner-dir model/nested-input/inner \
            --outer-dir model/nested-input/outer \
            --outer-fold ${{ matrix.outer }} \
            --seed $((10521 + ${{ matrix.outer }})) \
            --output-dir model/nested-eval-${{ matrix.outer }} \
            2>&1 | tee model/nested-eval-${{ matrix.outer }}.log

      - name: Verify no locked evaluation
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          o=os.environ['OUTER']
          r=json.loads(Path(f'model/nested-eval-{o}/v104-nested-eval-{o}.json').read_text())
          assert r['protocol']['historical_validation_or_locked_evaluated'] is False
          assert r['protocol']['outer_fold_seen_by_any_expert_training'] is False
          assert r['protocol']['outer_fold_seen_by_fusion_training_or_epoch_selection'] is False
          print(r['outer_metrics'])
          print(r['retraining_effect_same_outer_rows'])
          PY
        env:
          OUTER: ${{ matrix.outer }}

      - name: Upload outer evaluation
        uses: actions/upload-artifact@v4
        with:
          name: v104-nested-eval-${{ matrix.outer }}
          path: |
            model/nested-eval-${{ matrix.outer }}
            model/nested-eval-${{ matrix.outer }}.log
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Summarize nested deployment audit
    needs: eval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install 'numpy<2.0'

      - uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/nested-evals
          merge-multiple: true

      - name: Aggregate five outer folds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v104-nested-summary
          python -B scripts/summarize_v104_nested.py \
            --input-dir model/nested-evals \
            --output model/v104-nested-summary/report.json \
            2>&1 | tee model/v104-nested-summary/summary.log

      - name: Verify train-only nested protocol and print result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v104-nested-summary/report.json').read_text())
          assert r['protocol']['historical_validation_or_locked_evaluated'] is False
          assert r['protocol']['exact_one_time_outer_coverage'] is True
          print('aggregate', r['aggregate_metrics'])
          print('cardinality', r['aggregate_cardinality'])
          print('retraining_effect', r['retraining_effect'])
          print('by_player', r['by_player'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v104-nested-deployment-audit
          path: model/v104-nested-summary
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
