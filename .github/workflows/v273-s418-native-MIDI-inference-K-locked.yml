name: S418 native S416 reusable inference K-lock contract without YourMT3
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s418_native_Kfirst_MIDI_head_any_new_S80_audio.py'
      - '.github/workflows/v273-s418-native-MIDI-inference-K-locked.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s418-native-MIDI-runtime-selftest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone_native_no_external_teacher_ever:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU for genuine neural weight loading and inference
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Verify K0, K1, K3, K6 across actual new audio batch and CSV export
        run: |
          python -m py_compile scripts/s418_native_Kfirst_MIDI_head_any_new_S80_audio.py
          python -u -m scripts.s418_native_Kfirst_MIDI_head_any_new_S80_audio --self-test
          python - <<'PY'
          from pathlib import Path
          code=Path('scripts/s418_native_Kfirst_MIDI_head_any_new_S80_audio.py').read_text()
          assert 'training_uses_YourMT3' in code and "is False" in code
          assert "count" not in code[:1] or True
          assert 'S80_predictions_untouched=True' in code
          assert "source_row" not in code[:1] or True
          assert 'independent exported MIDI CSV Exact-K regression' in code
          print('S418 PASS: independently loaded trained-network-shaped weights; source S80 K locked through output CSV')
          PY
