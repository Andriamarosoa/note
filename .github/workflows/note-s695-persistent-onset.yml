name: S695 repeated past-only note attack evidence for real GuitarSet
on:
  push:
    branches: [codex/note-s695-causal-onset-persistence]
    paths:
      - scripts/s695_causal_persistent_onset.py
      - scripts/s695_onset_persistence_four_lock.py
      - test/test_s695_persistent_onset.py
      - .github/workflows/note-s695-persistent-onset.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s695-temporal-persistence
  cancel-in-progress: true
jobs:
  source_future_free_onset:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original causal native NOTE dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Compile plus proof no backdated note release
        run: |
          python -m compileall -q scripts/s695_causal_persistent_onset.py scripts/s695_onset_persistence_four_lock.py
          python -m unittest -v test.test_s695_persistent_onset
      - name: Source frozen S675 release model
        run: |
          mkdir -p /tmp/s695_s675
          gh run download 39056766998 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s695_s675
          test -f /tmp/s695_s675/s675_hazard.joblib
          test -f /tmp/s695_s675/s675_checkpoint.json
      - name: Genuine GuitarSet nine TRAIN compositions and independent DEV four locks
        run: python -m scripts.s695_onset_persistence_four_lock --out /tmp/s695 --checkpoint /tmp/s695_s675/s675_hazard.joblib
      - name: Save all observed full-note and K evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S695_PAST_ONLY_CONSECUTIVE_ONSET_NOTE_HEAD
          path: /tmp/s695/report.json
          if-no-files-found: warn
          retention-days: 60
