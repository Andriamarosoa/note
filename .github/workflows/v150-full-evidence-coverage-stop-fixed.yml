name: V15 full-evidence coverage STOP outer-clean fixed

on:
  push:
    branches: [v8-anonymous-cardinality]
    paths:
      - 'scripts/train_v150_full_evidence_coverage_stop.py'
      - 'scripts/summarize_v150_full_evidence_coverage_stop.py'
      - '.github/workflows/v150-full-evidence-coverage-stop-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  SOURCE_NESTED_RUN: '33647694565'
  SOURCE_V13_RUN: '33721052619'

jobs:
  preflight:
    name: V15 fixed architecture preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Compile V15
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile scripts/train_v150_full_evidence_coverage_stop.py
          python -m py_compile scripts/summarize_v150_full_evidence_coverage_stop.py
      - name: Build and audit V15 Keras graph
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          python - <<'PY'
          from scripts import train_v150_full_evidence_coverage_stop as v
          model, weights, shape = v._build_model()
          assert v.STEPS == 6
          assert isinstance(model.output, dict)
          keys=set(model.output.keys())
          assert 'v140_count_norm' in keys
          for q in range(6):
              assert f'v140_continue_{q}' in keys
              assert f'v140_event_time_{q}' in keys
              assert f'v140_event_candidate_{q}' in keys
              assert f'v140_tf_mass_{q}' in keys
              assert f'v140_residual_tf_{q}' in keys
              assert model.get_layer(f'v150_step_{q}_tf_full_pool') is not None
              assert model.get_layer(f'v150_step_{q}_tf_novel_pool') is not None
              if q < 5:
                  assert model.get_layer(f'v150_step_{q}_tf_coverage_after') is not None
          print('params', model.count_params(), 'tf_shape', shape, 'outputs', len(keys))
          PY

  fold:
    name: V15 fixed outer fold ${{ matrix.fold }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify GuitarSet checksums
        shell: bash
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Download frozen nested spectral bundle
        uses: actions/download-artifact@v4
        with:
          name: v104-nested-spectral-bundle
          path: model/v100-spectral-cache
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download outer-clean V10 baselines
        uses: actions/download-artifact@v4
        with:
          pattern: v104-nested-eval-*
          path: model/v104-nested-eval
          merge-multiple: false
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_NESTED_RUN }}
          github-token: ${{ github.token }}
      - name: Download frozen V13 fold
        uses: actions/download-artifact@v4
        with:
          name: v130-event-set-fold-${{ matrix.fold }}
          path: model/v130-frozen/fold-${{ matrix.fold }}
          repository: Andriamarosoa/note
          run-id: ${{ env.SOURCE_V13_RUN }}
          github-token: ${{ github.token }}
      - name: Train and evaluate outer-clean V15 fold
        env:
          PYTHONPATH: .:src
          TF_CPP_MIN_LOG_LEVEL: '2'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "model/v150-fold-${{ matrix.fold }}"
          python -B scripts/train_v150_full_evidence_coverage_stop.py \
            --cache-dir model/v100-spectral-cache \
            --baseline-eval-dir model/v104-nested-eval \
            --v130-dir model/v130-frozen \
            --outer-fold "${{ matrix.fold }}" \
            --output-dir "model/v150-fold-${{ matrix.fold }}" \
            2>&1 | tee "model/v150-fold-${{ matrix.fold }}/train.log"
      - name: Verify V15 fold protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f='${{ matrix.fold }}'
          r=json.loads(Path(f'model/v150-fold-{f}/report-fold-{f}.json').read_text())
          p=r['protocol']
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['outer_fold_used_for_training'] is False
          assert p['outer_fold_used_for_epoch_selection'] is False
          assert p['runtime_inputs_use_annotations'] is False
          assert p['categorical_cardinality_head_exists'] is False
          assert p['conditional_continue_training'] is True
          assert p['coverage_memory_uses_predictions_not_annotations'] is True
          assert p['destructive_explaining_away'] is False
          assert p['full_evidence_visible_every_step'] is True
          assert p['novelty_memory'] is True
          assert p['stop_threshold_tuned'] is False and p['stop_threshold'] == 0.5
          print('fold',f,'epochs',r['data']['selected_epochs'],
                'v104',r['strata']['aggregate']['v104']['metrics']['global']['f1'],
                'v130',r['strata']['aggregate']['v130']['metrics']['global']['f1'],
                'v150',r['strata']['aggregate']['v150']['metrics']['global']['f1'],
                'k5',r['per_true_k']['5']['v150']['exact'],
                'k6',r['per_true_k']['6']['v150']['exact'])
          PY
      - name: Upload V15 fold
        uses: actions/upload-artifact@v4
        with:
          name: v150-full-evidence-coverage-fold-${{ matrix.fold }}
          path: model/v150-fold-${{ matrix.fold }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Summarize V15 fixed outer-clean
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install summary dependency
        run: python -m pip install numpy
      - name: Download V15 folds
        uses: actions/download-artifact@v4
        with:
          pattern: v150-full-evidence-coverage-fold-*
          path: model/v150-folds
          merge-multiple: false
      - name: Summarize five folds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p model/v150-summary
          python -B scripts/summarize_v150_full_evidence_coverage_stop.py \
            --input-dir model/v150-folds \
            --output-dir model/v150-summary \
            2>&1 | tee model/v150-summary/summary.log
      - name: Verify aggregate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('model/v150-summary/report.json').read_text())
          p=r['protocol']
          assert p['five_outer_composition_folds'] is True
          assert p['every_row_evaluated_once_outer_clean'] is True
          assert p['historical_validation_or_locked12_indexed_or_evaluated'] is False
          assert p['conditional_stop_decoder'] is True
          assert p['destructive_explaining_away'] is False
          assert p['full_evidence_visible_every_step'] is True
          assert p['coverage_novelty_memory'] is True
          assert p['stop_threshold_tuned'] is False
          print('clusters',r['data']['clusters'])
          print('v104',r['strata']['aggregate']['v104']['metrics']['global']['f1'])
          print('v130',r['strata']['aggregate']['v130']['metrics']['global']['f1'])
          print('v150',r['strata']['aggregate']['v150']['metrics']['global']['f1'])
          print('q4+',r['conditional_steps']['4']['mean_probability_positive'])
          print('q5+',r['conditional_steps']['5']['mean_probability_positive'])
          print('promotion',r['comparison']['promotion_candidate'])
          PY
      - name: Upload V15 summary
        uses: actions/upload-artifact@v4
        with:
          name: v150-full-evidence-coverage-summary
          path: model/v150-summary
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
