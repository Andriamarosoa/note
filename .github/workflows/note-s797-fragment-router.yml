name: S797 causal fragment-router five loops six independent audits
on:
  push:
    branches: [codex/note-s797-fragment-router-six-audit-loops]
    paths:
      - src/causal_note/s797_fragment_router.py
      - scripts/s797_fragment_loop_fixture.py
      - scripts/s797_fragment_loops.py
      - scripts/s797_six_role_audits.py
      - test/test_s797_fragment_router.py
      - series/S797/resume.md
      - series/S797/resultat.md
      - .github/workflows/note-s797-fragment-router.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
jobs:
  fragment_loop_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU dependencies (no model training)
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm five causal fragment ablations and zero-delay native MIDI
        run: |
          python -m compileall -q src/causal_note/s797_fragment_router.py scripts/s797_fragment_loop_fixture.py scripts/s797_fragment_loops.py scripts/s797_six_role_audits.py
          python -m unittest -v test.test_s797_fragment_router test.test_s795_activek_experts test.test_s793_zero_added_latency
          python -m scripts.s797_fragment_loops --out /tmp/s797/loops.json
          python -m scripts.verify_series_reports --series S797
      - name: Reuse already computed S795 FIT80 artifact — no retraining
        run: |
          mkdir -p /tmp/s797/s795
          gh run download 39340511467 --repo Andriamarosoa/note             --name S795_ACTIVEK_MULTIHEAD_REAL_MIDI256_FIT80_CAL32             --dir /tmp/s797/s795
          test -s /tmp/s797/s795/experiment/report.json
      - name: Archive immutable five-loop fixture and original failed FIT results
        uses: actions/upload-artifact@v4
        with:
          name: S797_FIVE_SYNTHETIC_LOOPS_WITH_FROZEN_S795
          path: |
            /tmp/s797/loops.json
            /tmp/s797/s795/experiment/report.json
          retention-days: 45
  six_audits:
    needs: fragment_loop_smoke
    name: S797 independent ${{ matrix.role }} audit
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: S797_FIVE_SYNTHETIC_LOOPS_WITH_FROZEN_S795
          path: /tmp/s797/archive
      - name: Independent ${{ matrix.role }} checks
        run: |
          python -m scripts.s797_six_role_audits             --role ${{ matrix.role }}             --smoke /tmp/s797/archive/loops.json             --failed "$(find /tmp/s797/archive -name report.json -type f -print -quit)"             --router src/causal_note/s797_fragment_router.py             --out /tmp/s797/audits/role_${{ matrix.role }}.json
      - name: Preserve independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S797_AUDIT_${{ matrix.role }}
          path: /tmp/s797/audits/role_${{ matrix.role }}.json
          retention-days: 45
  consensus:
    if: always()
    needs: [fragment_loop_smoke, six_audits]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S797_AUDIT_*
          path: /tmp/s797/audits
          merge-multiple: true
      - name: Fail closed without six PASS reports
        run: |
          python -m scripts.s787_audit_consensus             --reports-dir /tmp/s797/audits             --out /tmp/s797/consensus/report.json
      - name: Preserve six-audit consensus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S797_SIX_ROLE_CONSENSUS
          path: |
            /tmp/s797/audits/role_*.json
            /tmp/s797/consensus/report.json
          retention-days: 45
          if-no-files-found: warn
