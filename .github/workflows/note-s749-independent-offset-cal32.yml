name: S749 independent causal supplemental Offset FIT80 CAL32
on:
  push:
    branches: [codex/note-s749-independent-offset-head-fit-cal32]
    paths:
      - src/causal_note/s747_independent_heads.py
      - scripts/s749_independent_offset_fit_cal_loops.py
      - test/test_s749_independent_offset.py
      - test/test_s747_independent_heads.py
      - scripts/s747_independent_head_fit_cal_loops.py
      - scripts/s746_instance_safe_fit_cal_loops.py
      - test/test_s747_independent_heads.py
      - .github/workflows/note-s749-independent-offset-cal32.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s749-independent-offset-fit-cal32
  cancel-in-progress: true
jobs:
  fit80_independent_heads_and_twelve_full_note_cal32_loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install signed NOTE runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify causal independent head and protected native event tests
        run: |
          python -m compileall -q src/causal_note/s747_independent_heads.py scripts/s749_independent_offset_fit_cal_loops.py scripts/s746_instance_safe_fit_cal_loops.py
          python -m unittest -v test.test_s749_independent_offset test.test_s747_independent_heads test.test_s746_instance_guard test.test_s743_fundamental_router
      - name: Recover original S708 S707 S734 checkpoints
        run: |
          mkdir -p /tmp/s747/s708 /tmp/s747/s707 /tmp/s747/s734
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s747/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s747/s707
          gh run download 39137653526 --repo "Andriamarosoa/note" --name S734_ONSET_INDIVIDUAL_NEURAL_EXACTK_LINKED_FIT_CAL_HELD_DEV --dir /tmp/s747/s734
          test -s /tmp/s747/s708/report.json
          test -s /tmp/s747/s708/s708_selected.pt
          test -s /tmp/s747/s707/s675_hazard.joblib
          test -s /tmp/s747/s734/report.json
          test -s /tmp/s747/s734/s733_onset.pt
      - name: FIT independent birth models and evaluate 12 Offset specialist MIDI CAL32 loops
        run: |
          python -m scripts.s749_independent_offset_fit_cal_loops \
            --s708-dir /tmp/s747/s708 \
            --s734-checkpoint /tmp/s747/s734/s733_onset.pt \
            --s734-report /tmp/s747/s734/report.json \
            --offset-checkpoint /tmp/s747/s707/s675_hazard.joblib \
            --out /tmp/s747/output
      - name: Prove six-score and every NoteOff instance guard
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/s747/output/report.json').read_text())
          assert r['complete'] and r['loops']==12 and len(r['CAL'])==12
          assert r['schema']=='S749_INDEPENDENT_SUPPLEMENTAL_OFFSET_FIT80_CAL32'
          assert r['selected']=='S708_frozen' and not r['promoted']
          assert r['proposal_generator'].endswith('source_fit_proposals')
          assert len({v['offset_specialist'] for v in r['param_grid'].values()})==3
          assert r['baseline_parity']['valid']
          assert r['original_release_unchanged']
          assert not r['event_truth_used_at_inference']
          assert not r['LIVE_changed'] and not r['TEST_opened']
          for name,v in r['CAL'].items():
              assert len(v['scores'])==6 and len(v['delta'])==6
              assert v['baseline_events_preserved']
              assert not v['six_gt80'] or v['safe']
          print('S749_OFFSET_12_SIX_METRICS',json.dumps({
              'reference':r['reference_scores'],
              'CAL_candidate':r['CAL_candidate'],
              'all_12':r['CAL']}))
          PY
      - name: Publish evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S749_INDEPENDENT_OFFSET_FIT80_CAL32_12_LOOPS
          path: |
            /tmp/s747/output/report.json
            /tmp/s747/output/s746_depth*.joblib
          retention-days: 45
          if-no-files-found: warn
