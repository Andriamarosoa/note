name: V27.3 Fresh Player05 Independent Validation
on:
  push:
    branches: [codex/v273-failure-clustering]
    paths: ['analysis/v273-fresh-player05-launch.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a
  TAG: v273-fresh-player05-${{ github.run_id }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - run: python -m py_compile scripts/evaluate_v273_fresh_player05.py
      - uses: actions/cache@v4
        id: gs
        with:
          path: data/GuitarSet
          key: "${{ env.GUITARSET_CACHE_KEY }}"
      - if: steps.gs.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -
      - name: Restore frozen proposal stack
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p model/download
          gh release download v273-source-recovery-35086829802 --repo "${{ github.repository }}" --pattern v273-rebuilt-proposal-sources.zip --dir model/download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/download/v273-rebuilt-proposal-sources.zip'),
                           Path('model/sources'),
                           'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
                           validate=validate_sources)
          PY
      - name: Restore frozen count model, internal bundle and selected feature report
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p model/bundle model/uniform model/freeze model/features model/download
          gh release download v273-window-pair-36351028493 --repo "${{ github.repository }}" --pattern native-window-bundle.zip --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          gh release download v273-loss-weighting-37208199201 --repo "${{ github.repository }}" --pattern v273-loss-weighting-uniform.tgz --dir model/download
          tar -xzf model/download/v273-loss-weighting-uniform.tgz -C model/uniform
          gh release download v273-uniform-anchored-freeze-37233793945 --repo "${{ github.repository }}" --pattern v273-uniform-anchored-freeze-result.tgz --dir model/download
          tar -xzf model/download/v273-uniform-anchored-freeze-result.tgz -C model/freeze
          gh release download v273-residual-feature-family-lofo-37547761255 --repo "${{ github.repository }}" --pattern report.json --dir model/features
      - name: Run one-shot player05 validation
        run: |
          python -B scripts/evaluate_v273_fresh_player05.py             --source-dir model/sources             --dataset data/GuitarSet             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-weights model/uniform/uniform.weights.h5             --freeze-weights model/freeze/freeze_local_combo.weights.h5             --feature-report model/features/report.json             --protocol analysis/v273-fresh-player05-protocol.md             --output model/result
      - name: Publish immutable fresh validation
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease             --title "V27.3 fresh player05 independent validation"             --notes-file model/result/report.md
          gh release upload "$TAG" model/result/report.json model/result/report.md             model/result/predictions-before-labels.npz model/result/prediction-sha256.txt             model/result/scored-predictions.npz --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-fresh-player05-results
          path: model/result/
          retention-days: 90
