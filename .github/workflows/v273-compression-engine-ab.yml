name: V27.3 Compression Engine A/B

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-compression-engine-ab-launch.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        val_fold: [0, 1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime and pitch engines
        run: |
          sudo apt-get update
          sudo apt-get install -y rubberband-cli
          python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
          python -m pip install librosa==0.10.2.post1 soxr==0.3.7 pyrubberband==0.4.0 soundfile
          rubberband --version

      - name: Validate scripts
        run: |
          python -m py_compile scripts/audit_v273_compression_engine_ab.py
          python -m py_compile scripts/summarize_v273_compression_engine_ab.py

      - name: Restore official GuitarSet cache
        id: guitarset-cache
        uses: actions/cache@v4
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}

      - name: Download GuitarSet when cache misses
        if: steps.guitarset-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip

      - name: Verify GuitarSet checksums
        run: |
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
          echo "aecce79f425a44e2055e46f680e10f6a  data/GuitarSet/audio_mono-pickup_mix.zip" | md5sum -c -

      - name: Restore bundle and internal checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/folds
          gh release download v273-window-pair-36351028493 \
            --repo "${{ github.repository }}" \
            --pattern native-window-bundle.zip \
            --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle
          gh release download v273-candidate-hidden1-multifold-37271262794 \
            --repo "${{ github.repository }}" \
            --pattern v273-candidate-hidden1-multifold-folds.tgz \
            --dir model/download
          tar -xzf model/download/v273-candidate-hidden1-multifold-folds.tgz -C model/folds

      - name: Run x2/x4 compression A/B
        run: >-
          python -B scripts/audit_v273_compression_engine_ab.py
          --dataset-dir data/GuitarSet
          --bundle model/bundle
          --config analysis/v273-native-paired-config.json
          --fold-root model/folds
          --val-fold ${{ matrix.val_fold }}
          --output model/result-${{ matrix.val_fold }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-compression-engine-ab-fold-${{ matrix.val_fold }}
          path: model/result-${{ matrix.val_fold }}/
          retention-days: 90

  summarize:
    needs: fold
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: v273-compression-engine-ab-fold-*
          path: model/results

      - name: Aggregate compression comparison
        run: >-
          python -B scripts/summarize_v273_compression_engine_ab.py
          --input-root model/results
          --output model/summary

      - name: Show result
        run: cat model/summary/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-compression-engine-ab-summary
          path: model/summary/
          retention-days: 90
