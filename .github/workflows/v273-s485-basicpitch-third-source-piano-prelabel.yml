name: S485 frozen pretrained Basic Pitch third-source piano note names prelabel
on:
  push:
    branches: [codex/s485-basicpitch-third-source-contrast]
    paths:
      - scripts/s485_freeze_real_MAESTRO_basic_pitch_pretrained_note_names.py
      - .github/workflows/v273-s485-basicpitch-third-source-piano-prelabel.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s485-pretrained-independent-piano-note-names-${{ github.ref }}
  cancel-in-progress: true
jobs:
  third_source_piano_polyphonic_audio_to_named_notes_independent_pretrained:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install known-original independent polyphonic note transformer model, fixed decoder thresholds
        run: |
          python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2
      - name: Assert real sound to pitch name mapping E3 G3 B3 without file MIDI
        run: |
          python -m py_compile scripts/s485_freeze_real_MAESTRO_basic_pitch_pretrained_note_names.py
          python -m scripts.s485_freeze_real_MAESTRO_basic_pitch_pretrained_note_names --self-test
      - name: Restore SHA-pinned original third MAESTRO 3 piano tracks and original real pretrained V88 WAV proof
        run: |
          gh run download 38558629021 \
            -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI \
            -D model/S469 --repo ${{ github.repository }}
          gh run download 38559067956 \
            -n s470-third-true-MAESTRO-piano-original-V88-and-S466-birth-frozen-PREMIDI \
            -D model/S470 --repo ${{ github.repository }}
      - name: Execute frozen BasicPitch multisource trained audio to pitch note names on original WAVs WITHOUT annotations
        run: |
          python -u -m scripts.s485_freeze_real_MAESTRO_basic_pitch_pretrained_note_names \
            --manifest model/S469/report.json \
            --s470 model/S470/report.json \
            --out model/S485
          python - <<'PY'
          import json
          x=json.load(open('model/S485/report.json'))
          assert x['status']=='S485_PRETRAINED_BASIC_PITCH_NOTE_EVENTS_ON_THIRD_SOURCE_MAESTRO_PREMIDI'
          assert x['prediction_windows_piano']==3
          assert x['original_WAV_content_SHA_verified']
          assert x['output_note_names_not_MIDI_files']
          assert x['original_MAESTRO_MIDI_ANNOTATIONS_OPENED'] is False
          assert x['model_fitted_or_labels_tuned'] is False
          assert x['S80_and_live_and_offset_unchanged'] and x['no_promotion']
          print('S485 independent pretrained Piano→E3 note names SHA-frozen for genuinely original third source')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s485-spotify-basicpitch-3-original-MAESTRO-piano-audio-to-notes-frozen-PREMIDI
          path: |
            model/S485/report.json
            model/S485/S485_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl
          retention-days: 90
