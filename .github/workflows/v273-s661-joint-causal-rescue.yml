name: S661 causal S641 x2 plus S660 Tone joint notes GuitarSet
on:
  push:
    branches: [codex/s661-s641-tone-joint-selector]
    paths:
      - scripts/s661_joint_causal_selector.py
      - test/test_s661_joint_causal_selector.py
      - .github/workflows/v273-s661-joint-causal-rescue.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s661-joint-rescue-one
  cancel-in-progress: true
jobs:
  frozen_s641_tone_joint:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen NOTE dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify S661 causal selection unit tests
        run: |
          python -m compileall -q scripts/s661_joint_causal_selector.py test/test_s661_joint_causal_selector.py
          python -m unittest -v test.test_s661_joint_causal_selector
      - name: Run 36 TRAIN + 16 held TRAIN + 12 DEV GuitarSet with frozen S641 parity
        run: python -m scripts.s661_joint_causal_selector --out /tmp/s661_joint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S661_JOINT_S641_TONE_S660_GUITARSET_REAL
          path: /tmp/s661_joint/report.json
          retention-days: 60
          if-no-files-found: warn
