name: S772 compare two S770 inference attempts without retraining
on:
  push:
    branches: [codex/note-s772-cross-run-determinism-audit]
    paths:
      - scripts/s772_cross_run_determinism.py
      - test/test_s772_cross_run_determinism.py
      - .github/workflows/note-s772-determinism.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s772-cross-run-repro
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate reproducibility audit
        run: |
          python -m compileall -q scripts/s772_cross_run_determinism.py
          python -m unittest -v test.test_s772_cross_run_determinism
      - name: Download exact run artifacts by immutable ID
        run: |
          mkdir -p /tmp/s772/a /tmp/s772/b
          gh api repos/Andriamarosoa/note/actions/artifacts/12183896251/zip > /tmp/s772/a.zip
          gh api repos/Andriamarosoa/note/actions/artifacts/12184922132/zip > /tmp/s772/b.zip
          unzip -q /tmp/s772/a.zip -d /tmp/s772/a
          unzip -q /tmp/s772/b.zip -d /tmp/s772/b
          test -s /tmp/s772/a/report.json
          test -s /tmp/s772/b/report.json
      - name: Compare all FIT OOF and CAL 65 candidate predictions
        run: |
          python -m scripts.s772_cross_run_determinism \
            --first /tmp/s772/a/report.json \
            --second /tmp/s772/b/report.json \
            --out /tmp/s772/report.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/s772/report.json'))
          assert x['complete'] and not x['promoted']
          assert x['frozen_config_identical'] and x['fit_training_counts_equal']
          assert x['reference_parity_first']['valid'] is False
          assert x['reference_parity_second']['valid'] is True
          assert x['fit_scores_changed']==64 and x['cal_scores_changed']==43
          assert x['frozen_counts_change']=={'TP':-2,'FP':-1,'FN':2}
          print('S772_REPRO_NOT_BITWISE',json.dumps(x['frozen_counts_change']))
          PY
      - name: Preserve forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S772_S770_TWO_ATTEMPT_REPRO_AUDIT
          path: /tmp/s772/report.json
          retention-days: 45
          if-no-files-found: warn
