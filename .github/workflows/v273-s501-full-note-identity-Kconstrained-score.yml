name: S501 independent K-constrained real note E3 names fixes regressions on guitar and piano
on:
  push:
    branches: [codex/s500-Kconstrained-actual-note-names]
    paths:
      - scripts/s501_score_real_note_name_sets_against_source_truth.py
      - .github/workflows/v273-s501-full-note-identity-Kconstrained-score.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact_pitch_names_versus_polyphonic_truth_after_S500_note_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install note identity matching ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Verify exact note-set regressions counted independently of K cardinality
        run: |
          python -m py_compile scripts/s501_score_real_note_name_sets_against_source_truth.py
          python -m scripts.s501_score_real_note_name_sets_against_source_truth --self-test
      - name: Restore genuine named-note outputs frozen before external MIDI and XML truth
        run: |
          gh run download 38591108937 -n s500-joint-count-constrained-harmonic-ranked-pitch-names-original-S80-guitar-V88-piano-PREXML -D model/S500 --repo "${{ github.repository }}"
      - name: Restore same authentic 45 IDMT and 322 MAESTRO fully annotated notes as earlier
        run: |
          gh run download 38570219836 -n s488-original-IDMT-45-true-guitar-21-poly-BasicPitch-note-set-vs-S80-ExactK -D model/S488 --repo "${{ github.repository }}"
          gh run download 38560885111 -n s476-MAESTRO-original-V88-K-new-onsets-vs-sounding-322-same-events-audit -D model/S476 --repo "${{ github.repository }}"
      - name: Quantify all four source-untuned joint K-driven note-name selections and true regressions
        run: |
          python -u -m scripts.s501_score_real_note_name_sets_against_source_truth \
            --graph model/S500 --report model/S500/report.json \
            --guitar model/S488/S488_45_TRUE_GUITAR_SOURCE_NOTESETS_PAIRED.jsonl \
            --guitar-report model/S488/report.json \
            --piano model/S476/S476_ORIGINAL_S470_PIANO_NEW_NOTE_VS_SOUNDING_322.jsonl \
            --piano-report model/S476/report.json --out model/S501
          python - <<'PY'
          import json
          r=json.load(open('model/S501/report.json'))
          assert r['status']=='S501_CANONICAL_JOINT_EXACTK_FULL_NOTESETS_REAL_IDMT_MAESTRO_AUDIT'
          assert r['independently_S500_pretruth_note_sets_SHA_verified']
          assert r['all_four_note_rank_policies_evaluated_not_selected']
          assert r['no_external_training_or_threshold_tuning']
          assert r['source_original_ExactK_and_live_untouched']
          assert r['no_promotion']
          print('S501 independently scored actual pitch note names and K without promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s501-genuine-full-note-sets-E3-pitches-vs-constrained-ExactK-guitar-S80-piano-V88
          path: model/S501/
          retention-days: 90
