name: S212 replay five authentic S45 source families on recovered S5 S18
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s212_rebase_five_original_s45.py'
      - '.github/workflows/v273-s212-rebase-five-S45.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s212-five-family-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovered_source_forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original compatible numpy sklearn torch
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore 19 original S11 saved risk models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853663514
          name: v273-series11-native-risk
          path: model/S11
      - name: Restore 19 original S12 logistic models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853979683
          name: v273-series12-full-audio
          path: model/S12
      - name: Restore original S38 four expert heads from four folds
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880386031
          name: v273-series38-poly-harmonic-expert
          path: model/S38
      - name: Restore four original S40 temporal CNNs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37880762289
          name: v273-series40-temporal-cnn
          path: model/S40
      - name: Restore 19 original S41 six-route fusion gates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37881191015
          name: v273-series41-six-head-neural-fusion
          path: model/S41
      - name: Run five genuine trained S45 source families on recovered S5/S18 parent folds
        run: >-
          python -m scripts.s212_rebase_five_original_s45
          --s18 analysis/evidence/v273-recovered-s5-s18/external_s5_to_s18.npz
          --s97 analysis/evidence/v273-recovered-s5-s18/inputs/original_s45_audio_only.npz
          --s11 model/S11 --s12 model/S12 --s38 model/S38
          --s40 model/S40 --s41 model/S41 --out model/S212
      - name: Verify all original families, genuine 19 branches and label-free proof
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S212/report.json'))
          assert r['branches']==19 and r['events']==57
          assert r['fold_branches']==[5,4,5,5] and len(r['family_ids'])==5
          assert r['former_S135_PR16_source_replaced']
          assert r['S11_S12_original_S9_parent_used']
          assert r['S38_S40_S41_original_S18_parent_used']
          assert not r['S80_promoted'] and not r['independent_accuracy_measured']
          assert not r['labels_read'] and not r['new_models_trained']
          with np.load('model/S212/five_rebased_S11_S12_S38_S40_S41.npz',allow_pickle=False) as z:
              assert z['proposals_K'].shape==(19,57,5)
              assert len(set(map(str,z['branch_piece'])))==19
          print('S212 PASS 5 re-based trained S45 families, authentic S9/S18 parents, 19 branches, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s212-five-authentic-S45-source-families-recovered-S5-S18
          path: model/S212/
          retention-days: 90
