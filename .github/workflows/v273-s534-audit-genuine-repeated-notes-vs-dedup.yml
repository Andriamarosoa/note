name: S534 independent note duplicate vs genuine restrike audit at 30 50 80 ms F1 matching
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s534_independent_real_repeat_notes_dedup_tolerance_audit.py
      - .github/workflows/v273-s534-audit-genuine-repeated-notes-vs-dedup.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  independent_real_note_restrikes_and_all_s533_duplicate_removals:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original note time and MIDI verification
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Synthetic test genuinely retriggered same pitch is not assumed false repeat
        run: |
          python -m py_compile scripts/s534_independent_real_repeat_notes_dedup_tolerance_audit.py
          python -m scripts.s534_independent_real_repeat_notes_dedup_tolerance_audit --self-test
      - name: Restore source SHA-verified full MAESTRO MIDI from original song metadata and original trained note models
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
          gh run download 38652938992 -n s533-nine-fundamental-harmonic-temporal-repeat-noteon-policy-audits -D model/S533 --repo "${{ github.repository }}"
      - name: Forensically verify 56 suppression events, all true quick re-strikes, and precision under multiple time tolerances
        run: |
          python -u -m scripts.s534_independent_real_repeat_notes_dedup_tolerance_audit \
            --manifest model/S469/report.json --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json \
            --s533-report model/S533/report.json --out model/S534
          python - <<'PY'
          import json
          r=json.load(open("model/S534/report.json"))
          assert r["status"]=="S534_INDEPENDENT_REPEATED_NOTE_STRIKE_AND_TIME_TOLERANCE_AUDIT"
          assert r["original_S533_56_repeated_pitch_removals_SHA_replayed"]
          assert r["tested_true_onset_tolerance_ms"]==[30,50,80]
          assert r["all_actual_MIDI_repeated_same_pitch_within_dedup_window_explicitly_audited"]
          assert r["no_promotion"] and r["original_S80_ExactK_Live_unchanged"]
          print("S534 genuine repeated musical notes and duplicate removals independently audited")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s534-real-same-pitch-restrikes-dedup60-80-100-and-onset-tolerance-audit
          path: model/S534/
          retention-days: 90
