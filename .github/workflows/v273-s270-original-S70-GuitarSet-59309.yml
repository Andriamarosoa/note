name: S270 genuine original four S70 checkpoints on newly folded GuitarSet 59309
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s270_original_S70_fourfold_GuitarSet_59309.py'
      - '.github/workflows/v273-s270-original-S70-GuitarSet-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s270-59309-original-S70-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_pretrained_fourfold_S70:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Require verified S269 frozen original S69 fourfold GuitarSet success
        run: gh run watch 38313983301 --exit-status --interval 15
      - name: Retrieve sealed complete original S69 and 12 PR16 36 OOF sources
        run: |
          gh run download 38313983301 -n s269-GuitarSet-59309-original-S69-fourfold -D model/S269
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
          gh run download 38296428889 -n s222-recovered-original-S70-four-fold-checkpoints-exact-history -D model/S222
      - name: Run unchanged four original trained S70 classifiers over all original GuitarSet 59309 with fixed 3of4 gate
        run: |
          python -u -m scripts.s270_original_S70_fourfold_GuitarSet_59309 \
            --s221 model/S269/S269_original_S69_fourfold_rule_consensus_GUITARSET.npz \
            --s85 model/S258/S258_GuitarSet_59309_true_OOF_PR16.npz \
            --s222 model/S222 --out model/S270
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S270/report.json'))
          assert r['rows']==59309 and r['original_S70_fitted_models']==4 and not r['S80_promoted']
          with np.load('model/S270/S270_original_S70_4fold_no_oracle_GUITARSET.npz') as z:
            assert z['proposed_poly_K'].shape==(59309,)
          print('S270 PASS all four historical S70 trained checkpoints on GuitarSet; train overlap not OOF')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s270-guitarset-59309-original-S70-four-checkpoints
          path: model/S270/
          retention-days: 90
