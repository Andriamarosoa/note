name: S583 fifth held new composer exact MIDI NoteOn pitch F1 only AFTER four SHA-frozen S582 policies
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s583_fifth_held_source_true_NoteOn_F1_compare_middle_specialist.py
      - .github/workflows/v273-s583-actual-fifth-MIDI-only-after-S582-freeze.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  independent_fifth_new_music_true_midi_4_policies_no_retraining:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned actual MIDI note onset 1 to 1 matching
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Synthetic independent true repeated note MIDI matching tests without any real test labels
        run: |
          python -m py_compile scripts/s583_fifth_held_source_true_NoteOn_F1_compare_middle_specialist.py
          python -m scripts.s583_fifth_held_source_true_NoteOn_F1_compare_middle_specialist --self-test
      - name: Restore preregistered exact fifth held track metadata and official original WAV evidence, not labels
        run: |
          gh run download 38675435536 -n s577-fifth-novel-five-original-maestro-train-composers-after28-exposed-ONLY-METADATA -D model/S577 --repo "${{ github.repository }}"
          set -euo pipefail
          v="$(gh run list --repo "${{ github.repository }}" --workflow v273-s579-fifth-original-V88-WAV-PREMIDI.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          f="$(gh run list --repo "${{ github.repository }}" --workflow v273-s581-fifth-49pitch-WAV-physics-PREMIDI.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          test -n "$v" && test "$v" != null && test -n "$f" && test "$f" != null
          gh run download "$v" -n s579-five-new-composers-preMIDI-V88-source-frozen-audio-original-S80-era-model -D model/S579 --repo "${{ github.repository }}"
          gh run download "$f" -n s581-next-five-S577-composers-V88-raw49-pitch-PREMIDI -D model/S581 --repo "${{ github.repository }}"
      - name: Retrieve FULL exact S582 four policy original NoteOn prediction SHA-seal BEFORE allowing MIDI reads
        run: |
          set -euo pipefail
          s="$(gh run list --repo "${{ github.repository }}" --workflow v273-s582-four-preMIDI-policies-fifth-composer-MID-specialist.yml -L 15 --json databaseId,conclusion --jq 'map(select(.conclusion=="success"))[0].databaseId')"
          test -n "$s" && test "$s" != null
          gh run download "$s" -n s582-four-frozen-noteon-source-policies-global28-vs-mid12-before-original-S577-MIDI -D model/S582 --repo "${{ github.repository }}"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open("model/S582/report.json"))
          f=Path("model/S582/S582_NEW_FIFTH_COMPOSERS_FOUR_NAMED_NOTES_PREMIDI.jsonl")
          assert r["status"]=="S582_FIFTH_COMPOSER_NEW_MIDDLE_HEAD_FOUR_POLICIES_FROZEN_BEFORE_MIDI"
          assert r["source_MIDI_NOT_read_before_frozen_named_note_event_sha"]
          assert r["four_predeclared_old_vs_new_same_song_policies"]==[
            "S569_old23_control","S578_general28","S578_mid_replace","S578_mid_blend50"]
          assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==r["frozen_named_noteon_SHA"]
          print("S583 all 4 genuine MIDI-blind named notes already frozen; only NOW paired MIDI may open")
          PY
      - name: Independently open original five held true piano MIDIs only after sealed S582 and compare all 4 pitch NoteOn F1 plus pitch register
        run: |
          python -u -m scripts.s583_fifth_held_source_true_NoteOn_F1_compare_middle_specialist \
            --manifest model/S577/report.json --wav-report model/S579/report.json \
            --features model/S581/S581_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --feature-report model/S581/report.json \
            --freeze-report model/S582/report.json \
            --predictions model/S582/S582_NEW_FIFTH_COMPOSERS_FOUR_NAMED_NOTES_PREMIDI.jsonl \
            --out model/S583
          python - <<'PY'
          import json
          r=json.load(open('model/S583/report.json'))
          assert r["status"]=="S583_REAL_FIFTH_MAESTRO_SOURCE_HELD_MIDDLE_SPECIALIST_NOTEON_F1"
          assert r["source_MIDI_opened_ONLY_after_S582_audio_model_notes_frozen_SHA"]
          assert len(r["true_MIDI_provenance"])==5 and len(r["policies"])==4
          assert r["metric_complete_exact_MIDI_pitch_and_onset_tolerances_ms"]==[30,50,80]
          assert not r["no_reference_S80_Live_GuitarSet_regression_was_performed"]
          assert r["no_promotion"] and r["NOT_official_MAESTRO_test"]
          print("S583 pass fifth independent all 5 source real note pitches, 4 frozen policies; S80 untouched")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s583-fifth-new-MAESTRO-real-MIDI-NoteOn-F1-global28-vs-special-mid12-four-fixed-policies
          path: model/S583/
          retention-days: 90
