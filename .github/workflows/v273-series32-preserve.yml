name: V27.3 S32 preserve evidence committee outcomes
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series32-preserve.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Recover all 28 source-matched committee gate predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37866372090 --repo "$GITHUB_REPOSITORY" --name v273-series32-evidence-committee --dir model/S32
      - name: Independently recount all selected and rejected 26-case decisions
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          import numpy as np
          base=Path('model/S32')
          z=json.loads((base/'report.json').read_text())
          assert z['status']=='completed'
          assert z['zero_loss_research_candidates']==[]
          with np.load(base/'predictions.npz',allow_pickle=False) as x:
              y=x['true_K'];names=list(map(str,x['variant_ids']))
              assert len(names)==31
              arr=x['predictions']
              p=arr[:,names.index('series18_parent')]
              original=arr[:,names.index('series29__lambda2__threshold0.02')]
              assert ((p!=original)).sum()==26
              for i,name in enumerate(names):
                  v=arr[:,i];a=z['audits'][name]
                  assert ((p!=v)&(v==y)&(p!=y)).sum()==a['corrected']
                  assert ((p!=v)&(v!=y)&(p==y)).sum()==a['regressed']
          rows=list(csv.DictReader((base/'all_26_coalition_cases.csv').open()))
          assert len(rows)==26
          assert sum(row['category']=='neutral' for row in rows)==5
          print('PASS 28 gate coalitions, 26 native events, 5 neutral, all regressions reproduced')
          PY
      - name: Preserve immutable complete research archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series32-research.tar.gz -C model/S32 .
          (cd model/archive && sha256sum v273-series32-research.tar.gz > SHA256SUMS)
          gh release create "v273-series32-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series32-research.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S32 multi-proof corroboration ${GITHUB_RUN_ID}" \
            --notes "28 prespecified two- and three-way held-piece evidence score gates, all 26 native decisions including 5 neutral, no zero-regression gain or promotion. Underlying corpus already explored."
