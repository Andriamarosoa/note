name: S130 S5 student rare K class weighted paired audit (research only)
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s130_s5_student_rare_k.py'
      - '.github/workflows/v273-s130-rare-k.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s130-rare-k-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - run: python -m scripts.s130_s5_student_rare_k --self-test
      - name: Restore original SHA-pinned S5 teacher fold predictions
        run: |
          set -euo pipefail
          mkdir -p model/history
          git fetch origin 'refs/tags/v273-series45-research-37891074478:refs/tags/v273-series45-research-37891074478'
          for FOLD in 0 1 2 4; do
            git archive 854ada718ac9bf1556f00c96b8e1aa90402d6ab3 \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/report.json" \
              "analysis/evidence/v273-open-k0-k6/series5/models/fold$FOLD/predictions.npz" | tar -x -C model/history
          done
      - name: Original audio features fold0
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-0
          path: model/features/fold0
      - name: Original audio features fold1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-1
          path: model/features/fold1
      - name: Original audio features fold2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-2
          path: model/features/fold2
      - name: Original audio features fold4
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37837235723
          name: v273-open-features-4
          path: model/features/fold4
      - name: Genuine GOAT original control111 from S116
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38184381730
          name: v273-s116-original-S4-control111-GOAT
          path: model/s116
      - name: Frozen S129 unweighted held-out fold0 predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38188446402
          name: v273-s129-new-s5-student111-goat-blind
          path: model/s129
      - name: Compare class weighted students to unweighted S129 on held-out teacher
        run: |
          set -euo pipefail
          S116="$(find model/s116 -type f -name external_s4_control111.npz -print -quit)"
          S129="$(find model/s129 -type f -name held_fold0_teacher_fidelity.npz -print -quit)"
          test -s "$S116" && test -s "$S129"
          python -u -m scripts.s130_s5_student_rare_k \
            --features-root model/features \
            --original-s5 model/history/analysis/evidence/v273-open-k0-k6/series5/models \
            --s116 "$S116" --s129 "$S129" --out model/s130
          python - <<'PY'
          import json
          r=json.load(open('model/s130/report.json'))
          assert r['heldout_teacher_events']==15952
          assert not r['historical_true_K_read'] and not r['GOAT_annotation_read']
          assert not r['true_accuracy_scored'] and not r['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s130-s5-student-rare-k-ablation
          path: model/s130/
          retention-days: 30
