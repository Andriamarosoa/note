name: S636 NOTE desktop host preflight without physical audio assumptions
on:
  push:
    branches: [codex/s634-midi-live-transport]
    paths:
      - scripts/s636_note_live_desktop.py
      - test/test_s636_note_live_desktop.py
      - .github/workflows/v273-s636-desktop-host-smoke.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no_hardware_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original NOTE inference dependencies (no SoundFont, no physical IO)
        run: python -m pip install -r requirements-live-strict.txt
      - name: Verify output MIDI lifecycle, original checkpoint and help entrypoint
        run: |
          python -m compileall -q scripts/s636_note_live_desktop.py
          python -m scripts.s636_note_live_desktop --help
          python -m unittest -v test.test_s636_note_live_desktop test.test_s634_safe_live_transport test.test_s635_shared_midi_metric
