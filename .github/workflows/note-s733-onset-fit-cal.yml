name: S733 FIT Onset only and causal CAL HELD DEV no promotion
on:
  push:
    branches: [codex/note-s733-sequential-specialist]
    paths:
      - scripts/s733_train_onset_only.py
      - src/causal_note/s733_one_target_selector.py
      - test/test_s733_one_target_selector.py
      - .github/workflows/note-s733-onset-fit-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s733-onset-only-train
  cancel-in-progress: true
jobs:
  S733_fit_80_then_cal32_held32_dev12:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned original-model CPU dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate one target isolation and frozen classifier ABI
        run: |
          python -m compileall -q scripts/s733_train_onset_only.py src/causal_note/s733_one_target_selector.py
          python -m unittest -v test.test_s733_one_target_selector test.test_s731_auditory_scene test.test_s713_metric_contract
      - name: Retrieve original signed S708 and S707 release
        run: |
          mkdir -p /tmp/s733/s708 /tmp/s733/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s733/s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s733/s707
          test -s /tmp/s733/s708/report.json
          test -s /tmp/s733/s708/s708_selected.pt
          test -s /tmp/s733/s707/s675_hazard.joblib
      - name: FIT80 class-conditional learned Onset; CAL frozen six metrics; HELD DEV replay
        run: |
          python -m scripts.s733_train_onset_only --s708-dir /tmp/s733/s708 --offset-checkpoint /tmp/s733/s707/s675_hazard.joblib --out /tmp/s733/report --epochs 3
      - name: Verify signed replay, six-score veto and no LIVE or TEST use
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s733/report/report.json'))
          assert not r['promoted'] and not r['LIVE_changed'] and not r['TEST_opened']
          assert r['complete']
          assert len(r['FIT']['sources'])==80
          assert len(r['CAL']['tracks'])==32
          assert len(r['HELD']['tracks'])==32
          assert len(r['DEV']['tracks'])==12
          assert r['CAL']['selected'] in ['S708_frozen',*r['CAL']['eligible']]
          print('S733_FIT_ONSET_FINAL',json.dumps({
            'selected':r['CAL']['selected'],
            'trained':r['FIT']['trained_rows'],
            'coverage':r['FIT']['direct_coverage'],
            'cal_scores':r['CAL']['scores'],
            'alterations':r['CAL']['alterations'],
            'promoted':r['promoted']},sort_keys=True),flush=True)
          PY
      - name: Archive immutable FIT weights and CAL HELD DEV measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S733_ONSET_SINGLE_SPECIALIST_CAUSAL_FIT_CAL_HELD_DEV_NO_PROMOTION
          path: /tmp/s733/report
          if-no-files-found: warn
          retention-days: 45
