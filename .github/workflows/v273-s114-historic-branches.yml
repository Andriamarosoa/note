name: S114 forensic search all GitHub branches and original workflows
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s114_github_original_s5_source_forensic.py'
      - '.github/workflows/v273-s114-historic-branches.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote branch and original tag refs
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin 'refs/tags/*:refs/tags/*'
      - name: Search exact archived S4/S5 source terms across all branch tips and history
        run: python scripts/s114_github_original_s5_source_forensic.py --out model/s114/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s114-original-branch-workflow-provenance
          path: model/s114/report.json
          retention-days: 90
