name: V27.3 S40 true temporal CNN morphology head K1-K6
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series40-temporal-cnn.yml'
      - 'scripts/train_v273_s40_temporal_cnn.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific toolchain and torch CPU
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate real torch temporal CNN and source class dimensions
        run: python -m scripts.train_v273_s40_temporal_cnn --self-test
      - name: Restore original unmodified 42x49 audio wave sequence per event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Recover verified S18 references for native K0-K6 paired audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Fit actual neural temporal conv1d on each outer three-fold training set
        run: >-
          python -m scripts.train_v273_s40_temporal_cnn
          --features model/features
          --s18 model/S18/predictions.npz
          --output model/S40
      - name: Publish direct K2-K6 signal recognition and regressions K0-K6
        run: cat model/S40/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series40-temporal-cnn
          path: model/S40/
          retention-days: 90
