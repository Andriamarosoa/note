name: S745 FIT-corrected active Exact-K specialist 12 real CAL loops
on:
  push:
    branches: [codex/note-s745-calibrated-activek-specialist-loops]
    paths:
      - src/causal_note/s744_birth_specialist.py
      - src/causal_note/s745_calibrated_birth_router.py
      - scripts/s745_calibrated_fit_cal_loops.py
      - test/test_s745_calibrated_birth.py
      - .github/workflows/note-s745-calibrated-fit-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s745-fit-only-prior-calibration
  cancel-in-progress: true
jobs:
  calibrated_fit80_and_twelve_real_cal32_midi_loops:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original signed S708 and S707 execution runtime
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile actual learned specialist and validate causal input, risk and K
        run: |
          python -m compileall -q src/causal_note/s745_calibrated_birth_router.py scripts/s745_calibrated_fit_cal_loops.py
          python -m unittest -v test.test_s745_calibrated_birth test.test_s744_birth_specialist test.test_s743_fundamental_router
      - name: Recover original signed teacher-free specialist inputs
        run: |
          mkdir -p /tmp/s745/s708 /tmp/s745/s707 /tmp/s745/s734
          gh run download 39094682419 --repo "Andriamarosoa/note" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s745/s708
          gh run download 39059008484 --repo "Andriamarosoa/note" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s745/s707
          gh run download 39137653526 --repo "Andriamarosoa/note" --name S734_ONSET_INDIVIDUAL_NEURAL_EXACTK_LINKED_FIT_CAL_HELD_DEV --dir /tmp/s745/s734
          test -s /tmp/s745/s708/report.json
          test -s /tmp/s745/s708/s708_selected.pt
          test -s /tmp/s745/s707/s675_hazard.joblib
          test -s /tmp/s745/s734/report.json
          test -s /tmp/s745/s734/s733_onset.pt
      - name: FIT80 only probability prevalence calibration and twelve real CAL32 MIDI loops
        run: |
          python -m scripts.s745_calibrated_fit_cal_loops --s708-dir /tmp/s745/s708 --s734-checkpoint /tmp/s745/s734/s733_onset.pt --s734-report /tmp/s745/s734/report.json --offset-checkpoint /tmp/s745/s707/s675_hazard.joblib --out /tmp/s745/output
      - name: Validate twelve independent trials, six strict metrics, offset preservation
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s745/output/report.json'))
          assert r['completed'] and r['loops']==12 and len(r['CAL'])==12
          assert r['selected']=='S708_frozen' and not r['promoted']
          assert not r['LIVE_changed'] and not r['TEST_opened']
          assert r['training']=='FIT80 only'
          assert r['FIT']['population_prior_correction']['truth_source']=='FIT80 ONLY'
          for name,v in r['CAL'].items():
              assert len(v['scores'])==6 and len(v['delta'])==6
              assert not v['six_gt80'] or v['safe']
          print('S745_CALIBRATED_ACTIVEK_RESULTS',json.dumps({
              'baseline':r['reference_scores'],
              'prior':r['FIT']['population_prior_correction'],
              'candidate':r['CAL_candidate'],
              'all_loops':r['CAL']}))
          PY
      - name: Publish signed specialist models and all real 6-metric CAL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S745_FIT_CALIBRATED_SPECIALISTS_12_REAL_ACTIVEK_CAL_LOOPS
          path: |
            /tmp/s745/output/report.json
            /tmp/s745/output/s745_depth*.joblib
          retention-days: 45
          if-no-files-found: warn
