name: S152 original saved S16 to S17 to S18 veto cascade on new GOAT after adapted S11
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s152_original_s16_s18_cascade_GOAT.py'
      - '.github/workflows/v273-s152-s11-s18-checkpoint-cascade.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s152-original-cascade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_original_weight_cascade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s152_original_s16_s18_cascade_GOAT --self-test
      - name: Original S16 binary regression-veto classifiers and scalers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37855705158
          name: v273-series16-k12-k23
          path: model/S16
      - name: Original S17 K3 classification-veto models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856164138
          name: v273-series17-k32-k34
          path: model/S17
      - name: Original S18 K4/K2 classification-veto models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856499212
          name: v273-series18-k43-k21
          path: model/S18
      - name: Already frozen S11 original-risk-checkpoint forward on native GOAT audio
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38194821806
          name: v273-s149-original-S11-risk-heads-new-GOAT-adapted-S16-S17-source-tested
          path: model/S11-adapted
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Execute original 324 policies S16 S17 S18 sequentially, original fit weights only
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          S11="$(find model/S11-adapted -name S11_real_original_weights_new_GOAT_adapted.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135" && test -s "$S11"
          python -u -m scripts.s152_original_s16_s18_cascade_GOAT \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" --s11 "$S11" \
            --s16 model/S16 --s17 model/S17 --s18 model/S18 --out model/S152
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S152/report.json'))
          assert r['GOAT_real_audio_events']==57
          assert r['genuine_trained_models_S16_S17_S18_total']>=12
          assert len(r['three_veto_stages'])==3
          assert all(r['three_veto_stages'][s]['original_108_veto_policies_executed']
                     for s in ('S16','S17','S18'))
          assert not r['authentic_S18_historical_equivalence_verified']
          assert not r['MIDI_truth_read'] and not r['S80_promoted']
          with np.load('model/S152/S11_to_S18_adapted_original_checkpoint_cascade_GOAT.npz',allow_pickle=False) as d:
              assert all(d[s+'_K'].shape==(57,) for s in ('S16','S17','S18'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s152-original-trained-S16-S17-S18-cascade-newGOAT-adaptedS11
          path: model/S152/
          retention-days: 90
