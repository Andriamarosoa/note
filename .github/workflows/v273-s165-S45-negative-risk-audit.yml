name: S165 why original five-source S45 Ridge refuses GOAT proposals, no MIDI
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s165_s45_frozen_negative_risk_audit.py'
      - '.github/workflows/v273-s165-S45-negative-risk-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s165-real-original-risks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_risk_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify original fixed S45 cutoff behaviour
        run: python -m scripts.s165_s45_frozen_negative_risk_audit --self-test
      - name: Download only immutable five-source original S45 GOAT predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38198248491
          name: v273-s163-five-of-sixteen-original-S45-family-Ridge-95-models-GOAT
          path: model/S163
      - name: Quantify candidate alternatives and frozen correction-vs-regression scores
        run: |
          python -m scripts.s165_s45_frozen_negative_risk_audit \
            --input model/S163/five_of_sixteen_original_weight_risk_GOAT.npz \
            --out model/S165/report.json
          python - <<'PY'
          import json
          x=json.load(open('model/S165/report.json'))
          assert x['new_audio_events']==57
          assert x['evaluated_original_source_families']==5
          assert not x['trained_risk_sources_complete_16']
          assert not x['thresholds_retuned']
          assert not x['GOAT_truth_or_MIDI_accessed'] and not x['official_promotion']
          assert x['reasons']['accepted_actions']==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s165-original-S45-five-family-frozen-negative-risk-explanation
          path: model/S165/
          retention-days: 90
