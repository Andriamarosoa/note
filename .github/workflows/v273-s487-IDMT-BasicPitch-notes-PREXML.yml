name: S487 genuine IDMT five guitar WAV polyphonic notes from pretrained Basic Pitch PREXML
on:
  push:
    branches: [codex/s487-basicpitch-IDMT-guitar-source]
    paths:
      - scripts/s487_freeze_pretrained_BasicPitch_true_IDMT_guitar_namednotes_PREXML.py
      - .github/workflows/v273-s487-IDMT-BasicPitch-notes-PREXML.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s487-real-guitar-pretrained-BasicPitch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_guitar_namednotes_pretrained_multiinstrument_no_XML:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pretrained multiinstrument note transcription runtime fixed source
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 basic-pitch==0.4.0 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Verify sound-to-note-name E3 G3 B3
        run: |
          python -m py_compile scripts/s487_freeze_pretrained_BasicPitch_true_IDMT_guitar_namednotes_PREXML.py
          python -m scripts.s487_freeze_pretrained_BasicPitch_true_IDMT_guitar_namednotes_PREXML --self-test
      - name: Restore original true five WAV only PREREGISTRATION no XML and original frozen V88
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38319155819 \
            -n s277-IDMT-dataset3-5WAV-true-original-V88-native-official-unlabelled \
            -D model/S277 --repo ${{ github.repository }}
      - name: Extract exactly same WAV bytes as historic V88, run pretrained note names then freeze prior to XML
        run: |
          python -u -m scripts.s487_freeze_pretrained_BasicPitch_true_IDMT_guitar_namednotes_PREXML \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s277 model/S277/S277_original_official_V88_dataset3_native_5_WAV_predictions.npz \
            --s277-report model/S277/report.json \
            --out model/S487
          python - <<'PY'
          import json
          r=json.load(open('model/S487/report.json'))
          assert r['status']=='S487_FIVE_GUITAR_IDMT_REAL_WAV_PRETRAINED_BASIC_PITCH_FROZEN_NOXML'
          assert r['original_source_WAV_count']==5
          assert r['truly_original_WAV_SHA_verified']
          assert r['original_XML_NOT_READ_before_note_freeze']
          assert r['model_no_IDMT_truth_training_or_postprocessing_tuning']
          assert r['original_S80_and_live_unchanged'] and r['no_promotion']
          print('S487 actual original IDMT true guitar sound-to-notes frozen before XML scoring')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML
          path: model/S487/
          retention-days: 90
