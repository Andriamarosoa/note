name: S195 enumerate actual historical 255 proposals 9 audits and S5 527 matrix headers no truth
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s195_inventory_original_255x9_S5_527_archives.py'
      - '.github/workflows/v273-s195-original-255x9-S5-527-header-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s195-original-binary-schemas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect_original_versioned_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only NumPy required for binary header decoder
        run: python -m pip install numpy==1.26.4
      - name: NPY header integrity self-test
        run: python -m scripts.s195_inventory_original_255x9_S5_527_archives --self-test
      - name: Forensically inventory preserved files and ZIP source archive headers
        run: |
          python -u -m scripts.s195_inventory_original_255x9_S5_527_archives --root . --out model/S195/report.json
          python - <<'PY'
          import json
          d=json.load(open('model/S195/report.json'))
          assert d['historical_255_group_context_7x20_derived_only']
          assert d['num_versioned_binary_arrays_examined']>20
          assert not d['MIDI_or_truth_array_values_accessed']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s195-original-255x9-S5-527-real-archive-schema-inventory-truthfree
          path: model/S195/
          retention-days: 90
