name: S720 polyphonic onset+sustain weighted FIT fine-tuning against equal-budget control
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - scripts/s720_poly_onset_training.py
      - test/test_s720_poly_onset_training.py
      - .github/workflows/note-s720-poly-onset-fit-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s720-weighted-onset-head-fit-cal
  cancel-in-progress: false
jobs:
  s720_train_and_immutable_six_metric_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install NOTE CPU reproducing original S708 feature ABI
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify FIT target gradients and six-score locks
        run: |
          python -m compileall -q scripts/s720_poly_onset_training.py
          python -m unittest -v test.test_s720_poly_onset_training test.test_s718_onset_audit test.test_s713_metric_contract
      - name: Load only historical signed S708 and original S675 release
        run: |
          mkdir -p /tmp/s720/s708 /tmp/s720/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s720/s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s720/s707
          test -s /tmp/s720/s708/s708_selected.pt
          test -s /tmp/s720/s708/report.json
          test -s /tmp/s720/s707/s675_hazard.joblib
      - name: FIT-only matched fine-tuning then CAL-only six-metric freeze
        run: |
          python -m scripts.s720_poly_onset_training --s708-dir /tmp/s720/s708 --offset-checkpoint /tmp/s720/s707/s675_hazard.joblib --out /tmp/s720/experiment
      - name: Assert NO promotion and report six metrics if run finished
        if: success()
        run: |
          python - <<'PY'
          import json
          p='/tmp/s720/experiment/report.json'
          d=json.load(open(p))
          assert d['promoted'] is False and d['TEST_opened'] is False
          assert d['CAL_only_selection'] is True
          assert d['CAL']['selected'] in d['CAL']['eligible']
          assert d['HELD']['passed'] and d['DEV']['passed'] or not d['candidate_qualifies']
          print('S720_TRAINED_AND_SIX_METRIC_GUARDS_CHECKED',json.dumps({
              'selected':d['selected_shadow'],
              'eligible':d['CAL']['eligible'],
              'cal_scores':{n:{k:d['CAL']['scores'][n][k] for k in (
                  'onset_f1','exact_k','active_exact_k','offset_accuracy','full_note_f1','frame_pitch_f1')}
                  for n in d['CAL']['scores']},
              'promoted':d['promoted']
          }),flush=True)
          PY
      - name: Archive FIT-trained original-vs-control-vs-polyphonic candidates and score evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S720_POLY_ONSET_FIT_CAUSAL_CAL_HELD_DEV_NO_PROMOTION
          path: |
            /tmp/s720/experiment/report.json
            /tmp/s720/experiment/*.pt
          retention-days: 45
          if-no-files-found: warn
