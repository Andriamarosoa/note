name: V27.3 S35 integrate all available heads excluding H9
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series35-extended-heads.yml'
      - 'scripts/v273_extended_head_bank.py'
      - 'scripts/train_v273_extended_dynamic_router.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU sound and OOF model dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate all 18 dynamic adapters H9 explicit rejection and H8 provenance requirement
        run: |
          python -m scripts.v273_extended_head_bank
          python -m scripts.train_v273_extended_dynamic_router --self-test
      - name: Obtain original four folds of 42-frame harmonic sequences
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/feature-bundles
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/feature-bundles
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/feature-bundles/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Obtain unchanged S18 reference and exact previous stateful A-B decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37865173636 --repo "$GITHUB_REPOSITORY" --name v273-series29-stepwise-scheduler --dir model/S29
      - name: Fit inner-OOF and outer-fold specialists and train dynamic all-head selector
        run: >-
          python -m scripts.train_v273_extended_dynamic_router
          --features model/features
          --s18 model/S18/predictions.npz
          --s29 model/S29/predictions.npz
          --output model/S35
      - name: Publish per-class head usage K0-K6 fixes/regressions and H9 exclusion
        run: cat model/S35/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series35-extended-head-router
          path: model/S35/
          retention-days: 90
