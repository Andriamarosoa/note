name: S524 independent reproducible true note addition and deletion audit of 24 trained action expert checkpoints
on:
  push:
    branches: [codex/s521-balanced-14head-audio-note-attention]
    paths:
      - scripts/s524_independent_audit_learned_ADD_REMOVE_new_pitch_heads.py
      - .github/workflows/v273-s524-independent-two-action-note-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  independently_verify_new_notes_added_and_true_notes_not_lost:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install strictly numpy independent audit with no retraining
        run: python -m pip install numpy==1.26.4
      - name: Test matching K does not hide wrong pitch
        run: |
          python -m py_compile scripts/s524_independent_audit_learned_ADD_REMOVE_new_pitch_heads.py
          python -m scripts.s524_independent_audit_learned_ADD_REMOVE_new_pitch_heads --self-test
      - name: Restore original IDMT guitar and MAESTRO piano real true source note labels
        run: |
          gh run download 38596480284 \
            -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table \
            -D model/S505 --repo "${{ github.repository }}"
      - name: Restore all 24 original trained S523 weights and SHA-frozen held-audio addition/deletion probabilities
        run: |
          gh run download 38645106253 \
            -n s523-separated-genuinely-trained-add-new-and-remove-wrong-note-heads-8-nested-held-WAV \
            -D model/S523 --repo "${{ github.repository }}"
      - name: Independently audit every new real note vs false addition, removal and poly chord regression across all eight held recording models
        run: |
          python -u -m scripts.s524_independent_audit_learned_ADD_REMOVE_new_pitch_heads \
            --source model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --source-report model/S505/report.json \
            --train-report model/S523/report.json \
            --predictions model/S523/S523_SEPARATE_TRUE_NOTE_ADDITION_AND_DELETION_PROBABILITIES.jsonl \
            --models model/S523 --out model/S524
          python - <<'PY'
          import json
          s=json.load(open('model/S524/report.json'))
          assert s['status']=='S524_INDEPENDENT_REPLAY_TWO_LEARNED_MUSICAL_NOTE_ACTION_HEADS'
          assert s['actual_source_model_weights_SHA256_checked']==24
          assert s['true_new_and_false_added_pitches_separately_audited']
          assert s['every_false_removed_and_true_removed_note_audited']
          assert s['seven_source_training_six_source_nested_generator_proven']
          assert s['all_piano_102_unmatched_true_attacks_remain_missed']
          assert s['no_verified_negative_audio_attack_events_means_F1_event_unmeasured']
          assert s['no_promotion'] and s['original_historical_S80_K_and_Live_unchanged']
          print('S524 original 24 trained note action models independently replayed and all true/false pitch edits re-audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s524-independent-24-trained-two-action-head-models-note-add-remove-errors-by-K
          path: model/S524/
          retention-days: 90
