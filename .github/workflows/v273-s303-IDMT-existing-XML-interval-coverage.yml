name: S303 audit 459 XML-onset-unmatched IDMT events for note-interval coverage
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s303_exposed_XML_interval_coverage_diagnostic.py'
      - '.github/workflows/v273-s303-IDMT-existing-XML-interval-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s303-interval-coverage-exposed-XML-only
  cancel-in-progress: true
jobs:
  already_exposed_annotations_interval_K_audit_no_promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Fetch immutable prospective S276 metadata and previously exposed S299 annotations
        run: |
          gh run download 38318827219 \
            -n s276-IDMT-central-directory-only-prospective-WAV-cohort \
            -D model/S276 --repo ${{ github.repository }}
          gh run download 38321142772 \
            -n s299-IDMT-dataset3-postfrozen-XML-note-matched-threeway-report-NOT-global-NOT-promotion \
            -D model/S299 --repo ${{ github.repository }}
      - name: Check all 459 non-onset-matched native events against originally annotated note-interval activity
        run: |
          python -u -m scripts.s303_exposed_XML_interval_coverage_diagnostic \
            --s276 model/S276/S276_IDMT_filename_only_cohort_manifest.json \
            --s299report model/S299/report.json \
            --s299pred model/S299/S299_XML_note_matched_only_506.npz \
            --out model/S303
          python - <<'PY'
          import json
          r=json.load(open('model/S303/report.json'))
          assert r['rows']==506 and r['XML_matched_note_onset_events']==47
          assert r['XML_unmatched_onset_events']==459
          assert sum(r['XML_unmatched_events_active_note_interval_counts'].values())==459
          assert r['matched_event_onset_label_vs_continuous_activity_differ']>=0
          assert r['XML_was_already_opened_in_earlier_postfreeze_S299']
          assert not r['XML_transcription_completeness_independently_verified']
          assert not r['unmatched_K0_certification']
          assert not r['fixed_506_population_global_K0toK6_ExactK_MEASURED']
          assert not r['official_S80_promotion']
          print('S303 PASS diagnostic only; unlabeled XML activity is NOT certified real K0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s303-IDMT-506-exposed-XML-note-activity-vs-459-unmatched-events-not-K0
          path: model/S303/
          retention-days: 90
