name: S329 analyze 203 missing IDMT original V88 note attacks for signed 20-80ms temporal offset
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s329_exposed_native_V88_signed_timing_drift_audit.py'
      - '.github/workflows/v273-s329-original-native-signed-timing-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s329-exposed-signed-original-V88-diagnostic
  cancel-in-progress: true
jobs:
  signed_candidate_latency_from_original_20ms_attack_annotations:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Retrieve original already exposed and 20ms precommitted dataset2 sources (no new test set)
        run: |
          gh run download 38324513980 \
            -n s327-PROSPECTIVE-IDMT-dataset2-964-postfrozen-original-attack-ExactK0to6-NOTpromotion \
            -D model/S327 --repo ${{ github.repository }}
          gh run download 38322507433 \
            -n s302-IDMT-dataset2-16WAV-true-original-V88-native-official-unlabelled \
            -D model/S302 --repo ${{ github.repository }}
          gh run download 38323261561 \
            -n s305-Dataset2-16reserveWAV-964events-original-K0K6-attack-protocol-PREXML \
            -D model/S305 --repo ${{ github.repository }}
      - name: Determine if original V88 candidate nearest times are earlier or later than XML annotations, with no shift tuning
        run: |
          python -u -m scripts.s329_exposed_native_V88_signed_timing_drift_audit \
            --s305 model/S305/report.json \
            --s302 model/S302/S302_official_V88_dataset2_rank49plus_16_WAV_predictions.npz \
            --s327 model/S327/report.json \
            --s327data model/S327/S327_original_964_attackK0to6_XML_annotations_postfrozen.npz \
            --out model/S329
          python - <<'PY'
          import json
          r=json.load(open('model/S329/report.json'))
          assert r['first10s_note_attacks']==250
          assert r['correct_original_20ms_assignment']==47
          assert r['missed_original_20ms_assignment']==203
          x=r['missed_signed_relative_nearest_original_V88_interval']
          assert x['n']==203
          assert x['predicted_candidate_after_XML_onset']+x['predicted_candidate_before_XML_onset']+x['inside_native_interval']==203
          assert not r['original_predictions_changed']
          assert not r['truth_target_labels_changed']
          assert not r['candidate_timing_shift_tuned']
          assert not r['official_S80_promotion']
          print('S329 PASS signed original V88 candidate offset analysis, prior thresholds and scores untouched')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s329-original-203-missed-attack-signed-V88-timing-no-tuning
          path: model/S329/
          retention-days: 90
