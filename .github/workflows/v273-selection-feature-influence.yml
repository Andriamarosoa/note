name: V27.3 Neural Selection Feature and OOF Audit Influence

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'scripts/audit_v273_selection_feature_influence.py'
      - 'test/test_v273_selection_feature_influence.py'
      - '.github/workflows/v273-selection-feature-influence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  influence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install pinned deps
        run: |
          python -m pip install -r requirements-train.txt
          python -m pip install scipy==1.17.1 scikit-learn==1.4.2
      - name: Audit feature/channel isolation and gradient tests
        run: |
          python -m py_compile scripts/audit_v273_selection_feature_influence.py
          python -m unittest -v test.test_v273_selection_feature_influence
      - name: Retrieve exact same native cohort
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37605163312
          name: yourmt3-exactk-cohort
          path: model/cohort
      - name: Retrieve audio features
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37740493178
          pattern: v273-harmonic-global-fold-*
          path: model/features
      - name: Retrieve successful learned 64-subset network predictions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37755994598
          name: v273-source-target-subset-neural-audit
          path: model/ref
      - name: Train same selector and intervene on OOF audit vs audio
        run: |
          python -B scripts/audit_v273_selection_feature_influence.py \
            --cohort model/cohort \
            --features model/features \
            --reference model/ref/predictions-and-selected-combinations.npz \
            --output model/feature-influence
      - name: Publish measured audit importance
        run: cat model/feature-influence/verdict.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-selection-audits-feature-influence
          path: model/feature-influence/
          retention-days: 90
