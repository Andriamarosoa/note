name: S271 genuine historical S71 S72 eight frozen risk checkpoints 59309 GuitarSet
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s271_original_S71_S72_GuitarSet_59309.py'
      - '.github/workflows/v273-s271-original-S71-S72-GuitarSet-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s271-59309-S71-S72-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eight_actual_frozen_S71_S72_models:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Require full original S70 trained 4fold on 59309 groups
        run: gh run watch 38314219940 --exit-status --interval 15
      - name: Retrieve original S269 S69 S270 S70 native model outputs and original S97 59k
        run: |
          gh run download 38314191759 -n s269-GuitarSet-59309-original-S69-fourfold -D model/S269
          gh run download 38314219940 -n s270-guitarset-59309-original-S70-four-checkpoints -D model/S270
          gh run download 38312084676 -n s262-guitarset-59309-native-real-S97-source -D model/S262source
          gh run download 38296880555 -n s224-original-four-S71-acoustic-risk-checkpoints-historic-exact -D model/S224
          gh run download 38297080728 -n s225-recovered-original-S72-four-temporal-risk-checkpoints -D model/S225
      - name: Execute actual original 8 trained S71 S72 acoustic/temporal saved checkpoints unchanged
        run: |
          python -u -m scripts.s271_original_S71_S72_GuitarSet_59309 \
            --s69 model/S269/S269_original_S69_fourfold_rule_consensus_GUITARSET.npz \
            --s70 model/S270/S270_original_S70_4fold_no_oracle_GUITARSET.npz \
            --s97 model/S262source/original_GuitarSet_59309_S97.npz \
            --s71 model/S224 --s72 model/S225 --out model/S271
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S271/report.json'))
          assert r['events']==59309 and r['real_original_model_count']==8
          with np.load('model/S271/S271_original_S71_S72_native_GUITARSET.npz') as z:
            assert z['s72_poly_poly_guard_K'].shape==(59309,)
          print('S271 PASS all eight original pretrained S71/S72 risk heads on GuitarSet 59309, train-contaminated diagnostic')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s271-guitarset-59309-original-S71-S72-eight-risk-heads
          path: model/S271/
          retention-days: 90
