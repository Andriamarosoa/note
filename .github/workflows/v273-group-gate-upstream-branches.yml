name: V27.3 Upstream Branch Attribution Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-group-gate-upstream-branches-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-group-gate-upstream-branches
  cancel-in-progress: true

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-group-gate-upstream-branches-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Restore frozen bundle, model pair and Cluster A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/gate model/cluster

          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-group-gate-37019193261             --repo "${{ github.repository }}"             --pattern v273-group-gate-result.tgz             --dir model/download
          tar -xzf model/download/v273-group-gate-result.tgz -C model/gate

          gh release download v273-failure-clustering-36999901054             --repo "${{ github.repository }}"             --pattern v273-failure-clustering-rows.csv             --dir model/cluster

          test -f model/gate/always_on.weights.h5
          test -f model/gate/learned_gate.weights.h5
          test -f model/gate/predictions.npz
          test -f model/cluster/v273-failure-clustering-rows.csv

      - name: Run upstream branch attribution
        run: |
          python -B scripts/audit_v273_group_gate_upstream_branches.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --always-weights model/gate/always_on.weights.h5             --learned-weights model/gate/learned_gate.weights.h5             --saved-predictions model/gate/predictions.npz             --cluster-rows model/cluster/v273-failure-clustering-rows.csv             --output output
          cat output/report.md

      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" output/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 spectral/candidate upstream attribution audit"             --notes-file output/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: v273-group-gate-upstream-branches
          path: output/
