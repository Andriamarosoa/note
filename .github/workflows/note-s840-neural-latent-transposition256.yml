name: S840 AI latent transposition raw PCM256
on:
  push:
    branches: [codex/note-s840-onset-neural-latent-transposition256]
    paths:
      - 'src/onset256/learned_latent_transposer256.py'
      - 'scripts/train_onset_neural_transpose256.py'
      - 'tests/test_onset_neural_latent_transposition256.py'
      - 'series/S840/**'
      - '.github/workflows/note-s840-neural-latent-transposition256.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s840-neural-note-transposer256
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU PyTorch for new isolated latent model
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce original models and MIDI untouched
        run: |
          git fetch origin 33dd90b52c623db8b26dbc191fefd8d10a5b8623 --depth=1
          git diff --name-only FETCH_HEAD HEAD > /tmp/s840_touched.txt
          python - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/s840_touched.txt').read_text().splitlines())
          allowed={
              'src/onset256/learned_latent_transposer256.py',
              'scripts/train_onset_neural_transpose256.py',
              'tests/test_onset_neural_latent_transposition256.py',
              'series/S840/resume.md',
              'series/S840/resultat.md',
              '.github/workflows/note-s840-neural-latent-transposition256.yml'
          }
          assert changed and changed<=allowed, changed-allowed
          print('S840_ONSET_BASELINE_OTHER_5_AXES_MIDI_UNMODIFIED')
          PY
      - name: Test learned neural transposition on exactly 256 raw samples
        run: |
          python -m compileall -q src/onset256/learned_latent_transposer256.py scripts/train_onset_neural_transpose256.py
          python -m unittest discover -s tests -p 'test_onset_neural_latent_transposition256.py' -v
      - name: Validate research-only reports and zero Onset score claims
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('series/S840/resume.md').read_text()
          b=Path('series/S840/resultat.md').read_text()
          for doc in (a,b):
              for required in ('serie: S840','reference: S708','promotion: false',
                               'codex/note-s840-onset-neural-latent-transposition256'):
                  assert required in doc, required
          for heading in ('Objectif','Hypothèse','Modifications','Protocole','Audits obligatoires','Statut'):
              assert ('## '+heading+'\n') in a, heading
          for heading in ('Exécution','Métriques','Comparaison à S708','Audits','Verdict','Prochaine action'):
              assert ('## '+heading+'\n') in b, heading
          for metric in ('Onset F1','Exact-K','Active Exact-K','Offset','Frame Pitch F1','Full Note F1'):
              assert metric in b, metric
          assert 'NON MESURÉ' in b and '69,2584331' in b
          print('S840_REPORTS_VERIFIED_NO_FABRICATED_SCORE')
          PY
      - name: Confirm no MIDI emitted by new research-only stream
        run: |
          python - <<'PY'
          import numpy as np
          from onset256.learned_latent_transposer256 import (
              NeuralLatentTransposer256,CausalNeuralTransposerStream256)
          stream=CausalNeuralTransposerStream256(NeuralLatentTransposer256())
          result=stream.push(np.zeros(256,np.float32),start_sample=0)
          assert result.sample==256
          assert result.note_probabilities.shape==(49,)
          assert not hasattr(result,'intents')
          print('S840_CAUSAL_256_SPECTRAL_FREE_NO_MIDI_NO_HOLD')
          PY
