name: S151 archive original S11 S16 S17 S18 weights and external S149 S150 evidence
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - '.github/workflows/v273-s151-preserve-s11-s18-original.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: s151-source-weight-preservation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original S11 76 trained risk heads
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37853663514
          name: v273-series11-native-risk
          path: original/S11
      - name: Retrieve original S16 trained K1/K2/K3 models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37855705158
          name: v273-series16-k12-k23
          path: original/S16
      - name: Retrieve original S17 trained K3 models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856164138
          name: v273-series17-k32-k34
          path: original/S17
      - name: Retrieve original S18 140 trained K43/K21 risk models
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856499212
          name: v273-series18-k43-k21
          path: original/S18
      - name: Retrieve new audio S11 real original weight inference
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38194821806
          name: v273-s149-original-S11-risk-heads-new-GOAT-adapted-S16-S17-source-tested
          path: evidence/S149
      - name: Retrieve new audio S18 original risk weight inference
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195035112
          name: v273-s150-genuine-S18-trained-K43-K21-risk-models-GOAT-no-labels
          path: evidence/S150
      - name: Verify S11/S16/S17/S18 authentic trained weights and safety verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sizes={name:len(list(Path('original',name,'models').glob('*.joblib')))
                 for name in ('S11','S16','S17','S18')}
          assert sizes['S11']==76 and sizes['S18']==140,sizes
          assert sizes['S16']>0 and sizes['S17']>0,sizes
          for k in ('S149','S150'):
              d=json.loads(Path('evidence',k,'report.json').read_text())
              assert not d['promotion'],k
              assert not d['GOAT_MIDI_labels_read'] if k=='S150' else not d['truth_MIDI_read']
          s149=json.loads(Path('evidence/S149/report.json').read_text())
          s150=json.loads(Path('evidence/S150/report.json').read_text())
          assert s149['original_models_executed']==76
          assert s150['original_saved_S18_models_executed']==140
          assert not s150['S16_S17_original_parent_chain_connected']
          print('S151 PASS source weights retained:',sizes)
          Path('source_checkpoint_count.json').write_text(json.dumps(sizes,indent=2)+'\n')
          PY
      - name: Build immutable tar and file-level SHA256 audit evidence
        run: |
          set -euo pipefail
          mkdir -p model/s151
          cp source_checkpoint_count.json model/s151/
          find original evidence -type f -print0 | sort -z | xargs -0 sha256sum > model/s151/FILES_SHA256SUMS
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf model/s151/v273-S11-S16-S17-S18-original-weights-and-S149-S150-evidence.tar.gz original evidence
          (cd model/s151 && sha256sum v273-S11-S16-S17-S18-original-weights-and-S149-S150-evidence.tar.gz > BUNDLE_SHA256)
          du -h model/s151/*.tar.gz
      - name: Create permanent research-only release with unchanged original checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v273-original-S11-S16-S17-S18-weights-and-GOAT-s149-s150'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Already permanently archived; refusing to overwrite'
            exit 1
          fi
          gh release create "$TAG" \
            model/s151/v273-S11-S16-S17-S18-original-weights-and-S149-S150-evidence.tar.gz \
            model/s151/BUNDLE_SHA256 model/s151/FILES_SHA256SUMS model/s151/source_checkpoint_count.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'S11 S16 S17 S18 authentic original trained checkpoints - research only' \
            --notes 'Historical checkpoints originally from run IDs 37853663514/37855705158/37856164138/37856499212 plus new-audio S149/S150. S11 uses S9 adapter and S18 consumes S11 adapted (S16/S17 original chain not connected). No label read, no S80 independent score or official promotion.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s151-original-S11-S18-preservation-receipt
          path: |
            model/s151/BUNDLE_SHA256
            model/s151/FILES_SHA256SUMS
            model/s151/source_checkpoint_count.json
          retention-days: 30
