name: S719 CAL-only evidence-gated same-note retrigger ablation with six-metric guard
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - src/causal_note/s719_shadow_reattack.py
      - scripts/s719_shadow_reattack_cal.py
      - test/test_s719_shadow_reattack.py
      - test/test_s719_cal_contract.py
      - .github/workflows/note-s719-reattack-cal.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s719-reattack-cal-only
  cancel-in-progress: true
jobs:
  unpromoted_cal_selection_and_independent_score_guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install strictly pinned native runtime plus Torch CPU
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove exact original selector unchanged and six-score CAL gates
        run: |
          python -m compileall -q src/causal_note/s719_shadow_reattack.py scripts/s719_shadow_reattack_cal.py
          python -m unittest -v test.test_s719_shadow_reattack test.test_s719_cal_contract test.test_s708_cardinality_selection
      - name: Retrieve original S708+S707 checkpoints for identical measurements
        run: |
          mkdir -p /tmp/s719/s708 /tmp/s719/s707
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s719/s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s719/s707
          test -s /tmp/s719/s708/s708_selected.pt
          test -s /tmp/s719/s707/s675_hazard.joblib
      - name: Search guarded S719 retrigger trials on CAL before opening HELD/DEV
        run: |
          python -m scripts.s719_shadow_reattack_cal --s708-dir /tmp/s719/s708 --offset-checkpoint /tmp/s719/s707/s675_hazard.joblib --out /tmp/s719/output
      - name: Archive every variant metric for independent red-team review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S719_GUARDED_ONSET_RETRIGGER_CAL_HELD_DEV_NO_PROMOTION
          path: /tmp/s719/output/report.json
          retention-days: 60
          if-no-files-found: warn
