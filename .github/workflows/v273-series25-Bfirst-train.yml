name: V27.3 S25 train weak-first B-A recurrent heads
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series25-Bfirst-train.yml'
      - 'scripts/train_v273_Bfirst_recurrent.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and fixed preprocessing libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test B-first recurrence and K4 message perturbation
        run: python -m scripts.train_v273_Bfirst_recurrent --self-test
      - name: Get original acoustic features with archived checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio-source
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio-source
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/audio-source/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Get exact S18 preserved 2934 corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
      - name: Get original A-first S20 distributions for equal-pass comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37858383973 --repo "$GITHUB_REPOSITORY" --name v273-series20-residual --dir model/S20
      - name: Train and audit B-first neural experts excluding each evaluated piece
        run: >-
          python -m scripts.train_v273_Bfirst_recurrent
          --features model/features
          --s18 model/S18/predictions.npz
          --s20-probs model/S20/probabilities.npz
          --output model/S25
      - name: Publish correction/regression and weak-first comparisons
        run: cat model/S25/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series25-trained-Bfirst
          path: model/S25/
          retention-days: 90
