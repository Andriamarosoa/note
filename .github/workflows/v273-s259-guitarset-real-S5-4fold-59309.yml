name: S259 REAL original pretrained four S5 checkpoints score all 59309 GuitarSet native groups
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s259_original_S5_fourfold_GuitarSet_59309.py'
      - '.github/workflows/v273-s259-guitarset-real-S5-4fold-59309.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s259-original-S5-4models-59309-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_fourfold_S5_on_complete_GuitarSet_history:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Require exact 59k GuitarSet join and source layout is valid
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38311525987 --repo "${{ github.repository }}" --exit-status --interval 15
      - name: Original GuitarSet feature input 527D all four heldfolds actual native rows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38311525987
          name: s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16
          path: model/S258
      - name: Original four SHA256 validated historical S5 model joblib snapshots
        run: |
          set -euo pipefail
          for f in 0 1 2 4; do
            mkdir -p "model/S5original/fold${f}"
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/Andriamarosoa/note/7165e1ef54510aa9effc9f597b2783c832ca907a/analysis/evidence/v273-open-k0-k6/series5/models/fold${f}/model.joblib" \
              -o "model/S5original/fold${f}/model.joblib"
          done
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_v273_s5_owned527_recovery import MODEL_DIGEST,FOLDS,digest
          assert all(digest(Path(f'model/S5original/fold{f}/model.joblib'))==MODEL_DIGEST[f] for f in FOLDS)
          PY
      - name: Genuine original four S5 model calls on all original GuitarSet rows, truth still isolated
        run: |
          python -u -m scripts.s259_original_S5_fourfold_GuitarSet_59309 \
            --s236 model/S258/S258_GuitarSet_59309_owned527.npz \
            --models model/S5original --out model/S259
      - name: Verify complete fourfold trained model inference and no re-fit, not independent OOF
        run: |
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S259/report.json'))
          assert r['original_native_reference_event_count']==59309
          assert r['original_trained_S5_fold_count']==4
          assert r['crossfold_on_historical_development_rows_not_pure_OOF']
          assert not r['independent_accuracy_measured']
          with np.load('model/S259/S259_original_S5_fourfold_59309_original_native_unlabelled.npz') as z:
            assert z['original_S5_K_by_fold'].shape==(4,59309)
          print('S259 PASS original S5 all 4 actual trained models on 59309 original GuitarSet native source rows, no labels fed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s259-guitarset-59309-full-original-4fold-S5-train-mixed-predictions
          path: model/S259/
          retention-days: 90
