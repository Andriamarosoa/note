name: S392 audit original S390 S391 K5 source acoustic confidence overlap
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s392_k5_static_oof_signal_separability.py'
      - '.github/workflows/v273-s392-K5-static-signal-overlap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s392-k5-static-overlap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_four_K5_heldfold_rankings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0
      - name: Restore unchanged original S80 predictions
        run: |
          gh run download 38314291222 -n s272-guitarset-59309-new-full-original-weight-S80-foldneutral-locked -D model/S272 --repo ${{ github.repository }}
      - name: Restore original YourMT3 full decoder same-row benchmark with labels
        run: |
          gh run download 37605163312 -n yourmt3-exactk-summary -D model/YourMT3 --repo ${{ github.repository }}
      - name: Restore original heldfold-trained K5 posterior outputs S390 and S391
        run: |
          gh run download 38350679942 -n s390-true-original-heldfold-GuitarSet-104D-1133D-K5-source-trained-DIAGNOSTIC -D model/S390 --repo ${{ github.repository }}
          gh run download 38351071250 -n s391-trueK4K5-trueK3K4K5-heldfold-audio1133-source-HEADS-no-reference-change -D model/S391 --repo ${{ github.repository }}
      - name: Quantify OOF static K5 confidence overlap, NO training or threshold edits
        run: |
          python -u -m scripts.s392_k5_static_oof_signal_separability \
            --s80 model/S272/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --your model/YourMT3/predictions.npz \
            --s390 model/S390 \
            --s391 model/S391 \
            --out model/S392
          python - <<'PY'
          import json
          v=json.load(open('model/S392/report.json'))
          assert v['status']=='S392_K5_SOURCE_STATIC_SCORE_SEPARABILITY_DIAGNOSTIC'
          assert v['original_S80_K4_count']==1115
          assert v['true_K5_among_S80_K4']==224
          assert len(v['scores'])==4
          assert not v['learned_heads_not_promoted'] is False
          assert v['S80_reference_unchanged']
          print('S392 PASS four OOF acoustic K5 rank/AUC audits, S80 unchanged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s392-k5-ROC-AUC-AP-static-signal-overlap-OOF-diagnostic
          path: model/S392/
          retention-days: 90
