name: V27.3 S19 learned recurrent A-B-A K0-K6
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series19-aba-recurrent.yml'
      - 'scripts/train_v273_aba_recurrent.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v273-series19-aba-recurrent
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy SciPy and PyTorch CPU
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove A receives a B-message and reacts counterfactually
        run: python -m scripts.train_v273_aba_recurrent --self-test
      - name: Fetch SHA256-bound original acoustic features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/audio-source
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/audio-source
          for fold in 0 1 2 4; do
            mkdir -p "model/full-audio/fold-$fold"
            tar -xf "model/audio-source/v273-open-features-$fold.tar" -C "model/full-audio/fold-$fold"
          done
      - name: Fetch independently replayed conservative S18 reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/reference-s18
      - name: Train recurrent A-B-A network cross-piece and audit every passage
        run: >-
          python -m scripts.train_v273_aba_recurrent
          --features model/full-audio
          --s18 model/reference-s18/predictions.npz
          --output model/series19-recurrent
      - name: Publish multi-pass regression and exclusion sensitivity
        run: cat model/series19-recurrent/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series19-recurrent
          path: model/series19-recurrent/
          retention-days: 90
