name: V27.3 Inner Candidate Hidden1 Neuron Audit

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-inner-candidate-hidden1-neurons-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-inner-candidate-hidden1-neuron-audit
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-inner-candidate-hidden1-neurons-${{ github.run_id }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate neuron audit
        run: |
          python -m py_compile scripts/audit_v273_inner_candidate_hidden1_neurons.py

      - name: Restore bundle and internal checkpoints only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/inner
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-inner-candidate-hidden1-audit-37247417133             --repo "${{ github.repository }}"             --pattern v273-inner-candidate-hidden1-audit-result.tgz             --dir model/download
          tar -xzf model/download/v273-inner-candidate-hidden1-audit-result.tgz -C model/inner

          test -f model/bundle/bundle.json
          test -f model/inner/inner_uniform.weights.h5
          test -f model/inner/inner_freeze_local_combo.weights.h5

      - name: Run neuron-level inner audit
        run: |
          python -B scripts/audit_v273_inner_candidate_hidden1_neurons.py             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --uniform-weights model/inner/inner_uniform.weights.h5             --freeze-weights model/inner/inner_freeze_local_combo.weights.h5             --output model/result

      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 inner candidate_hidden1 neuron audit"             --notes-file model/result/report.md
          gh release upload "$TAG"             model/result/report.json             model/result/report.md             --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: v273-inner-candidate-hidden1-neurons
          path: model/result/
          retention-days: 90
