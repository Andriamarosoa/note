name: S198 full original 7493 historical 255x9 group audit fourfold trained-cache reconstruction
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s198_assemble_replayed_original_255x9_all_four_folds.py'
      - '.github/workflows/v273-s198-full-original-255x9-fourfold.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s198-original-fourfold-255x9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate_verified_255x9_outer_folds:
    strategy:
      fail-fast: false
      matrix:
        fold: [0,1,2,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compatible original pinned producer replay
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Extract archived 14 plus 14 original train-fold source caches, reconstruct all receiver rows (no sample limit)
        run: |
          set -euo pipefail
          python -u -m scripts.s197_replay_original_255x9_from_frozen_28_caches \
            --root . --fold ${{ matrix.fold }} --limit 0 --out model/S198/fold${{ matrix.fold }}
          python - <<'PY'
          import json,glob
          d=json.load(open(glob.glob('model/S198/fold*/report.json')[0]))
          assert d['original_group_proposal_mismatches']==0
          assert d['aggregate_20D_max_absolute_discrepancy']<=2e-5
          assert d['all_receiver_rows_reproduce_historical_20D_audits_with_tolerance_2e_minus_5']==d['held_rows']
          assert not d['receiver_truth_used_for_features_or_audits']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v273-s198-original-255x9-fold-${{ matrix.fold }}-hist-deployment-not-S80
          path: model/S198/fold${{ matrix.fold }}/
          retention-days: 90
  independent_complete_aggregate:
    needs: [regenerate_verified_255x9_outer_folds]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Combined matrix validator prerequisites
        run: python -m pip install numpy==1.26.4
      - name: Download all four successful historical original audit replays
        uses: actions/download-artifact@v4
        with:
          pattern: v273-s198-original-255x9-fold-*
          path: model/S198/inputs
      - name: Map artifact directories back to fold-indexed filenames for exact verification
        run: |
          python - <<'PY'
          from pathlib import Path
          for fold in (0,1,2,4):
              src=Path(f'model/S198/inputs/v273-s198-original-255x9-fold-{fold}-hist-deployment-not-S80')
              assert src.is_dir(),str(src)
              dst=Path(f'model/S198/folds/fold{fold}')
              dst.mkdir(parents=True)
              for name in ('report.json','original_9D_fold_audits_REPLAY.npz'):
                  (dst/name).write_bytes((src/name).read_bytes())
          PY
      - name: Independently verify exact original 255 actions and 9 audits cover every one of 7493 held events exactly once
        run: |
          python -m scripts.s198_assemble_replayed_original_255x9_all_four_folds --self-test
          python -u -m scripts.s198_assemble_replayed_original_255x9_all_four_folds \
             --root . --folds model/S198/folds --out model/S198/final
          python - <<'PY'
          import json
          d=json.load(open('model/S198/final/report.json'))
          assert d['historical_eligible_event_count']==7493
          assert d['total_original_audit_scalars_restored']==7493*255*9
          assert d['all_20D_aggregated_historical_audit_features_reproduced']
          assert not d['S5_527D_original_upstream_constructor_matched']
          assert not d['S80_promoted']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s198-authentic-all-7493-historical-original-255x9-fourfold-audit-reconstruction
          path: model/S198/final/
          retention-days: 90
