name: Onset direct acoustic PCM256
on:
  push:
    branches: [codex/note-onset-acoustic-direct256]
    paths:
      - 'src/onset256/**'
      - 'scripts/onset_acoustic_direct256.py'
      - 'tests/**'
      - '.github/workflows/onset-acoustic-direct256.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-onset256.txt
      - run: python -m unittest discover -s tests -v
