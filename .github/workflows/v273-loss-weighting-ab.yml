name: V27.3 Learned Gate K2/K3 Half K4 Quarter A/B

on:
  push:
    branches: [codex/v273-failure-clustering]
    paths:
      - 'analysis/v273-loss-weighting-launch.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v273-loss-weighting-fold3
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
  TAG: v273-loss-weighting-${{ github.run_id }}
  UNIFORM_REFERENCE_TAG: v273-loss-weighting-37208199201

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Validate matched loss-weighting contract
        run: |
          python -m py_compile scripts/train_v273_loss_weighting_ab.py scripts/summarize_v273_loss_weighting_ab.py
          python - <<'PY'
          import numpy as np
          from scripts.train_v273_group_gate_ab import build_model, weight_hash
          from scripts.train_v273_loss_weighting_ab import class_weight_table

          seed=16061+1003
          a=build_model('learned_gate',seed)
          b=build_model('learned_gate',seed)
          assert weight_hash(a)==weight_hash(b)
          pa=sum(int(np.prod(v.shape)) for v in a.trainable_variables)
          pb=sum(int(np.prod(v.shape)) for v in b.trainable_variables)
          assert pa==pb

          toy=np.array([0,0,0,1,1,2,2,3,4,5,6],dtype=np.int32)
          u=class_weight_table('uniform',toy)
          w=class_weight_table('sqrt_balanced',toy)
          t=class_weight_table('targeted_k23_half_k4_quarter',toy)
          assert np.allclose(u,1.0)
          assert np.isfinite(w).all() and np.all(w>0)
          assert np.allclose(t[[0,1,5,6]],1.0)
          assert np.isclose(t[2],1.0+0.5*(w[2]-1.0))
          assert np.isclose(t[3],1.0+0.5*(w[3]-1.0))
          assert np.isclose(t[4],1.0+0.25*(w[4]-1.0))
          print({'initial_hash':weight_hash(a),'trainable_params':pa,
                 'uniform':u.tolist(),'sqrt_balanced_example':w.tolist(),
                 'targeted_k23_half_k4_quarter_example':t.tolist()})
          PY

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --prerelease             --title "V27.3 learned_gate K2/K3 half + K4 quarter A/B"             --notes "Matched fold3 comparison on the learned_gate architecture. The uniform control is frozen from run 37208199201 and is not retrained. Experimental arm: K2/K3 are halfway from uniform to sqrt-balanced, K4 is only one quarter toward sqrt-balanced, and K0/K1/K5/K6 remain 1. No automatic promotion."

  train:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        arm: [targeted_k23_half_k4_quarter]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install pinned runtime
        run: python -m pip install -r requirements-train.txt numpy==1.26.4

      - name: Restore frozen bundle and Cluster A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/download model/bundle model/cluster
          gh release download v273-window-pair-36351028493             --repo "${{ github.repository }}"             --pattern native-window-bundle.zip             --dir model/download
          unzip -q model/download/native-window-bundle.zip -d model/bundle

          gh release download v273-failure-clustering-36999901054             --repo "${{ github.repository }}"             --pattern v273-failure-clustering-rows.csv             --dir model/cluster

          test -f model/bundle/bundle.json
          test -f model/cluster/v273-failure-clustering-rows.csv

      - name: Train ${{ matrix.arm }}
        run: |
          python -B scripts/train_v273_loss_weighting_ab.py             --arm "${{ matrix.arm }}"             --bundle model/bundle             --config analysis/v273-native-paired-config.json             --cluster-rows model/cluster/v273-failure-clustering-rows.csv             --output "model/result/${{ matrix.arm }}"

      - name: Publish arm immediately
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d "model/result/${{ matrix.arm }}" ]; then
            tar -czf "model/v273-loss-weighting-${{ matrix.arm }}.tgz" -C "model/result/${{ matrix.arm }}" .
            gh release upload "$TAG" "model/v273-loss-weighting-${{ matrix.arm }}.tgz"               --repo "${{ github.repository }}" --clobber || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-loss-weighting-${{ matrix.arm }}
          path: model/result/${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 90

  summarize:
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install summary runtime
        run: python -m pip install numpy==1.26.4

      - uses: actions/download-artifact@v4
        with:
          name: v273-loss-weighting-targeted_k23_half_k4_quarter
          path: model/arms/v273-loss-weighting-targeted_k23_half_k4_quarter

      - name: Restore validated frozen uniform control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/reference-uniform model/input/uniform model/input/targeted_k23_half_k4_quarter
          gh release download "$UNIFORM_REFERENCE_TAG"             --repo "${{ github.repository }}"             --pattern v273-loss-weighting-uniform.tgz             --dir model/reference-uniform
          tar -xzf model/reference-uniform/v273-loss-weighting-uniform.tgz -C model/input/uniform
          test -f model/input/uniform/report.json
          test -f model/input/uniform/predictions.npz

      - name: Normalize experimental arm directory
        run: |
          cp -a model/arms/v273-loss-weighting-targeted_k23_half_k4_quarter/. model/input/targeted_k23_half_k4_quarter/
          test -f model/input/targeted_k23_half_k4_quarter/report.json
          test -f model/input/targeted_k23_half_k4_quarter/predictions.npz

      - name: Summarize matched A/B
        run: |
          python -B scripts/summarize_v273_loss_weighting_ab.py             --input model/input             --output model/summary

      - name: Publish summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" model/summary/report.json model/summary/report.md             --repo "${{ github.repository }}" --clobber
          gh release edit "$TAG"             --repo "${{ github.repository }}"             --notes-file model/summary/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: v273-loss-weighting-summary
          path: model/summary/
          retention-days: 90
