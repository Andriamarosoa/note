name: S266 five genuine original S1-S4 coherent champions across 59309 GuitarSet rows and 19 branches
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - '.github/workflows/v273-s266-guitarset-five-original-rare-S45.yml'
      - 'scripts/s266_original_five_GuitarSet_dtype_compat.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s266-five-rare-original-GuitarSet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual_original_recovered_S1_to_S4_and_coherent:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 h5py==3.16.0
      - name: Restore genuine 7493-history source model checkpoint proof and true original 59k GuitarSet audio
        run: |
          gh run download 38234363815 -n recovered-five-original-family-runtime-historical-and-GOAT-proof -D model/rare
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258
      - name: Restore original 58D acoustic feature bank plus historical original 58D fundamental responses on exactly 59309 native IDs
        run: |
          mkdir -p model/S266src
          python - <<'PY'
          import numpy as np
          from scripts.recover_v273_255_producers import PREPARED
          a='model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz'
          with np.load(a,allow_pickle=False) as z:
            ids=z['row_id'].copy();x=z['summary58'].copy();b=z['incumbent_freeze_K'].copy()
          with np.load(PREPARED,allow_pickle=False) as z:
            idx=z['global_index'];names=z['feature_names'].copy()
            assert len(names)==58  # original rarity-prepared registry is intentionally K2/K3/K4 only
          with np.load('analysis/evidence/v273-recovered-255/inputs/historical_fundamental58.npz',allow_pickle=False) as z:
            key=z['global_index'];f=z['fundamental']
          # Original historical fundamental archive contains only the
          # preselected K2/K3/K4 rows (not all 59309). Fill just those
          # exact native positions, never infer fundamental values.
          allidx=ids.astype(np.int64)
          where=np.searchsorted(allidx,key.astype(np.int64))
          assert np.all(where<len(allidx)) and np.array_equal(allidx[where],key)
          eligible=np.isin(b,[2,3,4])
          assert len(where)==int(eligible.sum())
          assert np.array_equal(np.sort(where),np.flatnonzero(eligible))
          f_full=np.zeros((len(ids),58),np.float32)
          f_full[where]=f.astype(np.float32)
          f=f_full
          assert f.shape==(59309,58) and x.shape==(59309,58)
          np.savez_compressed('model/S266src/original_historic_59309_fundamentals.npz',
            row_id=ids,features=x,fundamental=f,feature_names=names)
          np.savez_compressed('model/S266src/original_historic_59309_freeze.npz',
            row_id=ids,freeze_K=b)
          print('S266 original 58D audio/fundamental historical native GuitarSet 59309 aligned')
          PY
      - name: Genuine five rare original trained historical championship models on 59309 GuitarSet events, all 19 heldpiece branches
        run: |
          python -u -m scripts.s266_original_five_GuitarSet_dtype_compat \
            --runtime model/rare/runtime \
            --historical-proof model/rare/historical/report.json \
            --external model/S266src/original_historic_59309_fundamentals.npz \
            --s5 model/S266src/original_historic_59309_freeze.npz \
            --out model/S266
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S266/report.json'))
          assert r['external_events']==59309 and r['branches']==19
          with np.load('model/S266/external_five_families.npz') as z:
            assert z['predictions'].shape==(19,59309,5)
          print('S266 PASS five rare original S1–S4/coherent winners re-executed, not OOF')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s266-original-five-rare-S45-guitarset-59309-all-19-branches
          path: model/S266/
          retention-days: 90
