name: S717 real GuitarSet S708/S707 offline versus S716 causal emitted-note audit
on:
  push:
    branches: [codex/note-s713-independent-code-audit-agents]
    paths:
      - scripts/s717_validate_s716_guitarset.py
      - src/causal_note/s716_s707_online.py
      - .github/workflows/note-s717-real-guitarset-s716.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s717-guitarset-causal-offset
  cancel-in-progress: true
jobs:
  paired_44_real_guitar_records:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native NOTE and PyTorch CPU reproducibly
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight strict causal release and score contracts
        run: |
          python -m compileall -q scripts/s717_validate_s716_guitarset.py src/causal_note/s716_s707_online.py
          python -m unittest -v test.test_s716_online_s707 test.test_s713_metric_contract
      - name: Retrieve original frozen signed S708 and S675 hazard
        run: |
          mkdir -p /tmp/s717_s708 /tmp/s717_s675
          gh run download 39094682419 --repo "${{ github.repository }}" --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s717_s708
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s717_s675
          test -s /tmp/s717_s708/s708_selected.pt
          test -s /tmp/s717_s675/s675_hazard.joblib
      - name: Replay same 44 GuitarSet HELD+DEV sources with paired emitted six metrics
        run: |
          python -m scripts.s717_validate_s716_guitarset --s708-dir /tmp/s717_s708 --offset-checkpoint /tmp/s717_s675/s675_hazard.joblib --out /tmp/s717_output
      - name: Archive full emitted-note evidence and score-by-pitch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S717_GUITARSET_ONLINE_VS_OFFLINE_S707_NO_PROMOTION
          path: /tmp/s717_output
          retention-days: 30
          if-no-files-found: warn
