name: S736 audited fragment Onset router contracts
on:
  push:
    branches: [codex/note-s736-neural-fragment-mask]
    paths:
      - src/causal_note/s736_fragment_mask.py
      - test/test_s736_fragment_mask.py
      - .github/workflows/note-s736-audited-combo-contract.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audited_fragment_router:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check causal 4-hop, all 32 masks, learned Exact-K masks/risk, frozen channels
        run: |
          python -m compileall -q src/causal_note/s736_fragment_mask.py test/test_s736_fragment_mask.py
          python -m unittest -v test.test_s736_fragment_mask
