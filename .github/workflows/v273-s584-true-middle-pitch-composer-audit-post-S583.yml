name: S584 independent source MIDI SHA replay individual medium 12-note false harmonics vs genuine NoteOn losses
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s584_replay_fifth_held_midi_note60_71_false_harmonic_loss_audit.py
      - .github/workflows/v273-s584-true-middle-pitch-composer-audit-post-S583.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  independently_reproduce_all_real_MIDI_note_confusion_counts_by_exact_pitch60to71:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Source immutable MIDI NoteOn exact 12-pitch evaluation dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 mido==1.3.3
      - name: Confirm per-pitch score matching cannot hide a true reattack
        run: |
          python -m py_compile scripts/s584_replay_fifth_held_midi_note60_71_false_harmonic_loss_audit.py
          python -m scripts.s584_replay_fifth_held_midi_note60_71_false_harmonic_loss_audit --self-test
      - name: Restore exactly SHA-frozen historical original fifth cohort music only, no training data
        run: |
          gh run download 38675435536 -n s577-fifth-novel-five-original-maestro-train-composers-after28-exposed-ONLY-METADATA -D model/S577 --repo "${{ github.repository }}"
          gh run download 38675724837 -n s582-four-frozen-noteon-source-policies-global28-vs-mid12-before-original-S577-MIDI -D model/S582 --repo "${{ github.repository }}"
          gh run download 38675826715 -n s583-fifth-new-MAESTRO-real-MIDI-NoteOn-F1-global28-vs-special-mid12-four-fixed-policies -D model/S583 --repo "${{ github.repository }}"
      - name: Independently reopen original source MIDI SHA, replay 4 policies, all 12 middle keys and reproduce S583 complete confusion
        run: |
          python -u -m scripts.s584_replay_fifth_held_midi_note60_71_false_harmonic_loss_audit \
            --manifest model/S577/report.json \
            --freeze-report model/S582/report.json \
            --score-report model/S583/report.json \
            --predictions model/S582/S582_NEW_FIFTH_COMPOSERS_FOUR_NAMED_NOTES_PREMIDI.jsonl \
            --out model/S584
          python - <<'PY'
          import json
          r=json.load(open("model/S584/report.json"))
          assert r["status"]=="S584_FIFTH_SOURCE_TRUE_MIDI_MIDDLE_PITCH_FAILURE_SHA_REPLAY_POSTHOC"
          assert r["same_all_original_source_MIDI_SHA_reverified"]
          assert r["all_per_pitch_totals_reconstruct_exact_S583"]
          assert r["posthoc_not_new_blind_source_validation"]
          assert len(r["policy_midi_pitch_register_scores"])==4
          assert len(r["per_source"])==5
          assert len(r["specialist_vs_general_true_notes_lost_and_false_pitches_removed"])==2
          assert r["old_original_S80_ExactK_Live_not_modified"] and r["no_promotion"]
          print("S584 PASS independent fifth 12 middle exact MIDI pitches true NoteOn regressions reproducible")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s584-replay-fifth-held-original-MIDI-S583-mid12-genuine-note-loss-per-pitch-audit
          path: model/S584/
          retention-days: 90
