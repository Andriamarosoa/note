name: S374 real untouched last eight IDMT chords original official V88 freeze audio only AFTER training
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s374_original_freeze_V88_last8_unseen_chords_PREXML.py'
      - '.github/workflows/v273-s374-last8-new-true-official-V88-PREXML.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s374-last8-first-audio-after-fixed-GuitarSet-trained
  cancel-in-progress: true
jobs:
  original_V88_source_only_eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PYTHONPATH: '.:src'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: REQUIRE eight WAV source file names SHA reserved and original GuitarSet expert entirely TRAINED without IDMT before opening any WAV
        run: |
          gh run watch 38334876066 --repo ${{ github.repository }} --exit-status --interval 15
          gh run watch 38334934114 --repo ${{ github.repository }} --exit-status --interval 15
          gh run download 38334876066 \
            -n s372-prospective-last8-original-IDMT-Dataset1-WAV-XML-NAMES-UNOPENED \
            -D model/S372 --repo ${{ github.repository }}
          gh run download 38334934114 \
            -n s373-fourfold-GuitarSet-only-K3-104D-vs-1133D-experts-fixed80pct-NO-IDMT \
            -D model/S373 --repo ${{ github.repository }}
          python - <<'PY'
          import json
          a=json.load(open('model/S372/report.json'))
          b=json.load(open('model/S373/report.json'))
          assert len(a['final_eight'])==8 and not a['all_XML_annotation_contents_read'] and not a['all_WAV_contents_read']
          assert b['training_only_GUITARSET_59309_NO_IDMT_AUDIO_OR_XML'] and b['fixed_P3_threshold']==0.8
          assert b['future_external_unseen_WAVs_assigned_to_S372_precommitted']
          print('S374 PASS original GuitarSet K3 specialist fully trained and SHA-frozen first, eight new WAVs never read')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-train.txt numpy==1.26.4 scikit-learn==1.4.2
      - name: Restore immutable original V84 V86 V87 V88 pretrained acoustic sources
        run: |
          mkdir -p model/source-download
          gh release download v273-source-recovery-35086829802 \
            --repo ${{ github.repository }} \
            --pattern v273-rebuilt-proposal-sources.zip \
            --dir model/source-download
          python - <<'PY'
          from pathlib import Path
          from scripts.restore_v273_original_backup import extract_verified
          from scripts.rebuild_v273_sources import validate_sources
          extract_verified(Path('model/source-download/v273-rebuilt-proposal-sources.zip'),
            Path('model/original-sources'),
            'fb6bb1049b87c0517936f4f40e5bc1442722fc20b9eba5045a62bb0a12cf2994',
            validate=validate_sources)
          PY
      - name: Original unchanged official freeze_local_combo trained weights
        run: |
          mkdir -p model/freeze-original model/freeze-download
          gh release download v273-uniform-anchored-freeze-37233793945 \
            --repo ${{ github.repository }} \
            --pattern v273-uniform-anchored-freeze-result.tgz \
            --dir model/freeze-download
          tar -xzf model/freeze-download/v273-uniform-anchored-freeze-result.tgz -C model/freeze-original
          test -s model/freeze-original/freeze_local_combo.weights.h5
      - name: Execute true official V88 baseline native event extraction only, no XML or score or selected expert variant
        run: |
          python -u -m scripts.s374_original_freeze_V88_last8_unseen_chords_PREXML \
            --sources model/original-sources \
            --weights model/freeze-original/freeze_local_combo.weights.h5 \
            --s372 model/S372/report.json \
            --out model/S374
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S374/report.json'))
          assert r['status']=='S374_TRUE_OFFICIAL_FREEZE_ON_UNEXPOSED_DATASET1_8_WAV_UNLABELLED'
          assert r['count_WAV']==8 and r['original_native_event_count']>0
          assert r['selected_dataset1_new_8_filename_only_priority']
          assert not r['XML_MIDI_annotated_contents_read'] and not r['promotion_eligible']
          with np.load('model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz',allow_pickle=False) as z:
            assert len(set(map(str,z['member'])))==8
            assert z['incumbent_probabilities'].shape==(len(z['row_id']),7)
          print('S374 PASS original unchanged 8 WAV baseline, new expert already trained, zero original XML read')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s374-last8-IDMT-source-only-true-original-V88-official-PREXML
          path: |
            model/S374/report.json
            model/S374/S374_official_V88_dataset1_prospective_8_WAV_predictions.npz
          retention-days: 90
