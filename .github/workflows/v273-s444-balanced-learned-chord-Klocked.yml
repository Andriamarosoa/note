name: S444 count-balanced composition-held joint chord note learning, no K regression
on:
  push:
    branches: [codex/s444-learned-joint-note-swap-klocked]
    paths:
      - 'scripts/s444_balanced_joint_note_swap_songheld_Klocked.py'
      - '.github/workflows/v273-s444-balanced-learned-chord-Klocked.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s444-original-ooF-song-disjoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learn_joint_pitch_sets_with_inner_composition_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned historical acoustic/ML stack
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Test learned chord feature contract and original-K abstention
        run: |
          python -m py_compile scripts/s444_balanced_joint_note_swap_songheld_Klocked.py
          python -u -m scripts.s444_learned_joint_note_swap_songheld_Klocked --self-test
      - name: Restore historical genuine GuitarSet 59309 events and annotations only as training targets
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
          test -f model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz
          test -f model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz
      - name: Restore unchanged composition-held old note proposals S416 and frozen S428
        run: |
          gh run download 38381449092 -n s416-native-CNN-time-pitch-note-head-songheld-S80-ExactK-LOCKED-NO-YourMT -D model/S416 --repo ${{ github.repository }}
          gh run download 38517551029 -n s428-acoustic-harmonic-direct-note-names-S80-ExactK-LOCKED-S419-pair -D model/S428 --repo ${{ github.repository }}
          test -f model/S416/S416_NATIVE_Kfirst_MIDI_NOTE_59309_SONG_OOF.npz
          test -f model/S428/S428_NOTE_NAMES_S80_K_LOCKED_59309.npz
      - name: Obtain SHA-verified official original JAMS for TRAINING songs
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 3 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip' | md5sum -c -
      - name: Fit four song-held K2 K3 K4 joint pitch swap models and freeze all named notes before scoring
        run: |
          python -u -m scripts.s444_learned_joint_note_swap_songheld_Klocked \
            --audio model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80 model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s416 model/S416/S416_NATIVE_Kfirst_MIDI_NOTE_59309_SONG_OOF.npz \
            --s428 model/S428/S428_NOTE_NAMES_S80_K_LOCKED_59309.npz \
            --truth model/S258/S258_GuitarSet_59309_true_K_ONLY_FOR_FINAL_AUDIT.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S444
          python - <<'PY'
          import json,numpy as np
          d=json.load(open('model/S444/report.json'))
          assert d['status']=='S444_LEARNED_JOINT_NOTE_SET_SONGHELD_K_LOCKED_DEV'
          assert d['original_S80_K_regressions']==0
          assert d['original_S80_global_correct']==d['candidate_S80_global_correct']==53529
          assert d['original_S80_poly_correct']==d['candidate_S80_poly_correct']==6054
          assert d['unchanged_K0_K1_K5_K6']
          assert d['composition_disjoint_S444_folds']
          assert d['inner_gates_only_other_compositions'] and d['label_blind_balanced_composition_inner_partition']
          assert d['S428_S416_auxiliary_OOF_not_fully_nested'] and d['no_promotion']
          with np.load('model/S444/S444_FROZEN_NOTE_NAMES_KLOCKED_59309.npz') as f:
            assert len(f['row_id'])==59309
            assert np.array_equal((f['midi_pitch_slots']>=0).sum(1),f['s80_K'])
          print('S444 complete; per-true-K corrections/regressions measured without changing original S80')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s444-joint-chord-learned-songheld-Klocked-guitarset-dev-NOPROMOTION
          path: model/S444/
          retention-days: 90
