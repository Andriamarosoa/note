name: S535 six truly trained onset+harmonic MIDI note heads with all candidate negatives and whole-song held validation
on:
  push:
    branches: [codex/s533-s535-note-fundamental-loops]
    paths:
      - scripts/s535_train_all_event_onset_pitch_harmonic_experts.py
      - .github/workflows/v273-s535-full-onset-harmonic-pitch-training.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  six_actual_instrument_pitch_harmonic_heads_held_songs:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original full-MIDI and ExtraTrees harmonic pitch head dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - name: Verify separate original 49x11 note evidence and actual new fundamental competition feature matrix
        run: |
          python -m py_compile scripts/s535_train_all_event_onset_pitch_harmonic_experts.py
          python -m scripts.s535_train_all_event_onset_pitch_harmonic_experts --self-test
      - name: Recover SHA-frozen original 330 MAESTRO note-on annotations and full 575 piano V88 source candidates
        run: |
          gh run download 38558629021 -n s469-third-corpus-MAESTRO-v3-3-test-piano-filename-only-PREMIDI -D model/S469 --repo "${{ github.repository }}"
          gh run download 38559667980 -n s471-real-third-source-MAESTRO-piano-V88-birth-vs-MIDI-onset-postfreeze -D model/S471 --repo "${{ github.repository }}"
          gh run download 38647316407 -n s527-prelabel-575-original-MAESTRO-V88-K0-onsets-with-49-real-raw-audio-note-features -D model/S527 --repo "${{ github.repository }}"
          gh run download 38647706630 -n s528-three-songheld-six-trained-raw-note-experts-all-V88-K0-pitch-identity-audit -D model/S528 --repo "${{ github.repository }}"
          gh run download 38648092726 -n s529-frozen-sourceheld-new-MIDI-pitch-protected-addition-and-unknown-onset-audit -D model/S529 --repo "${{ github.repository }}"
      - name: Train six actual recording-excluded note pitch experts and score EVERY true note and emitted false pitch
        run: |
          python -u -m scripts.s535_train_all_event_onset_pitch_harmonic_experts \
            --manifest model/S469/report.json --s471-report model/S471/report.json \
            --audio model/S527/S527_ALL_V88_K0_K6_ORIGINAL_WAV_49_PITCH_FEATURES_PREMIDI.jsonl \
            --audio-report model/S527/report.json \
            --trained model/S528/S528_ALL_V88_K0_AUDIO_GENERATED_NOTE_PROBABILITIES_49.jsonl \
            --trained-report model/S528/report.json \
            --protect-report model/S529/report.json --out model/S535
          python - <<'PY'
          import json
          r=json.load(open('model/S535/report.json'))
          assert r["status"]=="S535_HELD_FULL_EVENT_NEGATIVE_HARMONIC_PITCH_EXPERTS"
          assert r["actual_trained_checkpoints"]==6 and len(r["models"])==6
          assert r["true_positive_MIDI_matched_onsets"]==322
          assert r["negative_candidates_253_use_full_original_MIDI_matched_event_rule"]
          assert r["true_full_MIDI_onset_groups"]==330
          assert r["training_49_pitch_predictions_at_all_575_V88_original_events"]
          assert r["no_promotion"] and r["no_original_S80_or_V88_K_Live_modification"]
          print('S535 six real fully trained harmonic vs original physical pitch experts pass full MIDI replay')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s535-six-truly-trained-held-original-piano-note-harmonic-vs-raw-full-MIDI-events
          path: model/S535/
          retention-days: 90
