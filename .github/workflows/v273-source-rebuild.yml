name: Rebuild missing V27.3 sources from GuitarSet

# Only an explicit launch-request edit starts this costly recovery. Normal
# code/report edits do not start another training run.
on:
  push:
    branches: [v280-harmonic-pitch-count-research]
    paths: ['analysis/v273-source-rebuild-launch.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v273-source-rebuild
  cancel-in-progress: false

env:
  PYTHONPATH: '.:src'
  PYTHONUNBUFFERED: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  RECOVERY_TAG: v273-source-recovery-${{ github.run_id }}
  GUITARSET_CACHE_KEY: guitarset-pickup-mix-b39b78e63d3446f2e54ddb7a54df9b10-aecce79f425a44e2055e46f680e10f6a

jobs:
  preserve:
    name: Preserve remaining original sources before expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Choose the original source archive route
        id: source-route
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('analysis/v273-rebuild-historical-config.json','utf8'));
            core.setOutput('route', cfg.preserved_originals_backup ? 'preserved_release' : 'original_artifacts');
      - name: Verify original producer identities and archive checksums
        if: steps.source-route.outputs.route == 'original_artifacts'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('analysis/v273-rebuild-historical-config.json','utf8'));
            const repo = {owner:context.repo.owner,repo:context.repo.repo};
            for (const source of cfg.archived_sources) {
              const {data:run} = await github.rest.actions.getWorkflowRun({...repo,run_id:source.run_id});
              if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== source.head_sha)
                throw new Error(`Original producer mismatch: ${source.run_id}`);
              const all = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {...repo,run_id:source.run_id,per_page:100});
              const found = all.filter(a => a.name === source.name);
              if (found.length !== 1 || found[0].expired || found[0].id !== source.id || found[0].digest !== source.digest)
                throw new Error(`Original artifact changed or expired: ${source.name}`);
            }
      - uses: actions/download-artifact@v4
        if: steps.source-route.outputs.route == 'original_artifacts'
        with:
          repository: Andriamarosoa/note
          github-token: ${{ github.token }}
          run-id: '33618443266'
          name: v101-string-query-attention
          path: model/preserved-original/v101
      - uses: actions/download-artifact@v4
        if: steps.source-route.outputs.route == 'original_artifacts'
        with:
          repository: Andriamarosoa/note
          github-token: ${{ github.token }}
          run-id: '33625061774'
          name: v102-source-time-assignment
          path: model/preserved-original/v102
      - uses: actions/download-artifact@v4
        if: steps.source-route.outputs.route == 'original_artifacts'
        with:
          repository: Andriamarosoa/note
          github-token: ${{ github.token }}
          run-id: '33647694565'
          name: v104-nested-deployment-audit
          path: model/preserved-original/v104-audit
      - uses: actions/download-artifact@v4
        if: steps.source-route.outputs.route == 'original_artifacts'
        with:
          repository: Andriamarosoa/note
          github-token: ${{ github.token }}
          run-id: '34346175521'
          name: v280-cluster-metadata
          path: model/preserved-original/cluster-metadata
      - name: Restore the verified source backup after original artifact expiry
        if: steps.source-route.outputs.route == 'preserved_release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/restore_v273_original_backup.py \
            --config analysis/v273-rebuild-historical-config.json \
            --output-dir model/preserved-original
      - name: Verify historical expert configuration and package original sources
        run: |
          python - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          root=Path('model/preserved-original')
          cfg=json.loads(Path('analysis/v273-rebuild-historical-config.json').read_text())
          for name in ('v101','v102'):
              paths=list((root/name).rglob('report.json'))
              assert len(paths)==1
              actual=json.loads(paths[0].read_text())['configuration']
              expected=cfg['strict_inner_expert_configuration'][name]
              for key in ('epochs_ran','decode_mode','decode_mode_selected_on_locked_validation'):
                  assert actual[key]==expected[key], (name,key)
          (root/'historical-config.json').write_text(json.dumps(cfg,indent=2)+'\n')
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'file-sha256.json'}
          (root/'file-sha256.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          with zipfile.ZipFile('model/v273-preserved-original-sources.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY
          sha256sum model/v273-preserved-original-sources.zip > model/v273-preserved-original-sources.zip.sha256
      - name: Publish a source backup without Actions expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RECOVERY_TAG" \
            model/v273-preserved-original-sources.zip \
            model/v273-preserved-original-sources.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "V27.3 source recovery — run $GITHUB_RUN_ID" \
            --notes-file analysis/v273-source-rebuild.md
      - uses: actions/upload-artifact@v4
        with:
          name: v273-preserved-original-sources
          path: model/preserved-original
          compression-level: 1
          if-no-files-found: error
          retention-days: 90

  rebuild:
    name: Resume verified V8.1 and rebuild V8.4 through V8.8
    needs: preserve
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - name: Check reconstruction commands and checkpoint integrity guards
        run: python -m unittest -v test.test_v273_source_rebuild
      - uses: actions/cache/restore@v4
        id: guitarset
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download official GuitarSet if needed
        if: steps.guitarset.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - name: Verify official GuitarSet before saving its cache
        run: python -c "from scripts.rebuild_v273_sources import verify_dataset; verify_dataset('data/GuitarSet')"
      - uses: actions/cache/save@v4
        if: steps.guitarset.outputs.cache-hit != 'true'
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Reuse verified V8.1 epoch-03 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/restore_v273_rebuild_checkpoint.py \
            --config analysis/v273-rebuild-historical-config.json \
            --output-dir model/v273-rebuild
      - name: Rebuild the train-only audit with at least 30 source tracks
        run: python -B scripts/rebuild_v273_sources.py stage --stage audit --dataset-dir data/GuitarSet --output-dir model/v273-rebuild
      - name: Rebuild selected V8.4 epoch-01 control
        run: python -B scripts/rebuild_v273_sources.py stage --stage v84 --dataset-dir data/GuitarSet --output-dir model/v273-rebuild
      - name: Rebuild V8.6 proposal model
        run: python -B scripts/rebuild_v273_sources.py stage --stage v86 --dataset-dir data/GuitarSet --output-dir model/v273-rebuild
      - name: Rebuild V8.7 memory model
        run: python -B scripts/rebuild_v273_sources.py stage --stage v87 --dataset-dir data/GuitarSet --output-dir model/v273-rebuild
      - name: Rebuild V8.8 candidate scoring model
        run: python -B scripts/rebuild_v273_sources.py stage --stage v88 --dataset-dir data/GuitarSet --output-dir model/v273-rebuild
      - name: Preserve completed or partial source checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v273-rebuilt-proposal-sources
          path: model/v273-rebuild
          compression-level: 1
          if-no-files-found: warn
          retention-days: 90
      - name: Back up source checkpoints to the recovery release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f model/v273-rebuild/rebuild-state.json ]; then
            python - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('model/v273-rebuild')
          with zipfile.ZipFile('model/v273-rebuilt-proposal-sources.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY
            sha256sum model/v273-rebuilt-proposal-sources.zip > model/v273-rebuilt-proposal-sources.zip.sha256
            gh release upload "$RECOVERY_TAG" \
              model/v273-rebuilt-proposal-sources.zip model/v273-rebuilt-proposal-sources.zip.sha256 \
              --repo "$GITHUB_REPOSITORY"
          fi

  mine:
    name: Rebuild native cache shard ${{ matrix.shard }}
    needs: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: python -m pip install -r requirements-train.txt
      - uses: actions/cache@v4
        id: guitarset
        with:
          path: data/GuitarSet
          key: ${{ env.GUITARSET_CACHE_KEY }}
      - name: Download official GuitarSet if needed
        if: steps.guitarset.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 -o data/GuitarSet/annotation.zip https://zenodo.org/records/3371780/files/annotation.zip
          curl -L --fail --retry 3 -o data/GuitarSet/audio_mono-pickup_mix.zip https://zenodo.org/records/3371780/files/audio_mono-pickup_mix.zip
      - uses: actions/download-artifact@v4
        with:
          name: v273-rebuilt-proposal-sources
          path: model/rebuilt-sources
      - name: Recompute original cluster statistics and native spectral maps
        run: |
          python -B scripts/rebuild_v273_sources.py mine \
            --source-dir model/rebuilt-sources --dataset-dir data/GuitarSet \
            --shard ${{ matrix.shard }} --output-dir model/native-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: v273-rebuilt-native-${{ matrix.shard }}
          path: model/native-${{ matrix.shard }}
          compression-level: 1
          if-no-files-found: error
          retention-days: 90
      - name: Back up native inputs without Actions expiry
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          shard=os.environ['SHARD']
          root=Path('model')/('native-'+shard)
          with zipfile.ZipFile(f'model/v273-rebuilt-native-{shard}.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY
          sha256sum "model/v273-rebuilt-native-$SHARD.zip" > "model/v273-rebuilt-native-$SHARD.zip.sha256"
          gh release upload "$RECOVERY_TAG" \
            "model/v273-rebuilt-native-$SHARD.zip" "model/v273-rebuilt-native-$SHARD.zip.sha256" \
            --repo "$GITHUB_REPOSITORY"

  audit:
    name: Compare rebuilt inputs with preserved historical metadata
    needs: mine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: v273-rebuilt-native-*
          path: model/native
      - uses: actions/download-artifact@v4
        with:
          name: v273-preserved-original-sources
          path: model/original
      - name: Report scope and parity without fabricating a V27.3 score
        run: |
          python -B scripts/summarize_v273_rebuilt_cache.py \
            --cache-dir model/native \
            --archived-metadata model/original/cluster-metadata/v280-cluster-metadata.npz \
            --output-dir model/rebuild-summary
          cat model/rebuild-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v273-source-rebuild-aggregate-summary
          path: model/rebuild-summary
          if-no-files-found: error
          retention-days: 90
      - name: Preserve aggregate reconstruction status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RECOVERY_TAG" \
            model/rebuild-summary/summary.json model/rebuild-summary/summary.md \
            --repo "$GITHUB_REPOSITORY"
