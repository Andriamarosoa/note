name: S615 inspect existing real pilot reports
on:
  push:
    branches: [codex/note-live-s615-multihop-training]
    paths: ['.github/workflows/note-s615-report-existing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned completed pilot artifacts (no training replay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/s615pilot
          gh run download 38862219355 --repo Andriamarosoa/note \
            --name s615-real-guitarset-pilot-candidates --dir /tmp/s615pilot
          find /tmp/s615pilot -maxdepth 3 -name report.json
      - name: Compare DEV NoteOn and Exact-K onset groups
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          paths=sorted(Path('/tmp/s615pilot').rglob('report.json'))
          assert len(paths)==4, [(str(p)) for p in paths]
          for f in paths:
              report=json.loads(f.read_text())
              assert report['status']=='EXPERIMENTAL_DEV_ONLY_NOT_PROMOTED'
              print('===== '+report['model_mode']+' =====')
              for hop,metrics in report['dev_by_hop'].items():
                  best=metrics['best']
                  exact=metrics.get('onset_exact_k_dev')
                  print(json.dumps(dict(
                      hop=hop,
                      noteon_f1_80ms=best['scores']['F1'],
                      TP=best['scores']['TP'],
                      FP=best['scores']['FP'],
                      FN=best['scores']['FN'],
                      onset_k=exact),sort_keys=True))
          PY
