name: S703 native and residual Onset heads with preserved native labels
on:
  push:
    branches: [codex/note-s703-separate-event-heads]
    paths:
      - src/causal_note/s703_event_heads.py
      - scripts/s703_train_separate_event_heads.py
      - scripts/s703_event_targets.py
      - test/test_s703_event_targets.py
      - .github/workflows/note-s703-separate-event-heads.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: note-s703-separate-event-heads
  cancel-in-progress: false
jobs:
  event_selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: .:src
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact native dependencies
        run: python -m pip install -r requirements-live-strict.txt
      - name: Causal prefix and actual event preservation regressions
        run: |
          python -m compileall -q src/causal_note/s703_event_heads.py scripts/s703_train_separate_event_heads.py test/test_s703_event_targets.py
          python -m unittest -v test.test_s703_event_targets test.test_s702_event_selection test.test_s701_causal_onset
      - name: Retrieve existing frozen S701 and S675 checkpoints
        run: |
          mkdir -p /tmp/s703_s701 /tmp/s703_s675
          gh run download 39085408073 --repo "${{ github.repository }}" --name S701_CAUSAL_ONSET_LEARNED_TRAIN_HELD_COMPOSITION --dir /tmp/s703_s701
          gh run download 39059008484 --repo "${{ github.repository }}" --name S681_LATEST_S675_TRAINED_NOTEOFF_WINDOWS_TRIAL --dir /tmp/s703_s675
          test -s /tmp/s703_s701/s701_onset_shadow.joblib
          test -s /tmp/s703_s675/s675_hazard.joblib
          test -s /tmp/s703_s675/s675_checkpoint.json
      - name: Train event quality, freeze on CAL, check HELD and diagnostic DEV
        run: |
          python -m scripts.s703_train_separate_event_heads --out /tmp/s703 --onset-checkpoint /tmp/s703_s701/s701_onset_shadow.joblib --offset-checkpoint /tmp/s703_s675/s675_hazard.joblib
      - name: Preserve results and exact per-note regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S703_SEPARATE_NATIVE_RESIDUAL_ONSET_HEADS
          path: /tmp/s703/
          if-no-files-found: warn
          retention-days: 60
