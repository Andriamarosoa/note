name: V27.3 S33 preserve confirmed K1-K2 failure diagnostic
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series33-preserve.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Retrieve original acoustic diagnostic of all 26 changed cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37866555589 --repo "$GITHUB_REPOSITORY" --name v273-series33-regression-features --dir model/S33
      - name: Check all 26 source cases and exact four losses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('model/S33')
          z=json.loads((p/'report.json').read_text())
          assert z['counts']=={'corrected':17,'neutral':5,'regressed':4}
          assert len(z['nearest_corrected_event_per_regression'])==4
          assert len(z['row_audit'])==26
          assert sum(q['true_K']==2 and q['S18_K']==2 and q['S29_K']==1
                     for q in z['row_audit'] if q['category']=='regressed')==3
          print('PASS: confirmed 14 correct K2->K1 and 3 harmful K2->K1, complete provenance')
          PY
      - name: Permanently store all observations and per-event acoustic relatives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/archive
          tar -czf model/archive/v273-series33-research.tar.gz -C model/S33 .
          (cd model/archive && sha256sum v273-series33-research.tar.gz > SHA256SUMS)
          gh release create "v273-series33-research-${GITHUB_RUN_ID}" \
            model/archive/v273-series33-research.tar.gz model/archive/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V27.3 S33 four regression root-cause audit ${GITHUB_RUN_ID}" \
            --notes "Four exact regression events: three true K2 incorrectly reduced K1 and one true K1 incorrectly increased K2, 17 fixes and five neutrals, acoustic grouping and nearest correct examples, no inferred general causal musical law."
