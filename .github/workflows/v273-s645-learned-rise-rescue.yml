name: S645 original trained acoustic q rise after prior six hops
on:
  push:
    branches: [codex/s644-audit-rescue-gates]
    paths:
      - scripts/s645_causal_score_rise_loop.py
      - test/test_s645_causal_score_rise_loop.py
      - .github/workflows/v273-s645-learned-rise-rescue.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s645-score-rise-locked
  cancel-in-progress: false
jobs:
  causal_train_then_dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Original NOTE inference environment
        run: python -m pip install -r requirements-live-strict.txt
      - uses: actions/download-artifact@v4
        with:
          name: S642-real-trained-dual-candidate-delay-original-DEV
          run-id: 38815758881
          github-token: ${{ github.token }}
          path: /tmp/S642
      - name: Test causal score rise and independent TRAIN selection
        run: |
          python -m compileall -q scripts/s645_causal_score_rise_loop.py
          python -m unittest -v test.test_s645_causal_score_rise_loop test.test_s644_gate_rescue_loop test.test_strict_live
      - name: Replay original audio from 35 TRAIN then independently evaluate 17 DEV
        run: |
          python -u -m scripts.s645_causal_score_rise_loop \
            --candidate /tmp/S642/S642_weak_attack_train_only.joblib \
            --out /tmp/S645
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S645-genuine-trained-acoustic-score-rise-gating-sweep
          path: /tmp/S645/
          if-no-files-found: warn
          retention-days: 60
