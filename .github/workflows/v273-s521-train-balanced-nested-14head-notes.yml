name: S521 imbalance-adjusted trained S509 fourteen-head attention on nested S516 raw generator, no new ground truth leakage
on:
  push:
    branches: [codex/s521-balanced-14head-audio-note-attention]
    paths:
      - scripts/s521_sqrt_balanced_nested_S509_S516_14head_attention.py
      - .github/workflows/v273-s521-train-balanced-nested-14head-notes.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s521-balanced-14head-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eight_original_groupheld_neural_models_with_inner_six_source_generator_crossfit:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original S509 genuine neural attention and S516 pitch-note model
        run: python -m pip install numpy==1.26.4 tensorflow==2.14.1 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2
      - name: Verify S521 same fourteen heads and source-stable evidence ABI
        run: |
          python -m py_compile scripts/s521_sqrt_balanced_nested_S509_S516_14head_attention.py
          python -m scripts.s521_sqrt_balanced_nested_S509_S516_14head_attention --self-test
      - name: Restore genuine WAV original S515 features frozen before any real MIDI annotations
        run: |
          gh run download 38610350820 \
            -n s515-8-source-raw-waveform-49-note-multilabel-onset-harmonic-feature-heads-PREMIDI \
            -D model/S515 --repo "${{ github.repository }}"
      - name: Restore true named note source S505 for train-only supervision of each separate recording
        run: |
          gh run download 38596480284 \
            -n s505-real-8-recording-held-S80-guitar-V88-piano-neural-note-heads-train-table \
            -D model/S505 --repo "${{ github.repository }}"
      - name: Train 8 real neural 14-head attention and 8 train-only nested raw generators with stronger note-positive balancing
        run: |
          python -u -m scripts.s521_sqrt_balanced_nested_S509_S516_14head_attention \
            --acoustic model/S515/S515_TWO_INSTRUMENT_49_PITCH_REAL_AUDIO_FEATURES_PREMIDI.jsonl \
            --acoustic-report model/S515/report.json \
            --heads model/S505/S505_REAL_NOTE_HEADS_EIGHT_RECORDINGS_MATCHED_POSITIVES.npz \
            --head-report model/S505/report.json --out model/S521
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('model/S521/report.json'))
          assert r['status']=='S521_NESTED_S516_RAW_GENERATOR_INSIDE_S509_14HEAD_NEURAL_SELECTOR'
          assert r['real_new_generator_14th_head_in_S509_attention']
          assert r['inner_training_generator_OOF_crossfit_excludes_outer_held_recording']
          assert r['eight_separate_22epoch_S509_14head_attention_models_trained']
          assert r['hyperparameters']['neural_positive_weight_cap']==12.
          assert r['true_note_labels_never_used_in_outer_held_inference']
          assert r['no_promotion']
          assert len(r['folds'])==8
          assert len(list(Path('model/S521').glob('*.weights.h5')))==8
          assert len(list(Path('model/S521').glob('*.joblib')))==8
          print('S521 trained eight class-imbalanced nested 14-head models; all reference/live safeguards hold')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s521-class-balanced-8-recording-held-14head-S509-S516-real-audio-neural-note-generator
          path: model/S521/
          retention-days: 90
