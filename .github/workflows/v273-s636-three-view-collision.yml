name: S636 causal duplicates and octave risk from live 3-view mic
on:
  push:
    branches: [codex/s636-three-view-collision-audit]
    paths:
      - scripts/s635_three_view_mic.py
      - scripts/s636_three_view_collision.py
      - test/test_s635_three_view_mic.py
      - test/test_s636_three_view_collision.py
      - .github/workflows/v273-s636-three-view-collision.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: s636-collisions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit_offline_and_causal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-live-strict.txt
      - name: Audit real frozen NOTE three-view microphone and strictly causal collision counter
        run: |
          python -m compileall -q scripts/s635_three_view_mic.py scripts/s636_three_view_collision.py test/test_s636_three_view_collision.py
          python -m scripts.s636_three_view_collision --help
          python -m unittest -v test.test_s636_three_view_collision test.test_s635_three_view_mic test.test_s634_three_view_pitch
