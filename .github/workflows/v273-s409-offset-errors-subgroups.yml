name: S409 frozen S408 real NOTE OFFSET errors by K, string, duration
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s409_audit_S408_note_offset_errors_by_duration_and_K.py'
      - '.github/workflows/v273-s409-offset-errors-subgroups.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s409-offset-frozen-failure-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_output_scoring_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
      - name: Verify offset error accounting
        run: |
          python -m py_compile scripts/s409_audit_S408_note_offset_errors_by_duration_and_K.py
          python -u -m scripts.s409_audit_S408_note_offset_errors_by_duration_and_K --self-test
      - name: Restore completely frozen song-held S408 note onset pitch offset outputs
        run: |
          gh run download 38371603686 -n s408-real-note-offsets-pitch-conditioned-S80-S402-S407-songheld-NOPROMOTION -D model/S408 --repo ${{ github.repository }}
          test -f model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz
      - name: Download verified source GuitarSet durations for SCORING ONLY
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 2 -o data/GuitarSet/annotation.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/annotation.zip
          echo "b39b78e63d3446f2e54ddb7a54df9b10  data/GuitarSet/annotation.zip" | md5sum -c -
      - name: Audit true one-to-one matched offset correctness by K, duration and register
        run: |
          python -u -m scripts.s409_audit_S408_note_offset_errors_by_duration_and_K \
            --source model/S408/S408_K_CONDITIONED_NOTE_OFFSET_SONGHELD_33475.npz \
            --annotations data/GuitarSet/annotation.zip \
            --out model/S409
          python - <<'PY'
          import json
          a=json.load(open('model/S409/report.json'))
          assert a['status']=='S409_S408_OFFSET_REGRESSION_CAUSE_AUDIT_FROZEN'
          assert a['original_S408_results_reproduced'] and a['no_model_fit_no_threshold_change']
          assert a['matched_pitch_onset']==25120
          assert sum(s['n'] for s in a['groups']['by_predicted_K'].values())==25120
          assert sum(s['n'] for s in a['groups']['by_original_duration'].values())==25120
          print('S409 subgroup audit VERIFIED without altering S80 S402 S407 S408')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s409-frozen-real-GuitarSet-note-offset-errors-by-K-duration-string-octave
          path: model/S409/
          retention-days: 90
