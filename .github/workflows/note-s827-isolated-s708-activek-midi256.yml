name: S827 restore five frozen axes and replay ORIGINAL S708 private ActiveK every 256
on:
  push:
    branches: [codex/note-s827-isolated-s708-activek-midi256]
    paths:
      - src/causal_note/s827_s708_activek_only.py
      - scripts/s827_verify_private_activek_midi256.py
      - test/test_s827_s708_activek_only.py
      - series/S827/resume.md
      - series/S827/resultat.md
      - .github/workflows/note-s827-isolated-s708-activek-midi256.yml
  workflow_dispatch:
concurrency:
  group: s827-only-activek-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read, actions: read}
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  strict_isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Same locked dependencies as original S708
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Prove no modification to S708/S712/Joint or any of the other five axis paths
        run: |
          git fetch origin codex/note-s825-private-crossfit-pitch-midi256 --depth=1
          git diff --name-only FETCH_HEAD HEAD | tee /tmp/s827_changed_paths.txt
          python - <<'PY'
          from pathlib import Path
          names=Path('/tmp/s827_changed_paths.txt').read_text().splitlines()
          authorized={'src/causal_note/s827_s708_activek_only.py',
                      'scripts/s827_verify_private_activek_midi256.py',
                      'test/test_s827_s708_activek_only.py',
                      'series/S827/resume.md','series/S827/resultat.md',
                      '.github/workflows/note-s827-isolated-s708-activek-midi256.yml'}
          assert set(names)<=authorized,(set(names)-authorized)
          assert len(names)>0
          print('S827_PUBLIC_FIVE_AXIS_CODE_FROZEN_AND_IDENTICAL')
          PY
      - name: Exact S708 original decoder differential parity, private neural true 256, and five unchanged H0
        run: |
          python -m compileall -q src/causal_note/s827_s708_activek_only.py scripts/s827_verify_private_activek_midi256.py test/test_s827_s708_activek_only.py
          python -m unittest -v test.test_s827_s708_activek_only test.test_s812_historical_axis_h0 test.test_s708_cardinality_selection test.test_s712_s708_live test.test_s705_temporal_heads
          python -m scripts.verify_series_reports --series S827
  signed_real_five:
    runs-on: ubuntu-24.04
    needs: strict_isolation
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Requirements and CPU S708 torch checkpoint
        run: |
          python -m pip install -r requirements-live-strict.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download signed source S708 checkpoint, S800 original GT and SHADOW S826 parity baseline
        run: |
          mkdir -p /tmp/s827/s708 /tmp/s827/manifest /tmp/s827/traces /tmp/s827/s826_reference
          gh run download 39094682419 --repo Andriamarosoa/note --name S708_K_GUIDED_S706_JOINT_CAUSAL_LOOPS --dir /tmp/s827/s708
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_PARITY_AND_MANIFEST --dir /tmp/s827/manifest
          gh run download 39352880035 --repo Andriamarosoa/note --name S800_FIT80_FIVE_HEAD_FULL_OOF_TRACES --dir /tmp/s827/traces
          gh run download 39594749768 --repo Andriamarosoa/note --name S826_S708_FULL_NEURAL_GUIDED_MIDI256_VS_LEGACY1024_SHA --dir /tmp/s827/s826_reference
          MODEL="$(find /tmp/s827/s708 -name s708_selected.pt -type f -print -quit)"
          META="$(find /tmp/s827/manifest -name report.json -type f -print -quit)"
          FIT="$(find /tmp/s827/traces -name fit_000.json -type f -print -quit)"
          S826="$(find /tmp/s827/s826_reference -name fit_000_strict256.json -type f -print -quit)"
          test -s "$MODEL"
          test -s "$(dirname "$MODEL")/report.json"
          test -s "$META"
          test -s "$FIT"
          test -s "$S826"
          printf '%s\n' "$(dirname "$MODEL")" > /tmp/s827/s708_dir
          printf '%s\n' "$META" > /tmp/s827/manifest_path
          printf '%s\n' "$(dirname "$FIT")" > /tmp/s827/traces_dir
          printf '%s\n' "$(dirname "$S826")" > /tmp/s827/s826_dir
      - name: SHA-256 pinned authentic original GuitarSet 44.1kHz acoustic mic WAV
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          cfg=json.loads(Path('analysis/evidence/v273-s613-strict-live/protocol.json').read_text())
          item=cfg['guitar_archives']['GuitarSet_audio']
          dst=Path('/tmp/s827/GuitarSet_audio.zip')
          with urllib.request.urlopen(item['url'],timeout=180) as src,dst.open('wb') as dst_file:
              for chunk in iter(lambda:src.read(4*1024*1024),b''):
                  dst_file.write(chunk)
          assert dst.stat().st_size==item['size']
          h=hashlib.sha256()
          with dst.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024),b''):h.update(block)
          assert h.hexdigest()==item['sha256']
          print('S827_SOURCE_GUITARSET_SHA_256_VALIDATED')
          PY
      - name: Original S708 neural FULL 288D every PCM256 feeding PRIVATE Active-K alone
        run: |
          python -m scripts.s827_verify_private_activek_midi256 --audio-zip /tmp/s827/GuitarSet_audio.zip --traces "$(cat /tmp/s827/traces_dir)" --manifest-path "$(cat /tmp/s827/manifest_path)" --source-checkpoint "$(cat /tmp/s827/s708_dir)/s708_selected.pt" --source-report "$(cat /tmp/s827/s708_dir)/report.json" --native-model model/live/strict_note/NOTE_strict_live.npz --s826-events "$(cat /tmp/s827/s826_dir)" --out /tmp/s827/result --tracks-per-composition 1
      - name: Scientific contract — 5 sources, private count == genuine S826 neural counts, H0 MIDI sealed
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/s827/result/report.json'))
          assert r['completed'] and len(r['rows'])==5
          assert r['inference_decision_hop_samples']==r['inference_feature_hop_samples']==256
          assert r['private_output_axis']=='active_exact_k'
          assert r['GT_not_provided_to_inference'] and r['other_axes_frozen']
          assert not r['production_midi_modified'] and not r['S826_shared_pipeline_merged']
          assert not r['trained_at_native256'] and not r['promoted']
          assert r['added_future_samples']==r['added_hold_samples']==0
          assert all(z['exact_S826_activek_parity'] and z['other_axes_source_signature_preserved'] for z in r['rows'])
          print('S827_FIVE_OTHER_AXES_IDENTICAL_NATIVE256_PRIVATE_S708_ONLY')
          print('S827_PILOT_ACTIVEK',json.dumps(r['total_private_activek']))
          PY
      - name: Upload actual signed proof, do not promote experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S827_REAL_PRIVATE_S708_ACTIVEK_ONLY_256_H0_PRESERVED
          path: /tmp/s827/result/report.json
          if-no-files-found: warn
          retention-days: 45
