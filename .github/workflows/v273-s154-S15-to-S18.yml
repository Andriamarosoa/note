name: S154 original S13-S18 trained chain on GOAT with only upstream S9 adapted
on:
  push:
    branches: [codex/v273-scope-rescue]
    paths:
      - 'scripts/s154_source_s15_s18_GOAT.py'
      - '.github/workflows/v273-s154-S15-to-S18.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s154-original-S15-S18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original_history_chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.s154_source_s15_s18_GOAT --self-test
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37855705158
          name: v273-series16-k12-k23
          path: model/S16
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856164138
          name: v273-series17-k32-k34
          path: model/S17
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37856499212
          name: v273-series18-k43-k21
          path: model/S18
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195528700
          name: v273-s153-original-trained-S13-S14-S15-safe-union-newGOAT-adaptedS9
          path: model/S15
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38195310657
          name: v273-s152-original-trained-S16-S17-S18-cascade-newGOAT-adaptedS11
          path: model/S152
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38182078525
          name: v273-s97-original-goat-s45-audio-features
          path: model/S97
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38176406465
          name: v273-s85-original-pr16-external-policies
          path: model/S85
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38190945241
          name: v273-s135-K-anchored-S5-student-soft-posteriors
          path: model/S135
      - name: Original S15 union -> S16 -> S17 -> S18 weights and selected policies, no MIDI
        run: |
          set -euo pipefail
          S97="$(find model/S97 -name original_s45_audio_only.npz -print -quit)"
          S85="$(find model/S85 -name pr16_external_36_policies.npz -print -quit)"
          S135="$(find model/S135 -name GOAT_57_label_blind_soft_Kanchored.npz -print -quit)"
          S15="$(find model/S15 -name original_S13_S14_S15_saved_models_GOAT_adapter.npz -print -quit)"
          S152="$(find model/S152 -name S11_to_S18_adapted_original_checkpoint_cascade_GOAT.npz -print -quit)"
          test -s "$S97" && test -s "$S85" && test -s "$S135" && test -s "$S15" && test -s "$S152"
          python -u -m scripts.s154_source_s15_s18_GOAT \
            --s97 "$S97" --s85 "$S85" --s135 "$S135" \
            --s15 "$S15" --s16 model/S16 --s17 model/S17 \
            --s18 model/S18 --s152 "$S152" --out model/S154
          python - <<'PY'
          import json,numpy as np
          r=json.load(open('model/S154/report.json'))
          assert r['GOAT_new_audio_groups']==57
          assert r['genuine_original_checkpoint_count_S16_to_S18']==444
          assert r['original_S13_S14_K0_chain_connected']
          assert r['original_S15_S16_S17_S18_source_policy_names_applied']
          assert not r['authentic_historical_S80_equivalence']
          assert not r['MIDI_truth_read'] and not r['promotion']
          with np.load('model/S154/original_S15_to_S18_trained_GOAT_adapted_S9.npz',allow_pickle=False) as z:
              assert len(z['S18_K'])==57
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-s154-original-S13-S14-S15-S16-S17-S18-checkpoint-cascade-GOAT
          path: model/S154/
          retention-days: 90
