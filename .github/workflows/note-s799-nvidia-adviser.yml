name: S799 GLM 5.3 NVIDIA independent adviser
on:
  push:
    branches: [codex/note-s799-nvidia-kimi-k25-adviser]
    paths:
      - scripts/s799_nvidia_adviser.py
      - test/test_s799_nvidia_adviser.py
      - scripts/s799_six_role_audits.py
      - .github/workflows/note-s799-nvidia-adviser.yml
      - series/S799/resume.md
      - series/S799/resultat.md
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:src
  PYTHONUNBUFFERED: '1'
jobs:
  safe_unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and run provider tests with a MOCK response
        run: |
          python -m compileall -q scripts/s799_nvidia_adviser.py scripts/s799_six_role_audits.py test/test_s799_nvidia_adviser.py
          python -m unittest -v test.test_s799_nvidia_adviser
          python -m scripts.verify_series_reports --series S799
  six_audits:
    needs: safe_unit_tests
    name: S799 independent ${{ matrix.role }} audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        role: [data, acoustics, architecture, training, metrics, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run deterministic independent S799 reviewer-safety audit
        run: |
          python -m scripts.s799_six_role_audits \
            --role ${{ matrix.role }} \
            --adviser scripts/s799_nvidia_adviser.py \
            --workflow .github/workflows/note-s799-nvidia-adviser.yml \
            --tests test/test_s799_nvidia_adviser.py \
            --out /tmp/s799/audits/role_${{ matrix.role }}.json
      - name: Archive independent role
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S799_AUDIT_${{ matrix.role }}
          path: /tmp/s799/audits/role_${{ matrix.role }}.json
          retention-days: 45
          if-no-files-found: warn
  consensus:
    if: always()
    needs: [safe_unit_tests, six_audits]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: S799_AUDIT_*
          path: /tmp/s799/audits
          merge-multiple: true
      - name: Require six actual PASS role artifacts
        run: |
          python -m scripts.s787_audit_consensus \
            --reports-dir /tmp/s799/audits \
            --out /tmp/s799/consensus/report.json
      - name: Archive fail-closed verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S799_SIX_AUDIT_CONSENSUS
          path: |
            /tmp/s799/consensus/report.json
            /tmp/s799/audits/role_*.json
          retention-days: 45
          if-no-files-found: warn

  kimi_external_opinion:
    name: S799 NVIDIA seventh independent opinion (opt-in)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-nvidia-once]'))
    needs: [safe_unit_tests, six_audits, consensus]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Call Kimi only with rotated GitHub Actions secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "NVIDIA_API_KEY secret missing; skip consultation, NOT a passing advice audit"; exit 1; }
          python -m scripts.s799_nvidia_adviser --out /tmp/s799/external/kimi_review.json
      - name: Archive NON-BINDING seventh opinion
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S799_SEVENTH_OPINION_KIMI_NOT_PROMOTION
          path: /tmp/s799/external/kimi_review.json
          retention-days: 30
          if-no-files-found: error
