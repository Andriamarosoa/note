name: Cancel superseded V27.3 run

on:
  push:
    branches: [v273-selective-transition-corrector]
    paths:
      - '.github/workflows/v273-cancel-superseded.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only superseded run 34293193376
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 34293193376;
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
            });
            if (run.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
              });
              core.info(`cancel requested for superseded run ${run_id}`);
            } else {
              core.info(`superseded run ${run_id} already completed as ${run.conclusion}`);
            }
