name: S602-S605 frozen candidate gate on five reserved URMP compositions
'on':
  push:
    branches:
      - codex/s533-s535-note-fundamental-loops
    paths:
      - analysis/v273_s602_selected_candidate_freeze.json
      - .github/workflows/v273-s602-s605-reserved-candidate-gate.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: s602-s605-reserved-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:src
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  TF_CPP_MIN_LOG_LEVEL: '3'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
jobs:
  audio_freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact numerical and pretrained inference versions
        run: |
          python -m pip install setuptools==80.10.2 numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3 tensorflow==2.14.1 basic-pitch==0.4.0 librosa==0.11.0
      - name: All five reserved audio sources; NO annotation or fitting
        run: python -m scripts.s602_s605_reserved_urmp freeze
      - uses: actions/upload-artifact@v4
        with:
          name: s604-five-reserved-compositions-PREDICTIONS-BEFORE-ANNOTATIONS
          path: model/S604/
          retention-days: 90
          if-no-files-found: error
  first_score:
    needs: audio_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed scoring and independent matching implementation
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 mido==1.3.3
      - uses: actions/download-artifact@v4
        with:
          name: s604-five-reserved-compositions-PREDICTIONS-BEFORE-ANNOTATIONS
          path: model/S604/
      - name: First reserved annotations; all five pieces and all FP/FN
        run: python -m scripts.s602_s605_reserved_urmp score
      - uses: actions/upload-artifact@v4
        with:
          name: s605-FIRST-reserved-composition-test-ALL-FP-FN
          path: model/S605/
          retention-days: 90
          if-no-files-found: error
