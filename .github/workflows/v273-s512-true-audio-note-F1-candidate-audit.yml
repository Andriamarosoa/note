name: S512 independently score new raw harmonic pitch proposals vs true original IDMT notes
on:
  push:
    branches: [codex/s511-raw-harmonic-note-generator]
    paths:
      - scripts/s512_audit_original_audio_harmonic_candidate_note_recall_vs_XML.py
      - .github/workflows/v273-s512-true-audio-note-F1-candidate-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  score_all_real_45_original_IDMT_true_note_attacks_pitches_without_source_promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install minimal true note F1 and one-to-one onset scorer
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Verify objective notes metric and one-to-one true attack audit
        run: |
          python -m py_compile scripts/s512_audit_original_audio_harmonic_candidate_note_recall_vs_XML.py
          python -m scripts.s512_audit_original_audio_harmonic_candidate_note_recall_vs_XML --self-test
      - name: Restore S511 physically generated SOURCE WAV pitches, immutable before any ground truth
        run: |
          gh run download 38608701998 \
            -n s511-5-real-IDMT-guitar-raw-harmonic-physical-onset-top6-top12-NOXML \
            -D model/S511 --repo "${{ github.repository }}"
      - name: Restore original held XML true notes ONLY AFTER generator frozen
        run: |
          gh run download 38570219836 \
            -n s488-original-IDMT-45-true-guitar-21-poly-BasicPitch-note-set-vs-S80-ExactK \
            -D model/S488 --repo "${{ github.repository }}"
      - name: Restore original pretrained BP note events for same genuine guitar audio baseline
        run: |
          gh run download 38569589535 \
            -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML \
            -D model/S487 --repo "${{ github.repository }}"
      - name: Score 45 true attacks by 80ms one-to-one matching, genuine raw note F1, oracle missed notes and every regression
        run: |
          python -u -m scripts.s512_audit_original_audio_harmonic_candidate_note_recall_vs_XML \
            --generator model/S511/S511_RAW_HARMONIC_FUNDAMENTAL_ONSET_TOP6_TOP12_PRETRUTH.jsonl \
            --generator-report model/S511/report.json \
            --guitar model/S488/S488_45_TRUE_GUITAR_SOURCE_NOTESETS_PAIRED.jsonl \
            --guitar-report model/S488/report.json \
            --bp model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --bp-report model/S487/report.json --out model/S512
          python - <<'PY'
          import json
          z=json.load(open('model/S512/report.json'))
          assert z['status']=='S512_FROZEN_RAW_GUITAR_NOTE_CANDIDATE_VS_ORIGINAL_XML_AUDIT'
          assert z['all_45_original_real_attack_denominator_preserved']
          assert z['true_pitch_oracle_upper_bound_not_an_inference_score']
          assert z['note_precision_F1_are_CONDITIONAL_on_known_positive_attacks']
          assert z['no_threshold_policy_selected_on_this_XML']
          assert z['official_S80_exactK_and_Live_unchanged'] and z['no_promotion']
          print('S512 genuine note F1 and full-note set exactness, including gains/regressions, no promotion')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s512-true-IDMT-guitar-note-pitch-F1-H13-raw-harmonic-oracle-vs-BP-regr
          path: model/S512/
          retention-days: 90
