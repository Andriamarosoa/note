name: S437 real 12-composition GuitarSet WAV note names K-balanced no labels
on:
  push:
    branches: [codex/s276-idmt-song-disjoint-candidate-audit]
    paths:
      - 'scripts/s437_real_mic_balanced_K_note_names_12pieces.py'
      - '.github/workflows/v273-s437-balanced-12-real-guitar-WAV-note-names.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s437-balanced-real-12-mic-guitars-${{ github.ref }}
  cancel-in-progress: true
jobs:
  predict_real_guitar_without_annotations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original acoustic plus ML/torch dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Verify no-label K-balanced sampling selftest
        run: |
          python -m py_compile scripts/s437_real_mic_balanced_K_note_names_12pieces.py
          python -u -m scripts.s437_real_mic_balanced_K_note_names_12pieces --self-test
      - name: Restore frozen 59,309 original S80 and true source event IDs
        run: |
          gh run download 38311525987 -n s258-full-guitarset-59309-real-original-native-527D-58D-46D-42x49-and-OOF-PR16 -D model/S258 --repo ${{ github.repository }}
          gh run download 38352988801 -n s397-s398-S70-suppression-REAL-full-S80-replay-and-scoring-NOPROMOTION -D model/S397 --repo ${{ github.repository }}
      - name: Restore fixed native guitar pitch recognition models
        run: |
          gh run download 38361853607 -n s402-K-fed-to-MIDI-neural-input-composition-disjoint-4fold-DEVELOPMENT-NOPROMOTION -D model/S402 --repo ${{ github.repository }}
          gh run download 38381449092 -n s416-native-CNN-time-pitch-note-head-songheld-S80-ExactK-LOCKED-NO-YourMT -D model/S416 --repo ${{ github.repository }}
          gh run download 38383639848 -n s419-native-K-gated-MIDI-head-songheld-S402-S416-no-ExactK-regression -D model/S419 --repo ${{ github.repository }}
          gh run download 38517551029 -n s428-acoustic-harmonic-direct-note-names-S80-ExactK-LOCKED-S419-pair -D model/S428 --repo ${{ github.repository }}
      - name: Fetch full ORIGINAL real guitar MIC recording collection MD5 verified (no note annotation)
        run: |
          mkdir -p data/GuitarSet
          curl -L --fail --retry 3 --retry-delay 4 -o data/GuitarSet/audio_mono-mic.zip https://huggingface.co/datasets/EZMONYI/music-ai-human-test-audio/resolve/main/external_controls/guitarset_source_v1/audio_mono-mic.zip
          echo '275966d6610ac34999b58426beb119c3  data/GuitarSet/audio_mono-mic.zip' | md5sum -c -
      - name: Freeze predicted K-balanced authentic guitar note names BEFORE labels are opened elsewhere
        run: |
          python -u -m scripts.s437_real_mic_balanced_K_note_names_12pieces \
            --audio-zip data/GuitarSet/audio_mono-mic.zip \
            --source-events model/S258/S258_GuitarSet_59309_original_V88_S97_audio.npz \
            --s80-npz model/S397/S397/S397_S272_FULL_REPLAY/S272_full_original_S80_unseen_GUITARSET_59309_frozen.npz \
            --s402-models model/S402 --s416-models model/S416 --s428-models model/S428 \
            --s419-report model/S419/report.json --s428-report model/S428/report.json \
            --out model/S437
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('model/S437/report.json'))
          assert x['status']=='S437_FROZEN_MULTI_GUITAR_REAL_MIC_WAV_S80_SOURCE_NOTE_NAMES'
          assert x['number_distinct_original_compositions']==12
          assert x['sampled_number_audio_events']>=100
          assert x['original_K_conserved_in_note_name_JSONL']
          assert x['selection_from_hash_song_name_and_predicted_K_only']
          assert x['true_K_labels_and_JAMS_NEVER_loaded_for_sampling_or_inference']
          assert x['source_MIC_different_from_S258_pickup_mix'] and x['no_new_score_claim']
          assert x['original_S80_GuitarSet_historically_exposed'] and not x['official_promotion']
          rows=[json.loads(s) for s in Path('model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl').read_text().splitlines()]
          assert len(rows)==x['sampled_number_audio_events']
          assert sum(len(z['notes']) for z in rows)==x['sampled_sum_original_K']
          print('S437 FROZEN: 12 original compositions, WAV->note names, zero S80 K changes, no labels')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s437-twelve-real-guitar-MIC-K-balanced-frozen-note-names-no-truth
          path: |
            model/S437/report.json
            model/S437/S437_FROZEN_REAL_GUITAR_MIC_EVENT_NOTE_NAMES.jsonl
          retention-days: 90
