name: V27.3 S41 learnable six-head acoustic arbitration without H9
on:
  push:
    branches: [codex/v273-open-k0-k6]
    paths:
      - '.github/workflows/v273-series41-neural-fusion.yml'
      - 'scripts/train_v273_s41_neural_fusion.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched scientific packages and actual torch network
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.4.2 joblib==1.4.2 threadpoolctl==3.5.0
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit test six neural route heads including KEEP and no H9
        run: python -m scripts.train_v273_s41_neural_fusion --self-test
      - name: Recover unmodified original acoustic folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model/native
          gh release download v273-open-k0-k6-37837235723 --repo "$GITHUB_REPOSITORY" --pattern 'v273-open-features-*.tar' --dir model/native
          for fold in 0 1 2 4; do
            mkdir -p "model/features/fold-$fold"
            tar -xf "model/native/v273-open-features-$fold.tar" -C "model/features/fold-$fold"
          done
      - name: Fetch reference S18 and four S38 and one S40 neural expert held-fold posteriors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37856499212 --repo "$GITHUB_REPOSITORY" --name v273-series18-k43-k21 --dir model/S18
          gh run download 37880386031 --repo "$GITHUB_REPOSITORY" --name v273-series38-poly-harmonic-expert --dir model/S38
          gh run download 37880762289 --repo "$GITHUB_REPOSITORY" --name v273-series40-temporal-cnn --dir model/S40
      - name: Fit six-action supervised neural arbiters on other pieces within each held fold
        run: >-
          python -m scripts.train_v273_s41_neural_fusion
          --features model/features
          --s18 model/S18/predictions.npz
          --s38 model/S38/new_expert_probs.npz
          --s40 model/S40/temporal_probs.npz
          --output model/S41
      - name: Publish true poly exact K0 K6 and corrected regressed action uses
        run: cat model/S41/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v273-series41-six-head-neural-fusion
          path: model/S41/
          retention-days: 90
