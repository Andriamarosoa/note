name: S653 exact per-note corrections and regressions audited inside live candidate loops
on:
  push:
    branches: [codex/s651-audit-inside-loops]
    paths:
      - scripts/s653_real_event_loop_audit.py
      - src/causal_note/s652_event_round_audit.py
      - .github/workflows/v273-s653-real-audio-event-loop.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: s653-real-audio-source-audit
  cancel-in-progress: false
jobs:
  replay_original_checkpoint_17_dev_audio_without_training:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      PYTHONPATH: .:src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original NOTE and SciPy causal matching
        run: python -m pip install -r requirements-live-strict.txt
      - uses: actions/download-artifact@v4
        with:
          name: S648-trained-event-birth-FIT-CALIB-DEV-model-report
          run-id: 38821104076
          github-token: ${{ github.token }}
          path: /tmp/S648
      - name: Verify invariant exact note-by-note matcher before authentic loop
        run: |
          python -m unittest -v test.test_s652_event_round_audit test.test_s651_audit_inside_loops
          python -m compileall -q scripts/s653_real_event_loop_audit.py
      - name: Re-evaluate every unchanged GuitarSet and URMP original DEV source with per-event ledger after each candidate
        run: |
          python -u -m scripts.s653_real_event_loop_audit \
            --checkpoint /tmp/S648/S648_birth_event_fit_train_only.joblib \
            --s648-report /tmp/S648/report.json \
            --out /tmp/S653/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S653-true-event-K-register-guitarset-urmp-regression-audits
          path: /tmp/S653/
          if-no-files-found: warn
          retention-days: 60
