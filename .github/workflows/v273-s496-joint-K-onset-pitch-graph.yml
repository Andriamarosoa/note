name: S496 original Exact-K plus pitch birth joint graph without external truth
on:
  push:
    branches: [codex/s496-joint-onset-K-pitch-graph]
    paths:
      - scripts/s496_joint_onset_note_graph_frozen_no_labels.py
      - .github/workflows/v273-s496-joint-K-onset-pitch-graph.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s496-joint-exactK-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph_synthetic_invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install graph matching library
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Validate birth graph constraints, Knew/Kactive, source K priors and ambiguity
        run: |
          python -m py_compile scripts/s496_joint_onset_note_graph_frozen_no_labels.py
          python -m scripts.s496_joint_onset_note_graph_frozen_no_labels --self-test
  source_two_true_audio_freeze:
    needs: graph_synthetic_invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - name: Install original graph-only numeric ABI
        run: python -m pip install numpy==1.26.4 scipy==1.14.1
      - name: Restore original S491 full trained S80 source guitar and V88 piano evidence
        run: |
          gh run download 38576329909 -n s491-true-guitar-S80-and-piano-V88-K0only-BasicPitch-one-to-one-frozen-NOXML -D model/S491 --repo "${{ github.repository }}"
      - name: Restore independently trained model guitar and piano pitch events from before labels
        run: |
          gh run download 38569589535 -n s487-original-five-IDMT-real-guitar-pretrained-BasicPitch-note-names-PREXML -D model/S487 --repo "${{ github.repository }}"
          gh run download 38568724837 -n s485-spotify-basicpitch-3-original-MAESTRO-piano-audio-to-notes-frozen-PREMIDI -D model/S485 --repo "${{ github.repository }}"
      - name: Freeze graph attachment and prospective joint count suggestions without XML or MIDI
        run: |
          python -u -m scripts.s496_joint_onset_note_graph_frozen_no_labels \
            --s491 model/S491 --s491report model/S491/report.json \
            --s487 model/S487/S487_BASIC_PITCH_FIVE_TRUE_IDMT_GUITAR_PREXML_NOTES.jsonl \
            --s487report model/S487/report.json \
            --s485 model/S485/S485_FIXED_BASIC_PITCH_PRETRAINED_PIANO_NOTES_PRELABEL.jsonl \
            --s485report model/S485/report.json \
            --out model/S496
          python - <<'PY'
          import numpy as np,json
          d=json.load(open('model/S496/report.json'))
          assert d['status']=='S496_TWO_SOURCE_JOINT_GRAPH_K_ONSET_PITCH_SHADOW_PRELABEL'
          assert d['all_BP_pitch_birth_groups_unique_owner']
          assert d['K_new_and_K_active_reported_separately']
          assert d['true_note_annotations_not_read_in_S496']
          assert d['experimental_not_live_not_promoted']
          assert d['no_promotion']
          for source in ('guitar_S80','piano_V88'):
            a=np.load('model/S496/S496_'+source+'_JOINT_SHADOW_FROZEN.npz')
            old=a['source_K']
            assert np.array_equal(old[old>0],a['guarded_sourceK'][old>0])
          print('S496 read-only original S80/V88 graph with annotation withheld')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s496-joint-temporal-unique-note-owner-original-S80-guitar-V88-piano-no-annotations
          path: model/S496/
          retention-days: 90
